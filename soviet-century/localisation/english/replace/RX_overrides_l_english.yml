l_english:
 pence.105.t:0 "A New Empire"
 pence.105.o1:0 "God Emperor Pence Rises"
 pence.105.d:0 "“Life, Piety, Holiness” “Those were the words spoken by the newly crowned Emperor Michael Pence I of the Holy American Empire during his coronation today at St Patrick’s Cathedral in New York. This coronation is expected to be followed by a quick and swift consolidation of power by Pence and his base in which the American people are expected to see many changes in their daily life.” “Pence, once a member of the White Phoenix terrorist group recently led a campaign across the former American States in a successful attempt to reunite the broken country. Resistance to the new Emperor continue in many areas throughout the country, most prominently in Protestant and Episcopal areas of the country. Following the coronation, Pence executed traitors to the state outside of the White Palace. The world holds its breath to see where the new American Government will go.“"
 pence.106.t:0 "A Meeting with Pence"
 pence.106.d:0 "In what has been called the most unlikely political conference of the decade, President Mike Pence of the American State has asked to open negotiations with David Duke of the American Republic. It is not known what the men will discuss, but both the media and public are showing interest in the conference. Could this be a trade agreement between the two countries? A military alliance? The public can not wait to see."
 pence.106.o1:0 "Duke Refuses"
 britain.258.t:0 "Snap Election"
 britain.258.d:0 "Britain has finally returned back to a democratic state, now the phoenix has all be gone we can now prepare a new goverment who will govern for the interest of the people. Its time to finally return back to the polls and see what party the people of the United Kingdom will choose to lead them after a broken country has finally been repaired"
 britain.258.o1:0 "Conservative Party"
 britain.258.o2:0 "Liberal Democrats"
 britain.258.o3:0 "Social Democrats"
 britain.137.d:0 "The old prime minister Corbyn refused to take action against the  Windsor family, stating that the people of Britain can keep the royals here for the sake of history and memories. Until now..instead radical military high commanders and members of Dermots ordered his loyal forces to execute the royal family. Without a moment to spare, the monarch and her entire bundle of relatives were lined up against walls and shot in their respective residences. This horrific action has shocked all of Britain and perhaps made people less supportive of their government."
 ENG_increase_military_spending_desc:0 "The SDP cut funding for the military and even had plans to stop trident. This is not acceptable. This country needs defence from the likes of the Soviet Union and Europe. Lets make our soldiers feel deserved and are the heroes of our nation."
 ENG_draft_a_socialist_constitution:0 "Draft A Socialist Constitution"
 ENG_draft_a_socialist_constitution_desc:0 "Its time to introduce the new laws of the state. Drafting a new constitution for the socialists state and make sure fairness and equality is the heart of the laws. Capitalists must be limited on what they can do and privatisation will become a thing of the past. Today is the new the republic of Britain becomes a true utopia."
 ENG_appease_scotland_desc:0 "Now Scotland has been dealt with and the troubles are starting to clear up, its safe to safe the independence movements have dropped significantly, and overall happiness has greatly increased with recent polls now suggesting the people are starting to be in favour of a monarchy in charge of the nation."
 ENG_privatise_the_nhs:0 "Privatise The NHS"
 ENG_privatise_the_nhs_desc:0 "Its time to stop pouring billions into a broken health system which cant benefit everyone, it defeats the purpose of national healthcare! Giving it to private hands allows better and smoother running and can care for those who are able to pay and take its benefits!"
 ENG_royal_guidance_desc:0 "Braiser is a devoted Christian and loyal to the crown. She will always take a knee for the Queen and the royal family. The empire she will build will be fit for the crown. The guidance given by the royal to Braiser will be how the empire will be ruled under a Phoenix Monarchy."
 AMS_national_revanchism_desc:0 ""
 pence.7.t:0 "Down With the South"
 pence.7.d:0 "President Mike Pence has ended diplomatic talks with David Duke of the American Republic today. Duke alleges that Pence tried to convert him to Christianity and ultimately annex the American Republic. Duke, a Born Again Christian, denounced this intimidation and ultimately went on to denounce the “fundamentalist Christianity” that Pence espouses, going onto say “It has no place in the Republic” “ Pence followed this up by announcing a state of war on the American Republic and has mobilized soldiers of the American State."
 pence.7.o1:0 "End the Heathans"
 britain.23.d:0 "Williams called for general election with the Queen's approval. She expected this to solidify her support and voter base after the horrific communist attacks in London, so this day must be a shock. As poll results come in, far right minor parties including Theresa Brasier's Phoenix Front have shot up in the polls once again. The Conservative Party is now coming fourth or fifth in almost all surveys, causing much stress for the incumbent government. Now it seems they won't be here for long, as the election comes down to Britain First, the supposed proto-fascists, a hyper nationalistic Republican British National Party, and the elusive Phoenix Front."
 britain.222.d:0 "Following the execution of the Windsors and proclamation of a communist "Union of Britain" led by Robert Griffiths, a Spanish ship arrived in Nova Scotia bearing the last leaders of a dynasty thought to be eradicated by the iron-fisted leader of a republican Britain. Andrew of York, off on a diplomatic mission for the royal family, and Edward, Earl of Wessex, away from Buckingham Palace when it was stormed and Elizabeth imprisoned, were greeted with minutes of cheers and applause when they were first seen publicly in Halifax. While the remnants of the Windsor dynasty have been damaged severely by the attempted destruction of their family line, Prime Minister [Root.GetLeader] has made haste to begin the process of coronation for the next British monach, so that a clear symbol of resistance can be created against the red menace that has overtaken the isles.\n\nHowever, the Prime Minister soon learned that the supporters of the Windors had failed to unify behind a single candidate - although the rightful heir to throne, Prince Andrew, is marred by constant scandals following a seperation with his wife that raised many complaints about the conduct and public apperance of the middle-aged prince. Andrew's opponenents have organized themselves under the banner of the "Edwardians", supporting the relatively young, fresh, and popular Prince Edward. Such a faction argues that Prince Andrew is unfit to rule and would not truly unify the British people in the fight against communism.\n\nThe issue, however, is up to the Prime Minister, the nobility, and the people of the Commonwealth. Should Andrew or Edward be the new King of Great Britain?"
 britain.223.d:0 "Unfortunately, the only line of the Windsor dynasty we were fully able to eradicate was that of Prince Charles - the rest, unfortunately, have fled across the world from Canada to Spain, and now, one is being paraded as the rightful King of the British Isles. Prince Andrew, a scandalous diplomat and second son of Queen Elizabeth, was off attending to one of the royal family's diplomatic duties when Buckingham was stormed, and unfortunately, he was not caught before fleeing into Canada with his two daughters. While we may have extinguished most of the Windsor lines, it is unfortunate that Prince Andrew has gotten away from us, and continues to promote his reactiontary and antiquated institution from within the borders of Canada."
 britain.223.o1:0 "A shame that one got away..."
 britain.224.d:0 "Unfortunately, the only line of the Windsor dynasty we were fully able to eradicate was that of Prince Charles - the rest, unfortunately, have fled across the world from Canada to Spain, and now, one is being paraded as the rightful King of the British Isles. Prince Edward, a popular, competent royal and third son Queen Elizabeth, was off in his estate outside the palace when Buckingham was stormed, and unfortunately, he was not caught before fleeing into Canada with his wife and immediate family. While we may have extinguished most of the Windsor lines, it is unfortunate that Prince Edward has gotten away from us, and continues to promote his reactiontary and antiquated institution from within the borders of Canada."
 britain.224.o1:0 "A shame that one got away..."
 britain.225.t:0 "Edward IX Returns To Britain"
 britain.226.t:0 "Edward IX Returns To Britain"
 britain.228.d:0 "With Scotland having recently been reunited with us, it is no longer accurate to call ourselves England. We are a united Britain one more."
 britain.2229.t:0 "New Labour has been elected!"
 britain.2229.d:0 "As I stand here before 10 Downing Street I know all too well the huge responsibility that is upon me and the great trust that the British people have placed in me.I know well what this country has voted for today. It is a mandate for New Labour and I say to the people of this country — we ran for office as New Labour, we will govern as New Labour."
 britain.2229.o1:0 "New Labour, New Britain"
 britain.2230.t:0 "The National Minimum Wage Act"
 britain.2230.d:0 "A legally-binding minimum rate of pay has been introduced in Britain for the first time. The change is expected to benefit about two million people - more than half of them in the service sector."
 britain.2230.o1:0 "A fairer society for all"
 britain.2231.t:0 "uk devolution"
 britain.2231.d:0 "devolution is the Parliament of the United Kingdom statutory granting of a greater level of self-government to the Scottish Parliament, the Welsh Parliament, the Northern Ireland Assembly and the London Assembly and to their associated executive bodies the Scottish Government, the Welsh Government, the Northern Ireland Executive and in England, the Greater London Authority and combined authorities."
 britain.2231.o1:0 "More freedom for our citizens"
 britain.2232.t:0 "uk nationalisation"
 britain.2232.d:0 "Many of britains services has now been nationalised leaving the public with cheap train and bus travel across the country as well as many of the british energy services now running at a low cost price for its citizens."
 britain.2232.o1:0 "Higer taxes means cheaper services!"
 britain.2233.t:0 "War is not always the answer"
 britain.2233.d:0 "The PM has questioned whether humanitarian intervention can ever be a legal justification for launching military action, and called for a “war powers act that would force future UK governments to seek approval from parliament."
 britain.2233.o1:0 "No more pointless wars!"
 britain.234.t:0 "Lets fix the country"
 britain.234.d:0 "Recover jobs, retrain workers and rebuild business. Government working hand in hand with business and trade unions, in the best interests of our country."
 britain.234.o1:0 "Lets get to work!"
 britain.235.t:0 "The National Education System has been introduced"
 britain.235.d:0 "SDP has removed university tuition fees, provided a free education system for all and overhauled the whole education sector in the UK with the motto: ‘Every Child – and Adult Matters’ ."
 britain.235.o1:0 "Education Education Education!"
 britain.236.t:0 "Lets not forget about the north?"
 britain.236.d:0 "We need a new approach to maximise the economic potential of the North; allowing the North’s talent to become more mobile; allowing companies to access the widest pool of people and skills they need to grow; and connecting businesses to each other to make them more efficient. And crucially, it should be at a pan-Northern level, to create a single economy across the North. ."
 britain.236.o1:0 "Lets bridge the north south divide!"
 britain.237.t:0 "Pay your fair share!"
 britain.237.d:0 "Its time for everyone to pay their taxes and we mean EVERYONE, lets work together to help fix our country using our own tax money to do it like it should be!"
 britain.237.o1:0 "Sounds a little left wing to me?"
 britain.2238.t:0 "Green way of life!"
 britain.2238.d:0 "Now we can go further: we will decarbonise the power sector completely, supporting renewables and household and community energy to create jobs and cut fossil fuel imports. Its on us to protect the UK"
 britain.2238.o1:0 "Wheres the green party went?"
 britain.2239.t:0 "The Conservative Welfare Way!"
 britain.2239.d:0 "The conservative party has removed the old welfare system and replaced it with their own version "Universal Credit". Lets hope it works as experts are saying its an unfair new system which may not include all those people who need welfare and can be very difficult and hard to obtain..."
 britain.2239.o1:0 "Less tax means more money I suppose.."
 britain.240.t:0 "Pay your fair share!"
 britain.240.d:0 "the chancellor has imposed austerity measures on every family in Britain after announcing a £40bn package of welfare cuts, a two-year public sector pay freeze and less generous benefits. The NHS would face average real cuts of 25% as well as more privatisation of current public owned services."
 britain.240.o1:0 "The economy needs to be fix"
 britain.241.t:0 "Protect the country!"
 britain.241.d:0 "The prime minister told reporters "The UK is able to respond to future threats and the security environment with our new upgrade program to protect our democracy which may involve the warsaw pact or any other enemy who may attack our island.""
 britain.241.o1:0 "We are ready to strike back if needs be."
 britain.242.t:0 "Help the people of Britain"
 britain.242.d:0 "Homelessness has more than doubled under the current government as well as housing needs and more, its up to labour to create a proper welfare system, provide better education and care for our old. We will also work with the private sector to protect our people and find new ways to fix the problems in britain."
 britain.242.o1:0 "A new system for a new government"
 britain.243.t:0 "Apple unveils the new iPhone"
 britain.243.d:0 "At their British HQ in Sunderland, The touchscreen handset will combine internet access and iPod music with a built-in 2 megapixel digital camera and video playback features. The handset dispenses with buttons, in favour of a powerful screen that responds to touch. The iPhone also shows album artwork and functions as a personal organiser. It has a proximity sensor that automatically deactivates the screen and turns off the touch sensor when the device is raised to a user's face. The battery life of the phone will allow five hours of talk time, video and browsing, and 16 hours of audio playback. A 4Gb model will be available for 499 pounds and an 8Gb model for 599 pounds. "
 britain.243.o1:0 "The wonder of technology!"
 britain.245.t:0 "Britain wake up."
 britain.245.d:0 "Once upon a time britain fought against evil and won..now it seems its embraced it and changed a great country into something our ancestors would shiver thinking about. Its time to meet with opposition groups opposed to braiser and change the direction of this country."
 britain.245.o1:0 "Theres a chill in the air"
 britain.246.t:0 "A new path."
 britain.246.d:0 "As we meet with rebel groups and begin to discuss the best ways to bring down this dictatorship we can start to learn what messages we can spread to the people of this country and bring them onto our side ready for a new beginning in this country."
 britain.246.o1:0 "There are no certainties only opportunities"
 britain.247.t:0 "Broadcast our message"
 britain.247.d:0 "With the rise of social media we can use that to broadcast our message and how to stand up against this tyrannical goverment if we can even call it that! with secret video footage of the camps and the way others are treated in this country we can hack media stations and show our footage on that and the internet."
 britain.247.o1:0 "The tide slowly turns"
 britain.248.t:0 "We start with protests"
 britain.248.d:0 "Protesting maybe illegal now but if enough of us get behind it and show our message it will show we are not scared of this goverment and we will show our thoughts in the street we will not be held silent and most of all, it will be broadcast on the internet so protesting can happen everywhere!"
 britain.248.o1:0 "Break the chains"
 britain.249.t:0 "The gears begin to move"
 britain.249.d:0 "We now have a following, a following which has reached the millions, we no longer will be ruled under an iron fist and its time to take up to the streets and show Brasier what we can do. We will march to her and she will see what real fear is when we arrive and string her up."
 britain.249.o1:0 "The revolution has begun!"
 britain.250.t:0 "Cable street will be victorious again"
 britain.250.d:0 ""Things got messy and had to retreat but we will not back down and we have found outselves at cable street..."with one mighty big push the rebels ran against he police and the army as they pushes through cable street fighting off anyone who stands in their way, as the rebels pushed to the end of the street more citizens took up arms and pushed forward making way towards Brasiers last night..""
 britain.250.o1:0 "Burn the phoenix front"
 britain.251.t:0 "The final countdown"
 britain.251.d:0 "As the rebels approach parliament a huge explosion lights up the night sky, it seems the army has blown up the entrance to let the mob descend on Braiser who is hiding in the building. As more and more crowds gather fighting off Brasiers hentchmen and parliament burns it really does show what could have happened on the 5th of November."
 britain.251.o1:0 "Remember, remember, the Fifth of November, the Gunpowder Treason and Plot. I know of no reason why the Gunpowder Treason should ever be forgot"
 britain.2252.t:0 "The moment has come"
 britain.2252.d:0 "As parliament burns and the people cheer, Braiser has come running out falling to the floor raising her hands up surrendering herself to the people. As she is picked up and taken away by the army onlookers look as parliament burns watching knowing that history is being made right in front of them. The question is..what steps do we take now?"
 britain.2252.o1:0 "Is it finally over?"
 britain.2253.t:0 "A new dawn has arrived"
 britain.2253.d:0 "The rest of the country awaken to hear the news britain is back, the tiger roars again as they celebrate Brasiers capture. Work has begun to repair parliament after the fight. The army has taken over until a new government can take over. the question is what happens to Braiser do we kill her to give her a taste of her own medicine or do we imprison her for the rest of her miserable life?"
 britain.2253.o1:0 "And people thought Thatcher was bad?!"
 britain.2254.t:0 "She Hangs!"
 britain.2254.d:0 "At 4 in the afternoon, in front of the British Parliament of Westminster, a frightened woman dressed in ragged orange clothing was brought before the people of England to hear their final judgement. That woman was none other than right-wing politician as well as short-term dictator of the British Isles Theresa Brasier. To think that what seemed to be such a feeble, battered, weak person was the one to have instilled fear into the hearts of millions was barely conceivable. In fact, in front of such a pitiful spectacle, many would have, in the past, given up on the fate that was to be bestowed upon her. But now was not the time for pity. Had she felt the same towards those poor people she had left to die in her concentration camps? Of course not! In unison, the freed asked for blood, and blood they received. one fell swoop of the patented guillotine, and it was over. Everyone knew that other important figures of the Phoenix Front were still at large, plotting for their return. But for now, one death seemed to have avenged countless others"
 britain.2254.o1:0 "To kill a Phoenix, cut off its bloody head."
 britain.255.t:0 "Real Punishment"
 britain.255.d:0 "Braiser cannot be allowed to just die and let this all go, she will live knowing she cause terrible acts in this country, she will live and watch as the country removes her policies and embraces everyone with all diffferent types of lifestyles and cultures. She will watch as the UK looks down on her and laughs as she rots in her prison."
 britain.255.o1:0 "Justice is sweet"
 britain.256.t:0 "Real Punishment"
 britain.256.d:0 "Now the Phoenix has offically been removed we can started to educate our young on what is the true correct path in this country, we can also change things back to the old way before the fronts crazy system was implemented. We have to restore Britain back to what is used to be and make sure that no other extreme party can ever come to power again the way Braiser did."
 britain.256.o1:0 "Lets rebuild together"
 britain.257.t:0 "Removal of evil"
 britain.257.d:0 "Now the phoenix is removed we need to destory and remove the work camps Braiser and her dictatorship created, we must also remind people of the atrocities that did occur here. We will also dismantle her TV station and any references relating to the phoenix front will be made illegal."
 britain.257.o1:0 "Britain has finally returned"
 britain.266.t:0 "Marriage Tax Breaks"
 britain.266.d:0 "The Traditional Conservative party have announced that those who are married will receive tax breaks to help them in their either new married life or rewardsing their success staying together for true british values."
 britain.266.o1:0 "Traditional Values"
 britain.267.t:0 "Better privatisation"
 britain.267.d:0 "The nations debt has reached levels we cannot allow to go on anymore. Any nationalised industry will be either privatised or cut to save as much money the country can save. The tory party will encourge more businesses to take over state run businesses to allow more jobs and investment."
 britain.267.o1:0 "Keep the NHS in public hands"
 britain.268.t:0 "Stronger Borders"
 britain.268.d:0 "Civil war is taking over Europe, we must ensure that Britian stays strong during these uncertain times therefore new security will be introduced to keep our country safe and any communists will be kept out!"
 britain.268.o1:0 "No To The Reds"
 britain.269.t:0 "Cut Foreign aid"
 britain.269.d:0 "We give away money to countries which do not look after their people, they keep the money for the rich and powerful, we could use this money to pay for our soldiers and keep our money for future projects that we may create."
 britain.269.o1:0 "Money for us!!"
 britain.270.t:0 "Veterans Administration Department"
 britain.270.d:0 "We shall establish a department to keep all soldiers, veterans and any royal service to our country safe. This department will ensure all of those loyal to service our great nation will be kept off the streets, giving free housing, less tax and many benefits for keeping us all safe."
 britain.270.o1:0 "Money for us!!"
 britain.271.t:0 "Less tax for families"
 britain.271.d:0 "Rising a family this this country is vital to keep the British traditions alive here. We must make sure the people of this country know that and will be rewarded for brining up children and becoming a tree British citizen. We will establish tax breaks for those who deserve it."
 britain.271.o1:0 "Family First"
 britain.272.t:0 "More funding for schools"
 britain.272.d:0 "Schools across the country have been left in hideous states, the north needs investment and quickly, schools will be rebuilt or renovated to meet modern times while the rest of colleges, universities and any educational building will be giving great funding to teach our younger generation!"
 britain.272.o1:0 "Education Education Education"
 britain.273.t:0 "Tougher criminal sentances"
 britain.273.d:0 "Previous governments have allowed criminals to get away easily with a slap on the wrist EVEN for serious crimes. This will be stopped as we will impose harsher longer sentences for those committing crimes and show the people they no longer need to worry about walking alone at night."
 britain.273.o1:0 "Hopefully this shall help"
 britain.274.t:0 "Not part of the EU"
 britain.274.d:0 "We maybe IN Europe but we are not part of it and we will never bow down to communist rule. We are British and we created and found democracy, it’s one of our proudest creations and we will enshrine that it stays this way. The borders of Britain will be upgraded and better reforms will take place to prevent any left-wing influence attacking our great nation."
 britain.274.o1:0 "Fight The Reds Away"
 britain.275.t:0 "Real care for the elderly and disabled"
 britain.275.d:0 "The benefit system is not fair for everyone, the disabled are not getting a fair share, those who cannot work are not receiving what they should be getting. We will reform this and make it a fairer better system! The elderly we will up their state pension and make sure they are giving more money during winter and less bills to pay."
 britain.275.o1:0 "Care For All"
 britain.276.t:0 "Our Skilled Workers"
 britain.276.d:0 "Today the liberal democrats will establish independent Educational Standards Authority, this will make sure all young adults who leave education are trained and skilled the best they can for this modern world. Those who are out of work for a long duration of time will work for the state and be given a good wage. We will put Britain back to work."
 britain.276.o1:0 "Work For All"
 britain.277.t:0 "Affordable homes created"
 britain.277.d:0 "We will be bringing 250,000 empty homes back into use which will house many families, less tax for first time buyers with Bursaries to help those get a house. We will make sure all ppeople who want to buy a house can afford to!"
 britain.277.o1:0 "Housing the country"
 britain.278.t:0 "Cleaner and better transport"
 britain.278.d:0 "The transport industry is old and weak, its unreliable and costs much to run as well as attacks our environment. We are going to create all electric buses and taxis and these will run all over our country, we will also make sure all checks are made on cars and more vehicles watch their emission limits. "
 britain.278.o1:0 "Fixing the enviroment"
 britain.279.t:0 "Reform building standards"
 britain.279.d:0 "Housings and many buildings are outdated and need to be fixed and modernized. We will put much funding into this and prevent any catastrophic disasters to happen to large social buildings. We care for the people and we need to make sure all buildings are safe for all. "
 britain.279.o1:0 "Remove Cladding"
 britain.280.t:0 "working for the future"
 britain.280.d:0 "As innovation transforms the country and the world jobs need to be ready for this transformation too. The social democrats are ready to train up the people of tomorrow and be ready for any challenge. This will make Britain strong and we will lead the world in new technology."
 britain.280.o1:0 "Tomorrow is the future"
 britain.281.t:0 "Immigration Point System"
 britain.281.d:0 "We need to make sure who we are exactly letting into our country. We do not know who we let in every day. The point system will do this. It’s a fair system and those who wish to work here will get their visa if they wish to provide their service and can stay here as long as they wish as long as it benefits all."
 britain.281.o1:0 "A fairer system"
 britain.282.t:0 "Owens Future Plans For The UK"
 britain.282.d:0 "David Owen was the best prime minister of this country since Churchill. He stopped our great nation fall apart and kept it going while the rest of the world fell to communism and American became the divided states of America. Owen wanted the best for the UK and we will keep to his promises. We will make more welfare and better social services for the people of this country as well as push our economy further."
 britain.282.o1:0 "RIP David Owen."
 britain.283.t:0 "Raise Wage For The People"
 britain.283.d:0 "Labour will raise the Living Wage to £10 an hour, giving low-paid workers on average 2,500 pounds a year extra in their pockets. We will also ensure all NHS staff, police and fire services are giving a pay rise for their hard work to keep our public safe and well. This is the first of many changes labour will make to keep this country strong and stable."
 britain.283.o1:0 "Service to our nation is rewarded"
 britain.284.t:0 "More Officers On Our Streets"
 britain.284.d:0 "As crime rises so does the need for police officers. We will high over 20 thousand officers to keep our streets safe, we will stop crimes and those innocent people being attacked and bring justice to those who need it. We will also reform our security forces making sure surveillance agencies can watch our island and protect it."
 britain.284.o1:0 "Keeping Britain safe"
 britain.285.t:0 "Regional Employment"
 britain.285.d:0 "Labour will make sure every region in the United Kingdom has low unemployment, with people working in a fair equal society. Which supports everyone who needs jobs in a fair strong society. Labour will work with private companies to make sure they are hiring the right amount of people giving them the change to be treated fairly while unions stand by"
 britain.285.o1:0 "More Jobs."
 britain.286.t:0 "Fairer modern welfare"
 britain.286.d:0 "The National Care Service will make sure that social care is 21st century ready and can provide for all those who need it! Free school meals and Free full-fibre broadband and better more equal benefits to those who need it. There are many great things we can offer our people as long as we do not overspend we can provide well enough for our people."
 britain.286.o1:0 "21st Century Welfare"
 britain.287.t:0 "Give EU nationals right to remain"
 britain.287.d:0 "As EU nationals leave their homes due to civil war or uncertainty, they seek safe places to stay. We can offer these refugees safety and freedom. Show them what real democracy is and how much a real democratic government can make peoples lives better and more fairer."
 britain.287.o1:0 "Safe Homes, Safe Passage"
 britain.288.t:0 "Removal of tuition fees"
 britain.288.d:0 "Labour has a plan to make real change for students. No matter our background, we all deserve to grow our knowledge and skills and when everyone has the chance to learn, whole communities benefit. That's why Labour will scrap tuition fees and make higher education free for all."
 britain.288.o1:0 "Education free for all"
 britain.289.t:0 "The LGBT community"
 britain.289.d:0 "Labour will introduce same sex marriage. This is not to be debated, this will be signed straight into law as this is something that is to be a human right. Those cannot help who they fall in love with and we should not look down upon this either. Same sex marriage is now free and we will appoint a department to ensure their rights are kept."
 britain.289.o1:0 "Progressive Movements are made"
 britain.290.t:0 "Nationalisation extra services"
 britain.290.d:0 "The people of this country are still struggling to pay bills or feel as if they may still pay too much for transport. We will make sure our nationalising plan will make every person in this country able to pay their bills like gas and water on the cheap."
 britain.290.o1:0 "Better lives for all"
 britain.291.t:0 "The Cuban Meeting.."
 britain.291.d:0 "Jeremy Corbyn has meet the leader of Cuba in what many critics are calling a true communist shift which will come to the UK very very soon…Meanwhile the labour party have protested this and told the people of Britain that this is to see how the party can improve life here under a socialist way and build better relations with the communist block."
 britain.291.o1:0 "Viva La Corbyn"
 britain.292.t:0 "Better Relations With The EU"
 britain.292.d:0 "The EU is only across the channel from us, it would be best to start working together in future projects for the sake of human kind. Working together has never been more important like preventing pointless wars which could breakout and preventing other nations from going to war with each other."
 britain.292.o1:0 "A Red Relationship"
 britain.293.t:0 "Snap Election"
 britain.293.d:0 "Woohoo"
 britain.293.o1:0 "Conservative Party"
 britain.294.t:0 "Strong Renewable Energy"
 britain.294.d:0 "We will build solar farms, wind farms and many more energy industries. We will stop all fossil fuel buring naandd cut climate change so we keep out country breathing clean better air. The green party was created to save Britain from fossil fuels and that is what we will do!"
 britain.294.o1:0 "The Real Green Party"
 britain.295.t:0 "Cutting war funding"
 britain.295.d:0 "Wars are being fought for pointless reasons meanwhile the UK is not and has not for a very long time. Its time we cut this pointless funding and put it into resources that are needed such as extra funding into state works like the NHS or police force, things that reall do matter!"
 britain.295.o1:0 "Hopefully this wont bite us"
 britain.296.t:0 "legalise weed"
 britain.296.d:0 "Weed is looked at in the wrong view as many people are imprisoned because of it, the green party does not agree with this and it can even be taxed because of it. There are many positives to weed being legal and that is what we shall do. Making sure it works well but it is given the right regulation it is needed. "
 britain.296.o1:0 "Is this right?"
 britain.297.t:0 "More NHS Funding"
 britain.297.d:0 "Each party including labour has their own views on how to safe and keep the NHS running. We know as we are people who use it, not private health care. We know what must be done and how it should properly be funded and we will make sure the waiting lists are cut allowing people to get seen to asap."
 britain.297.o1:0 "God Save The NHS"
 britain.303.t:0 "New Zealand Trade Talks"
 britain.303.d:0 "The UK’s and New Zealand’s objective is to secure a high quality, comprehensive and inclusive trade agreement with the United Kingdom that builds on our existing strong relationship. This deal will involve An agreement that provides comprehensive and commercially meaningful access for exporters by removing tariffs and reducing other barriers that impact goods and services trade and investment activity as well as including environment, climate change and labour. This deal will make it easier for both parties."
 britain.303.o1:0 "This could be tricky.."
 britain.304.t:0 "Canada Trade Talks"
 britain.304.d:0 "The UK has secured a trade deal with Canada that will secure a strong relationship with both with the leader of Canada who hailed it as a “fantastic agreement for Britain, which secures transatlantic trade with one of our closest allies. The International trade secretary said the deal would provide “certainty for thousands of businesses. This really is a new beginning for the UK and Canada and will only get better once its written into law."
 britain.304.o1:0 "United once again!"
 britain.305.t:0 "Freedom Of Movement"
 britain.305.d:0 "Britons and Australians, Canadians and New Zealanders are in line to soon have greater opportunities to live and work in each other’s countries, with trade deal talks between the two nations placing freedom of movement at the fore of negotiations. As talks begin to end and all the parties agreeing with each other. Pens have been put to paper and now begins the chance for people to move around countries with cheap easy access."
 britain.305.o1:0 "A huge step for CANZUK"
 britain.2306.t:0 "Stronger Jobs"
 britain.2306.d:0 "Job opportunities have become a much talked about subject within the CANZUK debate, the process of creating many jobs and businesses working closely together with countries like Canada, UK and Oceania can build lots of confidence with economies. Now CANZUK has begun so can the jobs and creation of businesses inside of this union."
 britain.2307.t:0 "Working Together"
 britain.2307.d:0 "CANZUK has been created, all four nations are not working together to create fantastic job opportunities, allow people to move around easily between the countries and watch all our economies grow strong and powerful! We can continue to work together to create even more fantastic new opportunities for the future of this new union, this is only the start of CANZUK and we believe it is only going to get strong and our relationships between our four nations will become great."
 britain.2308.t:0 "Future Research"
 britain.2308.d:0 "Now we have achieved everything we set out to do, its time we begin progress on the future and make this friendship even stronger. We can collaborate our technology and science together to fight off diseases and make great advancements in our technology. Combining this as well as many other things. We will definitely rival many other countries and unions and could be looked at one strong powerful union."
 britain.2311.t:0 "The Phoenix Election Pledge"
 britain.2311.d:0 "As election day approaches, political parties get ready to show the UK what they will do if they get into power and how they will be able to change the country in their own vision. The main political parties are sticking to their normal tactics of gaining votes unlike another party which has recently just been formed.\n\nThe Phoenix Front have been on televisions up and down the country spreading their hate messages how Britain is no longer for the real British people. Recently they have sent a dark message about the non-British folk..How the front will deal with those who do not meet their standards in the country..Questions are being raised about how they will deal with those who do not meet the perfect English image…For now democracy stands.."
 britain.138.d:0 "Dermot Hudson has ordered his loyal soldiers to force the royal family out of their residences and the country. Now stateless, former Queen Elizabeth and her entire bundle of relatives are left wondering what country they will seek exile in..and whether they will be accepted. This action has only shocked some of Britain and perhaps made people more supportive of their government, compared to communist governments of Europe that brutally executed monarchs."
 britain.27.t:0 "A United Union"
 britain.27.d:0 "The Queen's recent speech describing 'one union under the UK' has made those still wanting independence angry yet with the new laws for those unable to protest for independence they are now stuck. Meanwhile celebrations have taken place across the country celebrating the closest the union has ever been with a monarchy in all places across the nation. With Scotland now going through new reforms and being rebuilt and Wales finally being given the aid they need it seems the country is now finally entering a golden age."
 britain.27.o1:0 "A New Dawn For The UK"
