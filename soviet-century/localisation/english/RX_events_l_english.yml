 lin.31.t:0 "The Coma"
 lin.31.d:0 ""Ugh where am i?" Spencer awoke to a world very different to our own, a world of broken memories, shattered dreams, and a future that's yet to come. "How did I get here?""\n\n""Spencer, I need you to wake up" a strange voice in a german accent approaches spencer."\n\n""Who are you? What do you want with me, are you death? here to take my soul?""\n\n""Nien, I'm simply a messenger from the past here to show you a future yet to come." Says the voice behind spencer"\n\n"Spencer turns around to face this mysterious man but sees nothing"\n\n""What message from the past? What future yet to come? Show yourself right now I demand it!.""\n\n""As you wish" the man materializes in front of Spencer, wearing a dark black uniform emboldened with many medals, the symbol of an eagle carrying a swastika, and two lighting S's."
 lin.31.o1:0 "Himmler?!?"
 lin.32.t:0 "The Coma"
 lin.32.d:0 ""What's the meaning of this?!" Spencer observed his surroundings, it appears to be a small town in America, though it has the air of being southern, the air around town gives it a distinct, liberal aura. "Where are we?""\n\n""Charlottesville Virginia 2017, the soon to be site to a disastrous rally organized in part by you." Himmler began to walk "Take a walk with me""\n\n""What do you mean organized by me? I'm in Spokane? As far away from Virginia as possible? Am I planning a terrorist attack here?" Spencer ask as he follows Himmler"\n\n""In your world you are the leader of a neo-nazi state in Idaho, however in this world you are nothing more than a white nationalist activist, working in the confines of the rules and laws set by the United States government." Himmler stops and points Spencer towards a group of people all holding tiki torches or waving flags"\n\n"Spencer takes a closer look, and spots in the crowd neo-nazis, neo-confederates, white nationalist, and american nationalist marching and protesting something about a statues removal. Opposite to them is a collection of anti-fascist, anti-racist, and anti-white protestors. "In this world did America win the cold war?""\n\n""In a way yes they did, the soviet union collapsed in 1991, but following that america sold out, sold out its people for a swath of non-whites who hate America, sold out is solders for oil, its politicians sold themselves to the jews for short term financial gain. America might have beat the soviet union, but it lost in the end.""\n\n"Tensions between the marchers and protesters, as a bellow of slurs, names, verbal fights, and the occasional physical fight keeps accruing in the streets, only to meet its head when one of the right wing marchers rammed a car into a crowd of protesters, killing one."\n\n""Finally action, are the people finally gonna rise up against the government.""\n\n""Afraid not, this is one of the last times you and any white nationalist ever make such a grandstand, as after this many were arrested, fined, shut down, censored, or ended up turning coat, like what happened to yourself.""\n\n""I would never turn against the values, traditions and race I uphold!""\n\n""Well Spencer, you did, you in 2020 endorsed a senile old man, Joe Biden for president over the one politician that, at the very least, was improving the lives of the people, Donald Trump.""\n\n""You can't be serious, i would nev-""\n\n""But you did, in this timeline, you not only endorse Biden but when trump supporters rioted outside the capitol building in an attempt to stop him from stealing a rigged election, you denounced them!""\n\n""That's not possible, I I I -" Spencer fell to the floor, crying, "it's hopeless huh, nothing matters, no matter how hard we try, how hard we fight, we are destined to lose the fights for our people.""\n\n""Spencer, stand up, I didn't show you all this just so you would give up.""\n\n"Himmler helps Spencer stand, as he does Spencer notices that he is back in the world of shattered memories."\n\n""Then why show me all this?""\n\n""It's because, you still have a chance in your world to succeed, where I and many others failed, you can still build a land for your people, you can still provide a victory and future to the white race, you just need to be willing to go . . . A lot deeper down the rabbit hole to do it.""\n\n"Himmler steps aside to reveal a blacksun behind him, beyond which is only what Spencer would call a utopia, a world of only whites, safe and secure from the jewish threat, a world where they can live to fullest, pursue the best life without the worries that the current world brings."\n\n""This Spencer can all be yours, you just have to do as I say, understood?""
