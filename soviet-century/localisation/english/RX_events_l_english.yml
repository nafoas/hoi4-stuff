 rx_usa.1.t:0 "McAfee Wins"
 rx_usa.1.d:0 "John McAfee, famed Libertarian of the American Republic has pulled off the impossible and won the Presidential Election. For the First time in American History, a third party candidate has secured the electoral votes and is due to be sworn in. McAfee, who has made his radical views on the concepts of taxation and such has announced many of his plans for day 1 in office."
 rx_usa.1.o1:0 "Lets see how this turns out"
 rx_usa.2.t:0 "McAfee Caught in Scandle"
 rx_usa.2.d:0 "Austin Peterson couldn't believe what he was seeing. His president and dear friend was using taxpayer money for drugs. Now he would face a question unlike any other, would he expose the president or would he look the other way?"
 rx_usa.2.o2:0 "He Removes McAfee"
 rx_usa.2.o1:0 "He Buries it"
 rx_usa.3.t:0 "McAfee Flees to Belize"
 rx_usa.3.d:0 "Disgraced former President McAfee has fled to Belize after embezelment charges were filed against him. McAfee, who attempted to use state many for drugs has effectively resigned his position as both President and American citizen. Succeeding him are his VP, Austin Peterson who is set to take the Oath of Office any day and newly chosen VP Brandon Herrera."
 rx_usa.3.o1:0 "Lets See How He Does"
 rx_usa.4.t:0 "Petersen takes Office"
 rx_usa.4.d:0 "Austin Petersen has taken to outh and succeeded McAfee as President with V.P Brandon Herrera By his side."
 rx_usa.4.o1:0 "Finally A Good President"
