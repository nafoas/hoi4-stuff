 lin.23.t:0 "Spencer Awakens"
 lin.23.d:0 "Spencer awoke to a white room, filled computer screens and many tubes entering his body, "uhhh what happened""\n\n""Sir!?" Rushed over Timothy McVeigh, "Don't make and sudden movements, you're in the hospital, you took a nasty gunshot and a long fall off the balcony during your speech last week.""\n\n""Who else is here?""\n\n""Besides me its just Weaver and Heimbach, you need me to call a nurse,""\n\n""No need," Spencer moves himself up and sits alongside the bed, "What's the current situation in Spokane, I doubt my assassination attempt hasn't gone without some kind of riot.""\n\n""Sir pro-pacific communist, montana loyalists, and canadian backed democratic forces have been in open battle in the streets for the past couple days, they all appear to be given some kind of funding and equipment, our militias have been slowly losing-""\n\n""Silence!" Spencer cuts him off as he stands from the bed "Fetch me some clothing and take me to the militias, i have a job to do.""\n\n""But sir you can't not be in your current shape.""\n\n""Enough!" Spencer rips out the medical equipment still attached to him "I experienced a vision while I was out cold, a vision that must become true, i'll do what is necessary to accomplish this vision, so I'll say this one more time," Spencer leaned over Timothy, "Fetch me some clothing and take me to the militias, Am I clear?" "
