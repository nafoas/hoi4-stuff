 britain.23.t:0 "General Election"
 britain.23.d:0 "Williams called for general election with the Queen's approval. She expected this to solidify her support and voter base after the horrific communist attacks in London, so this day must be a shock. As poll results come in, far right minor parties including Theresa Brasier's Phoenix Front have shot up in the polls once again. The Conservative Party is now coming fourth or fifth in almost all surveys, causing much stress for the incumbent government. Now it seems they won't be here for long, as the election comes down to Britain First, the supposed proto-fascists, a hyper nationalistic Republican British National Party, and the elusive Phoenix Front."
 britain.23.o1:0 "Britain First"
 britain.23.o2:0 "British National Party"
 britain.23.o3:0 "Phoenix Front"
 britain.222.t:0 "Remaining Royals Arrive"
 britain.222.d:0 "Following the execution of the Windsors and proclamation of a communist "Union of Britain" led by Robert Griffiths, a Spanish ship arrived in Nova Scotia bearing the last leaders of a dynasty thought to be eradicated by the iron-fisted leader of a republican Britain. Andrew of York, off on a diplomatic mission for the royal family, and Edward, Earl of Wessex, away from Buckingham Palace when it was stormed and Elizabeth imprisoned, were greeted with minutes of cheers and applause when they were first seen publicly in Halifax. While the remnants of the Windsor dynasty have been damaged severely by the attempted destruction of their family line, Prime Minister [Root.GetLeader] has made haste to begin the process of coronation for the next British monach, so that a clear symbol of resistance can be created against the red menace that has overtaken the isles.\n\nHowever, the Prime Minister soon learned that the supporters of the Windors had failed to unify behind a single candidate - although the rightful heir to throne, Prince Andrew, is marred by constant scandals following a seperation with his wife that raised many complaints about the conduct and public apperance of the middle-aged prince. Andrew's opponenents have organized themselves under the banner of the "Edwardians", supporting the relatively young, fresh, and popular Prince Edward. Such a faction argues that Prince Andrew is unfit to rule and would not truly unify the British people in the fight against communism.\n\nThe issue, however, is up to the Prime Minister, the nobility, and the people of the Commonwealth. Should Andrew or Edward be the new King of Great Britain?"
 britain.222.o1:0 "Support the Legitimists: crown Prince Andrew!"
 britain.222.o2:0 "Support the Edwardians: crown Prince Edward!"
 britain.223.t:0 "British Nobles Crown Prince Andrew"
 britain.223.d:0 "Unfortunately, the only line of the Windsor dynasty we were fully able to eradicate was that of Prince Charles - the rest, unfortunately, have fled across the world from Canada to Spain, and now, one is being paraded as the rightful King of the British Isles. Prince Andrew, a scandalous diplomat and second son of Queen Elizabeth, was off attending to one of the royal family's diplomatic duties when Buckingham was stormed, and unfortunately, he was not caught before fleeing into Canada with his two daughters. While we may have extinguished most of the Windsor lines, it is unfortunate that Prince Andrew has gotten away from us, and continues to promote his reactiontary and antiquated institution from within the borders of Canada."
 britain.223.o1:0 "A shame that one got away..."
 britain.224.t:0 "British Nobles Crown Prince Edward"
 britain.224.d:0 "Unfortunately, the only line of the Windsor dynasty we were fully able to eradicate was that of Prince Charles - the rest, unfortunately, have fled across the world from Canada to Spain, and now, one is being paraded as the rightful King of the British Isles. Prince Edward, a popular, competent royal and third son Queen Elizabeth, was off in his estate outside the palace when Buckingham was stormed, and unfortunately, he was not caught before fleeing into Canada with his wife and immediate family. While we may have extinguished most of the Windsor lines, it is unfortunate that Prince Edward has gotten away from us, and continues to promote his reactiontary and antiquated institution from within the borders of Canada."
 britain.224.o1:0 "A shame that one got away..."
 britain.225.t:0 "Edward IX Returns To Britain"
 britain.225.d:0 "Formerly known as Prince Andrew of York, King Edward IX has left Canada for good and returned to Britain to be fully and completely coronated as King of Great Britain, the first monarch since the scandalous Edward VII to bear the regnal name. Although many view Edward IX with much suspicion, pointing out his shifty ties to conservative and nationalist resistance movements and less than savory figures in the Canadian government, along with a variety of other public scandals, the monarchy still remains a relatively popular institution in Britain, as it was before the Griffiths regime tore the nation apart. With a new king, a new government, and a new future for Britain, the people have embraced once more the values of capitalism, patriotism, and most importantly, the thousand-year British ideal of monarchy. While he may have thought himself akin to Cromwell, in reality Griffiths has fallen in much the same fashion, and the institution he worked so hard to destroy has returned.\n\nRule Britannia!"
 britain.225.o1:0 "God save the king!"
 britain.226.t:0 "Edward IX Returns To Britain"
 britain.226.d:0 "Formerly known as Prince Edward of Wessex, King Edward IX has left Canada for good and returned to Britain to be fully and completely coronated as King of Great Britain, the first monarch since the scandalous Edward VII to bear the regnal name. Although many view Edward IX's legitimacy with suspicion, none can deny his popularity among the common people of Britain, and in fact, the monarchy as a whole's popularity, as it was before the Griffiths regime tore the nation apart. With a new king, a new government, and a new future for Britain, the people have embraced once more the values of capitalism, patriotism, and most importantly, the thousand-year British ideal of monarchy. While he may have thought himself akin to Cromwell, in reality Griffiths has fallen in much the same fashion, and the institution he worked so hard to destroy has returned.\n\nRule Britannia!"
 britain.226.o1:0 "God save the king!"
 britain.227.t:0 "Britain Divided"
 britain.227.d:0 "With Scotland having recently left our Union, the British Isles are once more divided. Henceforth we shall now be known as England."
 britain.227.o1:0 "I see."
 britain.228.t:0 "Britain United"
 britain.228.d:0 "With Scotland having recently been reunited with us, it is no longer accurate to call ourselves England. We are a united Britain one more."
 britain.228.o1:0 "Wonderful."
 britain.229.t:0 "New Labour has been elected!"
 britain.229.d:0 "As I stand here before 10 Downing Street I know all too well the huge responsibility that is upon me and the great trust that the British people have placed in me.I know well what this country has voted for today. It is a mandate for New Labour and I say to the people of this country — we ran for office as New Labour, we will govern as New Labour."
 britain.229.o1:0 "New Labour, New Britain" 
 britain.230.t:0 "The National Minimum Wage Act"
 britain.230.d:0 "A legally-binding minimum rate of pay has been introduced in Britain for the first time. The change is expected to benefit about two million people - more than half of them in the service sector."
 britain.230.o1:0 "A fairer society for all" 
 britain.231.t:0 "uk devolution"
 britain.231.d:0 "devolution is the Parliament of the United Kingdom statutory granting of a greater level of self-government to the Scottish Parliament, the Welsh Parliament, the Northern Ireland Assembly and the London Assembly and to their associated executive bodies the Scottish Government, the Welsh Government, the Northern Ireland Executive and in England, the Greater London Authority and combined authorities."
 britain.231.o1:0 "More freedom for our citizens" 
 britain.232.t:0 "uk nationalisation"
 britain.232.d:0 "Many of britains services has now been nationalised leaving the public with cheap train and bus travel across the country as well as many of the british energy services now running at a low cost price for its citizens."
 britain.232.o1:0 "Higer taxes means cheaper services!" 
 britain.233.t:0 "War is not always the answer"
 britain.233.d:0 "The PM has questioned whether humanitarian intervention can ever be a legal justification for launching military action, and called for a “war powers act that would force future UK governments to seek approval from parliament."
 britain.233.o1:0 "No more pointless wars!" 
 britain.234.t:0 "Lets fix the country"
 britain.234.d:0 "Recover jobs, retrain workers and rebuild business. Government working hand in hand with business and trade unions, in the best interests of our country."
 britain.234.o1:0 "Lets get to work!" 
 britain.235.t:0 "The National Education System has been introduced"
 britain.235.d:0 "SDP has removed university tuition fees, provided a free education system for all and overhauled the whole education sector in the UK with the motto: ‘Every Child – and Adult Matters’ ."
 britain.235.o1:0 "Education Education Education!" 
 britain.236.t:0 "Lets not forget about the north?"
 britain.236.d:0 "We need a new approach to maximise the economic potential of the North; allowing the North’s talent to become more mobile; allowing companies to access the widest pool of people and skills they need to grow; and connecting businesses to each other to make them more efficient. And crucially, it should be at a pan-Northern level, to create a single economy across the North. ."
 britain.236.o1:0 "Lets bridge the north south divide!" 
 britain.237.t:0 "Pay your fair share!"
 britain.237.d:0 "Its time for everyone to pay their taxes and we mean EVERYONE, lets work together to help fix our country using our own tax money to do it like it should be!"
 britain.237.o1:0 "Sounds a little left wing to me?" 
 britain.238.t:0 "Green way of life!"
 britain.238.d:0 "Now we can go further: we will decarbonise the power sector completely, supporting renewables and household and community energy to create jobs and cut fossil fuel imports. Its on us to protect the UK"
 britain.238.o1:0 "Wheres the green party went?" 
 britain.239.t:0 "The Conservative Welfare Way!"
 britain.239.d:0 "The conservative party has removed the old welfare system and replaced it with their own version "Universal Credit". Lets hope it works as experts are saying its an unfair new system which may not include all those people who need welfare and can be very difficult and hard to obtain..."
 britain.239.o1:0 "Less tax means more money I suppose.." 
 britain.240.t:0 "Pay your fair share!"
 britain.240.d:0 "the chancellor has imposed austerity measures on every family in Britain after announcing a £40bn package of welfare cuts, a two-year public sector pay freeze and less generous benefits. The NHS would face average real cuts of 25% as well as more privatisation of current public owned services."
 britain.240.o1:0 "The economy needs to be fix" 
 britain.241.t:0 "Protect the country!"
 britain.241.d:0 "The prime minister told reporters "The UK is able to respond to future threats and the security environment with our new upgrade program to protect our democracy which may involve the warsaw pact or any other enemy who may attack our island.""
 britain.241.o1:0 "We are ready to strike back if needs be." 
 britain.242.t:0 "Help the people of Britain"
 britain.242.d:0 "Homelessness has more than doubled under the current government as well as housing needs and more, its up to labour to create a proper welfare system, provide better education and care for our old. We will also work with the private sector to protect our people and find new ways to fix the problems in britain."
 britain.242.o1:0 "A new system for a new government"
 britain.243.t:0 "Apple unveils the new iPhone"
 britain.243.d:0 "At their British HQ in Sunderland, The touchscreen handset will combine internet access and iPod music with a built-in 2 megapixel digital camera and video playback features. The handset dispenses with buttons, in favour of a powerful screen that responds to touch. The iPhone also shows album artwork and functions as a personal organiser. It has a proximity sensor that automatically deactivates the screen and turns off the touch sensor when the device is raised to a user's face. The battery life of the phone will allow five hours of talk time, video and browsing, and 16 hours of audio playback. A 4Gb model will be available for 499 pounds and an 8Gb model for 599 pounds. "
 britain.243.o1:0 "The wonder of technology!" 
 britain.244.t:0 "Snap Election"
 britain.244.d:0 "After the assassination of Prime Minister Owen and subsequent storming of Parliament by the Queen, Mrs. Williams called for a brand new general election without the Queen's approval. Now the day has finally come where the British people can truly decide their fate once again, in a much more polarising political society. Now the only question remaining, is what future they will choose..."
 britain.244.o1:0 "Conservative Party"
 britain.244.o2:0 "Liberal Democrats"
 britain.244.o3:0 "Social Democrats"
 britain.244.o4:0 "Labour Party"
 britain.244.o5:0 "Independent Labour Party"
 britain.244.o6:0 "The New Labour Party" 
 britain.245.t:0 "Britain wake up."
 britain.245.d:0 "Once upon a time britain fought against evil and won..now it seems its embraced it and changed a great country into something our ancestors would shiver thinking about. Its time to meet with opposition groups opposed to braiser and change the direction of this country."
 britain.245.o1:0 "Theres a chill in the air"
 britain.246.t:0 "A new path."
 britain.246.d:0 "As we meet with rebel groups and begin to discuss the best ways to bring down this dictatorship we can start to learn what messages we can spread to the people of this country and bring them onto our side ready for a new beginning in this country."
 britain.246.o1:0 "There are no certainties only opportunities"
 britain.247.t:0 "Broadcast our message"
 britain.247.d:0 "With the rise of social media we can use that to broadcast our message and how to stand up against this tyrannical goverment if we can even call it that! with secret video footage of the camps and the way others are treated in this country we can hack media stations and show our footage on that and the internet."
 britain.247.o1:0 "The tide slowly turns"
 britain.248.t:0 "We start with protests"
 britain.248.d:0 "Protesting maybe illegal now but if enough of us get behind it and show our message it will show we are not scared of this goverment and we will show our thoughts in the street we will not be held silent and most of all, it will be broadcast on the internet so protesting can happen everywhere!"
 britain.248.o1:0 "Break the chains" 
 britain.249.t:0 "The gears begin to move"
 britain.249.d:0 "We now have a following, a following which has reached the millions, we no longer will be ruled under an iron fist and its time to take up to the streets and show Brasier what we can do. We will march to her and she will see what real fear is when we arrive and string her up."
 britain.249.o1:0 "The revolution has begun!"  
 britain.250.t:0 "Cable street will be victorious again"
 britain.250.d:0 ""Things got messy and had to retreat but we will not back down and we have found outselves at cable street..."with one mighty big push the rebels ran against he police and the army as they pushes through cable street fighting off anyone who stands in their way, as the rebels pushed to the end of the street more citizens took up arms and pushed forward making way towards Brasiers last night..""
 britain.250.o1:0 "Burn the phoenix front" 
 britain.251.t:0 "The final countdown"
 britain.251.d:0 "As the rebels approach parliament a huge explosion lights up the night sky, it seems the army has blown up the entrance to let the mob descend on Braiser who is hiding in the building. As more and more crowds gather fighting off Brasiers hentchmen and parliament burns it really does show what could have happened on the 5th of November."
 britain.251.o1:0 "Remember, remember, the Fifth of November, the Gunpowder Treason and Plot. I know of no reason why the Gunpowder Treason should ever be forgot"
 britain.252.t:0 "The moment has come"
 britain.252.d:0 "As parliament burns and the people cheer, Braiser has come running out falling to the floor raising her hands up surrendering herself to the people. As she is picked up and taken away by the army onlookers look as parliament burns watching knowing that history is being made right in front of them. The question is..what steps do we take now?"
 britain.252.o1:0 "Is it finally over?" 
 britain.253.t:0 "A new dawn has arrived"
 britain.253.d:0 "The rest of the country awaken to hear the news britain is back, the tiger roars again as they celebrate Brasiers capture. Work has begun to repair parliament after the fight. The army has taken over until a new government can take over. the question is what happens to Braiser do we kill her to give her a taste of her own medicine or do we imprison her for the rest of her miserable life?"
 britain.253.o1:0 "And people thought Thatcher was bad?!"  
 britain.254.t:0 "She Hangs!"
 britain.254.d:0 "At 4 in the afternoon, in front of the British Parliament of Westminster, a frightened woman dressed in ragged orange clothing was brought before the people of England to hear their final judgement. That woman was none other than right-wing politician as well as short-term dictator of the British Isles Theresa Brasier. To think that what seemed to be such a feeble, battered, weak person was the one to have instilled fear into the hearts of millions was barely conceivable. In fact, in front of such a pitiful spectacle, many would have, in the past, given up on the fate that was to be bestowed upon her. But now was not the time for pity. Had she felt the same towards those poor people she had left to die in her concentration camps? Of course not! In unison, the freed asked for blood, and blood they received. one fell swoop of the patented guillotine, and it was over. Everyone knew that other important figures of the Phoenix Front were still at large, plotting for their return. But for now, one death seemed to have avenged countless others"
 britain.254.o1:0 "To kill a Phoenix, cut off its bloody head."
 britain.255.t:0 "Real Punishment"
 britain.255.d:0 "Braiser cannot be allowed to just die and let this all go, she will live knowing she cause terrible acts in this country, she will live and watch as the country removes her policies and embraces everyone with all diffferent types of lifestyles and cultures. She will watch as the UK looks down on her and laughs as she rots in her prison."
 britain.255.o1:0 "Justice is sweet"
 britain.256.t:0 "Real Punishment"
 britain.256.d:0 "Now the Phoenix has offically been removed we can started to educate our young on what is the true correct path in this country, we can also change things back to the old way before the fronts crazy system was implemented. We have to restore Britain back to what is used to be and make sure that no other extreme party can ever come to power again the way Braiser did."
 britain.256.o1:0 "Lets rebuild together" 
 britain.257.t:0 "Removal of evil"
 britain.257.d:0 "Now the phoenix is removed we need to destory and remove the work camps Braiser and her dictatorship created, we must also remind people of the atrocities that did occur here. We will also dismantle her TV station and any references relating to the phoenix front will be made illegal."
 britain.257.o1:0 "Britain has finally returned" 
 britain.258.t:0 "Snap Election"
 britain.258.d:0 "Britain has finally returned back to a democratic state, now the phoenix has all be gone we can now prepare a new goverment who will govern for the interest of the people. Its time to finally return back to the polls and see what party the people of the United Kingdom will choose to lead them after a broken country has finally been repaired"
 britain.258.o1:0 "Conservative Party"
 britain.258.o2:0 "Liberal Democrats"
 britain.258.o3:0 "Social Democrats"
 britain.258.o4:0 "Labour Party"
 britain.258.o5:0 "Independent Labour Party"
 britain.258.o6:0 "The New Labour Party"
 britain.259.t:0 "SDP Election"
 britain.259.d:0 "The time has come to elect a new leader for the SDP. David Owen took control of this country and made it what it is today. Shirley Williams has done a great job controlling where the party should go and how it should govern Britain but now we must choose whether to stay with her or new leadership"
 britain.259.o1:0 "Rishi sunak"
 britain.259.o2:0 "Neil Carmichael"
 britain.259.o3:0 "Amy Callaghan"
 britain.259.o4:0 "Miriam Cates"
 britain.259.o5:0 "Tony Blair"
 britain.260.t:0 "LibDem Election"
 britain.260.d:0 "It has come to pick a new leader for the liberal democrats, Nick clegg has taken the party into the 2010s and now we choose whether to stick with Clegg or to choose a new leader who can govern the UK"
 britain.260.o1:0 "Nick Clegg"
 britain.260.o2:0 "Ed Davey"
 britain.260.o3:0 "Jo Swinson"
 britain.260.o4:0 "Vince Cable"
 britain.260.o5:0 "Daisy Cooper"
 britain.659.t:0 "VideoWire Bought"
 britain.659.d:0 "Firefox is buying video-sharing website VideoWire for 1.65bn dollars (883m pounds) in shares after a weekend of speculation that a deal was in the offing. VideoWire, launched in February 2005, has grown quickly into one of the most popular websites on the internet.It has 100 million videos viewed every day and an estimated 72 million individual visitors each month."
 britain.659.o1:0 "The great technology industry"
 britain.658.t:0 "Apple introduces the iPhone"
 britain.658.d:0 "Apple today introduced iPhone, combining three products — a revolutionary mobile phone, a widescreen iPod with touch controls, and a breakthrough Internet communications device with desktop-class email, Web browsing, searching and maps — into one small and lightweight handheld device. It will come in two versions - one with 4GB of storage space, the other with 8GB."
 britain.658.o1:0 "Apple again creates the future"
 britain.264.t:0 "CANZUK Talks"
 britain.264.d:0 "Today leaders from Australia, Canada and New Zealand met with UK leaders to begin talks about new trade deals, freedom of movement. Talks about how all the countries can unite to create a strong Economy, easier access to travel as well as many more great benefits for all four countries!"
 britain.264.o1:0 "A New Friendship"
 britain.169.t:0 "2014 General Election"
 britain.169.d:0 "This year's general election campaign has been a tumultuous one, with false accusations from either side and various scandals involving every politician under the sun. With this in mind, the British people now have the opportunity to voice their concerns by voting for their next Prime Minister."
 britain.169.o1:0 "Conservative Party"
 britain.169.o2:0 "Liberal Democrats"
 britain.169.o3:0 "Social Democratic Party"
 britain.169.o4:0 "Labour Party"
 britain.169.o5:0 "Independent Labour Party"
 britain.169.o6:0 "New Labour Party"
 britain.169.o7:0 "The Green Party"
 britain.266.t:0 "Marriage Tax Breaks"
 britain.266.d:0 "The Traditional Conservative party have announced that those who are married will receive tax breaks to help them in their either new married life or rewardsing their success staying together for true british values."
 britain.266.o1:0 "Traditional Values"
 britain.267.t:0 "Better privatisation"
 britain.267.d:0 "The nations debt has reached levels we cannot allow to go on anymore. Any nationalised industry will be either privatised or cut to save as much money the country can save. The tory party will encourge more businesses to take over state run businesses to allow more jobs and investment."
 britain.267.o1:0 "Keep the NHS in public hands"
 britain.268.t:0 "Stronger Borders"
 britain.268.d:0 "Civil war is taking over Europe, we must ensure that Britian stays strong during these uncertain times therefore new security will be introduced to keep our country safe and any communists will be kept out!"
 britain.268.o1:0 "No To The Reds"
 britain.268.t:0 "Stronger Borders"
 britain.268.d:0 "Civil war is taking over Europe, we must ensure that Britian stays strong during these uncertain times therefore new security will be introduced to keep our country safe and any communists will be kept out!"
 britain.268.o1:0 "No To The Reds"
 britain.269.t:0 "Cut Foreign aid"
 britain.269.d:0 "We give away money to countries which do not look after their people, they keep the money for the rich and powerful, we could use this money to pay for our soldiers and keep our money for future projects that we may create."
 britain.269.o1:0 "Money for us!!"
 britain.270.t:0 "Veterans Administration Department"
 britain.270.d:0 "We shall establish a department to keep all soldiers, veterans and any royal service to our country safe. This department will ensure all of those loyal to service our great nation will be kept off the streets, giving free housing, less tax and many benefits for keeping us all safe."
 britain.270.o1:0 "Money for us!!"
 britain.271.t:0 "Less tax for families"
 britain.271.d:0 "Rising a family this this country is vital to keep the British traditions alive here. We must make sure the people of this country know that and will be rewarded for brining up children and becoming a tree British citizen. We will establish tax breaks for those who deserve it."
 britain.271.o1:0 "Family First"
 britain.272.t:0 "More funding for schools"
 britain.272.d:0 "Schools across the country have been left in hideous states, the north needs investment and quickly, schools will be rebuilt or renovated to meet modern times while the rest of colleges, universities and any educational building will be giving great funding to teach our younger generation!"
 britain.272.o1:0 "Education Education Education"
 britain.273.t:0 "Tougher criminal sentances"
 britain.273.d:0 "Previous governments have allowed criminals to get away easily with a slap on the wrist EVEN for serious crimes. This will be stopped as we will impose harsher longer sentences for those committing crimes and show the people they no longer need to worry about walking alone at night."
 britain.273.o1:0 "Hopefully this shall help"
 britain.274.t:0 "Not part of the EU"
 britain.274.d:0 "We maybe IN Europe but we are not part of it and we will never bow down to communist rule. We are British and we created and found democracy, it’s one of our proudest creations and we will enshrine that it stays this way. The borders of Britain will be upgraded and better reforms will take place to prevent any left-wing influence attacking our great nation."
 britain.274.o1:0 "Fight The Reds Away"
 britain.275.t:0 "Real care for the elderly and disabled"
 britain.275.d:0 "The benefit system is not fair for everyone, the disabled are not getting a fair share, those who cannot work are not receiving what they should be getting. We will reform this and make it a fairer better system! The elderly we will up their state pension and make sure they are giving more money during winter and less bills to pay."
 britain.275.o1:0 "Care For All"
 britain.276.t:0 "Our Skilled Workers"
 britain.276.d:0 "Today the liberal democrats will establish independent Educational Standards Authority, this will make sure all young adults who leave education are trained and skilled the best they can for this modern world. Those who are out of work for a long duration of time will work for the state and be given a good wage. We will put Britain back to work."
 britain.276.o1:0 "Work For All"
 britain.277.t:0 "Affordable homes created"
 britain.277.d:0 "We will be bringing 250,000 empty homes back into use which will house many families, less tax for first time buyers with Bursaries to help those get a house. We will make sure all ppeople who want to buy a house can afford to!"
 britain.277.o1:0 "Housing the country"
 britain.278.t:0 "Cleaner and better transport"
 britain.278.d:0 "The transport industry is old and weak, its unreliable and costs much to run as well as attacks our environment. We are going to create all electric buses and taxis and these will run all over our country, we will also make sure all checks are made on cars and more vehicles watch their emission limits. "
 britain.278.o1:0 "Fixing the enviroment" 
 britain.279.t:0 "Reform building standards"
 britain.279.d:0 "Housings and many buildings are outdated and need to be fixed and modernized. We will put much funding into this and prevent any catastrophic disasters to happen to large social buildings. We care for the people and we need to make sure all buildings are safe for all. "
 britain.279.o1:0 "Remove Cladding"
 britain.280.t:0 "working for the future"
 britain.280.d:0 "As innovation transforms the country and the world jobs need to be ready for this transformation too. The social democrats are ready to train up the people of tomorrow and be ready for any challenge. This will make Britain strong and we will lead the world in new technology."
 britain.280.o1:0 "Tomorrow is the future"
 britain.281.t:0 "Immigration Point System"
 britain.281.d:0 "We need to make sure who we are exactly letting into our country. We do not know who we let in every day. The point system will do this. It’s a fair system and those who wish to work here will get their visa if they wish to provide their service and can stay here as long as they wish as long as it benefits all."
 britain.281.o1:0 "A fairer system"
 britain.282.t:0 "Owens Future Plans For The UK"
 britain.282.d:0 "David Owen was the best prime minister of this country since Churchill. He stopped our great nation fall apart and kept it going while the rest of the world fell to communism and American became the divided states of America. Owen wanted the best for the UK and we will keep to his promises. We will make more welfare and better social services for the people of this country as well as push our economy further."
 britain.282.o1:0 "RIP David Owen."
 britain.283.t:0 "Raise Wage For The People"
 britain.283.d:0 "Labour will raise the Living Wage to £10 an hour, giving low-paid workers on average 2,500 pounds a year extra in their pockets. We will also ensure all NHS staff, police and fire services are giving a pay rise for their hard work to keep our public safe and well. This is the first of many changes labour will make to keep this country strong and stable."
 britain.283.o1:0 "Service to our nation is rewarded"
 britain.284.t:0 "More Officers On Our Streets"
 britain.284.d:0 "As crime rises so does the need for police officers. We will high over 20 thousand officers to keep our streets safe, we will stop crimes and those innocent people being attacked and bring justice to those who need it. We will also reform our security forces making sure surveillance agencies can watch our island and protect it."
 britain.284.o1:0 "Keeping Britain safe"
 britain.285.t:0 "Regional Employment"
 britain.285.d:0 "Labour will make sure every region in the United Kingdom has low unemployment, with people working in a fair equal society. Which supports everyone who needs jobs in a fair strong society. Labour will work with private companies to make sure they are hiring the right amount of people giving them the change to be treated fairly while unions stand by"
 britain.285.o1:0 "More Jobs."
 britain.286.t:0 "Fairer modern welfare"
 britain.286.d:0 "The National Care Service will make sure that social care is 21st century ready and can provide for all those who need it! Free school meals and Free full-fibre broadband and better more equal benefits to those who need it. There are many great things we can offer our people as long as we do not overspend we can provide well enough for our people."
 britain.286.o1:0 "21st Century Welfare"
 britain.287.t:0 "Give EU nationals right to remain"
 britain.287.d:0 "As EU nationals leave their homes due to civil war or uncertainty, they seek safe places to stay. We can offer these refugees safety and freedom. Show them what real democracy is and how much a real democratic government can make peoples lives better and more fairer."
 britain.287.o1:0 "Safe Homes, Safe Passage"
 britain.288.t:0 "Removal of tuition fees"
 britain.288.d:0 "Labour has a plan to make real change for students. No matter our background, we all deserve to grow our knowledge and skills and when everyone has the chance to learn, whole communities benefit. That's why Labour will scrap tuition fees and make higher education free for all."
 britain.288.o1:0 "Education free for all"
 britain.289.t:0 "The LGBT community"
 britain.289.d:0 "Labour will introduce same sex marriage. This is not to be debated, this will be signed straight into law as this is something that is to be a human right. Those cannot help who they fall in love with and we should not look down upon this either. Same sex marriage is now free and we will appoint a department to ensure their rights are kept."
 britain.289.o1:0 "Progressive Movements are made"
 britain.290.t:0 "Nationalisation extra services"
 britain.290.d:0 "The people of this country are still struggling to pay bills or feel as if they may still pay too much for transport. We will make sure our nationalising plan will make every person in this country able to pay their bills like gas and water on the cheap."
 britain.290.o1:0 "Better lives for all"
 britain.291.t:0 "The Cuban Meeting.."
 britain.291.d:0 "Jeremy Corbyn has meet the leader of Cuba in what many critics are calling a true communist shift which will come to the UK very very soon…Meanwhile the labour party have protested this and told the people of Britain that this is to see how the party can improve life here under a socialist way and build better relations with the communist block."
 britain.291.o1:0 "Viva La Corbyn"
 britain.292.t:0 "Better Relations With The EU"
 britain.292.d:0 "The EU is only across the channel from us, it would be best to start working together in future projects for the sake of human kind. Working together has never been more important like preventing pointless wars which could breakout and preventing other nations from going to war with each other."
 britain.292.o1:0 "A Red Relationship"
 britain.293.t:0 "Modern Social Housing"
 britain.293.d:0 "We have reached the 2010s. Yet many social housing has not been bothered with since the 70s or 80s. This not good at all. All social housing from flats to houses will be modernized and let the people who live in those places be given a chance to enjoy modern live under a socialist policy."
 britain.293.o1:0 "Housing for the future"
 britain.294.t:0 "Strong Renewable Energy"
 britain.294.d:0 "We will build solar farms, wind farms and many more energy industries. We will stop all fossil fuel buring naandd cut climate change so we keep out country breathing clean better air. The green party was created to save Britain from fossil fuels and that is what we will do!"
 britain.294.o1:0 "The Real Green Party"
 britain.295.t:0 "Cutting war funding"
 britain.295.d:0 "Wars are being fought for pointless reasons meanwhile the UK is not and has not for a very long time. Its time we cut this pointless funding and put it into resources that are needed such as extra funding into state works like the NHS or police force, things that reall do matter!"
 britain.295.o1:0 "Hopefully this wont bite us"
 britain.296.t:0 "legalise weed"
 britain.296.d:0 "Weed is looked at in the wrong view as many people are imprisoned because of it, the green party does not agree with this and it can even be taxed because of it. There are many positives to weed being legal and that is what we shall do. Making sure it works well but it is given the right regulation it is needed. "
 britain.296.o1:0 "Is this right?"
 britain.297.t:0 "More NHS Funding"
 britain.297.d:0 "Each party including labour has their own views on how to safe and keep the NHS running. We know as we are people who use it, not private health care. We know what must be done and how it should properly be funded and we will make sure the waiting lists are cut allowing people to get seen to asap."
 britain.297.o1:0 "God Save The NHS"
 britain.298.t:0 "Proposal For CANZUK"
 britain.298.d:0 "As the leaders sat down all from their 4 countries, they looked at each other, letting each one talk. As each one of them spoke and told each other what they wanted best for their country, the other leaders nodding in agreement. By the end of the meeting folders were collected. Inside of those folders signatures from each of the four leaders agreeing to begin the transition to trade, freedom of movement and many more which will present itself when the movement begins. Canada, Australia, New Zealand and the United Kingdom have started the process for CANZUK. This truly is a start to something new. The question is how will the rest of the other unions and leagues take this?"
 britain.298.o1:0 "CANZUK BEGINS!"
 britain.661.t:0 "Meet With Canada"
 britain.661.d:0 "The UK leaders have shook hands with the leaders from Canada. Photographs were taken and more letters were signed. The United Kingdom has agreed a new great trade deal with Canada, lifting import tariffs for cheaper goods to be bought with easy access. The people of both nations can now easily visit each other. Businesses can operate closely and most of all. The relationships between the two old nations have been brought to a new all time high. This really is the start of something new."
 britain.661.o1:0 "Anglo and Canada Relations"
 britain.662.t:0 "Meet With Australia"
 britain.662.d:0 "The UK leaders and shook hands with the leaders from Australia. Photographs were taken and more letters were signed. The United Kingdom has agreed a new great trade deal with Australia, lifting import tariffs for cheaper goods to be bought with easy access. The people of both nations can now easily visit each other. Businesses can operate closely and most of all. The relationships between the two old nations have been brought to a new all time high. This really is the start of something new."
 britain.662.o1:0 "Anglo and Australian Talks"
 britain.301.t:0 "Meet With New Zealand"
 britain.301.d:0 "The UK leaders and shook hands with the leaders from New Zealand. Photographs were taken and more letters were signed. The United Kingdom has agreed a new great trade deal with New Zealand, lifting import tariffs for cheaper goods to be bought with easy access. The people of both nations can now easily visit each other. Businesses can operate closely and most of all. The relationships between the two old nations have been brought to a new all time high. This really is the start of something new."
 britain.301.o1:0 "Anglo And New Zealand Meeting"
 britain.663.t:0 "Australia Trade Talks"
 britain.663.d:0 "The Department of Foreign Affairs and Trade made an announcement in front of live TV and press saying “The UK is one of Australia’s most enduring partners. We have a shared commitment to the rule of law and to an open and rules-based international trading system. Our common heritage, values and strategic interests mean that we work closely together across a wide range of international issues. Both countries are committed to removing trade barriers and creating new opportunities for business, and believe a deep and dynamic agreement can send a clear signal to the world that both the UK and Australia are prepared to fight protectionism and advance free and fair trade."
 britain.663.o1:0 "Joint together by the crown"
 britain.303.t:0 "New Zealand Trade Talks"
 britain.303.d:0 "The UK’s and New Zealand’s objective is to secure a high quality, comprehensive and inclusive trade agreement with the United Kingdom that builds on our existing strong relationship. This deal will involve An agreement that provides comprehensive and commercially meaningful access for exporters by removing tariffs and reducing other barriers that impact goods and services trade and investment activity as well as including environment, climate change and labour. This deal will make it easier for both parties."
 britain.303.o1:0 "This could be tricky.."
 britain.304.t:0 "Canada Trade Talks"
 britain.304.d:0 "The UK has secured a trade deal with Canada that will secure a strong relationship with both with the leader of Canada who hailed it as a “fantastic agreement for Britain, which secures transatlantic trade with one of our closest allies. The International trade secretary said the deal would provide “certainty for thousands of businesses. This really is a new beginning for the UK and Canada and will only get better once its written into law."
 britain.304.o1:0 "United once again!"
 britain.305.t:0 "Freedom Of Movement"
 britain.305.d:0 "Britons and Australians, Canadians and New Zealanders are in line to soon have greater opportunities to live and work in each other’s countries, with trade deal talks between the two nations placing freedom of movement at the fore of negotiations. As talks begin to end and all the parties agreeing with each other. Pens have been put to paper and now begins the chance for people to move around countries with cheap easy access."
 britain.305.o1:0 "A huge step for CANZUK"
 britain.306.t:0 "Stronger Jobs"
 britain.306.d:0 "Job opportunities have become a much talked about subject within the CANZUK debate, the process of creating many jobs and businesses working closely together with countries like Canada, UK and Oceania can build lots of confidence with economies. Now CANZUK has begun so can the jobs and creation of businesses inside of this union."
 britain.306.o1:0 "Stronger better jobs together"
 britain.307.t:0 "Working Together"
 britain.307.d:0 "CANZUK has been created, all four nations are not working together to create fantastic job opportunities, allow people to move around easily between the countries and watch all our economies grow strong and powerful! We can continue to work together to create even more fantastic new opportunities for the future of this new union, this is only the start of CANZUK and we believe it is only going to get strong and our relationships between our four nations will become great."
 britain.307.o1:0 "The Four Nations Become One Union"
 britain.308.t:0 "Future Research"
 britain.308.d:0 "Now we have achieved everything we set out to do, its time we begin progress on the future and make this friendship even stronger. We can collaborate our technology and science together to fight off diseases and make great advancements in our technology. Combining this as well as many other things. We will definitely rival many other countries and unions and could be looked at one strong powerful union."
 britain.308.o1:0 "The future begins now."
 britain.311.t:0 "The Phoenix Election Pledge"
 britain.311.d:0 "As election day approaches, political parties get ready to show the UK what they will do if they get into power and how they will be able to change the country in their own vision. The main political parties are sticking to their normal tactics of gaining votes unlike another party which has recently just been formed.\n\nThe Phoenix Front have been on televisions up and down the country spreading their hate messages how Britain is no longer for the real British people. Recently they have sent a dark message about the non-British folk..How the front will deal with those who do not meet their standards in the country..Questions are being raised about how they will deal with those who do not meet the perfect English image…For now democracy stands.."
 britain.311.o1:0 "How Fast Things Can Change"
 britain.312.t:0 "Braiser Takes Over"
 britain.312.d:0 "Ladies and Gentlemen, Theresa Braiser has been made temporary leader of the English Isle. Braiser, a controversial woman to say the least has been seen leaving Parliament with a smile on her face and a crowd cheering her on. Opponents of the Front have remained quiet for now, most likely due to the overwhelming support of Braiser. In show of support, Front flags have been raised all down the abbey, and the Queen is said to be returning back to the palace. Will Braiser be gone in a couple months, or will she be able to solve the problems present."
 britain.312.o1:0 "How Fast Things Can Change"
 britain.313.t:0 "Welcome To 2010 Britain"
 britain.313.d:0 "Ladies and Gentlemen welcome to the BBC as we ring in the 2010s. Britain stands ready at the helm of the world ready to take on any challenge we’re given. I am proud to say I am English; I boast about it in fact. David Owen, and I’m surprised I’m saying this, has saved this country, and truly we are blessed to have him in our leadership. If this year is anything like the past, Owen will introduce reforms unheard of, change our country and unite us with the rest of the democratic powers. I for one look forward to Britannia’s future."
 britain.313.o1:0 "The 2010s Are Finally Here"
 britain.314.t:0 "Working Close"
 britain.314.d:0 "Good Evening Ladies and Gentlemen, welcome to the BBC. Jumping into tonights news, 3 Libyan refugees have been arrested in downtown Edinburgh for alleged sex trafficking, the Queens dog bit a guard, and more trouble is brewing in the Americas\n\nBut First, Prime Minister David Owen has announced plans to work closer with the Irish nation. This proposition will include free movement between the two, through the contested port of Ulster that is. A fair-trade deal with a lowering of tariffs is also said to be included in this deal."
 britain.314.o1:0 "A New Relationship"
 britain.315.t:0 "The Northern Ireland Peace Process"
 britain.315.d:0 "Good Evening Ladies and Gentlemen, welcome to the BBC. Jumping into tonight’s major news, Prime Minister David Owen continues with his unity initiative by expanding the free movement between the countries of our Isle. According to a statement put out by his office, this new initiative will allow weaken our borders with Ireland and Ulster, essentially allowing anybody and everybody to come into the country."
 britain.315.o1:0 "The Closer Relationship With Our Friends"
 britain.316.t:0 "Movement Between Islands"
 britain.316.d:0 "Good Evening Ladies and Gentlemen, welcome to the BBC. Jumping into tonight’s major news, Prime Minister David Owen continues with his unity initiative by expanding the free movement between the countries of our Isle. According to a statement put out by his office, this new initiative will allow weaken our borders with Ireland and Ulster, essentially allowing anybody and everybody to come into the country"
 britain.316.o1:0 "Build Bridges Not Walls"
 britain.317.t:0 "The New Friendship"
 britain.317.d:0 "BBC reports that Prime Minister David Owen and the Canadian PM have met in London today. In what’s called a historic move, the Canadian PM has come to London for the first time in 10 years. Among the discussion is the continuing American Refugee problem in Canada and if England might be able to alleviate this issue. Among this, Owen is expected to convince Canada to join the Free Movement program, in an effort to promote unity among the old allies."
 britain.317.o1:0 "Two Old Friends Meet Again"
 britain.318.t:0 "League and Protection Exercises"
 britain.318.d:0 "Good Evening, my name is Andrew Neil with the BBC and here is todays top story. Folks from the Orkney Islands woke up to a banger of a surprise this morning as the combined militaries of the UK and Canada conducted wargames among unpopulated areas. According to eyewitness reports, it seems as if the target of these exercises was to gauge the preparedness of our troops against the communists. Is this a sign of a coming war?"
 britain.318.o1:0 "A more secure future"
 britain.319.t:0 "The Lion and The Maple Leaf"
 britain.319.d:0 "Good Evening, my name is Andrew Neil with the BBC and lets jump into todays historic news. At 10 Downing Street earlier today, crowds gathered to watch as the Flags of England, Ireland and Canada were raised together. As a show of solidarity and unity, Prime Minister David Owen ordered the raising of the flags. Crowds of Canadian, English, Irish, and more gathered outside the residence and cheered as the flags rose\n\nThis move is not only to show solidarity with our allies, but it’s to show the world that England won’t quit. We still stand strong, even against the communist threat of the Soviet Union"
 britain.319.o1:0 "Three Nations United"
 britain.320.t:0 "The punishment and reforms"
 britain.320.d:0 "Good Evening, my name is Andrew Neil with the BBC. Jumping into tonights news, Prime Minister David Owen announced the passing of the Punishment and Reform bill of 2008. This bill while criticised by many for raising Government Spending, will allow for the hiring of 15,000 more police officers across the nation and direct more funding for courts to process crimes. Civil Rights groups across the nation are calling for protests as they believe this bill will allow for police to unnecessarily use force\n\nPersonally England, I believe this bill will make our streets safer, it’s finally time we fight the crime that’s plagued our streets for too long.The streets are now more alive with police and community officers making sure the people keep to the law. Crime has dropped and now more police officers have more powers to stop people who they believe are guilty."
 britain.320.o1:0 "Its time we are tough on crime!"
 britain.321.t:0 "Democratic Reform"
 britain.321.d:0 "Good Evening Folks, and welcome to the BBC. Our top story is Shirly Williams election reform, which has divided our country even more. While analysts say that her reform does enfranchise the lower classes and could possibly lead to a larger turn out, Conservatives are calling this a cheat for the labour party. Coming up at 7 is a panel of experts to explain this even more."
 britain.321.o1:0 "A change in the voting system"
 britain.322.t:0 "Fix The Pound"
 britain.322.d:0 "The government has announced they are going to start working on fixing the economy and try to prevent extra borrowing. A new jobs scheme will be created to slow down the unemployment in the country and prevent another recession from occurring."
 britain.322.o1:0 "A strong currency for the future"
 britain.323.t:0 "The Second British Civil War"
 britain.323.d:0 "Theresa Braiser is dead. Nigel Farage is leader of the British Isle..Or so we thought..After Farage becoming chancellor many in the phoenix were unsure of his leadership due to his close ties with David Cameron and his idea of the “New Tory Party. Britain has changed for the better in the fronts eyes and they wish to keep it that way. Many across the country however have other ideas of how the Isle should be run. \n\nNorthumbria, Mercia, Cornwall, and other states have declared independence forming their own state-run governments. Farage has declared this act completely illegal and those who rise against the phoenix rise against Britain..Its time for war.."
 britain.323.o1:0 "A Very British Civil War"
 britain.322.o1:0 "A strong currency for the future"
 britain.324.t:0 "The Left Take Power"
 britain.324.d:0 "After the incredible result from Shirley’s snap election, it seems Jeremy Corbyn’s party has won. The people have chosen a far-left wing party to take control of the country. Already the pounds value has dropped against the dollar and even the euro! Jeremy Corbyn was joined on stage with his left-wing comrades cheering returning from his meeting with the queen to form a new government. His vision of a new national health service, free transport systems and a complete rebuild of Britain has brought joy to many but also concern for some..even the communist party are still unhappy with this victory..time will tell how this plays out.."
 britain.324.o1:0 "The Red Flag Rises"
 britain.325.t:0 "The Tube Attacks"
 britain.325.d:0 "“Folks, I wish I could say this was a good evening, but today..tragedy has struck the nation. This morning as Londoners took their usual transportation to work, bombs went off all over the city. Buses, and the tubes were destroyed, and over 100 people were injured. While we may not know who is responsible for this heinous act, we can only guess. I ask Londoners to come together in this time, regardless of political affiliation. I, a good Christian will be praying for the victims of this morning, and for a recovery of those injured in the event."
 britain.325.o1:0 "We Shall Remember Those Lives Lost"
 britain.326.t:0 "Braiser Gains The Country"
 britain.326.d:0 "Ladies and Gentlemen, Theresa Braiser has been made temporary leader o the English Isle. Braiser, a controversial woman to say the least has been seen leaving Parliament with a smile on her face and a crowd cheering her on. Opponents of the Front have remained quiet for now, most likely due to the overwhelming support of Braiser. In show of support, Front flags have been raised all down the abbey, and the Queen is said to be returning to the palace. Will Braiser be gone in a couple months, or will she be able to solve the problems present."
 britain.326.o1:0 "The United Kingdom Has Changed Forever.."
 britain.327.t:0 "Royal Tree"
 britain.327.d:0 "Ladies and Gentlemen welcome to the BBC. In tonight’s news, France and Italy continue to collapse as the pillars of communism falls, America is on fire once again and what is going on with Spain’s royals? But first, The Queen has officially taken power in the English Government and for once, I believe this is a good thing. Think about it, what has democracy brought us, crime and villainy prowling our streets. With the Queens reforms, order has been returned to our street, illegals are being deported and the military is a force to be reckoned with once again. I say we each owe a Hail to the Queen."
 britain.327.o1:0 "Rebuild The Country"
 britain.328.t:0 "Corbyn Has Made History"
 britain.328.d:0 "Good afternoon and let me get right into it. Folks, I wish to give an apology to Prime Minister Corbyn. Since his first days in office, I have been extremely critical of his policies and ruling, but he has proven that socialism on some scale works. Crime in our cities is down, I no longer run into homeless on the streets and quite frankly it’s nice to be equal with others. The question is, why don’t we go further? I feel as if we need to push the bounds of communism."
 britain.328.o1:0 "A Change Has Come"
 britain.329.t:0 "Northumbrland Goes It Alone"
 britain.329.d:0 "Northumberland has had enough of the London rule and the carnage Theresa Braiser has created in the nation. For many years the north has been left to rot and suffer due to much lack of funding from past governments and broken promises.\n\nThe people in the north were given a vote whether to leave or remain in the union and overwhelmingly chose to leave the union. Although the Phoenix Front has viewed this as an illegal act, they chosen to focus more on Scotland and Wales rather than attacking the North but many suspect that Farage will order her army to take back the north.\n\nJamie Driscoll will take over from his current role as mayor of the north and will put the state into a socialist fair, equal country which will help and work with Scotland and Wales for their future."
 britain.329.o1:0 "The North Finally Gets It Right"
 britain.330.t:0 "The Recap"
 britain.330.d:0 "Ladies and Gentlemen. The Prime Minister is dead. Shot dead by a Soviet gunman, We at the BBC can not begin to explain this event. Our government has not been this chaotic since the Second World War. Many citizens across the country rightfully fear for what their future may look like, and I for one can sympathize with them. Our government has been teetering on an edge since the fall of the Americans, and truthfully folks, I wish I could comfort you all in this hour, but I like you fear for Brittania."
 britain.330.o1:0 "A truely sad day for Britain"
 britain.331.t:0 "Shirley Williams Speaks"
 britain.331.d:0 "People of England, I come to you now in a position I never thought I’d be in. My predecessor lost his life in a tragic way and left the country in a state of fear. I will aim to not only finish what he started but expand upon it. I will make sure that England will not fall to communism like the rest of Europe, nor will we fall to far-right extremism. Our country has weathered disaster before, our people are strong and I truly believe we will prosper in the wake of this!"
 britain.331.o1:0 "Remember Him"
 britain.332.t:0 "The Queen Addresses The Nation"
 britain.332.d:0 "“Ladies and Gentlemen, We at the BBC interrupt your regularly scheduled program for a message from her Royal Majesty.\n\nLoyal Citizens of Brittania, I come to you in this dire time. The last time I appeared on your television was christmas, but today I am not here on a joyous occasion. Instead, I am here to rally you all together. We weathered the London Bombings; we have weathered the loss of all our allies, and now we have been forced to weather the assassination of David Owen. Shirley Williams has been forced into a position she never saw herself in, yet I have endorsed her to form a new government. I promise, to not just you, but to the world that England will not fall. Britannia will continue to sail. I will remain at your sides, and we shall persevere. It is not enough to say, “Keep calm and carry on but instead we should all ask, “How can I help.  Help your fellow citizens, and we shall not fall\n\n“Truly inspiring, we now return you to Doctor Who."
 britain.332.o1:0 "A Calm Voice In Times Of Need"
 britain.333.t:0 "Calm The Nation"
 britain.333.d:0 "Ladies and Gentlemen welcome to the BBC. In todays news, the Italian government continues to face mounting pressure with its response to the Libyan refugee crisis, Jean-Luc Melenchon may be forced out by the French Politburo, and we go out onto the streets to get citizens view on Shirley Williams government. But first, In a speech given to the Parliament today, Prime Minister Shirley Williams has outlined her governments goal of supressing extremism in the country, while preserving our democratic system. She urged not only members of Parliament but ordinary citizenry to remain calm and not to allow themselves to fall to the allure of extremism in the country. After this speech, her approval numbers rose to 67%, a new high."
 britain.333.o1:0 "Parliament Debates"
 britain.334.t:0 "Today We Mourn"
 britain.334.d:0 "“Welcome to the BBC as we cover this sombre event. As you can see, the casket of former Prime Minister David Owen is being drawn by horse past Hyde Park. Thousands line the street, weeping for our fallen PM. While the police force has been bolstered for the event in fear of a reprisal, many have remained orderly."
 britain.334.o1:0 "RIP Our Dear Leader"
 britain.335.t:0 "Today We Mourn"
 britain.335.d:0 "“Welcome to the BBC as we cover this sombre event. As you can see, the casket of former Prime Minister David Owen is being drawn by horse past Hyde Park. Thousands line the street, weeping for our fallen PM. While the police force has been bolstered for the event in fear of a reprisal, many have remained orderly.\n\nAs his body is now in front of Westminster Abbey, many politicians from around the country are preparing to give a eulogy for the man. Included in this ceremony we can see Robert Ford of Canada, and surprisingly both Jeb Bush and Donald Rumsfeld of the American Republic. While not in attendance, the German government has expressed their deepest sympathies.\n\nFor now, as the eulogy beings, we ask you to remain silent."
 britain.335.o1:0 "RIP Our Dear Leader"
 britain.336.t:0 "Today We Mourn"
 britain.336.d:0 "“Ladies and Gentlemen, we interrupt your regularly scheduled program for a message from Prime Minister Shirley Williams.\n\n“Citizens of London today were struck by tragedy once again. As thousands took their normal commute to work, the transportation of the city exploded, killing more than 50 and injuring hundreds more. My sympathies go out to the families of those involved today, and I plan to personally visit each person. This attack was not made with the goal of advancing a political cause, but instead it was done with the objectives of causing fear and hatred among our fellow people. I continue to ask our countrymen to rise above extremism and to help your fellow men.\n\n“That..that’s it? Okay I guess. We’re going to return you to Doctor Who, and I guess we’ll cover this later tonight at 8."
 britain.336.o1:0 "Short Speech?"
 britain.337.t:0 "Thersea Braiser Leaves The Conservative Party"
 britain.337.d:0 "Good Evening folks and welcome to the BBC. In tonight’s news. Conservative party member Theresa Braiser has left the party and formed her own political group “The Pheonix Front”. According to a press conference held by Braiser herself, the Front will seek to restore morality to the English. Braiser blames open borders, and Labour liberalization of the country for the terror attacks in our streets. She also blames refugees from Europe and the middle east for the destabilization of the country. Will she ever see office, that remains to be seen?"
 britain.337.o1:0 "As if this will get any public notice"
 britain.338.t:0 "Arming The Police"
 britain.338.d:0 "Folks, Welcome to the BBC. Tonight, protests have broken out across London and the rest of the country as bill PS 34 has passed parliament with an overwhelming majority. This bill has allowed police to openly brandish loaded assault rifles and expand their powers. Since recent terror attacks, we have seen London turn into a dystopian police state, where those suspected of being affiliated with right wing groups are being persecuted without due process. Ladies and Gentlemen, as much as I hate seeing London turned into this, I am happy to say I feel safe on the streets once again."
 britain.338.o1:0 "Protecting Britain is a must"
 britain.339.t:0 "Shirley Is Struggling"
 britain.339.d:0 "Shirley Willaims has been struggling since coming into power to take control of the country many events have caused her position to be unstable and now she is having to face the music. Its time to see whether she is able to stay in power or let someone else try.."
 britain.339.o1:0 "A shakey start"
 britain.340.t:0 "Cornwall Independence"
 britain.340.d:0 "Cornwall has thrown out all of the phoenix front members and will no longer be part of a nation that destroys its own citizens. From this moment on Cornwall will no longer be part of Britain or the union and will declare its independence and move forward as a strong nationalist nation which its people will work together to build their state into a powerhouse and defend itself against the Phoenix Front if it tries to attack again."
 britain.340.o1:0 "Cornwall Is Free"
 britain.341.t:0 "Scottish Independence"
 britain.341.d:0 "Fireworks lit up the sky over Edinburgh castle and people partied through the night as night clubs reopened to the people and families and friends met up carefree being able to do what they want without worry. Alex Salmond addressed the people earlier that day to announce “My fellow Scots men and woman, today we have finally broken free of English rule and can now decide the fate of our own nation. Nigel Farage and his disgusting fascists are no longer in command of us and we can finally restore our democratic values to our nation”.\n\nCanada, Ireland and other nations congratulated Alex and Scotland on its independence and announced they look forward to working with them for trade and democratic values. Meanwhile Farage has condemned the nation for leaving the union and has already announced that Scotland will be reunited, and the union will be restored!"
 britain.341.o1:0 "Scotland Has A Leader (Play As Scotland)"
 britain.341.o2:0 "Scotland Breaks Free"
 britain.342.t:0 "The Queen Speaks To Her Kingdom"
 britain.342.d:0 "Ladies and Gentlemen, we apologize for interrupting Luther, in a few moments Her Royal Majesty and now head of Government Elizabeth Windsor the Second will speak to you the people.\n\nA Few Moments Later..\n\nLoyal Citizens of Brittania, many of you have called me a tyrant, a dictator, no better than the Chairmen of the Soviet Union. Yet, I am here to say, I am none of those. I have dismissed parliament as saw the corruption present, I saw how these men cared more about lining their pockets instead of helping you, the person, who elected them to their post. They cared more about the refugees present on our soil, than the homeless camping out in our alleyways. I plan to reform our government into one where I can truly look out for the people, the people born in our country. Our streets will be free of criminals, and your lively hoods shall improve. Democracy died when America died, it is time to return to an old system, one which worked for hundreds of years."
 britain.342.o1:0 "Its Finally Time To Talk"
 britain.343.t:0 "The Royal Address"
 britain.343.d:0 "Ladies and Gentlemen Welcome to the BBC. In todays major news, We interview hopeful Illinois Presidential Candidate Bill Clinton who hopes to reunite the states democratically, Leftist organizer Jeremy Corbyn has left the country in shame, and we discuss how Government reforms are going to effect your child’s education. But first, Her Royal Majesty Queen Elizabeth II has spoken to the people today in the first official royal address. She’s come as a comfort to those who feared a royal dictatorship, as she has laid out plans to reconstitute Parliament. Along with this she has laid out the funding of the military and delivered a strong message to communists across the channel. Let’s play a quick segment.\n\n“Englishmen, Welshmen, Scottish, I want to say this much. We are done with isolation, we are done with letting the communist rats believe they rule the world. Long ago it was Britannia who ruled the waves, and it shall be that way once again.”\n\n“Truly powerful stuff”"
 britain.343.o1:0 "Speaking To The People At Last"
 britain.344.t:0 "Parliament Changes"
 britain.344.d:0 "Ladies and Gentlemen welcome to the BBC. In tonight’s news, an old American Franchise is due to be remade in the English Isles, Scientists have discovered a new type of penguin in the arctic and can your washing machine kill you? All these later at 11.\n\nIn the first bit of news tonight, The Queen has gotten rid of the old, and brought in a new parliamentary system. Many leftist groups protest her ascension to power, but then again those are the groups that let the terrorists in our country. According to the Queens office, this reformation of Parliament will allow the Queen to have the last say and ultimately manage who is appointed to the Parliament."
 britain.344.o1:0 "A type of democracy.."
 britain.345.t:0 "An Election Has Been Called!"
 britain.345.d:0 "Good Afternoon and welcome to the BBC. In Todays news, famous Chef Gordon Ramsey seems to be hinting at a political career, London has elected their first muslim mayor, and The Queen has embarrassed the royal family beyond belief.\n\nAccording to sources within Parliament, the Queen came knocking today demanding her right of Royal Ascent. In turn, she was turned away from the parliamentary building. Many see this a triumph of our democracy in the face of tyranny. What remains now is the snap election which is said by many to decide the fate of the country. More parties than ever have thrown their hat in the ring and surprisingly candidates like Russel Brand have garnered major political leverage, although many political experts are wondering if the SPD has it in them to win."
 britain.345.o1:0 "Time For The Parties To Get Ready"
 britain.346.t:0 "The Left Fights Back!"
 britain.346.d:0 "Good morning and Welcome to the BBC. In today’s special segment we are going to be looking at the political parties of the left. Are they the demons that the conservatives portray them to be? While I must ask you, does campaigning for Equality make you a demon? These men and women who make up the small socialist parties in England seek to enlighten England, and in my interview with their leader Jeremy Corbyn, I can see why people are turning to their cause. Corbyn laid out a simple agenda, we need to help the Isle. According to him, our isolationist policies have led us to fall behind the rest of the world, and truly the Warsaw Pact is not the evil we think it is. Stay tuned for the full interview."
 britain.346.o1:0 "The Left Speaks Up"
 britain.347.t:0 "The Right Rises"
 britain.347.d:0 "Good morning and welcome to the BBC. In today’s special segment, we’re going to look at the far right in England and I sit down for an interview with their leader Theresa Braiser as we discuss her new novel “God and England”.  I will say this much on the matter, I read her novel all day yesterday, and I have come to empathize with some of her points. Like the left, she believes that the isolationist policies have wrecked our country, but she brings in secularism, and says that by letting Muslims, Hindus, protestants, and such lot into the country, we have brought about our own downfall.\n\nBraiser’s novel is one that converted me to the Pheonix Front, and I hope those true Englishmen out there go out and read it."
 britain.347.o1:0 "A Group Of Loud Voices.."
 britain.348.t:0 "Corbyn Has A Plan"
 britain.348.d:0 "Good afternoon and welcome to the BBC. In todays news, a Libyan man stabbed 12 in Oxford, Gordon Ramsy has announced a run for Mayor of Johnstone, Scotland, and Jeremy Corbyn has risen in the polls.\n\nJeremy Corbyn has been blasted by many over the years including the recently deceased David Owen. But is he the worst person to lead the country? For one, he has the backing of the youth who are clamouring for free University and proper NHS management. This isn’t the only idea that the youth rally behind, He claims that the Royal family is perpetuating inequality, and that the answer to the Britain’s problems is socialism."
 britain.348.o1:0 "The Left Begins Their Election Promises"
 britain.349.t:0 "The Phoenix Meets The Right"
 britain.349.d:0 "Good afternoon folks and welcome to the BBC. Today we’re looking at the Phoenix front and the Far Right who have surged in election polls. One one hand we have the Phoenix front led by former conservative Theresa Braiser, and on the other hand we’ve got the British National Party led by Nick Griffin. Both look to end the secular nation and bring about radical social change but is it good.\n\nThe Front, as theyre commonly referred to as, wants to end protections for the LGBTQ community, fund the NHS, get rid of the illegals in the country and overall create a “pure” country.\n\nWhile the BNP seeks many similar things, they seek goals similar to those of Oswald Mosely. The party wants a stronger centralized government but also to purify England. According to Griffin, England is meant for the English. We’ll have to see if these two parties can work together."
 britain.349.o1:0 "A Similar partnership?"
 britain.350.t:0 "Election Day"
 britain.350.d:0 "Ladies and Gentlemen, Good morning and welcome to the BBC. Todays historic election is underway with record turnout to the polls across the country. While violence from both the left and right has broken out in some major cities, most poll stations remain peaceful. From the youth, to the elderly, all are out today hoping to enact real change within the country. The Question is, can the SDP pull a win out of this, or are they in for a real upset?"
 britain.350.o1:0 "Time To Make History"
 britain.351.t:0 "The Left Has Risen"
 britain.351.d:0 "Welcome back to the BBC at this early hour. The votes are in and counted, Jeremy Corbyn has been elected prime minister of the United Kingdom. In a surprise turn, it was Cornwall which carried the now elected official. Corbyn who is expected to give a victory speech later tonight, has been said to be ecstatic. Across the country, youth and socialists sympathizers are partying like there truly is no tomorrow, however here in London, right wing voters are rioting. The future of England looks to be red?"
 britain.351.o1:0 "The Red Flag Waves Back"
 britain.352.t:0 "The Left Lends A Hand"
 britain.352.d:0 "Good Evening and welcome back to the BBC. In Prime Minister Corbyns first days we’ve already seen the country face radical change. Parliament, already full of labour reds has happily passed every bill from the PM. Such bills include forgiveness of student debt, economic stimuli, and other bills which the left claim will help the poor classes of the UK."
 britain.352.o1:0 "The Helping Hand"
 britain.353.t:0 "The New Healthcare Plan"
 britain.353.d:0 "Good evening and welcome back to the BBC. In tonight’s news, we discuss the new person who will play Doctor Who, we sit down with Mayor Gordon Ramsy and discuss how his chef work plays into his political career and we talk to Nick Griffin who has claimed the election to be stolen from him.\n\nBut first, Prime Minister Corbyn today signed a bill which will expand the health coverage of the NHS to free medical exams for many of the countries poor. According to Corbyn’s office, this is just the first step in fully equalizing the country. Many on the right claim this will allow refugees and lower classes to worsen the NHS while Corbyn himself says that this is just levelling the playing ground."
 britain.353.o1:0 "A Better Healthcare System"
 britain.354.t:0 "Nationalise The Industry"
 britain.354.d:0 "To the poor of England, I sign this bill for you. The private industry tycoons of the country have worked you like slaves, with little to no benefits. You work long hours, for barely any pay. You miss time with your families and are unable to impart life lessons upon the youth. This bill, when passed will nationalise our industrial factories, and allow you to return to your families, not just with yourself intact but with a fair paycheck."
 britain.354.o1:0 "A Better Safer Workplace"
 britain.355.t:0 "ILP State House Plan"
 britain.355.d:0 "Good Evening and welcome back to the BBC. In tonights news, Bill Clinton, Illinois presidential hopeful has sexual assault allegations to deal with now. According to insider reports, a woman named Monica Lewinsky has accused Clinton of unwanted advances and a non-consensual sexual experience.\n\nBut first, Prime Minister Corbyn has been on a major winning streak since his successful nationalising of industry. In his newest victory, Corbyn has successfully set up a program of state-owned houses. This is in his effort to lower the homeless rate in major cities, but also give jobs to the homeless. Many are comparing Corbyn to a modern day FDR."
 britain.355.o1:0 "A New Home For The People"
 britain.356.t:0 "Britain First Takes Victory"
 britain.356.d:0 "Good morning and welcome to the BBC. In todays major news, the BNP has won the election and Nick Griffin is set to be the next Prime Minister of The UK. Not since the 1930s has the far right been able to march down Cable Street, except this time, the police were not there to turn to the tide. A clash ensued and left many among the socialist protesters injured. Many in the country remain sceptical that Griffin will be able to solve Englands problems, but those on the far right are celebrating their victory nonetheless. "
 britain.356.o1:0 "A New Path For Britain"
 britain.357.t:0 "The BNP Takes Victory"
 britain.357.d:0 "“Ladies and Gentlemen, I present the new leader of the United Kingdom, Nicholas Griffin”\n\nThe crowd cheered and Griffin himself was riding the high of energy. Here in Bingley Hall, he felt he was doing right by his predecessor and idol, Oswald Mosely.\n\n“We’ve done it! Now is the time of the white English man. We’re taking back the country tonight, and tomorrow we shall bring greatness back to the English Isles. By winning tonight, we’ve proven that we whites are not sitting by and letting the inferiors run the government anymore.”\n\nTo him, this small speech would provide the morale needed to weather the upcoming term."
 britain.357.o1:0 "A Change For Britain"
 britain.358.t:0 "The BNP Education Material"
 britain.358.d:0 "Ladies and Gentlemen welcome back to the BBC. In tonights news, Texas is ablaze, a wildfire threatens the city of Bucharest and famous writer William Gibson announces his new alternate history novel called “A Tear shed for Mosley”. But first, were your kids tainted by leftist education? Not anymore. According to the Office of Nick Giffin, the 10/4/1936 project will bring glory back to the real English man. While many call this racist, true English men and women applaud this. In fact folks, since the announcement, school enrolment has risen exponentially."
 britain.358.o1:0 "The Young People Are Brainwashed"
 britain.359.t:0 "A New Health System For The British People"
 britain.359.d:0 "Good morning and welcome to the BBC. In todays news, the American Republic was devastated once again by tornadoes. Gordon Ramsy is advancing his political career as he announced a run for the provincial governor under the newly formed Alba party. And finally, Nick Griffin seems to have somewhat fixed to the NHS.\n\nGriffin, who has been called the worst Prime Minister by many, has introduced legislation to incentivize only treating white Englishmen. The NHS has gone with this, and removed every non English doctor and nurse. Surprisingly this has alleviated the stress on the NHS."
 britain.359.o1:0 "A Change In Health"
 britain.360.t:0 "Democracy Hangs By A Thread"
 britain.360.d:0 "Ladies and Gentlemen welcome to the BBC. Today marks a day of fear for Scotland as Gordon Ramsey was shot during a campaign speech. According to news sources, Ramsy is in critical condition. Also, is this government turning into a failure already.\n\nParliament is hung once again, with the conservatives not being able to form a coalition with any party and the Phoenix Front gaining a large amount of popularity. Already we’re seeing members from both the BNP and Conservatives defect to the Front. I highly doubt any legislation will be passed soon."
 britain.360.o1:0 "A Change Of Wind.."
 britain.361.t:0 "The Tory Split"
 britain.361.d:0 "Ladies and Gentlemen lets jump right into the major news. The Conservative party today has announced their split. I wish I could say I was wrong but I wasn’t. Conservatives are leaving the party en masse and falling behind Theresa Bruisers Front. Does this spell this end of a century old party, does this signal the rise of a new party? We can not guess at the future, but for now, I fear for the conservatives."
 britain.361.o1:0 "The Conservatives Are Split"
 britain.362.t:0 "Some Sort Of Action"
 britain.362.d:0 "Ladies and Gentlemen welcome to the BBC. In tonight’s news, Gordon Ramsey addressed his voter base from the Royal Infirmary of Edinburgh, a Libyan man was arrested in Gloucestershire for killing a dog, and Theresa Braiser is facing harsh action from the Conservative party.\n\nLets jump right into it, is Theresa Braiser on the out. Conservative MPs in parliament have introduced legislation to censure the controversial politician but quite frankly it has little chance of passing. Many believe democracy is dying and Braisers party will get England through the crisis at home."
 britain.362.o1:0 "Something To Try At Least"
 britain.363.t:0 "Nigel Speaks"
 britain.363.d:0 "“Citizens, I have one message for you! Stand with us and force the Leftist menace to stand down or face the consequences! The Front will save all true English, and bring us salvation. We accept all who see the light, we accept all who want to really serve their country. In the coming weeks, you will hear not only from I, the one who left the conservative party but you will hear from people like Priti Patel who was embraced by the party. We ask for you to tune in”"
 britain.363.o1:0 "A Speech To Unite!"
 britain.364.t:0 "the Tories Hang On A Thread"
 britain.364.d:0 "Good Evening and Welcome to the BBC. In tonight’s major news, The Conservative party is facing a vote of no confidence within the county. Our Prime minister no longer has the support of the house, or the common people. As previously reported, MPS from the conservative front have defected to the Front and now it seems as if they’re going to finally gain power.\n\nComing up later, a more in depth report on the no confidence vote, and we talk with Gordon Ramsey who is being released from the hospital today.”"
 britain.364.o1:0 "A Worry Outcome"
 britain.365.t:0 "The Tories Give Up"
 britain.365.d:0 "Breaking news, The Prime Minister has been ousted from power. With a majority vote, including those from labour, the SDP, and liberal democrats. The Prime Minister has been made to step down from power, ultimately disgracing the party. Once again, England faces a leadership crisis. Many leftists have gone to the streets in protest demanding Jeremy Corbyn be made temporary leader while Parliament debates. The Queen herself has been said to have evacuated Westminster. London will truly be ablaze tonight, unless Parliament can make a speedy decision."
 britain.365.o1:0 "Democracy Fades Away.."
 britain.366.t:0 "Labour Has Won"
 britain.366.d:0 "The Labour Party has won the general election in a landslide victory. Tony Benn has promised he would deliver "unity and purpose for the future." Crowds lined the route waving flags as he was driven to Buckingham Palace for an audience with the Queen."
 britain.366.o1:0 "Labour Claims 10 Downing Street"
 britain.367.t:0 "Labours Recovery Plan"
 britain.367.d:0 "Labour has created their new recovery plan. This plan will create millions of jobs across the nation and rebuild the economy. Not only will this plan rebuild the economy but it will also put more police on the streets, a plan for the NHS and set out an education reform system."
 britain.367.o1:0 "Labour Delivers One Of Their Key Promises"
 britain.368.t:0 "Tony Benns Roadmap"
 britain.368.d:0 "Tony Benn has addressed the country while at the annual labour party conference in Brighton talking about his plans for the country such as much needed investment into the NHS, education and public services which were cut under the SDP. As well as this He has also spoke of the Phoenix Front and the BNP being wiped out in the election as democracy grows strong while also throwing some “shade” at the conservative party and SDP."
 britain.368.o1:0 "Labour Can Finally Heal The Nation"
 britain.369.t:0 "The SDP Cling Onto Power"
 britain.369.d:0 "Shirley Williams stood outside of 10 downing street talking to her supporters. “I am so proud to be standing here in front of you today back in government..and not just any government – a strong majority government. To the people I want to say thank you. You are the greatest team a Prime Minister could ever have. When you put your cross in the SDP box, you were putting your faith in us. To finish the job we started. To back working people. To deliver security for you and your family.\n\nAnd I’ll tell you now we will not let you down.”"
 britain.369.o1:0 "The SDP remain"
 britain.370.t:0 "MI5 Rebuild"
 britain.370.d:0 "The SDP overwhelming has voted to rebuild MI5 from the ground up. After its failure to protect the prime minister and uncover the terrorists before they struck in London has shown that Britain is very unprepared for home attacks. MI5 will undergo new reforms and modern day standards of training to protect the people and its nation."
 britain.370.o1:0 "Modern Day James Bond"
 britain.371.t:0 "Shirley Stands Down"
 britain.371.d:0 "Shirley Williams has announced in a speech to party activists in her Hertfordshire constituency, after earlier briefing the Cabinet on her plans to stand down as prime minister. She will stay on in Downing Street until the SDP elects a new leader, widely expected to be one of four new members such as Tony Blair, Amy Callaghan, Rishi Sunak and Neil Carmichael who each have very high polls for leadership.\n\nShe will always be remembered as Owens right hand as well as the first female prime minister and kept the torch of democracy lit while dark times tried to enter the nation but were never allowed to blow the torch out."
 britain.371.o1:0 "Goodbye Sweet Williams"
 britain.372.t:0 "The Liberal Democrat Victory"
 britain.372.d:0 "Nick Clegg spoke to party members as the results came in and polls closed showing who will take control of the country. “Tonight the Liberal Democrat parliamentary party and the federal executive of Liberal Democrat party have accepted tonight’s results and will form a new government in this country. We are now going to form a new government, more importantly we are going to form a new kind of government. I hope this is the start of the new politics I have always believed in diverse, plural, when politicians of different persuasions come together to overcome their differences to deliver a good government for the sake of the whole country.”"
 britain.372.o1:0 "The Liberal Democrat Vicory"
 britain.373.t:0 "Nicks Plan"
 britain.373.d:0 "Clegg has outlined his plan to MPs in parliament today. Major reforms will shake the nation as he pulls the left and right together and new laws are passed. Liberal Democrat MPs celebrate as they finally pass their long-awaited return has allowed their policies to finally become law and change much of the nation."
 britain.373.o1:0 "The LibDem Plan"
 britain.374.t:0 "the Future Plan"
 britain.374.d:0 "Nick clegg has met with members from the American states and Canada today to talk about a new trading policy which will rebuild the Atlantic trade scheme and create strong economies for everyone. Ireland has already called out the government on this betrayal of being left out of such important meetings due to their alliance they created and building each other’s economy together. Meanwhile Clegg has also met with the European Union leader to discuss ways to ease tension in the nations and bring a new era of peace and cooperation together."
 britain.374.o1:0 "A New Era Of Friendships"
 britain.375.t:0 "The Conservatives Win"
 britain.375.d:0 "Owen Paterson spoke outside of 10 downing street after meeting with the queen to say this, “Her Majesty the Queen has asked me to form a new government and I have accepted. Before I talk about that new government, let me say something about the one that has just passed. I would like to pay tribute to the outgoing prime minister for his and her long record of dedicated public service.\n\nI want us to build an economy that rewards work. I want us to build a society with stronger families and stronger communities. And I want a political system that people can trust and look up to once again.”"
 britain.375.o1:0 "The Tories Return"
 britain.376.t:0 "Protect The Nation"
 britain.376.d:0 "Paterson has spoken in parliament today of new investment which will be given to the british army to ensure the nation is protect and ready to defend the isle whatever the cost maybe. Billions are to be spent on new weapons and modernising the trident missile system. Many other opposition MPs have shouted their opposition to this such as Labour and the SDP calling out the conservatives as they plan to cut other services to fund this."
 britain.376.o1:0 "A Safe And Better Nation"
 britain.377.t:0 "The Torch Is Lit"
 britain.377.d:0 "The nation has healed and is now ready to accept the next chapter of the nations history"
 britain.377.o1:0 "Welcome Back Democracy"
 britain.378.t:0 "The Phoenix Front"
 britain.378.d:0 "Good Morning and Welcome to the BBC. In todays news, Theresa Braiser is now the official Prime Minister of the United Kingdom. While a welcome surprise by those on the right, the rest of us are scared for the future of Democracy. Airports are crowded as many people are seeking to leave the isle, with some desperate people heading for the American Warlords."
 britain.378.o1:0 "A New Britain Has Risen"
 britain.379.t:0 "The New TV Station"
 britain.379.d:0 "Good Morning and Welcome to the new Pheonix Broadcast Network, broadcasting new for true Brits, by true Brits. In todays news, Prime Minister Theresa Braiser has shuttered the BBC. The Corrupt news organization which has only helped to spread lies and degrade the good name of Brittania is no more as it was forcefully shut down today. While those on the left decry that “This is a violation of basic “human rights”. But….and I’m speaking to true Englishmen and Women, that network was leading us down the path of communism and suffering!"
 britain.379.o1:0 "Welcome To PBN"
 britain.380.t:0 "Democracy Has Fallen"
 britain.380.d:0 "Good Evening and Welcome to the Pheonix Broadcast Network. In todays news Prime Minister Theresa Braiser has suspended Parliament. In a move, welcomed by many Braisers new law will prevent non-Phoenix Front members from entering Parliament building. Braiser has defended this move saying that this law prevents bureaucrats from debating, but instead will allow true Brits to make laws for true Brits."
 britain.380.o1:0 "A New Change For Government"
 britain.381.t:0 "A Change In The Status Quo"
 britain.381.d:0 "Good Morning and Welcome to PBN. In todays news, a Muslim group was arrested in North Oxford for plotting against the government, yet another win for the Braiser government. But in other news, while many non-Brits continue to flee the isles for an unfounded fear of the Braiser cabinet, true English are saying the country has never felt safer. Crime is down in major cities, our kids are no longer being taught leftist rhetoric and housing prices are affordable for all. Under Braiser England has become a true paradise. "
 britain.381.o1:0 "A New Country For Brits"
 britain.382.t:0 "Banning Other Religions"
 britain.382.d:0 "Good Morning and Welcome to PBN. In today’s news, we have two major stories. Nigel Farage, an early supporter of the party has been feuding with fellow party member Ms. Patel. Along with that, Parliament this morning announced several laws going into effect, the biggest one being the rescinding of freedom of religion. According to a party spokesperson, this will only enrich the Isles further. Already across the country, Front members and police forces are rounding up Muslim, Jewish, and Hindu groups for detainment and potential deportation. "
 britain.382.o1:0 "A True Christian Country"
 britain.383.t:0 "Removing The Other Parties"
 britain.383.d:0 "Good Morning and welcome to the PBN. In today’s news, Prime Minister Braiser has announced a major order which will effectively erase other political parties from the Isles. Braiser is quoted as saying “The following parties are to be banned without right effect, Labour, Conservative, SDP and all those who stand against the Phoenix Front”. She then continued to announce all those who still pledge their support for those parties or any other against Front groups will be arrested and dealt with as a traitor to their nation. "
 britain.383.o1:0 "The Phoenix Stands Tall"
 britain.384.t:0 "The Nations Judge"
 britain.384.d:0 "Good morning and welcome to the PBN. In Todays wonderous news, Doctor Who has been picked up by the PBN and will broadcast its new season next year. In other news, you may notice your neighbourhood watch get a major increase in power. According to Braiser herself, people are now able to join “Front Patrols”. Essentially this will be a group who can make sure, that you the viewer and citizen are staying true to the Front ideals. Those who break laws will be handed over the police for future sentencing and punishment."
 britain.384.o1:0 "Order In The Nation"
 britain.385.t:0 "The Phoenix Front Leaders"
 britain.385.d:0 "“Good Morning and Welcome to a PBN Special Broadcast. Outside of 10 Downing Abbey, Prime Minister Theresa Braiser has announced more will be joining her in ruling the Isle. Nicknamed the Phoenix Four, these men and women will be responsible for turning England into a nation worthy of the front. Across the nation, one can expect to see more of the True brits coming out of the woodworks and in time, a pure nation.”"
 britain.385.o1:0 "the Power Of Three"
 britain.386.t:0 "Build The Camps"
 britain.386.d:0 "“Good Afternoon and welcome to the PBN. We’re out in the field today with Priti Patel of the Front Four. She herself granted us a tour of one of the news Front Labour and Rehabilitation Camps just outside of Norwich. This camp, which in time will house many criminals and un pure is extensive. According to Patel, these camps are meant to end the industrial prison system, and show criminals the error of their ways instead of just housing them together. The first people to arrive in this camp will be the group of Muslim men who were arrested earlier this year for plotting a terrorist plot against the State.”"
 britain.386.o1:0 "This is not good"
 britain.387.t:0 "More Control Of A Nation"
 britain.387.d:0 "“Welcome to a Special PBN Broadcast from outside the Norwich camp where we previously visited. This is honestly a glorious sight, as busses and trains drop of criminals en masse. Now they can be of use to the English isles instead of living off welfare. While many seemed to through insults and cuss at Ms. Patel, she just stood there valiantly and smiled knowing that she will go down in English history. More camps like this one will be opening across the country, with the biggest one appearing in Cornwall”"
 britain.387.o1:0 "Patel Is Going Crazy"
 britain.388.t:0 "The Slave Trade"
 britain.388.d:0 "“Good morning and Welcome to the PBN. Have you noticed something different at the market today? Perhaps along with buying veggies for stew, you can now buy a new person. Don’t fear this, because now you can put these traitors and non-English to work in your household or business. Slavery is finally making a return to the isles, with the Pheonix front rounding up many from camps and hideouts over the weekend and preparing them for a life of servitude. Across the nation, the Welsh return to their farming roots and the hindu’s turn to a life of domestic servitude.”"
 britain.388.o1:0 "History Repeats Itself"
 britain.389.t:0 "Britain Is Reborn"
 britain.389.d:0 "“Good morning and welcome to the PBN. Truly today is a new day, as England is clean of its rot! The homosexuals are either the problem for other countries or working for the betterment of camps, Muslims are finally contributing in the labour camps, the Hindus bow down to the English once again. Our kids are free of leftist education and now espouse the party ideals. Our streets are free of crime, and England is once again a holy nation. Who knows what path we would’ve gone down if Braiser the Front 4 had not come to power.”"
 britain.389.o1:0 "Wouldnt call this method clean"
 britain.390.t:0 "The NHS Goes Private"
 britain.390.d:0 "“As for our last bit of news tonight. Prime Minister Braiser has announced that the NHS shall be privatized today. This will allow billions upon billions of pounds to be directed towards more useful things in the isle. Many are hoping to see this money reinvested into the civilian sector while hardliners in the party believe that we need to invest our money into the military and prepare for potential war.”"
 britain.390.o1:0 "The Poor Are About To Become Poorer"
 britain.391.t:0 "The English Job Market"
 britain.391.d:0 "“Our next bit of news comes out of the Department of Labour. As the Jobs report finally came in today with all jobs going towards actual British people. Finally, the people no longer have to compete with a lazy Muslim who will work for a lower wage or an welsh drunk who intimidates their way into the job. Our citizens are able to work, worship, and live how they want. Praise Braiser”"
 britain.391.o1:0 "Low Unemployment"
 britain.392.t:0 "Rebuilding The Economy"
 britain.392.d:0 "“Good morning and welcome to the PBN. While the Jobs report has been optimistic, the economy is finally beginning to prosper. Under the eye of Braiser and Farage, the English isles economy is starting to recover. True English are seeing a major boost in their paycheck, the average cost of a home is affordable for anyone and international business is seeing an advantage of investing in our nation. Who knew slave labour would incentivize the rest of the world?”"
 britain.392.o1:0 "Britains New Economy"
 britain.393.t:0 "The Big Bad World"
 britain.393.d:0 "“Good Afternoon and Welcome to the PBN. Today we’re joined by Kaite Hopkins. Katie, the floor is yours.”\n\n“Thank you, sir I am here to say that we need to focus on the outside world and the threat they pose. Many outside the Isles fear what we have built and fear the prosperity at home. Already in the UN, we have seen nations propose sanctions against us, and some even threaten war. We need to be prepared to defend all of prosperity, which is why I’m asking any true patriot to join the Pheonix military.”\n\n“You heard the woman folks, join up and defend the Isles.”"
 britain.393.o1:0 "Hopkins Makes Her Voice Heard"
 britain.394.t:0 "The Nuclear Option"
 britain.394.d:0 "“Good Afternoon and Welcome to the PBN. In tonight’s news, Katie Hopkins military direction has led us to become a nuclear superpower. While not test date has been announced, the department of defence has said they have rebuilt 25% of the nation’s arsenal. Who knows, someday soon the coast may experience a small “heat wave” of sorts.”"
 britain.394.o1:0 "Standing On The Edge"
 britain.395.t:0 "Braiser Has Control"
 britain.395.d:0 "“Good morning and welcome back to PBN. We would like to begin by saying thank you to our great leader Theresa Braiser who has taken Britain out of the dark isolated nation it once was and back into the eyes of the world. The people are able to stand proud of the nation they serve as well as their leader and here at PBN we could not be prouder. In today’s news we would like to announce a series of new reforms which are due to come into law very soon as well as that more news on the protests in Cornwall from the traitors who refuse to accept Braiser. All that and more to come only on your number one news station, PBN.”"
 britain.395.o1:0 "The Era Of Phoenix Has Begun"
 britain.396.t:0 "Braiser Has Control"
 britain.396.d:0 "“Good afternoon this is PBN. Today our beloved leader Theresa Brasier has announced that the army will now be reformed and rebuilt into the Phoenix National Front Army, they will pledge their loyalty to Braiser and her royal majesty. Our leader has stated this new generation of soldiers will be trained to become battle hardened soldiers ready to strike at the communists in Europe and future enemies of our nation. Already young adults have started to sign up to join the National Army and stand ready to defend our great Island. I for one am delighted to see such a movement across the nation from the young people standing up ready to take up arms for our leaders.”"
 britain.396.o1:0 "A New Generation Of Brainwashed"
 britain.397.t:0 "Protecting The Isle"
 britain.397.d:0 "“Well good evening everyone and welcome back to PBN, Katie Hopkins has announced along with Theresa Braiser that british warships will now be patrolling the English Channel in a threating stance against the communist regime in Europe while a show of force against the French State. Already France has tried to signal fear to us by sending ships towards ours but as soon as we threatened to open fire at them they surrendered and left as they French always seem to do in times of war..This has already signalled a victory for Britain showing it is ready to defend its nation.”"
 britain.397.o1:0 "Britain Is Ready To Be Defended"
 britain.398.t:0 "Dover Gets Armed"
 britain.398.d:0 "The residents of Dover awoke this morning to jets and helicopters flying above their houses while tanks and anti-missile systems entered the streets of the small town of Dover. As people looked out onto the white cliffs, lines upon lines of missile systems lay ready to shoot over the channel while jets flew continuously over the channel. War really seems to be coming to the Isle and the people of Dover are the first to witness this."
 britain.398.o1:0 "Ready For War"
 britain.399.t:0 "Ulster Referendum"
 britain.399.d:0 "Its time for the people of Ulster to decide whether or not they should become once again part of the strong and powerful nation of Britain. As the people head to the polls they are given a voting slip, which reads.\n\n“Please tick a box if you wish to remain independent or join the powerful nation of Britain.”"
 britain.399.o1:0 "Join Britain"
 britain.399.o2:0 "“Join Ulster”"
 britain.400.t:0 "We Need More Room"
 britain.400.d:0 "“Hello folks and welcome back to PBN, we have some breaking news, Braiser no longer wishes to sit down and speak with Ireland over our nations decision to take Ulster. Instead, she has chosen to take the small Irish nation and make it pay for us having to bail them out and fund their infrastructure many times in the past. As our leader put it “Ireland will be broken into tiny, small pieces and once it finally surrenders then we will stop pulling it apart”. Our great soldiers have already entered the borders of Ulster and Ireland with many Irish soldiers already surrendering to us.”"
 britain.400.o1:0 "Ireland Fights Back"
 britain.401.t:0 "Removing The Weak"
 britain.401.d:0 "“Welcome Back To PBN, As we move to day 3 of the new laws and reforms the Phoenix Front has established I’m sure you would all agree the homeless have now been removed and our streets are finally clean. No more poor and weak left the pure british people finally have their country back. All I can say is thank you Braiser we all thank you and our leaders for this.”"
 britain.401.o1:0 "Where have they gone?"
 britain.402.t:0 "Prepare For Our Next Move"
 britain.402.d:0 "Europe is a nation full of dirty leftists and has caused nothing but problems for the rest of the world. The Phoenix Front has talked about removing the non-pure off the planet and creating more living room for the british people to expand and take Britain to its old empire days. Europe will one day be taken by the british people, and the phoenix front will ensure this promise happens!"
 britain.402.o1:0 "A Crazy Idea"
 britain.403.t:0 "The Big Wide World"
 britain.403.d:0 "The Phoenix Front has claimed Britain and now is looking beyond. Theresa Braiser has become power hungry and wants more. She needs more and the greater her control, the madder and crazier she gets. She has started to create plans and drafts on how she will control the rest of the world, country to country and what will happen to the people of those nations she will take."
 britain.403.o1:0 "The Future Plans"
 britain.404.t:0 "Braiser Helps The Royals"
 britain.404.d:0 "Braiser has met with the Queen and spoken to her about the plans for the next British empire and how she would want the royal family to help to help support the new world order. After serval hours of meetings, the Queen agreed to work with Theresa and would support the role of taking care of the Empire. Braiser has crowned this moment as historic showing that even her royal majesty knows Britain should rebuild its old empire back!"
 britain.404.o1:0 "The Queen Agrees"
 britain.405.t:0 "Britain Prepares For War"
 britain.405.d:0 "“My people we stand ready on the beach, in the ports, in the airfields ready to give the people of Normandy their free lives back! Its time we finally expand our country into Europe and show the world that we will rid the communist bastards off the face of this world!! I see many young soldiers here ready to serve for me and the nation, ready to fight and look death in the face and laugh at it!”\n\nAs Braiser smiled looking at the young faces staring back at her knowing most of them will not return back a French sniper sits on the cliffs of dover pointing towards Braisers head.."
 britain.405.o1:0 "Braiser Falls"
 britain.405.o2:0 "The Shot Misses"
 britain.406.t:0 "Braiser Takes Full Control"
 britain.406.d:0 "“People of England! We’ve done it! Through your dedication to the party and to the movement we have purified the isles of all scum! But this..this is only the beginning. All around, the world itself is unpure, clinging to their communist ideals. While we prosper, those across the channel in Normany suffer under the rule of the inefficient communists. We must liberate them by force! We must crush the symbols of communism! Like the soldiers who stormed Normandy, those in the Pheonix Military will storm the beaches with the queens blessing!”"
 britain.406.o1:0 "Braiser Takes Full Power"
 britain.407.t:0 "Braiser Wants War"
 britain.407.d:0 "“Good morning and welcome to a special edition of the PBN. Soldiers, who received the queens blessing for war last night have landed upon the beaches of Normandy. While the fighting is tough, top military experts predict a full victory with Caen captured by early tomorrow morning. From Buckingham Palace, both Prime Minister Braiser and her Royal Majesty were seen talking with the Queen apparently expressing concerns for the families of the Pheonix Army.”"
 britain.407.o1:0 "The War Path"
 britain.408.t:0 "The Worst Situation Has Happened"
 britain.408.d:0 "Good morning and welcome to the PBN. Dire news today as the soldiers who stormed the beaches of Normandy we’re pushed back to the isles. What almost ended as a complete and utter victory with the capture of Caen, changed when French soldiers were reinforced. From there, our casualties began to mount and thousands still litter the beaches. Truly a sad day for our nation. Her Royal Majesty has declared a royal day of mourning and PM Braiser is expected to make a speech later today”."
 britain.408.o1:0 "How Will Braiser Take This?"
 britain.409.t:0 "Braiser Steps Down"
 britain.409.d:0 "Good Morning and Welcome to PBN. In todays breaking news, Prime Minister Theresa Braiser has voluntarily stepped down as announced this morning. Citing the Normandy failure, Braiser believes she is no longer able to lead this country and thus, it will come down to a new appointment for PM. During this time, you are encouraged to remain calm and let this"
 britain.409.o1:0 "Goodbye The Iron Lady"
 britain.410.t:0 "The Simple Reforms"
 britain.410.d:0 "Good morning and Welcome to the PBN. In Todays news, Prime Ministers Cameron and Hopkins have announced Reform Pheonix One from Downing Street today. This reform while controversial will restore some form of Democracy back into the Isles. While many like Priti Patel have called this a return to degeneracy, most pure English welcome this change and look forward to elections once again."
 britain.410.o1:0 "A Small Change For A Big Moment"
 britain.411.t:0 "The Riots Begin"
 britain.411.d:0 "Welcome to a special broadcast of the PBN. Prime Ministers Cameron and Hopkins are preparing to declare martial law across the country due to the riots against Reform Pheonix One. Agents of the Eye have already detained more than 2,000 and both Prime Ministers are urging peace ahead of tomorrows bill signing.”"
 britain.411.o1:0 "The People Fight Back"
 britain.412.t:0 "The Riots Begin"
 britain.412.d:0 "Today, parliaments gates reopened today as crowds gathered to celebrate seeing a type of restoration in democracy returning. David Cameron made a statement to the people outside Parliament announcing that “change is finally here and the people no longer need to fear about the future and how they live their lives, The New Tory Party will restore the old”."
 britain.412.o1:0 "Democracy Slowly Returns"
 britain.413.t:0 "The Orders Of Iceland"
 britain.413.d:0 "Patel has ordered the officers to be ready and to move their soldiers into the seas near Iceland. Bombing raids will take place over Iceland to destroy its population and when the time is right. To invade. Iceland will become a place where slaves and labourers will be tested on and science experiments on them will be used to ensure how to create “The Perfect Briton” in Patel’s words."
 britain.413.o1:0 "Today Another Country Falls To The Phoenix"
 britain.414.t:0 "Patels Power"
 britain.414.d:0 "“Good morning and welcome to the PBN. In a turn of events, Priti Patel was sworn in as Prime Minister early last night. Even stranger, Patel is asking England to get ready for a war footing with the apparent target being Iceland. While we support the Prime Minister and hope she lives up the legacy of Braiser. Many fear her due to her creative torture methods and choices on how she would take control of the country.”"
 britain.414.o1:0 "Today Fear Becomes Reality"
 britain.415.t:0 "Its Time To Take Brittany"
 britain.415.d:0 "“Good Evening and Welcome to an emergency broadcast of the PBN. England is now in a state of war with the French communists hoard after they had sunk an English fishing vessel late last night. As we speak, soldiers are landing on the beaches of Brittany and our brave airforce is dropping chemicals on their major cities. We expect a quick and swift victory over the enemy. Do not change this channel”"
 britain.415.o1:0 "England Goes To War"
 britain.416.t:0 "Britain Takes Normandy"
 britain.416.d:0 "“Good Morning and Welcome to Normandy folks. Here on the beaches, the Pheonix eagle flies high and proud as soldiers behind me celebrate their victory and mourn the fallen. I wish I could what I’m feeling right now, because the atmosphere here is just electric. Even those from nearby towns have joined the party as we’ve liberated them from the communist regime. God is truly with England in this moment!!!”"
 britain.416.o1:0 "The Phoenix Celebrates"
 britain.417.t:0 "The Leaflets Drop"
 britain.417.d:0 "“We mean you no harm, we come as we once did in your past. Normandy has been liberated from the tyrannical regime in which you all suffer. Join us on your beaches and rejoice, not only for your freedom but your redemption. God is with you all”"
 britain.417.o1:0 "Join The Phoenix"
 britain.418.t:0 "Taking Advantage Of The New Space"
 britain.418.d:0 "“Good afternoon and Welcome to the Grand Broadcast of PBN Normandy. In todays news, record amounts of colonists leave the isles for our fair land with many buying up farmland and some magnates taking over the industry left over here. Though, before our critics say we are mistreating the population here, we’re not. They work in the farms and factories, we pay them a living wage, and we bring god to them.”"
 britain.418.o1:0 "The Takeover Begins"
 britain.419.t:0 "Preparing For Brittany"
 britain.419.d:0 "Brittany will be an easy take. Braiser has already commanded the army to prepare for complete invasion of the state and let no one live who tries to fight back. While the French state has said they will fight back, this is highly unlikely due to half of the existing French army already broken into civil war and small militia groups due to the European Spring making it an easier war for Brittany."
 britain.419.o1:0 "The Easy Victory"
 britain.420.t:0 "Brittany Falls"
 britain.420.d:0 "Gun’s fire into Brittany, House, factories, villages and more are being destroyed to remove all French structure to be rebuilt into the british vision. Soldiers are pouring into the state firing at anyone who even leaves their house. Braiser laughs and smiles watching the French population starve and weep knowing their old way of life has now changed and the Front is here to change the face of France."
 britain.420.o1:0 "The Victory"
 britain.421.t:0 "The French Border.."
 britain.421.d:0 "The army stands at the borders of France ready to spring into action and force their way into Paris and plant the Phoenix flag on top of the Eiffel tower. With bombing raids still happening over France and the population fighting amongst themselves this surely will be a fat and easy victory over France. Theresa Braiser is completing her final plans to take France and order the communist party to surrender..Although back at home it seems the north of England are starting to get a little tired of this new way of life and with the rumours of protests and riots in northern cities maybe this victory may have to be delayed.."
 britain.421.o1:0 "The Full Invasion Starts"
 britain.422.t:0 "Somethings Gone Wrong"
 britain.422.d:0 "Braiser was sitting in the cabinet office in number 10 when news reached her that riots are about to break out in the north of England, it seems that some old leaders from the SDP, Labour and other parties have joined forces and sparked a movement in the people to stand up for their freedom and stop pointless wars and reclaim democracy. Braiser in shock and disbelieve has had to put the war in France on hold to reassess the situation at home."
 britain.422.o1:0 "England Shouts Back"
 britain.423.t:0 "Manchester Fights Back"
 britain.423.d:0 "“Good Afternoon and welcome to the CBC broadcasting out of Toronto. While closed off, news has reached us that Manchester is beginning to show discourse against the Pheonix Front regime. Given to us through less than reputable means, videos of riots have shown the real state of those inside the country, and truth be told, it is an attitude of violence.\n\nWith this, many international experts, here and abroad wonder if the Braiser regime will survive much longer”"
 britain.423.o1:0 "Manchester Rises Up"
 britain.424.t:0 "Manchester Fights Back"
 britain.424.d:0 "“Welcome to CBC, with a special broadcast coming out of England”\n\n“People of Brittania! I never thought I’d live to see this day but I urge you to rise up against the Front! For speaking out against them, I was forced into a labour camp and I bore witness to atrocities not seen since the second World War. The guards routinely raped the women and the children. Us men were forced to dig our own graves. Did you wonder where the muslim and hindus went? They were brutally experimented on, and sometimes for fun, the guards would have the fight for money! This is not who we English are, this is not who we will stay! Already some of you have taken up arms, and I encourage the rest of you to turn on the front and fight with us! Sic Semper Tyrannus!”"
 britain.424.o1:0 "Burnham Rallys The People"
 britain.425.t:0 "The Leaders Meet"
 britain.425.d:0 "Broadcast all over the nation on pirate stations the meeting of Burnham, Blair and Starmer was broadcast to the people on what the front is exactly doing, what their future plans are and how they are not at all a party for the British people. They have encouraged the people to stand up like what is going on in France and fight for democracy and freedom even asking soldiers to lay their weapons down against countries and people and arm themselves against Braiser."
 britain.425.o1:0 "The People Listen"
 britain.426.t:0 "Boris Takes East Anglia"
 britain.426.d:0 "Boris Johnson has officially declared that East Anglia is now an independent state and will no longer be part of the union. The people are proud he has chosen to be their leader and are ready to fight for him and take control of the nation."
 britain.426.o1:0 "The Jolly Man Takes Over"
 britain.427.t:0 "Nigel Takes Wessex"
 britain.427.d:0 "Nigel Farage believes Wessex is the creation of Britain, this is the state which created the kingdom of England hundreds of years ago and is where the true Britons are. Therefore, he has officially stated that he will remove Wessex from Britain and will rebuild the Kingdom Of Britain once he has removed the other leaders."
 britain.427.o1:0 "Farage Takes Wessex"
 britain.428.t:0 "Patels Forces Kent"
 britain.428.d:0 "Priti Patel has ordered the absolute removal of non-Kent kind from her kingdom as she calls it. She will only allow the true blood of the Kent people to be allowed to stay and fight for her..although they don’t have a choice to fight or not. She has already destroyed villages to show her true power and forced fear into the people. Kent is now hers."
 britain.428.o1:0 "Power In Kent"
 britain.429.t:0 "Cameron Takes Mercia"
 britain.429.d:0 "David Cameron has been able to strike deals with other counties in the midlands and south and has taken the biggest piece of land, Mercia. Along with trading with Northumbria he has been able to rebuild his army and supply them well. He has already restored some old laws in this land and his people are happy to fight alongside him and take back Britain to restore the United Kingdom."
 britain.429.o1:0 "David Is Ready"
 britain.430.t:0 "The States Move!"
 britain.430.d:0 "During the morning, sniper shots started to ring out along the border of East Anglia from Kent. Once the soldiers in the border barracks started to realise, two of their own were shot dead from sniper fire. Army officials on the East Anglia began to return fire back. Shortly after more heavy shots began to be exchanged. Not long after Patel ordered her soldiers into East Anglia.\n\nSeeing the offensive Farage took the opportunity to surprise Cameron ordering his Wessex troops into Mercia. Not long after East Anglia started firing at Mercia as they suspected Cameron would soon be ordering his troops in. By midday all four counties were firing at each other, from borders, through fields.\n\nIt seems the civil war has finally begun."
 britain.430.o1:0 "Fight For Mercia!"
 britain.430.o2:0 "Fight For Wessex!"
 britain.430.o3:0 "Fight For East Anglia!"
 britain.430.o4:0 "Fight For Kent!"
 britain.431.t:0 "Phoenix Propaganda Over France"
 britain.431.d:0 "“We mean you no harm, we come as we once did in your past. Normandy has been liberated from the tyrannical regime in which you all suffer. Join us on your beaches and rejoice, not only for your freedom but your redemption. God is with you all”"
 britain.431.o1:0 "France Join Us"
 britain.432.t:0 "Planning For The Future Of Normandy"
 britain.432.d:0 "“Good afternoon and Welcome to the Grand Broadcast of PBN Normandy. In todays news, record amounts of colonists leave the isles for our fair land with many buying up farmland and some magnates taking over the industry left over here. Though, before our critics say we are mistreating the population here, we’re not. They work in the farms and factories, we pay them a living wage, and we bring god to them.”"
 britain.432.o1:0 "We Need More Space"
 britain.433.t:0 "The Easy War"
 britain.433.d:0 "Brittany will be an easy take. Braiser has already commanded the army to prepare for complete invasion of the state and let no one live who tries to fight back. While the French state has said they will fight back, this is highly unlikely due to half of the existing French army already broken into civil war and small militia groups due to the European Spring making it an easier war for Brittany."
 britain.433.o1:0 "A Quick Easy Fight"
 britain.434.t:0 "The War Of Brittany"
 britain.434.d:0 "Gun’s fire into Brittany, House, factories, villages and more are being destroyed to remove all French structure to be rebuilt into the british vision. Soldiers are pouring into the state firing at anyone who even leaves their house. Braiser laughs and smiles watching the French population starve and weep knowing their old way of life has now changed and the Front is here to change the face of France."
 britain.434.o1:0 "Brittany Becomes Part Of The New Empire"
 britain.435.t:0 "France And Britain Stand Ready For War"
 britain.435.d:0 "The army stands at the borders of France ready to spring into action and force their way into Paris and plant the Phoenix flag on top of the Eiffel tower. With bombing raids still happening over France and the population fighting amongst themselves this surely will be a fat and easy victory over France. Theresa Braiser is completing her final plans to take France and order the communist party to surrender..Although back at home it seems the north of England are starting to get a little tired of this new way of life and with the rumours of protests and riots in northern cities maybe this victory may have to be delayed.."
 britain.435.o1:0 "The World Stands Watching.."
 britain.436.t:0 "A Change Of Course"
 britain.436.d:0 "Braiser was sitting in the cabinet office in number 10 when news reached her that riots are about to break out in the north of England, it seems that some old leaders from the SDP, Labour and other parties have joined forces and sparked a movement in the people to stand up for their freedom and stop pointless wars and reclaim democracy. Braiser in shock and disbelieve has had to put the war in France on hold to reassess the situation at home."
 britain.436.o1:0 "The People Rise Up"
 britain.437.t:0 "Manchester Rises Up"
 britain.437.d:0 "“Good Afternoon and welcome to the CBC broadcasting out of Toronto. While closed off, news has reached us that Manchester is beginning to show discourse against the Pheonix Front regime. Given to us through less than reputable means, videos of riots have shown the real state of those inside the country, and truth be told, it is an attitude of violence.\n\nWith this, many international experts, here and abroad wonder if the Braiser regime will survive much longer”"
 britain.437.o1:0 "Braiser No Longer Holds Control"
 britain.438.t:0 "Andy Burnham Speaks Out"
 britain.438.d:0 "“Welcome to CBC, with a special broadcast coming out of England.”\n\n“People of Brittania! I never thought I’d live to see this day but I urge you to rise up against the Front! For speaking out against them, I was forced into a labour camp and I bore witness to atrocities not seen since the second World War. The guards routinely raped the women and the children. Us men were forced to dig our own graves. Did you wonder where the muslim and hindus went? They were brutally experimented on, and sometimes for fun, the guards would have the fight for money! This is not who we English are, this is not who we will stay! Already some of you have taken up arms, and I encourage the rest of you to turn on the front and fight with us! Sic Semper Tyrannus!”"
 britain.438.o1:0 "The People Listen And Learn"
 britain.439.t:0 "The Leaders Meet"
 britain.439.d:0 "Broadcast all over the nation on pirate stations the meeting of Burnham, Blair and Starmer was broadcast to the people on what the front is exactly doing, what their future plans are and how they are not at all a party for the British people. They have encouraged the people to stand up like what is going on in France and fight for democracy and freedom even asking soldiers to lay their weapons down against countries and people and arm themselves against Braiser."
 britain.439.o1:0 "A Plan Is Hatched"
 britain.440.t:0 "The New Leaders"
 britain.440.d:0 "“Good afternoon and welcome to the PBN. In todays major news, Prime Ministers Cameron and Hopkins are out to reform the nation and blend the old with the new. In a press conference from 10 Downing, “This system will blend the democracy of the old United Kingdom with the new purity of the Pheonix front.” While met with a protest by Priti Patel and her hardliner supporters, most ordinary citizens are willing to give this system a chance.”"
 britain.440.o1:0 "A New Direction For Britain"
 britain.441.t:0 "Return Of A Duel Party System"
 britain.441.d:0 "“Good Morning and Welcome to the PBN. Prime Minister David Cameron announced the return of a two party system today as the return to the Old English ways continues. According to Prime Minister Cameron, he will be creating and leading a new party named “The New Tories”. In a statement from the office of the Prime Minister, this new party will enshrine centrism and help restore England’s democracy to its forefront.”"
 britain.441.o1:0 "Change Is Coming"
 britain.442.t:0 "Meetings With The Ex Leaders"
 britain.442.d:0 "“Good Afternoon and Welcome to the last broadcast of the PBN. For our last broadcast, we’re covering two items, one which involves what we’ve accomplished and one in which ex leaders from the old days have returned to the country. Folks, we’ve been fair to Prime Minister Cameron but as this country continues to spiral into the old ways, we feel as if history will repeat itself once again. Today in Canterbury, Prime Minister Cameron met with leaders from Labour, SDP, and the Liberal Democrats, all of whom praised him for returning our nation to its previous degeneracy. We just have to ask, Theresa, where are you and why are you not helping us?”"
 britain.442.o1:0 "Its Time To Sit Down And Talk"
 britain.443.t:0 "The BBC Is Back"
 britain.443.d:0 "Good Morning England and Welcome back to the BBC. My names Pierce Brosnan and I’ve missed you all. As part of Prime Minister Camerons democratization of the English Isles, we in the BBC have been allowed to return to work. Finally we Brits can here the news of the outside world once again and my god do we have many stories to begin with.\n\nComing out the Americas, Robert Ford, previous mayor of Toronto has finally overdosed on crack cocaine. On the Texas-Mexico border, millions lay in refugee camps as Joaquin Guzman continues his war against the Mexican Government.\n\nLooking to our own European Homefront, Priti Patel has fled the isles for fear of persecution, with rumors placing her somewhere in the Caribbean.\n\nLastly, looking to the Asian continent. The Korean rebellion continues with deaths estimated in the hundreds of thousands already. For those who do not know, since the assassination of Kim Jong Un, democratic rebels have been fighting for freedom from the communist regime. To those listening, we in England and We in the free world support your cause”"
 britain.443.o1:0 "Freedom Is Calling"
 britain.444.t:0 "Camerons Meeting With Braiser"
 britain.444.d:0 "Good Morning and Welcome to the BBC. My names Pierce Brosnan lets get into todays major news. Prime Minister David Cameron is said to have met with Theresa Braiser at 10 Downing Street today. According to the Prime Ministers office, the purpose of this visit was to encourage the Front leader to turn herself over to authorities and be tried by a tribunal for crimes against humanity. Although no comment has been made from Braisers lawyers, many are wondering, just where is the woman? She’s not been seen for days now."
 britain.444.o1:0 "Where Could She Have Gone?"
 britain.445.t:0 "Britain Is Back"
 britain.445.d:0 "“Good morning, My names Pierce Brosnan, lets get into todays news. Prime Minister Cameron has finally entered the residence of 10 Downing Street. While already sworn in, this move is huge as it finally signifies an end to the Braiser era. Cameron, in a speech to an excited public had said that the Pheonix Front is on its way out, and that England herself is on a path to a bright future once again.”"
 britain.445.o1:0 "Cameron rebuilds Britain "
 britain.446.t:0 "The Tories Stay In Power"
 britain.446.d:0 "“Good Evening and Welcome to the BBC. My names Pierce Brosnan lets get into todays news. In the Americas, and soon to come to England, George Lucas’s sci-fi cult classic film “Star Wars” will finally be getting a sequel. Apparently written by Lucas himself, the sequel will see Mark Hamil return as the titular Luke Skywalker. Look forward to it in UK cinemas July 13th.\n\nIn our neck of the woods, Prime Minister David Cameron announced that the Tory party will remain in power for the at least the next foreseeable year. Citing a threat by the Pheonix Remnants, the Prime Minister asked for help in taking down the remnants of the organization, once they are dealt with then England can continue our transition to a democratic state.”"
 britain.446.o1:0 "Is This Fair..?"
 britain.447.t:0 "Support For The Phoenix Falls"
 britain.447.d:0 "“Good Afternoon and welcome to a special broadcast of the BBC. As of 8 am this morning, Prime Minister Cameron has suspended the right to a jury trial and mobilized loyal military forces to arrest Pheonix Supporters still within the nation. According to 10 Downing, the military operation has thwarted three plans to kill government officials, and more than 800 supposed terrorists and more than 2000 non-combatant Pheonix supporters. Updates will continue to flow through here as the day goes on”."
 britain.447.o1:0 "Finally"
 britain.448.t:0 "Ireland Has United"
 britain.448.d:0 "“Welcome to the BBC Reporting out of Ulster. In todays historic news, both Ulster and Ireland are a country once again as they agree to rebuild their nations together. While met with resistance by the terrorist forces of the IRA, both countries are working to slowly unify their people and unify the isle which has been balkanized for too long. According to Prime Minister Cameron, this move while brokered in Dublin, is a win for all of us in the isles.”"
 britain.448.o1:0 "A New Chapter"
 britain.449.t:0 "The French And Spanish"
 britain.449.d:0 "“Good Afternoon and welcome to the BBC. In Yet another historic conference hosted by Prime Minister Cameron. The blight of the Pheonix front is almost done, as announced today, our forces will leave the beaches of Normandy and return control to the French. Among the topic of Normandy and Brittany, the Spanish have been brought into the conference and they seem to be helping us prevent tensions with the French.”"
 britain.449.o1:0 "A Positive Conference"
 britain.450.t:0 "A United Nation"
 britain.450.d:0 "“Good Afternoon and welcome to the BBC. My names Pierce Brosnan, here to bring you the historic news of today. After visiting states across the nation and meeting with the new heads of state for Scotland and Wales, our nation is united once more. All above these state capitols, the Union Jack flies again. Our nation, while still disunited, will not fall into the ideals of radical nationalism ever again.”"
 britain.450.o1:0 "Britain Is United"
 britain.451.t:0 "Hopkins And The Phoenix Front"
 britain.451.d:0 "“Good Morning and Welcome to the PBN. In todays news, with the stepping down of Theresa Braiser, Katie Hopkins has stepped up. According to Hopkins, the ideas of the Front under Braiser were too radical and unsustainable. Hopkins would continue to say that she is going to work to deradicalize the isles but still keep true to the ideals of the Front. While met with protests by hardliners, this is a welcome move by most.”"
 britain.451.o1:0 "A New Move"
 britain.452.t:0 "Hopkins And Braiser"
 britain.452.d:0 "“Good Afternoon and welcome to the PBN. In todays major news, several ex-Oxford Professors who were arrested for a pornography ring early last month have had their death sentences commuted by Prime Minister Hopkins, instead they will serve life sentences in prison. Among other news, Katie Hopkins announced that she and Theresa Braiser have brokered a power sharing deal. Hopkins office says they believe this will allow both Prime Ministers to solicit bipartisan solutions to the problems currently being faced within the country.”"
 britain.452.o1:0 "Two Woman In Control"
 britain.453.t:0 "England beats Italy for Euro Championships"
 britain.453.d:0 "For the one time every 4 years, the communist and noncommunist countries of Europe meet and play the oldest European sport, soccer. While this year, the 2021 Euros were among the most controversial with the Russians losing for the first time in decades, the game would eventually come down to the powers of England and Italy.\n\nBeing played in Englands capitol of London, many Londoners attended the game wearing shirts reading “It’s coming home”. Truly this would play into the morale of the English team as they scored the first goal.\n\nFor the next three hours, the English would take a total of 19 shots on the Italian goal, and before fans knew it, Mason mount would score yet another goal on the worn-down Italians. This was met with fierce resistance by the Italian team, who would score one point before the end of the game.\n\nAs the clock struck 0:00, the English would remain victorious over the Italian team, with victory riots breaking out in London and an estimated 33 million done in damage. For the fate of the Italian team, it is expected they will be met with malice from the Italian citizenry, with even some refusing to return to their country."
 britain.453.o1:0 "Football Comes Home"
 britain.454.t:0 "The Agreement Fails"
 britain.454.d:0 "“Good Morning and welcome to a special Broadcast of the PBN. I’m Piers Morgan filling in for Jeremy Vine, and heres todays breaking news. While still in its infancy, the power sharing agreement between Hopkins and Braiser has been ended. Hopkins office claims that Braiser violated the terms of the agreement and therefore she has forfeited her right to rule both the front and the Isles. This has been met with protests across the country, with many demanding Hopkins resign and voluntarily exile herself from the Isles.”"
 britain.454.o1:0 "A One Woman Nation Again"
 britain.455.t:0 "The Firing Squad"
 britain.455.d:0 "“Good Morning and welcome to a broadcast of the CBC. In todays breaking news, former Prime Minister Theresa Braiser of England is set to be executed by firing squad. While news from the Isles has been sparse, and most of our correspondents found themselves forcibly deported, we’ve surprisingly been let in for this event. According to the office of the High Chancellor, Ms. Braiser committed several crimes against the world and the front which gave her grounds to arrest Braiser. In only a few minutes, Ms Braiser will be dead. According to the High Chancellor herself, Braisers body will be buried at sea as she does not deserve to rest on English land.”"
 britain.455.o1:0 "Death To The Witch"
 britain.456.t:0 "Braiser Goes To The Tower"
 britain.456.d:0 "“Welcome to a special broadcast of the PBN. Former Prime Minister Theresa Brasier was recently found guilty of crimes against humanity and betraying the front. For these heinous crimes, Ms. Braiser has been stripped of her estate, wealth, and administrative powers. She has been sentenced to life imprisonment within the Tower of London where she can receive visitors but per Prime Minister Hopkins stipulations, those visits can only be from those families who’ve lost loved ones because of Braisers actions.\n\nComing up, is David Cameron swooning over the Prime Minister? More on this at 7.”"
 britain.456.o1:0 "She Will Live With The Pain"
 britain.457.t:0 "The New Prime Minister"
 britain.457.d:0 "“Good Morning and welcome to a new day in England. My names Jeremy Vine and I am glad to be apart of this amazing nation. Prime Minister Hopkins in all her wisdom has moved England away from a horrible fascist dictatorship and put us on the path towards a limited democracy. While we can vote for local leaders and form political parties, Hopkins will remain High Chancellor of the nation, and for her I am grateful. It feels amazing to have some of our freedoms back, but I would be remised if I did not mention that I miss international cinema. Maybe Mrs. Hopkins can allow a few films into the country someday.”"
 britain.457.o1:0 "The New Iron Lady"
 britain.458.t:0 "The New Tory Party"
 britain.458.d:0 "David Cameron has taken control of the United Kingdom and has ordered the flags of the Phoenix to be removed. He has chosen to depart the alliance from Katie Hopkins and stand on his own two feet as he slowly begins the reconstruction program of the nation."
 britain.458.o1:0 "Cameron Makes Moves"
 britain.459.t:0 ""
 britain.459.d:0 ""
 britain.459.o1:0 ""
 britain.460.t:0 "The First Meeting"
 britain.460.d:0 "The rebels marched down from the north through into the midlands. There they found hotspots of phoenix activity waiting for the rebels. Groups ran at each other fighting while gun fire was heard across fields and towns. As the rebels grew large out numbering the Phoenix supporters and the army unable to reach the Midlands in time the Phoenix seemed to lose control of the Midlands running and giving the territory back to the people!"
 britain.460.o1:0 "The Phoenix Grows Weaker"
 britain.461.t:0 "Keir Shows His Face On The Network"
 britain.461.d:0 "Keir Starmer took to pirate networks to broadcast his message to the people and beg them to join th rebels to fight back against the Phoenix, “Braiser has brought normal life to a halt. Our cities, our towns and our villages are silent, our roads deserted. Public life has all but come to a standstill and people are dying. People are frightened by the strangeness, anxious about what will happen next.\n\n Be in no doubt I understand the scale of the task, the gravity of the position that we're in.We've got a mountain to climb. But we will climb it, and I will do my utmost to reconnect us across the country, to re-engage with our communities and to establish a coalition across our towns and our cities and our regions with all creeds and communities to speak for the whole of the country.\n\n I will do my utmost to guide us through these difficult times, to serve all of our communities and to strive for the good of our country. Us three leaders will lead this great nation into a new era, with confidence and with hope. So that when the time comes, we can serve our country again in government."
 britain.461.o1:0 "Time To Get Moving"
 britain.462.t:0 "The People March"
 britain.462.d:0 "More and more support has appeared across the nation as the people slowly begin to rise up and go on marches through the country towards London. Families, friends, and neighbours come together and march against the Phoenix. While the Phoenix tries to send the army to deal with this, it seems that support from the armed forces are against Braiser."
 britain.462.o1:0 "Its Time To Unite"
 britain.463.t:0 "The Torch Of Democracy"
 britain.463.d:0 "The people come together protesting against the Phoenix Front, holding totems of Braiser burning them and making sure she watches as its falls apart. Braiser has ordered more of the army to fight against the people but many in the armed forces have turned against their position and chosen to fight against Braiser instead. The torch is beginning to slowly burn."
 britain.463.o1:0 "The People Can Smell Freedom"
 britain.464.t:0 "Cable street will be victorious again"
 britain.464.d:0 ""Things got messy and had to retreat but we will not back down and we have found outselves at cable street..."with one mighty big push the rebels ran against he police and the army as they pushes through cable street fighting off anyone who stands in their way, as the rebels pushed to the end of the street more citizens took up arms and pushed forward making way towards Brasiers last night..""
 britain.464.o1:0 "The Rebels Are Pushing Further"
 britain.465.t:0 "Run Braiser Run"
 britain.465.d:0 "The rebels searched the whole of downing street searching high and low for Braiser but no luck, she had escaped, luckily she left all of her documents and plans for the future ready to broadcast to the nation about how her plans were to reduce the European population and make Britain into a nation of soldiers.\n\nNow these documents have been released more of the population have joined the fight and search the capital for her. Soldiers and firing at her deputies and demanding information from them on her whereabouts."
 britain.465.o1:0 "Come On Our Braiser"
 britain.466.t:0 "The Search Of The Burning Parliament"
 britain.466.d:0 "The glow of Parliament can be seen burning miles away. The chambers are on fire. The doors have been broken down and the people search for Braiser, her last known whereabouts had been security forces taking her into Parliament and trying to create defences. Now those obstacles have been removed the search is on while the fire smoothers the building."
 britain.466.o1:0 "Where Are You Braiser?"
 britain.467.t:0 "She Falls To The People"
 britain.467.d:0 "As parliament burns and the people cheer, Braiser has come running out falling to the floor raising her hands up surrendering herself to the people. As she is picked up and taken away by the army onlookers look as parliament burns watching knowing that history is being made right in front of them. The question is..what steps do we take now?"
 britain.467.o1:0 "Braiser Is In The Hands Of The People"
 britain.468.t:0 "The Arrival In 10 Downing Street"
 britain.468.d:0 "The rebels broke down the doors of 10 downing street expecting to find Braiser making her final stand. Instead, all they found was a building empty with broken furniture, attempts to burn documents and a ruined building. The rebels checked the building but was empty with no signs of Braiser and her group. As the angry protesters got back into the streets, they began chanting her name searching for the woman who destroyed the nation."
 britain.468.o1:0 "Where Are You Braiser?"
 britain.469.t:0 "The Sun Shines Again"
 britain.469.d:0 "The rest of the country has awaken to hear the news britain is back, the tiger roars again as they celebrate Brasiers death. Work has begun to repair parliament after the fight. The army has taken over until a new government can take over until democracy can be rebuilt and the country is once again in a stable position."
 britain.469.o1:0 "The Air Is Fresh Again"
 britain.470.t:0 "The NHS has Returned"
 britain.470.d:0 "The heart of the UK was ripped out of the people when the Phoenix Front came to power, many were left unable to afford healthcare and were left hopeless and many died due to this. Those who became seriously ill were left in the gutters. Now Billions has been poured back into this service nationalising it and making the people free to visit their doctor without the worry of a paying for healthcare and treatments!"
 britain.470.o1:0 "Thank You NHS"
 britain.471.t:0 "Parliament Prepares"
 britain.471.d:0 "Tony Blair, Keir Starmer and Andy Burnham have all met together to discuss the reopening of parliament and restoring the old democratic rights to this country. Leaders form the Liberal Democrats and the Conservative Party will be invited to discuss how they would want to see the democratic process move forward. \n\nIn a statement Andy Burnham gave to the press he promised the people of this country will see a new reformed stable and more equal parliament for all. The far left and far right will never be allowed to enter the doors of parliament again, the people will always overcome fear and hatred and never will the past come back to haunt the people again."
 britain.471.o1:0 "Welcome Back To Democracy"
 britain.472.t:0 "The Judge And The Hammer"
 britain.472.d:0 "Each leader came out of separate prison vans cuffs around their wrists and legs. Armed guards surrounded them while the people cheered seeing them being taken into the courts. Some still protested against this action but were swiftly pushed back by the rest of the those  who screamed for the leaders to all face the firing squad. \n\nEach leader 1 by 1 were taken into the dock in the courts and their punishments were read out loud while being televised across the country. The jury were quick to deliver the fates of Patel, Nigel and Johnson but when it came to Cameron..It seemed to take longer to decide on his fate due to his resistance to work with the phoenix.."
 britain.472.o1:0 "Its Time To Face The Music"
 britain.473.t:0 "Here Comes The Change"
 britain.473.d:0 "The first debate in parliament ended in MPs across both sides of the room cheering and clapping. Democracy has returned back to the country and now the country is ready for the first election of leaders. Andy Burnham will represent Labour; Blair will represent the SDP and Starmer will be elected as speaker for the house. The people will choose on who they will want to represent them and guide the country in these new changed years."
 britain.473.o4:0 "The People Vote Labour"
 britain.473.o3:0 "The People Vote SDP"
 britain.473.o1:0 "The People Vote Conservative"
 britain.473.o2:0 "The People Vote Liberal Democrat"
 britain.474.t:0 "I WANT FRANCE NOW!!!"
 britain.474.d:0 "FRANCE WILL FALL AND IT WILL BE PATELS!"
 britain.474.o1:0 "I WILL TAKE IT ALL!"
 britain.475.t:0 "DENMARK WILL BE OUR NEXT PRIZE"
 britain.475.d:0 "DENMARK WILL BE TURNED INTO A TRUE ENGLISH STATE AND ITS POPULATION WILL BE TURNED INTO PURE ENGLISH HUMANS OR FACE TOTAL EXTERMINATION"
 britain.475.o1:0 "PRITI NEEDS MORE!"
 britain.476.t:0 "GOODBYE HOLLAND"
 britain.476.d:0 "HOLLAND IS A CURSED LEFTIST PARADISE AND MUST BE REMOVED. ITS NOT EVEN WORTH OUR PEOPLE TAKING OVER THE LAND DUE TO ITS DEPSERATE CRY FOR SURVIAL. ITS PEOPLE WILL FINALLY GET WHAT THEY WANT. TOTAL EXTERMINATION"
 britain.476.o1:0 "THE PARADISE FADES"
 britain.477.t:0 "The British European Empire"
 britain.477.d:0 "Freedomn"
 britain.477.o1:0 "null"
 britain.478.t:0 "The Empress Takes Her Throne"
 britain.478.d:0 "The dear leader, Empress Patel has taken her throne and has ordered the complete takeover of the Americas. Canada, the last remaining beacon of democracy will be turned into ash and dust while the southern American states will become a source of energy for the future of the empire. North America will become the puppet state Patel has always dreamed of and will serve under the british throne as it always should have done."
 britain.478.o1:0 "Patel is hungry"
 britain.479.t:0 "Wales Goes Alone"
 britain.479.d:0 "Plaid Cymru have announced they will take control of Wales and give the Welsh people their identity, their nationalism they have always desired as well as creating a fair equal social democratic government which will govern in the interests of the people. The Phoenix Front has warned Wales this is not the end and they will be reunified by whatever means necessary.\n\nMeanwhile Canada and Cornwall have congratulated the newly independent nation and look forward to working with Wales for the future of peace and prosperity."
 britain.479.o1:0 "The Welsh Get Their Own Free Country"
 britain.479.o2:0 "The Welsh Get Their Own Free Country (Play As Wales)"
