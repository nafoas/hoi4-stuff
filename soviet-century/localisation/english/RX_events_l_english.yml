 lin.3.t:0 "Time to prepare"
 lin.3.d:0 "“Men, with our position secured, our militias as strong as ever and our economy improving i think it's time, its time for us to retake montana from the traitors and false fascist, Weaver begin preparing the militia, Randy tell out contacts in Great Falls to begin relaying us all the information they have collected, and Mathew, begin procuring arms and munitions. Does everyone understand?” “Yes my leader!” “Good now lets get at it.” "
