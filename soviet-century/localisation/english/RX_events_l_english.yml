 texas.57.t:0 "Antonio Burr Speaks Out"
 texas.57.d:0 " “Good afternoon and welcome to the TBS. Looking into todays major news, Mexican border have fallen 30% since Copelands inauguration according to the DHS, famous Actor Clint Eastwood is starting his own movie studio based out of Forth Worth and philanthropist Antonio Burr is becoming the latest critic of Scott Copeland.” “Jumping into the Burr story, Antonio Burr spoke out against President Copeland today as he says “Copeland does not represent the Texan ideal, or the American dream.” While just a playground insult, inside sources say that President Copeland is considering legal action against the Burr family."
 texas.57.o1:0 "arrest him"
 texas.57.o2:0 "let him shout"
 texas.58.t:0 "Jim Jones Joins Protest"
 texas.58.d:0 "Good Afternoon and Welcome to TBC Austin.  My names John Engle and here are tonight’s top stories. Bernie Sanders gains more popularity in the APC, with many political experts calling him the next Chairman of the country. Italy declares a state of emergency due to the Libyan Refugee crisis. And it looks as if Rob Ford, the Canadian Prime Minister was caught with crack cocaine once again. But first, here in Austin and across the country, protests against President Copelands election continue to happen and today, noted religious leader Jim Jones joins the protests with his “flock”. Experts say this will gain Jones more popularity."
 texas.58.o1:0 "Get Rid of the Old Fools"
 texas.58.o2:0 "What He Gonna Do?"
 texas.59.t:0 "Burrs Are Planning"
 texas.59.d:0 "“Good morning and welcome to the TBS. In todays major news, the situation with Antonio Burr is reportedly getting heated. According to an anonymous source within the Burr foundation, it seems as if the family is buying up property left abandoned from the United States military and spending large amounts of money on security forces. While the Burr family says these are not for malicious purposes, but instead are going to they are buying up these bases to create public housing and using the security forces to make sure nothing goes wrong in construction. This situation is currently developing and updates will come.” "
 texas.59.o1:0 "investigate"
 texas.59.o2:0 "Its Nothing"
 texas.60.t:0 "Burr conspiracy Succeeds"
 texas.60.d:0 "Good afternoon and Welcome to NBC St Louis. My name is Lester Holt and let’s get into tonight’s news. Coming out of Texas, the Burr Family has secured power and declared a provisional government to rule. This coming out of the state that has changed leadership many times over the recent years. Here in St. Louis, we are wondering if this new rule will last or if the Burr family is just another chapter to Texan history. "
 texas.60.o1:0 "Burr got the Last Laugh"
 texas.60.o2:0 "let him shout"
 texas.61.t:0 "David Koresh Joins Jim Jones"
 texas.61.d:0 "Good morning and Welcome to the TBC. In todays major news, protests against President Copelands policies continue to be underway in the capital, with some estimating damage in the hundreds of thousands. Originally started by religious leader Jim Jones, more have started to join in on the protests, and today, Jones would find himself another another ally in the form of David Koresh and his Branch Davidians. According to inside resources, the Texan National Guard is on alert and supposedly ready to put down any violence."
 texas.61.o1:0 "What are They Doing?"
 texas.62.t:0 "March From Waco"
 texas.62.d:0 "Emergency Broadcast TBC: The Cultist forces led by David Koresh and Jim Jones are on their way to the Capital. It is advised that if you can not evacuate, then we advise you to fortify your position. The Texan Guard are mobilized, and currently seeking help. We repeat, the Cults are on the move, evacuate or fight. May god protect the Texan Republic."
 texas.62.o1:0 "Send in the Army"
 texas.62.o2:0 "We Gotta Evacuate"
 texas.63.t:0 "The Cultist Take Over"
 texas.63.d:0 "“Blessed day and welcome to the TBC. Our enlightened religious leaders have taken control of the government and are working to bring their light to all of us. The Eye are going around to the houses of Catholics and other degenerates. If they appear near you, do not resist. Jim and David know what they’re doing, and they should not be questioned as they work to save us from this time.” "
 texas.63.o1:0 "Gloryous"
 texas.64.t:0 "The Burr Family Arrested"
 texas.64.d:0 "Good morning and Welcome to TBC. In Todays major stories, Ken Burns will be releasing his film “Tuesdays with Reagan” in which he interviews former and last United States President Ronald Reagan. Along with that, wealthy Texan philanthropist family “The Burrs” of Aaron Burr fame have been arrested at their residence today. The family, being escorted out by the national guard claimed to be innocent of whatever charges. "
 texas.64.o1:0 "Down with Traitors"
 texas.65.t:0 "Jim Jones Found Dead"
 texas.65.d:0 "Good morning and Welcome to TBC. In this breaking new report. Infamous communist and cult leader Jim Jones has been found dead in his church in Waco. This is after Scott Copeland ordered the arrest of Jones following his out cry against the goverment. Joneses cause of death has been determined to suicide by poisoned kool-aid. This marks the end of any communist ideals in Texas."
 texas.65.o1:0 "Good Riddence"
 texas.66.t:0 "Waco Compound Burned Down"
 texas.66.d:0 "“Good Afternoon and Welcome to the TBC. In todays breaking news, The Waco compound, belonging to cult leader David Koresh has burned to the ground in a firefight with Texan armed forces. According to the Presidential Press Secretary, the military gained intel that the cultists were using that area to stage a government coup. Eyewitnesses say that the cultists fired upon the armed forces. Lastly, according to the military, Koresh is believed to be among the dead”"
 texas.66.o1:0 "Who Cares We Killed 25 Kids"
 texas.67.t:0 "Cults Prevail"
 texas.67.d:0 "Good morning and Welcome to TBC Austin. Jumping into todays news, The Young Davidians will sing “Keep Your Rifle by your side” later today.  Pastor Jones has retreated into his new Jonestown complex and is said to be developing political legislation. Looking to our Government, the religious sects within our nation have taken control of Texas and are working in many various wonderful ways to bring us to prosperity. We’re looking to see if both Pastor Koresh and Pastor Jones will be sharing power or if one of them will be in control of the government."
 texas.67.o1:0 "Time for Real Change"
 texas.68.t:0 "Sweep Away the Heathans"
 texas.68.d:0 "“Good afternoon and Blessed day. Welcome to TBC Austin and jumping into todays major news. Both David Koresh and Jim Jones have purified our government. People like Copeland can never harm Texas with their harmful ideals ever again. Many politicians, professors, and intellectuals are on their way to re-education camps. Blessed be Jones and Blessed be Koresh.” "
 texas.68.o1:0 "You Will not be Missed"
 texas.69.t:0 "Organize The New State"
 texas.69.d:0 "“Good morning and Welcome to NBC St.Louis. My names Lester Holt and we’re going to jump right into the Texas situation. With the previous deposing of Scott Copeland, international observers and here is St. Louis were made to guess at who would be replacing Copeland. The choice remains, will the Texan people come under the rule of David Koresh, Jim Jones and his communists, or according to some experts, we might see a dual dictatorship under these two. We’ll keep you updated as the situation progresses. "
 texas.69.o1:0 "Koresh Secures the State"
 texas.69.o2:0 "Jones Keeps it All"
 texas.69.o3:0 "Both Agree to Work Together"
 texas.70.t:0 "Davidian Takeover"
 texas.70.d:0 "“Blessed day to you all. Our savior David Koresh has led the Davidian militia to victory. The Eye of Koresh shall be to your home shortly to test your loyalty. While his loyal followers take over the duties of the Government, Koresh will seclude himself to commune with God. Has this political move staved off the coming apocalypse? Time will tell. Praise his eternal self and live well under his eye.”"
 texas.70.o1:0 "The Lamb Will Lead"
 texas.71.t:0 "Jonesist Purged"
 texas.71.d:0 "“Blessed day, and may the lord forgive the Jones loyalists for their crimes against the nation and blasphemy against David. All around the country, agents of The Eye are raiding Jonesist compounds and imprisoning their supporters wherever they may be. Today marks a new day. It is an end to the communist rule of Jones and a beginning to the divine leadership of David and his followers. If you receive a visit from The Eye, do not resist, embrace them. Blessed be David.” "
 texas.71.o1:0 "The Heathans Are No More"
 texas.72.t:0 "The Messiah Rises"
 texas.72.d:0 "“Blessed be Koresh, and welcome to TBC Austin. Our holy leader David Koresh has been inside the Mt. Caramel area for quite some time since securing power. Many of us, his devoted followers questioned whether he has had another vision from God, but in truth it was much more than a vision. Our holy leader is now our Holy Messiah. According to he who is holiest, God told David that he was the Christ-son reborn, and he was sent to this Earth to save us from the evils of socialism and capitalist depravity. Blessed be the Koresh.” "
 texas.72.o1:0 "Head His Message"
 texas.73.t:0 "Power Sharing Agreement"
 texas.73.d:0 "“Good Evening and Welcome to the PBS. In todays breaking news, a Power Sharing agreement was reached between the Branch Davidians and those who worship Pastor Jones. According to the office of the Supreme Priests, the two will agree to share governing responsibilities and take control of the law-making process. Insiders say that the two seem to be getting along but are questioning who will have the final say in the agreement.”"
 texas.73.o1:0 "Koresh Leads"
 texas.73.o2:0 "Jones Leads"
 texas.74.t:0 "Koresh Leads"
 texas.74.d:0 "“Good Morning and Blessed day from the TBS. In todays major news, David Koresh of the Branch Davidians will lead the power sharing agreement between him and Jim Jones. Jones has voluntarily stepped down and for now, it seems as if the Texan region is at piece. Some want his holiness to purge the Jones loyalists, and I for one believe we should welcome them into our flock” "
 texas.74.o1:0 "Koresh and Jones a Strong Team"
 texas.75.t:0 "Jones Leads"
 texas.75.d:0 "“Good Morning and Blessed Day from TBS. In todays breaking news, His eternal Soul and Holiness Jim Jones has announced that he will lead the power sharing agreement. While Koresh will still have political power within the country, it is Jones who will have the final say. Many of our flock believe the Branch Davidians should be either executed or exiled, while Jones himself says he believes in a peaceful existence and will not take action against the Davidians unless provoked.” "
 texas.75.o1:0 "Jones and Koresh a Strong Team"
 texas.76.t:0 "Jones Secures His Position"
 texas.76.d:0 "“Blessed be his eternal soul and welcome to TBC Austin. Our holy leader Jim Jones has taken full control of the Government. According to his holy word, he has ended the power sharing agreement and forced David Koresh out of government. All across the country we’re seeing praise for Jones and those who won’t praise his name have left the area. His holiness claims now that he is in full control, he will execute gods will and create a holy America.” "
 texas.76.o1:0 "Jones is Unstoppable"
 texas.77.t:0 "End of the Republic"
 texas.77.d:0 "“Good morning and Welcome to PBS. In Todays major two stories, Texas has turned on their overlord and annexed the former American Republic into their own country and California declares a state of emergency revolving around the Cascadia Crisis.” “Jumping into the Texas situation, it seems as after a long conflict, the Texan Government has annexed the American Republic and extended their territory 10 fold. This has been seen as an omen of no reunification in the near future as many peoples hopes laid within the southern American Government.” "
 texas.77.o1:0 "We Are Unstoppable"
 texas.78.t:0 "Kingdom of David"
 texas.78.d:0 "“Our Messiah has proclaimed our country to be the Kingdom of David. As the Lone Star fell from the capital today, the holy Cross rose. Countries abroad have pulled out of trade agreements and withdrew ambassadors, just as the Messiah proclaimed! Those who have not converted to the true faith have committed acts of terror just as the Messiah Proclaimed. If he says the Kingdom of David will mark us as truly worthy of Gods love and saving during the apocalypse, then who are we to question? Blessed be Koresh”"
 texas.78.o1:0 "King David Rises"
 texas.79.t:0 "Talks With Duke & the KKK"
 texas.79.d:0 "“Good morning and Blessed Day, Welcome to the TBS, lets get into the breaking news. Mt. Caramel will be playing host to David Duke and his retinue of KKK guards today. According to his holiness’ office, Duke will be here to talk about integrating KKK values into the Texan Republic and possibly creating a new police force to manage the previously annexed regions. According to inside sources, Duke is ecstatic to meet his holiness and help out however he can.” "
 texas.79.o1:0 "That Went Smooth"
 texas.80.t:0 "Execute the Generals"
 texas.80.d:0 "“Good morning and Blessed day. In today’s major news, the trial of the non-believing and heathenistic generals from the now dead American Republic is done and these people are set to be mass executed today for the crime of treason. They dared to fight against his holiness’ forces, therefore they deserve the worst punishment possible. It is said, that our leader shall absolve them of their sins as god instructed him to do. I pray these people find salvation.”"
 texas.80.o1:0 "Down with Devils"
 texas.81.t:0 "Meeting the White Phoenix"
 texas.81.d:0 "“Good Evening and welcome to the TBS. In todays major news we have two stories. Hillary Rodham seems to be making a stellar political career in Illinois and proving to be a challenge to hopeful Bill Clinton. Also, David Duke, Grand Wizard of the KKK has reportedly been in contact with the White Pheonix, AKA Mike Pence. Pence who is facing scrutiny for overthrowing the communist government of the American Peoples Commonwealth is reportedly ecstatic to find a possible ally on this continent” "
 texas.81.o1:0 "Welcome to Salvation"
 texas.82.t:0 "Meeting Pence"
 texas.82.d:0 "“David Koresh and Mike Pence are meeting today in Atlanta as grounds for a historic diplomatic conference between the two countries. According to insider resources, both Pence and Koresh share similar views on Catholicism. Apparently the two seem to be getting along insanely well but the biggest rumor coming out of this is the possible reunification of America.”"
 texas.82.o1:0 "Wanna join Us?"
 texas.83.t:0 "Holy Union of America"
 texas.83.d:0 " Blessed be the Eternal Soul, Welcome to the new station, Broadcasting Jones’ Word. Here in Atlanta, we are happy to report that his holiness has reunited the broken American states into one Holy Union. Being named the Holy Union of America or the HUA for short, Jones’ word will finally be able to stretch from sea to sea. Next stop, spreading his word around the globe!” "
 texas.83.o1:0 "A New Age Begins"
 texas.84.t:0 "Execution of Duke"
 texas.84.d:0 ""
 texas.84.o1:0 "Death to Hatred"
 texas.85.t:0 "Mission to the Soviets"
 texas.85.d:0 "“Esteemed leader of our country, Jim Jones has smartly send a delegation of ministers to the Soviet Union. While we may not share all the same ideas, our principles remain the same. Many believe this can lead us and others to the eternal utopia which Jones has promised. While full of diplomatic opportunities, this mission to the Soviets can only help to enrich the eternal leader as he helps us to reach that sacred place. As always, praise Jones and his divine wisdom”"
 texas.85.o1:0 "Spread the Word"
 texas.86.t:0 "Mission to the Chinese"
 texas.86.d:0 "“Esteemed leader Jim Jones has smartly announced he will be sending a delegation to the Chinese government in an effort to start up trade in our holy country. In a statement from his office, “Trade with the Chinese is just one step closer to the promised utopia”. While many outside the country do not approve of the possibility of Chinese trade, those inside our holy borders claim it is just and wonderful. As always, Praise Jones and his divine wisdom”"
 texas.86.o1:0 "Spread the Word"
 texas.87.t:0 "Negotiate unification"
 texas.87.d:0 "“Our Esteemed Leader Jim Jones will be sending a delegation to the Union of American Peoples Republics in an effort to unify our country, not just under a a political flag but a spiritual one as well. All those atheists in California will soon be able to see the light of our prophet while remaining equal under his eyes. Shall these efforts bare the predicted fruit, our nation and faith will be stronger than ever! And as always, Praise Jones and his divine wisdom” "
 texas.87.o1:0 "Wanna join Us?"

 texas.88.t:0 "The Conspriacy Succeeds"
 texas.88.d:0 ""Coming out Texas today, the Burr Family has made a surprising announcement as they overthrew Scott Copeland leader of the Texan Dixiecrats. The Burr Family, renowned for their ancestor Arron Burr, has announced the creation of the Kingdom of Texas. For the first time in American history, an American will be crowned monarch. The Bishop of San Antonio has praised the Burr family for their defense against radical cults, and in the streets known Jonesist and Davidians are being hunted down. Is this a new dawn upon the American people?”"
 texas.88.o1:0 "Aaron Would be Proud"
 texas.89.t:0 "The End of Copeland"
 texas.89.d:0 "“Since the coup lead by the Burr Family, massive purges have taken place across the country as Copeland loyalists and supporters have been stripped of positions and removed from workplaces. While called tyrannical by some, others claim this is the first step to stabilizing the country. The Burr Family, who has been very public since the overthrow, seems to be preparing for a coronation at the capital. The question is, are the Copeland loyalists the only threats to the country?” "
 texas.89.o1:0 "Remove These Scum"
 texas.90.t:0 "Prepare the Coranation"
 texas.90.d:0 "Good morning and Welcome to NBC St.Louis. This morning the Burr Family has annouced that the corination for the new monarchy of Texas will commence later today. Much speculation has been following this as the possible canidates for this have been split 3 ways. The first being Esentric and defacto leader of the Burr Family Antionio Burr, who wishes to continue the legacy and ideas of Aaron Burr. The second being former representive Richard Burr, he is a decendant of Aarons Brother and is a far more pragmatic individual, looking to turn america into a semi-constitutional monarchy modeled after imperial Germany. And finally Sherri Burr. Shes is a Lawer and Liberal activist was recently found out to be a decendent of Aaron burr and one of his slaves after DNA testing. Shes wishes to make America a proper constitutional monarchy like the UK and vows to protect the rights of minorties and women across the broken nation. "
 texas.90.o1:0 "Crown Antonio"
 texas.90.o2:0 "Crown Richard"
 texas.90.o3:0 "Crown Sherri"
 texas.91.t:0 "Coranation of Antonio I"
 texas.91.d:0 "Good evening and welcome to the TBC. Today is truly a historic day for our nation as Antonio Burr will be crowned the first monarch of Texas. Antonio who leads the Burr Foundation has expressed excitement about governing this nation. According to him, he has no intent of becoming another dictator on the American continent, instead he wants to continue the legacy of Aaron Burr, arguably his most famous ancestor. "
 texas.91.o1:0 "Long Live Antonio I"
 texas.92.t:0 "Pence Agrees"
 texas.92.d:0 "Good evening and Welcome to PBS broadcasting out of New York. In today’s major news, President Mike Pence, otherwise known by the name “The White Pheonix” has agreed to merge his nation with that of his holiness David Koresh. What was once thought to be a dream, Koresh is making happen. By merging our two states, we will not only create a holier America, but we will create one with more fervor than the previous America"
 texas.92.o1:0 "hallelujah"
 texas.93.t:0 "Pence Refuses"
 texas.93.d:0 "Good evening and Welcome to PBS broadcasting out of New York. In todays major news, talks between President Mike Pence and David Koresh have fallen through. What would’ve been another step towards American unification has ended in failure. According to the President, Koresh demanded rights for his preachers to enter our lands and convert us away from Catholicism. Pence being a man of god has said he would not allow his people to fall under the rule of a false messiah. Coming up later in the night, Can the Irish be considered religious? "
 texas.93.o1:0 "End That Heathan"
 texas.94.t:0 "UAPR Agrees"
 texas.94.d:0 "“Greeting and Blessed day, Welcome to the TBS. In todays breaking news, California, a heathenistic communist state which has suffered many losses over the years has agreed to unify with our blessed nation. Many speculate this is in response to California’s failing economy, but we here believe it is because they’ve seen the light of his eternal soul and are submitting themselves to a higher power. “"
 texas.94.o1:0 "Foward Towards unity"
 texas.95.t:0 "UAPR Refuses"
 texas.95.d:0 "“Greeting and Blessed Day. Welcome to the TBS, now lets get into todays breaking news. California, a heathenistic communist state which has occupied the west coast of the United States since the collapse has closed themselves off to the light of Jones. In a statement made by his holiness, the Californians are content to rot in hell and are unaccepting of any salvation given to them by his holiness.” "
 texas.95.o1:0 "End the False Communist"
 texas.96.t:0 " Coranation of Richard I"
 texas.96.d:0 "Good evening and welcome to the TBC. Here in the capital we are experiencing a historic moment as Richard Burr shall be crowned the first monarch of Texas. Richard will be creating a system similar to that of Englands in which he’ll have the final say in the laws passed by the Texan congress, but democracy will still be retained. Richard claims that by merging the systems of monarchism and democracy, America can truly be reunited. He’d go onto say that if we had this system from the beginning, then the country would not have collapsed. Burr says that after the coronation he will look at candidates for Prime Minister and make a choice shortly. "
 texas.96.o1:0 "Long Live Richard I"
 texas.97.t:0 "Coranation of Sherri I"
 texas.97.d:0 "Good Evening and Welcome to the TBC. Here in the capital we’re experiencing a historic moment as Sherri Burr will be crowned the first monarch of Texas. Sherri, a descendant of Aaron burr’s slaves seeks to create a liberal monarchy where she will be more of a figure head than an actual leader has expressed excitement as the idea of a black woman being crowned queen. Her royal Majesty will be looking to the people to elect a Prime Minister to lead the nation, although the campaign is just beginning. "
 texas.97.o1:0 "Long Live Sherri I"
 texas.98.t:0 "Apointing a Prime Minister"
 texas.98.d:0 "Good morning and welcome to the TBS. By tonight we should be expecting the news of an appointed Prime Minister to lead the nation next to His Royal Highness. According to the kings office, the king has narrowed his choice down to three choices, Greg Abbot, Larry Kilgore, and Rand Paul. Greg Abbot has the support of the people behind him as many see him to be a populist leader who will not only look out for the king but also the people. Kilgore, while not having the support of the people, apparently has the support of the military and Rand Paul has the support of the people and the politicians. We’ll keep you updated as the choice is eventually made. "
 texas.98.o1:0 "Greg Abbott!"
 texas.98.o2:0 "Larry Kilgore!"
 texas.98.o3:0 "Rand Paul!"
 texas.99.t:0 "Electing a Prime Minister"
 texas.99.d:0 "“Good morning and welcome to the TBC. Since the coronation of Her Royal Majesty Sherri Burr, the country has been abuzz with election news. While the campaign has been drastically shortened, the people are ready to vote. Currently Gregg Abott and Rand Paul lead the polls with Jose R Rodriguez in third and surprisingly David Cobb who is still in this due to his support in the north. Abbot who has not taken a break from campaigning has said he hopes to serve the country in the ways that matter, not just to promote his agenda. While Rand Paul has stated that he wants to govern on common sense. The rest of the candidates have yet to make a response to Abbot.” "
 texas.99.o1:0 "Greg Abbott!"
 texas.99.o2:0 "Rand Paul!"
 texas.99.o3:0 "Jose R. Rodiguez"
 texas.99.o4:0 "David Cobb!"
 texas.100.t:0 "“Good evening, I wish I could say this was a blessed day but it truly is not. Jim Jones, holy prophet and leader of our nation has died. As reported earlier by the clergy, Jones’ physical body has died while his spirit has ascended to heaven. While we are happy to know he achieved his earthly goals, many of us are wondering who will lead the country. Will it be Jim Jones Jr, the so-called heir or Stephen Jones, the only biological kid?” "
 texas.100.o1:0 "Stephen Jones!"
 texas.100.o2:0 "Jim Jones JR.!"

