 lin.4.d:0 "“Our generals have reported the complete collapse of the great falls regime, while their leadership has yet to be found, most of their regiments have laid down their arms and surrendered.” Weaver delivered to Spencer. “Good Job, prepare an escort, im personally going to deliver our demands to great falls.” “On it Sir.” Weaver leaves the room. “Great Falls, I knew I would return one day.”"
