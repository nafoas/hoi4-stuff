 lin.26.t:0 "Native Question"
 lin.26.d:0 "Small groups of Native inhabbitents are spread across the entire nation. With this comes the question of what to do with them, on the one hand we can simply deport them and get rid of them, on the otherhand they were the original settlers of this land, we can simply confine them to there own semi-autonomous state."
 lin.26.o1:0 "Set Up Their Own State"
 lin.26.o2:0 "Deport Them"
