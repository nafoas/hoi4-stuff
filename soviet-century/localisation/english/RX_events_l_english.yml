 britain.500.t:0 "Remaining Royals Arrive"
 britain.500.d:0 "Following the execution of the Windsors and proclamation of a communist "DPRB" led by Dermot Hudson, a Spanish ship arrived in Nova Scotia bearing the last leaders of a dynasty thought to be eradicated by the iron-fisted leader of a republican Britain. Andrew of York, off on a diplomatic mission for the royal family, and Edward, Earl of Wessex, away from Buckingham Palace when it was stormed and Elizabeth imprisoned, were greeted with minutes of cheers and applause when they were first seen publicly in Halifax. While the remnants of the Windsor dynasty have been damaged severely by the attempted destruction of their family line, The Canadian Prime Minister has made haste to begin the process of coronation for the next British monach, so that a clear symbol of resistance can be created against the red menace that has overtaken the isles.\n\nHowever, the Prime Minister soon learned that the supporters of the Windors had failed to unify behind a single candidate - although the rightful heir to throne, Prince Andrew, is marred by constant scandals following a seperation with his wife that raised many complaints about the conduct and public appearance of the middle-aged prince. Andrew's opponents have organized themselves under the banner of the "Edwardians", supporting the relatively young, fresh, and popular Prince Edward. Such a faction argues that Prince Andrew is unfit to rule and would not truly unify the British people in the fight against communism.\n\nThe issue, however, is up to the Prime Minister, the nobility, and the people of the Commonwealth. Should Andrew or Edward be the new King of Great Britain?"
 britain.500.o1:0 "Support the Legitimists - crown Prince Andrew!"
 britain.500.o2:0 "Support the Edwardians - crown Prince Edward!"
 britain.501.t:0 "British Nobles Crown Prince Andrew"
 britain.501.d:0 "Unfortunately, the only line of the Windsor dynasty we were fully able to eradicate was that of Prince Charles - the rest, unfortunately, have fled across the world from Canada to Spain, and now, one is being paraded as the rightful King of the British Isles. Prince Andrew, a scandalous diplomat and second son of Queen Elizabeth, was off attending to one of the royal family's diplomatic duties when Buckingham was stormed, and unfortunately, he was not caught before fleeing into Canada with his two daughters. While we may have extinguished most of the Windsor lines, it is unfortunate that Prince Andrew has gotten away from us, and continues to promote his reactionary and antiquated institution from within the borders of Canada."
 britain.501.o1:0 "A shame that one got away..."
 britain.502.t:0 "British Nobles Crown Prince Edward"
 britain.502.d:0 "Unfortunately, the only line of the Windsor dynasty we were fully able to eradicate was that of Prince Charles - the rest, unfortunately, have fled across the world from Canada to Spain, and now, one is being paraded as the rightful King of the British Isles. Prince Edward, a popular, competent royal and third son Queen Elizabeth, was off in his estate outside the palace when Buckingham was stormed, and unfortunately, he was not caught before fleeing into Canada with his wife and immediate family. While we may have extinguished most of the Windsor lines, it is unfortunate that Prince Edward has gotten away from us, and continues to promote his reactionary and antiquated institution from within the borders of Canada."
 britain.502.o1:0 "A shame that one got away..."
 britain.503.t:0 "Edward IX Returns to Britain"
 britain.503.d:0 "Formerly known as Prince Andrew of York, King Edward IX has left Canada for good and returned to Britain to be fully and completely coronated as King of Great Britain, the first monarch since the scandalous Edward VII to bear the regnal name. Although many view Edward IX with much suspicion, pointing out his shifty ties to conservative and nationalist resistance movements and less than savory figures in the Canadian government, along with a variety of other public scandals, the monarchy still remains a relatively popular institution in Britain, as it was before the Griffiths regime tore the nation apart. With a new king, a new government, and a new future for Britain, the people have embraced once more the values of capitalism, patriotism, and most importantly, the thousand-year British ideal of monarchy. While he may have thought himself akin to Cromwell, in reality Griffiths has fallen in much the same fashion, and the institution he worked so hard to destroy has returned.\n\nRule Britannia!"
 britain.503.o1:0 "God save the king!"
 britain.504.t:0 "Edward IX Returns to Britain"
 britain.504.d:0 "Formerly known as Prince Edward of Wessex, King Edward IX has left Canada for good and returned to Britain to be fully and completely coronated as King of Great Britain, the first monarch since the scandalous Edward VII to bear the regnal name. Although many view Edward IX's legitimacy with suspicion, none can deny his popularity among the common people of Britain, and in fact, the monarchy as a whole's popularity, as it was before the Griffiths regime tore the nation apart. With a new king, a new government, and a new future for Britain, the people have embraced once more the values of capitalism, patriotism, and most importantly, the thousand-year British ideal of monarchy. While he may have thought himself akin to Cromwell, in reality Griffiths has fallen in much the same fashion, and the institution he worked so hard to destroy has returned.\n\nRule Britannia!"
 britain.504.o1:0 "God save the king!"
 britain.505.t:0 "Britain Divided"
 britain.505.d:0 "With Scotland having recently left our Union, the British Isles are once more divided. Henceforth we shall now be known as England."
 britain.505.o1:0 "I see."
 britain.506.t:0 "Britain United"
 britain.506.d:0 "With Scotland having recently been reunited with us, it is no longer accurate to call ourselves England. We are a united Britain once more."
 britain.506.o1:0 "Wonderful."
#2011 lib election maybe
 britain.507.t:0 "2011 Liberal Democrat Leadership Election"
 britain.507.d:0 "Having failed to secure a parliamentary majority in the most recent general election, the leadership of the Liberal Democrat Party has been called into question. Running against the incumbent leader is Navnit Dholakia, the former whip of the Liberal Democrats from 1997 to 2004 and a lifelong activist in the promotion of racial equality, police and penal reform. As an Indian, Dholakia has attracted support from many of the party's ethnic minorities who see him as their best chance to alter the party and the nation's stance towards matters of race. Alongside Dholakia, Sarah Teather has also gained significant support from the party. Being the only woman on the ticket, and the youngest, her supporters view her as a fresh start for the Liberal Democrats allowing for the party to find itself once again and move beyond decades of failure. Focusing much of her career on the promotion of education and welfare rights, Teather has attracted some left-leaning Liberal Democrats with many hoping this will siphon voters from the Labour Party at the next election. However, some believe that despite his failures at the general election Nick Clegg should remain the party's leader, yet some are more sceptical, believing that this is the beginning of a new Liberal Democrat Party."
 britain.507.o1:0 "Nick Clegg"
 britain.507.o2:0 "Navnit Dholakia"
 britain.507.o3:0 "Sarah Teather"
 britain.508.t:0 "2014 Liberal Democrat Leadership Election"
 britain.508.d:0 "Having failed to secure a parliamentary majority in the most recent general election, the leadership of the Liberal Democrat Party has been called into question. Running against the incumbent leader is Tim Farron, a relatively new member of the party, who has spent his career advocating for a more liberal Britain focusing on a revitalized economy that would prioritize the environment, easier access for migrants to Britain from across the free world and the legalization of marijuana. Farron has described himself as a centre-left candidate, with many hoping this will once again translate to a loss for the Labour and Independent Labour Party. Alongside Farron, Sarah Olney has also gained traction within the Liberal Democrat Party. Similar to Farron, Olney has been an outspoken supporter of a green Britain believing that the nation must revitalize its economy to focus on the preservation of both the environment and the wellbeing of the planet. Unlike other members of her party, Olney has also been an advocate for Britain to expand trade across the globe and secure healthier relations with Britain’s European neighbours. However, despite their failure at the general election, some believe that the party's leader should remain and succeed in 2017."
 britain.508.o1:0 "Keep the incumbent"
 britain.508.o2:0 "Tim Farron"
 britain.508.o3:0 "Sarah Olney"
 britain.509.t:0 "2017 Liberal Democrat Leadership Election"
 britain.509.d:0 "Having failed to achieve a parliamentary majority at the most recent general election, the Liberal Democrat Party has successfully called for a leadership contest bringing the parties future into question. Running against the incumbent leader is Jo Swinson, a well-known face within the party having been a member since she was seventeen. As an advocate for votes at sixteen, Swinson has attracted a large portion of the youth vote as well as the vast majority of the women’s vote who see her as an ideal candidate to represent the rights of mothers across Britain. Alongside Swinson, Luciana Berger has also gathered much support from within the party. As a woman of Jewish heritage, Berger has clung to this identity throughout her time as a Liberal Democrat member strongly following the Jewish teachings of “Tikkun Olam”. It is this desire to “repair the world” that has placed her at the forefront of the election, with many seeing her as the ideal candidate to counter the growing tensions across the world and heal the political divides within Britain. However, some believe that despite their failure at the general election the incumbent will manage to maintain their position as the leader of the party and win a decisive victory for the Liberal Democrats in 2020."
 britain.509.o1:0 "Keep the incumbent"
 britain.509.o2:0 "Jo Swinson"
 britain.509.o3:0 "Luciana Berger"
 britain.509.t:0 "2021 Liberal Democrat Leadership Election"
 britain.509.d:0 "Having failed to achieve a parliamentary majority at the most recent general election, the Liberal Democrat Party has successfully called for a leadership contest bringing the party's future into question. Running against the incumbent is Ed Davey, a man of the centre-right. Davey is committed to the free-market, deregulation and privatization of vital industries. As the most right-leaning candidate Davey has stated his aims to divide the Conservative Party and siphon votes away from them whilst remaining committed to the Liberal policies the party adheres to. However, Davey has been challenged by Layla Moran, a newcomer to the front of the Liberal Democrats. Having stood in elections since 2010, Moran has recently seen a rise to prominence due to her appointment to the Public Accounts Committee. Her staunch liberal values have made her a prime candidate for the leadership, but her youth and inexperience within front bench politics has raised many questions about her qualifications for the job. Despite the challenge to their leadership, the incumbent remains hopeful that their position as leader of the Liberal Democrats is secure and that they can lead the party to an electoral victory come 2023."
 britain.509.o1:0 "Keep the incumbent"
 britain.509.o2:0 "Ed Davey"
 britain.509.o3:0 "Layla Moran"

 britain.510.t:0 "2011 SDP Leadership Election"
 britain.510.d:0 "With the assassination of David Owen and the general election being the first loss for the Social Democrats since their rise to power in 1991, the party has called for a leadership election to determine its future. Running against the incumbent Shirley Williams is Charles Kennedy, a former member of the Liberal Democrats who joined the party soon after the 1995 general election. As a well-known face amongst the public, many in the SDP believe his popularity will win over the electorate and return them as the leading party. Kennedy is a committed anti-war politician, believing that Britain should remain focused upon itself and its allies, promoting peace across the world. However, as a recovering alcoholic, his critics worry that a position of power may cause a relapse. As well as Kennedy, Chris Huhne has also challenged Shirley Williams. Huhne is well known amongst the Social Democrat base, with many knowing him from his part-time writings for the Guardian. A champion of nuclear energy and electoral reform, Huhne has stood out as the candidate to move the SDP beyond the legacy of Owen and modernize the party. However, some believe that Shirley Williams will maintain her leadership and continue the legacy of Owen into the next general election."
 britain.510.o1:0 "Shirley Williams"
 britain.510.o2:0 "Charles Kennedy"
 britain.510.o3:0 "Chris Huhne"
 britain.511.t:0 "Resignation of Shirley Williams"
 britain.511.d:0 "Having successfully led the party at the side of David Owen since 1995, Shirley Williams has today called a meeting of the Social Democrat Party where she will announce her resignation as both party leader and a member of the House of Commons. The eighty-three-year-old, mother of the House, has served as a member of parliament since the conception of the original Social Democrat Party in 1981 and now, as she nears her late eighties, has decided to step down and allow the party to evolve past the guidance of the old “Gang of Four”. Her announcement has not only affected the SDP, as members from each of the mainstream political parties have thanked her for her years of service. Despite her announcement, Williams has ensured her party that she will remain active in party politics, continuing to campaign with the SDP for as long as she lives. Already the former leader has begun writing her memoirs, where she will detail the rise of the SDP from its original four members to the “party of Britain”. In her place, it has been announced that she will remain as the temporary head of the SDP before the party holds a leadership election later in the year. With candidates such as Vince Cable and Julia Goldsworthy leading the polls, a new age for the SDP has begun."
 britain.511.o1:0 "The end of an era..."
 britain.511.t:0 "Resignation of Shirley Williams"
 britain.511.d:0 "Following her unsuccessful election as party leader soon after the loss of the 2010 general election, Shirley Williams has today announced her resignation as a member of the House of Commons. The eighty-three-year-old mother of the House has served as a member of parliament since the formation of the original Social Democrat Party in 1981 and now, as she nears her late eighties, has decided to step down and allow the party to move beyond her and the Gang of Fours legacy. With the leader of the SDP congratulating her for her decades of service the House of Commons has today come together for a brief moment to applaud the aged politician thanking her for her dedication to her country. Despite her announcement, Williams has ensured her party that she will remain active in party politics, continuing to campaign with the SDP for as long as she lives. Already the former leader has begun writing her memoirs, where she will detail the rise of the SDP from its original four members to the “party of Britain”. With her replacement already preparing to take over in her constituency, a new age for the SDP has been cemented as now all members of the original Gang of Four have left the Commons."
 britain.511.o1:0 "The end of an era..."
 britain.512.t:0 "2014 Social Democrat Leadership Election"
 britain.512.d:0 "With the loss of the Gang of Four from front bench politics, the party has now begun to restructure itself and its leadership. However, even after the 2011 leadership election this rebranding of the party has failed and once again the Social Democrat Party has called another election to determine the future of the party. Running against the incumbent is Vince Cable, one of the more right-wing leaning candidates Cable has been a keen advocate of the privatisation of Royal Mail, to aid in the recovery of the economy. With much of Cable’s support coming from the centre-right of the party many are hopeful that temperate Conservatives would be willing to support him and regain the SDP a majority. As well as Vince Cable, Julia Goldsworthy has also gathered a significant amount of support. Much younger than her opposition, Goldsworthy has been described as a staunch liberal with her ideological hero being former Liberal MP David Penhaligon. Believing in a fairer Britain, Goldsworthy aims to reform the SDP to become one that truly works for all aiming to lower tuition fees and further funding the NHS. However, the incumbent is convinced they have the party’s confidence and remains committed to winning both the leadership challenge and the 2017 election."
 britain.512.o1:0 "Keep the incumbent"
 britain.512.o2:0 "Vince Cable"
 britain.512.o3:0 "Julia Goldsworthy"
 britain.513.t:0 "2014 Social Democrat Leadership Election"
 britain.513.d:0 "When Shirley Williams stepped down earlier in the year Norman Lamb promised to hold an official leadership election. Now, with campaigning for the 2014 general election soon to begin, the leadership election has officially been called. Norman Lamb aims to retain his position as leader of the party, but two others have gained significant support from within the SDP. Vince Cable has been a keen advocate of the privatisation of Royal Mail, to aid in the recovery of the economy. With much of Cable’s support coming from the centre-right of the party many are hopeful that temperate Conservatives would be willing to support him and regain the SDP a majority. As well as Vince Cable, Julia Goldsworthy has also gathered a significant amount of support. Much younger than her opposition, Goldsworthy has been described as a staunch liberal with her ideological hero being former Liberal MP David Penhaligon. Believing in a fairer Britain, Goldsworthy aims to reform the SDP to become one that truly works for all aiming to lower tuition fees and further funding the NHS. However, Lamb is convinced he has the party’s confidence and remains committed to winning both the leadership challenge and the 2017 election."
 britain.513.o1:0 "Norman Lamb"
 britain.513.o2:0 "Vince Cable"
 britain.513.o3:0 "Julia Goldsworthy"
 britain.514.t:0 "2017 Social Democrat Leadership Election"
 britain.514.d:0 "Having failed to secure a parliamentary majority in the most recent general election, the leadership of the Social Democrat Party has now been called into question, with enough of the party having lost faith in the incumbent to initiate a leadership election. Running against the incumbent is Chris Leslie, a centre-left politician with much to offer the party due to his youth and experience within parliament. As one of the more progressive voices in the SDP, his loyalty to the party has been called into question with many fearing he will leave to join the Labour Party. However, such rumours are constantly shot down by the potential leader. As well as Chris Leslie, Jess Phillips has also gained support from within the party as a potential candidate for leadership. As a staunch feminist, Phillips remains committed to improving the lives of women across Britain promising to focus on fighting sexism and patriarchal structures wherever they rear their ugly head. Much like Chris Leslie, Phillips identifies as a centre-left politician. However, unlike Leslie, her loyalty to the party has not been brought into question. Despite this challenge, the incumbent remains hopeful that they will win over their party’s support once more and win the 2020 general election."
 britain.514.o1:0 "Keep the incumbent"
 britain.514.o2:0 "Chris Leslie"
 britain.514.o3:0 "Jess Phillips"
 britain.514.t:0 "2021 Social Democrat Leadership Election"
 britain.514.d:0 "Having failed to secure a parliamentary majority at the most recent general election, the leadership of the Social Democrat Party has been called into question. Running against the incumbent is Angela Smith, originally a member of the Labour party in her early teenage years, the now centre-left politician aims to take the party back to how it was seen by the people in the mid-nineties. Running on a campaign of increased funding for both the NHS and schools across Britain, Smith aims to regain the support of the British people by returning to the SDP’s roots. As well as Angela Smith, Margaret Hodge has also announced her candidacy for leadership and has gained a significant following from within the party. As a secular Jew, Hodge has campaigned tirelessly to promote a more tolerant and welcoming society in Britain. However, such campaigns have been undermined by comments made back in 2006 about prioritising British families over immigrants for council house waiting lists which gained unnecessary praise from the BNP. Despite this, Hodge remains committed to making a fairer Britain for all within its borders. However, the incumbent remains hopeful that they will win over their party’s support once more and win the next general election."
 britain.514.o1:0 "Keep the incumbent"
 britain.514.o2:0 "Angela Smith"
 britain.514.o3:0 "Margaret Hodge"


 #Congress shit
 britain.515.t:0 "Prime Minister Galloway Announces Merger of Parties"
 britain.515.d:0 "In a speech today in the House of Commons, Prime Minister George Galloway has announced the merger of all major socialist parties in Britain into the Workers Revolutionary Party. From today, members of the Independent Labour Party and Socialist Workers Party will now reside in the House of Commons as members of the WRP. Prime Minister Galloway has stated that this merger will “secure the future for socialism in Britain for decades to come”. While this move had attracted support from the hinterlands of the leftist parties, multiple parliamentarians refused to cross benches, deeply critical of the forced unification. Nevertheless, leading members of the ILP, such as former Chancellor John McDonnell and MP Ken Livingstone, have endorsed the unification and in return been offered positions within Galloway’s cabinet. Similarly, the trade unions have also been brought under the control of the WRP, with General Secretary of Unite the Union Len McCluskey now operating as the figurehead of the WRP’s trade union alliance. This merger of parties and alliance with the trade unions has now cemented the Prime Minister’s control over the entire political system, giving him an unassailable majority to carry out his reforms."
 britain.515.o1:0 "A glorious day for the party and the nation"
 britain.517.t:0 "John McDonnell Addresses the Party"
 britain.517.d:0 "Having joined the Workers Revolutionary Party following the merger of the socialist parties, John McDonnell was restored to the position of Chancellor of the Exchequer in order to cement the loyalty of the former Independent Labour Party. Now, McDonnell has today addressed the party, commending the important work of the ILP, and proclaimed his support for the government. Beginning his speech by supporting the actions of the new government in laying the groundwork for socialism, McDonnell then went on to state that 'whilst the revolution has been successful, there have been too many unnecessary casualties'. Whilst his comments have seen widespread support, some have begun to speculate about McDonnell’s statement, believing that McDonnell harbours opposition towards Galloway’s course, and that his comments referred to the now jailed Jeremy Corbyn, his old friend. However, the Chairman has dismissed these rumours as nothing more than an attempt by McDonnell’s opponents to disrupt the fragile alliance of parties. McDonnell concluded his speech by pledging his, and all former ILP members, support for the Workers Revolutionary Party and announced that he would continue to work for the cause of socialism for as long as he lives."
 britain.517.o1:0 "A good speech, Comrade McDonnell"
 britain.518.t:0 "Lindsey German Proposes New Foreign Policy"
 britain.518.d:0 "Comrade Lindsey German, formerly a leading member of the Socialist Workers Party, has today alongside a number of cosigners put forward a motion for the upcoming Workers’ Congress, detailing a vision for the future of British foreign policy. Aptly named “Socialism through Peace”, the doctrine believes that whilst the present doctrine established by Chairman Galloway is effective, it can be modified to realign British socialism towards self-preservation, rather than the hostile foreign policy traditionally prescribed by Trotskyism. Arguing that by focusing on internal reform, such as devolution for the Scottish and Welsh peoples, and furthering relations with like-minded governments such as the American People’s Commonwealth, Britain can establish itself as a world power once more. While some within the party, most notably the Chairman himself, are sceptical of the domestic proposals, German’s stance on a potential alliance with the People’s Commonwealth has been received with high praise, with great advantages for both states being recognized. Whether the Congress will implement this proposal is unknown. Nevertheless, German remains committed to her doctrine and argues it will be Britain’s saving grace."
 britain.518.o1:0 "Socialism through peace. An interesting doctrine indeed..."
 britain.519.t:0 "Len McCluskey Meets with Chairman Galloway"
 britain.519.d:0 "With the alliance between the trade unions and the Workers Revolutionary Party still in its infancy, Len McCluskey has today met with Chairman Galloway to discuss furthering this alliance. Believing that the trade unions have played a vital role in the establishment of socialism, with membership of a trade union now mandatory, McCluskey now seeks to further integrate the unions into British politics. To do so, McCluskey has asked the Chairman to allow leading members of trade unions influential positions within the soon to be established British Workers’ Congress. Officials such as Dave Ward, Tim Roache and McCluskey himself would be guaranteed seats within the Congress, in order to properly represent the working people of Britain. In thanks for the support the trade unions have already given to the revolution, the Chairman has granted the request made by McCluskey, stating that their aid shall be vital in the advancement of the British socialism. Critics of the plan state that the agreement gives trade unions too much influence over Congress. However, the Chairman has insisted that his word will always command more authority than the unions."
 britain.519.o1:0 "The unions shall be given the representation they deserve"
 britain.522.t:0 "[Root.GetYear] Workers' Congress Election"
 britain.522.d:0 "Today Chairman McCluskey has announced the second Workers' Congress elections, aimed at showcasing the people’s continued support for Socialism. Although many candidates have been chosen by Union committees, the election has not been marked with a heavy degree of fraud. With that, a figure must be found for the Chairmanship. Here the most influential candidates are Tim Roache, the General Secretary of GMB, who has argued for an increase in defence spending to help preserve the socialist revolution, but also advocating a slower transition towards Socialism. The widely respected Frances O’Grady, General Secretary of the Trades Union Congress, has also announced her candidacy, seeking to enact new legislation to expand the role of trade unions in society, with the intent of securing further representation for the working class. Finally there is Paul Nowak, the youngest candidate, which has caused some concern amongst older members, believing he is too inexperienced for the role of Chairman. However, as the deputy General Secretary of the Trade Union Congress, many see Nowak as a fresh face capable of renewing British Socialism. Now after much debate within Congress the party has elected..."
 britain.522.o1:0 "Len McCluskey"
 britain.522.o2:0 "Tim Roache"
 britain.522.o3:0 "Frances O'Grady"
 britain.522.o4:0 "Paul Nowak"
 britain.523.t:0 "[Root.GetYear] Workers' Congress Election"
 britain.523.d:0 "Today Chairwoman Lindsey German has announced new elections for the Workers' Congress. In contrast to the former Chairman Galloway, Chairwoman German has encouraged active debate among the multitude of candidates in constituencies around the country about policy and ideology, including televised roundtable discussions amongst the party leadership. Also proposed for the Chairmanship is Murad Qureshi, who has demonstrated himself to be as committed to the doctrine of “Socialism through Peace” as the Chair herself, believing that war would undermine the gains of Socialism. As a child of Bangladeshi parents, Qureshi demonstrates how far the party has come since the election of German, as a sign of the diversity of the new Britain. Similarly, Alexander Callinicos has also put his name forward. As a former member of the Socialist Workers Party, Callinicos rose through the ranks following the merger with the Worker's Revolutionary Party. During this time, Callinicos has continued to argue for a firm Trotskyist doctrine, in stark opposition to the pacifistic foreign policy doctrine established by Chairwoman German. After hours of debate, the votes have now been counted with the Congress electing..."
 britain.523.o1:0 "Lindsey Graham"
 britain.523.o2:0 "Murad Qureshi"
 britain.523.o3:0 "Alexander Callinicos"
 britain.524.t:0 "[Root.GetYear] Workers' Congress Election"
 britain.524.d:0 "Today Chairman McDonnell has announced the second election for the Workers' Congress. However, unlike former Chairman George Galloway, Chairman McDonnell has actively opened the government up, allowing independents to contest seats for Congress and engaging in thorough debate throughout the electoral campaign. Despite having suffered a minor heart attack in 2013, McDonnell is convinced he will gain re-election, yet part of him wonders whether it’s time to step back. Prepared to replace the popular Chairman stands Rebecca Long-Bailey, protegé of the sitting Chairman. Despite originally being a member of the Independent Labour Party, Long-Bailey was quick to follow her mentor into the Workers Revolutionary Party. Hannah Sell, former leader of the Socialist Party, has also announced her candidacy. Her election would represent a shift in the party’s doctrine back towards a more orthodox Trotskyist line, though still with a commitment towards McDonnell’s democratic reforms. Derek Hatton has also gained large support, thanks to his decades of experience and commitment to the Trotskyist ideals, making him a prime candidate for the ideological hardliners. Now after much debate and deliberation, Congress has elected..."
 britain.524.o1:0 "John McDonnell stays on"
 britain.524.o2:0 "Rebecca Long-Bailey continues his legacy"
 britain.524.o3:0 "Hannah Sell"
 britain.524.o4:0 "Derek Hatton"
 britain.529.t:0 "Trial of Jeremy Corbyn"
 britain.529.d:0 "Today the Supreme Court has convicted the leader of the Independent Labour Party, Jeremy Corbyn, of counter-revolutionary sabotage, sentencing him to rehabilitative labour in the Scottish Highlands. Having pleaded not guilty at the start of his trial, Corbyn had defended his actions surrounding the abolition of the monarchy as “just and fair”, stating that he would have initiated the abolition if he had been granted more time to organise a referendum on the matter. However, despite his claims, both the court and General Secretary Griffiths were quick to denounce his defence, with the General Secretary soon after branding Corbyn and the entire leadership of the Independent Labour Party as “social fascists”. Soon after the trial concluded, the General Secretary announced an official ban on the Independent Labour Party, calling for its members to either join the Communist Party or disperse. General Secretary Griffiths has already ruled out a short sentence, stating that “a social fascist cannot be cured, only contained.” Now with the end of the Independent Labour Party, the General Secretary has now removed all threats to his leadership and is free to enact the necessary reforms to bring communism to Britain."
 britain.529.o1:0 "The Social Fascists shall trouble us no more"
 britain.530.t:0 "[Root.GetYear] Workers' Congress Election"
 britain.530.d:0 "Today marks the third Workers' Congress elections. However, in a chilling difference from the previous elections, the Chair has secured the total loyalty of the party and its candidates, in a manner dissidents compare with the worst of the Warsaw Pact. With all opposition within the Workers' Congress now expelled or compliant, the reelection of [ENG.Getleader] now seems all but certain. Some radicals within the party have even suggested that the need for elections is over, claiming that the will of the party and the people are now completely and utterly unified. Despite these calls, the Chair has refused to cancel future elections, remaining committed to the so-called democratic process within the country, describing it as a “vital part of socialist practice”. Having received ninety-nine percent of all cast votes across the country, the Worker's Revolutionary Party are celebrating this as a democratic landmark. Naturally, [ENG.Getleader] has been re-elected and now stands unchallenged by any opposition, cementing the absolute rule of the Chair forevermore."
 britain.530.o1:0 "Congratulations to Comrade [ENG.Getleader]!"
 britain.531.t:0 "[Root.GetYear] Workers' Congress Election"
 britain.531.d:0 "Today marks the third Workers' Congress elections called since the formation of the Republic. With the trade unions now controlling most of the WRP apparatus, many candidates who had initially put their names forward quickly had their candidacy shot down, if they were running against the officially nominated trade union candidates. Candidates for the Chair include David Prentis and Brendan Barber. Prentis, although currently not an active leader of a trade union, has much experience in the political world and gained much respect during his time as General Secretary of UNISON. As the moderate opposition, Prentis has supported the easing of legislation such as mandatory membership of a trade union, a position that has seen opposition among the general public. Similarly to Prentis, Brendan Barber is also not a current leader of a trade union, but was once General Secretary of the Trades Union Congress. Unlike his opponent, Barber supports the status-quo, arguing that if anything trade union influence should expand even further. Now after two separate debates, Congress has cast their ballots electing..."
 britain.531.o1:0 "[ENG.Getleader]"
 britain.531.o2:0 "Brendan Barber"
 britain.531.o3:0 "Dave Prentis"
 britain.532.t:0 "[Root.GetYear] Workers' Congress Election"
 britain.532.d:0 "Today marks the third election for the Workers' Congress since the adoption of the current Trotskyist constitution. With widespread support for the pacifist course laid down by Lindsey German ten years ago, many candidates viewed as too authoritarian have largely been sidelined during the nominations for the third Workers Congress elections. Now, [Eng.Getleader] runs against a ballot of like-minded opponents, who have all debated multiple times for thorough the election. John Rees has throughout demonstrated his support for the Trotskyist doctrine, praising every aspect of its implementation throughout, arguing that as Lindsey German did, he too will bring about a new era of prosperity and peace for the nation. Similarly, Chris Nineham has also pledged to preserve the peace and the gains of the revolution. However, his politics seems to diverge from the Trotskyist mainstream, as he seemingly prefers to just label himself as a Socialist rather than a Trotskyist or a Communist. However, many see this as a positive, with his views broadening the debate and showing that the days of ideological rigidity might be firmly behind the Worker's Revolutionary Party. As the Congress members take their places, they have cast their ballots electing..."
 britain.532.o1:0 "[ENG.Getleader]"
 britain.532.o2:0 "John Rees"
 britain.532.o3:0 "Chris Nineham"
 britain.533.t:0 "[Root.GetYear] Workers' Congress Election"
 britain.533.d1:0 "The third set of elections for the Workers’ Congress since its foundation have been called. Following Chairman McDonnell’s initial election, the Worker's Revolutionary Party began to move beyond the authoritarianism established by Galloway. A decade later, the candidates seem to have expanded the traditional Trotskyism. Many of the WRP-aligned candidates around the country describe themselves as Marxists, rather than Trotskyists, with some, particularly among the independents, even seeming more moderate than that. As usual, a Chair has to be found for the coming term. Christine Blower, the former General Secretary of the National Union of Teachers, has announced her ambitions to overhaul the educational system and increase funding for schools. Similarly, Zarah Sultana has announced her candidacy. As the youngest member on the ticket, only in her late twenties, many are concerned about her experience, and wonder if she is the best candidate for the Chair. However, Sultana’s commitment to a green transformation of Britain has given her a dedicated following from younger sections of the party. Now after several debates between the candidates, the election has now come with Congress electing..."
 britain.533.d2:0 "The third set of elections for the Workers’ Congress since its foundation have been called. Following Chairman McDonnell’s initial election the Workers Revolutionary Party began to move beyond the authoritarianism established by Galloway. Many of the WRP-aligned candidates around the country describe themselves as Marxists, rather than Trotskyists, with some, particularly among the independents, even seeming more moderate than that. As usual, a Chair has to be found for the coming term. Christine Blower, the former General Secretary of the National Union of Teachers, has announced her ambitions to overhaul the educational system and increase funding for schools. Similarly, Zarah Sultana has announced her candidacy. Sultana’s commitment to a Green revolution has given her a dedicated following from younger sections of the party. Finally, in a massive shock to British politics and the WRP in particular, Jeremy Corbyn has also announced his candidacy following his return to politics. Having seemingly embraced the Socialist revolution he inadvertently caused, Corbyn now aims to reshape it in his own vision and enact further democratic reforms in the Socialist republic. After much debate, the Congress has elected..."
 britain.533.o1:0 "[ENG.Getleader]"
 britain.533.o2:0 "Christine Blower"
 britain.533.o3:0 "Zarah Sultana"
 britain.533.o4:0 "Jeremy Corbyn returns"
 britain.534.t:0 "Tony Benn Rushed to Hospital"
 britain.534.d:0 "Today Downing Street officials have announced that Prime Minister Tony Benn has been rushed to St.Thomas Hospital after suffering from a stroke during one of his cabinet meetings. The Prime Minister has been placed in intensive care, with reports of him being in a stable condition being revealed to the press by now acting Prime Minister Jo Cox. Already suffering from chronic lymphocytic leukaemia, the Prime Minister's stroke has generated a heightened worry for both the Labour Party and the British public. With the assassination of David Owen still fresh in the minds of the public, many fear the loss of a second Prime Minister and the potential political instability it could cause. However, for the time being, Tony Benn remains in a stable condition, and the acting Prime Minister remains hopeful that he will make a full recovery by year's end and return to leading the country. Despite the acting Prime Minister's public optimism, she, and much of the cabinet, have privately expressed their doubts of Benn’s return and fear that sooner or later the party will have to hold an official leadership election to determine a successor, should Benn’s health develop for the worse."
 britain.535.o1:0 "Get well soon, Prime Minister Benn."
 britain.536.t:0 "Tony Benn Rushed to Hospital"
 britain.536.d:0 "Today Downing Street officials have announced that Prime Minister Tony Benn has been rushed to St.Thomas Hospital after suffering from a stroke late last night. The eighty-six year old Labour veteran was diagnosed with chronic lymphocytic leukaemia in the early 1990s and given three years to live at most. However, surpassing his doctor’s expectations, Benn has continued to live and campaign for Labour despite his diagnosis until his stroke last night. Whilst Benn’s doctors have confirmed he remains in a stable condition, with only his closest family being allowed to visit him, they have insisted that Benn does not leave the hospital for any reason as the risk of a second stroke is, for the moment, high. Politicians from across the political spectrum have already given their best wishes to the Labour leader, hoping for a swift recovery. However, such recovery seems unlikely given the doctor’s recommendation. For the time being, Jo Cox has been appointed as acting leader of the Labour Party and has promised to step down from the role once Tony Benn returns from the hospital. However, many fear that Benn will not be returning any time soon, and that the party will have to call a leadership election should Benn not return within the year."
 britain.537.o1:0 "He’ll be back home in the Commons by years end."
 britain.538.t:0 "Tony Benn Rushed to Hospital"
 britain.538.d:0 "Today the Labour Party has announced that its former leader, Tony Benn, has been rushed to the hospital after suffering from a stroke late last night. The eighty-six year old Labour veteran was diagnosed with chronic lymphocytic leukaemia in the early 1990s and given three years to live at most. However, surpassing his doctor’s expectations, Benn has continued to live and campaign for Labour from his diagnosis until his stroke last night. Whilst Benn’s doctors have confirmed he remains in a stable condition, with only his closest family being allowed to visit him, they have insisted that Benn does not leave the hospital for any reason as the risk of a second stroke is, for the moment, high. Members of the Labour Party have already given their wishes to their former leader, hoping for a swift recovery. Prime Minister [Root.Getleader], gave a speech in the Commons today encouraging all members, regardless of their political affiliation, to do the same for the beloved political veteran. For the time being Benn remains in hospital, with millions across the nation eagerly awaiting any update from himself or his doctors."
 britain.538.o1:0 "He’ll be back home in the Commons by years end."
 britain.539.t:0 "Prime Minister Benn Announces Resignation"
 britain.539.d:0 "Having now been allowed to leave St.Thomas’ hospital, after receiving months of intensive care and after careful deliberation with his doctors, Prime Minister Tony Benn has today announced his resignation from the position of Prime Minister, and his subsequent retirement from the House of Commons altogether. Citing the same reasoning he did in 1999 when he first resigned from politics, Tony Benn will now resign from politics, to once again spend more time with politics. However, unlike in 2005, when he returned following the death of his successor Robin Cook, it seems unlikely that Benn will ever return to mainstream politics, given the severity of the stroke and concerns that he does not have much time left to live. Now with his official resignation, the Labour Party has begun preparations for Jo Cox to form a government in the Queen’s name. Whilst the British public has been spared the death of another Prime Minister in less than two parliamentary sessions, Tony Benn’s retirement from mainstream politics has still been felt by the Labour Party and its supporters."
 britain.539.o1:0 "Thank you for your years of service, Prime Minister Benn"
 britain.540.t:0 "Labour Leader Tony Benn Announces Resignation"
 britain.540.d:0 "Having now been allowed to leave hospital, months after his admittance and after careful deliberation with both his family and doctors, Tony Benn has today announced his resignation as leader of the Labour Party and retirement from the House of Commons altogether. Citing the same reasoning he did in 1999 when he first resigned from politics, Tony Benn will now resign from politics, to once again spend more time with politics. However, unlike in 2005, when he returned following the death of his successor Robin Cook, it seems unlikely that Benn will ever return to mainstream politics given the severity of the stroke and the worry that he does not have much time left to live. Now with his official resignation, Jo Cox will stay on as acting leader until an official leadership contest can determine the successor of Benn and the person who will lead the Labour Party at the next general election. With Benn leaving a lasting mark on the party, only time will tell if the party sticks to his ideals or if a new Labour Party emerges from their beloved leader’s departure."
 britain.540.o1:0 "He will be missed by all"
 britain.541.t:0 "Tony Benn Announces Resignation"
 britain.541.d:0 "Having now been allowed to leave hospital, months after his admittance and after careful deliberation with both his family and doctors, Tony Benn has today announced that he will not be standing for re-election come next election and he will resign immediately as a member of parliament for the Labour Party. Citing the same reasoning he did in 1999, when he first resigned from politics, Tony Benn will now resign from politics to once again spend more time with politics. However, unlike in 2005, when he returned following the death of his successor Robin Cook, it seems unlikely that Benn will ever return to mainstream politics, given the severity of the stroke and the worry that he does not have much time left to live. Now with his official resignation, the House of Commons will have to continue without the championed veteran of left-wing politics and look forward to, instead, campaigning with the ageing activist on the streets rather than in Commons where he has sat for decades. With Benn leaving a lasting mark on the party, only time will tell if the party sticks to his ideals or if a new Labour Party emerges from their beloved leader’s departure."
 britain.541.o1:0 "He will be missed by all"
 britain.542.t:0 "Tony Benn Passes Away"
 britain.542.d:0 "Former Prime Minister Tony Benn has today been announced dead after being found in the early hours of the morning by his family with a pen and paper in hand, finishing off one of his infamous diary entries. Already his doctors have confirmed that the cause of death was complications with his leukaemia that arose late in the evening as Benn was writing his last diary entry. A public funeral has now been planned for the nineteenth of March, and tributes from across the political aisle have started to flood in. Leader of the Labour Party Jo Cox and Independent Labour Party leader Jeremy Corbyn have already met with Benn’s family to give their condolences and have offered to support the grieving family wherever they can. Whilst Benn had resigned as Prime Minister before his death, the nation has still been deeply affected by this loss, fearing that the next government may be as unstable as the last two. However, the Prime Minister has promised to unite the country in the coming years, finally putting to rest the political instability that has plagued Britain."
 britain.542.o1:0 "A true politician, called to rest"
 britain.543.t:0 "Tony Benn Passes Away"
 britain.543.d:0 "Former leader of the Labour Party Tony Benn has today been announced dead after being found in the early hours of the morning by his family with a pen and paper in hand, finishing off one of his infamous diary entries. Already his doctors have confirmed that the cause of death was complications with his leukaemia that arose late in the evening as Benn was writing his last diary entry. A public funeral has now been planned, and tributes from across the political aisle have started to flood in. The leader of the Labour Party and Independent Labour Party leader Jeremy Corbyn have already met with Benn’s family to give their condolences and have offered to support the grieving family wherever they can. With his passing Britain's left has now been left with a vacant seat, and as the harsh reality of Benn’s passing sets in, many are wondering if the Labour Party shall stay true to the ideals that were present under his leadership or if its new leader will move the party beyond Tony Benn towards something new altogether."
 britain.543.o1:0 "A true politician, called to rest"
 britain.544.t:0 "Funeral for Prime Minister Tony Benn"
 britain.544.d:0 "Thousands have turned out today to mourn the death of former Prime Minister Tony Benn, who stepped down from front-bench politics in late 2012 following a near fatal stroke. Having only served as Prime Minister for less than a year, Benn was one of Britain’s most recognisable faces in politics and his loss has already been felt across the nation. As the funeral procession began, with close family and friends such as Jeremy Corbyn, Jo Cox and George Galloway in attendance, Benn’s son carried his father’s coffin past St.Margaret's Church, where a crowd had gathered in their thousands carrying various trade union banners, copies of Benn’s books and a few bringing their old smoking pipes to pay tribute to Benn in their own way. After an emotional eulogy by his son, Hilary Benn, and a private procession for his close family the public were allowed to pay tribute to Benn inside the church. By day’s end Benn’s coffin, wrapped in the Union Jack, was covered in a sea of red roses and once the crowd had dispersed, Benn’s ashes were taken to Essex, where he now lays buried next to his wife."
 britain.544.o1:0 "Tony Benn, he encouraged us"
 britain.545.t:0 "Funeral for Tony Benn"
 britain.545.d:0 "Thousands have turned out today to mourn the death of former Labour Party leader Tony Benn, who stepped down from politics in late 2012 following a near fatal stroke. Having served as leader of the Labour party for seventeen years, Benn was one of Britain’s most recognisable faces in politics and his loss has already been felt across the nation. As the funeral procession began, with close family and friends such as Jeremy Corbyn, Keir Starmer and George Galloway in attendance, Benn’s son carried his father’s coffin past St.Margaret's Church, where a crowd had gathered in their thousands carrying various trade union banners, copies of Benn’s books and a few bringing their old smoking pipes to pay tribute to Benn in their own way. After an emotional eulogy by his son, Hilary Benn, and a private procession for his close family, the public were allowed to pay tribute to Benn inside of the church. By day’s end Benn’s coffin, wrapped in the Union Jack, was covered in a sea of red roses and once the crowd had dispersed Benn’s ashes were taken to Essex, where he now lays buried next to his wife."
 britain.545.o1:0 "Tony Benn, he encouraged us"
 britain.546.t:0 "Tony Benn Passes Away"
 britain.546.d:0 "Former leader of the Labour Party Tony Benn has today been announced dead after being found dead in his bed in the early hours of the morning by his family. Having been forced to retire from politics by Chairman Galloway, Benn has spent his remaining days largely at home writing his final memoirs. Having been kept under constant surveillance by his doctors following his stroke in 2012, Benn has finally succumbed to his illness. An official funeral has been planned for Benn, however, the event will only be for friends, family members and a select few representatives of the WRP. The underground Labour Party, led by Jo Cox, have also reportedly held a memorial event for Benn, with members gathering in private to speak of their late leader and give their final farewells to Benn. With his passing, [ENG.Getleader], has expressed the government's sadness at his passing, stating that while Benn had “differed in his politics, he remained a committed and ardent socialist his life throughout, dedicated to the betterment of Britain.” Now with his death, an era of politics has closed on the British left, with many mourning the loss of this champion of British politics."
 britain.546.o1:0 "A true comrade, regardless of his politics"
 britain.547.t:0 "Tony Benn Passes Away"
 britain.547.d:0 "Former leader of the Labour Party Tony Benn has today been announced dead after being found dead in his bed in the early hours of the morning by his family. Having been awaiting trial for his loyalties to the Labour Party, Tony Benn finally succumbed to his illnesses that began in 2012 following his stroke. Having spent his final day writing in his memoirs, the aging politician's final entry wrote that he was “heartbroken at the course Britain has taken since the election of the Conservative Party.” The current leader of the Labour Party, Jo Cox, has been informed of Benn’s passing and given her sympathies to his family. A funeral has been allowed by the government, however, the affair will only be available for Benn’s immediate family. However, the Labour Party has held their own private funeral for Benn, giving him one final farewell from his beloved party. With his passing both Benn’s and the Labour Party’s legacy have ended, with the government denouncing Benn as nothing more than a communist sympathiser, aiming to subvert the nation and sell it out to the Warsaw Pact."
 britain.547.o1:0 "Another dead communist"
 britain.548.t:0 "Tony Benn Passes Away"
 britain.548.d:0 "Former leader of the Labour Party Tony Benn has today been announced dead after being found dead in his bed in the early hours of the morning by his family. With the Labour Party and like-minded parties being marginalized by the Queen following her storming of parliament, few politicians have commented on the matter. Nevertheless, Labour leader Jo Cox has expressed her deepest sympathies to Benn's family. Having spent his final days writing his memoirs, Benn has expressed in his final entry that he has become “heartbroken at parliament's decision to allow the Queen to enter the House of Commons.” The continued marginalisation of the Labour Party has already had damaging effects on its popularity, with many believing it will fade into political obscurity by the year's end. Although the Labour Party has seen support dwindle since its marginalisation, his funeral is expected to see massive attendance. Benn’s death has been felt across Britain’s left, with members of the likewise marginalised Workers Revolutionary Party and Independent Labour Party giving their sympathies to the family. However, with the Queen’s rule now absolute, Benn's dreams of a fairer Britain have died with him."
 britain.548.o1:0 "How terrible. Time for tea."
 britain.549.t:0 "Tony Benn Passes Away"
 britain.549.d:0 "Former leader of the Labour Party Tony Benn has today been announced dead after being found dead in his bed in the early hours of the morning by his family. Having been placed in house arrest following the Communist takeover, Benn has remained confined to his house where he has spent his days writing in his diaries. Despite having been under constant surveillance by armed guards and state doctors, Benn has now finally succumbed to his illness. A funeral is planned for Benn, however, given the government crackdown against the non-Communist opposition, it is unlikely that the event will attract a large crowd, with only Benn’s immediate friends and family expected to attend. Underground leader of the Labour Party, Jo Cox, has reportedly held a similar funeral for Benn with its members, meeting in private to say their farewells to their former leader. With his passing, one more opposition figure is gone, and many expect that the Labour Party will struggle to rebuild itself without him."
 britain.549.o1:0 "A shame he never joined us"
 britain.550.t:0 "Jeremy Corbyn Elected to the Workers' Congress"
 britain.550.d:0 "As the dust settles from the electoral campaign, the elected members of the Workers’ Congress take their places. One of these is, to the surprise of few but the disagreement of many, Jeremy Corbyn, representing the constituency of Islington. Handily beating out the Trotskyist Andres Mendoza in the selection process and then independent Keith Angus in the election itself, Corbyn now returns to representing the residents of Islington, as he has done with only brief interruption since 1983. While celebrated by the residents in his constituency as well as dissidents from across the country, Corbyn’s election has seen a cooler reception from many within the Worker’s Revolutionary Party, with the coverage of his election in the party newspaper News Line being short and terse in tone. Nevertheless, Corbyn thanked the voters of Islington for their trust once more, and John McDonnell for securing his release. As Corbyn stands to return to Westminster, he will enter a Congress that’s still very hesitant about the membership of a ‘reformist’ as noted as Jeremy Corbyn."
 britain.550.o1:0 "And so he returns to parliament once more"
 britain.551.t:0 "Corbyn Proposed for Secretary of Health"
 britain.551.d:0 "The presence of Jeremy Corbyn in the Workers’ Congress has more than once proved a headache for the more hardline factions of the Workers’ Revolutionary Party, as he has become a rallying beacon for the few independents managing to enter the Workers’ Congress, as well as many former members of the defunct Independent Labour Party. Now, he is once again proving to be a major problem, as Secretary of Health Mark Porter has announced his resignation, it now falls to [Root.GetLeader] to appoint a new Secretary. The moderates within the party have used this vacuum to propose a candidate of their own, namely Jeremy Corbyn himself, to the uproar of many hardline Trotskyists, including the former chairman George Galloway, who commented with a scathing critique of the proposal in the media. Corbyn himself has attempted to stay outside the debate, merely commenting that he’d accept the position if offered. The proposal has also met criticism in the cabinet, thanks to Corbyn’s ‘checkered revolutionary background’. Still, a majority for his appointment could be found, provided [Root.GetLeader] is willing to expend some of their political capital."
 britain.551.o1:0 "Accede to their request, give him the Health Secretariat"
 britain.551.o2:0 "That’s a step too far, reject the petition"
 britain.552.t:0 "George Galloway Secures Control over Party"
 britain.552.d:0 "Following the leadership challenges at the first Worker's Congress, it was clear to George Galloway that he did not enjoy as much support within the party as he had believed. Coming from all angles, from former ILP politicians who had seemingly accepted the merger to Trotskyist stalwarts from the former Socialist Worker's Party, Galloway yet managed to maintain his power thanks to loyalists among the Workers' Revolutionary Party leadership. In a recent meeting in the WRP Politburo, Galloway pledged to 'scrub the party of disloyalty', heralding a wide-ranging purge. Already, the most prominent opposition figures like John McDonnell and Lindsey German have been expelled from the party and prohibited from ever holding public office again, though Galloway is intent on making sure this purge goes from top to bottom, to prevent anyone from challenging him again."
 britain.552.o1:0 "A Very British Purge"
 britain.553.t:0 "Ken Livingstone Reveals Anti-Galloway Factions"
 britain.553.d:0 "With the upper echelons of the Workers' Revolutionary Party now secured, the much more arduous task of finding and uprooting the opposition in the lower rungs of the party has now commenced. Progress has been slow, as many within the party are wary of the ongoing process. This would be a large obstacle, were it not for Ken Livingstone. Formerly the right hand man of Prime Minister Corbyn, Ken Livingstone was quick to join with the WRP during the revolution, but was expelled for his ties to John McDonnell a few weeks ago. Recently, Livingstone contacted Chairman Galloway once again, handing over a massive dossier of information relating to McDonnell's attempt to unseat the chairman, containing mails, letters and phone transcripts, revealing multiple seemingly loyal comrades with a background in the ILP to be co-conspirators. All Livingstone asked in exchange was to be reinstated into the party and the Workers' Congress, a request Galloway was happy to grant. With this information, the Chairman is certain to secure total control of the party even faster."
 britain.553.o1:0 "To think there were so many of them"
 britain.554.t:0 "Right-Oppostitionists Purged"
 britain.554.d:0 "Following the reception of Livingstone’s dossier, scores of party members involved in the opposition against George Galloway have been expelled, including multiple members of the Workers' Congress. Galloway has even succeeded in making Len McCluskey retract his criticism and retire from the leadership of Unite the Union, being replaced by Galloway-loyalist Jerry Hicks. With thousands of people across the Republic expelled from the WRP, Galloway held a short televised speech where he declared the end of the counter-revolutionary threat, boasting that ‘none could assail the will of the people’ and proclaimed the everlasting victory of the revolution. Ken Livingstone, whose dossier proved essential for Galloway to secure power, has been rewarded with a position in the Workers’ Revolutionary Party Politburo, securing the loyalty of the former Independent Labour membership yet remaining within the party, and granting Galloway a powerful ally in a Politburo that only reluctantly supported Galloway’s purges."
 britain.554.o1:0 "A New Day Dawns on Britain"
 britain.555.t:0 "'Crypto-Reactionary' Clique expelled"
 britain.555.d:0 "Although George Galloway breathed easy when he had purged the party of opposition, it appears that he may have been relieved prematurely. A small scandal was caused when the Blackpool party chapter published a critique of his leadership in the Blackpool Gazette, calling for greater investments in the local tourist industry, which is still struggling to recover from the economic crises of Capitalism, as well as calling him out for rude behaviour when visiting the town a couple of weeks prior. Galloway’s response was firm and fierce, ordering the entire chapter expelled from the party for ‘Factionalism’ and ‘Flagrant disregard for the principles of Democratic Centralism’. Despite that, the party bureaucracy moved slowly, without the expedited process that Galloway demanded. Ultimately, almost every member of the Blackpool chapter of the Workers’ Revolutionary Party was expelled, with the chapter and thus the local Council now a shell of its former status. As the few remaining members of the Blackpool chapter begin to rebuild, George Galloway has made an example of what happens to those that oppose him, for both good and ill."
 britain.555.o1:0 "Hopefully this is the last of them..."
 britain.558.t:0 "Opposition Leaders Announce the Free Democratic Party"
 britain.558.d:0 "Our intelligence was not completely true. In a public announcement broadcast on the BBC, figures from Labour, the Social Democratic Party, the Conservative Party and the Liberal Democrats have jointly announced the formation of a new political party, the Free Democratic Party, as a union of their parties. Having selected Tony Blair as their political leader because of his popularity among all four parties, as well as his long history in Parliament, the Free Democratic Party now stands to present a more organised opposition towards the government of [Root.GetLeader], with a promise to fight tooth and nail for British Democracy. [Root.GetLeader] has refused to comment publicly on the matter, although reports indicate the administration is furious that the Free Democratic Party has been allowed to form. As the party explicitly rejects the outlawed ‘terrorist ideologies’ and violent change, there is currently no legal basis with which to outlaw the party. Nevertheless, it is certain that the Free Democrats will face an uphill struggle against a government that is only growing more entrenched by the day."
 britain.558.o1:0 "We will crush them, sooner or later."
 britain.559.t:0 "National Revolutionary Front Sees Growth in Support"
 britain.559.d:0 "Despite its broadly leftist orientation, the National Revolutionary Front was spared when the ban on the far left was enacted thanks to its unmistakably national character, as well as its ties with the British National Party. In the aftermath of the attack on the Houses of Parliament, it was expected to remain a minor party still, as it was unable to manifest more than a token showing during the snap election. The tides appear to be shifting, however, as the National Revolutionary Front has seen a sudden, large uptick in its membership, with new chapters popping up all across the country. Patrick Harrington has used this surge to his advantage, trying to curry influence in the government of [Root.GetLeader] for the enactment of NRF-supported policy. This is highly irregular, and many within the cabinet are wondering whether the NRF are receiving foreign funding, or whether something else is going on."
 britain.559.o1:0 "What could be fueling this surge?"
 britain.560.t:0 "Seumas Milne Sighted Attending NRF Meeting"
 britain.560.d:0 "A new lead has been found in our investigation. MI5 has uncovered evidence of collusion between the National Revolutionary Front and the communists. One operative sighted the presence of a wanted fugitive, Seumas Milne, during a meeting of the national executive committee of the National Revolutionary Front. Milne avoided arrest during the initial crackdown, thanks to the insignificance of his tiny Maoist party. Although it’s currently unclear whether this act of collaboration is just Milne aiding the NRF or if it extends throughout the organisation, it is clear-cut evidence that the growth of the NRF is directly related to the presence of Communist terrorists. As such, some within the cabinet are calling for a direct crack-down now, in the hopes of catching Milne before he or anyone in the NRF leadership can figure out what is happening and escape, although the MI5 recommendation calls for further investigation to reveal just how deep this collaboration goes."
 britain.560.o1:0 "We cannot wait, we must strike now"
 britain.560.o2:0 "Let’s investigate further before making any hasty conclusions"
 britain.561.t:0 "National Revolutionary Leadership Arrested"
 britain.561.d:0 "In the aftermath of the revelation that Seumas Milne was cooperating with the National Revolutionary Front, the government was quick to act. Both law enforcement and paramilitary organisations were mobilised to detain their leadership with all due haste, in the hopes of catching both them and Seumas Milne before any of them could manage to evade capture. As with the previous crackdown, it was a mixed success, as Patrick Harrington and multiple other NRF figures did not expect for their duplicity to be discovered, and yet Milne once more managed to evade capture. Moreover, news appears to have spread fast throughout the organisation of the crackdown, causing many members to go underground. Despite our apparent luck in detaining the upper echelons, our hasty intervention may have caused us to drive many of the non-Communist members of the NRF directly into the arms of Seumas Milne. Now, we can only expect for Communist subversion to increase."
 britain.561.o1:0 "We must watch out for any and all subversives"
 britain.562.t:0 "NRF Gives Way to Communist Partisans"
 britain.562.d:0 "It is exactly as we feared- The premature crackdown on the National Revolutionary Front has led to a growth of Communist saboteurs. Although their support remains limited given the widespread scorn held towards the Communists after their attack on the Houses of Parliament, we have effectively handed the Communists an entire organisation through which they can coordinate their resistance against our glorious rule, as well as numerous sympathisers. This is already apparent, with their attacks against our loyal security forces and paramilitary organisations costing us more dearly now than before. Nevertheless, we are not without hope, for the situation remains under control, and MI5 is working tirelessly to uproot these terror cells wherever they may be found. Britain may be bruised, but we shall emerge stronger on the other side, once these subversives have been dealt with."
 britain.562.o1:0 "These Communists truly are a red hydra"
 britain.563.t:0 "Leftist Entryism in National Revolutionary Front Revealed"
 britain.563.d:0 "Continued investigations into the National Revolutionary Front have confirmed the worst of our fears. The party has essentially struck a deal with the Communists, permitting them to join so long as they’re quiet about their past allegiances. As such, a shockingly large amount of the party base now consists of Communists and other such Marxist subversives. Naturally, this betrayal of Britain cannot and must not stand. Already, the justice system is preparing to handle the high number of cases, while the MI5 is readying to arrest the traitor Patrick Harrington and his communist-sympathising ilk. This shows more than ever how necessary it is for our party to secure total and complete power."
 britain.563.o1:0 "Get them all, and spare none"
 britain.564.t:0 "National Revolutionary Front Banned"
 britain.564.d:0 "The gears of the state apparatus moved quickly. Patrick Harrington and the remainder of the National Revolutionary Front leadership have now been detained and will soon be convicted for treason and conspiracy to commit terrorism. At the same time, the National Revolutionary Front has like its Communist compatriots been declared a terrorist organisation, with membership being prohibited and many prominent members likewise rounded up, as our paramilitaries are on the prowl for anyone who escaped the first time. Unfortunately, Seumas Milne once more managed to evade arrest, with his current whereabouts being unknown. Nevertheless, the public can rest easy that we have once more prevented radical leftists from attacking our social order, and that Britain shall, as it always has, stand strong against their subversion."
 britain.564.o1:0 "All in a day’s work"
 britain.580.t:0 "Patels Trial"
 britain.580.d:0 "Patel has given her statement to the court. Although she sees no crimes in what she has done and still believes she did the right thing to “fix” Britain many shouted back to her when she spoke up but yet she grimed at the families her watched her in the courthouse who lost loved ones to her. The jury has come to the conclusion on her fate..\n\nShe is guilty of crimes against humanity and will face justice for what she has done. Now its time for the judge to pick her fate, will she be locked up for the rest of her life or face the firing squad?"
 britain.580.o1:0 "Lock Her Up"
 britain.580.o2:0 "To The Firing Squad"
 britain.581.t:0 "Johnsons Trial"
 britain.581.d:0 "Boris Johnson appeared in the court with his face dropped and pleaded with the jury that he was mostly innocent and did not commit crimes against humanity for the Phoenix. He only stayed loyal the party for his own life. Although he is correct as he was not involved in serious actions the Phoenix took part in, he still remained in the party and condemned the rebels throughout the fighting until he was caught.\n\nNow its time for the people to choose the fate of Boris Johnson."
 britain.581.o1:0 "Lock Him Up"
 britain.581.o2:0 "Release Him"
 britain.582.t:0 "Farages Trial"
 britain.582.d:0 "Nigel Farage is just as guilty as Braiser is for the direction the nation took under the Phoenix Front. He spoke to the jury explaining to them that he is a british born citizen who wanted to protect the pure british breed in this country. He worked with Theresa to enforce a new way of life that worked for those true british patriots. Meanwhile protests have occurred outside the courthouse and want Farage to pay the price for what he has done to the nation.  How will the jury proceed with his future?"
 britain.582.o1:0 "Lock Him Up"
 britain.582.o2:0 "Send Him To The Firing Squad"
 britain.583.t:0 "Camerons Trial"
 britain.583.d:0 "Many feel David Cameron took a firm stand against the phoenix refusing to work with them and tried his best to prevent the slave trade from occurring. Although he did stand by many of the other crazy laws the Phoenix Front implemented, he never worked directly with them. Some wish him to pay the price but some believe he was always behind Braiser back plotting away."
 britain.583.o1:0 "Lock Him Up"
 britain.583.o2:0 "Cameron Is A Free Man"
 britain.584.t:0 "A New Era Has Arrived"
 britain.584.d:0 "The royal family is no more head of state. The people finally have the power over the country and a new socialist government are in power of Great Britain. Jeremy Corbyn has ordered the republican flag to fly over the houses of parliament and the national anthem to be changed to the red flag."
 britain.584.o1:0 "The Peoples Power Wins"
 britain.585.t:0 "The People Rally Together"
 britain.585.d:0 "Jeremy Corbyn has taken to the streets to gather support for the removal of the royal family. The system is outdated, and the nation is ready to move forward. Together socialism and peoples might will unite the country unlike what the monarchy has done for hundreds of years. Corbyn has spoke on national TV to ask the people “Why do we need a monarchy in the 21st century? What good comes to it other than our own tax money wasted on them?”"
 britain.585.o1:0 "The Monarchy Are In Trouble"
 britain.586.t:0 "The Royal Referendum"
 britain.586.d:0 "The people went out and voted today and it was recorded to be one of the highest voters turn outs ever in the history of voting, never had so many people voted in such a high turnout. Overnight the BBC and ITV recorded all the ballots being counted in different constituencies with the percentage marks sometimes going even or one out doing the other. It was a very dramatic night with the remain vote upbeat and the leave vote shallow..\n\nBy 4 O’clock the sides were very different, the leave campaign had gained 70% of the vote compared to the remain which only gained 30% of the vote. The BBC announced at 5:30AM “The decision taken to keep the country as a constitutional monarchy has been reversed by this referendum and there is no way the remain side can win. There is a 70%-point lead for leaving the constitutional system and this country to now become a republic.”"
 britain.586.o1:0 "The United Kingdom Is No More"
 britain.587.t:0 "Free University"
 britain.587.d:0 "The prime minister, Jeremy Corbyn has promised to scrap university tuition fees and bring back free university for all. New university students will be freed from paying 9000 pounds in tuition fees as the education secretary, has confirmed tuition fees will be completely abolished through legislation and students will benefit from having more money in their pockets, and we will all benefit from the engineers, doctors, teachers, and scientists that our universities produce."
 britain.587.o1:0 "Free Education For All!"
 britain.588.t:0 "Dermot Hudson Elected"
 britain.588.d:0 "Dermot Hudson, the most radical far left leader in the republic has been elected as leader of the republic. Many believe he will follow the similar steps of the leader in Korea with similar values as “Juche”.  One of Hudson’s main views is the complete removal of the royals in the country and building Britain to be the most powerful nation in the world as well as the removal of all countries who do not meet the similar values as his country does."
 britain.588.o1:0 "Hudson Sets Out His Views"
 britain.589.t:0 "The Trial Of Braiser"
 britain.589.d:0 "Judge-Theresa Braiser, you stand here today accused of many crimes including violations of human rights, Perpetuating Genocide, Holding the Royal family hostage, instituting and practicing slave trading, and much more, how do you plead?\n\nTheresa- Your Honor, I plead not guilty to these charges. These were not crimes, but instead what it took to save the Isles from Communism. As I’ve explained to the court, my goal was to make England a true Christian nation, in which those true of heart could enjoy our splendor. It is not a crime against humanity to enslave those below us..\n\nJudge- MS BRAISER!!! I will ask you to keep from those statements within the court! As the court can see, Ms. Braiser is not apologetic for her crimes, nor does she seem to regret her actions. Am I correct Ms. Braiser?\n\nTheresa- That is right your honor, The way I see it, I will go down in English history, as a woman who followed in the steps of Margaret Thatcher. I made this land greater than its ever been.\n\nJudge- Ms. Braiser, I have the privilege of standing up here today and saying that I am glad you’ve been arrested. Personally, there isn’t an impartial person in this nation who wouldn’t like to see you executed. But, as per my duty, and the duty of the court, I ask the jury for their answer.\n\nJury member- Your honor, we the jury in this historic case are ready to deliver our sentence.\n\nJudge- How does the Jury find the defendant on the charges of Human Rights violations?\n\nJury member- Guilty your honor\n\nJudge- How does the Jury find the defendant on the Charge of Slave trading?\n\nJury Member- Guilty your honor\n\nJudge- How does the Jury find the defendant on the charge of holding the Royal family hostage?\n\nJury Member- Guilty your honor\n\nJudge- Then by the power invested in me, I will deliver the sentence of Ms. Braiser tomorrow next to Her Royal Majesty. Ms. Braiser you have 24 hours to get your affairs in order. Until tomorrow you are to be reprimanded to the Tower of London with no visitors except your lawyers."
 britain.589.o1:0 "She Has Been Sentenced!"
 britain.590.t:0 "Prison Time"
 britain.590.d:0 "“Theresa Braiser, in Lew of a death sentence I sentence you to life in Prison and confinement to the tower of London. While you may not receive personal visitors, you may receive families of those your policies have impacted.” The Judge said.\n\nWith a loud roar, the crowd quickly split itself into two factions, those happy with the sentence, and those who wished for a death sentence.\n\n“Ms. Braiser, I truly deliberated over this for quite a while and most can say I suffered a long sleepless night. Personally I would’ve loved to pull the trigger on you myself. But the people of Brittania have suffered under your laws, and I believe that they owe a few words to you.”\n\n“Your honor, I believe you are making a terrible mistake here. For I have hurt no family of true Brits. I can withstand the unpure filth you send me for God knows my mission was righteous. My ideas will continue to live on, no matter if I’m incarcerated or not. You can not stop the Phoenix from rising, neither can any of you!” Braiser said pointing a finger at the audience behind her.\n\n“Send me to the tower if you must, but I will persevere.”\n\nWith that, Theresa Braiser left the courthouse in handcuffs. Leaving the building, many threw cement laced milkshakes at her, and many more shouted obscenities that would make the pope cry."
 britain.590.o1:0 "Life In Hell"
 britain.591.t:0 "The UK Chooses Death"
 britain.591.d:0 "“Theresa Braiser, former Prime Minister of the United Kingdom, I sentence you to death by firing Squad.” The Judge said. “As I am sure this will not bring the closure many families are looking for, I believe this is what you deserve.” He continued.\n\n“Your crimes against the United Kingdom and the world are heinous and many, if you did not die here in London, I am sure the Scottish or Welsh would you treat you no different.”\n\nThe crowd audibly cheered as the sentencing was delivered with Braiser showing no fear in the face of certain death.\n\n“So it must be, I will go the way of visionaries like those at Nuremburg. But at least I can say, for a short while, England was truly great.”\n\nSome time passes\n\nSeveral men and women lined up, looking at a blindfolded elderly woman. “Theresa Braiser, do you have any last words before you are ultimately sent to be judged by your maker?” Major General Harold Albright asked.\n\n“Our father hallowed be thy name..”\n\nThe shots ring out in quick succession.\n\n“Well Lads, the bitch is dead.” Albright said somberly."
 britain.591.o1:0 "Thank God Shes Gone"
 britain.592.t:0 "Welcome King William!"
 britain.592.d:0 "Welcome King"
 britain.592.o1:0 "The Country Cheers!"
 britain.293.t:0 "Snap Election"
 britain.293.d:0 "Woohoo"
 britain.293.o1:0 "Conservative Party"
 britain.293.o2:0 "Liberal Democrats"
 britain.293.o3:0 "Social Democrats"
 britain.293.o4:0 "Labour Party"
 britain.594.t:0 "The Hijacking of Trans-Atlantic Flight 317"
 britain.594.d:0 "The Pheonix Front, a now defunct and banned organization within the United Kingdom, suddenly made a resurgence as Wilmont Carlisle and 4 other men took Trans-Atlantic Flight 317 20 minutes after they took off from Heathrow Airport headed for Boston International in New England.\n\nAccording to those aboard, the men pulled machine gun style pistols out from undercoats and immediately took the plane. Making the plane turn around, Flight 317 had turned around towards the London area. Using the Radio, Carlisle made two simple demands.\n\n1. Theresa Braiser is to be pardoned and immediately released from the Tower of London.\n\n2. Political Prisoners are to be loaded onto the plane when it lands back at Heathrow.\n\nIf these demands were not met, Carlisle threatened the execution of over 200 people. When 317 landed, Theresa Braiser had been escorted to the plane in cuffs. Unbeknownst to the hijackers, several squads of SAS members were moving around the plane. As Carlisle opened the door, a sniper took a shot, which would land in Carlisle’s chest killing him almost immediately. From there, several squads entered the plane from multiple angles. The 4 other hijackers were immediately rushed 1 being killed and 3 others being arrested."
 britain.594.o1:0 "It's as Theresa said, the Pheonix can never be killed."
 britain.595.t:0 "The Iron Lady Falls"
 britain.595.d:0 "Thomas Stolwell was never a well to do man. His family lived in quite possibly the worst part of Camden. His dad a drunk, and his mother a whore. His life was doomed to repeat theirs, until Theresa and the Pheonix came about. He had registered as a member in its early days and slowly rose through the ranks. His mother got off the streets and his dad turned his life to god. Truly the man owed his life to Theresa, which was why he worked to get on her security detail, and when it worked..he realized he would die for the woman.\n\nIt was a calm night in Brighton. Theresa was giving a speech to the Pheonix military, all of whom were armed to the teeth and ready to invade France where they’d be welcome as liberators from the communist regime.\n\n“Soldiers of the Pheonix, I and the party salute you all. We face a threat, not unlike the Nazis in your grandparents days. They threaten to invade our lands, rape our women and children, kill our pets, and threaten our way of life. When you land in Normandy, you will be met with force. But overcome it, and the French people will welcome you as liberators. You will go..”\n\nStolwell wasn’t sure what happened until he heard the loud bang a second later. “Where the hell did that shot come from?” A voice over his radio said. He wasn’t focused on that, instead he was the only person to see the red circle forming in the center of Theresas chest. Running over, he caught her as she fell. “Ma’am hang on. The medics will be here soon!” He yelled.\n\n“Damn medics won’t save me. The Pheonix must not fall. As for I..” She said as she coughed up blood. “I will be with our lord.” She finished.\n\nStolwell took her pulse and realized, Theresa Braiser, the woman who saved his life and families life, was gone.\n\n“Find the Goddamn gunman!” He whispered into his radio.\n\nIt wouldn’t be until an hour later, that Pierre Mangels was found dead in an abandoned apartment. Sniper rifle near the window, and a note admitting he did it. The man would’ve been arrested had it not been for the gaping gunshot in the side of his head. It seemed as if the devoted French communard was dead by his own hand."
 britain.595.o1:0 "Britain shakes"
 britain.596.t:0 "The Welcome Our New Leader"
 britain.596.d:0 "“Well if you’re just tuning in now prepare for a new dawn on our great and mighty land, the deputy of Theresa Braiser has just been inaugurated as high chancellor to the nation. The people cheer loud as they look forward to change and prosperity. Already our great leader Nigel Farage has promised to put the british people first and the Phoenix to guide them forward. I for one cannot wait to see how our great leader will make Britain even better than what it already is.”"
 britain.596.o1:0 "Nigel Is Ready"
 britain.597.t:0 "What Happened?"
 britain.597.d:0 "Nothing happened in London. Do not worry."
 britain.597.o1:0 "Nah Nothing."
 britain.598.t:0 "The First of Many"
 britain.598.d:0 "“Sir, I regret to inform you but...Cornwall is no longer under our control. As of 0800 this morning, our camp garrisons were marched out by Cornish militias. They’ve already been dealt with. What are we going to do sir.” The Agent asked.\n\nNigel sat behind his desk for a minute….visibly seething with anger.\n\n“Get the hell out of this office before I have you sent to Mann for treason!” He yelled at his security agent.\n\nThe man quickly left the room, fear written across his face, spelling bad news for those guarding the door outside.\n\n“FUCK!” Nigel yelled as he threw a novelty globe at a wall.\n\n“If I invade, it looks like the Phoenix is fractured, and from there we could risk an invasion from the French. God knows they’ve been trying since the age of Bonaparte. But if we don’t invade, I look weak..FUCK!”\n\nNigel had no answer to this, and soon he’d have to go before the generals and give them orders. When he did meet with them, he simply said..”Guard the Border. No one in or out.” "
 britain.598.o1:0 "Nah Nothing."
 britain.599.t:0 "Salmond Speaks Out"
 britain.599.d:0 "“People of Scotland! I am yet another example of how the British have oppressed our people! And how they’ve denied our freedom. When the Phoenix Cunts came into office, WHO CAMPAIGNED FOR INDEPENDENCE?! I did! And what did they do to me? They forced me into a labor camp that made Hitlers look like a daycare center!”\n\n“I invoke the name of William Wallace and urge true Scotsmen and women to fight for our independence before it is too late. Before the English truly relinquished our culture to the annals of history.” Alex yelled.\n\nIn a room across the nation, Nigel Farage watched a tv broadcasting Salmonds message. “Bloody hell, Wales and Cornwall were bad enough, but now we have to deal with Scotland. Get whoever you can on Salmonds case. I want to have a word with him.\n\n“You mean imprison him sir?” His security agent asked.\n\n“No you dumb twat! Talk. Fucking Theresa left me this mess, I intend to fix it.\n\nWe can’t solve all of our problems by imprisoning enemies. Maybe we can turn Salmond to our side.” Nigel said. Truly he knew he was just delaying the end of the front. Once Wales seceded, then the front would lose a large portion of its slave labor. If he could get Scotland to stay, then maybe..just maybe he and his compatriots would live."
 britain.599.o1:0 "Time Is Running Out For Nigel"
 britain.600.t:0 "The Union Breaks"
 britain.600.d:0 "9:30 in the morning was when his trusted advisors barged into his bedroom. “Sir..apologies for waking you. But theres a situation developing in..well everywhere to be quite frank.” His press secretary said.\n\n“Bloody fucking hell what is it?” He asked.\n\n“Scotland is currently no longer apart of the Union sir. As of an hour ago, Phoenix advisors, policemen, office workers and such were marched out of their offices and homes. Some are being forcibly deported back into England proper while others..we believe they were executed. It is hard to tell as of now, since most communication in these areas have been cut.”\n\nThis bristled Nigel awake, and in an instant he realized Salmonds offer of help was nothing more than a ruse. “How could I have been so stupid?” He thought to himself.\n\n“Dial Priti and Hopkins. Tell them we’re going to a state of emergency. As of now, I’m ordering the closure of all transportation services. Keep the people dark on this!” He said.\n\nWith that his advisors left the bedroom and Nigel got into his military uniform.\n\nWalking out, his guards gave him a salute, one which he of course returned. Running up to him, Sir Phillip May yelled. “Nigel, bloody hell where have you been?”\n\n“Keep your goddamn voice down man. In front of the soldiers, its sir! Not Nigel. And to be fair, I was just briefed of the situation. Seems like everyone else in this bloody country already knows about it though!”\n\n“Nigel. I don’t think you understand. The Union is no more! We’re seeing our forces pushed out of Northumbria and Wales as we speak. If I were you, I’d run. I’m leaving on a plane to Iraq as we speak.”\n\nNigel quickly pulled a pistol out his jacket and shot Phillip point blank saying, “No one leaves. The Phoenix is strong”"
 britain.600.o1:0 "Nigel Its Over.."
 britain.601.t:0 "The Leaders Meet.."
 britain.601.d:0 "“Fucking coward is going to let them walk?!” Boris asked. The man was the very definition of furious. After hearing that the coward, Nigel Farage was going to let the slave provinces keep their independence, and even trade with them. He called for a group to be formed, those who would be loyal to the Front!\n\n“By god it seems he is.” Cameron whispered. The man held more calm than the others, but then again he was nicknamed “The General of Democracy.” Boris hated this man with a passion. But if anyone had the support of the common people, it was David. He’d need him and the commoners if they were going to overthrow Farage and guide England back to the path Braiser laid out.\n\n“My men are ready to march whenever. They’re done with Farage and his niceties!” Priti had said. Boris, for now was able to tolerate the woman. Although she was named and honorary Englishmen, it was clear that under his rule, he’d need to dispose of her.”\n\n“On my orders, we march tonight. Take the country back and force Farage out of office. Who knows, maybe Priti will have a good NEW use for the man.” To that, Priti chuckled.\n\nWith a swipe of his hand at midnight. Orders were given. But not obeyed. Cameron and Priti took matters into their own hands, forming their own regional nations.\n\n“The Phoenix split tonight.” boris thought."
 britain.601.o1:0 "The Phoenix Fights"
 britain.602.t:0 "The Jersey Camp"
 britain.602.d:0 "Nigel Farage has visited the biggest work/death camp in the nation, named as “The Last Choice”. This is where true enemies of the state and potential threats of the phoenix will be held. Some of the residents of Jersey have already been tested on and experienced the prison to see how their mental capacity could deal with it. Long story short many died in the prison if not through the death stage. Already prisoners have arrived by boats and planes taking them into the prison, as the chimneys start to release the smoke of bodies being burnt and gas escaping the people of the nation fear for their lives as the Phoenix beat the people down harder."
 britain.602.o1:0 "The Phoenix Fights"
 britain.603.t:0 "The Freedom Movements"
 britain.603.d:0 "Movements across Scotland and Wales have started to occur. Many in those nations protest against the Phoenix and call for change, the old leaders of Wales and Scotland are asking for more to come together and rise up against the fascist dictatorship. Meanwhile in Cornwall as one of the biggest work camps is constructed. Tensions are rising with the workers on strike, of course they’ll be shot at if they refuse to work but as their blood boils it will only take a few more actions to make the dominos fall."
 britain.603.o1:0 "The People Slowly Rise"
 britain.604.t:0 "Farage Goes To Cornwall"
 britain.604.d:0 "Cornwall has become a state for the weak and criminals. Its prison camps are everywhere and now its time the phoenix members who provide their service for the party to be rewarded by a visit from chancellor Farage and congratulated for their hard work.\n\nWhile the members of the party prepare for a meeting of a lifetime, it seems an underground network in Cornwall are planning something else more..Explosive lets just say.."
 britain.604.o1:0 "Cornwall awaits the visit"
 britain.605.t:0 "A Problem"
 britain.605.d:0 "The plane landed at Cornwall airport at 1PM in the afternoon, huge banners of the Phoenix Front eagle were displayed around the airport welcoming the leader to the manufacturing hub of the nation. Members of the security team stepped off and moved crowds back away from the plane who wanted to catch a glimpse of Farage. As Farage walked down the steps from his plane he noticed some of the members in the crowd standing silent watching him dead in the eyes..\n\nWithin moments the crowd exploded into violence, the group pushed the security forces down and slit the throat of two members of Farages security team as they ran in anger towards him. Nigel ran to a helicopter that was on standby taking off while the police gunned down the rioters. Nigel watched outside of the helicopter as it took off back to London fearing for his life while the crowd took the police force down taking out the remaining Phoenix members who came to visit him as they climbed onboard his private jet. “Ill be back Cornwall..and I promise youll regret this” Nigel said to himself in anger seeing his own failure."
 britain.605.o1:0 "Cornwall fights back"
 britain.606.t:0 "The Phoenix Breach"
 britain.606.d:0 "The Phoenix Fronts cyber network was breached by Irish hackers who managed to televise and create media posts in Cornwall about the upcoming attack. This created only days notice which allowed the Cornish population to prepare for the Fronts attacks. After the army and jets moved in and found strong resistance along with people firing back in great strength in close urban combat, the army retreated struggling to fight back knowing they were not able to take Cornwall."
 britain.606.o1:0 "Cornwall Stands Ready"
 britain.607.t:0 "Martial Law"
 britain.607.d:0 "Nigel Farage has ordered martial law on the nation and prevent protest movements from occurring while he puts the nation to sleep. The riots have created a turbulent beginning to his rule and many no longer have confidence in him and believe he can only last a few more months. In a speech he announced.\n\nMy dear Britons, our nation is cracking and we must stop this. Many of you are loyal and follow the rules we have created but yet a few still want to disrupt the system and destroy our peoples lives! Therefore I have no option but to place this country into martial law and ANYONE who refuses to follow the new laws will be shot on sight."
 britain.607.o1:0 "STRICT CURFEWS WILL FOLLOW!"
 britain.608.t:0 "Northumberland Plans"
 britain.608.d:0 "Nigel Farage has met the new Northumbria leader, Jamie Driscoll. Both leaders met have both decided that focusing on their own nation for the sake of the people it’s the best steps to follow for now. Although Jamie has opening spoken about preventing war and the north finally having its own government staying isolated, Nigel has ordered his assistants to prepare drafts to send to the army captains of plans, how they are going to take the north back under Phoenix Rule.\n\nFor now both leaders have agreed to leave each other alone while Nigel focuses on Scotland and Wales while Jamie prepares for a newly created nation and the removal of phoenix influence in the state."
 britain.608.o1:0 "The Leaders Have Spoken"
 britain.609.t:0 "The Push For Independence"
 britain.609.d:0 "All over Britain the people protest in cities and towns crying out for freedom to be returned and the phoenix to be removed from power. Unfortunately, many of these protests in England have been met with the army firing at the people shooting them dead.  However, in Scotland and Wales it seems due to the fierce resistance the Welsh and Scottish are displaying, many of the armed forces are refusing to enter the cities, in fact many from the Welsh and Scottish army have left their positions in the armed forces and joined the protesters to push for independence."
 britain.609.o1:0 "Nigel Is Watching And Is Worried"
 britain.610.t:0 "The Agreement"
 britain.610.d:0 "Alex Salmond has met with Front Leaders to agree that Scotland will work with England to stop the protest movements and encourage the people to accept the Phoenix Front as well as to work in the nation to boost the economy and in returned Scotland will have its own Phoenix Parliament and decide its own local laws while following English rule."
 britain.610.o1:0 "An Eye For An Eye"
 britain.611.t:0 "Wales Gets Deperate"
 britain.611.d:0 "Although Wales cries for freedom, its people are suffering. Due to the riots and protests, food and produce has been limited in the state and all farming and supplies have been forced into England. As the state grows hungry so does the desperation. As the Welsh Leader and Farage sat down to discuss terms, they agreed it would be best to create a puppet parliament in Cardiff and install a Welsh front to deal with Wales, in return food and produce will be returned back to Wales and the people will no longer starve."
 britain.611.o1:0 "What A Change"
 britain.612.t:0 "Wales Gets Revenge"
 britain.612.d:0 "“Nigel sir something came for you in the post, we have checked it and scanned the object and seems harmless” Nigels personal guard said as he passed farage a large box.\n\n”Ah it must be a present from Johnson while hes been away on holiday in Surry.” Nigel opened the box and dropped it “FUCK” As the object rolled out, the guard was nearly sick, the head of the Welsh puppet leader rolled onto the floor..”WHAT KIND OF ANIMALS ARE WE DEALING WITH HERE” screamed Farage.\n\nAs it turned out, early in the morning, the welsh guard rushed into the puppet leaders manors and dragged them out into the streets, arresting them and shooting the welsh front leader in the head.  Many of the members of the Phoenix in Wales were rounded up and taken away. The old leader of Wales entered the Welsh Parliament ordering the old MPs of Wales to return to their positions. “WALES IS NOW A FREE COUNTRY, NO LONGER WILL OUR WELSH BROTHERS AND SISTERS BE PUSHED UNDER AN IRON FIST. FROM NOW ON WALES WILL RISE AND ENGLAND WILL WATCH OUR STATE GROW STRONG AND FREE” Parliament cheered and clapped as the Welsh flag was raised in Cardiff and the Welsh/English Border."
 britain.612.o1:0 "Nigel Whats Wrong?"
 britain.613.t:0 "Patel Prepares For War"
 britain.613.d:0 "Priti Patel has ordered her loyal subjects to follow her into the county of Kent and claim the state as her own. Although many of the people were objecting against her rule and began to protest her stay in their country not long after she entered, she ordered two villages to be completely destroyed and the people who protested to be tied up onto crosses crucified in town centers in Kent.\n\nPatel has officially taken the state and has complete control over the population of Kent."
 britain.613.o1:0 "Fear And Rule"
 britain.614.t:0 "Boris And His Pride"
 britain.614.d:0 "Boris Johnson knows rule of fear is not the correct way to win the hearts of the English and get them on his side, instead he will use English nationalism which will get the loyal members of the phoenix front on his side by using the slogan “English And Proud”.\n\nAlready many thousands have decided to accept Boris as their future leader and join him in his childhood county of East Anglia, ready to take up arms and defend their leader!"
 britain.614.o1:0 "The Jolly Mans War"
 britain.615.t:0 "Camerons Return To Democracy"
 britain.615.d:0 "David Cameron is the last hope of returning to a democratic society. He has never followed the Phoenix Fronts message and has only remained in the party to keep himself alive. Now he has left the party completely and announced that if he is to take control of the country, he will restore democracy and bring elections back.\n\nMany thousands across England and even some in Wales and Scotland have chosen to work with Cameron and fight alongside him to return back to the old days of England and remove the fascists and national socialists off the streets."
 britain.615.o1:0 "There is still hope"
 britain.616.t:0 "Farage Still Has A Chance"
 britain.616.d:0 "Nigel was inaugurated as leader after the death of Theresa Braiser and is the true leader of the phoenix front with many are still loyal to him. His rule has been a disaster but much of this started with Braiser. Now he has been able to stabilise the independent nations his followers wish to give him the chance he needs to rebuild the country and expand the soon to be empire. \n\nFarages patriotism towards the country has already won over the hearts of the true Britons and have established a cult following towards him. Those who follow him will fight for him."
 britain.616.o1:0 "A Promise To Make Britain Better"
 britain.617.t:0 "Making A New Home"
 britain.617.d:0 "Although the leaders of the Front have left their current positions to take over counties, they were all to BE put forward into an election and a vote to take place who would become the next leader of the Phoenix Front. Unfortunately, some leaders decided this was going in the direction of democracy and have instead chosen to become leaders of their own factions and will unite the nation under their own flag and their own rule through blood and war."
 britain.617.o1:0 "The People Are Under Another Leader Again"
 britain.618.t:0 "Talking May Work?"
 britain.618.d:0 "Katie Hopkins ordered the leaders to sit down and talk diplomatically. If war breaks out thousands would die, and the country would be left broken and weak along with the chance of the communists being able to invade and take advantage of the dead states.\n\nAfter many hours of talking, shouting and swearing it seems only Cameron and Johnson were the ones who would want to avoid war try to persuade the others to prevent conflict. Patel on the other hand who refused to speak to resolve the matter, only swearing at the others and announcing she would break apart each one of them and their followers. Nigel on the other hand sat in the armchair lighting a cigar smirking at each one knowing nothing would be solved.\n\nEach leader left going back to their counties preparing for one of the four to be the first to start."
 britain.618.o1:0 "It Seems The Nation Is A Breaking Point"
 britain.619.t:0 "Griffiths Takes Power"
 britain.619.d:0 "Robert Griffiths has finally been established as chairman of the republic and now commands the people and army. He has ordered the complete revolution of the country and prepare to work with the Warsaw Pact and the Soviet Union. Already farms and factories have been transformed to expand its industry into he EU and the borders of Britain have been opened to allow the European people to finally enter our new nation.\n\nRobert Griffiths has spoken with the EU leader and Soviet Union chairman and are planning to meet to discuss new plans for the nations and to expand the communist outlook around the world as well as taking Britain into the Warsaw Pact."
 britain.619.o1:0 "Britain Is No Longer Isolated"
 britain.620.t:0 "Ella Rule Becomes Leader"
 britain.620.d:0 "Ella Rule has been chosen to lead the country and take the nation in a new direction, her outlook has always been bringing socialists and communists together and unite. She has ordered new technology colleges to be setup and a new revolution in the science community to create Britain as the leader in science and technology in the world as well as making an equal society for all."
 britain.620.o1:0 "Britain Leads In Science"
 britain.575.t:0 "George Galloway Leads"
 britain.575.d:0 "Following the election and George Galloway gaining enough support to take control of the party and leader of the country, In a recent meeting in the WRP Politburo, Galloway pledged to 'scrub the party of disloyalty', heralding a wide-ranging purge. George has promised the working people to be rewarded for their hard work over the years and rebuild british industry. Galloway has also promised the complete removal of any existing support for the EU and Soviet Union pledging that Britain will be a strong republic on its own."
 britain.575.o1:0 "Galloway Takes Over"
 britain.621.t:0 "Braiser Arrested!"
 britain.621.d:0 "Theresa Braiser has been arrested in relations to far right crimes introduced by the new Corbyn government. Removing her from the streets prevents far right influence from attacking our government, although she has already spoken of reprisal attacks from her supporters, already cyber investigators have found over 50 loyal members and arrested them. It seems the Phoenix Front has already been a failed movement before it could even begin."
 britain.621.o1:0 "The Vile Woman Is Gone"
 britain.622.t:0 "Republic Immigration"
 britain.622.d:0 "Over the years the open door policy has become a more real threat to this nation, Prime minister David Owen began to open up with talks to the EU and allow a more cooperate union allowing more of our businesses and European businesses to set up here as well as allowing EU citizens to visit us causing more of a communist influence in our societies.\n\nGalloway has ordered the complete halt of all EU talks and visits. The reason the UK started to have an immigration problem was due to the EU and now we can stop this, all refugees who flock here will be turned away and forced back on their boats to Europe or wherever they came from. The British people come first!"
 britain.622.o1:0 "The Republic Only"
 britain.623.t:0 "Corbyn Is Removed"
 britain.623.d:0 "At 11:00 AM this morning an order went out from Buckingham palace for all left-wing leaders to be arrested and removed from power. In his home in Islington police vans arrived outside the home of Jeremy Corbyn breaking his front door down and rushing in arresting him. Neighbors said he was rushed into a black police van and driven away. No one is sure on the where abouts or current status of Corbyn but assume he has been taken to the tower of London to await Trial.\n\nThroughout the day more and more MPs from Labour, ILP and other smaller parties were arrested and taken away. It seems only seems the moderate parties were left remaining such as the SDP, liberal democrats and Conservatives."
 britain.623.o1:0 "Democracy is fading"
 britain.624.t:0 "The New Healthcare Solution"
 britain.624.d:0 "The NHS is causing a drain on the country and its economy while its doctors and nurses are struggling. Although the NHS is literally the beating heart of the nation it also comes with many problems that past governments have failed to fix. Now her majesty has ordered some areas of the NHS to be privatised to save money and reduce the strain the health service is causing for the country. Although much of the population is against this method it seems to be the only way the Queen believes she can save the health system from total privatisation."
 britain.624.o1:0 "The NHS Is In New Hands"
 britain.625.t:0 "The Queen Plans"
 britain.625.d:0 "“Good afternoon this is the BBC lunchtime news and welcome to this special broadcast, Her majesty the queen has set out a list of new reforms and laws she will begin to law this week including solving the ever growing Scottish drug problem and rebuilding the Welsh infrastructure. We can also confirm that new laws will be implemented into England which will rebuild the education system here and reconstruct the broken job market previous governments have been unable to fix.”\n\nIn other news the American republic has approved a new law which allows all the population in the American states to apply for a new visa allowing them to move and make their home in the republic. Looking over to New Zealand the BBC has been given exclusive news that a new crack down on freedom fights has taken place resulting in over 30 deaths and many casualties."
 britain.625.o1:0 "Interesting.."
 britain.626.t:0 "The Drug Problem"
 britain.626.d:0 "The Queen has visited cities in Scotland such as Glasgow, Perth, and Aberdeen to witness the current drug epidemic that has been ongoing for many years and many young people unemployed and hooked on the needle. From what she has witnessed she has ordered new funds to be made readily available as soon as possible for the police to stop all the drug gangs taken over the streets and new funding to get more officers onto the streets to fight back on the war against drugs."
 britain.626.o1:0 "The Queen Tackles the Needle"
 britain.627.t:0 "Taking The Castle Back"
 britain.627.d:0 "Balmoral was always the second home of the queen along with Windsor castle, Balmoral was left and forgotten about after the Queens last visit in 1986. She has now ordered the castle to have major renovations take place and update the castle ready for the 21st century. The news has been welcomed by the Scottish people and are looking forward for royalty to return back to Scotland."
 britain.627.o1:0 "Balmoral Welcomes Royalty Back"
 britain.628.t:0 "The SNP Is Banned"
 britain.628.d:0 "“Hello and welcome to STV, we have a new major developing story at this moment, the Scottish National Party has been labelled as a terrorist organisation by prince Philip, we believe once he relocated in Edinburgh castle one of the first actions, he took was to write into Scottish law the SNP will now be a terrorist organisation and an enemy of Britain. We can also confirm Nicola Sturgeon and Alex Salmond have also been arrested and charges are currently pending against them. Please tune in at 6 o’clock for further developments on this”"
 britain.628.o1:0 "Who Will Really Represent Scotland Now?"
 britain.629.t:0 "The Welsh Mine Disaster"
 britain.629.d:0 "A week ago, in one of the mines located in south Wales while exploding shafts, one of the beams collapsed causing a huge mining disaster which destroyed half a village in Wales and killing over 20 people in a supermarket due to a landslide from the mine explosion. While half of a village is still under mud and debris and many missing and injured the Queen has decided to visit and pledge her support to Wales and offer important aid needed to repair the village and rebuild the mine."
 britain.629.o1:0 "The Welsh Need Help"
 britain.630.t:0 "Charles And Wales"
 britain.630.d:0 "Charles and Camilla are now officially heads of state in Wales and have complete control of Wales. They have already ordered the removal of Plaid Cymru to prevent any type of Welsh independence protests and removal of the royals in Wales. Both have started to plan new ways to introduce English heritage into Wales and combine both Welsh and English cultures together."
 britain.630.o1:0 "A New Wales"
 britain.27.t:0 "A United Union"
 britain.27.d:0 "The Queen's recent speech describing 'one union under the UK' has made those still wanting independence angry yet with the new laws for those unable to protest for independence they are now stuck. Meanwhile celebrations have taken place across the country celebrating the closest the union has ever been with a monarchy in all places across the nation. With Scotland now going through new reforms and being rebuilt and Wales finally being given the aid they need it seems the country is now finally entering a golden age."
 britain.27.o1:0 "A New Dawn For The UK"
 britain.631.t:0 "A Meeting With Three"
 britain.631.d:0 "Her Majesty representatives has today met with the American republican leader and Canada Prime Minister to discuss future relations between the countries. As the UK looks at the American republic as the official nation to represent Americans and Canada leader of the democratic League it would be best to ally with both and agree that if any war or instability is to occur between the three nations they will work together and fight together.\n\nNations such as Brazil, Spain Australia and others have agreed this could be a similar return of NATO and could be beneficial to the future of freedom and democracy."
 britain.631.o1:0 "A New Relationship"
 britain.632.t:0 "The Queen Makes A Choice"
 britain.632.d:0 "Her majesty has grown old and tired, in the past few months her age has slowly began to show and many of her close staff and family have started to wonder who will take the throne in the future, Charles has decided to remain in Wales and leave the Throne to his son William but the question is, will her majesty be prepared to stand down and give her position up or will she refuse and ensure she can rebuild the empire of old?"
 britain.632.o1:0 "Give Up The Throne"
 britain.632.o2:0 "Build The Empire"
 britain.633.t:0 "The Propaganda War"
 britain.633.d:0 "Her Royal Majesty has ordered planes to fly over Europe and begin leaflet dropping to prepare the population of the European content to fight against their dictatorships and welcome a new order to their lives. “THE UNITED KINGDOM IS COMING TO FREE YOU, PREPARE FOR US” reads the leaflets. Already leaflets have been dropped over Paris covering roads and markets in leaflets covered in union jacks."
 britain.633.o1:0 "Welcome The Throne"
 britain.593.t:0 "The Elections Return!"
 britain.593.d:0 "William and Kate have ordered for a snap election to take place and the people decide who shall take back control of the country and restore democracy. The polls closed at 10PM and now the predicted polls are coming in..The people have chosen.."
 britain.593.o1:0 "Conservative Party"
 britain.593.o2:0 "Liberal Democrats"
 britain.593.o3:0 "Social Democrats"
 britain.593.o4:0 "Labour Party"
 britain.634.t:0 "Denmark Is A Start"
 britain.634.d:0 "“Welcome to BBC news, We have some breaking news this afternoon, her royal majesty has officially declared war on Denmark and has ordered all the troops and reverse to prepare to embark on ships and planes ready to take the entrance to Europe. Already we have seen the royal navy leave their ports and prepare to attack Denmark. The EU has so far remained silent on this but our soldiers are prepared to fight against any other communist nation who threatens us!”"
 britain.634.o1:0 "Good Luck Our Soldiers"
 britain.635.t:0 "Europe Will Be Taken"
 britain.635.d:0 "“Europe your time has come to be freed, my loyal soldiers have come to remove your disgusting left-wing leaders and governments and replace them with leaders of your own kind, people who are part of you. Democratic leaders who will set you free and monarchies who will lead you all to freedom. Today I speak directly to the EU, for too long you have had control over the peoples lives and their freedoms, now the time has come for the United Kingdom to once again enter Europe and restore the beacon of hope and liberty to you all!”"
 britain.635.o1:0 "Its Time For War"
 britain.636.t:0 "Rebuild The Empire"
 britain.636.d:0 "“Today the British Empire makes its return into the world. No longer will our small, isolated nation cower against Soviet, European and any other nation that we view hostile make us cower away from them. For today my people we have rebuilt the Empire to rule over the lands and ensure the sun shall never set again.\n\nI am proud of you all my loyal soldiers, men and woman who have fought for myself and your people we have been rewarded will large amounts of land to rule, people who can finally be freed from dictatorships and now we can unite them all under the flag of the Empire!”"
 britain.636.o1:0 "Welcome To The Empire"
 britain.638.t:0 "Prince Philip Leaves Us"
 britain.638.d:0 "A statement issued by the palace just after midday spoke of the Queen's "deep sorrow" following his death at Windsor Castle on Friday morning. The Duke of Edinburgh, the longest-serving royal consort in British history, was at the Queen's side for more than her six decades of reign. "It is with deep sorrow that Her Majesty The Queen announces the death of her beloved husband," the Palace said. "The Royal Family join with people around the world in mourning his loss."\n\nIn tribute to the duke, Westminster Abbey began tolling its tenor bell once every 60 seconds at 18:00 BST. It rang out 99 times to honour each year of his life. The flag at Buckingham Palace was lowered to half-mast and a notice was posted on the gates to mark the duke's death."
 britain.638.o1:0 "His Legacy Will Live On"
 britain.639.t:0 "The Queen Goes Mad"
 britain.639.d:0 "As the world morns the death of Prince Philip and Scotland awaits their next leader, the queen has started to believe her husband was somehow assassinated while he was in Edinburgh castle by another nation who used to be part of the empire and now, she wants to strike back at those nations for taking “Taking her husband away”. Although the evidence is clear this is not true, and he sadly died of old age she has remained firm that she is being targeted and must respond back harsh!"
 britain.639.o1:0 "She Cant Be Serious?"
 britain.640.t:0 "The Empire Of America"
 britain.640.d:0 "Although America would be a fantastic addition to the empire, it’s just too big and the American people are very similar to the British therefore we will establish a monarchy in America. The Queen has already went to meet the new King of the states and greeted him warmly. Both have spoken about the new alliances and are looking forward to working together."
 britain.640.o1:0 "Welcome To The Kingdom America"
 britain.641.t:0 "The Dominion Of America"
 britain.641.d:0 "We finally have America back in our hands after hundreds of years and rivalry between the two nations. The USA is finally the DOM, Dominion Of America and we couldn’t be prouder to take it back! The White House now flies the new flag of the dominion and already Americanised words have been replaced back with the proper English language. The roads have changed to drive on the side as the brits do and the queen has already made a set of plans for state to be heavily influenced under the british again."
 britain.641.o1:0 "Welcome Back America"
 britain.642.t:0 "The Country Is Ours"
 britain.642.d:0 "We have total control of most of the country Braiser, now were coming for you."
 britain.642.o1:0 "Run."
 britain.643.t:0 "The Country Is Ours"
 britain.643.d:0 "We have total control of most of the country Braiser, now were coming for you."
 britain.643.o1:0 "Run."
 britain.644.t:0 "The League Question"
 britain.644.d:0 "Nick Clegg has met with leaders from Ireland, Canada, and other countries part of the pact. They have agreed that the world is changing and the more members in the league the more power the pact has and reduces the threats from around the world. Now its up to the uk to abolish the british protection pact or remain together."
 britain.644.o1:0 "Join The Demoratic League"
 britain.644.o2:0 "Remain Isolated"
 britain.645.t:0 "A Country Build On Security"
 britain.645.d:0 "The UK has come to an agreement with Democratic League to work together in cyber security to prevent hackers form breaking into major I.T services in the nation. Billions of pounds will be poured into new services to equip the security agency in the country to prepare for a future cyber attack and be ready to target the next country who poses a threat to the nations."
 britain.645.o1:0 "Security First"
 britain.646.t:0 "The Bill Of Equality"
 britain.646.d:0 "Nick Clegg has published a new bill which will demand every single human life in this country to be treated the same as everyone else. No one shall be looked down upon or judged on where they have came from, what they do or what they look like. Already we have seen the LGBT community and other cultures attacked because of their views or lifestyle, this bill will no longer tolerate such hateful actions to our citizens"
 britain.646.o1:0 "Putting People First"
 britain.647.t:0 "A New Benefits System"
 britain.647.d:0 "Clegg has published a new reform in the benefits system which now makes it harder for those to exploit the system given to those people who need the help. Anyone who wishes to be enrolled into the welfare state for benefits will be investigated fully and ensure that they will be given what is needed rather than what they tell the welfare system"
 britain.647.o1:0 "Rebuild The System"
 britain.648.t:0 "A Green Deal"
 britain.648.d:0 "Nick Clegg has met with Russel Brand leader of the green party and has agreed that work needs to be done to fix the climate problem as well as the ongoing problems in this country. After many hours of negotiating both leaders have agreed to work together to create a new green future which will involve new solar farms and wind turbines and cutting down on the fossil fuels that are used to power our factories."
 britain.648.o1:0 "A Green Future"
 britain.649.t:0 "The Public Rights Bill"
 britain.649.d:0 "The Conservative leader has met with the cabinet to discuss how they can keep british life free and equal for all who wish to live and work here. By creating this bill it serves a purpose that no matter who you are and what your values are, you re equal to any british born person here. \n\nAs the bill is debated in Parliament it seems the Labour party and SDP view this bill as already existing mandate which is part of the Geneva convention for the rights of any human life to express themselves and this bill has only been created to get the public on the Tories side to show they “Care”. No matter what the outcome was due to the size of the Tory majority the bill was passed and now the Tories can express how they have enshrined freedom into british law."
 britain.649.o1:0 "A Bill Of Freedom"
 britain.650.t:0 "The Reform Of The Country"
 britain.650.d:0 "“Britain is broken and needs to be fixed” was the election slogan for the Conservative party during the election, it seems that the people agreed as to why they were overwhelmingly voted into power. Now they have the power the PM has announced the party will change the nation to make streets safe, rebuild the army and make sure the European Union knows we mean business when we say we are ready to defend our attack!"
 britain.650.o1:0 "Changing The Country Starts Now"
 britain.651.t:0 "Investing In The Armed Forces"
 britain.651.d:0 "The PM has announced new investments will be put into the military to further expand the on the small forces we have for a defensive acts on our isle. The new budget will turn our defensive army back into a overwhelming large national army group which will use the latest technologies available and back to training in urban areas. The SAS will be rebuilt and expanded upon while huge defence contracts will be sent out to build up Tanks, Jets, the navy and more. The PM has pledged that the army will become one of the biggest in Europe with the most tactical units the world will have ever seen."
 britain.651.o1:0 "The Army Is Back And Better Than Ever"
 britain.652.t:0 "Power To The Police"
 britain.652.d:0 "The Prime Minister has said in a speech in his conservative keynote – “The increase in serious violence is deeply worrying and sadly some people no longer feel as safe as they should. It is the Prime Minister’s priority to make our streets safer – and we’ve already begun work to do just that – so that the law abiding majority can live their lives free of the fear of crime. \n\nWe’re putting 20,000 more police on our streets. We are also extending stop and search and giving officers the tools they need to get the job done properly. new prison places will mean that we can hold the additional offenders who will be caught, charged, and sentenced. The Conservatives will always take the necessary steps to ensure criminals are kept off our streets.”"
 britain.652.o1:0 "Protecting The Streets"
 britain.653.t:0 "The Emergency Budget"
 britain.653.d:0 "The PM spoke to the people outside of number 10 shortly after his meeting with the chancellor,  “Britain’s financial situation was even worse than we thought and that the country would have to make savage spending cuts to bring its swelling deficit under control. the decisions we make will affect every single person in our country, he said. And the effects of those decisions will stay with us for years, perhaps decades, to come.” \n\nThe blame for the situation squarely on what he called “reckless” spending by the SDP government, which was in power for many years before being defeated in the last election."
 britain.653.o1:0 "Britain Needs To Be Fixed"
 britain.654.t:0 "Universal Credit"
 britain.654.d:0 "The new universal credit system will replace the existing benefit system, the new mechanism will merge the six main existing benefits (income-based Jobseeker's Allowance, income-related Employment and Support Allowance, Income Support, Working Tax Credit, Child Tax Credit and Housing Benefit) into a single monthly payment. This new system is part of the Welfare Reform Act which will make a concerning number of changes to the benefit system and ensure the new system will not be exploited and help rebuild the economy."
 britain.654.o1:0 "Could This System Work?"
 britain.655.t:0 "North Tech Program"
 britain.655.d:0 "A new program will run in the North of England which will invest heavily in new university projects to get new students up to date with technology and prepare them for a modern tech driven world. As well as this the PM has opened new jobs which will create circuit boards and research into technology and science which can be used in manufacturing and products. He has promised the north will become the tech hub of the north and an envy over Europe."
 britain.655.o1:0 "A Technology Advanced Country"
 britain.656.t:0 "Power To The Local Shops"
 britain.656.d:0 "The government has announced high streets will receive new money to improve transport links, build new homes and transform underused spaces in a key milestone for the government’s levelling up agenda. The government will invest up to 830 million pound from the Future High Streets Fund Investment will support areas to recover from the economic downfall and help transform underused town centres into vibrant places to live, work and shop."
 britain.656.o1:0 "High streets will return"
 britain.657.t:0 "The Highspeed Rail Project"
 britain.657.d:0 "The national railway project or “HighSpeed Rail” has been approved for creation by the government, this project will create a new rail service across the country from London to Scotland. The new service will allow faster trains onto the new line delivering faster services as well as more climate friendly services. The project will introduce new trains which are being created in this country to be made operational within two years and will cut times in half which could normally take 2 hours into 1 hour."
 britain.657.o1:0 "Faster Speeds For Passengers"
 britain.660.t:0 "The CANZUK Project"
 britain.660.d:0 "After the assassination of PM David Owen the UK alone and outmatched has started to realise the “British Protection Union” (BPU) is more in name rather than practicality, upon realising this the UK begins to look elsewhere for a way to defend itself from hostile USSR action.\n\nThe UK is looking to other places for defence preferably a bigger alliance, the USA having collapsed during the cold war, thus ending NATO the only other alliance available is the League of Democratic Nations (LDN), although a start many in the UK believe this is not ambitious enough some suggest an updated Dominion model called CANZUK brining the main Commonwealth nations together that being Canada, Australia, New Zealand and the United Kingdom.\n\nOthers say a military alliance would suffice, hopefuls believe that eventually it would become CANZUK+, as to where other nations join from the former Commonwealth and hopefully other nations that are non-affiliated, would also join, making CANZUK+ an attempted replacement for NATO.\n\n However, this does not please many politicians within the United Kingdom, believing the alliance would just be an extension of the LDN while others point out it would just end up being like the failed project NATO on an updated version of the Dominion model, they just see it as not being enough, no… no something more… ambitious… perhaps a revival of an age-old idea, something that was propriated and championed by Joseph Chamberlin, but was disrupted by the Great War… disrupted, until now. An Imperial Federation (IF)."
 britain.660.o1:0 "Could This Work?"
 britain.664.t:0 "Unrest In New Zealand"
 britain.664.d:0 "Messages have started to pop up around the streets of New Zealand asking the people to rise up and demand change. Adverts on television have been pushed onto the national tv station in New Zealand through UK hackers. Adverts about freedom and having the choice to do what they want have been shown to the people of the island showing them what their country could be in the future."
 britain.664.o1:0 "New Zealand Change Maybe?"
 britain.665.t:0 "Listen Up Winston"
 britain.665.d:0 "We have sent envoys to New Zealand to deliver messages to the iron fisted nation insisting they need to listen to their people and accept that change is coming. No matter who takes over it can either be through a diplomatic procedure or a total civilian unrest but the government will have to change. We have ordered them that they are getting one chance to sit down and talk with us about the new faction and introduce freedom to their nation or the people will remove them and they will ensure Peters pays for his hardline rule."
 britain.665.o1:0 "New Zealand You Better Listen"
 britain.666.t:0 "The Solution"
 britain.666.d:0 "Winston Peters has made it clear he will go down fighting rather than giving up his position but he has informed us that he would be willing to work with the centre left leader Jacinda Ardern and her Labor Party. Doing this will give the people the freedom they wish as well as restoring elections in the country and creating a welfare state. In turn we will see a nation ready to cooperate with us and our people free to visit New Zealand."
 britain.666.o1:0 "Welcome Jacinda"
 britain.667.t:0 "A Military Pact"
 britain.667.d:0 "The rise of CANZUK would immediately rile the USSR and EU because for the first time since before the collapse of the Unites States of America, they now had a rival. CANZUK would pose a risk in multiple ways, from trading capabilities to military might being the main pain point of risk for the USSR, another way CANZUK may pose a threat is that its existence may embolden anti-communist movements in communist countries and within the USSR itself, or outside nations who themselves fear communism may one day reach their front door and disrupt their way of life.\n\nWith the assassination of the Prime Minister David Owen, many countries now fear whether their leader may be next, some countries try to affirm their neutrality even more, while others may ramp up their anti-communist revanchism."
 britain.667.o1:0 "Working Together For Protection"
 britain.668.t:0 "A Military Sharing Pact"
 britain.668.d:0 "CANZUK has shared its technology with its member states and has decided to ramp up military production effort and to increase technological output, to attempt to create an advanced military force. In terms of public service, a British engineer has invented a jet suit, which could revolutionise search and rescue and other emergency services."
 britain.668.o1:0 "A Safer Future"
 britain.669.t:0 "The European Issue"
 britain.669.d:0 "CANZUKs first issue to deal with would be the British Isles being uncomfortably close to the EU, the Superstate, federation and or alliance would first focus on ramping up the Isles defence from sea forts, land forts, radar and antiair defences all available means of protection would be looked at, to secure the Homefront and even possibly its best way to invade the European mainland.\n\nMilitary production would also be an issue, due to the EUs size it not only has the manpower but also production capabilities, knowing this CANZUK after fortification of the motherland, would immediately begin construction of military factories capable of pushing new and up to date military equipment to at least match the EU if not out do it."
 britain.669.o1:0 "Watch Over The Channel"
 britain.670.t:0 "The CANZUK Space Agency"
 britain.670.d:0 "CANZUK wanting to fill the shoes left by NASA upon the USAs collapse has decided to create their own space agency with the goal of putting a man and the CANZUK flag along with member state flags on the moon within the next five years. Plans are also being drawn up for an Imperial Space Station, to truly kickstart the space era and utilise its the space station to create satellite networks to maximise, its ability to direct its military and to uncover enemy positions."
 britain.670.o1:0 "To The Moon!"
 britain.671.t:0 "Unite And Create The CANZUK"
 britain.671.d:0 "Out of the ashes of the British Empire is born the CANZUK Federation.  There is now a nation capable of rivalling the EU and USSR in trade, military, and most threating of all Nuclear Capabilities this new threat also controls all the sea trade routes and has military bases, navel, air or otherwise set up from the Pacific to the Mediterranean, although not on the level of the EU and USSR, CANZUK poses a threat to them not seen since the days of the USA and NATO."
 britain.671.o1:0 "CANZUK Is Born"
 britain.672.t:0 "Choosing The Faction Title"
 britain.672.d:0 "The United Kingdom has started an alliance, with the sole goal of opposing the USSR it is similar to a repeat of NATO except smaller nations but yet very powerful. The CANZUK nations by themselves stand no chance against the EU and USSR even America collapsed before its might..but now the nations are united together ready to defend and attack if one of their brothers falls.\n\nNow the pact has been created its time to choose the faction title and the future of the union"
 britain.672.o1:0 "Imperial Federation"
 britain.672.o2:0 "CANZUK Union"
 britain.672.o3:0 "CANZUK Commonwealth"
 britain.672.o4:0 "CANZUK Federation"
 britain.672.o5:0 "Imperial CANZUK Federation"
 britain.672.o6:0 "Imperial CANZUK Commonwealth"
 britain.672.o7:0 "Imperial Commonwealth Federation"
 britain.673.t:0 "The Close Watch Of America"
 britain.673.d:0 "CANZUK will intervene in America through the means of sending supplies to the American Republic, in doing this we could gain favour with the victorious government although this does not guarantee they will assist you in a war through military means. Although we also have the chance to use our Canadian ally and allow republic troops through Canada and into the north."
 britain.673.o1:0 "Helping An Old Friend"
 britain.674.t:0 "Pushing Europe"
 britain.674.d:0 "Using fear tactics to stoke the fears surrounding the EU, the large size and power of the CANZUK union will allow nations to release that if freedom can be installed into their nations then the people will no longer have to live in fear against their rulers!  Through this CANZUK will drop leaflets through planes into countries across Europe informing them about what life really is like outside of the tight gripped nation and what freedom would really mean for the people. Through this method it would certainly tip the unstable countries in the EU into chaos."
 britain.674.o1:0 "Europe Can Be Given Freedom At Last"
 britain.675.t:0 "Democracy Wins"
 britain.675.d:0 "The people of the UK have chosen to follow the democratic route and wishes ensure that their freedoms are kept as well as knowing they have a choice of different governments in the future."
 britain.675.o1:0 "The UK Follows The Torch"
 britain.676.t:0 "Cornwall And Its Border"
 britain.676.d:0 "Cornwall has finally left the union and is ready to build its state and finally put its people first, The leader of Cornwall has promised change and protection against the English. The Cornish people have celebrated through the night looking forward to the new age of Cornwall."
 britain.676.o1:0 "Cornwall Is Free"
 britain.677.t:0 "Fixing The Oversea Problem"
 britain.677.d:0 "Temporary housing units will be built in the likes of Dover and Cornwall to house those fleeing war and seek shelter until countries are able to work together and fix the refugee problem. Although many on the right protest this many more in the country agree all human life is important and we must protect this right."
 britain.677.o1:0 "We Must Care For All"
 britain.678.t:0 "Speaking With The EU"
 britain.678.d:0 "Tony Benn has made history and sat down with the communist European Union to discuss the problems facing both England and the rest of Europe. While arguments did occur, all sides agreed that it’s time to put aside ideological differences and work to fix their countries so what happened to the United States does not happen to Europe."
 britain.678.o1:0 "Its Time To Work Together"
 britain.679.t:0 "Arresting Far Right Leaders"
 britain.679.d:0 "“Good Morning and welcome to a special broadcast of the BBC. In cities across the nation, a temporary martial law has been declared as leaders of far-right parties are being arrested. Theresa Braiser and Nick Griffin are said to be in handcuffs as of 3:08 this morning, with their structures quickly crumbling under the weight of government intervention.\n\nAuthorities expect the martial law to be rescinded sometime in the afternoon yet offer no promises. If questioned by government forces, cooperate. If you have nothing to hide, you will be let go.”"
 britain.679.o1:0 "Removing Evil From The Streets"
 britain.680.t:0 "Counter The Communists"
 britain.680.d:0 "Members of the labour cabinet have met with the likes of Robert Griffiths and George Galloway and have come to the agreement they will no longer attack each other politically but instead unite to counter the leftist parties currently gaining popularity. For once, political parties are united against a common threat."
 britain.680.o1:0 "Labour Is For All Not Just The Left"
 britain.681.t:0 "Corbyn Comes Back"
 britain.681.d:0 "Tony Benn and Jeremy Corbyn have met this afternoon, and both agreed to work together and merge the Independent Labour Party with the Labour party, with this victory the labour parties majority is the biggest that has ever entered parliament allowing sweeping policies to be voted through into law and with the far left and center left now having a voice for all the people it seems the country is united again."
 britain.681.o1:0 "Labour Is Once Again United"
 britain.682.t:0 "The New NHS System"
 britain.682.d:0 "The NHS is a defunct system according to Tony Benn, but Deputy PM Corbyn has an idea. Jeremy Corbyn mentioned in his manifesto for the ILP Instead of reforming this system and letting it get useless once again, the government should rebuild it from the ground up. This will ensure the English a better, more quality driven healthcare system."
 britain.682.o1:0 "Labour Has Changed The Health System Again"
 britain.683.t:0 "Embrace New Labour"
 britain.683.d:0 "Keir Starmer has met with Tony Benn to discuss the future of the party, both know they cannot follow the old ways forever and must change eventually, as Benn gets older the parties stability gets weaker. Now Keir has put forward his name to become the new labour leader and rebrand the party to gain support from the SDP back to the party. Benn has agreed now he has brought stability to the nation he is ready to give his torch to the next leader and let the modern age change the party for good."
 britain.683.o1:0 "New Leadership, New Labour"
 britain.684.t:0 "Modernise The Country"
 britain.684.d:0 "The NHS is to be expanded with new hospitals to be built in cities and towns to provide more of its services with a bigger budget to provide better health services to the people and new technology to research in medical science. Meanwhile travel is to be rebuilt with new buses fitted with electric engines to enter service soon and cheaper rail services provided to the people and new universities and schools to be created and fitted towards the worlds technology future as labour announces their new budget plan for the travel and public service industry."
 britain.684.o1:0 "Lets Take Britain Into The Future"
 britain.685.t:0 "Building Back Better"
 britain.685.d:0 "Building sites are popping up all around the country with jobs already being advertised on job websites and newspapers, new modern schools are being built ready for the next generation while a new green deal has been created to create new wind and solar farms removing the fossil fuel energy sector."
 britain.685.o1:0 "Labour Planning For The Future"
 britain.686.t:0 "Changes In The Army Budgets"
 britain.686.d:0 "Although no soldiers will be made redundant and army sizes will not be made smaller, investments on newer tanks and jets will be cut while that money will go into new projects for science and technology. The conservatives have condemned this action and have asked the LibDems and SDP to also vote against this but due to the size of the labour party it seems this policy will be something that will be voted through."
 britain.686.o1:0 "We Must Fix Our Country First"
 britain.687.t:0 "A Country For The 21st Century"
 britain.687.d:0 "Labour has transformed the country to a nation which its people are proud to call home, industries have expanded with unemployment at an all time low, relations with other countries are at an all time high with new relations with Europe starting to grow. The next generation able to finally be able to grow up in a stable country with a strong economy and able to one day afford a new modern house. It seems labour really were the right party to be chosen to take over and repair a broken country."
 britain.687.o1:0 "Finally A Country To Be Proud Of"
 britain.688.t:0 "The SDP Leadership"
 britain.688.d:0 "As ballots are cast for the leadership election, many feel Tony Blair would be perfect for this role as he left labour back in the late 90s to join the SDP with his strong center left values but others also feel Amy Callaghan would be suitable with her younger age her points of view matches many young voters out there, Rishi Sunak would be great to rebuild the economy and his plans for the industry would be beneficial but then again Neil Carmichael is the oldest member of the SDP in the election and knows the values of the SDP and what direction the party should really take?"
 britain.688.o1:0 "Time To Find A Suitable Leader"
 britain.689.t:0 "A Richer Nation"
 britain.689.d:0 "The new budget put forth by the Chancellor seems to be bigger than it has been in previous years. This one calls for investment into the public sector, the restoring of the High streets area, and much more to come. While its been criticized by opponents, many welcome this investment into the country rather than the world."
 britain.689.o1:0 "Its Time To Put Money Into The Country"
 britain.690.t:0 "Help The Highstreets"
 britain.690.d:0 "Many Northern towns have been left run-down and deserted with local shops failing due to supermarkets taking over and taking the business else where leaving the street empty and old shops closed. Now the SDP has promised to subsidize these areas in an effort to form some semblance of economic stability in the area. Whether it works or not remains to be seen."
 britain.690.o1:0 "Lets Build The Businesses Up"
 britain.691.t:0 "The UN Meeting"
 britain.691.d:0 "Britain, in all her wise majesty will push to drastically reform the UN into something more competent. The idea that only the big nations carry power is antiquated and doesn’t give smaller nations a sense of equality. Britain’s reform will make sure nations like France and Germany have more of say than they have had. This is in an effort to make sure those nations do not collapse like the United States did, and if they’re near that then they will receive the help they need."
 britain.691.o1:0 "Lets Fix The World Together"
 britain.692.t:0 "The London Olmpics"
 britain.692.d:0 "Good morning and welcome to a special broadcast of the BBC. The Olympics have come to London and our city could not be happier. Last nights opening ceremonies were considered a major success in which bands Coldplay, U2, and singer Paul McCartney opened up with “Imagine”. Along with this, our government officials, and many athletes, including those as part of the refugee “nation” came out to condemn the Communist nations of Europe and Asia. Sources say that many leaders are angry with the English, but our citizens approve of this measure."
 britain.692.o1:0 "A Time Of Unity"
 britain.693.t:0 "The Green Plan"
 britain.693.d:0 "Good evening and welcome to the 10:00 broadcast of the BBC. In todays news, the Queens corgis have been banned from Westminster, and leaders from across Europe have met in the neutral state of Luxembourg to discuss the potential policies of environmentalism that each nation can put forth.\n\nAccording to representatives from the conference, the goal of it was achieved as representatives from Russia to Portugal all agreed that the world is getting hotter and if action was not taken now, then the world would surely be doomed in a couple decades. Being known as the Luxembourg Climate Accords, every nation will take measures to reduce their carbon footprint."
 britain.693.o1:0 "Saving The World Together"
 britain.694.t:0 "Patels Plan For Control"
 britain.694.d:0 "Priti Patel has now taken control of the Isle of Britain removing the other factions and claiming the states for herself. Now she can take the rest of the world and change it in her own vision."
 britain.694.o1:0 "Patel Has Complete Control!"
 britain.695.t:0 "Coldplay announce new tour with U2"
 britain.695.d:0 "Coldplay and U2 will be delighting fans next summer after there announcement of a joint tour came out today. Both bands will tour the commonwealth countries in what promises to be the event of the summer. U2, known for their political activism have promised to donate 50% of the bands funs to refugee organizations, while Coldplay has promised to put on the show of a lifetime!"
 britain.695.o1:0 "Glastonbury Should Be Interesting!"
 britain.696.t:0 "The new Doctor is announced for doctor who"
 britain.696.d:0 "The new Doctor is announced for doctor who – In what is being called a “return to tradition” Sir Patrick Stewart has announced that he will be playing the new Doctor. An acclaimed actor and knight, Stewart is happy to take part in this integral part of English culture. Already images of him in the Dr outfit are circulating around social media sites, and replicas of his double-sided sonic screwdriver are hitting shelves.\n\nAmong the many pieces of info coming out, there is reportedly an episode where the Doctor gets stuck on a planet almost like ours, but their UK came under the rule of Oswald Mosley."
 britain.696.o1:0 "The Doctor And The TARDIS Arrive"
 britain.697.t:0 "The Pope's visit to Glasgow, Edinburgh, London, and Birmingham"
 britain.697.d:0 "Blessed be the English isles. For the first time in over 50 years, his holiness the pope has toured the English Isles and blessed the cities of Glasgow, Edinburgh, London, and Birmingham. His holiness has praised the Isles for taking in the refugees of Europe and providing them a safe home."
 britain.697.o1:0 "Bless Our Lord"
 britain.698.t:0 "Jimmy Savile dies in prison after being arrested in 1985"
 britain.698.d:0 "Jimmy Savile, a man whose name is associated with DJing the radio, has died in prison from a successful suicide. After being found guilty of rape, child molestation, and possession of child pornography in 1985 Savile was sentenced to 2 consecutive life sentences in prison. While rumours persisted for about a decade, Savile’s career suffered not one bit. After being placed in protected custody last year, Savile is said to have had contact with nobody but the guards who brought him meals and a therapist."
 britain.698.o1:0 "Leave Him To Rot Away"
 britain.700.t:0 "The New Party"
 britain.700.d:0 "With the removal of Jeremy Corbyn, its now time for the leaders of the left parties to meet together and elect a leader to take control of the republic. Dermot Hudson has already been escorted out of the meeting due to his angry tone against other members as he tried to promote his ideology of juché, he has been removed from the ballot. It seems like George Galloway and Robert Griffiths are to be going against each other in the leadership election as both seem to have won the hearts of the congress as well as many across the republic showing their support for both."
 britain.700.o1:0 "Who Shall The Congress Elect?"
 britain.701.t:0 "Form The Congress"
 britain.701.d:0 "With the establishment of the workers party now in control of the republic, the congress can finally be established for the people and the removal of the houses of common. Now the party will meet in a new building built especially for the congress and built ready for a modern age. Chairman Galloway has already announced his excitement to get started in the new congress and call the first TUC meeting."
 britain.701.o1:0 "Out With The Old, In With The New"
 britain.702.t:0 "The First TUC Meeting"
 britain.702.d:0 "The first TUC congress meeting has taken place in the new congress building situated near Buckingham Palace. Galloway welcomed his party as well as the communist and other leftist parties into the congress. The national anthem, The Red Flag rang out through the hall as the members stood up singing along with it with Galloway and other leaders stood at the front of the hall.\n\nGalloway took to the stand and announced that a new day has come for the nation and the republic. The people of this country will no longer have to fear or worry about their lives or the leaders anymore, this new congress and its system will be fair and equal, it will give members a chance to speak their minds and stand up for their constituents.\n\nAfter a huge applause the meeting began and Chairman Galloway set out his vision for the nation."
 britain.702.o1:0 "The Nation Awaits Change"
 britain.703.t:0 "The Nation Of Three"
 britain.703.d:0 "Chairman Galloway has come up with a plan to rebuild Britain and bring it to the modern age ready to rival against other nations. Scotland, Wales, and England will all be focused and rebuilt in their different sectors. Galloway has promised the “Level Up” each industry and state With Wales economy to be rebuilt using industry Wales has always succeeded in as well as Scotland which will finally have the investment it needs to remove the drug problem and focus on rebuilding homes and town centres where as England will finally have investment made to install new business hubs which will be remodelled to fit under a socialist nation."
 britain.703.o1:0 "Finally.."
 britain.704.t:0 "The Welsh Revolution"
 britain.704.d:0 "Wales has finally been reorganised into the socialist cult under Chairman Galloway. The state of Wales now flies the new socialist Welsh flag and its industry has been revolutionised ready for the 21st century. The people finally have jobs with better wages, store shelves are now fully packed with product and poverty has been removed from the state. It seems as if Wales has been complete transformed into a socialist paradise and its people cheer for Chairman Galloway."
 britain.704.o1:0 "The Red Dragon Roars Loud"
 britain.705.t:0 "A New England"
 britain.705.d:0 "England has been rebuilt ready for Galloway’s ideals. The people of England finally have jobs which they can work in which are built for a modern age with the correct socialist’s ideals. Farms and factories are now equipped ready for the 21st century with better safety laws and regulations while the people are kept safe and protected at work away from greedy capitalists’ bosses who would take advantage of their work force."
 britain.705.o1:0 "The English Hold Their Red Fists High"
 britain.706.t:0 "Salmond Arrested"
 britain.706.d:0 "Alex Salmond has been arrested in his home in Scotland and faced the republican courts, he has been charged and arrested for going against the republican congress and pushing for disgusting capitalist outlook into Scotland trying to recruit the people to rise against the chairman. He will now be imprisoned for the rest of his life and the ALBA party will cease to exist. The chairman has hoped with this move the people of Scotland will no longer be interested into an independent Scotland with revolution underway in Scotland the people finally able to live their lives in freedom and happiness under a new red flag."
 britain.706.o1:0 "A Nation For All"
 britain.707.t:0 "Isolation"
 britain.707.d:0 "The republic has decided outside affairs no longer matter to the republic and it should only focus on the internal issues that exists currently. Galloway is against the EU and its values; it goes against every bit of british heritage and its socialists’ goals. Removing the nation away from other nations and their problems ensures that the republic will be a nation which stands proud on the world stage showing what a real leader can do and how it values its people while the likes of Russia and the EU watch enviously."
 britain.707.o1:0 "A Nation For Itself"
 britain.708.t:0 "Republican Day"
 britain.708.d:0 "Britain has changed dramatically over the past few months and now its time to remember and celebrate the huge changes the republic has went under. Chairman Galloway has ordered that once a year there shall be a celebration which will occur to celebrate the peoples power and transformation of the state. “Republican Day” will be a celebration where the red flag will fly high over streets and houses."
 britain.708.o1:0 "A New Christmas Day"
 britain.709.t:0 "Local Unions"
 britain.709.d:0 "The Worker Party has come to an agreement with the TUC to completely absorb the union into the party and work with the union to ensure the workers rights are kept and promised as well as safe working for all. Although the TUC is now part of the congress, new sub branches of the union will be created and established across the nation in different towns and cities and be established within councils to create a local authority for each area of the nation to ensure that each worker of the republic is represented and their working rights are kept as well as safe."
 britain.709.o1:0 "Protecting The People"
 britain.710.t:0 "A Paradise For All"
 britain.710.d:0 "“My fellow comrades, friends and workers, we have complete what many thought would be impossible. Our island has been broken, stripped apart and everyone has been robbed of their freedoms. Now under the workers party we have set you all free, showing the rest of the world what a true socialists state is and no longer having to deal with other nations and their silly war games.” Chairman Galloway announced in a speech in the congress broadcast live to the republic. \n\n”Our work is not yet complete, we still have much to do but our transformation is near to finish and you will all be able to embrace the left ideals we offer you.” \n\nAlthough many cheered it seemed some other parties which were absorbed into the Workers party did not agree with this, whispers move around the nation that something is coming and Galloway is going to far and could become a dictator of the Republic."
 britain.710.o1:0 "Is this it?"
 britain.711.t:0 "The Northern Strike"
 britain.711.d:0 "The Worker’s Party has so far done great things to the country until recently. Due to a lack of trade with other nations and low investment many industries have closed causing unemployment to grow and fast.  It seems that this has fallen on deaf ears as the north of England struggles. Unions have failed to investigate this and the population are getting angry..Strikes and protests have started to take place across cities in the north around Liverpool, Middlesbrough and many others including Wales and some areas of Scotland. Although Chairman Galloway has failed to address this, he has sent the republican army instead to deal with the trouble makers.."
 britain.711.o1:0 "Wait what??"
 britain.712.t:0 "A Step To Far"
 britain.712.d:0 "As the republican army stepped in and try to move the protesters off the streets in Durham it seemed that one of the soldiers did not get the message of “peaceful protest” and shot one of the members of the crowd. As soon as the body fell on the floor the rest of the angry protesters fought back against the army taking their weapons off them and firing back\n\nNews quickly spread to other northern towns such as Hartlepool which followed the same. Protesting quickly became riots as the army quickly lost control of the situation and had to retreat back to their bases.\n\nAs the news reached Galloway his anger became uncontrollable ordering the soldiers to go back and fight against the fascists, many refusing to fight with their comrades and instead standing by them fighting for change."
 britain.712.o1:0 "This Cant Be Good"
 britain.713.t:0 "The Communists Take Power"
 britain.713.d:0 "As many towns and cities in the north challenge the workers party and refuse to stand down, the communist party has been able to surge in popularity by offering their support against Galloway. It seems that much of the north as moved farther left and started to accept more communist ideals.\n\nDuring one of the protests in Tyneside it seems that some Communist groups were able to take control of the main council buildings there and other congress buildings in the north. After fighting their way through and flying the communist flag on top of the buildings, the groups have now established an independent communist state in the north which they have asked Robert Griffiths to take charge of and create the “Northern Communist State Of England”"
 britain.713.o1:0 "The Country Breaks Apart"
 britain.714.t:0 "Galloway Meets With The EU Leaders"
 britain.714.d:0 "George Galloway was never a huge fan of the EU and hated the idea of joining it, but that was before he became a leader of a country which has over 60 million people living in it and the republic needs help and allies.\n\nGeorge Galloway has went to the European parliament and has begun talks of a new trade agreement with the superstate in hope he can build a strong economy in Britain as well as lending a hand to Europe during their struggles such as France facing uprising and Italy’s refugee crisis."
 britain.714.o1:0 "An Interesting Time"
 britain.715.t:0 "The British Marshall Plan"
 britain.715.d:0 "The European is in a dire state, France is currently experiencing another revolution, Germany is having to help fund the rest of the nations out of debt to prevent the collapse of the union while Italy tries to deal with a refugee crisis not seen since World War two.  Its time the republic steps in and takes the weight off Germanies shoulders and help the rest of the countries. In return we could get a very tasty trade deal as well as some added extras because of the aid we can offer."
 britain.715.o1:0 "Britain To The Rescue"
 britain.716.t:0 "The Leaders Meet"
 britain.716.d:0 "Chairman Galloway has arrived in Berlin to meet with the German chancellor and discuss the future relationship between the two nations. Both nations want a strong stable relationship which can work closely together and help secure the future of the leftist ideals in Europe and help spread them around the world. Their first tasks are to secure a new trade deal as well as supporting other left wing governments around Europe and help Germany secure its place in mainland Europe along with France and Italy."
 britain.716.o1:0 "United Together"
 britain.717.t:0 "The Supply And The Confidence"
 britain.717.d:0 "George Galloway has pledged that he will work with the French administration to rebuild the French state to its old former glory in return, France will sign a trade deal with the republic and allow businesses to invest in both nations. Galloway has also promised to spread the word of the French congress who cares for its people and puts their best interests first while the French do the same for the British republic."
 britain.717.o1:0 "France And Britain United"
 britain.718.t:0 "Italy Needs Help"
 britain.718.d:0 "Italy has noticed the impact Britain is having on their European neighbours and wishes to get involved with this as well. The Italian leader has reached out to George Galloway and asked for his assistance to recover Italy from its current turbulent time. Areas such as the drop-in support of the left wing parties and the refugee crisis has plunged the nation into turmoil and needs support and fast."
 britain.718.o1:0 "Time For Action"
 britain.719.t:0 "Dermot Takes A Slice"
 britain.719.d:0 "Now part of the north has fallen under a communist state, Dermot Hudson has noted the opportunity to take some power. He has ordered his followers to raid congress buildings in the cities of Manchester and Liverpool. He has ordered the extermination of all congress officials and has now raised the new Communist Merseyside Flag over the congress buildings announcing that he has now established a new “Juché” state in the north. He will finally be able to bring peace to his land and operate it in the same style as Korea. "
 britain.719.o1:0 "This Is Crazy, Some Needs To Do Something?!"
 britain.720.t:0 "Ella Rule Takes Scotland"
 britain.720.d:0 "After the north of England breaking away from the republic it seems that some areas of Scotland also like the idea of having their own freedom and no longer having to be pushed under a fist by George Galloway. Social Activist who is gaining fast popularity, Ella Rule has decided she will follow the North of England and take the area of Aberdeenshire out of the hands of George Galloway and create an independent workers state."
 britain.720.o1:0 "Scotland Is Going As Well?!"
 britain.721.t:0 "McDonnells Coop"
 britain.721.d:0 "After the breakup of the republic the remaining congress leaders met in secret away from Galloway to discuss how they can remove him from power and restore the republic back to its old former self. Ella Rule, Dermot Hudson and Robert Griffiths agreed to meet as well and all agreed it was time to remove George from his position and elect a new member to rule the republic.\n\nAs the hours went on it seemed the John Mcdonnell would be the perfect fit for the role who would be able to restore order on the Isle as well as preventing another breakdown of states.\n\nAs the day got later the leaders orders the republican army to take Galloway away out of his congress office and place him under house arrest while announcing that the socialist John Mcdonnell will now take over the republic and the break away states will now be reintegrated into the republic."
 britain.721.o1:0 "Finally, Something Good"
 britain.722.t:0 "The Coalition Of The Right"
 britain.722.d:0 "Prime Minister [Root.GetLeader] has met with the leader of the other right-wing party and both leaders have now agreed they will work together as a coalition being able to gain enough support for future laws and policies. Due to the similarities of Britain First and the BNP it seems that some if not all policies in the party’s manifesto will be implemented into British law.\n\nWith this ground breaking news already the left and centre parties have been pushed even further into irrelevance with the strength of the right gaining more power and popularity."
 britain.722.o1:0 "It Seems The Right Wing Has Gained Even More Strength"
 britain.723.t:0 "Stop The Extinction"
 britain.723.d:0 "The british people are becoming a minority on this great island and we must prevent our pure-blooded English people from becoming wiped out by foreigners who have come here. Therefore, our government will now create reward programs to couples who give birth to many british children and help keep our british race alive. Those who birth 3-4 children will be given free healthcare and many great benefits as well as standing out as a true british citizen while those from overseas who give birth here will be taxed more."
 britain.723.o1:0 "Keeping The British Blood Alive."
 britain.724.t:0 "Deport The Illegals"
 britain.724.d:0 "After the huge influx of immigrants arriving to our shores looking for housing and work, they are given first class treatment while our homeless british people, those who live in small houses with large british families struggle to find bigger homes are pushed to the side. Its time to put a total stop to this right now and anyone who arrives into our nation illegally will be removed.\n\n[Root.GetLeader] has promised the british people will finally be given priority for housing and benefits and no more will they worry about the foreigners coming and stealing THEIR BRITISH JOBS!"
 britain.724.o1:0 "Today The British People Get Priority"
 britain.725.t:0 "Rebuild The British Isle"
 britain.725.d:0 "Prime Minister [Root.GetLeader] has today announced the rebuild program for the United Kingdom. Starting from today the whole system shall now be “Reformed and Rebuilt, Brick by Brick” as the PM called it. He has also called out the previous administrations for allowing criminals and gangs to take over streets as well as the justice system being weak and slow. Now with a new strong government in power. The justice system will be reformed, and education programs will be introduced to bring back the old days of respect and british etiquette."
 britain.725.o1:0 "Today The Isle Is Rebuilt"
 britain.726.t:0 "Here Come The Black Shirts"
 britain.726.d:0 "[Root.GetLeader] has always wanted to use some of Oswald’s Mosley’s past ideas and integrate them into society, today is the day he has done just that. Earlier today the PM announced to his cabinet that the police force will now be known as the black shirts and enforce the law through power and discipline. They will have a greater role and power on the streets and finally have the respect from the people. Through this new reform it is hoped the new police force will finally bring fear to known criminals and gangs and show the nation that crime is finally being taken seriously and no more will young offenders be given a simple slap on the wrist."
 britain.726.o1:0 "The Past Has Returned"
 britain.727.t:0 "Far Right Education"
 britain.727.d:0 "The education secretary has today announced that the new education policies in this country has now been rewritten to reflect the old golden days of the british empire as well as following a pro british education system. All pupils will now be ordered to sing the national anthem at the start of the school day as well as learning about the history of the british empire and how it brought freedom and democracy to nations which were undeveloped and needed help. It will also encourage men to work more manly jobs while woman to be the typical housewife like the past and encourage couples to have as much british children as possible to keep the British race alive."
 britain.727.o1:0 "For Britain's Future"
 britain.728.t:0 "SAVE THE PUBS!"
 britain.728.d:0 "Many public houses have been shut down and gone bust due to cuts in funding causing the british local heritage to fall. Many wish to finish work and go for a pint down the local pub but many cannot do this. Until now, [Root.GetLeader] has pledged to put billions aside to rebuild the pub network in the nation and give grants to those wishing to open public houses again. The PM has even promised to allow smoking rooms in pubs to bring the old british days back and encourage the people that the old days can return!"
 britain.728.o1:0 "A Pint For All!"
 britain.729.t:0 "The British Test"
 britain.729.d:0 "The citizenship test is an easy simple test which can easily be passed if enough time is spent cheating using the internet beforehand. Now the test will be reformed into the “British Test” which will ensure only the true british person could pass. For those who pass this test, blood will be taken and analysed to see if those from overseas contain British DNA from the past. If so, they will be allowed to reside here, if not they will be prevented from entering our great nation."
 britain.729.o1:0 "Securing The Future"
 britain.730.t:0 "The Empire"
 britain.730.d:0 "Many have forgot the british empire and now some young adults didn’t even know we once had a strong and mighty empire! We must do something about this which is why, Britain First leader, Paul Golding has announced a new military defence plan to be created which will restore our place on the world stage and show other nations that Britain is back and ready to take up arms if anyone wishes to go against our place."
 britain.730.o1:0 "British Empire 2"
 britain.731.t:0 "BF Meet The Queen"
 britain.731.d:0 "Jayda Fransen and Paul Golden have met with her royal majesty the Queen to discuss the future of the nation and the direction they wish for it to go. They have asked her majesty to accept title of empress of the empire and give her approval to take back the nations that are part of our commonwealth.\n\nNations such as Jamaica and South Africa have already agreed they will work closely with the united kingdoms government to prevent complete takeover but accept the return of the empire. Although many are protesting in the streets with many saying the days of slavery are over and we must protect our own nation first. It seems the Britain First leaders have ignored the pleas of the population and are ready to take the empire back."
 britain.731.o1:0 "The Queen Agrees"
 britain.732.t:0 "The Cult Of Royalty And Fascism"
 britain.732.d:0 "The far-right government and the royals have come to agreement to work together for the future of the United Kingdom and its commonwealth. The royals will now have a far greater influence in british politics if they continue to support this current administration and show the population this government is for the british people. The BNP has ordered every home to hold a picture of her royal majesty in their living rooms to show their support and gratitude for her."
 britain.732.o1:0 "Long Live The Queen"
 britain.733.t:0 "Take The Empire"
 britain.733.d:0 "With he queens permissions now granted and her new title accepted, we can now plan to rebuild the british empire. Already some nations across the commonwealth have accepted they will be integrated into our new empire and accept us as their government.\n\nIt is now time to plan to take the other nations who refuse us as their leaders. The states of Normandy and Brittany were originally British many years ago and they must be taken back and cleaned from the European communists. If we are able to take those states we have a foot into Europe and can finally challenge the leftists."
 britain.733.o1:0 "Time To Get The Pigs"
 britain.734.t:0 "The New Alliance"
 britain.734.d:0 "With our new relationships with New Zealand and Spain while working close with our royal family it is now time to create a new alliance to unite our nations and friends and show the world we stand ready and that Europe will no longer pose as a threat to us. “The Pact of Nations” has been created and are ready to stand shoulder to shoulder against anyone who threatens our nations. New Zealand’s strong military presence, The Spanish royal fleet ready to fight in the seas and our nation ready and waiting with our highly skilled trained troops will show the world we are ready to take the empire and more."
 britain.734.o1:0 "A New Alliance Ready For War"
 britain.735.t:0 "The Economy Plan"
 britain.735.d:0 "The SDP were in power for nearly 20 years, throughout that time they failed to rebuild the economy and remove poverty, now the british party finally has a chance to get the job finished. The chancellor has today announced new radical reforms which are to take place and completely change the way taxes and payments are made. A new operation is to undergo which will ensure the average brit will be able to live happily in a well-paid job and get the benefits they should have got compared to those from overseas who were able to get the benefits for nothing while the average brit suffered!"
 britain.735.o1:0 "Time To Fix The Money Problem"
 britain.736.t:0 "Tax The Non Pure"
 britain.736.d:0 "[Root.GetLeader] permits the non british folk to remain here if they obey british laws and accept british custom but they still must understand that the british identity is a superior title and if you wish to remain here then you must pay your way. Under new legalisations those who practice different religions and different customs will have to pay new taxes to preach their religion. If not, get out."
 britain.736.o1:0 "British Through And Through"
 britain.737.t:0 "Subsidise British Businesses"
 britain.737.d:0 "The Chancellor has announced new tax relief for those who currently have set up business here and help the average brit out for a job. As well as this the chancellor will also set out to create grants and loans to new business owners to help keep high streets up and hiring british people back into shops, businesses and more. Many businesses such as Fish n Chip shops, pubs and other local british heritage sites will gain less tax and in return more grants to hire the british person into work."
 britain.737.o1:0 "Help For The British Business"
 britain.738.t:0 "Fighting For The Future"
 britain.738.d:0 "The Defence secretary has announced new plans to boost funding into the british army and arm our troops with modern day weaponry and future technology to fight in the wars that could put our nation at peril. The royal navy is to be massively expanded with trident being refurbished and more fleets of nuclear submarines deployed as well as new RAF jets to be built across the country and massive new expansions to the army with 1000s of soldiers to be recruited into the armed forces."
 britain.738.o1:0 "Today Britains Armed Forces Expands"
 britain.739.t:0 "The Strong Pure Brit"
 britain.739.d:0 "The BNP and Britain First have rebuilt Britain in their own image, highstreets are finally busy again, the young people are learning about the british empire and how strong it once was as well as freeing people showing them the power of democracy. The economy is getting stronger and a new alliance has been created. Britain has finally made a return back onto the world stage and our people couldn’t be prouder. Britain is finally back!"
 britain.739.o1:0 "Welcome To Britain"
 britain.747.t:0 "David Owen Stands Down"
 britain.747.d:0 "David Owen, at the age of 74 has today announced he was stepping down after nearly 20 years as prime minister and as SDP leader.\n\nThe prime minister returned to his political roots in the south east  in his constituency, telling supporters at the SDP political club he would stand down as PM on June 27. He will tender his resignation to the Queen on that day. “I have been prime minister of this country for just nearly 15 years. In this job, in the world today, I think that is long enough for me, but more especially for the country. Sometimes the only way you conquer the pull of power is to set it down,” he said. Owens will be remembered as the man who repaired the country and rebuilt the failing economy as well as preventing the fall of the country to radical leftist.\n\nMany believe Shirley Williams will stand for the leadership election but with the popularity of Tony Blair and his ideas to reform the party with the slogan “The New Social Democratic Party”, and take back the centre left vote from labour and take in new modern reforms. It seems this news will transform Britain once again."
 britain.747.o1:0 "What Will The Future Bring Us?"









 GAME_OVER_TT:0 "§RThe game will end for you.§!"







#Scotland#
 scotland.1.t:0 "Scottish Freedom"
 scotland.1.d:0 "“I’m Jackie Bird and welcome to Scottish One, here in Edinburgh the feeling of excitement is palpable. All over the country, celebrations are expected to rage into the early morning. Early this morning, the Union Jack was taken down from every government building and replaced with the grand old Saltire. While celebrations are the main focus on peoples mind, many wonder what will happen with the government.”"
 scotland.1.o1:0 "Scotland Is Finally Free!"
 scotland.2.t:0 "First Constitutional Convention"
 scotland.2.d:0 "“Welcome to Scottish One, I’m Jackie Bird with todays breaking news. In about a months’ time, delegates from across the country will meet in the Edinburgh International conference center and form a constitution by which the Government will abide. According to the Provisional government, these delegates will also decide on a form of Government. Already many civilians are out in the streets protesting for their demands. Coming up in the news, James Macavoy seems to be making his return to acting.”"
 scotland.2.o1:0 "The Voice Of Scotland"
 scotland.3.t:0 "Scotland Demands Change"
 scotland.3.d:0 "“Good morning and welcome to a special edition of Scottish One. Here in Edinburgh, streets are crowded with hundreds of thousands of people demanding a fair and equal constitution. Some are out here asking for a return to a monarchy, and the one group that’s shocked many are the druidic protestors. The Druids apparently seeks to restore Scotland to a clan rule state. Either way, the city seems alive once again.”"
 scotland.3.o1:0 "The People Want Power!"
 scotland.4.t:0 "Scotlands Conference"
 scotland.4.d:0 "Good Morning and Welcome back to the Edinburgh International Conference Center. The air here is palpable as today, we are seeing what our government and nation will look like in the future. Behind me you can see High Priestess Juniper Mackenzie blessing the crowd and praying to her gods for a return to clan rule. While deeper in the city, socialists are calming down from a night of rioting which left 32 injured. While he has not been seen, Alex Salmond of the Alba party has been quoted saying that he hopes for republicanism to triumph.”"
 scotland.4.o1:0 "Republicanism Triumphs"
 scotland.4.o2:0 "The Monarchs Reign once again"
 scotland.4.o3:0 "Socialism is Embraced"
 scotland.4.o4:0 "The Druids get their Way"
 scotland.5.t:0 "The Council Of Clans"
 scotland.5.d:0 "“People of Scotland. It is time we return to the old ways of our people. The Modern world has failed us, democracy has failed us! But we must not turn ourselves towards the evils of communism. Before the Romans invaded Britannia, we Scots were known as Picts, we lived in clans and in harmony with the Earth.” These words were spoken by High Priestess Juniper Mackenzie when she heard of the Druidist victory in the Constitutional Convention. The High Priestess has been invited into the Provisional Government and is expected to help the transformation of Scotland."
 scotland.5.o1:0 "Return To The Old Ways"
 scotland.6.t:0 "Return Of The Monarch"
 scotland.6.d:0 "“Good morning and Welcome back to Scottish one. Here at Endinburgh International airport, thousands have gathered to await the return of the royal family. Franz Von Bayern, former duke of Bavaria, and his granddaughter Princess Marie Caroline of Lichenstein will arrive in an hour or so, with both to be considered candidates for Monarch by the Provisional Council."
 scotland.6.o1:0 "Here Comes The Monarchy"
 scotland.7.t:0 "Republicanism Wins"
 scotland.7.d:0 "Good Evening and Welcome to Scottish One. In Edinburgh, the parties are expected to last throughout the night as the convention announced Scotlands transition into a democratic state. While deliberations on the government continue, many can’t wait to finally participate In a government run by their own."
 scotland.7.o1:0 "Here Comes Democracy"
 scotland.8.t:0 "Forming The Scottish Parliament"
 scotland.8.d:0 "Good Evening and Welcome to Scottish One. After forming the Parliament, swift and special elections took place across the country. While some results are being contested and recounted, here are the following results.\n\nAlba party took 250 seats\n\nSNP took 320 seats\n\nLibertarians took 100 seats\n\nScottish Christianity took 40 seats\n\nGreens took 48 seats\n\nLabour took 120\n\nAnd the Socialists took a total of 12 seats.\n\nComing up later in the news, Steven Moffat of Doctor Who fame has officially moved the project to Scotland. Who will play the new doctor? Our bets are on James McAvoy."
 scotland.8.o1:0 "Democracy Charge Of Scotland"
 scotland.9.t:0 "Senate Election"
 scotland.9.d:0 "Good evening and welcome to Scottish one. In todays news, Theodore Kaczynski, aka the Green Lantern of Cascadia has finally made his first public appearance in over a decade since the Portland University Bombings. In other news, election results for the senate are in and surprisingly, a coalition of Greens and Alba took the house by storm and now control a majority. While this is no surprise, many wonder what will happen if Alba doesn’t take the presidency come election season."
 scotland.9.o1:0 "The Coalition Of Parties Begins"
 scotland.10.t:0 "Party Primaries"
 scotland.10.d:0 "Good evening and welcome to a special live edition of Scotland one. Outside of the Glasgow convention center, the people are beyond ecstatic as Alex Salmond has been declared the leader of the Alba party. While earlier in the year, the Alba party gained major seats in the Parliament and Senate, this is still a shock to see a well-known man throw his hat into the ring successfully.\n\nAcross the country, I’m being told that Father Hargreaves has declared himself leader of the Scottish Christian party, and the Green party has made a surprise move by declaring two people to be their leaders."
 scotland.10.o1:0 "The Man Of Three Wins"
 scotland.11.t:0 "Communism Wins"
 scotland.11.d:0 "Good evening and welcome to Scotland one. In a surprise turn, the convention today announced that Scotland shall slowly transform itself into a socialist state and join the Warsaw pact. While many democratic nominees in the country are protesting this, there’s no stopping the red wave sweeping across the nation."
 scotland.11.o1:0 "The Red Flag Waves Over Scotland"
 scotland.12.t:0 "Richard Takes Control"
 scotland.12.d:0 "Good Evening and welcome to Red Scotland. In todays major news, our transition to Socialism is finally complete as Richard Leonard disbanded the Provisional Council and declared himself chairman of the Scottish country. While democrats keep protesting, Leonards reign seems to have begun without anyone daring to challenge the man.\n\nComing up later in the night, we interview American Noam Chomsky."
 scotland.12.o1:0 "Protesting For What?"
 scotland.13.t:0 "Scottish Movies Makes A Return"
 scotland.13.d:0 "Good evening and welcome to Scottish one. In todays major two pieces of news, Gordon Ramsay has advanced his political career even more today as he won a seat within the Scottish Senate. Along with that, famous American company Lionsgate has relocated itself to Scotland. With this major move, Scotland now technically owns the rights to such franchises like Rambo, Dirty Dancing, and much more. Will we see a revival of these franchises, it remains much to be seen."
 scotland.13.o1:0 "We Welcome Lionsgate"
 scotland.14.t:0 "The Return Of The Big Movies"
 scotland.14.d:0 "Good Evening and welcome to Entertainment Scotland. In todays major news, James Bond will return to the silver screen but this time portrayed by a Scott. Fans of the franchise are beyond ecstatic as you can imagine with many speculating who will play this new titular character with many wondering if Ewan McGregor will be selected.\n\nIn other news, Doctor Who, played by James McAvoy has shot to sky high ratings here and abroad with many people begging him to sign for another season of the series.\n\nLastly, Craig Ferguson has announced he will be the main villain in Lionsgate’s Spiderman franchise."
 scotland.14.o1:0 "This Is A Welcome"
 scotland.15.t:0 "The Peoples Princess"
 scotland.15.d:0 "Good Evening and Welcome to Scotland One. In todays historic news, Princess Marie Caroline has been elected Monarch of Scotland. Once again, Scotland has a figure to lead us into the world until death. Already, the youth of our country are celebrating in the streets, as we’ve shown we’re above the world and really mean it when we discuss equality. The Princess whose begun the move into Edinburgh palace has reportedly been hoping for a role like this since birth, with herself reportedly identifying with the Scottish over her Germanic family.\n\nComing up later in the news, James McAvoy discusses what its like to play to James Bond."
 scotland.15.o1:0 "The Princess Takes Over"
 scotland.16.t:0 "The Prime Minister Election"
 scotland.16.d:0 "“Good Morning and Welcome to Scotland One. Since the ascension of now Queen Marie Caroline, the people have been able to secure Scotland's independence, but also their own. In a complete emulation of the old English monarchy, the Queen has announced she will allow elections for a Prime Minister who will be a resident of her Court.”\n\n“For the left side of Politics, many have chosen Nicola Sturgeons as their representative. This is a woman whose publicly supported the ideas of  LGBTQ equality, transgender rights, and immigration rights. Being described as a Scottish Ghandi of sorts, Ms. Sturgeons believes Scotland's future lays in multiculturalism and diversity of ideas. She has been challenged by many who claim her policies will only lead Scotland into a decline”\n\n“On the Right side of Politics, Alex Salmond has been chosen to represent the people. Salmond, who is a self-described conservative nationalist has made his platform clear, “Scotland First”. By laying out his policies of economic tariffs, harsh immigration policies, and populist rhetoric, he has soared in the polls with about 45% of likely voters aiming towards Salmond”\n\n“On the last side, with only 2% in the polls are the Greens. Patrick Harvie and Lorna Slater aim to make Her majesty's reign a “Green Reign”. God that name sounds bad already. Both want to enact radical environmental legislation, but cant answer a question regarding how it would be paid for. Who knows, these two make history yet.”"
 scotland.16.o1:0 "Who Will Take Leadership?"
 scotland.17.t:0 "A German And Scottish Marriage"
 scotland.17.d:0 "“Good Morning and welcome to a special broadcast of Scottish One. Queen Marie Caroline Stuart I will marry the German kaiser in exile “Prince Georg Friedrich” of House Hohenzollern at St.Giles Cathedral today. In what is described to be a new alliance of Germans and Scots, the two will work together to bring help to refugees fleeing communist countries and work to bring peace about in France.\n\n“While many at home cheer for the Queen, and their new King, many at home are discontent with the Queens choice to repeat history. Instead they wish she would’ve married a true blooded Scotsman. Nevertheless, we here are happy for our Queen and wish their marriage the best. Stay tuned for the next four hours of coverage”"
 scotland.17.o1:0 "Scotland Welcomes The New Relations"
 scotland.18.t:0 "An Interview With A Youth Jacobite Member"
 scotland.18.d:0 "“Good morning and welcome to Scotland one. In our studio today is a very special person, young James Clark, a Jacobite Youth member out of Glasgow.”\n\n“Nah James, what is it like being a part of the Youth? Are you made fun of in school?”\n\n“To answer your second question first, no I am not made fun of, in fact many of my fellow classmates appreciate the services I for the community. But being part of the Jacobite youth is an experience I’d recommend for every kid in the country. We work to better our community through not only hard work but Christ. And before you ask, not all of us in my local group are catholic, some of the kids are Jews or Muslims.”\n\n“Well young James, what is your opinion on the Queen and her new Husband?”\n\n“First of all, I love the Queen. She’s gotten me involved in so many charities that I never knew existed. As for her husband, I’d love the chance to welcome him to Scotland myself.”\n\n“I just have one more question for you lad, are you planning a political career? Because I’d vote for you.”\n\n“I wont give anything away but, just wait until 2043”"
 scotland.18.o1:0 "The Youth Embrace Monarchy"
 scotland.19.t:0 "A Weekly Interview"
 scotland.19.d:0 "“Mrs King, It is so nice to meet you”\n\n“Likewise your majesty, but personally between you and I... I prefer Larry. Mr King was my father.”\n\nA Slight chuckle between the two”\n\n“So personally I have to ask, What is it like being the Monarch of a new nation? I mean you grew up in exile, have been denied entry to your homelands in Bavaria, and now you end up Queen of a land which your ancestors left several generations ago.”\n\n“Larry...I won’t pretend to have had a hard life. Growing up in Spain and Canada I still had my families fortune while many around me suffered in poverty. But, since becoming Queen I’ve made it my mission to end the poverty experienced by many. Once Scotland is back on its feet, I am to expand economic aid to other countries in need, particularly the Americas.”\n\n“Now..now thats interesting. You’re saying you want to help the American peoples? How would you make sure aid is getting to the communities in need. In France, the government has made sure the people are aided, but how can you be sure someone like Richard Spencer would give aid to his own people?”\n\n“The simple answer, I can’t make sure. And I want the people to know, the I do not possess infinite knowledge regarding these matters but I aim to help nevertheless.”\n\n“Now what about your recent anti-communist speaches. Do you believe you’re putting a target on your head?”\n\n“Oh without a doubt. The communist regimes across the channel are vessels of tyranny who exploit the suffering of their people and claim to call it equality. Speaking with refugees from France, Germany, and recently Poland, I’ve come to understand what true suffering can be. Larry.these peoples are being persecuted regularly for their faiths, ideas, and more. Just last week alone, 2500 Jews have come into Scotland seeking religious asylum!”"
 scotland.19.o1:0 "The Weekly Interview"
 scotland.20.t:0 "Visitng The Airfields"
 scotland.20.d:0 "“Good morning and Welcome to Scotland One. In todays news, Gordon Ramsay announces his return to cooking, signaling the final straw in his abandoned political career. James McAvoy kills it as the new Bond, with 007-Spectre grossing 142 million worldwide. And finally our Queen, Marie Caroline Stuart I visited the Perth Air yards today.”\n\n“In a show of support to the Air Force, Her majesty visited and talked with soldiers who helped French refugees reach the shores of Scotland. Thanking them for their service, she gave a salute to the soldiers and asked for none in return because she according to herself is “A woman who will never experience the frontlines. While you fight, I will live in a castle.”"
 scotland.20.o1:0 "We Salute Our Soldiers"
 scotland.21.t:0 "Sturgeons Speech To Voters"
 scotland.21.d:0 "“Scotland! Our time has come to rise from the ashes. Yet we must not fall to the old ways of our forefathers. Gone are the days of a patriarchal society, when now we have a chance to be a true democratic nation.Women will leave the household for jobs they never considered having before. We will not venture into hostilities with our neighbors like we have before, instead we will welcome anyone into our nation with open arms.”\n\n“The oppressed communities of Scotland have voted me in to be their leader. I am no savior but I am here to ensure the safety of religious minorities, women, gays, and more. Whoever you may be, I am here to help.”"
 scotland.21.o1:0 "Thank You Scotland"
 scotland.22.t:0 "Welcome The Refugees"
 scotland.22.d:0 "Heinrich Zimmer was never a well to do man. In fact, living in Bavaria he was among the poorest in his neighborhood. At a young age he joined the Youth Stasi in an effort to somewhat help his family, although when his “Capitalistic” motivations were discovered Heinrich would be placed in jail.\n\nIt would not be until his 21st birthday in jail that a riot would break out and he would be freed in what would be dubbed “The European Spring”. From here he reunited himself with his family and made a large journey north to the riotous city of Wilhelmshaven. He’d pay a kings salary to be smuggled out, to where he did not know.\n\nWhen Scotland announced a welcoming refugee policy, Heinrich got his wish of leaving Germany. Although, the voyage was not an easy one. Leaving that bay of the city, his little fishing boat was fired upon by the German airforce, and if not them it was the English navy. But little over two weeks later, he’d make to a port on the coast of Scotland where he and his family were welcomed by the SNP members."
 scotland.22.o1:0 "You Are Safe Here"
 scotland.23.t:0 "Salmonds Victory Speech"
 scotland.23.d:0 "“We’ve bloody done it! Our lands are free from the tyranny of the English peoples. It’s time our country was ruled by a Scot who will place his lands first. Together I and deputy Prime Minister Meechan aim to not only restore Scotland to her pre-English glory but to fully separate our identity from the English bastards.”\n\n“Our goals are true to the people who voted us in. For too long, our people have been second class citizens in the “Equal union” proposed to us by the English. They’ve taken our lands, raped our women, and destroyed our environment! No longer shall that happen. Men, women and children of Scotland will grow up in a country not learning about the English tyrants but those of whom Scotland savors. They’ll idolize people like William Wallace, they’ll celebrate the Beltane, and most importantly, they’ll treasure their goddamn culture. If Scotland falls again, we will not go quietly into the night, this time we shall go down fighting!”"
 scotland.23.o1:0 "We Are Free My Brothers"
 scotland.24.t:0 "Hargreaves Victory"
 scotland.24.d:0 "“Blessed be we who are his children. For we are the lamb of Christ and subservient to his will. The Lord has spoken through I, his humble vessel and declared that Scotland shall be a refuge for those who are persecuted because of their faith in Christ. The Lord has declared that we shall drastically change the country, we shall remove the liberal influence from our schools and replace teachers with members of the clergy. We shall cleanse Scotland through our own crusade if you will.”"
 scotland.24.o1:0 "Bless Be Our God"
 scotland.25.t:0 "The Results Are In"
 scotland.25.d:0 "Its time to finally see who has been chosen to be the first democratic leader of Scotland"
 scotland.25.o1:0 "Here We Go Scotland"
 scotland.26.t:0 "The Scottish Coronation"
 scotland.26.d:0 "Our king has finally been crowned king of scotland and we cannot wait for our future."
 scotland.26.o1:0 "Here We Go Scotland"
 scotland.27.t:0 "The Scottish Clan Path"
 scotland.27.d:0 "We have decided to go back to our old celtic roots and ensure that scotland lives on forever in a equal fair society which our ancestors will be proud of."
 scotland.27.o1:0 "Here We Go Scotland"
 scotland.28.t:0 "Scotland Joins The Democratic League"
 scotland.28.d:0 "Scotland has decided its better and safer joining the Democratic League and ensure that scotland joins a powerful strong alliance which can protect against soviet and communist trouble."
 scotland.28.o1:0 "Scotland The Brave"
 scotland.29.t:0 "Scotland Rebuilds The United Kingdom"
 scotland.29.d:0 "Since taking England and removing the Phoenix Front from power, Scoland has now decided it is now time to bring the old back and finally restore the united kingdom with the old union jack to be displayed."
 scotland.29.o1:0 "Scotland Restores Order"
 scotland.30.t:0 "Scotland Creates Its Kingdom"
 scotland.30.d:0 "Since annexing England and taking complete control of the nation the scots have now decided its time for them to rule over the isle. For hundreds of years the Scottish nation has been under control from England. Now this can change and the English will finally see what it is like to be controlled over a false flag."
 scotland.30.o1:0 "Scotland Takes The Isle"
 scotland.31.t:0 "Scotland Joins The EU"
 scotland.31.d:0 "Scotland will join the European Union and unite the British Isle with our European friends. The countries united will work together to make Europe the powerhouse of the global and push countries like Canada and Australia away showing the rest of the world that Europe united is truly a beast to be feared."
 scotland.31.o1:0 "Welcome To A New Friendship"
 scotland.32.t:0 "James McAvoy plays James Bond"
 scotland.32.d:0 "Following the fall of the United Kingdom and the subsequent copyrights it carried, many in Scotland have been looking for entertainment made by Scots. With the re-opening of Lionsgate films in Edinburgh, fans have gotten what they want in the form of James Bond- Quantum of Gold, with the titular James Bond being played by Scottish born actor James McAvoy.\n\nBeing the first bond film to not be based off a book, this title will see McAvoy and others track down the elusive Goldfinger who has mysteriously surfaced once again.Quantum of Gold will be in all theatres starting December 22nd."
 scotland.32.o1:0 "Welcome Back Mr Bond"
 scotland.33.t:0 "Coventry agents raid a pornography ring"
 scotland.33.d:0 "Following a successful tip, Coventry agents raided a pornography ring in the southside of Dumfries. Led by Oliver Queen a former Jewish Billionaire, the rings distributors, “actors” and buyers have been arrested and are due to be hung within the next week. This immoral and sinful ring is no doubt only one of many but with more true devotees of Father Hargreaves joining the Coventry day by day, our nation will soon be rid of sinful filth which has rotted our nation."
 scotland.33.o1:0 "Remove The Disgusting Rats"
 scotland.34.t:0 "Soviet Agent defects to Scotland"
 scotland.34.d:0 "Soviet NKVD agent Mikhail Morevsky has publicly defected to Scottish Republic. While he was placed here to spy on the military of Scotland, Morevsky apparently fell in love with the country itself. Going under the fake name of “Johnathan Taggert”, Morevsky apparently lived in Scotland since our independence was gained. Being granted provisional citizenship under the PM, he is expected to brief our military and allies on other operations being carried out by the Soviets."
 scotland.34.o1:0 "Welcome To Our Nation Mr Morevsky"
 scotland.35.t:0 "Highlander Whiskey plant explosion"
 scotland.35.d:0 "Claiming the lives of 18 workers and injuring around 60 bystanders the famous “Highlander Whiskey” plant located just outside of Wick exploded due to an malfunction in one of the machines. While the malfunction was detected and most of its 200 workers were evacuated, several stayed behind in an attempt to rectify the malfunction. From there, a fire had spread and reached the storage area in the basement where upwards of 100 barrels filled with highly flammable alcohol exploded."
 scotland.35.o1:0 "Oh Dear God"
 scotland.36.t:0 "Toei anime studios opens up an office in Melrose"
 scotland.36.d:0 "Japanese anime producer, Toei films has opened its first animation studio in Melrose. The producer which is known for famous properties like Dragonball z and one piece has announced that they intend to diversify their company by opening up an office in Scotland. Already projects like a new Dragonball Z are being worked on by a team of Scotlands best and brightest animators."
 scotland.36.o1:0 "This Will Be Interesting"
 scotland.37.t:0 "A New Name For Scotland"
 scotland.37.d:0 "Franz Von Bayern is not a Scottish sounding name, which alienates alienates a majority of the population. Most view him as German instead of Scottish. To rectify this Franz Von Bayern has rechristened himself James Stuart III."
 scotland.37.o1:0 "Our Great King Adopts Scotland"
 scotland.38.t:0 "Exiled Royals find home in Scotland"
 scotland.38.d:0 "For too long, the Royal families of Europe have been separated from the European continent. With the Declaration from King Stuart III and his royal council, many like the Bourbons, the Bonapartes, the Glucksburgs, and even the Romanovs will be welcomed into Scotland with open arms."
 scotland.38.o1:0 "Welcome To Scotland Our Royal Friends"
 scotland.39.t:0 "The Ascension of James IV"
 scotland.39.d:0 "James IV has ascended the Scottish throne after his father James III passed away in his sleep. While he is young in terms of a monarch, many look to his rule with hope and wonder. Already the Council of Exiled royals has endorsed his rule, and many are wondering if he’ll be the man to return sanity to a communist Europe."
 scotland.39.o1:0 "Lets see what the future brings"
 scotland.40.t:0 "The Royal Coronation"
 scotland.40.d:0 "As James IV had the crown placed on his head, the history of the nation would change forever. Taking notes from his father, James IV vowed to protect Scotland to the last man. For no longer would Scotland come under the rule of tyrannical foreigners, and no longer would its resources be siphoned out."
 scotland.40.o1:0 "The King Of Scotland!"






#wales##
 wales.1.t:0 "The Welsh Guard Stands Ready"
 wales.1.d:0 "The day has finally arrived, Wales is free and can choose their course of history! Many of the Welsh people celebrated through the night celebrating their new independence and no longer pushed under an iron fist by the Phoenix Front.\n\nMeanwhile Orders have been given for the Welsh Guards to stand on the English borders ready for any reprisal attacks from England. Many believe the attacks will not arrived but Wales stands ready."
 wales.1.o1:0 "Welcome To The State Of Wales"
 wales.2.t:0 "The Nation Is Isolated"
 wales.2.d:0 "After the independence victory it has been agreed that Wales will continue its isolated policy to ensure the nation is able to rebuild its army and remove all Phoenix influence in the country. Already many thousands have been out celebrating the Welsh independence with many nightclubs and bars back open again playing music which was once banned by the phoenix front."
 wales.2.o1:0 "Wales Stands Ready"
 wales.3.t:0 "Send Em Over"
 wales.3.d:0 "“Hello and welcome to WalesOne, Today Wales has launched drones over the borders of England as retaliation against the Phoenix Front as the fascist one-party state tries to watch as our newly formed nation continues with restoring democracy. Our security agency believe attacks will not go ahead but our nation stands ready!”\n\n”In Other News the free state of Scotland has started to resume independent films and new block busters from the American states will soon start arriving here in Wales thanks to our Scottish friends allowing us to use their cable network.”"
 wales.3.o1:0 "Defence And Technology Will Win"
 wales.4.t:0 "WAR WITH ENGLAND!"
 wales.4.d:0 "“Hello and welcome to WalesOne, Today Wales has started its movement towards the English border against the Phoenix front, already many towns and villages on both sides of the border have been abandoned as armies move in and airstrikes rain down on the border. Many suspect this will be a long war which many will unfortunately be killed due to the cold and dark demands of the Phoenix Front to take Wales. Already cities such as Bristol and Gloucester have been taken by the Welsh army as the unprepared troops were not ready for such a quick grab of the areas.”"
 wales.4.o1:0 "Wales Moves In"
 wales.5.t:0 "Welsh Government"
 wales.5.d:0 "As the new government was formed and MPs of the Welsh nation took their seats, the new prime minister of Wales, Dafydd Elis-Thomas welcomed the MPs back to the house of democracy. He outlined a full 50-page document about the new laws and regulations that will be implemented by the new government which will be put into law the next few days. As the session ended MPs cheered as freedom and democracy had returned ready for the next parliament session the following week with the first debates to take place."
 wales.5.o1:0 "Democracy Comes To Wales"
 wales.6.t:0 "Welsh Power"
 wales.6.d:0 "As homes no longer have to limit how much electricity they are now using and factories can now start running 24 hours a day, 7 days a week Wales can now completely be self sufficient with their power grid. As clubs, pubs and restaurants can now stay open late and long the nation seems to be more ready to compete against England."
 wales.6.o1:0 "Who Needs Power Sharing"
 wales.7.t:0 "The Bill Of Rights"
 wales.7.d:0 "The bill of rights has been introduced by the Welsh government as a way of paving the way for equal rights and freedoms to all people who reside in Wales. This new bill will ensure all people of the state are treated the same no matter race, gender, or religion as well as a way of showing a big middle figure to the Phoenix establishment."
 wales.7.o1:0 "Equality To All In Wales"
 wales.8.t:0 "The Bill Of Rights"
 wales.8.d:0 "The PM of Wales has met with leaders from Scotland and Ireland to discuss plans of a possible future alliance between the three nations. Due to their history and shared heritage an alliance and military pact seems highly likely.\n\nAfter the three day meeting it has been agreed that the three nations will work together for trade and building their economy. They have also talked about shared military intelligence as well as preparing for any attack by the English."
 wales.8.o1:0 "Equality To All In Wales"
 wales.9.t:0 "The First Welsh Election"
 wales.9.d:0 "The Welsh PM has ordered for the country to prepare for fresh elections. As the nation is now in a stable place and is now ready for new leadership to take over if the people wish for it then they now have the chance. With the army rebuilt, industry thriving and the people finally free, democracy can finally now enter the peoples voting slips and choose the party they want to control over the Welsh nation."
 wales.9.o1:0 "The People Await To Vote"



##France##
 france.1.t:0 "The 2010 changes"
 france.1.d:0 "As we arrive in the year 2010,  we begin to enter the next decade. How will this next decade unfold? France isn’t in great shape to say the least and with the past 20 years of leadership keeping false promises and then falling, pushing France more and more in decline. Now is the time to change our socialist state. This day will be when the French State makes history..its just a choice of which direction we want to make this history.."
 france.1.o1:0 "Let’s hope this works"
 france.2.t:0 "The France Fix"
 france.2.d:0 "Melenchon is leader of the state and now he will begin to plan out his reforms for the state, how he will improve life in France and what he will do to get the party on his side so they can accept the new reforms. There are several hurdles that he needs to overcome but also remember that France is still hanging by a thread and is very close to total collapse. Once the state and the party accept him and his reforms then the work can begin to fix France and make it a proud strong member in the Warsaw Pact."
 france.2.o1:0 "The state must understand"
 france.3.t:0 "Replacing members of the politburo."
 france.3.d:0 "With Melenchon now in control of the state its time to also make changes within the party. We must remove the old-style communists who only wish to cling onto power and allow France to keep falling. Now is the time for the people to really have leaders who will stand up for them and no longer allow the elite class of this state to take advantage of the people.\n\nAs the news broke that members of the politburo have resigned, Melenchon appeared on television across France telling the French workers that change has arrived and now they will finally have the strong leadership they need. The members who have resigned did so with their hearts for France and the people and now the party can really get to work on the France Fix."
 france.3.o1:0 "The healing begins"
 france.4.t:0 "Choosing New Advisors"
 france.4.d:0 "France needs to be fixed; the problem is how do we fix the state?"\n\nAfter a brief meeting, the party agreed it was time to choose new advisors for the state and show the party what really needs to change in France. A new department will be created, and each advisor will be tasked with finding out the problems occurring in France and what will need to be done to fix the civil unrest.\n\nThere have been many attempts to fix the ongoing problems in the country but all have failed, at least this attempt will be a lot more different to what has happened in the past and those tasked to find out the issues in France can report back to the party and this is when the change in France can begin."
 france.4.o1:0 "Maybe this will fix everything"
 france.5.t:0 "Public Spending Advisor"
 france.5.d:0 "Spending has gotten out of control, failed reforms in the past and money poured into the wrong areas of France has left the country inflated, depressed and most of all the public sectors don’t have the budget they need to operate. Melenchon has chosen which the best member suited for this task to investigate the issues and where the money is going, how much is being spent on the state and how the party can fix this."
 france.5.o1:0 "Money talks just not always"
 france.6.t:0 "Advisor for Education"
 france.6.d:0 "Education is the heart of the nation, yet the previous leadership has blown it to the side to focus on other non-important subjects. Now is the time to heavily invest in the Education sector and make sure the people of the French state grow up in a better France as well as not just learning about the soviets and communism but also learning about the outside world and what happened to the collapse of the US. The young will no longer be spoon fed the communist ideals but will have a choice in what they want to learn."
 france.6.o1:0 "Education will help the people"
 france.7.t:0 "Work & Production Advisor"
 france.7.d:0 "The workers are the heart of our state, yet they are not represented, unions are no longer run for the people but only to strengthen the party. This has limited much of the people’s freedom at work and making sure they are safe for work. The advisor for work will ensure this will change and take a deep look into what measures will need to be changed so those workers can feel safe again at work and can also return to work to help the State return back to a productive strong country for the pact."
 france.7.o1:0 "Work is happiness"
 france.8.t:0 "State advisor"
 france.8.d:0 "We can finally acknowledge that there is a lot of work to be done to fix France and bring the people’s moral back. The advisor for the state activity will communicate with the people and what they want in France. Its not longer what the party feels is best but what will make the people work, learn and make the red flag shine again over the Eiffel Tower. The advisor will report all civil unrest,  distrust in the party and what the state needs to do for the people. The hammer and sickle are an important icon for us, and we must make sure the people of our country, our state also agree with us." 
 france.8.o1:0 "Do you hear the people?"
 france.9.t:0 "Votes On Reforms"
 france.9.d:0 "The plans for reforms have been set and drafted, advisors have been selected and chosen how they will be able to fix the state. Now all that remains is voting for these reforms and allowing non party members to be accepted as advisors and change the face of the French state. This will not be an easy task but we can now present the plans to the party and we can hope they will accept these reforms and then we can start the change of the France and improving everyone’s lives."
 france.9.o1:0 "Voting? In Communist France?"
 france.10.t:0 "The vote has passed!"
 france.10.d:0 "By god...Its finally happened....The party overwhelming voted to accept these new changes, the reforms will not only change France but make history as for the first time in decades the party has finally been united and are ready for the state to enter the 2010’s economically stable, strong and better. With these new changes will be the envy of Europe and the pact.\n\nThe news has been published in the state newspaper, widely talked about on state television and now the people celebrate as finally they will feel like they now have a voice and someone who can represent them!"
 france.10.o1:0 "A sun rises in France"
 france.11.t:0 "Melenchon Begins His Reforms"
 france.11.d:0 "Now the vote has passed overwhelmingly Melenchon can start his great reforms to change France. Many legislations are going to be passed by the highest party order and laws will be changed, the face of education, state work and many other activities in France will massively change. This will not be an easy progress, but everything takes time and this certainly will fix many social and economic issues that have risen greatly within France.\n\nThe people are ready to accept these new changes, the party and state has also accepted this now all that remains is the adjustment of such great changes and how the pact will react to such a change." 
 france.11.o1:0 "Its time for the state to change"
 france.12.t:0 "The Votes Fail"
 france.12.d:0 "Oh no... this isn’t good... What happens now?\n\nThe vote was cast, and the party members refused to accept these reforms, we were told it was going to be a long and hard progress, but we need change doesn’t the party recognise this?  We must fix this quickly; the people of France grow restless and so do we. Its time to bring stability to the state and make the party understand that there isn’t any other way to do this."
 france.12.o1:0 "This was not expected..."
 france.13.t:0 "Deadlock"
 france.13.d:0 "The situation is dire, our socialistic republic can not survive in its current state. Their needs to be some form of reformation in our society if we are to survive and if the proletariat are to survive. To do this, we must go to the Politburo once again, and convince various factions to support our reforms."
 france.13.o1:0 "We must fix this now!!"
 france.14.t:0 "Persuade The Party"
 france.14.d:0 "There is only one way to approach this and that is to speak to the party directly and how we can fix this mess. The changes are not the true communist way, but neither was the collapse of France and both need to be fixed and changed. Once these changes have occurred and France can begin to heal, and the way of normal life returns to the French people THEN we can return back to our socialist system and be a proud nation once again…But until then we must persuade the party this is the only way and they must accept this." 
 france.14.o1:0 "Direct Action"
 france.15.t:0 "Talk With The Hardliners"
 france.15.d:0 "We have a chance to convince the hard-line communists to accept our reforms and changes, they have allowed us to sit down with them and talk about what reforms we want to enact on the State. It turns out they disapprove of a lot of these changes but there are some they will allow for a time being until the state improves. We may not be able to push through all the reforms we want but any type of change is good if we can get their support for another vote on reforms?" 
 france.15.o1:0 "Damn Stalinists"
 france.16.t:0 "Convince The Socialists"
 france.16.d:0 "The revolutionary socialists do accept our reforms, but they also want to make sure that those reforms we want to establish in the state benefit everyone not just the rich. Once we can convince them then more of those socialists can support our reforms and vote for this. They are not strong believers in the communist movement and do support some types of freedom for the people therefore it will be a lot easier for them to join us and accept the new terms we will introduce to the politburo and make the French State renewed and ready for the change."
 france.16.o1:0 "The Socialists Are Correct"
 france.17.t:0 "The Modified Reform Act"
 france.17.d:0 "A deal has been made! Although we may not be able to implement all of our reforms, we can focus on the main civil issues that are on-going in France and how we can combat this. At least now the party is united, and we can finally get to work on rebuilding France and making this communist state the strongest in the pact.\n\nAt 12 o’clock midnight the reform act began, many laws that are in place were shredded and burnt, policies have been changed and the people can begin to slowly breath as they feel small limits on freedom. Its not a lot BUT its something different to their daily life and that can just be the beginning..."
 france.17.o1:0 "Even a small change can make a difference"
 france.18.t:0 "Melenchon Reforms"
 france.18.d:0 "Melenchon’s reforms have successfully passed after a brief vote from the Politburo. These reforms have been criticized as going against the communist way of life that France has adapted too yet Melenchon and his associates are staunch in their stance, believing that these reforms will benefit every citizen of France.\n\nNow begins to new state, lets make France into the glorious communist nation it should be." 
 france.18.o1:0 "A new way of life begins"
 france.19.t:0 "Inflation"
 france.19.d:0 "Inflation is one of the major problems plaguing the French people, our currency has been devalued to practically nothing and Melenchon’s reforms plan to address this. There are many solutions to this problem in which we can cut state spending, one prevalent idea is the adoption of the European Euro. There are many who would adopt the Euro but there are also those who would not, maybe we could return to this question and see if its worth risking a new currency? \n\nFor now we will cut spending on giving away much to the pact and focus more on investment from the soviet union and other communist countries."
 france.19.o1:0 "Whats a euro to a franc?"
 france.20.t:0 "Unite The PCF"
 france.20.d:0 "We have finally united the party with the whole of the politburo, the different communist groups and revolutionary socialists have agreed to work together in uniting the whole of France for a new era of socialism and peace. Together we can build a new state, a better state one which encourages those to rise up and speak their mind…just not too much we cant give the people too much of a voice.." 
 france.20.o1:0 "Be careful on what is said here.."
 france.21.t:0 "Speak To The Politburo"
 france.21.d:0 "France is starting to already feel the reforms enter the system, the people are beginning to awaken to a new France, new reforms are allowing the people to slowly start to speak more loudly and feel better about their lives. Melenchon is starting to see a small wave of support towards him and becoming the saviour of France. Today France starts new. \n\nMeanwhile at the politburo many who have apposed Melenchon have agreed that his reforms were needed, and they are slowly starting to adopt his new leadership of the state. He has spoken loud to the politburo and now everyone is listening. One more speech was given to the party talking about the reforms and new spirit that will sweep through France." 
 france.21.o1:0 "The Pact is noticing"
 france.22.t:0 "The 2010 reforms"
 france.22.d:0 "The 2010 reforms have proven to be the most controversial but effective reforms in French History. Not only has the quality of life for the average French citizen improved massively, but the economic depression that has effected the French people for years is now showing signs of ending." 
 france.22.o1:0 "History starts now"
 france.23.t:0 "Limited western influence"
 france.23.d:0 "The country has followed the Soviet Unions way of life for quite a long time, and look where it got the French People. Perhaps it is time we open ourselves to the western world once again, perhaps we can allow the UK and Canada to influence some of our ideals" 
 france.23.o1:0 "Just a small leak not too much.."
 france.24.t:0 "New Standards Of Living"
 france.24.d:0 "France is changing slowly but quickly the people are noticing the change and the reforms are changing peoples lives and now its time to make the standards of living better and more equal for everyone. Melenchon has spoken to the people, listened to what they want and now he’s bringing in the big guns. \n\nThis new reform will allow the people of France to decorate their homes the way they want. Remove the awful portraits of Lenin and other communist leaders from their homes, no more police checking to see how much of follower they are. As well as that the people are now able to benefit from a stronger welfare system with the transport system now cheaper to use as well as more state services!"
 france.24.o1:0 "This will change things massively"
 france.25.t:0 "Fixing Taxation"
 france.25.d:0 "Taxes have been raised in the past to try and fix the economy…It failed…and even worse it made the standards of living drop even more. Therefore, starting from today taxes are going to be cut and alterations will be made to create a stronger income for the state. Those who have paid more than they should be receive benefits from the state for their generous payments to the people and recognised."
 france.25.o1:0 "But where will the money come from..?"
 france.26.t:0 "Safeguard The Status-Quo"
 france.26.d:0 "Although these reforms have been beneficial for the French People, critics in the other countries that make up the Warsaw Pact are worried that France has fallen to the evil that is Democracy and Capitalism. We must assure them that we are still a communist country. Therefore, many ideals of Communism has been instituted into the reforms. We will ensure the way of Lenin is still recognised and our state still has strong ties with the Soviet Unions, The GDR and other communist nations." 
 france.26.o1:0 "We are still communist!"
 france.27.t:0 "Unlock Frances Potential"
 france.27.d:0 "France is a strong country and was before the communist revolution. Its time to restore that confidence back into France. Bring in lots of work for the people of France and begin to show its true potential in the bloc. We the state and the people declare a new movement, we will make our nation strong and the people will work for the state and the party! " 
 france.27.o1:0 "The movement starts"
 france.28.t:0 "PCF liberal-wing"
 france.28.d:0 "We do live in a communist nation but that does not mean we do not have to obey the full old style communist way. \n\nThe new leadership has today announced that new small scale liberal reforms will be introduced to make a fairer free life for the people of France this will introduce policies such as, labor exchanges to help those find work, benefits for those who cannot work due to illness and more rights for workers. All adults will be allowed to switch jobs and train more rather than being forced into a certain job. There have also been some small-scale implementation such as more freedom on the internet and more freedom of speech." 
 france.28.o1:0 "We are still communist, Repeat."
 france.29.t:0 "Market Socialism"
 france.29.d:0 "To change the French way of life, we must change the face of our economic system. By liberalizing our economic market, we can let the French people have some degree of freedom, this includes letting them have partial ownership of their business and deciding how much their employees make. This will inevitably anger some of the more hardliner socialists." 
 france.29.o1:0 "Is this a good idea?"
 france.30.t:0 "The Basic Liberties"
 france.30.d:0 "The party has voted, civil liberties have now been introduced into the country, giving the people of France a chance to express their voices and thoughts, have more freedom to do and say what they wish. This legislation also allows the right to protest...Although clauses in the law system to imprison those who criticize the government."
 france.30.o1:0 "Interesting move.."
 france.31.t:0 "Appoint Economic Advisor"
 france.31.d:0 "Now we have the main reforms in place we have to make sure we do not overspend but also spend on what needs to be used on. We have a choice; we can take a chance and push through a liberal style of policy allowing the people to own their own business and improve work,  but it could be risky or we can follow the safe path ensuring our economy stays in the status quo but also no improvement to work or safety. The choice is the more liberal leaning Fabien Roussel or the more hard line communist André Gandillon"
 france.31.o1:0 "Time to make a choice"
 france.32.t:0 "Fabiens methods"
 france.32.d:0 "Fabien has been chosen to be the economic adviser to the state. He is a known liberal and supporter of our reforms and in this position of power, he can influence the economy on a far greater scale than imagined. With his more center leaning views, his choices and actions may make the people of France give a sigh of relief knwoing they will no longer have to worry about hard communist iron fists pushing down their throats." 
 france.32.o1:0 "A modern advisor for a modern age"
 france.33.t:0 "Fabiens liberal Fixes"
 france.33.d:0 "Now Fabien is leading the economic reforms, his liberal views will change the direction of the current affairs in France. He has a number of reforms that he would like to implement first before anything else. n/n/For example he will now cut taxes to those businesses which hire many of the people of france so the companies can grow, hire more and expand across the state, he has pledged more money into the modernisation of France. More budgets for town councils to revamp areas and more." 
 france.33.o1:0 "The first real step to fix France"
 france.34.t:0 "Law on cooperative"
 france.34.d:0 "The people of France can now legally own their own business, charge whatever price they wish for goods and make their own profits and keep their own money. This will surely improve the rate of living in France as well as begin to change the face of france for positivity. Already more businesses are being created and dead high streets are now starting to renew with life." 
 france.34.o1:0 "The first real big change to private life"
 france.35.t:0 "Worth ethic & inferior quality goods"
 france.35.d:0 "As the reforms begin including better job satisfactory, we must ensure that we can keep the workers of our state happy but also produce the best products in the pact. Therefore we will appoint union reps to work with the people and make sure the people are being treated fairly while also making sure they mass produce exactly what France needs as well as what the pact needs."
 france.35.o1:0 "Produce the best!"
 france.36.t:0 "Establish Modern better jobs"
 france.36.d:0 "We have reached the 2010’s, its time the communist bloc finally catches up to the rest of the world and begins to transition into a modern state with strong modern jobs fit for the future. Skills which will make our people strong and competitive to the rest of the world as well as the pact and put France back onto the word stage."
 france.36.o1:0 "A modern age for jobs!"
 france.37.t:0 "André Gandillo Methods"
 france.37.d:0 "André gandillo, the hardline communist has been chosen to become economic adviser to ensure France stays in the status quo and prevent the economy to slip again. His far left ideals will change France but make sure it stays within the Soviets ideals" 
 france.37.o1:0 "Hmm.."
 france.38.t:0 "André gandillon communist fix"
 france.38.d:0 "There are reforms that are needed but some reforms can only go so far without someone standing in the way and making sure the communist star still stands tall and prevents capitalism leaking into the state. André is a passionate communist who does believe in reforms but will also reform in his own views to fix the economy." 
 france.38.o1:0 "The careful reforms"
 france.39.t:0 "The China Fix"
 france.39.d:0 "Back in the 90’s China had a similar problem regarding a failed economy. They managed to fix this by working with the people and showing them if they follow the communist movement then they too can fix the red star. Its time to also follow this and give the French people the red flag boost so they can fix out stagnating economy" 
 france.39.o1:0 "Yeah but China...isnt so great?"
 france.40.t:0 "Revive the old movement"
 france.40.d:0 "Before the 2000’s France was the centrepiece of the Warsaw pact. Its communist revolution sparked the light for other nations to embrace the left-wing movement. Unfortunately, due to the collapse of the state, the movement is no longer in the workers hearts. We must restore that and show the workers who they are working for, the people and the state to revive the old and bring in the new" 
 france.40.o1:0 "Back in time to the "Good Old Days..""
 france.41.t:0 "Cutting labour laws"
 france.41.d:0 "We may have adopted some type of protection for workers, but we must make sure they do not impact the complete flow of work. Cutting labour laws in small areas will still somewhat protect the worker but also ensure the work production is also hitting its targets and mass producing for the state." 
 france.41.o1:0 "Who even needs unions?!"
 france.42.t:0 "The great leap forwards"
 france.42.d:0 "The reforms have been implemented. The state has slowly but surely begun to change and already peoples lives are starting to improve. The economy although slowly is beginning to pick up again. Now is the time to introduce “New France. We will increase the reforms by pushing them through the party again but this time, the new reforms will change the lives of everyone not just the worker or the poor." 
 france.42.o1:0 "Viva La France?"
 france.43.t:0 "The New France"
 france.43.d:0 "With the 2nd 2010 reform acts now passed through the politburo. We can now start to change the lives of everyone in France and challenge the rest of the Communist world that they too can accept changes within their own parties. Communist or not…"" 
 france.43.o1:0 "Are we pushing too far now?"
 france.44.t:0 "Introduction of profitability"
 france.44.d:0 ""Now the people of france can own their own business its time they now introduce how they share this, of course a lot of this still needs to go back to the state but they can now have a chance to take some of that well earned money and keep it for themselves." 
 france.44.o1:0 "People owning busineses??"
 france.45.t:0 "Enterprise profits"
 france.45.d:0 "Businesses owners deserve to keep their own money due to their hard work. We will therefore but cutting taxes on those who own their own business so long as they pay their workers a fair share back and promote the new communist outlook for their business. Under this new reform, the government will now give out business grants to help start-up new businesses and encourage those to invest in the strong socialist economy to build France back up." 
 france.45.o1:0 "Grants??"
 france.46.t:0 "Rewarding the worker"
 france.46.d:0 "The people of France can now own businesses and compete with other businesses in a fair way which still fits the communist ideals. It’s time the people were rewarded by different wages for different jobs as well as benefits for certain jobs as well as different tax prices they may have to pay back." 
 france.46.o1:0 "Market Socialism..?"
 france.47.t:0 "Expand operations"
 france.47.d:0 "Its time to expand the roll out of the reforms for workers, no longer are the labourers just going to be given help but now all the workers of France will be given some type of benefit to encourage their work. Starting from today operations will be spread out in France to encourge more of the people to work for the state!" 
 france.47.o1:0 "work is freedom" 
 france.48.t:0 "The Central Budget"
 france.48.d:0 "A new budget system will be implemented which will be based  on state ownership of the means of production, collective farming, and industrial manufacturing. The highly centralized  economic planning will allow a more control of state investment and prevent more unemployment in France." 
 france.48.o1:0 "Control Is Important"
 france.49.t:0 "Economic Mechanism"
 france.49.d:0 "Its time to draft and plan out the ways in which businesses can operate in the state. Giving them free rule on their business could be harmful to the socialist state therefore we can operate a mechanism which limits certain free markets due to allowing the people to buy and sell whatever they want in limits. " 
 france.49.o1:0 "Freedom For Businesses"
 france.50.t:0 "The Reforms Have Gone Too Far"
 france.50.d:0 "After the discovery of life not just outside of France but the pact it seems the world is vastly different to what state propaganda told us. Lies have been fed to us. Life is easier in the likes of Britain and Canada. \n\nThe people have noticed this and due to such drastic reforms, it seems that the people are now able to spread this message. The people are starting to realise their lives have been controlled by the party and now they want change. \n\nGroups have been formed and due to such changes in laws the police are not sure what is legal and what is not anymore. The groups are demanding more change and more freedom. Unfortunately, the party is not happy with this and must solve this quickly before anything else gets out of hand." 
 france.50.o1:0 "We have went to far" 
 france.51.t:0 "Limited Reforms"
 france.51.d:0 "Although we have struck a deal with the party and the politburo, we can only enact some limited reforms, these reforms will need to be carefully looked at, choose which ones would make the most impact on France and how it can recover. Then we must also make sure those reforms we choose will be agreed upon by the party otherwise we could end in another deadlock plunging  France into more chaos and problems." 
 france.51.o1:0 "Careful Times Are Ahead"
 france.52.t:0 "Red Education"
 france.52.d:0 "In the past year’s education has been focused on the Russian civil war and how Lenin lead the communists to victory as well as how the French state overcame capitalism and joined the strong Warsaw pact. Many of the people of France are brainwashed. Now is the time to stop this and accept we cannot force people into this. We will now teach the young about the rest of the world. How Britain was the last European country to prevent the fall to communism as well as how the democratic league has been able to overcome socialism." 
 france.52.o1:0 "This is good" 
 france.53.t:0 "Better Infrastructure"
 france.53.d:0 "20 years France’s infrastructure has stood still, not much modernization and very little investment into the countries schools, towns and transport system. This will now be updated, and more money will go into the modernization of France. The state will be transformed into the 2010’s socialist vision set out by our advisors." 
 france.53.o1:0 "2010 'Vision'"
 france.54.t:0 "New State Housing"
 france.54.d:0 "Part of the new reforms is to fix the housing bubble that has developed, only the rich can buy a house..yes, the rich in a communist country..therefore new reforms have been drafted which will create new state housing as well as modernizing the current state homes that are currently existing. One of the main changes the party wants to fix the homelessness problems and prevent increases in poverty." 
 france.54.o1:0 "Fix the homelessness" 
 france.55.t:0 "Increase Production"
 france.55.d:0 "The past few years have been hard for France, production of foods and goods aren’t strong, the country heavily depends on other communist countries in and around Europe to import their goods and the states exports are low. Now is the time to change that a strong movement to getting production back like reopening metal works factories and a push to bring the people back into labour working and farm work. Exporting the great wine France creates and more!" 
 france.55.o1:0 "Wine sounds good!"
 france.56.t:0 "Reformed State Media"
 france.56.d:0 "The one source of media that is broadcast to the people of France is what is authorized by the government. Yet still black markets appear giving out media to people on what really is happening on the outside world beyond the pact. No matter what actions we take the people will still turn to alternate ways. Now is the time we can change this and give the people some limited news. We can allow some other country news channels such as the BBC, CTV and some others." 
 france.56.o1:0 "New TV which"
 france.57.t:0 "Limits On Social Media"
 france.57.d:0 "Our communist nations work together when it comes to technology, we even allow a limited social network between our nations such as France, Germany, Poland and Italy to connect with each other. Unfortunately, this has also allowed hackers to breach and connect to the outside world. We can overcome this by a putting a limit on how much content can be allowed to leak inside the state by still allow the people to see what is happening outside of the state." 
 france.57.o1:0 "Freedom of speech in some way" 
 france.58.t:0 "Stealing technology"
 france.58.d:0 "For many years now the democratic nations of the world have been superior when it comes to technology, security and domestically. Their knowledge and passion for tech has grown more and more and yet the pact has been left behind. Its time we catch up with this we can create our own laptops, computers and even our own mobile phones! Even if we may need to copy a few ideas they cant really stop us doing it, hell! Why not even copy the operating system and just change it up to match our communist ideals! Its time to give the people something to be cheerful about and this is how we will do it." 
 france.58.o1:0 "Stealing isnt stealing in communist land." 
 france.59.t:0 "The Great Push"
 france.59.d:0 "Although we have been able to implement reforms, its been a difficult challenge, many have still stood in our opposition and some even tried to stop us. We finally did it and we can already see the face of France slowly changing. The people can look outside their state and see what the world can look like we us being able to manipulate some of it..but still they have some type of idea! The people can look at our party and know we are the ones who give them the freedom, the voice and see we do have their best interests.\n\nAlthough Melenchon maybe the great reformer he still had to ask for help and make sure he got it. The limited reforms he was able to implement can change some of the French socialist culture but not too much. If the people don’t have any ideas to increase more freedoms or push more reforms. We believe France will be able to overcome this dark time and come out the strongest communist nation the pact has ever had." 
 france.59.o1:0 "Fixing the problem" 
 france.60.t:0 "We Have A Serious Problem."
 france.60.d:0 "France has changed, it has changed a lot. The reforms worked and employment has increased, the economy is now showing slow but sure signs of recovery. Everyday life is starting to become a lot easier and freer. \n\nThats the problem, they're a lot freer. The people of the state have noticed they can start to get away with more and now they cry out for more. These reformers are not enough in fact its too much. As we show signs of not giving into this stupid movement the people of the state are starting to notice that and are kicking up a bit of a fuss…" 
 france.60.o1:0 "We need to stop this now!" 
 france.61.t:0 "Too Much Freedom"
 france.61.d:0 "The people are starting to get louder and others are taking notice. Word is going round the towns, cities and even the villages that this party is giving into the people by allowing more freedom. Due to this new “freedom the people think they’re getting, they are starting to feel more restless and want instant change. \n\nWE ON THE OTHER HAND DON’T! We need to cut this pronto and push the people back into line." 
 france.61.o1:0 "Freedom Is A Crime"
 france.62.t:0 "The Rushed Reforms"
 france.62.d:0 "Uh oh..the ideas of these reforms were great and the best bit about them is that it worked. It just worked a bit too much….Now we have a serious problem, due to the rush of pushing these reforms through just like last time the changes were too quick and due to such major changes in the state the officials, police and state workers could not keep up and were not sure on such huge law changes. \n\nThe people had a voice and they used it and keep using it. We must prevent this movement from growing even more." 
 france.62.o1:0 "Too fast?" 
 france.63.t:0 "Quick Actions"
 france.63.d:0 "France is starting to get a little out of control shall we say, more public groups are being set up online talking about rather “anti-communist ways France could be ruled and this is a serious problem, as well as that many people are taking advantage of the reforms which could cause major issues in future. \n\nIts time to fix this and therefore we need to stop these groups and loudmouth protesters to stop and prevent it from getting worse. We are shutting these reforms down and making sure the people know the party still stands in control." 
 france.63.o1:0 "Knew this would be too good to be true."
 france.64.t:0 "Halting France"
 france.64.d:0 "We have arrested those who have set up online groups discouraging our great party and humiliated those who discredit us. Now we must stop all the reforms and changes and put a hold on France until we can return to a status quo and then maybe we can bring back the reforms but for now to keep in control. France must return to the old days just until we can retain control of the great state." 
 france.64.o1:0 "How will the people react to this?" 
 france.65.t:0 "Reverse The Reforms"
 france.65.d:0 "The public are starting to get more louder and they are noticing we are trying to crack down on this. The only way we can really keep in control is removing these god damn Reforms and bring France back to a peaceful time. Once the reforms have been removed law and order can then return, the police will understand the law again and the people will not have any excuses anymore." 
 france.65.o1:0 "I dont think this will go well.."
 france.66.t:0 "Stopping Social Media"
 france.66.d:0 "Damn damn damn!!! Although we may have arrested the leaders of the so called “freedom France groups their legacies have already left a mark. We need to scrub their tracks off the internet and ban all social media, even the communist approved communication groups. We cannot risk any attacks on our party or governments. \n\nThis may seem like a huge public blackout but it is the only way we can really take control of the state and make sure we know exactly what the people of France are doing. " 
 france.66.o1:0 "Yikes.." 
 france.67.t:0 "Stopping All Media Broadcasting"
 france.67.d:0 "A while ago we allowed outside media to be broadcast into the country, this helped fight against black markets but also give the French people more freedoms seeing what is happening in the outside world. Unfortunately, they were also able to learn other governments around the world can listen and help the people. As much as we want to help the people this could also bring down our great state and change the way we rule our strong communist nation. We need to limit and stop all types of revolutionary thoughts which could pose a threat to our state and make the people lose interest with combating against our party."
 france.67.o1:0 "Here come the black markets.."
 france.68.t:0 "Limiting Liberties"
 france.68.d:0 "Due to the increase of civil liberties the people now have the chance to shout, scream and spread messages throughout the state what they really think of the party and what could be done to change France. This is now what we created this reform to be created for. This was changed to make the people FEEL they have more freedom but not use it against us. Because of such abuse and negative outcomes we are going to limit all types of liberties that are being broadcast to the people and create new laws to prevent this happening again." 
 france.68.o1:0 "Freedom Is Capitalism" 
 france.69.t:0 "Slowing France Down"
 france.69.d:0 "The reforms worked..for sometime but France still has many problems and this time the people can express those problems to each other. We need to calm the state down first before we can fix it therefore a series of changes will be made to calm everyone down and make the state return to a status quo until things can relax and we can fix the state again.  " 
 france.69.o1:0 "Lets slow things down first"
 france.70.t:0 "Job Freedoms Cut"
 france.70.d:0 "The job reforms enabled a lot more protection to workers, providing them with strong work benefits, great pensions and higher levels of safety. This worked great and the workers enjoyed this for some time. The problem is with the workers finding out this doesn’t cover all types of jobs only certain labour work and the bosses remain in charge of what types of freedoms are given to workers. \n\nThe working people are no longer happy with the reforms we have provided them and beginning to cause problems at work. Its time they learn they should enjoy what they can have and therefore we will be removing their job freedom until they are willing to respect what we have given them. " 
 france.70.o1:0 "Respect What You Have!" 
 france.71.t:0 "Stopping Business Grants"
 france.71.d:0 "For the past months  we have offered new business owners grants to help kick start their companies and give the people of France modern solid jobs. This has been working great, but the bosses are getting greedy and cry out for more. A lot of the party also worry this could lead to a monopoly which is heavily influenced with capitalism. Because of this we are going to have to stop grants altogether and take back control of peoples owned businesses. " 
 france.71.o1:0 "Thats Not Fair?"
 france.72.t:0 "Distance From Democracy"
 france.72.d:0 "After agreeing new trade with Canada and the UK we were able to export some of our great communist production to them. Turns out what they have is a lot better  than anything we have. The people have realised and began to want more, not just trade but adopt more from other countries. This isn’t going to end well therefore we need to cut this ASAP and focus more on rebuilding our relationships with the soviet countries and are great communist neighbours." 
 france.72.o1:0 "We focus on the red star." 
 france.73.t:0 "The Great Halt"
 france.73.d:0 "France is not reacting well to the laws and reform cuts we have made. It was done to protect France and its allies and therefore we need to make sure our great nation is a strong safe and most of all great communist state! The people of France are not happy, and we have tried to cut and remove reforms and change laws but things are still not working out well to say the least and the people are not giving in. \n\nIts time we made serious changes here and literally stop France. Put the whole country into  martial law and give the people certain times to be out working and when they should return to their homes. Yes it’s a type of iron fist rule but most of all it restores order back into the state and makes the people understand we are the ones in charge not them!" 
 france.73.o1:0 "Today We Stop!"
 france.74.t:0 "The French Crisis"
 france.74.d:0 "Melenchon was riding out in his leader’s car to speak to the party members in the politburo when his phone rang. After a 10-minute conversation he sat back and took a deep breath. He looked out at the state he had tried to change but all he could see was the same state he was elected to be leader of. He walked into congress and after a short recess he took to the podium to address the members.\n\n“My dear party members, friends of the state and loyal members. France has been attacked. Not by terrorists or another country but by its countrymen, the rioters today took a stand in the heart of France, equipping themselves in yellow jackets and refusing to work. Refusing the party. They parade Paris shouting, chanting about how we are ruining the lives of our people. But now more fellow statement join them, join them to degrade us. My members what do we do, what path shall we follow to show the yellow vest rioters that we shall not bow down to them?" 
 france.74.o1:0 "Boiling Point Has Been Hit" 
 france.75.t:0 "Addressing The Nation"
 france.75.d:0 "Jean Luc Melenchon, reformist leader of France ascended the podium in the center of the French Politburo. He had the look of a man who was defeated on the inside, his hair showed tinges of gray and he looked as if he had not slept for days. While greeted by applause, there was a sense of tension, not only in the room but in every living room of the country. Since introducing his reforms, Melenchon has been under constant criticism as his reforms have not helped the French people but instead worsened their situation.\n\nTapping his stack of papers he leaned into the microphone and spoke,\n\n“People of France, I sympathize with your plight. It is the exact reason that I made the reforms and introduced them to our government.\n\nIt was not the intention of myself or my associates to create inequalities in the country, to worsen your lives while letting the upper class enrich itself, or to worsen our standing with the other communists of Europe. However, intentions are not going to do us any good right now. I am asking members of the Politburo to immediately put a stop to the implementation of reforms until we can revise them and make sure they stay true to our communist way of life while helping the worker class.\n\nThis short and simple speech would do more harm than good, as on that night, thousands of workers and students would march in the streets of major cities. They would demand their voices to be heard, but it was unknown if the government would hear their plea." 
 france.75.o1:0 "The Beginning of the End"
 france.76.t:0 "Student Protests"
 france.76.d:0 "Colleges have always been called indoctrination machines, and in our case it seems true. Capitalist elements have infiltrated our school system and made these children think that capitalism is true freedom. Students are now out in power, “protesting with many other groups asking for more rights and a transition to a new democratic political system."
 france.76.o1:0 "Education Education...?" 
 france.77.t:0 "Student Sit ins"
 france.77.d:0 "The problem with our students has become much worse. They refuse to leave cafes and public areas. While staying there, these kids are paying nothing for food, and in some cases are resorting to extorting the business owners for free products. This of course is causing trouble in already struggling areas." 
 france.77.o1:0 "This is worrying.."
 france.78.t:0 "Students Need Their Rights"
 france.78.d:0 "Students tend to be looked down and mocked, due to their relative youth and ignorance of the real world. This is one of the major reasons that they are protesting, they want equal rights to that of the grown French citizen. Which we can not give for obvious reasons. They’ve acted like spoiled children, so why should we reward them?" 
 france.78.o1:0 "We will be heard" 
 france.79.t:0 "The Unions Protests!"
 france.79.d:0 "One of the leading protest groups is the Yellow Hats, named after yellow hats that many factory workers wear. These men and women are protesting their low wages and calling for a new reform to equal out the wages of their bosses and them. These union workers have refused to engage in any form of labour." 
 france.79.o1:0 "These groups must be put down now!"
 france.80.t:0 "Protest Working Treatment"
 france.80.d:0 " "Workers outside the industrial sphere want just one thing. They want better treatment in the workplace, yet our government is reluctant to give it to them. If we give workers more rights, then we’re no better than those capitalist pigs across the channel." One of the party members addressed the politburo. Refusing to give in to such demands." 
 france.80.o1:0 "A house divided" 
 france.81.t:0 "Budget For The Unions"
 france.81.d:0 "Melenchons reforms have give the unions more of a budget to work with, yet the people want more. This is just not possible at the current time, as our economy is barely recovering from the downturn of the past couple decades. Unions have made their case to the government, yet its unknown whether the government will listen." 
 france.81.o1:0 "Money to help the workers"
 france.82.t:0 "Unions in the politburo"
 france.82.d:0 "One demand of the many protest groups is the demand for Unions to become part of the government. For if there is a group to represent the lowest of the low in the Government, then France can truly be an equal communist country. However, these demands have fallen on deaf ears." 
 france.82.o1:0 "Helping those in need" 
 france.83.t:0 "The Unions Rise Up"
 france.83.d:0 "Our worst fears have come true. The bosses, which are supposed to manage the workers and make sure they do not rise up have failed in their job. Many protesting refuse to work and claim they are no longer afraid of their bosses. There bosses have chosen to cower in their home and many are looking to leave the country all together. " 
 france.83.o1:0 "The workers revolt"
 france.84.t:0 "Industry Protests"
 france.84.d:0 "Everywhere in the state people have been rising against the party demanding change, the reforms and new laws to be pushed out again but with more change, more freedom to the people. Now its time for the industry workers to put down their tools and begin to rise. Rise against the party that is pushing them down." 
 france.84.o1:0 "Workers UNITE" 
 france.85.t:0 "Human Rights Abuse"
 france.85.d:0 "We French have been accused of many things in our lifetime, but saying we commit human rights abuses is dead wrong. People claim that the elderly have been suffering many medical problems due to their long working lives and that they cannot get quick and timely access to medical treatment. This isn’t a human rights problem, its communism in motion. Why should the elderly be given preferential treatment, that wouldn’t be very communist of us. Wait your turn or die quicker." 
 france.85.o1:0 "Everyone together not just some"
 france.86.t:0 "The workers refuse to give in"
 france.86.d:0 "The people have been forced to deal with the changes and now they are being forced to watch all the new laws and reforms be taking away from them. Some of the biggest changes helped in work yet now its just back to being forgotten. Well, no more! Its time we make the party know we will not give in to them and no longer will we stand by and let them take our future away!" 
 france.86.o1:0 "The workers stand strong" 
 france.87.t:0 "The Riots"
 france.87.d:0 "The situation is not good by any means. These protests have turned into riots, and crime is on a large uptick in the country. Assault, robbery, vandalism, etc. all of it has been on the rise and our police force is stretched thin. Yet, we persevere in our ideology. We will not give into these dissidents and we will not lower the Red Star, even if we must watch it burn." 
 france.87.o1:0 "The state shall not burn!"
 france.88.t:0 "France Begins To Break Down"
 france.88.d:0 "In hindsight, these reforms may have been too radical. What was once thought to be helpful to the country has torn our very people apart. Cities have become lawless and gang controlled while villages have had to form militias in order to protect their citizens. Where are the police you may ask? They’re gone. Most have retreated home to protect their families or joined gangs. France has truly begun to crack. " 
 france.88.o1:0 "The Start Of The Fall" 
 france.89.t:0 "The Army Abandons"
 france.89.d:0 "Rioters marched together with their arms linked through the cities of France until they came to an army check point.\n\nThe soldiers at the checkpoint pointing their guns at the protesters looking eye in eye with them. They were ordered to stand down until one general realised their son was standing on the opposite end. That’s when he knew what was really going on and knew it was time to end this.\n\nThe General ordered his men to stand down. He walked over stood between his son and looked back at his men. That’s when the rest of them knew it was time to stand with the people. Stand with their Families. Bring France together." 
 france.89.o1:0 "The army has chosen"
 france.90.t:0 "The People Turn"
 france.90.d:0 "The reforms were meant to transform our country into a prosperous nation full of jobs, equal rights for our people and proud of our state. All that came was trouble. Yes, the reforms worked for some time, but we were also given access to the outside world, we saw what it was like and we wanted to be treated better.\n\n\Now all we have is a party who refuses to listen to its people and thinks it knows what is best. We no longer will follow this government. From now on it’s the people first and that is how it will follow the next weeks, months or even years if it must." 
 france.90.o1:0 "Its time we shout"
 france.91.t:0 "ENOUGH"
 france.91.d:0 "These insurrectionist groups are now marching unopposed in every major city. They claim the mantle of those who marched in the Revolution and sing the old songs. Many are wondering if our government can handle this domestic onslaught of terrorism and keep their promise of coming out brighter." 
 france.91.o1:0 "Things are really falling apart" 
 france.92.t:0 "The Clock Begins To Tick"
 france.92.d:0 "Our worst fears are realized. Terrorist groups march on the Capital and much of our protection has fled. They sing songs of freedom and clamour for a new protective government, yet they murder people in the streets, they ruin business and commit atrocities, is this what the people want? Many upper members of the Politburo have claimed asylum in the remaining communist countries of Europe, and those brave enough to stay in the capital have sequestered themselves to hiding. The clock ticks on our remaining time in power." 
 france.92.o1:0 "The countdown starts"
 france.93.t:0 "Tick"
 france.93.d:0 "The crisis that has affected the French Socialist state for several days now has taken unexpected proportions today, as the protesters have begun walking towards Paris in an attempt to personally speak to well-known reformer of the communist party Jean-Luc Melenchon, in the hopes that such a meeting might be able to lead to a possible compromise between the authorities and those who seek change.\n\nHowever, it does appear that their efforts were dumbfounded, for it was reported, once the masses had reached their destination, that the chairman was nowhere to be found. Because of this, tensions have risen once again, and patrols of policemen are currently walking down the Champs-Élysées, the military as well. Speaking of which, why has this trooper lifted his gun?" 
 france.93.o1:0 "To kickoff a revolution, all it takes is a “bang."
 france.94.t:0 "Tock"
 france.94.d:0 "10 PM Is the hour during which every French citizen was left silent. The policemen, as they heard a gunshot. The military officer responsible for it, who’s heart skipped a beat as he realized too late that his hands slipped and pulled the trigger of his gun. The mother, who saw her child’s heart stop beating altogether. Silence. Then, a roar, the roar of thousands of people, who believed the shot had been taken voluntarily. The protest ended in violence, but violence is only beginning." 
 france.94.o1:0 "Bang" 
 france.95.t:0 "The European Spring"
 france.95.d:0 "It is official, Europe is going insane. Starting with France, the Communists have discovered that you can’t hold onto power forever. Now, the fire of hope is too hot for it to go down, and as the enemies of the Soviet world order rise again, one is left wondering how durable the structure imposed by the Reds is…" 
 france.95.o1:0 "To think they were starting to reform themselves…"
 france.96.t:0 "The Day Of Rage"
 france.96.d:0 "As a new sun rises over the nation of France, perhaps it questions itself over what it could have missed to be brought today in front of such a pitiful spectacle. The streets have turned red from the violent battles that have occurred all throughout the districts between protesters and law enforcement. Currently, it appears that this gruelling duel has been temporarily won by the former, as the police attempts to regroup in the quieter sections of the cities and military reinforcements very slowly make their way. This does not mean that anyone has taken the opportunity to breathe however, for the result of massacres is usually the frenzy of bloodlust. \n\nTherefore, there was no way to reason those who entered the Museum of the Louvre and began destroying every piece of what they saw as “communist propaganda. Nor was there an option for those who barged into the office of the Ministry of education, killing everyone in sight." 
 france.96.o1:0 "Is this really the path to freedom?"
 france.97.t:0 "Fend For Yourself"
 france.97.d:0 "A woman is crying. In her arms, she is trying to hold onto her 10-year-old son… Or at least what’s left of him. To think that this day could have been great. It was his birthday. She had purchased a few gifts for him, for despite her meagre salary, her child’s happiness was more important than her own health. She made sure he would never lack anything in life, and she as well as her husband contented themselves with the rest. They did not need much anyway; he was more than they could have ever hoped for.\n\nThen the revolution began. She had heard of French discontent, but she would’ve never guessed that it would actually go this far. She saw how things turned out on television. Some of the most renowned journalists of this country commented how some cops had been killed just for standing in the way. Not wanting to hear any more of it and believing that such tales of violence would scare her little boy, she close the TV.\n\nA few hours later, reinforcements for the government came by. She tried saluting them, cheering them, but in the end, rather than let her kid watch them, she hid him in her room’s closet. She had seen something in the lead trooper’s eyes. Some kind of emptiness, she could only describe it like that.\n\nSuddenly, things appeared to slow down. A masked thug, out of nowhere, came by and threw some trash to the enforcers of justice. That’s not what they saw. Answering effectively to a “thrown grenade, the authorities fired. With their tank.\n\nNow you might be asking, where was the father? Well, he was there. He saw everything. Every person has her own way to grieve, and him, his response was picking up a baseball bat. He Is currently in the streets, not fighting for the government, not fighting for the revolutionaries. He will not hit anyone, only protect, protect those who cannot defend themselves from the madness that France has become." 
 france.97.o1:0 "Fraternité" 
 france.98.t:0 "The end of order"
 france.98.d:0 "Despite the hopes of some, it appears that, out of all systems that have been invented in the minds of philosophers, the one to come out on top in the middle of the French crisis was not democracy or communism, but rather complete, unadulterated anarchy. With neither the government nor the revolutionaries being in the slightest willing to negotiate an end to the bloodshed, the few citizens who did not partake in this folly were left by themselves, and with fellow European nations being too busy dealing with their own internal shortcomings in this “European Spring to intervene, it looks like this crisis is not going to end anytime soon. Journalists on the field, probably the last source of information available inside of the collapsing nation, have been interviewing some of the leading figures of the revolutionary movement, such as Marine Le Pen, and their explanations of why they kept battling was that this situation was only more proof that France needs reforms at any cost to be able to stand on itself" 
 france.98.o1:0 "I’m not sure mother anarchy loves this son…"
 france.100.t:0 "Break down the ghettos"
 france.100.d:0 "If there is one good thing to have come out of this conflict, it is that class has been completely switched around. A promise of the French Communist Party during the first elections that put them to power, the metamorphosis of the disgusting ghettos of the country, where the poor had been left to rot during the capitalist era, into sprawling hubs of prosperity, had been a complete failure and was instead filled even more with those who were unable to adapt to the brutal economic reforms that led France on the road to communism. However, seizing the opportunity to change their pitiful situation, the inhabitants of said ghettos have risen up, leaving the piles of trash that they have come to call homes in order to participate in the war effort against authority.\n\nWhat will happen to them once all of this is over is up to fate, but one cannot deny that the barracks established by the freedom fighters have greatly surpassed anything that party did for them in decades." 
 france.100.o1:0 "Light in the darkness"
 france.99.t:0 "The Protest Of Many"
 france.99.d:0 "After days of infighting, things are finally starting to move in France. An uprising of over 1 million People in Brest, which is the location where Jean-Luc Melenchon established the headquarter of his military operations, managed to overpower the military through sheer numbers and raise the flag of liberation, with the chairman having managed to barely escape from the clutches of the angry crowd aboard a nondescript helicopter, with his location now unknown. A clear victory for the rebels, the event was followed by a whole night of festivities and prayers held by the leader of the operation, François Hollande himself, who had invited for the latter communities of some of the repressed religious minorities, such as the Christians and the Muslims." 
 france.99.o1:0 "Long live the revolutionary People’s HQ!" 
 france.101.t:0 "Local militia movement"
 france.101.d:0 "As the men of the latest division amongst the Bleu, Blanc, Rouge communal militia make their way back to home base, Mr. Jonathan looks up from his desk, examining the fresh faces. His shotgun is resting on the brick wall beside him, and he has made a conscious effort to hide the picture he had been observing for the last few minutes from the unwary eyes of his recruits by resting his right hand on top of it.-Status report?-Brigands tried to break into Mrs. Linda’s home and steal her jewels Sir. Ran back with their tails between their legs Sir.-Nothing else?-No sir.-Then what are you waiting for? Reach the hangar and drop your equipment.-Sir yes sir!As Jonathan glanced at the officer, he couldn’t help but give him a smirk. Though he would never admit it, he had fun bossing around his subordinates, to the point where he would sometimes give them shit for absolutely no reason. Nevertheless, he did his best to have them feel comfortable in these trying times. As the squad walked away, he pulled out a pack of cigarettes, which he had “appropriated from a deserted convenience store a few days ago, and lit up one of them. That’s the moment Marcel chose to enter the office.\n\n-What are the reports, old pal?Despite the fact that Marcel was ranked below Jonathan, they had known each other before the revolution occurred. Therefore, it mattered not if the two dropped the formalities while talking to each other.-Nothing much, again. They prevented some robbery, and I really don’t think it would have developed into violence either way.-Those schmucks must have realized that their time at the head of the country will soon be over. The revolutionaries are pushing, and they’re pushing pretty hard. Even the state-mandated radios are admitting it at this point. Our mandate to protect the people will soon come to an end.Yeah. I know.Before leaving, Marcel asked one last question, his eyes locked onto the floor.-…Have you received news from Catherine?-No.-You should try to call her man. Talking about it with someone who suffers the same as you do might actually help you cope.Kinda like how two minuses make a plus in the end.-Bye, Marcel.-À plus, mon ami.nOnce left alone, Jonathan began sobbing. He had saved so many by giving birth to this militia. Their motto had been clear from the start, an army for the people. Not for ideologies, not for politicians, not for some idealistic society. Not for authoritarianism, not for libertarianism. Not for the left, not for the right. He had done so much, saved so many. But in the end, he would never get to save the one he wanted to the most.He carefully picked up the picture sitting at his desk and held it in front of his weeping eyes. His son, shot down by a tank’s shell when the crisis began." 
 france.101.o1:0 "Allons, enfants de la patrie"
 france.102.t:0 "We're not going to take it"
 france.102.d:0 "Vicious strikes have been thrown around between the warring factions of the new French Revolution today, starting with the government, who has delivered a terrible blow to revolutionary morale. Perhaps sensing that the tides of the battle have not necessarily shifted in their favour, the secret services have taken matters into their own hands and abducted key figure of the rebellion François Baroin, before killing him live on state television. However, rather than bring down the fervour of those who seek to bring the regime down, it increased it, as their rage led them to the locations of various worker’s councils, which they proceeded to burn down. However, reports indicate that various atrocities have been committed upon the people that were located inside these buildings, allegedly under the guidance of former member of the Communist Party fallen out of grace Alain Soral." 
 france.102.o1:0 "Are the thugs of today the leaders of tomorrow?"
  france.103.t:0 "Ignite the flame"
  france.103.d:0 "As the divide between the moderate revolutionaries and their radical equivalent becomes ever more deeper, the former, hoping to symbolize what they seek to achieve in this conflict, have begun welding torches during the more peaceful protests, that is in the few locations where the mayors are actually sympathetic to their cause, as a way to literally harbour the flame of lady liberty and the light at the end of the tunnel. However, the message was not clear to everyone; in fact, the government began airing propaganda about how their fire is meant to burn down this country generations have worked so hard to build." 
  france.103.o1:0 "Will this flame die out?" 
  france.104.t:0 "Social media broadcasting"
  france.104.d:0 "At first supportive to the loyalists, the nations of Europe are starting to grow  weary of the current situation in France. For you see, media reports from the inside have come out, and they’re not good on Melenchon. With various accusations of war crimes on his own people, the European Union of Socialist Republics has officially condemned their former ally, claiming that “any nation’s vanguard party is not fit for ruling if they are forced to commit murder en masse to get what they want. Left alone in a world were even the more authoritarian regimes of the continent have begun embracing the idea of progressivism as a way to counteract Soviet dominance, it has become clear that there will never be direct intervention to end this conflict." 
  france.104.o1:0 "I smell hypocrisy…"
  france.105.t:0 "Good morning everyone, and welcome to Radio Revolution"
  france.105.d:0 "With the military having decided to put all its eggs in one basket and centralize control over a smaller part of the country rather than enforce a nationwide frail occupation, the revolutionaries are free to establish working radio stations across the cities who have been left to them. Their main goal shall be to give news of the rebels’ situation, boost morale and promote the ideals of freedom." 
  france.105.o1:0 "What channel?"
  france.106.t:0 "Digital Revolution"
  france.106.d:0 "In their final move to acquire the means of communication, the rebellion has moved in and seized all TV stations they could find, changing the programming to fit their own agenda. Despite their claims that this act will put an end to the government’s control over popular entertainment and news networks, the legitimacy of this act has been proven dubious at best, with various channels being arbitrarily given to the various factions of the rebellion. On this note, we, independent journalists, would like to reiterate our complete neutrality in this conflict. We would never display on paper governmental propaganda." 
  france.106.o1:0 "..Will they be going after us next?" 
  france.107.t:0 "The critique and Digital awareness"
  france.107.d:0 "Good morning readers. Unless you’re not actually subscribed to our newspaper delivery service and are reading at a later time, in which case how dare you! I’m just kidding of course. With order returning to our country in a very different form of status quo, I, Thierry Jousse, has embraced the task at hand: discovering the various channels the revolutionary authority has made available to us and evaluating their quality in as few words as possible. Here goes! \n\nLe libre arbitre \n\nThe strength of this channel comes from its imports. Having made deals with multiple capitalist televisual and cinematographic conglomerates around the globe, most notably those from Canada, Australia, Hawaii and Japan, you can feel the happy merging of different cultures that formed the strength of the individual content exhibited here. You may find yourself tearing up in front of a soap opera with a strong English accent for some time, and then before you’ve noticed you’re standing on the edge of your seat, excited by this new kind of cartoon… anime I think it was called? It also features news broadcasts, which have promised transparency in the content they offer, which is always a plus in my book. \n\nLa reine des chaines \n\nOut of all channels, it is the one that gripped me the most. It had decorum, tried its best to provide entertainment for all ages and definitely did not lack in investment. Brilliant shows put to life by rising stars. Since it focuses on variety, it does not have a news channel for me to evaluate, but the content definitely makes up for it. I also love the design of the crown they’ve used as their logo. \n\nLa divine parole \n\nA religious channel for religious people. Though it might not be for me, I can understand the appeal. All faiths are given the spotlight, with prayers and analysis of sacred texts available every day. In terms of news channel, it is obviously biased towards a more conservative outlook, so it is a niche but welcome addition to French television. \n\nLe front \n\nWe all knew Marine Le Pen would get her own channel, and here it is. Funny enough, it is the least developed of the 6, possibly because the woman’s men are too busy dealing with the Communists. All it does is give information on the state of affairs in the rebel government, but it has been announced that actual TV shows will come very soon. \n\nLe nouveau monde \n\nStrangely very close to the state television we used to have, this channel promotes progressivism through the use of barely noticeable propaganda. Don’t get me wrong, their latest police fiction was great, but the fact that they’ve rehired actors from previous stations should be enough to make you aware that there is nothing new under the sun. If you’d rather stick with rehashed versions of your old favourites, this is the best place. \n\nCanal 6 \n\nTwo minutes in and I switched to some other channel. It kept rambling about some conspiracy theory claiming that Jews are the reason why the revolution was a failure. Watch at your own risk." 
  france.107.o1:0 "Interesting takes."
  france.108.t:0 "Screw The Loyalists"
  france.108.d:0 "In an attempt to stop the secret services’ increasingly aggressive maneuvers on them, the rebellious authority has officially announced that they will send armed divisions throughout the streets where important officials are scheduled to walk in. Such tensions are the result of multiple kidnappings and murders taking place all around the region of Brittany, most likely as a method of demoralization." 
  france.108.o1:0 "If it’s open war they want…"
  france.109.t:0 "Red world, crimson streets"
  france.109.d:0 "Many had predicted it, but none could have expected the brutality of it. Having exhibited on multiple occasions procapitalist sentiments, many a businessman had returned from their exile in sympathizing places, most of them within the Democratic League, to their birthplace of France in the event of the steady revolutionary takeover. Ideological leaders of the movement such as Macron had received them with open arms, and they were accommodated into the few hotels of Paris still standing until the day their homes could be reappropriated if it wasn’t already the case, or rebuilt had they been destroyed. Thing is, one cannot hope to unite all people in the face of a common enemy. Today, the most radical members of the movement have shown their disapproval in a terrifying way. Led by Alain Soral, they forcefully pushed the elite into the streets and unceremoniously hanged them, with the words “wimps, they left us to rot carved by knife on their foreheads. The act was almost immediately condemned by the movement itself, but this display of violence has given more legitimacy to the remnants of the government, who may try to use this sudden revolutionary schism to their advantage." 
  france.109.o1:0 "This crazed man must be stopped!"
  france.110.t:0 "Refusing to listen"
  france.110.d:0 "For so many days and weeks now, the government has been spreading propaganda against our cause, telling us we are the domestic terrorists. The people of their own state they turn against us. This has in fact fallen on deaf ears. The people now listen, and they turn away, the pick up objects and join us to march down streets and protest against the way we are being treated. We will no longer listen to the party. We no longer listen to the elite.." 
  france.110.o1:0 "A blind ear" 
  france.111.t:0 "To retake the homeland"
  france.111.d:0 "As the revolutionary government remains busy with infighting, the Communist Party has moved en masse to retake what was theirs in the first place. In Paris, in Brest, the French military has prepared for this moment. Shots are fired, the rebels are bringing in the big guns, proving that they are not willing to capitulate anytime soon." 
  france.111.o1:0 "This is not a revolution anymore, this is a full-on war! Not a European spring, a European winter"
  france.112.t:0 "You must make a choice, and the choice is us"
  france.112.d:0 "The radicals are at it again! With the authorities repelled for now, they’ve taken upon themselves to make sure that anyone in their ranks they deem as “counterrevolutionary is brought down as to not interfere in the armed conflict. Police officers, credit unionists, militiamen, all are to be included in the purge." 
  france.112.o1:0 "When will it end?"
  france.113.t:0 "The raid"
  france.113.d:0 "Jonathan cautiously opened the door to his left, tightly holding his semi-automatic Luger in both of his hands, while looking around nervously to make sure that he did not miss anyone hiding in the room that he was already in. A single mistake could be fatal. He couldn’t let his emotions get the better of him too, otherwise his salty tears would block his view. He didn’t know if Marcel had managed to escape, the last he had heard of him was an hour ago, when the violence began. Now, his squad had been wiped out, but so was the enemy’s. \n\n-What am I doing, I must stay in the present, otherwise someone could sneak up on me and I wouldn’t even notice. \n\n-You said it, not me! \n\n-Wait wha- \n\na deep pain in the chest. Jonathan had been shot, and blood was dripping from the wound. Did not mean he was out of the count though. \n\nGritting his teeth, he pulled his weight back and pulled the trigger. \n\nAs both individuals collapsed to the floor Jonathan stared at his opponent. This was not a man, this was a monster. How could-he rejoice in the atrocities he had committed? Plundering governmental offices and ordinary homes alike. \n\nWhatever, he had done the best he could to save the innocent, and he felt pretty good about it. Now, for his reward. \n\nHours later, Marcel came back with reinforcements. With the revolutionaries and the French army busy fighting each other. Not even the most radical cared about the purge. They were too late however, for all they could bring back home where bodies. Among them, a father, smiling. He had retrieved his son." 
  france.113.o1:0 "For every hero’s name that’s known, a thousand die as well"
  france.114.t:0 "The New French Revolution"
  france.114.d:0 "The last gun shots rang out in Paris and the revolutionary radio switch on. Families, friends, and strangers gathered to listen what was happening. The presenter announced, “My dear French men, woman and children. Today the last of the party officials, elite and those loyal to the communist party have fled Paris. Searches are still going on for those who have fled but I am proud to sit here today and let all my fellow freedom fighters that we have successfully removed the communist menace out of Paris, and we can now claim the capital as ours. Victory is far from over, but this certainly is a great moral boost and just proof that we can still win this war. Not long after celebrations took place in Paris knowing that this surely would be a huge blow to the party." 
  france.114.o2:0 "I believe in change!"
  france.115.t:0 "Burn The Red Flag"
  france.115.d:0 "The first sign of defiance is burning the propaganda the state is trying to shove down our throats, this will not be tolerated. Its time to burn everything they pushed at us including the “Scarlet Flag. This will show them we will not go down quietly." 
  france.115.o1:0 "The Red Flag No Longer Flies"
  france.116.t:0 "The Search For State Officials"
  france.116.d:0 "Some party officials refused to leave France, they stayed out of loyalty and sworn to fight until the bitter end. Well, the time has come for them to do that and choose that path they have. Its time to start the hunt for those who looked down upon us and teach them the French people will not stand any longer for their silly games they play" 
  france.116.o1:0 "Hide n Seek"
  france.117.t:0 "Force The Army To Join"
  france.117.d:0 "Many soldiers have abandoned their positions in the state armed forces and joined with the protesters, fighting along side one another for their families and their own future. Now its time to give the army the ultimate question. Will they join us? And if not well, its time they are forced to as their party has run away from them and now its just silly little skirmishes. Its time they finally do what they are meant to do and that is serving their country, protecting their citizens." 
  france.117.o1:0 "Join us my brothers and sisters"
  france.118.t:0 "Party Powers"
  france.118.d:0 "After the failed meetings with party leaders, it seems we cannot do anything to put a stop to this other than take extreme measures. Its time we take complete control of absolutely everything and order the military and police to use excessive force to put an end to this once and for all. The Emergence powers have been granted and the military will take control of the streets and remove anyone off the streets if they refuse to put their torch down." 
  france.118.o1:0 "Pffft if that is going to work now" 
  france.119.t:0 "Trying to fix the state"
  france.119.d:0 "Things have got messy and we need to fix things fast. Our previous methods have failed, and we are struggling to find a way out of this. Its now time to meet with leaders of the resistance groups and try to find a compromise. We are desperate and we need to find a way out of this ALIVE. If we can sit down with other leaders and try to persuade them to ask the people to stop and try to calm the state down, then maybe we can find a way out of this." 
  france.119.o1:0 "Kinda late?"
  france.120.t:0 "Party Meetings"
  france.120.d:0 "It’s no secret we are losing the battle to stay in control of the state and although we may now only be a one-party state but we also need help and support from our other opposition leaders. They will be able to speak to their supporters, calm them down and prevent more of the country from going against us. We will offer bribes and more to get those on our side and show them the Communist Party will work for all!" 
  france.120.o1:0 "As if???"
  france.121.t:0 "The Failed Meetings"
  france.121.d:0 "Leaders sat down on two sides of a table. You could feel the anger in the atmosphere. Melenchon greeted the leaders with a smile shaking hands while the rest of the party refused to even acknowledge them. The mood was low and both sides kept refusing to let one another speak. Melenchon pleaded with everyone to resolve the problem but the communists and the revolutionary leaders kept getting louder until fights started to break out. All of a sudden guards came running in arresting the revolutionary groups causing the people to push more hate and anger at the party." 
  france.121.o1:0 "The Fight Is Already Over" 
  france.122.t:0 "The European Winter"
  france.122.d:0 "The Radio sang its revolutionary theme and then the announcer came on, “Yesterday morning, at 6:40, at the revolutionary headquarters, Jean-Luc Melenchon, representative of the French High Command and the head of the French State, signed the act of unconditional surrender of all French land, sea, and air forces in the state to the revolutionary Force, and, simultaneously, to the opposition party leaders. Hostilities will end officially at midnight to-night. Our dear friends across the state are now officially free. We have sent a message to Germany and Italy that we do not wish to aggravate them and want to rebuild in our own image. For now, my fellow fighters we look to our commanders and unelected leaders to help guide us and how we will rebuild the French country together." 
  france.122.o1:0 "A New France Rises"
  france.123.t:0 "Rise Of Political Groups"
  france.123.d:0 "After meeting with different leaders of different parties we can say that there are two people we have in mind, the centrist Emmanuel Macron and right-wing leader Marine Le Pen. These two leaders both want to remove the communist bloc from our state and return to the old days of France with free and fair democracy. Its time to see what they have chosen to get the support of the public and how to stop this revolution and take control of a new France." 
  france.123.o1:0 "Times are changing"
  france.124.t:0 "Take control of the streets"
  france.124.d:0 "Now leaders have been chosen to help get in touch with the people and show the people they understand the need for all this violence and change its time they took charge and calmed the situation down. Le Pen will meet with militia groups who will slowly begin to calm the situation down on the streets whereas Macron will be the face of everyone to come together and begin the last step to bringing the communist party down once and for all. " 
  france.124.o1:0 "Real Leadership" 
  france.125.t:0 "Stepping Up"
  france.125.d:0 "Papers were handed to Macron and Le Pen; Papers were handed back to Melenchon. Papers were signed. They all looked at each other shook hands and headed outside of the chambers. Melenchon disappeared into his car while Macron and Le Pen met protesters outside the politburo. \n\n“I can now confirm the communist party has handed power over to a transitional government until we are able to find proper leadership and guide out nation to a new era. Macron announced to spectators. Cheers and shouting were heard all around Paris. This was the moment everyone had been waiting and it had finally arrived. \n\nChange." 
  france.125.o1:0 "France Begins Now"
  france.126.t:0 "Dissolve The Politburo"
  france.126.d:0 "Le Pen and Macron met with leaders from each left party including Melenchon and told them how this new act would work and what is going to happen. Using their presidential powers, they dissolved the politburo. The parties no longer were in power and the transitional government were now head of the state until a new leader had been chosen." 
  france.126.o1:0 "Change has started"
  france.127.t:0 "Melenchon Stands Down"
  france.127.d:0 "As news finally reached Melenchon of a possible return of royalty to the country, he finally took a deep sigh and understood what must be done. This goes against his views and could no longer be a leader of a party which goes against what the people want. \n\nHe took to TV and announced he would be resigning as chairman of the party and officially declared the communist party of France to be dissolved. \n\nThe man who wanted to change France in his own image has now been forced to give up and dream about what could have been…" 
  france.127.o1:0 "And with that quick address..Its finally over." 
  france.128.t:0 "Welcome The King Home"
  france.128.d:0 "As Concorde landed in Charles De Gaulle airport crowds gathered. The new king of France stepped of the plane and greeted wild crowds who were ecstatic to see him. He walked onto a podium and spoke to the people. \n\n“My people, you have fought strong and fought noble. I am proud to call myself your king and overwhelmed to be back at my home. We have a long way to go together but I am sure with all our strengths we can make this country a strong and proud country. I have plans about what needs to be done and how we can restore order here but for now let us celebrate that we can have our lives back and freedom always wins. \n\nAfter a few more minutes of talking to crowds he walked into a royal car and was driven away followed by security. For days after celebrations and fireworks were taken place all over France and order had already begun to return to the country ready for a new king and a new way of life…" 
  france.128.o1:0 "Long Live The King"
  france.129.t:0 "Jean Christophe Napoleon"
  france.129.d:0 "“I have asked you all here for one thing. How we are going to rebuild France and bring it into the 21st century. Together we will work to root out the communist threat, allow people to open their minds and express what they really want. Most of all, restoring faith back into our system and rebuild our relationships with our friends around the world. \n\nNapoleon said addressing political parties. He had brought them together to hear how they would rebuild France in their vision. How each party would deal with such a crisis. Once he finished talking and listening, he spoke to the people on TV in a nationwide appearance. \n\n“My people today I have spoken to political parties and heard how they would deal with this issue. Now I have heard this I can now begin to put plans together to build France back from the bottom to the very top! I will not let you down and I promise we will restore order together" 
  france.129.o1:0 "The New France Starts Now" 
  france.130.t:0 "Trials Of The Party"
  france.130.d:0 "Its time we choose whether we ban the party or allow it to stand in a limited movement. Either way we must make sure some of the leaders stand trial, its either imprisonment or death. This is not a normal punishment but then again neither is this crime. Melenchon will not be given death due to his moves to try and reform whereas the hardliners will if death is chosen rather than life in prison." 
  france.130.o1:0 "Imprison The Scum"
  france.130.o2:0 "Death To The Party"
  france.131.t:0 "Discuss Restoring France"
  france.131.d:0 "Now we have met with political leaders and discussed what they would do if they were to come to power of France, we can now begin the rebuilding of France.  It will be a long process, but we are ready to work with the King. He has set our plans for what must happen and now after addressing the nation on these plans. The people are now ready." 
  france.131.o1:0 "Building Begins"
  france.132.t:0 "The Kings France"
  france.132.d:0 "Plans have been created, drafts have been accepted and now we can start the rebuilding of France. Party leaders and the king are now ready to watch the country change and flourish into a new democratic state which they will be proud to call home. The people have accepted the King and now He is ready to rule a new country. A strong New France." 
  france.132.o1:0 "A New Era Begins"
  france.133.t:0 "Question Of Unions"
  france.133.d:0 "Unions were always tightly connected to the communist party and always worked with them to implement laws. They never represented the worker until Melenchon created his reforms. Once the reforms were passed, they did eventually stand up for the worker and report bosses to the party if the workers were exploited. \n\nNow its time to choose whether Unions should still be allowed to operate in the country or if they should be banned and remove any existence of the past years from France." 
  france.133.o2:0 "Ban Unions"
  france.133.o1:0 "Allow Limited State Unions"
  france.134.t:0 "Hybrid Parliament"
  france.134.d:0 "Democracy has been united with royalty and with each other it is creating a new mark in Europe. France has already changed a lot since the King took over and now working together with politicians going over new legislations about how long it will take for elections to take place and rules about government in France. It seems Jean Christophe Napoleon really did know how to guide the country and is ready to hand over power to the people and let them decide who should run the country and guide it through its first democratic years after decades of communist rule." 
  france.134.o1:0 "The peoples power will return"
  france.135.t:0 "Discuss The Return To Democracy"
  france.135.d:0 "Its time to end a one state party rule and hold our first elections. The king will stand by as a head of state while a government will be implemented into the country and ran by a prime minister. Free and fair elections will be held in the country and everyone 18 and above will be able to vote for the party that they feel represents them. \n\nNapoleon Addressed the people of the country as they watched political leaders show their own election manifesto for their parties and what they will do for France. “It’s now up to you the people of France, I have taken the torch and helped create a stable country, now it’s time to choose who will take this torch and build France further and make it a truly shining beacon on the world stage." 
  france.135.o1:0 "Cast your vote."
  france.136.t:0 "France Elects"
  france.136.d:0 "The time has finally arrived, the first public elections are now here and with every candidate that has shown what they will bring to France its time to let the public decide who they want to rule over France for the next four years. It’s going to be a close election with each party bringing their own unique plan of what its best for France but now its time to find out who really is going to be leader of the country and which will be the first government in over many decades to lead the country. " 
  france.136.o1:0 "En Marche!"
  france.136.o2:0 "Parti Socialiste"
  france.136.o3:0 "Les Republicains"
  france.136.o4:0 "National Front"
  france.137.t:0 "En Marche Wins!"
  france.137.d:0 "Emmanuel Macron has done it. After weeks of campaigning and showing the public he is the right man for the job, he has swept through the polls with a strong majority and won the first French election. Critics believe due to his past work helping the French people during the European Spring has helped him gain the supported needed to win." 
  france.137.o1:0 "France's First Elected Leader!"
  france.138.t:0 "Modernize Public Services"
  france.138.d:0 "The public transport system in France is outdated and requires a lot of maintenance, it was introduced around the 1980s and requires serious updating. Now is the time this can happen with new investments made into the public service system its time buses, trains and more got the upgrade needed for the 2010s" 
  france.138.o1:0 "Smoother better transport"
  france.139.t:0 "Working With The King"
  france.139.d:0 "Macron has been a firm believer that working with the king and supporting him is the best way to keep France united. He literally reunited France and restored the democratic system. We can have regular meetings with him and allow him to guide us to help France in the future." 
  france.139.o1:0 "The UK has something similar to this.."
  france.140.t:0 "Les Republicans Win"
  france.140.d:0 "After weeks of campaigning and showing the public he is the right man for the job, Christian Jacob has swept through the polls with a strong majority and won the first French election. Its time France embraced the conservative government!" 
  france.140.o1:0 "A New Direction"
  france.141.t:0 "The Immigration Question"
  france.141.d:0 "Now we have a democratic system in place of our country and the communist party has been rid away, we have found that many people from Germany, Italy and eastern Europe have started to enter our country to get a better life. This is acceptable but it needs to be done a legal way to prevent unrest with our own French people and protect our system. The question is do we create an immigration system and help integrate them to our society or do we turn them away at our borders?" 
  france.141.o1:0 "Allow them to stay"
  france.141.o2:0 "France Is Full"
  france.142.t:0 "Expel All Communist Supporters"
  france.142.d:0 "We may have rid the communist party away, but we are still suffering with a few groups out there still trying to push their own communist outlook to the people. This is too dangerous, and we cannot risk things going crazy again. We must remove these traitors and show the country we will clamp down hard on those who wish to defy the democratic way of life." 
  france.142.o1:0 "And the red star finally falls."
  france.143.t:0 "Parti Socialiste"
  france.143.d:0 "The Parti Socialiste entered government with a majority. The people have still shown their support for the moderate left and want to make sure we do not get rid of those left-wing ideals which helped the country. This party will ensure it remains in the centre left with different ways to fix the country in their own views. " 
  france.143.o1:0 "The Left Win"
  france.144.t:0 "Tolerate The Unions"
  france.144.d:0 "Unions were setup to protect workers, now we are in a democratic system which could take advantage of workers. If we can speak to union leaders and allow them to still operate only focusing on protecting the worker and not the state, then we can allow them to operate and still keep the labour force of France happy." 
  france.144.o1:0 "There is power in a union"
  france.145.t:0 "The National Front Win"
  france.145.d:0 "This was a shock; it seems the people of France want to move from a far-left country to a far right. Le Pen has plans for France. They are a lot different to many of the parties but if this is what fixes France then so be it. The Nation Front has won a strong majority and can now lead this reborn country into the 2020’s readily equipped to fight against the communist ideology. It seems critics believe that her massive win was due to her help in the European Spring meeting the people and showing them what France could be given the chance to push for it." 
  france.145.o1:0 "Removing the left"
  france.146.t:0 "The French Army"
  france.146.d:0 "The Army is still in critical need of reforming and reshaping. Le Pen promised the people that if she were elected, she would make France a powerhouse when it comes to military action and so it shall be. She claims it needs protecting from the likes of Germany and Italy. The people after suffering from the communist grip also do believe her and are ready to rebuild the French army and make it the hard-line nationalist army it needs to protect its country." 
  france.146.o1:0 "Protecting The People"
  france.147.t:0 "Build The Border Walls"
  france.147.d:0 "Communism still reeks in Europe and we need to ensure France is kept out of it. The only way we can keep France safe and in the hands of democracy is building strong border walls and check points along the borders of Germany and Italy and this way we can prevent illegal extremist communists sneaking into our country and causing trouble. We need to put our country first and this way we keep it safe and we can make our people feel more at home making it France first. " 
  france.147.o1:0 "France First"
  france.148.t:0 "The Monarchy"
  france.148.d:0 "The French people have weathered their civil strife and on top has come the Monarchy. Stemming out of Francois Hollande’s plan to restore French glory, by way of Monarchy the French parliament are sent to meet and discuss the idea of Monarchisms return to the French country. The parliament are tasked with choosing the royal family to lead the French people to glory. Shall the French be led by the Bonaparte’s or the Bourbons?" 
  france.148.o1:0 "Royalty Needs Power"
  france.149.t:0 "The Houses Of Royalty"
  france.149.d:0 "The House of France consists of a number of branches and their sub-branches. Some of its branches have acceded to the Crown, while others remained cadets.With the return of Napoleon and guiding the government in the past, it is not a surprise to see that much of the public would still like the crown to get involved in more political matters and have the final say in laws and more. It seems like a lot has reversed in France compared to the past years." 
  france.149.o1:0 "The people support the crown"
  france.150.t:0 "Which House To Rule"
  france.150.d:0 "Although we have the Napoleon house as our head of state, we still have another house we can choose who has be hiding away in Spain. With the return of France entering democracy the Orleanist house has made it clear they want to be in power and take control of more political matters. We can now put forward a referendum to the people and they can now choose who will become the head of state and take control of the country for the future of France." 
  france.150.o1:0 "The Public Decides"
  france.151.t:0 "The Orleanist House"
  france.151.d:0 "The Orleanist house has been chosen to become the new head of state and work closely with the government. Although the country is still ruled under a democratic system. The links between the Orleanist house and the far right is noticeable, and they have made remarks that they would rather work closely with a stronger party who would work directly with the king rather than just overview of a government who does not represent their views. \n\nUsing his Royal prerogative the new King of France Jean d’Oréans has declared the French parliament to be dissolved and he will decide when parliament will return back to power and hold a new election for the right party to work with." 
  france.151.o1:0 "The King Has Been Chosen"
  france.152.t:0 "New Rule"
  france.152.d:0 "Now the king is in complete control of France its time to choose which party would be best fit for France. We can easily tell the people an election was held in secret in the palace and the chosen winner was our close allies “French Action. They have sworn allegiance to us and will govern for us while we control what really goes on in France meanwhile to the public it will look as if the party is governing for them. \n\nFinally we can return France back into a strong empire and send shivers down the spines of those who try to speak up against us." 
  france.152.o1:0 "0-100 real quick"
  france.153.t:0 "The New Leader"
  france.153.d:0 "The king has met with the leader of the Action First party and declared a new country. The French State will be running by the king and governed by the party. Orders will be sent by the king and created law by the party. Francois Bel-Ker has been sworn in as leader of the French parliament and will keep control of the country unless ordered otherwise by the king. This is a new dawn for France and more trouble that has entered the world stage. Every country will be watching France now as another regime enters and shows the people that they are in fact the ones who will save France." 
  france.153.o1:0 "Another leader, another lie"
  france.154.t:0 "A True Empire"
  france.154.d:0 "To be considered a true Imperialist Empire, we must reconquer the lost French Colonies. The past century has not been kind to the Empire, as all of our colonies were “liberated. To reconquer the colonies is to reconquer the French Spirit and give our empire legitimacy. Its time we show the world we are ready for a fight and we will be a force to be reckoned with." 
  france.154.o1:0 "The Empire Returns"
  france.155.t:0 "Retake Algeria"
  france.155.d:0 "Looking to retake their old colonial possessions, French forces have begun their invasion of Algeria. Quickly overwhelming Algeria’s small military, the French seek to completely eradicate the Algerian spirit. French forces have garrisoned many of the major cities and turned them into impenetrable forces, leaving the Algerian military and any resistance forces to retreat into the Sahara." 
  france.155.o1:0 "Strike The Old"
  france.156.t:0 "Haiti will be French Once Again"
  france.156.d:0 "By reconquering the Haitian Island, The French will be able to count themselves as a legitimate Imperialistic Empire. The French military has begun operations against both the Haitian and Dominican states. International Observers from both the Warsaw Pact and Democratic League have stated that the French will overrun the Islands in a couple days. General Thierry Burkhard has been given Colonial Governorship of the Island and will be in charge of transitioning the local governments over to a colonial government." 
  france.156.o1:0 "Today We Restore Our Empire"
  france.157.t:0 "Liberate The French Canadians"
  france.157.d:0 "Beginning late yesterday, French forces conducted air drops in the cities of Quebec and Montreal. French forces are now invading the Canadian wilderness on masse, with the unprepared Canadian military putting up little to no resistance. On the civilian side of the war, Imperial French forces have not violated the rights of the Anglophone Canadians, yet many feel safer leaving their homes for American Territories or territories still held by the Canadian Government." 
  france.157.o1:0 "French Canada Will Be Our Beacon To The World"
  france.158.t:0 "French Louisiana"
  france.158.d:0 "In what is called the biggest surprise attack of the century, The French Military has begun a two-pronged attack on the American states. Starting From Occupied Canada, French forces poured into territories held by both the Great Lakes Federation and Midwest Union, while planes in French Haiti took off early this morning and are expected to hit territories held by the American Republic. Leadership in the American Republic has vowed that they will commit to a total and utter defeat of the French military. The French Military is expected to defeat the latter two states while the American Republic is expected to put up stiff resistance." 
  france.158.o1:0 "Attacking The Americans Begins"
  france.159.t:0 "Expand our American Colony"
  france.159.d:0 "French Forces show no sign of stopping their American conquests as forces from the Louisiana colony begin a blitzkrieg like maneuver into the socialist American Peoples Commonwealth. Due to the division caused by the 5/1 attack, the French military is expected to finish their campaign by the end of the Month." 
  france.159.o1:0 "Today We Take America!"
  france.160.t:0 "Restore The Mexican Monarchy"
  france.160.d:0 "French Forces have concluded their campaign in the Americas by launching a multi-pronged attack on Mexico. French Forces, using similar tactics from their campaign against the American Peoples Commonwealth have been able to secure many border areas. Mexico is expected to capitulate within the month, as both French and colonial forces are proving to be an overwhelming force for the Mexican military." 
  france.160.o1:0 "Our Empire Grows Stronger"
  france.161.t:0 "Recolonize West Africa"
  france.161.d:0 "French forces, showing no sign of slowing their conquest have begun a land invasion of the West African Union. With the Unions military mostly being made up of decentralized units and militias, it is expected that the French will be able to easily conquer this former territory." 
  france.161.o1:0 "More Power, More Terrirory"
  france.162.t:0 "Retake the Ivory Coast"
  france.162.d:0 "The Ivory Coast is yet another target of rapid French expansionism. French forces have conducted multiple invasion points into the country and are expected the annex it within the week. Once taken, this could provide an important port for the French Navy. A spokesperson for the military operations stated that this will bring more people under the law and order that the French can provide." 
  france.162.o1:0 "More Land For The French"
  france.163.t:0 "Take Advantage of the UAR Civil War"
  france.163.d:0 "The French military surprised the Syrians today by conducting a naval invasion of their eastern coast. Most military garrisons in the area were quickly overrun as they could not put up any resistance that would defeat the French onslaught. His Imperial Majesty, has declared that instead of a French General taking control of the region, Syria will come under control of the influential Al Assad family who are said to be major opponents of the UAR. " 
  france.163.o1:0 "Syria Falls!"
  france.164.t:0 "Avenger Waterloo"
  france.164.d:0 "Germany had Operation Sea Lion, and now the French have Operation Waterloo. Earlier today, French forces crossed the English Channel on masse and landed several battalions of soldiers on the Southern English Coast. Reprisal by the English Government was swift, as most units engaged French occupying forces soon after. The Royal family is said to have fled to Ireland, while citizens of London have been left behind to fight the French Forces. Around the English Isles, there is a feeling of panic as many English citizens believe this war to be already lost." 
  france.164.o1:0 "The Lion No Longer Roars"
  france.165.t:0 "The Bonaparte"
  france.165.d:0 "The French Eagle rises again as Jean Christophe Bonaparte ascends the French Throne today. In a coronation at Notre Dame, The president handed power over to Jean Christophe. While the president is no longer in power, it is said that both they and Bonaparte maintain a close relationship and that Hollande might gain a favorable position in Bonaparte’s Regime. The French people are now left asking whether Jean Christophe will repeat the accidents of the old regimes, or whether this new regime will learn from Frances past and usher in a new age of prosperity. " 
  france.165.o1:0 "Napoleon Rises Again"
  france.166.t:0 "Where Is Our Palace?"
  france.166.d:0 "The question on everyone’s mind these days is, “Where is our king going to live? Many hope the king will choose the Palace at Versailles where many have lived before. Many see Versailles as a sign of the old regimes and hope that perhaps Bonaparte will choose to reside in the Palais du Louvre, which would keep the center of government in Paris. The last option for Bonaparte would be to select Palais Royale, which hasn’t been occupied for over a century." 
  france.166.o1:0 "Palace of Versailles"
  france.166.o2:0 "Palais du Louvre"
  france.166.o3:0 "Palais Royale"
  france.167.t:0 "Rectify The Mistakes Of The Past"
  france.167.d:0 "The French have now taken steps to distance themselves from the socialist regime of the past. This began earlier in the Royal ascension as French Rectification Councils were set up where supporters of the socialist Regime were forced to listen to the stories of victims from Gulags and other atrocities committed by the previous regime. Meanwhile media companies are running programs which end the cult of personality in the socialist regime, and ultimately glorify the French monarchies. " 
  france.167.o1:0 "Never Forgive, Never Forget"
  france.168.t:0 "Choosing A Prime Minister"
  france.168.d:0 "While Bonaparte may sit on the French Throne, he is all but busy with important matters. To alleviate this, he has decided to choose a prime minister which will be selected by him and lead for 5 years. There are many options available to him, and this position comes with some semblance of power. The expected candidate is François Hollande who got Bonaparte into power and is rumored to be a close confidant of the Emperor. Emmanuel Macron would be another choice as he is very popular with the people, and lastly Jacques Chriac who has support of the nobility has given him some credence." 
  france.168.o1:0 "François Hollande"
  france.168.o2:0 "Emmanuel Macron"
  france.168.o3:0 "Jacques Chirac"
  france.169.t:0 "A Constitutional or Absolute Monarchy"
  france.169.d:0 "The question on everyone’s mind right now is what government will Jean Christophe Bonaparte choose. Will he create a constitutional monarchy that will give some semblance of democracy to the French people or will he declare an absolute monarchy and guide the French himself? Bonaparte, who has been said to be meeting with Government officials all week, will apparently make his decree relatively soon." 
  france.169.o1:0 "Which Do We Choose?"
  france.170.t:0 "Our own Alliance"
  france.170.d:0 "The world is no longer divided between Communists and Capitalists, Monarchists have entered the fray. Jean Christophe Bonaparte, the new leader of France has declared that its time Monarchies get together and form their own faction independent of Toronto and Moscow. This faction dubbed the Paris Accords will consist of Monarchies from around the world and its main goal will be defense of Monarchism. Already countries like Bahrain and Jordan have signed on and sent ambassadors to the French capital." 
  france.170.o1:0 "United By Royal Blood"
  france.171.t:0 "The Noble Return"
  france.171.d:0 "Jean-Dominique Senard brought himself to leave the plane and walk into the country which had exiled him and his family in his youth. Since the ascension of Jean-Christophe Bonaparte, noble families of French descent have been pouring back into France at an astounding volume. Senard, Ceo of the Canadian Company Michelin Tires sought to reconnect with his ancestry. \n\nThere was something off about this, even though his ducal title had been reinstated and the ancestral castle listed in his name, he felt as if he was not returning to the France that he had left. Although a monarch was back on the throne, socialist sentiments still remained in the population. “I’m not going to get too comfortable, may have to pack up and leave in a hurry He thought to himself. \n\nGoing through the terminal, he was motioned towards a crowded area where a man in a military uniform was preparing to speak. “Ladies and Gentlemen, it is my pleasure to welcome you back to France. His Imperial Majesty, Jean Christophe Bonaparte has given the gift and privilege of nobility back to you. It is his hope that you all will use your fortunes and status to continue to improve France and her people. With that short speech over, he walked into a back room and Jean walked towards a limo which would take him to his new home. A new day began not only for the nobility but for all of France. " 
  france.171.o1:0 "Presents for the rich"
  france.172.t:0 "Fate Of The Communists"
  france.172.d:0 "The communists have ruled France for over 30 years. The people were put through hardships and many died because of the communist party. Its time a decision was made about not just the party by the communist supporters. Many want to see them removed or imprisoned while others want to remove them from the political platform but still allow them to live their life watch the country turn into a democratic monarch state which goes against any sort of communist value." 
  france.172.o1:0 "Remove Them From The Country"
  france.172.o2:0 "Discredit them"
  france.173.t:0 "A Secular State"
  france.173.d:0 "One worry for the new French leadership has been that of religion. While the Socialist Regime was officially athiest, it did not stop refugees of various countries from pouring into the country. Many worry that France declaring a state religion could be harmful to the Muslim minority in the country and ultimately destroy the cheap labor force. Jean Christophe is expected to make a decree on religion in the country. Already Muslim, and Jewish refugees have decided to leave the country and seek religious asylum in the English Isles." 
  france.173.o1:0 "Religion Is A Tricky Subject"
  france.174.t:0 "Institute Social Reforms"
  france.174.d:0 "Socialism wrecked the French people so its reasonable to think that Monarchism can fix them. Already capitalist elements have penetrated every form of French life and those who were poor before are seeing their incomes practically triple. The reforms also protect against discrimination in the workplace and ensure legal equality between all citizens. This also ensures a policy of free migration and ends the military rule over the common household. Coming in with this, is an aspect of police reform which includes the mandatory body cam, non-lethal training and separate jurisdictions where various departments can operate." 
  france.174.o1:0 "Reforms Reforms REFORMS"
  france.175.t:0 "Rebirth of French Landmarks"
  france.175.d:0 "Jean thought that there was something truly beautiful to seeing old France make its return. Standing in front of him was a restored Notre-Dame, in the sunlight one could truly see the grace of god he thought. Since His Glorious Majesty, signed a declaration to restore the abandoned and older landmarks, the city of Paris was looking less depressing and more of its old self, something he read about in the history books. \n\nFor the first time since the revolution, he saw abandoned cafés occupied once again, people were in the streets and there was not an air of fear but instead an air of hope. On the news, shows detailed how old castles were being restored and occupied once again, and to Jean it was magnificent. As he continued his walk down the streets of Paris, he saw the most awe-inspiring sight of all. The Eiffel tower, which was a symbol of fear during the years of the socialist regime was now a sight to behold. The old search lights had been pointed upwards, parapets taken down and the Flag of the Empire now flew on the top. \n\nJean was not the only one who felt this hope, for many citizens of France it felt as it a weight had been lifted and they could truly be free. New restaurants were opening every day as new venture capitalists bought up abandoned areas. Jeans wife, Claudette had been most excited to open a bookstore in an old, abandoned quarter of the city. It had seen some combat during the protests, but Jean figured he could fix the store and make it look presentable. Truly a new light shines on the French people." 
  france.175.o1:0 "France Is Reborn"
  france.176.t:0 "French Exceptionalism"
  france.176.d:0 "After many years of struggle, poverty and strikes. France has finally been turned into a completely new country giving the people the freedoms they need to live a happy and healthy life. Being able to now travel around the world. Reach out to the outside world and most of all a leader who cares about the people and puts them first. France has now reached a point it the people could only dream of." 
  france.176.o1:0 "France Is Free"
  france.177.t:0 "The Empire Strikes Back"
  france.177.d:0 "With the Ascension of Jean Christophe Bonaparte to the French Throne, the French Empire has officially returned. Many challenges lay ahead for the new Emperor as he not only has to end socialist influence in the country but recover a dead economy, create a loyal cabinet in his government, advance the military and establish relations with hostile western powers. \n\nIn a grand ceremony, the Eagle made its return to the French flag. After Bonapartes coronation at Notre Dame, the flag was hung from the Eifel Tower, and saw itself raised at all government buildings across the country. The Empire has declared an inwards focus as according to Bonaparte, “France can not be great without healing itself first. Already embassies are being set up in Canada, England, Spain, and more. Will this government last longer than the rest, only time will tell. " 
  france.177.o1:0 "The Empire Grows"
  france.178.t:0 "Memories Of The Past Empire"
  france.178.d:0 "While a Orleans sits on the throne, many from both the Socialist and Napoleonic sides of France are worried that Louis will repeat the mistakes of his ancestors. Historians point to the fact that the Orleans family lost the throne to republicanism. Democracy led France to socialism and many within the country do not want to see a socialist regime return. So, King Jean IV has pressure mounted towards him, he can either lead France to greatness and men the problems that France faces on the Homefront or he can buckle under the pressure of ruling and doom France." 
  france.178.o1:0 "A memory can become real."
  france.179.t:0 "Pierre Mauroy"
  france.179.d:0 "Pierre Mauroy the first communist leader in power of the state of France has passed away peacefully in his sleep. It was reported this morning that his family members checked on him due to his deteriorating health and found him dead in his bed. The nation will have 3 days to mourn the leader who changed the state and help found the European union. Many other communist leaders have sent their regards to the state and will join France in a day of mourning." 
  france.179.o1:0 "RIP The First Leader"
  france.180.t:0 "The New Car Industry"
  france.180.d:0 "The new Renault Latitude has been launched at the 2010 Moscow International Motor Show and is due on sale later this year for other markets. The European-spec Latitude will be launched at the 2010 Paris Motor Show. After agreeing with the soviet government that their new cars will be designed in France and assembled in the Soviet Union. This will create thousands of new jobs across the pact. \n\nThis truly is a great day for the socialist empire!" 
  france.180.o1:0 "Jobs Across Europe"
  france.181.t:0 "Government announces public spending cuts"
  france.181.d:0 "Government announces public spending cuts of 45bn Franc in effort to reduce high level of public debt. Due to the reforms costing the state a lot and more money being spent to fix the problems. The party has had to make cuts in public services to fund more into the reforms and help pay some of the members to accept the reforms." 
  france.181.o1:0 "Pain."
  france.182.t:0 "The European anti-nuclear treaty"
  france.182.d:0 "Today France, Germany and Italy have signed the anti-nuclear treaty. Under the new terms all three countries will stop manufacturing nuclear bombs and join many other countries in starting to cut down the number of weapons they hold. \n\nMany countries around the world including Britain and Canada have openly welcomed these changes and the count down to midnight slows down." 
  france.182.o1:0 "Closer To World Peace"
  france.183.t:0 "Extremist Paris Attacks"
  france.183.d:0 "Deadly far right extremist group has claimed responsibility for terror attacks in Paris that have killed 130 people - deadliest attacks in France since Second World War, and in European Union since 2004 Berlin railway bombings. The attack came during a concert in the heart of Paris where a group of far-right terrorists opened fire and did not stop until police managed to take them down. \n\nThe French state has entered a day of mourning for those who have been lost while the head of the states defence has announced they will hunt down the group for this and seek revenge swiftly!" 
  france.183.o1:0 "The World Unites For This"
  france.184.t:0 "Slow Growth After Reforms"
  france.184.d:0 "After months since the reforms have been implemented growth has slowed down. There were signs that the French Franc was starting to get stronger again but after the workers have been able to exploit the new laws, confidence in the currency has once again suffered and is costing the state.\n Melenchon has ordered an emergency meeting with the party to decide what actions to be taken and how they can make the currency stronger without joining the Euro." 
  france.184.o1:0 "We will power on"
  france.185.t:0 "Philharmonie de Paris Finished!"
  france.185.d:0 "The incredible communist artwork has finally been completed after 5 years, the new Philharmonie de Paris for the communist state has been completed and is ready to host grand shows featuring true socialist and communist values. Recreating the famous communist rise of power and many other great shows that will be shown to the French people. This truly is a work of art and a great addition to the French state to show its true beauty!" 
  france.185.o1:0 "France creates more art than food for the people"
  france.186.t:0 "Paris Refugee Crisis"
  france.186.d:0 "Due to the ongoing wars and the influx of refugees entering Italy who have been travelling up to France and Germany. France has decided to deal with the refugee crisis the best way they can by creating makeshift tents and containers on the banks of Saint Dennis. Many of the French people are already sick of the illegals coming to the state and staying here using the states resources which could be used to fix France rather than those who will not remain here. \n\nAs well as more focus going to the refugees rather than the French people crime has increased targeting tents trying to get rid of the Refugees. National Front leader Le Pen has encouraged groups to join together and stop France being over taken and prevent more tents being created." 
  france.186.o1:0 "Our Country First!"
  france.187.t:0 "Corbyn meets with Melenchon"
  france.187.d:0 "The socialist leader of the United Kingdom’s far left Independent Labour Party has today met with Melenchon to try and improve relationships between France and the UK if he is elected to become prime minister of the country. If elected Corbyn and Melenchon will unite the two nations after years of name calling and disputes and begin a new term of strong trade and close relationships between the two even bringing up a tunnel connecting the two countries together in the which will be put in the English Channel to link the two countries together." 
  france.187.o1:0 "An underwater tunnel?? pfft?"
  france.188.t:0 "Prince Jean-Christophe Napoleon Bonaparte's Wedding"
  france.188.d:0 "Prince Jean-Christophe Napoleon Bonaparte and his bride Countess Olympia von und zu Arco-Zinneberg today married at Claridges, Mayfair in London . Jean-Christophe is the great-great-great nephew of Napoleon Bonaparte I – and by marrying his bride, the great-granddaughter of Karl I of Austria, he has reunited the former Imperial House of France and the House of Hapsburg once again." 
  france.188.o1:0 "Bringing two houses together"
  france.189.t:0 "The Fate Of Communism"
  france.189.d:0 "Its time we choose what we do with the far left parties. Do we allow some to operate or do we ban it completely?" 
  france.189.o1:0 "Moderate Factions Can Operate"
  france.189.o2:0 "Ban The Left!"



#NEW FRANCE TREE EVENTS######
france.190.t:0 "Releasing The Visitors"
france.190.d:0 "Until recently the people of France were sent to the gulag in response to their crimes against the state such as criticizing the government and speaking out against the socialist ideology. Now with new reforms taking place under Melenchon, the reformer has ordered people guilty of minor crimes to be released and show the world that France is changing for the better." 
france.190.o1:0 "We Gotta Start Somewhere!"
france.191.t:0 "The Coup"
france.191.d:0 "In the early hours of the morning communist hardliners ordered some members of the army to take up arms and take over government buildings in Paris and other cities across the state. As tanks and soldiers took to the streets so did those who supported Melenchon.\n\nAs the sun rose over France, the streets were left in disarray with shots being fired and groups of people fighting with hardliner soldiers. Melenchon has spoken directly from his home ordering the army to stand down and ask the people to rise up and fight for their freedoms!" 
france.191.o1:0 "The People Fight Against Their Government"
france.191.o2:0 "Melenchon Has Been Restored To Power"
france.191.o3:0 "The Harderliners Put Down The Protesters"
france.192.t:0 "The Second Revolution"
france.192.d:0 "As the people took to the streets and marched for their newfound freedom, there were fired at by the army and police. The protests turned into riots as people fought against the armed hardliners forcing the country to descend into civil unrest. Paris became a battleground against rioters and armed forces while the government hardliners ordered the people to stand down. Melenchon on the other hand welcomed the people rising up encouraging them to fight and stand for their freedoms!" 
france.192.o1:0 "The French People Have Risen"
france.193.t:0 "The People Save Melenchon"
france.193.d:0 "As the hardliners took to the streets so did the people, and the army. Although the majority of the army stood with the people and Melenchon, the army ordering the traitors to stand down and quickly raiding the hardliners headquarters arresting them and putting down those who tried to fight against the people.\n\nMelenchon quickly arrived at the communist politburo speaking to the congress how delicate the situation is in France and how we all must act now to avoid another civil war and allow unelected leaders to take over and destroy the future of the French state." 
france.193.o1:0 "Freedom Remains"
france.194.t:0 "The Hardliners Take Over"
france.194.d:0 "Raids were taken on Melenchons house as he was arrested in the early hours of the morning as those loyal to Melenchon in the politburo were also taken away from their positions in government. The hardliner liners took control of the streets ordering the army take over and place the country into martial law before the people were able to find out what was going on. Once in control of the country, the hardliners entered the congress announcing that the radical Melenchon has been removed and peace and stability has once again been restored to the communist state." 
france.194.o1:0 "Freedom Has Fallen."
france.195.t:0 "The Yellow Vest Riot – Reims"
france.195.d:0 "“Down with Communism!” Became a popular chant as 4,000 men and women of various different construction units marched towards the center of the city. They were hurt, not just physically but mentally. For years the government, who has preached protecting the worker, has instead ignored their plight. They were taken for granted, and it was time to show those in the Politburo that the worker would not be ignored.\n\nIn what would be called a pivotal moment of the revolution, as rioters moved towards the “Hotel De Reims Police” with their improvised weapons, a police chief gave warning, that if the rioters were to advance one more step, the police would open fire. A few moments later, Eric Drouet became the first officially recognized casualty of the revolution.\n\nThe crowd did not back away from this. They charged the station and while hundreds fell, hundreds more were ready to take their place. They overran the barricades and slaughtered the officers present. Shouts could be heard from every corner spouting “La Revolution begins” or “Le Proletariat rises today!”. They would occupy the police station and several key government offices in the city, until the 58th infantry, showed up. It was from here that the remainders of those who stayed surrendered to military forces." 
france.195.o1:0 "The People Rise Up."

france.196.t:0 "The Destruction Of The House Of Commons"
france.196.d:0 "As apart of tearing down English landmarks, and ultimately the erasure of the Englsh culture. The Imperial French ship “Aquitaine” launched several high explosive shells towards the remnant of the House of Commons.  While dangerous, French colonial authorities had evacuated the area well before hand giving the Aquitaine free reign to fire upon the neighborhood without worry of a massacre.\n\n4 HE (high explosive) shells later, the western wing of the House collapsed. With the North side collapsed from previous conflict, the Aquitaine only had two more sides to finish off. With a combined total of 15 more shells, the remainder of the house collapsed with only Big Ben remaining standing. Instead of the Aquitaine finishing this off, the French Colonial authorities authorized a bombing run from the 14th Air Wing.\n\nAt approximately 6 pm CEST, the jets circled Big Ben spewing the colors of the French flag from their exhaust ports before making a run on the building. Two precisely aimed rockets hit the base of the building and with that the clock fell. Not before striking its bell one last time on the way down." 
france.196.o1:0 "London Has Fallen."
france.197.t:0 "The Actions Of The Coup"
france.197.d:0 "After taking back control of the situation in the state, its time to decide the outcome of those who have risen against us, do we imprison those traitors for the rest of their miserable lives or due to their disgusting acts, shall we remove them from the state completely?" 
france.197.o1:0 "Imprison Hardliner Coup members"
france.197.o2:0 "Execute Hardliner Coup Members"
france.198.t:0 "The Actions Of The Coup"
france.198.d:0 "After taking back control of the situation in the state, its time to decide the outcome of those who have risen against us, do we imprison those traitors for the rest of their miserable lives or due to their disgusting acts, shall we remove them from the state completely?" 
france.198.o1:0 "Imprison Hardliner Coup members"
france.199.t:0 "Students protest across the country"
france.199.d:0 "Students who’ve grown up under the tyranny of the old regime have left the classrooms and marched to the streets. They’re protesting everything from a lack of proper education funding to the exorbitant gas prices many of them face at the pump. There dorm rooms have become makeshift barracks and medical centers while their classrooms have become areas to plan.\n\nWithout the support of the impressionable youth, how can the French government survive? Will the students seek to impose their own version of communism on the revolution? Or will they fall into line behind their wiser counterparts?" 
france.199.o1:0 "Threat Level is now yellow"
france.200.t:0 "Military members defect to hometown militias"
france.200.d:0 "While defections from the military are nothing exactly new, they have been ramping up in recent days and weeks. Originally only reports of low level soldiers defecting had come through the Chairmans office, but with each day the ranks of the defectors only increased.\n\nWhile not exactly being reported, many spies have been placed within unit barracks in an effort to dissuade others from leaving. This strategy has only had a small impact with reports of some generals even leaving. When found, they usually are embedded within the terrorist militias of their hometown." 
france.200.o1:0 "Threat Level is now orange"
france.201.t:0 "Military defectors form militias"
france.201.d:0 "Going above community loyalty, entire military squadrons have defected or gone rogue. Reports coming out of the south describe roadside ambushes and camps being set up in deep forest compounds. Food trucks are immediately ordered to stop movement into the region of Aquitaine as fighting there has broken out between both governmental forces and rebellious groups.\n\nMartial law has been declared for more than half the country with little success of regaining control of any major population center. Tolouse has apparently been overrun by Islamist forces made primarily up of Libyan Refugees." 
france.201.o1:0 "Threat Level is now red"
france.202.t:0 "Jean Christophe returns"
france.202.d:0 "While not being raised in France, the young business Mogul has found his way into the legacy of his namesake. Being welcomed into Nice by a crowd of civilians, Jean Christophe has formally taken charge of the rebellion. Both Emmaneul Macron and Marine Le Pen swore their forces to the young Emperor.\n\nIn a brief televised speech, Jean Christophe Bonaparte announced that the rebellion will not be one of public executions or terror as in the countries past, but instead he urges the rebellions forces to move in a peaceful way. “We come to liberate you from the horrors of the communard regime, not to replace it with another form of tyranny”. He had said." 
france.202.o1:0 "The True Leader Returns"
france.203.t:0 "Revolutionary Guard Briefing 081"
france.203.d:0 "Spies within the southern conflict region have seen a unifying force rally the conflicting militias. Less than a week ago, the forces loyal to Emmanuel Macron were engaged in combat with the forces of Marine Le Pen and Alain Soral. Since then, the many forces have united under one with them proclaiming loyalty to the bourgeoisie leader, Jean Christophe Bonaparte.\n\nIn a brief address to the citizens of Nice and most of the surrounding towns, the terrorist proclaimed the beginning of a new French Revolution, and his intent to overthrow the rightful Communard regime. Bonapartes whereabouts are unknown, but it is believed he has temporarily taken up residence in Monaco once again." 
france.203.o1:0 "Upper leadership have ordered his capture. As of now he is public enemy no.1."
france.204.t:0 "Revolutionary Guard Briefing 082"
france.204.d:0 "Spies embedded within the Knights Templar terror group have reported that the leader, Alain “The Archangel of Christ” Soral has denounced a potential alliance with Jean Christophe Bonaparte. In a short statement, they describe the anger that Soral has, calling Bonaparte a “islamist puppet”. While we have no information to prove that statement. The Guard believe that this can be exploited. Perhaps we can turn Soral and Bonaparte against one another while the revolutionary guard trains new regiments." 
france.204.o1:0 "Crisis Returns To France"
france.205.t:0 "The Italians send Medical Aid to civilians"
france.205.d:0 "Horrified by the mounting civilian casualties in the ongoing French internal conflict, the Italian government has authorized the passage of Red Cross supplies into the Rebel and Communard controlled areas. Both sides have signed an agreement to not fire on the medical convoys in the interests of their civilians. While domestic conflict still rages on in many parts of the country, the world applauds the passage of medical supplies and hopes to see a ceasefire soon." 
france.205.o1:0 "Peace can be achieved"
france.206.t:0 "The Irish Accept French Refugees"
france.206.d:0 "With conflict pushing further in the north of France, so to have the number of refugees increased in number. To help combat the strain on the UK, the Irish government has announced a revitalization of abandoned districts in some of its cities. With this, they have announced that 25,000 refugees will be able to apply for temporary Irish citizenship along with a refugee status until the current conflict comes to an end. While not exactly set up, the cities of Dublin, Cork, and Galway are expected to be flooded with refugees within the next coming days. " 
france.206.o1:0 "Praise be unto the Irish soul"
france.207.t:0 "The Battle of Poitiers"
france.207.d:0 "One of the biggest battles of the Revolution took place in Poitiers. What originally started as a two-front conflict with Bonapartist forces pushing Communards towards the city center evolved into a three-way bloodbath as Alain Sorals Knights Templar opened fire on both forces. With casualties mounting both the Communards and Bonapartists retreated, temporarily handing the city to the Templars.\n\nIn what historians call the turning point of the war, both the Bonapartist and Communard Forces collaborated to end the Templar forces once and for all. When the battle was ended, the Communard forces defected to the Bonapartists and vowed to march on Paris when the time came." 
france.207.o1:0 "History In The Making"
france.208.t:0 "Toulouse Surrenders peacefully"
france.208.d:0 "Continuing the push towards Paris, Bonapartist rebels marched towards the heavily fortified city of Toulouse expecting a battle similar to Poitiers. Instead, to the surprise of the battalion commanders, and to the world as a whole, the garrison of Toulouse surrendered without firing a single shot. When inspected, it was obvious that the garrison had not received a supply shipment for weeks. Many of their best fighters had either defected or were imprisoned for treason.\n\nAfter surrendering, the Communard forces had their weapons replaced with a hot meal. Some even went as far as defecting from the communard forces and pledging their life to Jean Christophe Bonaparte." 
france.208.o1:0 "Bonapartes Support Grows"
france.209.t:0 "Democratic Militia supporters sabotage the Toulon naval yards"
france.209.d:0 "The Toulon Naval Yards which up until now have housed and supplied the French Mediterranean fleet. Being responsible for a blockade of Rebel controlled ports, and supplying several battle groups, the yards were destroyed beyond repair. Democratic militia members planted bombs at many of the key supply holdings and ship repair facilities and then once the yards were evacuated, the bombs were detonated and the ships in the bay were slowly sinking. With this comes the ultimate surrender or defection of the Mediterranean fleet with one squadron of Destroyers making their way towards the Black Sea." 
france.209.o1:0 "France Grows Worse Each Day"
france.210.t:0 "Grenoble Hosts the Bonaparte Heir"
france.210.d:0 "“God, I look ridiculous”, Jean-Christophe thought. Staring in the mirror he was uncomfortable in the old Napoleonic uniform. Ever since taking control of this rebellion, he was constantly shoved into the limelight of the camera, usually in some antiquated uniform. As he waited for his aid to summon him from his room of the hotel, he read over the reports of the conflicts raging across the country and international response. “Merde, if Trump pledged support, we could’ve ended this a week ago.”\n\nSuddenly a knock on the door woke him from dissociation. “My Emperor, the cameras are ready when you are.” His aid said from the doorway. “Alright, lets get this ceremony over.” He said. Getting up out of the chair, he got one last look in the mirror, straightened his hat and sword, and then walked out to the sea of flashing cameras and lights.\n\nMedia companies from all over the world, Soviet and Free alike were in Grenoble to witness the surrendering of the city to the Bonapartist rebels. In the hotel atrium stood the city’s mayor with a contingent of beaten but still alive Communard soldiers. When Jean Christophe approached, the mayor outstretched his hand and said “My Emperor on behalf of the city of Grenoble, the 48th garrison forces, and the proletariat collectives of the 10th industrialized region, I hereby surrender.” It was as theatric as Christophe expected.\n\n“Mr. Mayor, on behalf of the French Empire in exile, the Bonaparte family, the Democratic Coalition of Forces, the Anti-communist forces of France proper, the Catholic church, and the future French government, I accept your surrender and thank you for surrendering your beautiful city. As I had said when I first began this journey, I do not aim to execute anyone or become a new tyrannical leader, but instead I aim to bring France into a new age.” Turning to the cameras he continues “I only hope that the rest of the French whether they sought safety abroad, or whether they remain on the homeland can see the example that you have made. I hope that in the coming weeks, months, or even years, when this rebellion is over that we can meet once again.”\n\nAnd with that, Jean Christophe Bonaparte entered the city an enemy, and left it a protector." 
france.210.o1:0 "A New Chapter Of French History Created"
france.211.t:0 "Lyon falls to the Bonapartist rebels."
france.211.d:0 "Nearing Paris, the Bonapartist rebels were able to overtake the defenses of Lyon. While hoping for a Toulouse situation, the garrison of Lyon was determined to hold out in hopes of reinforcements. They never came. Instead, within an hour of the first shots being fired, Lyon City Hall was under rebel control and many soldiers abandoned their post, fleeing the city on foot." 
france.211.o1:0 "Lyon Is Now In The Hands Of Freedom Fighters!"
france.212.t:0 "Paris comes under siege from rebels." 
france.212.d:0 "Outside of Paris, Jean-Christophe next to Marine Le Pen and Emmanuel Macron demanded the surrender of the PCF leadership and for the military to standdown. They were met with gunshots from a sniper, injuring Macron and nearly hitting Ms. Le Pen. In the initial chaos, it is known that several high-ranking leaders of the government fled to the cities airport and bribed their way onto flights going to the German Peoples Union and inevitably the Soviet Union. For now, the city remains under siege as forces continue making their way towards the city’s center of government." 
france.212.o1:0 "The Communist Flee"
france.213.t:0 "French Leadership surrenders Paris"
france.213.d:0 "After surrounding the Palace of the Proletariat, Jean Christophe Bonaparte demanded the surrender of the last PCF holdouts. Andre Gaudillo left the safety the building and met with Jean Christophe formally surrendering the French government into his hands. Many around the world applaud Gaudillo for the peacefully ending the war and saving a major architectural piece of French history.\n\nWhile small groups still hold out, the war is over for the French people and the spectre of communism is gone. Former Chairman Gaudillo has been exiled from the country preferring to seek political asylum in the Republic of Hawaii while Jean Christophe and the democratic coalition are deciding on whether to restore the French monarchy or move towards a bright future of Democracy." 
france.213.o1:0 "The Civil War Is Over"
france.214.t:0 "Jean Christophe announces creation of Monarchy"
france.214.d:0 "After a short time of deliberation and negotiation, the Democratic Coalition has announced that Jean Christophe Bonaparte will be crowned Emperor of France. Seeking not only to create a new power in the world, but the government will also be a constitutional representation of the people with Christophe acting in the position of both Prime Minister and Royal representative of the people.\n\nFollowing this declaration, many of the old royal families have announced that they will return to the French mainland once again and that they look forward to cooperating with the new government. Already, it has been announced that a coronation will take place at Versailles in a few weeks’ time." 
france.214.o1:0 "The King Takes Control Of France"
france.215.t:0 "Provisional Government forms in Paris"
france.215.d:0 "After a short time of deliberation and negotiation, the Democratic Coalition has announced that they will be returning democracy to the French mainland with many of the coalition leaders forming their own political parties. While condemned by the Soviet Union and remainder of the Warsaw Pact, places like Canada are already in negotiations for trade deals with the new French government. Elections will take place after a brief rebuilding period, and until that time, campaigning will be taking place across the country." 
france.215.o1:0 "Democracy Returns To France"
france.216.t:0 "Its Time To Choose Who Shall Lead The People"
france.216.d:0 "" 
france.216.o1:0 "Marie Le Pen"
france.216.o2:0 "Emmanuel Macron"

 rebel.93.t:0 "The Siege of New York"
 rebel.93.d:0 "“Good evening and Welcome to the CBC, My names Mark Swain. Looking to our southern border, we’ve been covering the Civil War ravaging the American Peoples Commonwealth for quite some time now. It’s brought thousands of refugees to our borders and created a once in a century crisis. However, in a diplomatic move from both sides, one of our very reporters, Ms. Diana Swain is on the ground in the embattled New York city. How’re you and the crew doing Diana?”\n\nThe television screen switches over to a city on fire, with a middle aged woman ducking behind a cement wall.\n\n“Mark, this is not the same New York many of us know. For three days now democratic rebels have slowly pushed their way into the city. Civilian casualties are estimated to be in the hundreds of thousands, with many civilians in low income areas joining the Rebels. As we speak, Queens and Chomsky Plaza on the East Side are firmly under democratic control.”\n\n“Diana, have you been shot at?” Mark asks with concern\n\n“Mark, more times than I can count. From what I can tell most of the fire has come from Commonwealth forces who mostly likely believe we’re rebel forces. Mark, the situation here is not improving. Commonwealth forces are launching chemical attacks from the 5/1 attack rubble, Rebels seem to be at a disadvantage.”\n\n“Can you explain more of what you’ve seen?”\n\n“For now, I haven’t seen much. Civilians have taken to the subways, but some of those tunnels have collapsed. Just yesterday, Rebels asked for a temporary ceasefire in an effort to provide aid to the civilians stuck in the middle of combat but I have yet to see if Commonwealth forces will agree. On the civilian side, I’ve seen Chomsky plaza turned into a makeshift market for civilians and soldiers alike, it seems to be a neutral ground for both sides. Lastly,..”\n\nGunshots ring out and the camera goes black.\n\n“Diana!..Diana!!!.. folks it appears Diana has lost her connection with the studio. I am being told we’re going to commercial.”"
 rebel.93.o1:0 "New York Has Fallen.."



##Italy###
 italy.152.t:0 "The Return Of The Empire"
 italy.152.d:0 "In a surprise turn, the Roman Empire has conquered Europe save for a few countries. The expert work of the reformed legions and the work of the Imperator have guaranteed a new Roman Hegemony, one to rival any other power in the world. Semper Roma!!!"
 italy.152.o1:0 "Roma Lives"






 news.315.t:0 "The Third Kaiserreich Book releases"
 news.315.d:0 " For fans of Robert Seldon’s Kaiserreich series, today is practically Christmas. Seldon, who wrote Kaiserreich and Kaiserstate, announced late 2009 that his final book would be released that year, continuing the stories of fictional characters like the Royal American Family “The Nortons”, a communist England, and a monarchist France. While critically acclaimed, and winning an Asimov award in 2000, the series has been called not historically plausible, fans have fallen in love with characters like Jeremiah Quentin, a quaker medic from the Republic of New England.The third book, named “Kaiserworld” brings Seldon’s anthology to an end, with the last story taking place in 2005. According to Seldon himself, this will show the futility of fighting over ideological differences when humans should come together in peace, and that this book represents his views on the world.This book, according to the synopsis will deal with the death of Emperor Norton IV, and the inevitable clash between the Royal Canadians and Boris Johnsons syndicalist England. Along with this, the reader is expected to see real world political figures like Bernard Sanders and Donald Trump come into play. Look for it wherever you get books on September 9th."
 news.315.o1:0 "We Cant Wait To Read This!"
 news.316.t:0 "Apple unveils the new iPhone"
 news.316.d:0 "At their Sydney HQ in Australian, The touchscreen handset will combine internet access and iPod music with a built-in 2 megapixel digital camera and video playback features. The handset dispenses with buttons, in favour of a powerful screen that responds to touch. The iPhone also shows album artwork and functions as a personal organiser. It has a proximity sensor that automatically deactivates the screen and turns off the touch sensor when the device is raised to a user's face. The battery life of the phone will allow five hours of talk time, video and browsing, and 16 hours of audio playback. A 4Gb model will be available for 499 dollars and an 8Gb model for 599 dollars."
 news.316.o1:0 "The wonder of technology!"
 news.317.t:0 "VideoWire Bought"
 news.317.d:0 "Firefox is buying video-sharing website VideoWire for 1.65bn dollars (883m pounds) in shares after a weekend of speculation that a deal was in the offing. VideoWire, launched in February 2005, has grown quickly into one of the most popular websites on the internet.It has 100 million videos viewed every day and an estimated 72 million individual visitors each month."
 news.317.o1:0 "Time For Better Entertainment"
 news.318.t:0 "Queen Opens up for Refugee Charity Concert"
 news.318.d:0 "The dark stage lights up to show a small piano, and a man in an iconic yellow jacket sitting at it. A familiar tune plays and the crowd begins to sing “Mama..just killed a man!”. In that moment, 2010 became the year of Queen. Freddy Mercury, whose parents came to the UK as Zoroastrian refugees, decided to come out of retirement with the rest of Queen and open up for the 2010 Live Aid concert. With an estimated 4.5 million in the stadium alone, Mercury opened up with a classic many remember “Bohemian Rhapsody”. He quickly spiraled into the next song “Don’t stop me now” which is even said to have had Her Royal Majesty Queen Elizabeth singing along from the stands. Queen was not only being sung in the stadium, but as the concert was being broadcast all across the West, its estimated hundreds of millions, maybe even more than 1 billion people we’re at their tv’s watching that man strut across the stage. If they didn’t tune in for Queen, they came for Mick Jagger and the Rolling stones who came after."
 news.318.o1:0 "Lets Save The Reguees"
 news.319.t:0 "Concorde II takes flight"
 news.319.d:0 "After quite a few technological setbacks and mishaps, the Concorde II has finally taken flight. Getting rid of the problems that it faced before hand, such as thin metal (let us not forget the 2000 accident) the Concord II still maintains its sleek and ingenious design. Being able to reach supersonic speeds, many predict the second variation of the Concorde line will revolutionize the air travel industry."
 news.319.o1:0 "The Age Of Air Travel Gets Better!"
 news.320.t:0 "Her Majesty wins Person of the year in time magazine"
 news.320.d:0 "“Who better to win times Person of the Year than Her Royal Majesty Queen Elizabeth. Citing her humanitarian donations and work improving the lower classes of England, her royal majesty got her photo taken late in the afternoon after being declared “Person of the Year”. Among controversy, many saw Donald Rumsfeld or Giorgio Napolitano as winners of this due to their responses of humanitarian crises."
 news.320.o1:0 "Congrats Your Majesty"
 news.321.t:0 "The new Ford Fiesta is released"
 news.321.d:0 "History has been made! The amazing new Ford Fiesta has become the worlds first electric car. Initially just going to be a feature, the electric car has made its debut across the world with many green thumbed people lining up to by the car. With an expected range of 350 miles before needing a charge, people are calling this one of the most eco-friendly cars."
 news.321.o1:0 "A Green Car Industry!"
