 britain.507.t:0 "2011 Liberal Democrat Leadership Election"
 britain.507.d:0 "Having failed to secure a parliamentary majority in the most recent general election, the leadership of the Liberal Democrat Party has been called into question. Running against the incumbent leader is Navnit Dholakia, the former whip of the Liberal Democrats from 1997 to 2004 and a lifelong activist in the promotion of racial equality, police and penal reform. As an Indian, Dholakia has attracted support from many of the party's ethnic minorities who see him as their best chance to alter the party and the nation's stance towards matters of race. Alongside Dholakia, Sarah Teather has also gained significant support from the party. Being the only woman on the ticket, and the youngest, her supporters view her as a fresh start for the Liberal Democrats allowing for the party to find itself once again and move beyond decades of failure. Focusing much of her career on the promotion of education and welfare rights, Teather has attracted some left-leaning Liberal Democrats with many hoping this will siphon voters from the Labour Party at the next election. However, some believe that despite his failures at the general election Nick Clegg should remain the party's leader, yet some are more sceptical, believing that this is the beginning of a new Liberal Democrat Party."
 britain.507.o1:0 "Nick Clegg"
 britain.507.o2:0 "Navnit Dholakia"
 britain.507.o3:0 "Sarah Teather"
 britain.508.t:0 "2014 Liberal Democrat Leadership Election"
 britain.508.d:0 "Having failed to secure a parliamentary majority in the most recent general election, the leadership of the Liberal Democrat Party has been called into question. Running against the incumbent leader is Tim Farron, a relatively new member of the party, who has spent his career advocating for a more liberal Britain focusing on a revitalized economy that would prioritize the environment, easier access for migrants to Britain from across the free world and the legalization of marijuana. Farron has described himself as a centre-left candidate, with many hoping this will once again translate to a loss for the Labour and Independent Labour Party. Alongside Farron, Sarah Olney has also gained traction within the Liberal Democrat Party. Similar to Farron, Olney has been an outspoken supporter of a green Britain believing that the nation must revitalize its economy to focus on the preservation of both the environment and the wellbeing of the planet. Unlike other members of her party, Olney has also been an advocate for Britain to expand trade across the globe and secure healthier relations with Britain’s European neighbours. However, despite their failure at the general election, some believe that the party's leader should remain and succeed in 2017."
 britain.508.o1:0 "Keep the incumbent"
 britain.508.o2:0 "Tim Farron"
 britain.508.o3:0 "Sarah Olney"
 britain.509.t:0 "2017 Liberal Democrat Leadership Election"
 britain.509.d:0 "Having failed to achieve a parliamentary majority at the most recent general election, the Liberal Democrat Party has successfully called for a leadership contest bringing the parties future into question. Running against the incumbent leader is Jo Swinson, a well-known face within the party having been a member since she was seventeen. As an advocate for votes at sixteen, Swinson has attracted a large portion of the youth vote as well as the vast majority of the women’s vote who see her as an ideal candidate to represent the rights of mothers across Britain. Alongside Swinson, Luciana Berger has also gathered much support from within the party. As a woman of Jewish heritage, Berger has clung to this identity throughout her time as a Liberal Democrat member strongly following the Jewish teachings of “Tikkun Olam”. It is this desire to “repair the world” that has placed her at the forefront of the election, with many seeing her as the ideal candidate to counter the growing tensions across the world and heal the political divides within Britain. However, some believe that despite their failure at the general election the incumbent will manage to maintain their position as the leader of the party and win a decisive victory for the Liberal Democrats in 2020."
 britain.509.o1:0 "Keep the incumbent"
 britain.509.o2:0 "Jo Swinson"
 britain.509.o3:0 "Luciana Berger"
 britain.509.t:0 "2021 Liberal Democrat Leadership Election"
 britain.509.d:0 "Having failed to achieve a parliamentary majority at the most recent general election, the Liberal Democrat Party has successfully called for a leadership contest bringing the party's future into question. Running against the incumbent is Ed Davey, a man of the centre-right. Davey is committed to the free-market, deregulation and privatization of vital industries. As the most right-leaning candidate Davey has stated his aims to divide the Conservative Party and siphon votes away from them whilst remaining committed to the Liberal policies the party adheres to. However, Davey has been challenged by Layla Moran, a newcomer to the front of the Liberal Democrats. Having stood in elections since 2010, Moran has recently seen a rise to prominence due to her appointment to the Public Accounts Committee. Her staunch liberal values have made her a prime candidate for the leadership, but her youth and inexperience within front bench politics has raised many questions about her qualifications for the job. Despite the challenge to their leadership, the incumbent remains hopeful that their position as leader of the Liberal Democrats is secure and that they can lead the party to an electoral victory come 2023."
 britain.509.o1:0 "Keep the incumbent"
 britain.509.o2:0 "Ed Davey"
 britain.509.o3:0 "Layla Moran"

 britain.510.t:0 "2011 SDP Leadership Election"
 britain.510.d:0 "With the assassination of David Owen and the general election being the first loss for the Social Democrats since their rise to power in 1991, the party has called for a leadership election to determine its future. Running against the incumbent Shirley Williams is Charles Kennedy, a former member of the Liberal Democrats who joined the party soon after the 1995 general election. As a well-known face amongst the public, many in the SDP believe his popularity will win over the electorate and return them as the leading party. Kennedy is a committed anti-war politician, believing that Britain should remain focused upon itself and its allies, promoting peace across the world. However, as a recovering alcoholic, his critics worry that a position of power may cause a relapse. As well as Kennedy, Chris Huhne has also challenged Shirley Williams. Huhne is well known amongst the Social Democrat base, with many knowing him from his part-time writings for the Guardian. A champion of nuclear energy and electoral reform, Huhne has stood out as the candidate to move the SDP beyond the legacy of Owen and modernize the party. However, some believe that Shirley Williams will maintain her leadership and continue the legacy of Owen into the next general election."
 britain.510.o1:0 "Shirley Williams"
 britain.510.o2:0 "Charles Kennedy"
 britain.510.o3:0 "Chris Huhne"
 britain.511.t:0 "Resignation of Shirley Williams"
 britain.511.d:0 "Having successfully led the party at the side of David Owen since 1995, Shirley Williams has today called a meeting of the Social Democrat Party where she will announce her resignation as both party leader and a member of the House of Commons. The eighty-three-year-old, mother of the House, has served as a member of parliament since the conception of the original Social Democrat Party in 1981 and now, as she nears her late eighties, has decided to step down and allow the party to evolve past the guidance of the old “Gang of Four”. Her announcement has not only affected the SDP, as members from each of the mainstream political parties have thanked her for her years of service. Despite her announcement, Williams has ensured her party that she will remain active in party politics, continuing to campaign with the SDP for as long as she lives. Already the former leader has begun writing her memoirs, where she will detail the rise of the SDP from its original four members to the “party of Britain”. In her place, it has been announced that she will remain as the temporary head of the SDP before the party holds a leadership election later in the year. With candidates such as Vince Cable and Julia Goldsworthy leading the polls, a new age for the SDP has begun."
 britain.511.o1:0 "The end of an era..."
 britain.511.t:0 "Resignation of Shirley Williams"
 britain.511.d:0 "Following her unsuccessful election as party leader soon after the loss of the 2010 general election, Shirley Williams has today announced her resignation as a member of the House of Commons. The eighty-three-year-old mother of the House has served as a member of parliament since the formation of the original Social Democrat Party in 1981 and now, as she nears her late eighties, has decided to step down and allow the party to move beyond her and the Gang of Fours legacy. With the leader of the SDP congratulating her for her decades of service the House of Commons has today come together for a brief moment to applaud the aged politician thanking her for her dedication to her country. Despite her announcement, Williams has ensured her party that she will remain active in party politics, continuing to campaign with the SDP for as long as she lives. Already the former leader has begun writing her memoirs, where she will detail the rise of the SDP from its original four members to the “party of Britain”. With her replacement already preparing to take over in her constituency, a new age for the SDP has been cemented as now all members of the original Gang of Four have left the Commons."
 britain.511.o1:0 "The end of an era..."
 britain.512.t:0 "2014 Social Democrat Leadership Election"
 britain.512.d:0 "With the loss of the Gang of Four from front bench politics, the party has now begun to restructure itself and its leadership. However, even after the 2011 leadership election this rebranding of the party has failed and once again the Social Democrat Party has called another election to determine the future of the party. Running against the incumbent is Vince Cable, one of the more right-wing leaning candidates Cable has been a keen advocate of the privatisation of Royal Mail, to aid in the recovery of the economy. With much of Cable’s support coming from the centre-right of the party many are hopeful that temperate Conservatives would be willing to support him and regain the SDP a majority. As well as Vince Cable, Julia Goldsworthy has also gathered a significant amount of support. Much younger than her opposition, Goldsworthy has been described as a staunch liberal with her ideological hero being former Liberal MP David Penhaligon. Believing in a fairer Britain, Goldsworthy aims to reform the SDP to become one that truly works for all aiming to lower tuition fees and further funding the NHS. However, the incumbent is convinced they have the party’s confidence and remains committed to winning both the leadership challenge and the 2017 election."
 britain.512.o1:0 "Keep the incumbent"
 britain.512.o2:0 "Vince Cable"
 britain.512.o3:0 "Julia Goldsworthy"
 britain.513.t:0 "2014 Social Democrat Leadership Election"
 britain.513.d:0 "When Shirley Williams stepped down earlier in the year Norman Lamb promised to hold an official leadership election. Now, with campaigning for the 2014 general election soon to begin, the leadership election has officially been called. Norman Lamb aims to retain his position as leader of the party, but two others have gained significant support from within the SDP. Vince Cable has been a keen advocate of the privatisation of Royal Mail, to aid in the recovery of the economy. With much of Cable’s support coming from the centre-right of the party many are hopeful that temperate Conservatives would be willing to support him and regain the SDP a majority. As well as Vince Cable, Julia Goldsworthy has also gathered a significant amount of support. Much younger than her opposition, Goldsworthy has been described as a staunch liberal with her ideological hero being former Liberal MP David Penhaligon. Believing in a fairer Britain, Goldsworthy aims to reform the SDP to become one that truly works for all aiming to lower tuition fees and further funding the NHS. However, Lamb is convinced he has the party’s confidence and remains committed to winning both the leadership challenge and the 2017 election."
 britain.513.o1:0 "Norman Lamb"
 britain.513.o2:0 "Vince Cable"
 britain.513.o3:0 "Julia Goldsworthy"
 britain.514.t:0 "2017 Social Democrat Leadership Election"
 britain.514.d:0 "Having failed to secure a parliamentary majority in the most recent general election, the leadership of the Social Democrat Party has now been called into question, with enough of the party having lost faith in the incumbent to initiate a leadership election. Running against the incumbent is Chris Leslie, a centre-left politician with much to offer the party due to his youth and experience within parliament. As one of the more progressive voices in the SDP, his loyalty to the party has been called into question with many fearing he will leave to join the Labour Party. However, such rumours are constantly shot down by the potential leader. As well as Chris Leslie, Jess Phillips has also gained support from within the party as a potential candidate for leadership. As a staunch feminist, Phillips remains committed to improving the lives of women across Britain promising to focus on fighting sexism and patriarchal structures wherever they rear their ugly head. Much like Chris Leslie, Phillips identifies as a centre-left politician. However, unlike Leslie, her loyalty to the party has not been brought into question. Despite this challenge, the incumbent remains hopeful that they will win over their party’s support once more and win the 2020 general election."
 britain.514.o1:0 "Keep the incumbent"
 britain.514.o2:0 "Chris Leslie"
 britain.514.o3:0 "Jess Phillips"
 britain.514.t:0 "2021 Social Democrat Leadership Election"
 britain.514.d:0 "Having failed to secure a parliamentary majority at the most recent general election, the leadership of the Social Democrat Party has been called into question. Running against the incumbent is Angela Smith, originally a member of the Labour party in her early teenage years, the now centre-left politician aims to take the party back to how it was seen by the people in the mid-nineties. Running on a campaign of increased funding for both the NHS and schools across Britain, Smith aims to regain the support of the British people by returning to the SDP’s roots. As well as Angela Smith, Margaret Hodge has also announced her candidacy for leadership and has gained a significant following from within the party. As a secular Jew, Hodge has campaigned tirelessly to promote a more tolerant and welcoming society in Britain. However, such campaigns have been undermined by comments made back in 2006 about prioritising British families over immigrants for council house waiting lists which gained unnecessary praise from the BNP. Despite this, Hodge remains committed to making a fairer Britain for all within its borders. However, the incumbent remains hopeful that they will win over their party’s support once more and win the next general election."
 britain.514.o1:0 "Keep the incumbent"
 britain.514.o2:0 "Angela Smith"
 britain.514.o3:0 "Margaret Hodge"


