 lin.10.t:0 "Spencer's America"
 lin.10.d:0 "“It’s quite the accomplishment,” Spencer stated, overlooking D.C from the oval office. “We’ve made it, America is ours, but it's not secure. There are still dissidents that wish for our race, our dream, to fail, the economy is in shambles and foreign nations won't take nicely to our rise to power, we must secure our border and keep our troops on high alert.” “Sir if i may,” Timothy spoke up, “We’ll handle these problems sir, you should however take a moment to relax, we won, we'll begin the rebuilding process. We are unstoppable, no one will be able to stop us now.” “Your right, alright Timothy you begin rooting out dissidents, weaver you begin reenforcing the armed forces and Matthew you begin reorganizing the economy, we will be ready for anyone else that dares to oppose us. Seig Heil!!” “Seig Heil!!”"
