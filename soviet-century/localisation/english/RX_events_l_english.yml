 lin.25.t:0 "Unawnsered Questions"
 lin.25.d:0 "The various minortie group that occupy our great land, primarily the black, asain and latino groups, offer the most organized and significant resistance. We have a couple solutions to this, we can either force them all into work camps and work them to death, we can simply deport them back to their homelands, or more debated amongst the staff is the intergration of certain sets of the minorities, primarily the asains as they have always been more at odds with the others than us."
