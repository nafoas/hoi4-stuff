 texas.104.t:0 "The Empire Rises"
 texas.104.d:0 "“Good evening and welcome to the newly formed Fox News broadcasting out of the Capital. In today’s major news, Celebrations break out all across the country as the Burr family proves themselves worthy of the American name. In the newly reunited nation, a feat which many said was impossible, our Monarch has moved into the newly constructed grand Palace, nicknamed Aaron’s palace. According to the royal family, today shall be considered a national holiday, comparable to that of the 4th of July. Hail to the Burrite Empire.” "
 texas.104.o1:0 "What Now?"

 texas.114.t:0 "The Texan Situation"
 texas.114.d:0 "With the election of republican governor Bill Clements in 1987 just before Reagan's declaration on the end of the United States, Clements l was left with a difficult situation on the future of the newly independent Texas. Forming a coalition with the many of the Texan Right Wing, forming the One Republic Coalition. A coalition whose sole purpose was the stabilization and success of the new republic. Things were initially going well as New Mexico had voted to join the Republic of Texas out of mutual defense. This initial expansion was short lived as after a series of anti-Hispanic race riots accord Mexico launched a military intervention into Texas, during the 2 month conflict mexico managed to take southern texas and the western half of new mexico before being halted by a fighting force consisting of a mixture of the Texas Rangers, the Texan National Guard, the New Mexico Mounted patrol, various local police and swat teams, and a bounty of private militias. The resulting peace agreement between the two resulted in Texas losing the western New Mexico and Southern texas. While Clements managed to hold onto the presidency for 2 more elections, he refused to run again in 1998 resulting in Rick Perry becoming the new candidate and subsequently the 2nd president of Texas. Despite all of Perry's economic reforms the Texan economy is still heavily reliant on the exportation of oil to the American Republic, sparking many concerns within the party that Perry is leading Texas to once again become a state of America. Alongside this being an increasingly large number of protesters demanding that Texas rejoin the remnants didn't bode well for Perry, despite this he managed to keep Texas independent and get reelected 2 more times. However cracks are finally beginning to show in the One Republic Coalition and, with many outspoken critics on the right inside and outside the party. With Minor parties like the Reform and Libertarian party gaining ground and the Self-proclaimed Dixiecrat representative Joe Straus, gaining traction with many more moderates in the party and the many pro-remnant protesters. It appears that for the first time in over 2 decades there might be real opposition."
 texas.114.o1:0 "Texas is Due for Change"
 texas.115.t:0 "Crack in the Coalition"
 texas.115.d:0 "Texas has been in independent republic for 23 years now and in that time Texas has been ruled by a single party, the One Republic Coalition, the party was established by Bill Clements following the collapse of american in 1987 and has been, for the most part, the unchallenged ruling party of Texas, despite this the coalition throughout the years has been showing its cracks, after the ascension of Rick Perry as president of Texas in 1998 the party has been slowly dividing itself into 4 factions, the nationalistic Constitutionalist under Perry himself, the more moderate conservatives under Joe Straus, the Libertarians under Ron Paul, and the Christian Fundamentalist under Scott Copeland. The factions have managed to work together in the past since the 2006 party primaries where Perry barely managed to beat out his two biggest rivals at the time, Country artist and writer Richard “Kinky” Friedman, and 36th Comptroller of Texas Carole Keeton Strayhorn. Perry’s victory over the two sewn greeted dissent into the party and many political commentators believe that the days of the coalition are over and that with the new elections coming up this year we are about to see a massive split in the party."
 texas.115.o1:0 "The Coalition is Dying"
 texas.116.t:0 "Formation of the Dixie Party"
 texas.116.d:0 "Standing in front of a huge crowd in San Antonio stands representative Joe Straus with an important message for his constituents. "With the One Republic party have total control of the Republic of Texas since its inception with no real opposition to it, i hereby not only announce my candidacy for President of Texas, but also the Formation a new political party, The Dixie Party aims to promote traditional southern values, grant further autonomy to individual counties of Texas, promote economic collaboration with not only the American Republic but with all free and fair states in America and across the world." Straus leaves the stand to a crowd full of cheers and applause.\n\nWhile his announcement was met with a lot of praise as many one republic members have already joined his new party. Many critics of Straus have pointed out that his party could lead to Texas's annexation with many pointing out how the messaging is similar to many pro-remnant in Texas and many pro-confederacy politicians in the American Republic, time will see if Straus can pull off a victory in November."
 texas.116.o1:0 "Return of Dixie?"
 texas.117.t:0 "Ron Paul Announces Candidacy"
 texas.117.d:0 ""For too long have the forces of tyranny and authoritarianism had its grips on the people of Texas, in a world where the tyrannical arms of communism, and fascism growing each day, Texas must stand as a beacon of freedom and liberty like it once did. That's why today I'm announcing my candidacy for President, for not only just the Libertarian party but for a freedom coalition with the Reform party. We will bring freedom and liberty to Texas, this is my guarantee."\n\nWith the announcement not only Libertarian Representative and leader of the Texan Libertarian party will be running for president, but also a coalition with the Reform party in an attempt to bring true freedom and liberty to texas. Many critics, especially Rick Perry himself, state that the Ron Paul will lead to Texas being vulnerable to an invasion and subsequent annexation by outside forces."
 texas.117.o1:0 "Ron Ron Ron!"
 texas.118.t:0 "The Christian Revival Party"
 texas.118.d:0 "You want to know why everyday Texas seems to be getting worse? Why does the One Republic Coalition seemingly stop caring for the people and only care for themselves? It's simple, they have turned their backs on God, they are taking Christ out of our schools, Christ out of the government and worst of all, Christ out of Texas. We need change, if none of these politicians want to bring Christ back to Texas, then I, just a lowly pastor, will have to do it. That's why people, I'll be running for President under the Christian Revival party, I promise that not only will I bring Christ back to Texas, but to all of America as well." "\n\n" Scott Copeland's Speech today at his church. With Scott's proposal to "bring Christ back to Texas" he's most notably the most radical candidate for president. Many of his critics call him a theocratic Christian fascist, copeland defends himself, calling himself a "Christian that will do the tough choices to lead Texas to glory", while many of his supporters and allies in congress are do call for a theocracy, copeland himself has never publicly called for one, it remains to be seen what would happen if he's elected."
 texas.118.o1:0 "Christian Texas?"
 texas.119.t:0 "Rick Perry's New Party"
 texas.119.d:0 "People of Texas, as we know its been politically trying times, with radical, incompetent and political unknowns making headway recently, causing the gracious coalition that has lead Texas this fair to crumble, so to ensure that Texas will not only survive as a nation but thrive into our future, I hereby declare the One Republic Coalition dead, and in its place a new party, the Constitutional Party, with this new party we swear that the constitution of Texas will not only be upheld but will be the ultimate law of the land."\n\n The announcement that the One Republic Coalition was dead took very few by surprise; cracks were beginning to form the moment that Clements was no longer the leader of the party, despite this Perry's successor party, the Constitutional Party, hoped to keep the legacy and continued system that the Clements establishment had when the Republic formed. Critics of Perry claim that he hasn't done anything to diversify the economy away from oil exportation, or anything to stop the many pro-remnant protesters. However, Perry hopes to keep Texas, Texas."
 texas.119.o1:0 "4 More Years"



