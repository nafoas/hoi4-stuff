 news.322.d:0 "History has been made! The amazing new Ford Fiesta has become the worlds first electric car. Initially just going to be a feature, the electric car has made its debut across the world with many green thumbed people lining up to by the car. With an expected range of 350 miles before needing a charge, people are calling this one of the most eco-friendly cars."
 news.322.o1:0 "A Green Car Industry!"
 news.323.t:0 "Winter chaos"
 news.323.d:0 "For the first time since William the Conqueror a foreigner has destroyed London. In what is being called the worst winter in 30 years many areas are cut off from each other. Neighbourhoods in London are experiencing power outages and in other cities, car accidents are being reported en masse. The Prime Minister has declared a temporary state of emergency across the nation and red cross camps are being set up for the injured. Jack Frost clearly does not like the English."
 news.323.o1:0 "Bloody Snow!"
 news.324.t:0 "Apple launches its iPad in Australia"
 news.324.d:0 "First came the computer, then came the iPhone, now comes the Apple iPAD. Being described as a bigger version of the iPhone many look to this thing with absolute wonder. With a bigger battery and faster than the iPhone. What was once a concept for 1950’s sci fi movies and shows, you the consumer can now own. You can use this thing to watch tv, play games, write a book if you dare, keep family photos safe and many more features. Already people are lined up at Apple stores to secure a pre-order."
 news.324.o1:0 "Steve Jobs Does It Again"
 news.325.t:0 "Prince George is born"
 news.325.d:0 "Prince Geoge, son of Prince William is now the third in line for the throne making him the most powerful infant in the world. As news of his birth broke, celebrations broke out across the Commonwealth countries with many referring to him as “King to be”. Born at St. Mary’s hospital in London, the young prince’s birth was not announced by the typical easel outside of Westminster. In Australia, the Bahamas, and New Zealand a 21 gun salute signalled his birth."
 news.325.o1:0 "Another member to the Royal family has been added"
 news.326.t:0 "Typhoon Haiyan kills 6,000 in the Philippines"
 news.326.d:0 "Typhoon Haiyan which barely missed Indonesia, had finally made landfall in the Philippines. Words can not describe the terror it inflicted upon the locals as their homes and livelihoods were swept away like they were nothing. Although the capitol of Manilla sustained little damage, the rest can not be said for other cities. Cebu and most of the south are reporting record breaking destruction. So far, an estimated 6,000 people are reported dead with about 10,000 critically injured. In response to this, both the Japanese and Australian Governments have deployed their militaries to aid with the response."
 news.326.o1:0 "The World Must Unite And Help"
 news.327.t:0 "PhoneBook passes over 1 billion users"
 news.327.d:0 "Social media is a relatively new concept to this world, but Mark (The Zuck) Zuckerberg’s platform “PhoneBook” has passed over 1 billion users. Initially starting out as competition for the popular site “MyPerson” Zuckerberg’s platform has exceeded expectations of practically everyone. It’s easy to understand UI has allowed elderly to reconnect with their friends, certain communities to find their own space, and even kids to meet new people. Although, many wonder how many more it could attract if it was allowed in Russia."
 news.327.o1:0 "Incredible Technology Achievement"
 news.328.t:0 "Soviet Space Agency finds water on mars"
 news.328.d:0 "In what is being called the most important discovery of the 21st century. The Brodsky probe which was launched last year with much surprise has finally landed on the northern most part of Mars. While collecting mineral samples, Soviet Scientists noticed something different in what was being transmitted. It just so happened to be water, while frozen, it’s still water. Now many wonder if life could’ve been on mars."
 news.328.o1:0 "Another Achievement For The Reds"
 news.329.t:0 "Prince Harry announces engagement"
 news.329.d:0 "Prince harry has announced his engagement to Chelsea Davy, the multimillionaire Chelsea Davy. It’s said that everyone is an animal until meeting the supposed love of their life, and that is true for Prince Harry. For most of his adult life he’s gone from relationship to relationship, but it seems he found his eternal love in Ms. Davy."
 news.329.o1:0 "Congratulations Harry!"