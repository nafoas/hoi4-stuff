 lin.1.t:0 "Issues of Today"
 lin.1.d:0 "“Gentleman, while we have secured our position from our neighbors we have yet to secure our position from the many subhuman rebels that have taken up residency in our glorious union.”  Addresses Richard Spencer to a room full of high ranking militia and close confidants. “These dissident forces must be dealt with swiftly and i expect you,” He points to militia commander and close friend Timothy McVeigh “To Handle it.” Timothy nods and Spencer turns his attention to the second in command of the militias and to Spencer, “Weaver we need while our forces were capable of securing our place here in idaho we need to either greatly expand our numbers or reform our hastily trained militias into a serious fighting force, I entrust that you can handle such task?” “It will be done” he replies “Good now onto the economy we can continue as is and keep our focus on agriculture and small locally produced military arms, or shall we begin conducting large scale industrialization of the region? Matthew Heimbach as our minister of the economy the choice ultimately comes down to you.” “Understood sir.” Matthew replies. “Good now that everyone knows what they are going to be doing. I expect results, understand?” “Understood Glorious leader” the room erupts as sieg heils are thrown up."
