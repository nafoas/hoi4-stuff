 lin.2.t:0 "Speach from Spokane"
 lin.2.d:0 "“People of Spokane it's me your Glorious leader, i'm here to announce the recents success of our most recent set of reforms, the economy is now booming the military grows stronger, and the anti-white soviet rebels have been removed from our nation, we are not only moving towards a golden for our nation, we will soon export this to save the white race from subjugation and ruin. Heil our People Heil Victory!!!!!” "
