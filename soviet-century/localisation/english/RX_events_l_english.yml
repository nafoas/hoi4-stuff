 lin.11.t:0 "Down With the Nazi"
 lin.11.d:0 "With the chaos following his rush to the hospital many dissident forces have been rioting and near open conflict has gripped the capital. Three major groups are not only fighting against Spencer's militia loyalists for the capital but also amongst themselves for the future of the nation. With pro-californian communist, pro-democracy, and pro-monanta all fighting in the streets for who decides the future of idaho. It's unknown if Spencer's inner circle are capable of securing the capital or is this the end of Spencer's regime?"
 lin.11.o1:0 "Fuck Fascism"
 lin.12.t:0 "Battle for Spokane"
 lin.12.d:0 "While it is still unclear who has the upper hand, it's clear that currently the revolutionaries have been make much head room in their battle to take the capital, with spencerite militias currently isolated between the capitol building itself and the hospital spencer is currently being cared at all that remained of the old regime. Only reason why the revolutionaries haven't managed to defeat the militia yet was due to the fact they are just as much fighting each other as they are the spencerites. However victory is soon-"\n\n"*BOOM*"\n\n"Massive explosion has rang out at the local restaurant that the communist forces were using as a makeshift base, spencerite militias have soon rushed the building and executed everybody inside, cutting the head off the communist snake."\n\n""How'd they reorganize and counterattack so fast?" one revolutionary asked before getting his head blown off by a .308 round."\n\n"It appeared the spencerite militias have new found strength. Then it hit the revolutionary, Richdard Spencer himself was leading them from the front, causing the militias to fight with a new found fanaticism, the revolutionary readied their rifle in an attempt to put the nazi down for good, as they were about to pull the trigger, a round of .308 entered their skull, putting an end to them."
 lin.12.o1:0 "Spencer will eradicate all that resist"
 lin.13.t:0 "Death Squads"
 lin.13.d:0 "They crawl throughout the streets, “men” clad in black steel with the insignia of the black sun and wielding heavy machineguns, killing anybody they seem fit, anybody that trys to resist is gundown without a second thought, tyranny at the end of a gun, nobody is truly safe, the people outside Idahao must find out they must stop -"
 lin.13.o1:0 "“Another Traitor Down”"
 lin.14.t:0 "Spencer Reasumes Controls"
 lin.14.d:0 "Spencer walks out onto the balcony overlooking and now wartorn Spokane, the same balcony he almost died on, he’s outfitted in a new uniform, one reminiscent of the uniform the SS wore in germany. “People of Spokane, it's me, your Glorious savior from the degenerate communist and jews that attempted to take over Idaho after the failed attempt on my life. I'm here to announce that not only was the attempt a failure, it only strengthened my resolve to not only preserve our race but eliminate any and all enemies of our race from within and without Idaho. Not only must we preserve our race, we must eliminate the inferior races if we ever plan on living free from the jewish threat. And with that I hereby declare that the Union of Lincoln is no more and a new regime, The 4th Riech will take its place, and I as the Fuhrer will lead our new nation to Victory. Heil Our people and Heil victory.” The crowd erupts into a flurry of cheers and Heils as Spencer enters his office"
