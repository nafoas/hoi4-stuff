 pence.5.t:0 "A New Empire"
 pence.5.o1:0 "God Emperor Pence Rises"
 pence.5.d:0 "“Life, Piety, Holiness” “Those were the words spoken by the newly crowned Emperor Michael Pence I of the Holy American Empire during his coronation today at St Patrick’s Cathedral in New York. This coronation is expected to be followed by a quick and swift consolidation of power by Pence and his base in which the American people are expected to see many changes in their daily life.” “Pence, once a member of the White Phoenix terrorist group recently led a campaign across the former American States in a successful attempt to reunite the broken country. Resistance to the new Emperor continue in many areas throughout the country, most prominently in Protestant and Episcopal areas of the country. Following the coronation, Pence executed traitors to the state outside of the White Palace. The world holds its breath to see where the new American Government will go.“"
 pence.6.t:0 "A Meeting with Pence"
 pence.6.d:0 "In what has been called the most unlikely political conference of the decade, President Mike Pence of the American State has asked to open negotiations with David Duke of the American Republic. It is not known what the men will discuss, but both the media and public are showing interest in the conference. Could this be a trade agreement between the two countries? A military alliance? The public can not wait to see."
 pence.6.o1:0 "Duke Refuses"
 pence.6.o2:0 "Duke Accepts"
 pence.7.t:0 "Down With the South"
 pence.7.d:0 "President Mike Pence has ended diplomatic talks with David Duke of the American Republic today. Duke alleges that Pence tried to convert him to Christianity and ultimately annex the American Republic. Duke, a Born Again Christian, denounced this intimidation and ultimately went on to denounce the “fundamentalist Christianity” that Pence espouses, going onto say “It has no place in the Republic” “ Pence followed this up by announcing a state of war on the American Republic and has mobilized soldiers of the American State."
 pence.7.o1:0 "End the Heathans"
 pence.8.t:0 "Duke Converts"
 pence.8.d:0 "President Mike Pence and David Duke of the American Republic have been in high stakes talks for the past couple days, capturing the attention of both the Public and the Media. It is not known what Pence and Duke have talked about, but as both men left talks earlier today, both would surprise the American public.” “It has been announced that Duke has converted to Christianity and has accepted integration of the American Republic into the American state.“"
 pence.8.o1:0 "Lets Rebuild Together"
 pence.9.t:0 "The Southern Christans"
 pence.9.d:0 "Kevin Strom noted white nationalist, fundamentalist Christian, and leader of the American state has announced meetings with David Duke, President of the American Republic. These meetings are getting media outlets abuzz with speculation but neither Strom or his cabinet have commented on what these meetings will entail." 
 pence.9.o1:0 "Accept"
 pence.9.o2:0 "Refuse"
 pence.11.t:0 "Down With the South"
 pence.11.d:0 "The American East Coast has lit itself ablaze this morning as he announced a state of war with the American State.” “After negotiations broke down with President Kevin Strom of the American State, Duke announced what had been discussed between the two leaders. Many in the American Republic approve of Dukes actions while those in the KKK have announced their allegiance to Strom and his regime. This has not only complicated Dukes military actions, but has opened a two-front war."
 pence.11.o1:0 "End the Heathans"
 pence.10.t:0 "Lets Rebuild Together"
 pence.10.d:0 "In possibly the biggest surprise of the decade, Kevin Strom has negotiated the annexation of the American Republic, and converted David Duke to Christianity. From the steps of the Capitol, Duke announced that Strom will become active head of state for the American Republic while the two countries discuss integration terms. One of the biggest outcomes of this, besides the reunification of the East Coast, has been the expansion of Strom’s military with the inclusion of the KKK. Many local leaders are praising Duke for his enlightenment and cannot wait to work with State authorities."
 pence.10.o1:0 "Together we're Stronger"

 #texas 
 texas.3.t:0 "Pro-Remnant Protest"
 texas.3.o1:0 "Let Them Whine"
 texas.3.d:0 "Pro-Remnant protesters, many of who are armed, have gathered around the captiol building demanding we enter talks to join the American Republic."
 texas.4.t:0 "Ron Paul Announces candidacy "
 texas.4.d:0 ""For too long have the forces of tyranny and authoritarianism had its grips on the people of Texas, in a world where the tyrannical arms of communism, and fascism growing each day, Texas must stand as a beacon of freedom and liberty like it once did. That's why today I'm announcing my candidacy for President, for not only just the Libertarian party but for a freedom coalition with the Reform party. We will bring freedom and liberty to Texas, this is my guarantee.""\n\n"With the announcement not only Libertarian Representative and leader of the Texan Libertarian party will be running for president, but also a coalition with the Reform party in an attempt to bring true freedom and liberty to texas. Many critics, especially Rick Perry himself, state that the Ron Paul will lead to Texas being vulnerable to an invasion and subsequent annexation by outside forces."
 texas.4.o1:0 "Restore Texas Now!"
 texas.5.t:0 "The Return of the Dixiecrats"
 texas.5.d:0 "Standing in front of a huge crowd in San Antonio stands representative Joe Straus with an important message for his constituents. "With the One Republic party have total control of the Republic of Texas since its inception with no real opposition to it, i hereby not only announce my candidacy for President of Texas, but also the Formation a new political party, The Dixie Party aims to promote traditional southern values, grant further autonomy to individual counties of Texas, promote economic collaboration with not only the American Republic but with all free and fair states in America and across the world." Straus leaves the stand to a crowd full of cheers and applause.""\n\n"While his announcement was met with a lot of praise as many one republic members have already joined his new party. Many critics of Straus have pointed out that his party could lead to Texas's annexation with many pointing out how the messaging is similar to many pro-remnant in Texas and many pro-confederacy politicians in the American Republic, time will see if Straus can pull off a victory in november."
 texas.5.o1:0 "Dixiecrats? In 2010!"
 texas.6.t:0 "The Christian Revival Party"
 texas.6.d:0 "You want to know why everyday Texas seems to be getting worse? Why does the One Republic Coalition seemingly stop caring for the people and only care for themselves? It's simple, they have turned their backs on God, they are taking Christ out of our schools, Christ out of the government and worst of all, Christ out of Texas. We need change, if none of these politicians want to bring Christ back to Texas, then I, just a lowly pastor, will have to do it. That's why people, I'll be running for President under the Christian Revival party, I promise that not only will I bring Christ back to Texas, but to all of America as well.""\n\n"Scott Copeland's Speech today at his church. With Scott's proposal to "bring Christ back to Texas" he's most notably the most radical candidate for president. Many of his critics call him a theocratic Christian fascist, copeland defends himself, calling himself a "Christian that will do the tough choices to lead Texas to glory", while many of his supporters and allies in congress are do call for a theocracy, copeland himself has never publicly called for one, it remains to be seen what would happen if he's elected."
 texas.6.o1:0 "Theocratic Texas?"
 texas.7.t:0 "Rick Perry's new Party"
 texas.7.o1:0 "4 More Year!"
 texas.7.d:0 ""People of Texas, as we know its been politically trying times, with radical, incompetent and political unknowns making headway recently, causing the gracious coalition that has lead Texas this fair to crumble, so to ensure that Texas will not only survive as a nation but thrive into our future, I hereby declare the One Republic Coalition dead, and in its place a new party, the Constitutional Party, with this new party we swear that the constitution of Texas will not only be upheld but will be the ultimate law of the land.""\n\n"The announcement that the One Republic Coalition was dead took very few by surprise; cracks were beginning to form the moment that Clements was no longer the leader of the party, despite this Perry's successor party, the Constitutional Party, hoped to keep the legacy and continued system that the Clements establishment had when the Republic formed. Critics of Perry claim that he hasn't done anything to diversify the economy away from oil exportation, or anything to stop the many pro-remnant protesters. However, Perry hopes to keep Texas, Texas."
 texas.8.t:0 "Election of 2010"
 texas.8.d:0 "With the election in full swing the polls show no clear winner. While many thought Rick Perry would win in a landside, the polls show a startling increase of the opposition parties. as voting booths closing all across Texas it looks like its fate lays in the hand of the last few countys still counting the vote."
 texas.8.o1:0 "Paul's Liberty Pulls Off!"
 texas.8.o2:0 "Return to Dixie!"
 texas.8.o3:0 "4 More Years!"
 texas.8.o4:0 "The Far-Right Wins?!"
 texas.9.t:0 "Ron Paul's Surprise victory "
 texas.9.d:0 "In what many are considering a major upset of the political system of Texas, Ron Paul and the Libertarian and Reform coalition have emerged victorious. With the coalition also just barely managing to take congress, Paul will be able to push forward his agenda and shape Texas in his own image. The support that the other parties once had have proven to have no lasting future, with talks behind the scenes that what remains of the other parties are planning on merging into an opposition party against Paul. This and the news that's theirs already disagreements within his coalition it's unknown if Paul will keep this momentum into the following elections. However for the time being Ron Paul is the undisputed President of Texas."
 texas.9.o1:0 "Ron Don't Fail Us Now."
 texas.10.t:0 "Perry's 3rd Term"
 texas.10.d:0 "Rick Perry stood atop the podium overlooking the streets of Austin a crowd cheering for him, cheering for his 4th term victory, while Texas doesn't have any term limits Perry promised himself he wouldn't run after his 4th election. Just like how Clements did"\n\n""People of Texas, it's my honor to be here this day, to be elected for a 4th term, has shown me that the people of Texas believe in not only me but believe in Texas, and that soon we will not only be prospering, we will be a beacon of light in the dark world we have found ourselves in!”"\n\n"The crowd erupted into an even louder cheers, it seems for now Perry has won the people of Texas."
 texas.10.o1:0 "Perry Will Strengthen Texas!"
 texas.11.t:0 "Take me to Dixie"
 texas.11.d:0 "In an extremely close race Joe Staus has managed to secure victory against Rick Perry in the 3rd round of voting. After Straus was announced victorious it was seen that Rick Perry had personally congratulated his opponents and wished him a good time in office, showing that potentially the two parties might be working together rather than against. With Straus set to be inaugurated soon, it is still up in the air what the future holds for Texas, but one thing is certain. . . ."
 texas.11.o1:0 "We Are in Dixie Now"
 texas.12.t:0 "Revive Texas Grows"
 texas.12.d:0 "In an upset, the Revive Texas Movement managed to win the election in the dead of night after one county reported thousand of new votes that tipped the vote in their favor. While other parties are claiming election fraud, Scott Copeland refutes this and says he won the election fairly. Protest against his alledged stealing of the elction are already underway."
 texas.12.o1:0 "Election Fraud? Impossible!"
 texas.14.t:0 "Enforced Loyalty"
 texas.14.d:0 "Scott Copeland has enacted policies in Texas which enforce loyalty to him. These policies have been shown to be a major success as anyone who does not follow these policies is taken by Copelands police forces and usually never heard from again. There’s only one thing being said in the streets of Texas these days and that is “Hail Copeland.”"
 texas.14.o1:0 "“Hail Copeland!”"
 texas.13.t:0 "Expand the Police"
 texas.13.d:0 "Copelands regime has continued to expand today as he signed legislation which expands the police. This will ultimately give the police more power in way of extrajudicial investigations, but also allows the police to conduct a large recruitment campaign that is expected to produce large numbers of new recruits."
 texas.13.o1:0 "We Need More!"
 texas.15.t:0 "Purge the Unloyal"
 texas.15.d:0 "Scott Copeland, similar to Adolf Hitler of the past has started a purge of his political enemies. This has mainly involved large numbers of ethnic minorities and political minorities being shipped off to prisons or labor camps where many are either enslaved or promptly executed outside of the public eye."
 texas.15.o1:0 "Let Them Protest"
 texas.15.o2:0 "Down with these traitors"
 texas.16.t:0 "We Won!?"
 texas.16.d:0 "[TEX.GetLeader] has declared victory over the Remnants today following a bloody war for independence. [TEX.GetLeader] has declared that major restructuring of the goverment and new territories are inorder to secure the future of Texas."
 texas.16.o1:0 "Texas Lives On!"
 texas.17.t:0 "We Are Americans"
 texas.17.d:0 "Rick Perry, unquestioned leader of the Texan state has announced that Texas will be the one to carry the mantle of America going forward. This has undoubtedly raised doubts from other American states. Perry, for one believes that Texas is key to the unification of the American States. "
 texas.17.o1:0 "America Lives On!"
 texas.18.t:0 "Pardon the Remnents"
 texas.18.d:0 "President Rick Perry of Texas has issued an executive order pardoning the American Remnants of their treason. While met with criticism by some, most see this as a positive step towards unifying the once broken country."
 texas.18.o1:0 "First Step Towards Unity."
 texas.19.t:0 "Honor the Founders"
 texas.19.d:0 "Joe Straus has announce to publicly honor the founding fathers of America. This has come with a declaration that Texas will rebuild the United States. Texas is on the road to reshape America."
 texas.19.o1:0 "Washington Would be Proud!"
 texas.20.t:0 "The Golden Circle"
 texas.20.d:0 "Scott Copeland, noted fascist leader of Texas has declared that Texas wiil form the Golden Circle. Once thought to be a far-fetched dream of the Confederate States, Copeland has led his state to make this a reality. Many are questioning whether Copeland will expand his state even further."
 texas.20.o1:0 "A Great Dream"
 texas.21.t:0 "Work with the KKK"
 texas.21.d:0 "Scott Copeland has expanded his power by working with local cells of the KKK organization. These men will function as an extension of Copelands power in the state, essentially being a paid paramilitary force. Copeland has given these men extrajudicial power, and now many are wondering what their extent of power will be. "
 texas.21.o1:0 "Our New Allies"
 texas.22.t:0 "A More Perect Union"
 texas.22.d:0 " Ron Paul, populous leader of the Texan Republic has declared a more perfect union after defeating the American Republic. In his speech Paul declared that this time around the US would be bigger and better than it was before."
 texas.22.o1:0 "Restore America Now!"
 texas.23.t:0 "A Great Victory"
 texas.23.d:0 "In a move that has shocked just about nobody, the Texan Dixiecrats have declared a reborn Confederate States of America. Joe Straus has stated that the Confederacy renounces any claim to America and will live in splendid isolation. "
 texas.23.o1:0 "A Day For Dixie!"
 texas.24.t:0 "The Lost Cause"
 texas.24.d:0 "Joe Straus recently made a speech talking about the lostr cause the south once faught for, paralleling the recent war with the remnants. but unlike in 1865 the underdog won. While the reason for the speech has yet to be heard, many believe it means a return of the long dead Confedaracy."
 texas.24.o1:0 "A Cause Worth Fighting For."

