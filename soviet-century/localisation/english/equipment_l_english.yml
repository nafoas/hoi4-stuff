 GER_heavy_tank_destroyer_equipment_3_short: "Jagdtiger"
 GER_heavy_tank_destroyer_equipment_3_desc: "The Jagdtiger was the heaviest armored fighting vehicle operationally used during World War II. The vehicle mounted a 128 mm PaK 44 L/55 main gun, and carried heavy frontal armor."
