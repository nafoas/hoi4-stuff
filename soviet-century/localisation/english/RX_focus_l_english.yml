 ITA_Roma_Invicta:0 "Roma Invicta"
 ITA_Roma_Invicta_desc:0 "Rome has once again conquered Europa. Our legions span from around the Mediterranean to the icy north of England. Our Culture is promoted in schools and our pride has been restored. Semper Roma!!!"
 ITA_Forced_Romanisation:0 "Force Romanisation"
 ITA_Forced_Romanisation_desc:0 "For our new Roman state to survive, we’ll need to Romanize natives of our conquered lands. They will speak Latin, think Latin, and dream in Latin. There buildings will be redone in the Roman style, and their entertainment will be Roman. Semper Roma!"
 ITA_Glorify_Pre-Christian_Rome:0 "Glorify Pre-Christian Rome"
 ITA_Glorify_Pre-Christian_Rome_desc:0 "Rome was great before the Christ-son was born. Our lands were expansive and our people happy. When Christianity came around, our Empire went into decline and multiple civil wars followed. Our Children will know of the better Rome, CAESAR’S ROME! Semper Roma!"
 ITA_Rebuilding_The_Rest:0 "Rebuilding The Rest"
 ITA_Rebuilding_The_Rest_desc:0 "To administer our new lands, we’ll follow the rule of Julius Caesar who gave conquered lands to generals. Afterall who knows the land better than a general who fought over it? Semper Roma!"
 ITA_Jus_Scriptum:0 "Jus Scriptum"
 ITA_Jus_Scriptum_desc:0 "Latin for Written Law, the Jus Scriptum will guarantee our laws are followed. Unlike the ancient romans, the Jus Scriptum will establish police forces across the Empire to quell dissent and make sure citizens are compliant with laws."
 ITA_Modern_Feudalism:0 "Modern Feudalism"
 ITA_Modern_Feudalism_desc:0 "By giving land and titles to rich families, whether they be roman or not, we’ll guarantee our lands are administered properly. Those loyal to the state will receive many awards from the Imperator."
 ITA_Provincial_Governors:0 "Provincial Governors"
 ITA_Provincial_Governors_desc:0 "To administer our new lands, we’ll follow the rule of Julius Caesar who gave conquered lands to generals. Afterall who knows the land better than a general who fought over it? Semper Roma!"
 ITA_Building_Infrastructure:0 "Building Infrastructure"
 ITA_Building_Infrastructure_desc:0 "The Communist and Democratic governments of our conquered lands neglected their people for too long. Under Rome, new roads, hospitals, schools, parks, and more shall be built so they too know the glory of Rome! Semper Roma!"
 ITA_Close_Refugee_Channels:0 "Close Refugee Channels"
 ITA_Close_Refugee_Channels_desc:0 "Refugees flee to our prosperous lands daily, but we learned our lessen from the last time. These refugees will be turned away from the glorious empire. Semper Roma!"
 ITA_A_Return_to_The_Old_Faith:0 "A Return To The Old Faith"
 ITA_A_Return_to_The_Old_Faith_desc:0 "Romes glory lays within our pre-Christian days. When the people worshipped multiple gods, they were moral, they understood their place. It’s time we bring this faith back and present the choice the people. Already the Imperator has converted, will you? Semper Roma!"
 ITA_Re-Establish_A_Civilian_Senate:0 "Re-Establish A Civilian Senate"
 ITA_Re-Establish_A_Civilian_Senate_desc:0 "While the senate was the bane of the Roman people, we can not ignore the impact of partial democracy on our people. Changing some parts of it, we can mold the Senate to the Imperators will. Semper Roma!"
 ITA_Mare_Nostrum:0 "Mare Nostrum"
 ITA_Mare_Nostrum_desc:0 "The Roman Empire stretches around the entire Mediterranean, once again we have achieved the Mare Nostrum."
 ITA_A_Praetorian_Tribune:0 "A Praetorian Tribune"
 ITA_A_Praetorian_Tribune_desc:0 "The Praetorian Tribune will act as a service to both the Imperator and Generals. It’s power is cut back but it will function as a major aspect of military life. Those in the tribune are to be considered the best of the best."
