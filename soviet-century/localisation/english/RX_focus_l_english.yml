l_english:
 ENG_direction_of_the_country:0 "Direction Of The Country"
 ENG_direction_of_the_country_desc:0 "David Owen has guided the country against communism and kept the last European democracy strong. the people refer to him as the people’s prime minister due to his loyalty and guiding them through tough times. Now its time for Owen to direct the country through the 2010’s"
 ENG_Investment_In_Northern_England:0 "Investment In Northern England"
 ENG_Investment_In_Northern_England_desc:0 "The working-class people of the north of England feel like they have been forgotten about due to all the attention London and the south gets, its time to investment and bring a new technology industry to the area. AKA create the northern powerhouse!"
 ENG_Investment_In_The_Midlands:0 "Investment In The Midlands"
 ENG_Investment_In_The_Midlands_desc:0 "The midlands are known for being between the north and south divide, the midlands are the industry sector of the UK which has most of the factories and yet most deprived area. Its time the midlands get their investment to transform the area."
 ENG_Investment_In_Southern_England:0 "Investment In Southern England"
 ENG_Investment_In_Southern_England_desc:0 "London and the surrounding areas get good investment from the government but the far reaches like Cornwall and south west do not receive enough funding. Now this is going to change, and industry can return to the area after many years."
 ENG_Boost_Funding_For_NHS:0 "Boost NHS Funding"
 ENG_Boost_Funding_For_NHS_desc:0 "The NHS is the beating heart of the United Kingdom yet cuts and small groups over privatisation has started to take its toll on the health system and its beginning to show. Fresh funding and better management will guide the NHS into the decade."
 ENG_More_Powers_To_Councils:0 "More Powers To Councils"
 ENG_More_Powers_To_Councils_desc:0 "Councils are the heart of communities and they know what needs to be changed in their local areas. In the past lack of funding and powers have prevented local communities from growing. Now its time those councils were given more funding and powers to control what exactly happens in their constituencies."
 ENG_Better_Housing:0 "Better Housing"
 ENG_Better_Housing_desc:0 "The SDP are proud of their modernise reform that was passed a year ago and now modern houses are being built across the country with more younger people being able to afford to buy a house and standards of living rising. "
 ENG_Punishment_And_Reform:0 "Punishment And Reform"
 ENG_Punishment_And_Reform_desc:0 "In the 2008 general election David Owen promised the people that if they were elected that they would hire 15,000 more police to keep the streets safer and faster court dates. Now the time has come for the punishment and policing bill to be written into law."
 ENG_democratic_reform:0 "Democratic Reform"
 ENG_democratic_reform_desc:0 "Deputy Prime Minister Shirly Williams set out to change the election process to make it fairer and now has changed the typical PR into ‘the first past the post’ which will now allow a fairer and stronger democratic process and have the chance to elect new members into government."
 ENG_Fix_The_Pound:0 "Fix The Pound"
 ENG_Fix_The_Pound_desc:0 "In recent years, the uk economy has dipped and many long-time supporters of the SDP are turning to the conservative party to seek help. Its time the party fixes this issue once and for all and become a new jobs program."
 ENG_Devalue_The_Pound:0 "Devalue The Pound"
 ENG_Devalue_The_Pound_desc:0 "Unfortunately, the attempts made to fix the economy has sadly failed causing more businesses around the uk to fail and shut down pushing unemployment to high levels not seen since before the SDP got into power. The only way to fix this problem is to devalue the pound."
 ENG_Attempt_To_Attract_Investors:0 "Attempt To Attract Investors"
 ENG_Attempt_To_Attract_Investors_desc:0 "Foreign Sectary Michael Crockart has met with the Canadian PM to begin talks on bringing investment into the country and improve confidence in the economy to build the pound stirring back up to high levels as well as bring new businesses to the country."
 ENG_Work_Closer_With_Ireland:0 "Work Closer With Ireland"
 ENG_Work_Closer_With_Ireland_desc:0 "The past years the uk has strong ties with Ireland but now its time to improve this and build a stronger trade deal with easy movement between nations."
 ENG_Dual_Military_Exercises:0 "Dual Military Exercises"
 ENG_Dual_Military_Exercises_desc:0 "The UK and Ireland work together to keep their nations safe from the outside world and their soldiers fight together under the British Isle Protection Union. Its now time to turn more aggressive and stage more intense training."
 ENG_Scientific_Research:0 "Scientific Research"
 ENG_Scientific_Research_desc:0 "In the past years, the increase in worldwide viruses causing pandemics and epidemics shows that the world is not prepared for the future and now its time to create a joint scientific group to work together to fight against future disease and more medical advancements."
 ENG_The_Irish_Agreement:0 "The Irish Agreement"
 ENG_The_Irish_Agreement_desc:0 "Its time to strike a new trade deal with the Irish and Ulster governments. Ireland creates many great items such as alcohol, raw materials and Ulster provides many similar items to meanwhile we can also trade with our materials to. Its time we find a new agreement, one that will unite both countries."
 ENG_Northern_Ireland_Peace_Process:0 "Northern Ireland Peace Process"
 ENG_Northern_Ireland_Peace_Process_desc:0 "Ulster, the troublemaker in the past has decided to go it alone. Since then, the Irish Republican Army has increased their attacks and claimed the lives of many innocents. It is time for our countries to sit down and settle things once and for all."
 ENG_Free_Movement:0 "Free Movement"
 ENG_Free_Movement_desc:0 "Ireland, Ulster, and the UK have become close friends since the fall of Europe into communism. Its time to allow the people from the 3 countries to travel flawless, create a strong economy with many jobs and build a better future."
 ENG_Diplomatic_Relations_With_Canada:0 "Diplomatic Relations With Canada"
 ENG_Diplomatic_Relations_With_Canada_desc:0 "Canada and the UK have also had close ties, its time to build a stronger relationship together and secure a future which will benefit both countries. Since the united states fall many Americans fled to Canada and would want a better relationship with the last democracy in Europe. "
 ENG_Trade_Debates:0 "Trade Debates"
 ENG_Trade_Debates_desc:0 "Trade has been a big topic for both Nations with many different materials that can be shipped to each other its time to lower tariffs and create a stronger economy with the UK and Canada sharing the benefits together."
 ENG_Shared_Intelligence:0 "Shared Intelligence"
 ENG_Shared_Intelligence_desc:0 "Canada and the UK and Ireland have always shared security detail with each other but now its officially time to write it into law allowing the 3 nations to create a stronger safer world and protect democracy."
 ENG_Mineral_Imports_From_Canada:0 "Mineral Imports From Canada"
 ENG_Mineral_Imports_From_Canada_desc:0 "Canada holds many raw resources that would benefit the uk and push the economy of the UK into a strong direction. Oil, coal, and steel can be imported from both nations to create many key jobs for the nations."
 ENG_League_And_Protection_Exercises:0 "League And Protection Exercises"
 ENG_League_And_Protection_Exercises_desc:0 "Just like in the days of NATO the UK and Canada worked together to protect their countries uniting their armies. Now its time to do it again, we may not be part of the same allegiance but share the same values and that is key to the safety of democracy."
 ENG_The_Lion_And_The_Mapel_Leaf:0 "The Lion And The Mapel Leaf"
 ENG_The_Lion_And_The_Mapel_Leaf_desc:0 "The 3 nations have begun a new relationship, a stronger relationship and the future looks brighter and safer. We know the reds are watching and they will slowly be beginning to feel the pressure now."
 ENG_United_Together:0 "United Together"
 ENG_United_Together_desc:0 "A new decade is upon the world. Its time to decide what fate the uk will follow. Many people around the country want change but the change depends on the future of the UK. Meanwhile relations stand strong with friends across oceans with alliances being formed preparing for a new 10 years of change."
 ENG_Shirleys_Speech:0 "Shirleys Speech"
 ENG_Shirleys_Speech_desc:0 "Shirley Williams will address the nation about what has happened, she is now in charge and the nation will unite."
 ENG_The_Queen_Talks_To_The_Nation:0 "The Queen Talks To The Nation"
 ENG_The_Queen_Talks_To_The_Nation_desc:0 "The country is scared, for the first time in English history, a leader has been assassinated. Many fear for the future, and many question the strength of the government. In times of crisis, the royal family has addressed the nation, it is time for her Royal Majesty to step up and calm her loyal subjects."
 ENG_Calm_The_Nation:0 "Calm The Nation"
 ENG_Calm_The_Nation_desc:0 "The UK is facing something it never has before, the assassination of its own leader. The country needs to stabilise itself and the leaders of the country need to urge people to stay calm and do not allow the enemies to take advantage of them."
 ENG_A_Day_Of_Mourn:0 "Day Of Mourn"
 ENG_A_Day_Of_Mourn_desc:0 "Its time for the funeral of David Owen his car will pass through the streets of London, a minutes silence will be held and its time for the country to stand together and remember the PMs long leadership over the country."
 ENG_A_Pledge_Of_Democracy:0 "A Pledge Of Democracy"
 ENG_A_Pledge_Of_Democracy_desc:0 "Although Brittania has been struck a devastating blow, We shall rise above the world and prosper. Our government does not plan to change England, but instead we shall pledge ourselves to democracy."
 ENG_Shirley_Needs_Help:0 "Shirley Needs Help"
 ENG_Shirley_Needs_Help_desc:0 "Although she was deputy PM, she always was able to allow Owen to take control of the country and now she’s in control her leadership isn’t as strong as what people thought, the opposition are easily taking advantage of her weak leadership and now she’s looking out for help."
 ENG_The_Terror_Attack:0 "The Terror Attack"
 ENG_The_Terror_Attack_desc:0 "As 1000s of Londoners took to their normal commute to work on what seemed a normal day turned into something tragic, bombs placed in the tubes and on a bus causing 100s of injuries and over 50 people dying."
 ENG_Speak_To_The_Nation:0 "Speak To The Nation"
 ENG_Speak_To_The_Nation_desc:0 "Its time to speak to the people and reflect on the dark times that have hit the nation."
 ENG_Restrict_Right_Wing_Groups:0 "Restrict Right Wing Groups"
 ENG_Restrict_Right_Wing_Groups_desc:0 "It was the right the far right who were responsible for the terror attacks in London and now its time to limit what they can do and prevent their hate messages from being spread and influence more people."
 ENG_Braiser_Own_Plans:0 "Braisers Own Plans"
 ENG_Braiser_Own_Plans_desc:0 "Conservative MP Theresa Braiser has left the conservative party to form her own party “The Phoenix Front” she has announced her own vision for Britain and is ready to take the challenge of running the country.."
 ENG_Arm_The_Police:0 "Arm The Police"
 ENG_Arm_The_Police_desc:0 "After the terror attack its time the police can really protect the people of this nation against terrorist, from now on the police force will be equipped with fire arms to prevent any more terror attacks and will be ready for anything. Although some of the public fear this could go the wrong way.."
 ENG_Up_The_Terror_Level:0 "Up The Terror Level"
 ENG_Up_The_Terror_Level_desc:0 "Britain is no longer safe, its older leader is dead due to terrorists and the right has attacked the public, its time to make Britain ready for anything and ensure that people must remain vigilant over anything."
 ENG_The_Grip_Weakens:0 "The Grip Weakens"
 ENG_The_Grip_Weakens_desc:0 "Shirley is struggling to keep her party united as many are losing trust and confidence in her, she is struggling to respond back to opposition and many of the public are not happy with her leadership."
 ENG_A_Vote_Of_No_Confidence:0 "A Vote Of No Confidence"
 ENG_A_Vote_Of_No_Confidence_desc:0 " Parliament has decided that Shirley no longer has the power to lead the country, she has had a chance and all that is caused is more and more distrust in the democratic government and the people protesting. Its time to vote and choose who should lead this country or if the SDP deserve another chance."
 ENG_The_Queen_Comes_Knocking:0 "The Queen Comes Knocking"
 ENG_The_Queen_Comes_Knocking_desc:0 "The queen has been watching parliament fall apart and she is watching her great country slowly crumble, its time she uses her power to do something about it, using her royal prerogative she will make herself heard!"
 ENG_Dimiss_Parliament:0 "Dismiss Parliament"
 ENG_Dimiss_Parliament_desc:0 "The british parliament system has become an embarrassment to everyone across this nation and shown that no one can trust so called “politicians” anymore. Removing this system means we can remove the corrupt rich men from their throne of power."
 ENG_Speak_To_The_People:0 "Speak To The People"
 ENG_Speak_To_The_People_desc:0 "Its time to formally speak with the nation and explain to them what actions have been taken and show them that Britain can be once again a strong stable nation with its people proud. The past has shown the british people have achieved many things and now its once again time to show the world they are ready for change."
 ENG_A_Promise:0 "A Promise"
 ENG_A_Promise_desc:0 "The past has been filled with corruption and disappointment. No more will this be allowed to go on. Her majesties rule will be a fair rule and equal to all. No more will the elite look down upon those who suffer. Its time a promise is made to make Britain fair for all."
 ENG_The_First_Royal_Address:0 "The First Royal Address"
 ENG_The_First_Royal_Address_desc:0 "Its time to address the world. Explain what new changes will be brought into this broken country and the new system which will be implemented. Once again Britain will enter the world stage and it will be a country which is bold, strong and its people proud. The United Kingdom will address the world and the world will listen."
 ENG_The_Queen_Takes_Power:0 "The Queen Takes Power"
 ENG_The_Queen_Takes_Power_desc:0 "For hundreds of years Britain was ruled by a king or queen and the law of the land benefited all. Now its full of greed and corruption. Its time her majesty takes power of this broken nation and restores it back to its glory. The queen will no longer just be the head of state. She will be the head of a new nation reborn for greatness."
 ENG_New_Parliament_System:0 "New Parliament System"
 ENG_New_Parliament_System_desc:0 "The old system of government was broken, and many millions felt let down because of past governments promising change that never came. The Queen will reform government and make it fairer but also governed under her watch. Parliament will become a puppet to serve the people and royalty with her laws approved properly. "
 ENG_The_Queens_New_Nation:0 "The Queens New Nation"
 ENG_The_Queens_New_Nation_desc:0 "This is only the start..Britain will rise and the lion will roar once again over the white cliffs of dover. Changes have already taken place in government and new alliances have been created. Now its time for new reforms, laws and more to take place in this new nation governed by the crown. Her majesty is just getting started on what must be done here but Britain will certainly change.."
 ENG_The_Election_Run_Up:0 "The Election Run Up"
 ENG_The_Election_Run_Up_desc:0 "Shirley William has called for a snap election to restore confidence back into government. Now its time for the parties to debate, campaign and show the people of Great Britain why they should be elected to power. Each party brings something different to the table, the only problem is who should the british people listen to and trust?"
 ENG_Fight_Of_The_Left:0 "Fight Of The Left"
 ENG_Fight_Of_The_Left_desc:0 "The left has received a lot of harsh comments due being partly to blame for Owens’s death but now its time for the left to fight back and Corbyn to show they are not linked to such disgusting acts. The ILP will show the people they are the party to be put into power for fairness, equality and renew Britain’s potential for the future as well as rebuilding relations with the nation’s close neighbours."
 ENG_Corbyn_Has_The_Idea:0 "Corbyn Has The Idea"
 ENG_Corbyn_Has_The_Idea_desc:0 "Jeremy Corbyn has been written off as a communist, traitor and terrorist. Its time for him to put his ideas to the people and show he is none of these. His ideas of reforming the private and public sector, fixing the poverty problem and rebuilding relationships across the world with old friends is what the UK needs for its future."
 ENG_The_Real_Democracy:0 "The Real Democracy"
 ENG_The_Real_Democracy_desc:0 "Nothing has ever beaten the good old democratic torch; it brings the people hope of freedom and liberty.  There are many problems and issues going on in the world today and democracy hangs by a thread as more and more countries turn away from it. Its time the people were made aware that the UK is one of the last true free democracies in the world."
 ENG_Old_Fashion_Campaigns:0 "Old Fastion Campaigns"
 ENG_Old_Fashion_Campaigns_desc:0 "Door knocking, TV debates and speeches, these are what every election has been about to win support and show people their options of what each party brings to the table. The left and right have different ideas which make people uneasy. The real democratic parties on the other hand can remain in the status quo."
 ENG_Rise_Of_The_Right:0 "Rise Of The Right"
 ENG_Rise_Of_The_Right_desc:0 "Britain is broken. Britain needs fixing. But no one can unless the real brits win! Its time the right wing got a chance to show what they would do for the british public. Putting the white working-class people first. Already polls have increased for the likes of Britain First and the BNP and with the creation of the Phoenix front, its only a matter of time before the right wing really get a chance in power."
 ENG_The_Phoenix_And_The_Right:0 "The Phoenix And The Right"
 ENG_The_Phoenix_And_The_Right_desc:0 "Theresa Braiser created the Phoenix front as the true british people’s party. A party that represents every british Christian who wants their country back in their hands. It may have some radical opinions, but change is not easy or simple. The Phoenix Front is something different to the BNP and Britain first and that is their leader already has experience in government and knows what needs to be done to win an election."
 ENG_Election_Day:0 "Election Day"
 ENG_Election_Day_desc:0 "Election day has finally arrived, its time to see which party has won the election and what direction the country is going to take. As Big Ben strikes ten O’clock its time to see what the predication is and who is going to restore the confidence of the british people. "
 ENG_The_Left:0 "The Left"
 ENG_The_Left_desc:0 "The Independent Labour Party has been elected. Formed prior to the mainstream Labour Party, the ILP today represents the furthest left of the democratic political spectrum, with radical ideas for reshaping British politics at home and abroad. Champions of the recently popularized Republican cause as well as restoring the NHS and rebuilding britain."
 ENG_The_Red_Hand:0 "The Red Hand"
 ENG_The_Red_Hand_desc:0 "Britain is in dire need of help, homelessness, low education funding, housing crisis; the people are reaching out to the government and they refuse to listen. Now the ILP have been elected it’s time to reach their hands out to the people and give them the help they need."
 ENG_The_Nationalise_Scheme:0 "The Nationalise Scheme"
 ENG_The_Nationalise_Scheme_desc:0 "Many jobs are unsafe due to the corrupt corporations and refusing to pay tax while their workers receive extraordinarily little back and yet the elite get richer. Its time these companies get taken under the hands of the government and ensure jobs are safe and fair. This also means the people of the country get cheaper utilities in return."
 ENG_Unite_The_Isle:0 "Unite The Isle"
 ENG_Unite_The_Isle_desc:0 "Wales is unhappy with the direct rule of west minister and Scotland are screaming out for their independence. Its time the new government show these states this new administration is not like the past governments and they are willing to sit down and meet with the leaders of independence parties and fix the ongoing issues."
 ENG_State_Run_Houses:0 "State Run Houses"
 ENG_State_Run_Houses_desc:0 "Landlords have caused more harm than good, and their tenants are being given unfair living standards, yet nothing has been done to root this corruption out. Now under this new government there can be reforms put in place and those rented houses can be created into a new state-run housing removing the corruption."
 ENG_Tax_The_Rich:0 "Tax The Rich"
 ENG_Tax_The_Rich_desc:0 "The rich have always managed to wriggle out their way of paying extra taxes, now this can be stopped once and for all and they will all pay their fair share. This time the working class will benefit more from extra taxes being paid. The elite have always bragged about their money, now the working class will brag to them."
 ENG_Nationalise_BT:0 "Nationalise BT"
 ENG_Nationalise_BT_desc:0 "As technology moves fast and countries struggle to keep up its starting to cost families more and more to have the best internet, TV and more in their homes and its not that fair. Now British Telecom has been taken into public ownership prices will drop while great investments will be made to make the fastest internet available to everyone and removing the TV licence."
 ENG_OH_JEREMY_CORBYN:0 "OH JEREMY CORBYN"
 ENG_OH_JEREMY_CORBYN_desc:0 "Jeremy Corbyn has changed the face of Britain. A man who protested against the past governments and was mocked in the media has now changed Britain to a fairer and happier society..although some would disagree. People chant his name in pubs, and he is now an all-time favourite breaking record on approval rates on his leadership. The only problem is the far left are still unhappy.."
 ENG_Democracy_Triumphs:0 "Democracy Triumphs"
 ENG_Democracy_Triumphs_desc:0 "The election is over, and democracy has won, after beating the left and the right wing groups the true democratic parties have won the trust of the people. Now its time to find out which party has secured the most votes to enter parliament and create a government and to see if the SDP is no longer the party for the people?"
 ENG_The_Hand_Of_Democracy:0 "The Hand Of Democracy"
 ENG_The_Hand_Of_Democracy_desc:0 "The torch has been lit and democracy remains strong in the United Kingdom. Braiser has refused to acknowledge the results and will do her best to keep spreading her message while the independent labour party will do its best to show they could still be the party of the people."
 ENG_Two_Rights_But_Who:0 "Two Rights But Who"
 ENG_Two_Rights_But_Who_desc:0 "A far-right party has been elected for the first time in British history. But which far-right party has gained the most votes and  will restore Britain to glory."
 ENG_Britain_First:0 "Britain First"
 ENG_Britain_First_desc:0 "Far right party Britain First, led by [ENG.GetLeader] has won the recent general election. This unprecedented national vote came after the horrific terrorist attack in Central London. In a campaign that saw the total capitulation of major parties like the Conservatives and Labour, hatred became the forefront of British politics. Now Parliament consists of new figures... Britain First leads the nation, the British National Party comes in second and Theresa Brasier's 'fascistic' Phoenix Front has become the junior partner in a coalition with [ENG.GetLeader]."
 ENG_The_New_System:0 "The New System"
 ENG_The_New_System_desc:0 "BF has been elected to power and now it is time to implement their new system of what they want the country to be like. Starting off with the education introducing the importance of the british empire and strong discipline in schools as well as removing human rights as it has been abused."
 ENG_Christian_Values:0 "Christian Values"
 ENG_Christian_Values_desc:0 "Britain has always been a Christian country and its time the people of this nation remember that! Abolishing other religions and a limit non-Christian teaching in this country is the first steps to take as well as forcing Sundays to be true Christian days."
 ENG_BNP:0 "BNP"
 ENG_BNP_desc:0 "The far right British National Party, led by Nick Griffin has won the recent general election. This unprecedented national vote came after the horrific terrorist attack in Central London. In a campaign that saw the total capitulation of major parties like the Conservatives and Labour, hatred became the forefront of British politics. Now Parliament consists of new figures... BNP leads the nation, Britain First comes in second and Theresa Brasier's 'fascistic' Phoenix Front has become the junior partner in a coalition with [ENG.GetLeader]."
 ENG_Real_British_Values:0 "Real British Values"
 ENG_Real_British_Values_desc:0 "British values have been taken advantage of and are a joke. Now is the time to fix these problems by allowing british people to be given jobs to them first before any other non british person. Stopping all foreign aid over seas and most of all fly the REAL union jack in all places across the country."
 ENG_Save_The_Indigenous_British_People:0 "Save The Indigenous British People"
 ENG_Save_The_Indigenous_British_People_desc:0 "Britain has introduced the most divisive policy since World War II and transformed our country almost beyond recognition. In towns and cities up and down the country its feel like foreigners own our country. It is time to Deport bogus asylum seekers and stop all further immigration into Britain while being able to deport the two million+ non british who are here."
 ENG_The_British_Health_Care_System:0 "The British Health Care System"
 ENG_The_British_Health_Care_System_desc:0 " The NHS is critically ill. NHS Trusts are removing staff, closing wards, cancelling operations, and refusing patients vital life-saving drugs. British doctors and nurses are unable to find work in the NHS because they are importing medical staff. The people of this nation are not being put first! Its time to rebuild the NHS for ONLY the british."
 ENG_Britians_New_Reforms:0 "Britains New Reforms"
 ENG_Britians_New_Reforms_desc:0 "Britain has already been changed due to the nationalist party being in power giving the british people what they have always wanted. A true british government governed by the british. This is only the start, its time to reform the whole country, replace each section of the nation bit by bit and bring the country into the glory days once again!"
 ENG_Hung_Parliament:0 "Hung Parliament"
 ENG_Hung_Parliament_desc:0 "After a long tirelessly night the votes have finally been counted and the conservatives have gained the most votes but not enough for an overall majority. The phoenix front has come second with labour and the rest following behind. Its time for the Tories to choose what they will do in their next steps to power.."
 ENG_Coalition_Government:0 "Coalition Government"
 ENG_Coalition_Government_desc:0 "A hung parliament has occurred with the Conservatives as the largest party but not an overall majority, discussions followed to help create a stable government with the phoenix front. This resulted in agreement on a coalition government, which was also a majority government, between the Conservative Party. Although many feel this will not last and the front will push for more power.."
 ENG_The_Conservative_Split:0 "The Conservative Split"
 ENG_The_Conservative_Split_desc:0 "Many conservative MPs believe that their party is doomed, and the time has come to choose whether they will stay with their old party or move to the highly popular phoenix front. The Tories are split, and many are choosing to either stay loyal or move to the new radical party."
 ENG_Stay_Moderate:0 "Stay Moderate"
 ENG_Stay_Moderate_desc:0 "Many Conservative MPs still believe in the status quo and wish to remain moderate. The Phoenix front is too radical to have in power let alone in a coalition. Due to the Tory split the moderates have remained while the traditional conservatives have left to join the front."
 ENG_Action_Against_Braiser:0 "Action Against Braiser"
 ENG_Action_Against_Braiser_desc:0 "Theresa Braiser is far too radical, and her ideology is something many should worry about. Its time all MPs from every party put forward action against her party and try to limit what she can do but as support keeps growing for her this could be too late and time may have just run out for democracy.."
 ENG_Move_To_The_Front:0 "Move To The Front"
 ENG_Move_To_The_Front_desc:0 "The conservative party is deeply divided. Many conservative MPs have left to join the phoenix front and support Braiser rather than their own conservative leader. Each week more MPs cross the floor to sit with the front and watch as their old party fail to get support for laws and reforms while the phoenix slowly begins to implement their own ideas."
 ENG_Nigels_Speech:0 "Nigels Speech"
 ENG_Nigels_Speech_desc:0 "Nigel Farage was the first to leave the conservative party. Once the front had been created, he joined braiser and helped campaign for her party. Now he is seen on television across the country showing what Britain could be like under the front. Every week he blasts each party for betrayal to the british people and it seems the people are now starting to listen."
 ENG_Another_Vote_Of_Confidence:0 "Another Vote Of Confidence"
 ENG_Another_Vote_Of_Confidence_desc:0 "The conservative party no longer have the support of their MPs and Braiser has pushed for a vote of no confidence against the prime minister. She has betrayed her coalition and it seems she may have just gained enough support to bring in her caretaker government and take control of government.."
 ENG_The_People_Protest:0 "The People Protest"
 ENG_The_People_Protest_desc:0 "Many across the country did not vote for the Phoenix and now they could be forced to live under a radical far right leader. Those who stand against this are now rioting in the streets and refusing to let their democratic right be removed."
 ENG_The_Phoenix_Rebels:0 "The Phoenix Rebels"
 ENG_The_Phoenix_Rebels_desc:0 "MPs of the Phoenix front will no longer let the conservatives be able to pass laws, reforms and more in the house of commons, they spread messages against all parties in the uk and why the front is the only party for the country. Their message is clear. The Phoenix Is For you."
 ENG_The_Tories_Stand_Down:0 "The Tories Stand Down"
 ENG_The_Tories_Stand_Down_desc:0 "After the vote of no confidence, the house of commons finds the conservatives no confidence and do not have the support to keep going. It’s time for Tories to stand down and give in. Democracy has fallen and the Phoenix now have full control over the government and are ready to implement their policies."
 ENG_Braisers_Britain:0 "Braisers Britain"
 ENG_Braisers_Britain_desc:0 "Braiser has full control over the country, she will run as a “caretaker government” but many speculate she will have something up her sleeve to remain in full control for many years over the country and now she has an overall majority in the house of commons, there is no one else to stop her."
 ENG_Review_The_Law:0 "Review The Law"
 ENG_Review_The_Law_desc:0 "The SDP has outdated laws which cause unfair convictions and no longer hold up to the modern standards of crime and safety. Its time the labour party reform the crime and safety laws in this country and build a safer better country. After all we do not want a repeat of the awful acts of the past few months."
 ENG_A_New_System:0 "A New System"
 ENG_A_New_System_desc:0 "Labours new plan to get the country into the 21st century is modern and innovative. It will ensure the millions of unemployed across the country are back into work and the young people get a much better standard of education."
 labours_recovery_guidee:0 "Labours Recovery Guide"
 labours_recovery_guidee_desc:0 "The country is suffering from a hard-hit economy and has no signs of recovery under the SDP. Labour will build Britain back onto the world platform. A plan to help families and businesses up and down the country along with a roadmap of where to take the country within the next few years."
 ENG_Work_With_The_ILP:0 "Working With The ILP"
 ENG_Work_With_The_ILP_desc:0 "Its time to put aggression to the side and work with the independent labour party. They still believe in many of the believes labour does and it will bring the left back together and an unstoppable force against the Tories and SDP."
 ENG_The_Benn_Plan:0 "The Benn Plann"
 ENG_The_Benn_Plan_desc:0 "Tony Benn has taken labour through many paths and has eventually led the path to victory. Now his plan can finally be put into action of what labour will do for the United Kingdom. Benn has always labelled himself as a social democrat and wants the perfect world for everyone. Now is the chance to prove this."
 ENG_Shirley_Has_Another_Chance:0 "Shirley Has Another Chance"
 ENG_Shirley_Has_Another_Chance_desc:0 "The people have chosen to give Shirley another chance, many of the previous events that happened months ago could not have been helped and now she has a chance to prove herself in power. Although many in the SDP and other parties are doubtful, she could make it a few months its time to give her a chance."
 ENG_Rebuild_MI5:0 "Rebuilding MI5"
 ENG_Rebuild_MI5_desc:0 "MI5 allowed terrorists to attack the heart of this nation as well as killing our beloved PM. MI5 will be rebuilt from the ground up and will put the safety of our people first and make sure they are able to do their job properly!"
 ENG_The_SDP_Reform:0 "The SDP Reforms"
 ENG_The_SDP_Reform_desc:0 "The SDP may have survived for over a decade but its also had many problems doing so, one example of this is the economy and how many thousands are still losing their jobs. The NHS is still struggling as well as many other things. Shirley has ensured that new reforms will take place to change this country."
 ENG_Shirley_Stands_Down:0 "Shirley Stands Down"
 ENG_Shirley_Stands_Down_desc:0 "Shirley Williams is the first female prime minister and has encountered many obstacles in her short time as PM. She has won an election for the SDP but she is also starting to grow old and believes its now time for someone to take over. She has created a starting point for the next leader to change the face of this great isle."
 ENG_The_SDP_Leadership_Election:0 "The SDP Leadership Election"
 ENG_The_SDP_Leadership_Election_desc:0 "With the announcement of Shirley standing down many in the SDP are scrambling to put themselves forward to become the next leader of the party and Prime minister. Although some key members have already put their names forward and gained popularity in such a small amount of time."
 ENG_The_Centrist_Approach:0 "The Centrist Approach"
 ENG_The_Centrist_Approach_desc:0 "The balance of power is hard, Conservatives are centre right while Labour is Centre left. The SDP were never true centrists. The Liberal Democrats are the true party who can unite the political spectrum and win the people over. With policies from both left and right, its time to make a true peoples government!"
 ENG_The_Liberal_Laws:0 "The Liberal Laws"
 ENG_The_Liberal_Laws_desc:0 "We are the LIBERAL democrats, we created liberal values and we will stand by them. A new set of laws which will be true liberal laws which are fair but also strict will ensure this country has a true sense of safety."
 ENG_Cleggs_Got_A_Plan:0 "Cleggs Got A Plan"
 ENG_Cleggs_Got_A_Plan_desc:0 "Nick Clegg won the election and brough the liberals back into power which was last done over 50 years ago. His “unique plan” he calls it will unite the country and build a strong economy while rebuilding the country’s infrastructure."
 ENG_Fair_But_Strong_Borders:0 "Fair But Strong Borders"
 ENG_Fair_But_Strong_Borders_desc:0 "The people of this country hate the fact they are on the doorstep of the communist European union and many far-left supporters manage to find their way into the country. A new border policy and stronger border laws will put the safety of our people first and the british people first."
 ENG_Plan_The_Future:0 "Plan The Future"
 ENG_Plan_The_Future_desc:0 "Now the LibDems are in power its time to plan on the future of the party and what their plans are with the country. Many suspect a new trading plan with the Americas while rebuilding new relationships with the EU."
 ENG_New_Prison_Systems:0 "New Prison System"
 ENG_New_Prison_Systems_desc:0 "Prison services are weak and no longer strike fear into the hearts of our people. Those who commit crimes must pay for it and that is what the conservative government will do. A new prison system will ensure the criminals in this country recognise the problems they cause to families and businesses."
 ENG_A_Conservative_Outlook:0 "A Conservative Outlook"
 ENG_A_Conservative_Outlook_desc:0 "The United Kingdom Of Great Britain has always been a true conservative nation deep down and the likes of Winston Churchill is proof of this. Its time for the people of this country to remember their history and which party really changed the face of this country and what will happen in the next 3 years."
 ENG_Begin_The_Tory_Government:0 "Begin The Tory Government"
 ENG_Begin_The_Tory_Government_desc:0 "Now the main policies have been written into law and the country can start its transition into a conservative government, its time for the people to no longer protest on the streets about the “Tory Plan” and a centre right party back in power but accept the new and embrace what good it will do for them."
 ENG_The_Torch_Of_Democracy:0 "A Torch Of Democracy"
 ENG_The_Torch_Of_Democracy_desc:0 "Democracy has won and now its time for the next government to take control of this great nation and never again let a far right or far left party try to steal the torch of democracy."
 ENG_New_Local_Authority:0 "New Local Authority"
 ENG_New_Local_Authority_desc:0 "Councils do work but just not for everyone and do not look after everyone. Creation a new local authority system will ensure that every town, village, and city have a group of local councillors looking after their area ensuring enough is done to keep the people happy."
 ENG_The_Royal_Question:0 "The Royal Question"
 ENG_The_Royal_Question_desc:0 "Now the communist, WP and ILP have formed a government together its time to decide the fate of the royal family and what actions they can take in this country. For too long the people’s government has asked to ask permission from her majesty. Now it stops."
 ENG_Rally_The_People:0 "Rally The People"
 ENG_Rally_The_People_desc:0 "The people need to understand the crown no longer plays a role in their lives and there is no need for it. Turning the people against the crown means the monarchy no longer can associate with the people"
 ENG_Criticise_The_Monarchy:0 "Criticise The Monarchy"
 ENG_Criticise_The_Monarchy_desc:0 "The crown is trying to turn the people against the people’s government. Its time to directly attack them on national tv and in the media. Its time to show the monarchy do not care for the people and only want one thing. Power."
 ENG_Condemn_The_Crown:0 "Condemn The Crown"
 ENG_Condemn_The_Crown_desc:0 "The monarchy keeps attacking the people’s government for trying to help the population of the great state. This shows the crown has no care, but power and the people are now understanding that this country can still be powerful without a king or queen."
 ENG_A_Pointless_Crown:0 "A Pointless Crown"
 ENG_A_Pointless_Crown_desc:0 "The crown and its laws are old and need reformed. Its time the country came to its senses and remove the crown from buildings and laws and turn the state into a modern equal land for all its people."
 ENG_A_New_Era:0 "A New Era"
 ENG_A_New_Era_desc:0 "A new era has started on the shores of England, Scotland, and wales. Now its time to really embrace the socialist ideals and accept that change has arrived. Jeremy Corbyn will lead the UK and his vision for the great isle will remove poverty, rebuild the economy, and make a fairer safe country as well as building stronger relations with the UK’s neighbours."
 ENG_The_Royal_Referendum:0 "The Royal Referendum"
 ENG_The_Royal_Referendum_desc:0 "Its time now to decide the fate of the crown.."
 ENG_The_Republic:0 "The Republic"
 ENG_The_Republic_desc:0 "Now the republic has been established its time to start rebuilding the nation under the vision of Chairman Galloway. How will he move forward, keeping the nation isolated or giving in to the EU and working with them?"
 ENG_New_Education:0 "New Education"
 ENG_New_Education_desc:0 " The education system is failing the young people of this nation and the young are missing out on great new jobs which could help this new state. Its time the education system is rebuilt from the ground up and give the young adults of the country a brand-new start in this world!"
 ENG_Invest_In_State_Schools:0 "Invest In State Schools"
 ENG_Invest_In_State_Schools_desc:0 "State schools have bene left behind while the private schools keep their strong investment from private companies. Now is the time to put the state schools first and limit the way the private sector works for education. State schools will now be funded more than they ever have been and provide a better start for this countries young people."
 ENG_Free_University:0 "Free University"
 ENG_Free_University_desc:0 "Universities should be free for everyone as education is a vital part for everyone’s education no matter the age! From this moment on tuition fees will be abolished and the republics government will introduce free universities"
 ENG_Remove_Private_Adverts_For_Education:0 "Remove Private Adverts For Education"
 ENG_Remove_Private_Adverts_For_Education_desc:0 "Adverts run all the time on billboards, in the media and even shown in some schools. This must be stopped as this creates a disadvantaged percentage of young people who may not be able to afford private education and be left behind whereas the rich can be given. This state is an equal fair nation which its people are given free education at the highest rate it can be given too!"
 ENG_Nationalise_Royal_estates:0 "Nationalise Royal Estates"
 ENG_Nationalise_Royal_estates_desc:0 "The royal estates are never used if they are its once or twice a year. This is a waste of such a fine building which can be used to house the poor and homeless turning it into modern historic flats to house the countries poor. The buildings will remain the same outside but inside will be a modern home for all!"
 ENG_The_Royal_Museums:0 "The Royal Museums"
 ENG_The_Royal_Museums_desc:0 "With the fate of the royal family decided its time their goods were also returned to the people. Putting them on display in museums to remember the history of the nation is important and removing them completely would be a mistake. Looking back on history is important and is what changes the world."
 ENG_The_Peoples_Guard:0 "The Peoples Guard"
 ENG_The_Peoples_Guard_desc:0 "There is no longer a need for a queen’s guard. Now the queens guard will be reformed and reintroduced as the ‘Peoples Republican Guard’. They will be stationed outside state government buildings and help the people of the state as they always should have."
 ENG_Remember_our_history:0 "Remember Our History"
 ENG_Remember_our_history_desc:0 "Removing history of the United Kingdom would be wrong. Remembering everything that has led up to now is important and should be remembered! History has always been important to prevent bad events happening again and this will be the same."
 ENG_Dissolve_Parliament:0 "Dissolve Parliament"
 ENG_Dissolve_Parliament_desc:0 "Parliament is corrupt and broken. It allows anyone to become an MP no matter their background and if enough power is given to one person, they can cause complete devastation just like the conservative party have in the past and the SDP unable to contain their past governments.  A new system will be created and a one which stands up for the people!"
 ENG_Invite_The_Green_Party:0 "Invite The Green Party"
 ENG_Invite_The_Green_Party_desc:0 "The green party holds the same values as the socialist and communist party. All three parties believe in strong green energy and peace throughout the world. Inviting the green party to join our government could be beneficial and show the people of the state that real change is on the way."
 ENG_For_The_People:0 "For The People"
 ENG_For_The_People_desc:0 "Everything that has been written into law. Reformed and changed has been for one thing. The people. The people have witnessed a broken and corrupt country turn into a socialist state with fairness and equal rights for all. Decreasing poverty and stronger, better relations in the outside world. The people of the republic can sleep better at night knowing the streets are safer and the state will care for them."
 ENG_Remove_The_Right:0 "Remove The Right"
 ENG_Remove_The_Right_desc:0 "The right are still allowed to walk the streets parading their fascist ideals to people and try to condemn the republics government. Removing the right wing and the far right is the best thing to do to ensure no more fascists could brainwash the people of the state."
 ENG_Ban_Britain_First_And_The_BNP:0 "Ban Britain First And The BNP"
 ENG_Ban_Britain_First_And_The_BNP_desc:0 "The BNP are a disgusting group of racists who want nothing more than complete control of a country and take it down an extremely dangerous path as well as the fascists Britain First who wish to wipe out the none british people of the country. Banning these groups will ensure a safe strong state with no one targeting groups of people."
 ENG_Arrest_Braiser:0 "Arrest Braiser"
 ENG_Arrest_Braiser_desc:0 "Theresa Braiser is an extremely dangerous woman and poses a huge threat to the country. Her ideals are remarkably like past dictators and wish to turn Britain into a dark isolated nation who controls the people and remove the help we give to the people. Arresting her and removing her from any platform can prevent anything like this to happen to Britain and her followers will surely lose faith."
 ENG_Ban_Right_wing_media:0 "Ban Right Wing Media"
 ENG_Ban_Right_wing_media_desc:0 "The right wing still has the power of social media as well as other media across the nation. Banning it completely will remove any type of right-wing ideology from spreading and causing more groups to be created."
 ENG_Question_Corbyns_Leadership:0 "Question Corbyns Leadership"
 ENG_Question_Corbyns_Leadership_desc:0 "Jeremy Corbyn has been the first far left leader to ever be elected to power and has made many changes but yet the communists and workers party are still unhappy with the way he has lead the country as he still believes in some parts of democracy and some of the old ways. His leadership is questionable and many still are not happy."
 ENG_Not_Red_Enough:0 "Not Red Enough"
 ENG_Not_Red_Enough_desc:0 "Although the national anthem has been changed to the ‘red flag’ and the monarchy and most elements of capitalism has been removed Corbyn still refuses to change the electoral system which proves he is not a real socialist at heart. Its time for his leadership to come to an end and a real far left leader to take control of this reborn state."
 ENG_A_New_Leader_For_Britain:0 "A New Leader For Britain"
 ENG_A_New_Leader_For_Britain_desc:0 "Jeremy Corbyn has been removed from power by the Communists and Workers Party. Its now time for the parties to meet and choose who the next leader of the republic will be. There are 4 main people who could take charge of the country, but the question is how far left do they wish to go and change the state completely?"
 ENG_John_McDonnell:0 "John Mcdonnell"
 ENG_John_McDonnell_desc:0 "John McDonnell was always a good friend of Jeremy Corbyn’s but also is a more left-wing socialist than Corbyn. If McDonnell was to be elected as leader, then many laws would remain but also many public works would change. He is a true socialist who can also meet the eyes of the liberals as well to keep a stable nation working."
 ENG_New_NHS_Service:0 "Republican Health Service"
 ENG_New_NHS_Service_desc:0 "No matter how many governments have taken control they have never fixed the NHS. Now a real socialist is in charge, its time the NHs underwent huge reforms and changes ensuring all private elements of it has been removed and a better standard of work is given to the people as they say, the NHS is the beating heart of this nation."
 ENG_Dermot_Hudson:0 "Dermot Hudson"
 ENG_Dermot_Hudson_desc:0 "Dermot Hudson, not much is known about him other than he has met the leader of Korean more than once within the last 5 years and agrees with many of the unhuman acts that goes on there..Hudson has his own vision for the state but has so far kept that to himself..Now its time to see what he truly wants for Britain.."
 ENG_Robert_Griffiths:0 "Robert Griffiths"
 ENG_Robert_Griffiths_desc:0 "Robert Griffiths, this is the man who brought the communist party to the popularity it is now. After many meetings in the Soviet Union and funding from them to help his party grow, he can finally build the communist state he has always dreamed of."
 ENG_Ella_Rule:0 "Ella Rule"
 ENG_Ella_Rule_desc:0 "Ella Rule is the leader of the workers party and always stayed in the middle between the communists and socialists. She is a woman of the people but also believes in equality and really pushing for a modern fair free state. Although she does take a hard-line stance against capitalism, she does believe that the people come first and socialism through peace is a must."
 ENG_The_Gates_Of_Royalty:0 "The Gates Of Royalty"
 ENG_The_Gates_Of_Royalty_desc:0 "The queen has taken charge of the country and is ready to direct the country towards a monarchy rule and finally give the British people a country they are proud to call home. Buckingham Palace has never been so busy its in years of service to the people and now its time to give the queen her chance to be the ruler she has always tried to be."
 ENG_The_Queen_and_her_empire:0 "The Queen And Her Empire"
 ENG_The_Queen_and_her_empire_desc:0 "Her royal majesty has given out her orders of what changes will take place in the nation. Scotland faces many troubles which needs to be addressed while the economic problems in Wales must also be looked into. Its time to fix the nation at last."
 ENG_The_Welsh_are_restless:0 "The Welsh Are Restless"
 ENG_The_Welsh_are_restless_desc:0 "Wales was always resistant to the british government and now they are ruled over an English monarchy causing more protests in the state. Her majesty knows Wales is not the same state it used to be and is desperate need of change. Therefore, she has ordered her royal subjects to prepare for the complete reform of Wales and its people."
 ENG_The_Red_Dragon:0 "The Red Dragon"
 ENG_The_Red_Dragon_desc:0 "The Welsh people look to the red dragon as a symbol of their Welsh heritage and its values. The queen understands and respects their values but the Welsh must also embrace the English traditions too therefore limits will be placed on Welsh traditions and mixed within English traditions too for a more equal state for both English and Welsh."
 ENG_Ban_The_welsh_language:0 "Ban The Welsh Language"
 ENG_Ban_The_welsh_language_desc:0 "Only a small percentage of people living in Wales speak Welsh and is mainly a forgotten useless language. It also sparks Welsh nationalism which must be prevented which is why the language must be banned and all Welsh signs and media will no longer use the old Celtic words and the English language will be the only language that comes out of their mouth."
 ENG_Visit_The_miners:0 "Vist The Miners"
 ENG_Visit_The_miners_desc:0 "Recently a huge mining disaster occurred in a rural village of Wales killing many adults and children due to landslides from the mine disaster. Her royal majesty has visited the village as well as inspecting the mines of Wales and has ordered all of the infrastructures to be updated and inspected with new safety laws for the workers of Wales."
 ENG_Rescue_aid:0 "Rescue Aid"
 ENG_Rescue_aid_desc:0 "Due to the huge shift in the political landscape many industries have moved out of Wales and the economy has collapsed with house prices soaring and food getting expensive. The queen has ordered an emergency aid package to be sent to the councils of Wales to help the people out until a new authority has been created to look after the Welsh state."
 ENG_The_prince_of_wales:0 "The Prince Of Wales"
 ENG_The_prince_of_wales_desc:0 "Charles is the prince of Wales, yet he has only attended a school for two weeks in his life at Wales. Its time he acts upon his royal duty and take control of the deprived state. He will be sent to Wales with his wife Camilla and take control of the new reforms and changes in the country. He will be in charge of setting up the new authorities here and take Wales into a modern 21st Century."
 ENG_A_New_Country:0 "A New Country"
 ENG_A_New_Country_desc:0 "Charles is now officially in command of the Welsh state and has already ordered a new industrial and manufacturing hub to be created here. As well as this new modern state houses will be built to house the people and new education reforms encouraging the people of Wales to learn about the heritage of Britain to be set up."
 ENG_St_davids_day:0 "St Davids Day"
 ENG_St_davids_day_desc:0 "St David’s Day is a national holiday in Wales and its time to expand on this. It will be changed and celebrated more than ever with Charles and Camilla now in charge and changes taking place to make Wales a crown prize of the monarchy!  It’s a day of celebration for not just Wales but the whole of the United Kingdom."
 ENG_Ban_the_Welsh_flag:0 "Ban The Welsh Flag"
 ENG_Ban_the_Welsh_flag_desc:0 "Now the royals are completely in charge of Wales its no longer a need to keep England and Wales separate, the shared values and ideals are the same and now its time to celebrate under the same flag. The Welsh flag will be banned and the union jack will now be raised over the Welsh state."
 ENG_The_English_Fist:0 "The English Fist"
 ENG_The_English_Fist_desc:0 "Although there is a small percentage of English residing in Wales, they will be put pushed to be first classed citizens in some areas such as jobs and education. If it wasn’t for the English, Wales would not be changing the way it is now to a progressive modern state, therefore the English must be rewarded for such great work."
 ENG_The_Scotland_Problem:0 "The Scotland Problem"
 ENG_The_Scotland_Problem_desc:0 "Scotland has been trying for years to become an independent nation, now the crown is in charge they will never get the chance, BUT this does not mean it can be forgotten, rather than we can invest in the state, get the people on our side and work with the local councils to change Scotland into a modern, strong economic state."
 ENG_Deal_With_The_Drug_Problem:0 "Deal With The Drug Problem"
 ENG_Deal_With_The_Drug_Problem_desc:0 "Many of the cities in Scotland are suffering with a huge drug problem, due to lack of investment and a major unemployment problem its time to fix this. New investment will now be given to Scotland as well as new police reforms and expansions taken place to remove the drug gangs off the street. No longer will Scotland be looked down upon as a drug ridden state."
 ENG_Berwick_The_Border:0 "Berwick The Border"
 ENG_Berwick_The_Border_desc:0 "Berwick is the border town between Scotland and England and is something that needs to be focused on. Much investment has either been sent to England and Scotland but never spent on the historic border town. New investment and promotions for holidays here will be created to increase tourism and jobs opening up the entrance to both nations and easier travelling."
 ENG_Remember_Balmoral_Castle:0 "A Visit To Balmoral Castle"
 ENG_Remember_Balmoral_Castle_desc:0 "The queen has ordered the historic home of Balmoral Castle to be renovated. The castle was last used in the late 80s but then due to lack of travel from the royals and the old governments lack of care for the royals it was left to be abandoned. Now with new renovations, the royal family can visit the Scottish home again and give the Scottish people a peace of mind they have not been forgotten."
 ENG_The_Duke_Of_Edinburgh:0 "The Duke Of Edinburgh"
 ENG_The_Duke_Of_Edinburgh_desc:0 "Someone must take control of Scotland while her royal majesty controls England. Her husband Philip will be sent to Edinburgh castle to take control of the state and control the new laws and reforms taken place in Scotland. With a royal in Scotland the people of the state will no longer feel they are being left out of the English rule."
 ENG_Scottish_Aid:0 "Scottish Aid"
 ENG_Scottish_Aid_desc:0 "Scotland is in desperate need of investment; the job market needs revival, and the Scottish industry needs to be taken into the 2010s with new safety laws and better wages. Not only that but roads need to be rebuilt, towns to be updated and the people to be given more opportunities for a better life in Scotland."
 ENG_Remove_The_Scottish_parties:0 "Remove The Scottish Parties"
 ENG_Remove_The_Scottish_parties_desc:0 "The Scottish parties and mainly pro independence and cause a significant threat to the monarchy rule which is why they must be removed from power and their influence in Scotland lowered to prevent more people wanting to union to break up."
 ENG_The_Scottish_Army:0 "The Scottish Army"
 ENG_The_Scottish_Army_desc:0 "The Scottish army are loyal to Queen Elizabeth and the royal family and more investment much be given to the Scottish armed forces due to such loyalty to the crown. Their heritage and influence in Scotland is greatly respected across the country and we must make sure they are not forgotten."
 ENG_Ban_The_Scottish_Nationals:0 "Ban The Scottish Nationals"
 ENG_Ban_The_Scottish_Nationals_desc:0 "After the removal of Scottish parties, the SNP demanded the people rise up against the monarchy and remove Philip from power. Due to such extreme thoughts and acts this cannot be allowed to happen. The SNP has now been titled as a terrorist organisation and their activities in the nation will be banned."
 ENG_Rebuild_Scotland:0 "Rebuild Scotland"
 ENG_Rebuild_Scotland_desc:0 "Its time Scotland finally gets the investment it desperately needs and takes the state to a modern age. Private companies have been hired from across Scotland, Wales and England to start rebuilding Town and Cities in Scotland as well as new education centres and new job opportunities for the people."
 ENG_Recover_From_The_Backlash:0 "Recover From The Backlash"
 ENG_Recover_From_The_Backlash_desc:0 "The last few years Scotland’s economy has been dropping and more people have been facing unemployment. Now with the Queen and Philips rule over the nation, already the job market has opened again stronger with house prices now dropping and more younger adults graduating from universities. "
 ENG_The_World_outside:0 "The World Outside"
 ENG_The_World_outside_desc:0 "Now the United Kingdom is now in a stable environment its time to look outside, meeting with our old friends who share similar values to us. Those who believe in democracy and the monarchy. As well as looking to the communists who threaten the rest of us. Its time to rebuild the empire and its common goals."
 ENG_Meet_With_American_CAN_Leaders:0 "Meet With American & Can Leaders"
 ENG_Meet_With_American_CAN_Leaders_desc:0 "The American warlords may have their own views on how their countries should be ruled but they have one common goal, the removal of the communist/leftist menaces. The same as our old friend Canada. The American republic is the old formation of the United States and one of our greatest allies. Befriending them is a great benefit to us as well as rebuilding our trust and friendship with Canada and the democratic League."
 ENG_The_UK_Is_Great_On_its_own:0 "The UK Is Great On Its Own"
 ENG_The_UK_Is_Great_On_its_own_desc:0 "The United Kingdom can choose its own course without the conflict of interests from others. Being on our own and deciding on what we want to do with our future will greatly benefit us and allow our old empire to return."
 ENG_Target_Europe:0 "Target Europe"
 ENG_Target_Europe_desc:0 "Europe is a great threat to us and democracy. Planning to remove the leftist’s rule from Europe is a huge benefit and can also restore the old order of strong European rule. It would also remove influence from the Soviet Union. It will take a lot of work but with our new allies we could stand a good chance."
 ENG_Remember_D_Day:0 "Remember D Day"
 ENG_Remember_D_Day_desc:0 "D Day was the day when democracy returned to the shores of European and removed fascists from power. A repeat of this will show the world Europe will always be returned back to a democratic society and will never fall to the left and right no matter who is in power."
 ENG_The_Danish_Plan:0 "The Danish Plan"
 ENG_The_Danish_Plan_desc:0 "Denmark is the least defended country in Europe and a great landing dock for our soldiers. The plan to take the state and create a base from there would greatly increase the chances to win a war in Europe. It would also be right in the middle of Europe which would be a great starting point to take Germany the power house of Europe."
 ENG_The_European_Spring:0 "The European Spring"
 ENG_The_European_Spring_desc:0 "The European Spring has created a huge unbalance in Europe, and this is the best chance to take the continent. With such an unbalance of power and threats from all sides, a war from a stable and strong country would plunge the communists and an easier war with the help from the European people."
 ENG_Begin_Propaganda_Efforts:0 "Begin Propaganda Efforts"
 ENG_Begin_Propaganda_Efforts_desc:0 "Its time to spread the word that Europe can change and a new regime can be established to set the people free com communist rule. Spreading the word through radio stations into Europe and leaflet dropping by planes will help push the people in Europe to remove their communist dictators."
 ENG_Support_Democracy_Groups:0 "Support Democracy Groups"
 ENG_Support_Democracy_Groups_desc:0 "One thing is for sure, Democracy groups are vital to removing the communists from Europe. Many would rather have democratic governments in power than communists, therefore its on our interests to help support the resistance groups in Europe to push the communists out and restore the democratic will of the people."
 ENG_Send_Pro_Monarchy_Supporters:0 "Send Pro Monarchy Supporters"
 ENG_Send_Pro_Monarchy_Supporters_desc:0 "Of course the ideal plan for Europe is to have Kings and Queens on the throne in France and Europe like ourselves and Spain. Already Napoleon of France resides here waiting to return to France. Now its also time to send protesters to France and other countries in Europe to influence the people and bring Monarchy rule back"
 ENG_The_Queen_Grows_Tired:0 "The Queen Grows Tired"
 ENG_The_Queen_Grows_Tired_desc:0 "The Queen is getting old, and she is getting tired more often. Its time to start deciding on who is to rule once she departs the Throne. Although she has promised to die on the throne, she also has to acknowledge for the future of the country that stability is needed, it has been decided that William and Kate are next in line due to Charles ruling Wales although Liz could still remain.."
 ENG_William_And_Kate_Are_Ready:0 "William And Kate Are Ready"
 ENG_William_And_Kate_Are_Ready_desc:0 "Queen Elizabeth has decided it is best to stand down at her old age and give the young couple the chance to rule the nation. Will and Kate have been against the complete monarchy rule and believe its time to reform the nation but also return the nation back to the people’s rule. Its time for the progressives to take the Throne."
 ENG_Queen_Till_The_End:0 "Queen Till The End"
 ENG_Queen_Till_The_End_desc:0 "Liz turned her nose at the thought of giving up her absolute power. She intends to restore the Empire and break the EU up. She will rule the country until her last dying breath."
 ENG_Meet_With_the_poor:0 "Meet With The Poor"
 ENG_Meet_With_the_poor_desc:0 "King William and his Queen Kate have visited the most deprived areas of the nation and spoke to the people about what they would change in the country. It seems the new rulers are already winning over the hearts of the people."
 ENG_State_Investment:0 "State Investment"
 ENG_State_Investment_desc:0 "Its time for not only Wales and Scotland but the whole United Kingdom to have the desperate investment it needs into infrastructure. Allowing jobs to be created and rebuild the country’s economy as well as establishing new rail services and rebuild the industry in the country."
 ENG_Better_Welfare:0 "Better Welfare"
 ENG_Better_Welfare_desc:0 "Welfare is something that the United Kingdom has always struggled with, there’s not enough for the people or wrong people get too much of it. Now its time to reform the system and ensure those who need the help get the correct help and improve the british peoples lives."
 ENG_Free_Education:0 "Free Education"
 ENG_Free_Education_desc:0 "Something Labour and the SDP always promised was to either cut tuition fees and reform the education system. This was something that always failed. Now Will and Kate are in power and both went to universities they were able to see the problems and can address the issues by removing tuition fees and reforming the education system."
 Rebuild_The_Parliament_system:0 "Rebuild The Parliament System"
 Rebuild_The_Parliament_system_desc:0 "Parliament allowed laws to be created and debates could be addressed. Unfortunately it also created an elite ruling class and forgot about the people and systems in the country that needed to be fixed. Parliament will be reformed and rebuilt with new rules introduced to create a fair and more equal system for MPs to debate and address the real problems."
 Reopen_parliament:0 "Reopen Parliament"
 Reopen_parliament_desc:0 "The time has come, William and Kate have met with party leaders and have all agreed its now time for the democratic institute to return and let the people finally have control of their country! The first debates will take place soon and the King and Queen are ready to transition back into a constitutional monarchy."
 Return_of_The_old_ways:0 "Return Of The Old Ways"
 Return_of_The_old_ways_desc:0 "Parliament was opened by King William addressing the house and accepting the new season of parliament to begin. He has ordered a new election to take place in the next few weeks to elect a new body of government and allow the old system to return back into the nation."
 ENG_Start_The_Propaganda_War:0 "Start The Propaganda War"
 ENG_Start_The_Propaganda_War_desc:0 "Its time to let the people of Europe know help is on the way and they no longer need to be in fear of their government, its time for those people to rise up and make a stand!"
 ENG_invade_Denmark:0 "Invade Denmark"
 ENG_invade_Denmark_desc:0 "Its time to take the country which will allow us to take the whole of Europe. Denmark will be freed from communist rule and a monarchy will be place onto the throne!"
 ENG_A_Piece_Of_Europe:0 "A Piece Of Europe"
 ENG_A_Piece_Of_Europe_desc:0 "Now we have Denmark in our hands its time to defend the countries borders against any attacks and prepare to take the rest of Europe!"
 ENG_A_New_Alliance:0 "A New Alliance"
 ENG_A_New_Alliance_desc:0 "Its time to create a new alliance between the royalties of Europe! Celebrating a wedding between the Spanish and the british could create ties which unite both countries and work together against our enemies."
 ENG_Prepare_For_The_empire:0 "Prepare For The Empire"
 ENG_Prepare_For_The_empire_desc:0 "After the changes that the nation has went under, its now time for the Queen to plan for the future. She has always wished for the return of her empire and now its time for that dream to become a reality. With pro monarchy protests taking hold of Europe this is the ideal time to push for the Empire."
 ENG_Spanish_And_British_Exercises:0 "Spanish And British Exercises"
 ENG_Spanish_And_British_Exercises_desc:0 "With the alliance of the British and Spanish secure its now time for our armies to work together and prepare for a communist attack on our nations as well as sharing security and working together to prevent cyber attacks."
 ENG_Put_Down_the_protesters:0 "Put Down The Protesters"
 ENG_Put_Down_the_protesters_desc:0 "Protests are occurring on the streets due to the strict rule the queen is having over the nation. This is not acceptable and the only justifiable way to deal with this is removing these traitors off the face of the nation by force."
 ENG_Restore_The_Flag:0 "Restore The Flag"
 ENG_Restore_The_Flag_desc:0 "Its time to restore the true flag of the nation. No longer will a false flag be presented over our nation. The true union jack will be raised over the nations buildings."
 ENG_The_Empire_Returns:0 "The Empire Returns"
 ENG_The_Empire_Returns_desc:0 "We have taken the countries that used to belong to the Empire. We have freed them from poverty and open to attacks from other nations. Any communist threat on-going in those nations have been removed and now the people are free to live their lives in peace without worries while her majesty watches over them all in glory."
 ENG_Low_taxes_for_oversea_business:0 "Low Taxes For Oversea Business"
 ENG_Low_taxes_for_oversea_business_desc:0 "The nation needs investment and money to support the people and the future of what will become the Empire. Allowing private businesses to set up business here and employ the people will push our economy and give the confidence businesses need."
 ENG_Manage_Oversea_Investment:0 "Manage Oversea Investment"
 ENG_Manage_Oversea_Investment_desc:0 "Although we currently do own much oversea colonies it is time, we plan to take control of them and maintain them. Once our nations grows so will its economy and therefore we must ensure the overseas businesses are managed well and pays its fair share back to the nation."
 ENG_The_New_bank_of_england:0 "The New Bank Of England"
 ENG_The_New_bank_of_england_desc:0 "The bank of England is to be reformed and rebuilt to provide more support to our puppet governments overseas and prepare for a massive expansion in our treasury. As our new empire grows such does its money and therefore the taxes paid back to us needs to be handled more efficiently to build our empire strong."
 ENG_The_royal_economy:0 "The Royal Economy"
 ENG_The_royal_economy_desc:0 "The economy isn’t in great shape to say the least and the one job Queen Elizabeth has promised is to overhaul the economy and rebuild it to a strong competitor against the likes of the Dollar and Euro."
 ENG_Reform_trade_unions:0 "Reform Trade Unions"
 ENG_Reform_trade_unions_desc:0 "Trade Unions have played hell with us since we took power and since banning leftist parties from entering government its caused more. Banning them outright would be wrong as the working class must be protected against being taking advantage of but placing limits on the unions would also be beneficial to us."
 ENG_The_NHS_solution:0 "The NHS Solution"
 ENG_The_NHS_solution_desc:0 "The NHS is the beating heart of the nation, and her majesty knows this but she also knows its caused many problems in government and keeps bleeding money out of the treasury which could be put towards other useful reforms. Its time to limit some areas of the NHS and privatise some areas of the NHS to save us money and gain money from private health companies."
 ENG_Reward_the_rich:0 "Reward the Rich"
 ENG_Reward_the_rich_desc:0 "The SDP and Labour have put taxes up for the rich and wealthy which is unfair due to many of them having worked hard to get where they are in life today! Its time to reward them for their hard work and cut taxes for some of those who have proven the hard work over their lives."
 ENG_Secret_police:0 "Secret Police"
 ENG_Secret_police_desc:0 "Although we say our nation is free, in short its not. We have many thousands across the nation who protest against the monarchy and are a threat to the future of the crown. Creating a police force which deals with traitors will ensure the survival of the crown."
 ENG_Spy_on_the_people:0 "Spy On The People"
 ENG_Spy_on_the_people_desc:0 "School children will be taught to report parents for being unfaithful to the regime that has been created. Neighbours will be prompted to report each other if one of them suspects them not being loyal to the crown. The police will have the power to invade homes and ensure the people are loyal."
 ENG_Royal_TV:0 "Royal TV"
 ENG_Royal_TV_desc:0 "The BBC has been transformed into a royal broadcasting company and will broadcast messages from Buckingham palace and from her majesty. It will broadcast the work going around in the country and how our loyal people look up to our queen as the savour of the country."
 ENG_A_queen_in_every_household:0 "A Queen In Every Household"
 ENG_A_queen_in_every_household_desc:0 "It has been put into law that every household, up and down the country must have a portrait of her majesty in their living room hung up and cleaned. Any dust found or dirt on those pictures will be arrested due to being a traitor."
 ENG_HRM_Intelligence_Force:0 "HRM Intelligence Force"
 ENG_HRM_Intelligence_Force_desc:0 "MI5 and MI6 will now be rebuilt and renamed as “Her Royal Majesties Intelligence Force” which will tackle terrorist and traitor activity across the nation as well as being able to track communist and soviet activity over seas."
 ENG_arrest_leftist_leaders:0 "Arrest Leftist Leaders"
 ENG_arrest_leftist_leaders_desc:0 "Jeremy Corbyn, George Galloway, and many more leftist leaders pose a threat to her majesties rule and must be dealt with using swift action. They will all be imprisoned in the Tower Of London and prevent any type of far left influence from causing more harm in our reborn nation."
 ENG_ban_right_wing_leaders:0 "Ban Right Wing Leaders"
 ENG_ban_right_wing_leaders_desc:0 "Although the right wing helped the royals take power, they also wish power upon themselves. This must be prevented, and the likes of the BNP and Braiser Phoenix Front will be out right banned."
 ENG_Only_royalty:0 "Only Royalty"
 ENG_Only_royalty_desc:0 "Only the monarchy can rule this nation. During the times of the Saxons and medieval days, the kings, and queens of old ruled this land and that tradition will continue today. Puppet parliaments may be set up for the sake of the people’s confidence but only the Monarchy will truly rule this land."
 ENG_The_death_of_the_Duke:0 "The Death Of The Duke"
 ENG_The_death_of_the_Duke_desc:0 "Prince Philip, Queen Elizabeth II's husband, has died Buckingham Palace has announced."
 ENG_Revenge_in_India:0 "Revenge In India"
 ENG_Revenge_in_India_desc:0 "The queen wants revenge for her husband’s death. The old nations of the Empire will regret the day they left us. She will take her title back of the Empress of India."
 ENG_Empire_Of_America:0 "Empire Of America"
 ENG_Empire_Of_America_desc:0 "The American states have been taken and now the people of the Americas are free to no longer live-in fear of the warlords that existed. Her Majesty has decided rather than puppeting such a large continent with similar values to us. The nation will transition to a monarchy and both nations will work side by side for the future of our people."
 ENG_The_Dominion_Of_America:0 "The Dominion Of America"
 ENG_The_Dominion_Of_America_desc:0 "American has been taken back by the british and now its time to make our American continent a puppet of our nation and push our British values and system into the American way so the people can finally realise what they have missed out on and what a true free country is under their monarchy."
 ENG_new_labour:0 "New Labour, New Life for Britain."
 ENG_new_labour_desc:0 "The New Labour brand was developed to regain trust from the electorate and to portray a departure from their traditional socialist policies which was criticised for its breaking of election promises and its links between trade unions and the state, and to communicate the party's modernisation to the public."
 ENG_labours_new_path:0 "Welfare and social security"
 ENG_labours_new_path_desc:0 "Labour will be the party of welfare reform. In consuStation and partnership with the people, we will design a modern welfare state based on rights and duties going together, fit for the modern world."
 ENG_labours_new_wage:0 "The National Minimum Wage Act"
 ENG_labours_new_wage_desc:0 "The National Minimum Wage Act will increase better standards of living and people to be paid a fair amount for their job."
 ENG_rebuild_the_nhs:0 "Rebuild The NHS"
 ENG_rebuild_the_nhs_desc:0 "Its time to save the NHS. Labour created the NHS, We want to save and modernise the NHS. we will restore the NHS as a public service working co-operatively for patients, not a commercial business driven by competition."
 ENG_devolution:0 "Devolution"
 ENG_devolution_desc:0 "The United Kingdom is a partnership enriched by distinct national identities and traditions. Scotland has its own systems of education, law and local government. Wales has its language and cultural traditions."
 ENG_new_labours_green_deal_revolution:0 "New labours green deal revolution"
 ENG_new_labours_green_deal_revolution_desc:0 "building publicly-owned wind farms, retrofitting the UK’s housing stock to provide warmer homes for all, planting 2 billion trees, upgrading the country’s dangerously insufficient flood defences, investing in localised power generation and in new forms of tidal power."
 ENG_labours_recovery_programme:0 "Labours Recovery Programme"
 ENG_labours_recovery_programme_desc:0 "Millions of people fear losing their job, their home, or their business. The Labour government's National Recovery Programme will start to remove that fear with immediate action on investment. jobs and training. It will combat recession now and build sustained and sustainable recovery for the future."
 ENG_britain_forward_not_back:0 "Britain Forward, Not Back"
 ENG_britain_forward_not_back_desc:0 "We’ll ask those who earn more than fifty thousand a year to pay a more income tax, We will recruit over 10,000 NHS staff. We will create the National Cyber Security Centre for our digital future!"
 ENG_a_new_internationalism:0 "A New Internationalism"
 ENG_a_new_internationalism_desc:0 "International peace and security will be a primary objective of a Labour government’s foreign policy. Failed military interventions in countries like Libya has worsened security across North Africa, accelerating the refugee crisis.We will introduce a War Powers Act to ensure that no prime minister can bypass Parliament to commit to conventional military action."
 ENG_a_responsible_approach:0 "A responsible approach"
 ENG_a_responsible_approach_desc:0 "Set the UK on a course to reduce debt as a share of national income and create a fair plan to reduce the deficit by ensuring the rich pay "their fair share" and corporations are unable to avoid "tax responsibilities""
 ENG_mend_our_broken_society:0 "Mend our broken society"
 ENG_mend_our_broken_society_desc:0 "The number of people living in poverty has risen in the last years, and inequality is at a record high. Therefore we will create affordable housing, tackle homelessness, and create welfare reforms"
 ENG_a_better_deal:0 "A Better Deal"
 ENG_a_better_deal_desc:0 "Create a new ‘start-up allowance’ to help those starting a new business with their living costs in the crucial first weeks of their business as well as supporting fast-growing businesses seeking to scale up, through the provision of mentoring support."
 ENG_green_industry_green_jobs:0 "Green Industry, Green Jobs"
 ENG_green_industry_green_jobs_desc:0 "We will provide support for innovation to cut energy and fossil fuel use in industrial processes – reducing emissions, cutting dependence on fossil fuel imports and generating jobs and prosperity."
 ENG_a_peaceful_world:0 "A Peaceful World"
 ENG_a_peaceful_world_desc:0 "Promote democracy and stability to our European neighbors showing them that democracy is the correct path. Work closely with the oversea and international partners to exert maximum economic and political pressure, and standing by next to the democratic league alliance."
 ENG_austerity_programme:0 "Austerity Programme"
 ENG_austerity_programme_desc:0 "Due to much spending by our previous government, we need to reduce the national debt therefore spending reductions have been made to welfare payments, housing subsidies, and social services. included reductions in welfare spending, the cancellation of school building programs, reductions in local government funding, and an increase in VAT. Cutting Spending on Councils, NHS and prisons will also be reduced"
 ENG_national_education_system:0 "National Education System"
 ENG_national_education_system_desc:0 "The NES will do the same for the 21st as the NHS did for the 20th, giving people the right to a free education by abolishing university tuition fees and introduce maintenance grants as well as building a stronger and better education system for all. NES will be built on the principle that ‘Every Child – and Adult Matters’"
 ENG_build_the_northern_powerhouse:0 "Build the northern powerhouse"
 ENG_build_the_northern_powerhouse_desc:0 "The Northern Powerhouse is the government’s vision for a super-connected, globally-competitive northern economy, by investing in skills, innovation, transport, and culture to bridge the north-south divide."
 ENG_nationalise_the_country:0 "Nationalise the country"
 ENG_nationalise_the_country_desc:0 "Its time to establish a Public Ownership Unit to develop legal and financial plans to bring private industries into the state sector. nationalise water, energy, gas and electricity distribution and supply, train operators and bus travel!"
 ENG_the_british_defence_act:0 "The british defence act"
 ENG_the_british_defence_act_desc:0 "The british defence policy has altered since the Labour Government came to power and we believe we need to make a change. Therefore we will join the democratic league and help our allies in the fight to protect democracy, although this does not mean we will strike war..."
 ENG_replacement_of_the_trident:0 "Replacement of the Trident"
 ENG_replacement_of_the_trident_desc:0 "The ‘Dreadnought’ programme is about the design, development and manufacture of four new Dreadnought-class ballistic missile submarines.These will replace the Vanguard-class submarines and maintain the UK’s continuous at sea deterrence posture against the warsaw pact"
 ENG_Rebel_against_Phoenix:0 "Rebel Against The Phoenix"
 ENG_Rebel_against_Phoenix_desc:0 "As more of the people turn against the Phoenix Front and join the rebellion, the more power the group has against Braiser. Its time to take a bigger stand and make the voices of the people heard they will not give in."
 ENG_recruit_the_rebels:0 "Recruit The Rebels"
 ENG_recruit_the_rebels_desc:0 "As the message spreads across the country, more people believe in change and have joined the rebels to fight against the Front. Groups will meet up and down the nation to encourage the people they can stand up against this fascist dictatorship and bring democracy back to the UK."
 ENG_infiltrate_phoenix_network:0 "Infiltrate Phoenix Networks"
 ENG_infiltrate_phoenix_network_desc:0 "Blair has been able to recruit old cyber security experts who left their positions due to the Phoenix Front getting into power. Its now time to spread the message that hope is not lost and there is still a fight to be had against Braiser."
 ENG_start_protesting:0 "Show the phoenix we are not happy"
 ENG_start_protesting_desc:0 "Protesting may not be the answer to our problems but if we show we are not afraid of the governement it may start the gears to turn..we hope..."
 ENG_tour_the_country:0 "Spread our message"
 ENG_tour_the_country_desc:0 "We can begin to spread our message with the country going face to face with the public showing them the governement can fear their people if enough join our cause and change our route."
 ENG_begin_the_march:0 "Begin The March"
 ENG_begin_the_march_desc:0 "Its time for the north to march. They will walk down the nation to London and bring down Braiser and her Phoenix Front. Millions will gather together to meet together in London and bring the capital to flames."
 ENG_battle_of_cable_street_II:0 "Second Battle Of Cable Street"
 ENG_battle_of_cable_street_II_desc:0 "Cable street was the defining moment in the 1930s which prevent Britain from becoming a fascist state and this time will be the same. Rebels marched through cable street fighting against the Front ensuring that the battle of Cable Street will always be remembered as when the fascist cause collapsed twice."
 2017_election:0 "2017 Election"
 2017_election_desc:0 "Coming soon"
 ENG_We_march_forward:0 "Ideas are bulletproof."
 ENG_We_march_forward_desc:0 "After our victory at cable street its time to move to parliament and force Brasiers henchmen to give up, if they refuse then they will burn with us..."
 ENG_the_army_joins_our_cause:0 "The Army Joins Us"
 ENG_the_army_joins_our_cause_desc:0 "The army has left their position and took up arms against this brutal regime, we are ready to burn the phoenix"
 ENG_Braiser_escapes:0 "If we burn, you burn with us"
 ENG_Braiser_escapes_desc:0 "High chancellor Brasier has escaped her home and took shelter in parliament, why dont we remind her what was meant to happen on the 5th of november...."
 ENG_parliament_burns:0 "A building is a symbol, as is the act of destroying it"
 ENG_parliament_burns_desc:0 "As parliament burns, Brasier has came running out surrendering herself to the people, its time we took control of this country and installed a real peoples governement..the only choice is..who can the people trust?"
 ENG_A_New_beginning:0 "A New Beginning"
 ENG_A_New_beginning_desc:0 "As a new dawn shines on the crippled united kingdom its time to choose the outcome of the dictator, we also need to choose what type of government our people want."
 ENG_Hang_the_witch:0 "Hang The Witch"
 ENG_Hang_the_witch_desc:0 "The disgusting Brasier has been caught and thrown away behind bars, its time to give her what she had coming from the start and let her hang from the gallows as a new dawn breaks onto our island"
 ENG_Life_In_Prison:0 "Life In Prison"
 ENG_Life_In_Prison_desc:0 "Although she expected this, she didn’t believe it would be isolated away in the Tower of London only to be visited by people wanting to point and laugh at her, the great chancellor now stuck in shackles in the cold chambers of the Tower."
 ENG_restore_order:0 "Restore Order In The UK"
 ENG_restore_order_desc:0 "Now the dictatorship has finally come to an end we can begin to rebuild and reducated our citizens. Removing the awful phoenix and making many of their followings illegal"
 ENG_demolish_the_camps:0 "Demolish The Camps"
 ENG_demolish_the_camps_desc:0 "Under Brasier she created work camps and her own state TV station along with many disgusting acts. We will remove this and make sure not just the UK but the world knows that evil must never gain power."
 Democracy_returns:0 "Democracy has returned"
 Democracy_returns_desc:0 "As democracy returns to the UK and life starts to finally feel "Normal" we do need a strong and stable governement but who will represent the people and who will the people really trust as our new leader for the free country?"
 ENG_2014_election:0 "2014 Election"
 ENG_2014_election_desc:0 "The 2014 election, this election people will decide with two new parties, The Green Party ran by Russel Brand, and a split conservative party ran by tory traditionalist who still remain loyal to the party but wish britain to be stronger again. We have seen many battles across the country between each party but now is the time to decide who will stand for this country. "
 ENG_Traditional_conservative_government_:0 "Traditional Conservative Party"
 ENG_Traditional_conservative_government__desc:0 "The Traditional Conservative Party Has Been Elected"
 ENG_Doubling_Living_Standards:0 "Better Standards Of Living"
 ENG_Doubling_Living_Standards_desc:0 "Its time to bring the traditional english family standards back and show the young how elders really ought to be respected as well as how to become a strong man and a obeying housewife!"
 ENG_Marriage_Tax_Breaks:0 "Marriage Tax Breaks"
 ENG_Marriage_Tax_Breaks_desc:0 "Those who have taken the hand of god into their relationship will be rewarded by having to pay less taxes. Through this we can encourage more people to wed and accept the traditional marriage scheme."
 ENG_Better_privatisation:0 "Better & Stronger Privatisation"
 ENG_Better_privatisation_desc:0 "As our debt climbs the country begins to fall. It is time we cut major state run schemes and push for more privatisation, this can create more companies to come here and create more work, more jobs and most of all more money for our great british people! "
 ENG_Stronger_Borders_against_Immigration:0 "Make Our Borders Stronger"
 ENG_Stronger_Borders_against_Immigration_desc:0 "As the crisis in Europe gets bigger, more dirty communists want to seek safety here. We cannot allow such far left pigs enter our great nation and disrupt our rebuilding! A new immigration policy will be created restricting those who enter our land."
 ENG_cut_foreign_aid:0 "Cut Foreign Aid"
 ENG_cut_foreign_aid_desc:0 "Pfft, why should we spend OUR money on those countries who cant look after themselves. We will cut as much aid as we can and keep it for our great nation!"
 ENG_establish_Veterans_Administration_Department:0 "Establish Veterans  Department"
 ENG_establish_Veterans_Administration_Department_desc:0 "We have soldiers on the streets, starving wanting help AND WE MUST! therefore we will establish a administration for those soliders to be housed, fed and given what they deserve. A GOOD STRONG LIFE!"
 ENG_conservative_government_2:0 "Conservative Party"
 ENG_conservative_government_2_desc:0 "The Conservative Party Has Been Elected"
 ENG_Less_tax_for_families:0 "Less Tax For Families"
 ENG_Less_tax_for_families_desc:0 "Families need to care for each other, be able to buy food and not worry if they cannot pay their taxes. Therefore families will be given tax breaks to help them through their lives and show the rest of the world that raising a family here is the best way!"
 ENG_Investing_more_in_local_schools:0 "Invest In Local Schools"
 ENG_Investing_more_in_local_schools_desc:0 "Schools have been left to fall in major repairs. Lets give schools more funding as well as headteachers to have more say in what goes on in schools with them having more freedom for their own rules in schools and what policies will be followed."
 ENG_Tougher_sentences_for_criminals:0 "Tougher Sentences For Criminals"
 ENG_Tougher_sentences_for_criminals_desc:0 "The UK has been a “soft touch on criminals for too long” We want people to “literally feel terror” at the thought of breaking the law, and warned criminals “we are coming after you” The conservatives have declared they are “the party of law and order once again”."
 ENG_Reform_The_Highway_Code:0 "Reform The Highway Rules And Code"
 ENG_Reform_The_Highway_Code_desc:0 "The current rules for the highways and roads are outdated, we must change this ASAP for our drivers. We will also reform the highway code to make it more stricter yet safer for those on the road and around the roads."
 ENG_Less_regulation:0 "Less Regulation"
 ENG_Less_regulation_desc:0 "For a long time now the governement has had a lot of control over the banks and finances, its time we step back and let them have more freedom and make things like, mortgages and wages fairer for all even if they need to be cut to save money."
 ENG_In_Europe_not_run_by_Europe:0 "In Europe BUT Not Run By Europe "
 ENG_In_Europe_not_run_by_Europe_desc:0 "We maybe in europe but in way are we part of the marxist groups there. We must make sure our borders stay strong and we show the communists that Britain stands tall and will fight for its democracy. We will create new propaganda against Europe and show them we mean business."
 ENG_liberal_democrat_government_2:0 "Liberal Democrat Government"
 ENG_liberal_democrat_government_2_desc:0 "The Liberal Democrats Have Been Elected"
 ENG_free_care_for_elderly_and_disabled:0 "Free Care For Elderly & Disabled"
 ENG_free_care_for_elderly_and_disabled_desc:0 "Its our duty to care for those who have helped make this country what it is today, our freedom and democracy owes it to them all so we will provide the best care and best quality of life for those elderly. Those who are disabled will be given the best treatment and care as possible."
 ENG_Cutting_subsidies:0 "Better Subsidies"
 ENG_Cutting_subsidies_desc:0 "We can create subsidies for farms and other country areas which will help grow our food stocks and help keep low food prices down! We can also use this to help create more green products and technologies."
 ENG_SKILLS_FOR_WORK:0 "More Skills For Working"
 ENG_SKILLS_FOR_WORK_desc:0 " Too many children leave school without the knowledge and skills to be successful,Increase the funding of the most disadvantaged pupils, Establish a fully independent Educational Standards Authority and create more skills training programs for young adults."
 ENG_AFFORDABLE_HOMES:0 "Affordable Homes"
 ENG_AFFORDABLE_HOMES_desc:0 "We will be bringing 250,000 empty homes back into use, as well as providing more affordable homes and protecting people from unfair repossessions."
 ENG_ART_HERITAGE_AND_SPORT:0 "Art, Heritage & Sport"
 ENG_ART_HERITAGE_AND_SPORT_desc:0 " Britain’s culture and heritage play a vital role in attracting visitors to the UK and boosting the very important tourism industry. We must set up a ‘Creative Enterprise Fund’ to help our art and history in this country. We can also create more sporting centers to be built for our young adults to get invovled in sporting in more safe areas."
 ENG_CLEANER_TRANSPORT_AND_ENVIRONMENT:0 "Cleaner And Better Transport And Environment"
 ENG_CLEANER_TRANSPORT_AND_ENVIRONMENT_desc:0 "Push for more better and stronger electrical transport systems, The Liberal Democrats will also make sure every part of our environment is kept safe and tidy as well as more country areas build for wildlife."
 ENG_social_democratic_government_2:0 "The Social Democrats"
 ENG_social_democratic_government_2_desc:0 "The Social Democrats Have Been Elected"
 ENG_Reform_building_standards:0 "Reform Building Standards"
 ENG_Reform_building_standards_desc:0 "We must make sure all our buildings are kept safe as many of our buildings and homes are getting older they are becoming increasing less safe therefore we will push for new reforms to make our homes, schools and many other workplaces safe for our future."
 ENG_Jobs_for_the_future:0 "Jobs For The Future"
 ENG_Jobs_for_the_future_desc:0 "We must push our work force to prepare for the future. New innovations and technologies means more of our work force have to adapt therefore we will begin training for new jobs and increasing more skills training."
 ENG_Reform_the_House_of_Lords:0 "Reform The House Of Lords"
 ENG_Reform_the_House_of_Lords_desc:0 "The hosue of lords are not elected by the people of this country and isnt a democrat fair job for our governement. We must reform the lords and make it fair, stronger and better for our country."
 ENG_points-based_immigration_system:0 "Points-Based Immigration System"
 ENG_points-based_immigration_system_desc:0 "The UK will introduce a points-based immigration system. Under a points-based immigration system, anyone coming to the UK for work must meet a specific set of requirements for which they will score points. Visas are then awarded to those who gain enough points."
 ENG_More_Funding_For_Northern_Powerhouse:0 "More Funding For Northern Powerhouse"
 ENG_More_Funding_For_Northern_Powerhouse_desc:0 "The Northern Powerhouse has allowed more work, more funding for the north and a better trainline for the north and south, therefore it is with our interest to fund more intot he Northern Powerhouse allowing more jobs and stronger economy for our country"
 ENG_Owens_Future_Plan_For_The_UK:0 "Ownes Future Plan For The UK"
 ENG_Owens_Future_Plan_For_The_UK_desc:0 "David Owen had many plans for the future for the next 10 years, we must keep to his pledges and keep Britain moving forward. He will not be forgotten. We will increase welfare for those who need it, we will make our education system stronger and of course prevent unnecessary wars."
 ENG_labour_government_2:0 "The Labour Party"
 ENG_labour_government_2_desc:0 "One Of The Labour Parties Has Been Elected"
 ENG_Raise_minimum_wage:0 "Raise Minimum Wage"
 ENG_Raise_minimum_wage_desc:0 "We think Britain’s workers deserve a pay rise. That’s why Labour will raise the Living Wage to £10 an hour, giving low-paid workers on average £2,500 a year extra in their pockets."
 ENG_Low_Mortgages:0 "Labours Low Mortgages"
 ENG_Low_Mortgages_desc:0 "A New Deal for home-owners to stop leaseholders being ripped off, and a new Homeowner Guarantee to help  pay the mortgage if someone were to lose your job"
 ENG_recruits_to_raise_police_numbers:0 "Increase Of Police"
 ENG_recruits_to_raise_police_numbers_desc:0 "This will see more money available to recruit, train and equip police officers, as well as investment in national priorities. "
 ENG_Long-term_economic_stability:0 "Stronger Economic Stability"
 ENG_Long-term_economic_stability_desc:0 "Labour will double investment spending money spent on long-term projects, working closely with businesses to create more jobs and money into the economy while also pushing for a new deal on renewable energy."
 ENG_Full_employment_in_every_region:0 "Stronger Economic Stability"
 ENG_Full_employment_in_every_region_desc:0 "Labour will make sure every region in the United Kingdom has low unemployment, with people working in a fair equal society."
 ENG_modernise_the_welfare_state:0 "Modernise The Welfare State"
 ENG_modernise_the_welfare_state_desc:0 "A new National Care Service to tackle the social care, Free school meals,Free full-fibre broadband and better more equal benefits to those who need it."
 ENG_Give_EU_nationals_the_right_to_remain:0 "Give EU Nationals The Right To Stay"
 ENG_Give_EU_nationals_the_right_to_remain_desc:0 "Many nationals from Europe are feeling due to uncertainty and rumours of civil war. They come to the UK asking for help and seeking a new life. We will take them in and they will join our society which is free and fair."
 ENG_Reduce_university_tuition_fees:0 "Remove University Tuition Fees"
 ENG_Reduce_university_tuition_fees_desc:0 "Labour will scrap tuition fees removing the debt from 100s of students and young adults across the country giving them a chance to enjoy their education without worry."
 ENG_Introduce_compulsory_jobs_guarantee:0 "Compulsory Jobs Guarantee"
 ENG_Introduce_compulsory_jobs_guarantee_desc:0 "Labour’s Compulsory Jobs Guarantee would mean every young person out of work for more than 12 months will be given a paid starter job. Work they will have to take up or lose benefits.The Compulsory Jobs Guarantee will also apply to adults aged 25 or over out of work"
 ENG_Set_up_people-led_constitutional:0 "Set Up People-led constitution"
 ENG_Set_up_people-led_constitutional_desc:0 "Instead of Westminster handing down instructions, communities should have a say over their futures. Instead of serving the interests of corporations and the super-rich, politicians could work in the public’s interest."
 ENG_Appoint_an_international_LGBT_rights_envoy:0 "LGBT Rights Envoy"
 ENG_Appoint_an_international_LGBT_rights_envoy_desc:0 "Same sex marriages will become legal, It is an important part for labour that EVERYONE feels included in our country thats why we will make sure the LGBT community is given that right and be looked after under our envoy"
 ENG_Introduce_the_British_Investment_Bank:0 "British Investment Bank"
 ENG_Introduce_the_British_Investment_Bank_desc:0 "British Business Bank, is to increase the overall supply and diversity of finance both product and provider on offer to UK smaller businesses."
 ENG_Nationalise_key_industries:0 "Nationalise Key Industries"
 ENG_Nationalise_key_industries_desc:0 "Now Labour are in power we can begin to nationalise the key areas of the UK, internet will be free for all. Free Transport/Cheap transport. We will make the UK thrive under our new governement!"
 ENG_Visit_To_Cuba:0 "Visit Cuba"
 ENG_Visit_To_Cuba_desc:0 "Lets meet with the Cuban leaders and see how the revolutionary war has changed the country in this modern age, we can learn a thing or two about what happens in this socialist paradise. It would be great to build a good relationship here."
 ENG_Stronger_Relations_With_The_EU:0 "Stronger Relations With The EU"
 ENG_Stronger_Relations_With_The_EU_desc:0 "The EU is our neighbour, we must work closely together creating better friendships, increasing trade with Europe and allow our borders to be opened allowing more freedom to travel between the UK and many European countries."
 ENG_Embassies_In_The_EU:0 "Embassies In the EU"
 ENG_Embassies_In_The_EU_desc:0 "If we really want to have a strong and good relatiosnhip with the EU, we should start to create embassies in EU countries to strength our ties with these countries, opening more to allowing tourists being able to speak to leaders easier."
 ENG_Unions_Have_More_Power:0 "Unions To Have More Power"
 ENG_Unions_Have_More_Power_desc:0 "Unions are what keeps our workers safe and secure in their jobs, without them businesses could easily take advantage of this. If we give unions more power we can ensure our workers are treated with respect while working"
 ENG_Modern_Social_Housing:0 "Modern Social Housing"
 ENG_Modern_Social_Housing_desc:0 "We will build one million new genuinely affordable homes over 10 years, and ensure every council every year builds or commissions Labour’s new affordable homes."
 ENG_Green_Party:0 "The Green Party"
 ENG_Green_Party_desc:0 "For The First Time Ever the Greens Have Finally Made It Into Power.."
 ENG_Invest_In_Renewable_Energy:0 "Invest In Renewable Energy"
 ENG_Invest_In_Renewable_Energy_desc:0 " In line with the move from fossil fuels, clean electricity generation will be substantially increased, based primarily on renewable, very low carbon sources with offshore wind as a major source, supported by onshore wind, marine, solar, biofuels,and hydro power."
 ENG_Cut_Military_Funding:0 "Cut Military Funding"
 ENG_Cut_Military_Funding_desc:0 "We spend so much money on military funds yet we are fighting no wars, in fact we are trying to PREVENT wars therefore we can cut this funding and give it to the people like the NHS, schools, fixing roads!"
 ENG_Legalise_And_Regulate_Drugs:0 "Legalise Drugs"
 ENG_Legalise_And_Regulate_Drugs_desc:0 "We will end the prohibition of drugs and create a system of legal regulation to minimise the harms associated with drug use, production and supply as part of an inclusive, supportive, socially just society."
 ENG_Increase_Corporation_Tax:0 "Increase Corporate Tax"
 ENG_Increase_Corporation_Tax_desc:0 "Many business get away wiht paying little to no tax, this isnt good at all there fore we will make sure tax is put up for businesses and make sure they all pay their fair share like the rest of us do!"
 ENG_Increase_funding_for_the_NHS:0 "Increase NHS Funding"
 ENG_Increase_funding_for_the_NHS_desc:0 "Stop any privatisation of the NHS to ensure that all health and dental services are always publicly provided and funded, and free at the point of access. Close the NHS spending gap and provide an immediate cash injection."
 ENG_Cancelling_Trident_and_nuclear_powered_submarines:0 "Cancel Trident & Nuclear Powered Submarines"
 ENG_Cancelling_Trident_and_nuclear_powered_submarines_desc:0 "There is no need to be playing silly games with such powerful weapons, we will remove any sort of threat like this from our country and show the rest of the world that our country is no threat to anyone."
 ENG_CANZUK:0 "Begin Talks For CANZUK"
 ENG_CANZUK_desc:0 "CANZUK International is the world’s leading advocacy organisation promoting facilitated migration, free trade and foreign policy coordination between Canada, Australia, New Zealand and the United Kingdom (the “CANZUK” countries)."
 CANZUK_Proposal:0 "Proposal To Other Countries"
 CANZUK_Proposal_desc:0 "Our proposals ensure that Canada, Australia, New Zealand and the United Kingdom not only sustain economic prosperity and quality of life, but develop travel and employment opportunities for each of their citizens as part of a global initiative."
 ENG_Meet_With_Canada:0 "Meet With Canada"
 ENG_Meet_With_Canada_desc:0 "Today we meet with Canada to begin talks of how we both would want to see our relationships together, we share very similar views and interests and most of all, we have deep respect for the queen and love our countries dearly."
 ENG_Meet_With_Australia:0 "Meet With Australia"
 ENG_Meet_With_Australia_desc:0 "Meeting with Australia is like meeting a long lost brother or sister, we both love and share many of the same things. From our general great banter with one another to getting things done seriously with our great witt and charm. This will be an interesting yet fun meeting."
 ENG_Meet_With_New_Zealand:0 "Meet With New Zealand"
 ENG_Meet_With_New_Zealand_desc:0 "New Zealand is currently stuck under a nationalist military dictatorship, the people of NZ are forced into military service and many in the nation are not happy with the current regime. Its time we finally meet with our old ally and sort things out properly before we offer the nation a piece of our new alliance. "
 ENG_Australia_Trade_Talks:0 "Australia Trade Talks"
 ENG_Australia_Trade_Talks_desc:0 "As we near the end of our talks with our Aussie friends, its time to choose what trade deals we would want with our friends down under. The fact is we can offer more to the Aussie than they can offer us but we shall still keep going with the trade deal for the sake of the CANZUK union."
 ENG_New_Zealand_Trade:0 "New Zealand Trade Talks"
 ENG_New_Zealand_Trade_desc:0 "New Zealand is trying to put a hard deal on the table with what they are wanting compared to what we can offer them. Maybe we can limit things for now at least for a few months and see how our trade deal moves. Until then we will keep our noses up and make sure they understand we can offer them more so it would be best to agree."
 ENG_Canada_Trade_Talks:0 "Canada Trade Talks"
 ENG_Canada_Trade_Talks_desc:0 "Ahh Canada this is a country we would love to trade with, from the incredible business and corporate opportunities we can offer each other, and the great trade we can offer one another its time we seal the deal and make this deal happen as soon as we can!"
 ENG_Freedom_Of_Movement:0 "Freedom Of Movement"
 ENG_Freedom_Of_Movement_desc:0 "Lets remove these silly barriers away from our countries and make it easier and cheaper to visit one another. From business trips to holidays to seeing family and friends, CANZUK will make this a strong and friendly relationship with strong borders but free enough to visit."
 ENG_Stronger_Jobs:0 "Stronger Jobs"
 ENG_Stronger_Jobs_desc:0 "Jobs are one of the most important things about CANZUK, after the fall of the united states many flocked to Canada to get away from the fallout as well as the UK and Australia. Now we can unite and provide solutions to business needs and create a strong and stable economy together!"
 ENG_Working_Together:0 "Working Together"
 ENG_Working_Together_desc:0 "All four of our countries share one similar thing: The crown. Yes we speak the same language but we have many different accents and many different ideas of what we want for our country that’s why we will NEVER create a union binding us together with the same currency or anthem like the god awful EU. Therefore we will keep out close ties together but only to a point."
 ENG_Future_Research:0 "Future Research"
 ENG_Future_Research_desc:0 "We need to be prepared for anything the world may throw our way. That is why we will create an administration to help with the research of science and technology developments and what other improvements we can make to our CANZUK alliance to help develop our friendship and offerings."
 ENG_the_phoenix_front:0 "The Phoenix Front"
 ENG_the_phoenix_front_desc:0 "Theresa Braiser is now official Prime Minister of the United Kingdom. She controls all of the isle and her power-hungry claws can now finally begin to rip into the people and the country she so dearly loves."
 ENG_take_over_tv_networks:0 "Take over TV networks"
 ENG_take_over_tv_networks_desc:0 "Braiser now has complete control of what the people can watch on their TV. Her first move is to ban the leftist BBC and launch her own Phoenix TV station to broadcast her propaganda."
 ENG_suspend_parliament:0 "Suspend parliament"
 ENG_suspend_parliament_desc:0 "Within the first hours of walking into 10 downing street, Braiser ordered parliament to be suspended using her MPs to staunchly defend her. Her control and grip has finally shown democracy is now dead.."
 ENG_changing_the_isle:0 "Changing the Isle"
 ENG_changing_the_isle_desc:0 "Britain has now changed into a true isle for nationalists and Fascists. Many have left the nation to Canada or other nations for Democracy. The last democratic European nation has fallen. Not to communism..but something very different..if not worse.."
 ENG_the_phoenix_army:0 "The Phonenix army"
 ENG_the_phoenix_army_desc:0 "Its time to establish the new military service who will protect the strong nation of Britain. The Phoenix army will be battle hardened and ready to fight at moments notice, they will strike fear into our enemies eyes. The Phoenix Army will serve our majesty and Braiser sworn to protect both leaders and defend their Isle no matter what cost it will be. The phoenix will go on forever."
 ENG_laws_of_the_land:0 "Laws Of The Land"
 ENG_laws_of_the_land_desc:0 "Braiser has started to write up the new laws for Britain. She is ready to change the island for good and leave a lasting mark upon the nation. Her views, Her Way, The Fronts own vision."
 ENG_arrest_mps:0 "Arresting MPs"
 ENG_arrest_mps_desc:0 "Braiser Has set out one of her first laws. Arrest her opponents, no one stands in her way now and with her power and historical large party she has the freedom to now do as she wishes without anyone being able to stop her. Labour, SDP even some moderate Conservatives are to be arrested."
 ENG_remove_the_non_straight_people:0 "Remove Non Straight People"
 ENG_remove_the_non_straight_people_desc:0 "The LGBTQ community are the ones who’ve led England to the brink of destruction. With their open sins against Christ, God has forsaken our country. Since Braiser is now in Power, we can purge these elements from the Isle."
 ENG_only_the_christian_groups_remain:0 "Only The Christian Groups Remain"
 ENG_only_the_christian_groups_remain_desc:0 "This nation was founded by great Christians. The fact that we allowed intolerable heathens like the Muslims and Jews to come into our nation and ruin it only speaks to the degradation caused by the liberal PMs of the past. Under Braiser we are turning this country back into its rightful place at the top of the Christian world."
 ENG_ban_freedom_of_religion:0 "Ban Freedom Of Religion"
 ENG_ban_freedom_of_religion_desc:0 "Christianity maybe the biggest religion in Britain but there are also smaller groups which could have an impact. No longer will this happen. ONLY CHRISTIANITY will exist in this nation. Anything else will be removed, by force is necessary."
 ENG_ban_anti_christian_movements:0 "Ban Anti-Christian Movements"
 ENG_ban_anti_christian_movements_desc:0 "Atheists are a also a big part of the problem here in this new reborn nation. Removing their groups and their preaching will solve a noticeably big problem in this nation."
 ENG_remove_political_parties:0 "Remove Political Parties"
 ENG_remove_political_parties_desc:0 "MPs have been removed but their political parties and supporters still cause a problem. Labour is a huge problem as its strong leftist core goes against everything the phoenix stands for. Outright moving these problems is the only thing that can be done and prevent support going against us."
 ENG_join_or_be_forgotten:0 "Join Or Be Forgotten"
 ENG_join_or_be_forgotten_desc:0 "Braiser has offered those ex-party members one chance. Join the phoenix of be labelled as enemies and face judgement and trial once they are caught and found out. This is a chance for them to pledge their support to braiser."
 ENG_The_Nations_New_Judge:0 "The Nations New Judge"
 ENG_The_Nations_New_Judge_desc:0 "As predicated there would be one more law Braiser had written out. She has announced the people can join the “Fronts Patrol” a group who will patrol the streets ensuring the people stay loyal to the system and those who break laws will be handed to the police and sentenced."
 eng_front_leaders:0 "Front Leaders"
 eng_front_leaders_desc:0 "Braiser is in complete control of the nation, but one woman cannot control everything, her new aides will join her in ruling to ensure the rule of law is established and help rebuild Britain to a golden age of pureness and power."
 ENG_priti:0 "Priti"
 ENG_priti_desc:0 "Priti Patel, Many already knew she was far right but her work for the conservative party kept her ideals hidden from the public until now. Her strong booming voice and use of fear plays to her advantage to scare the people into submission."
 ENG_establish_work_camps:0 "Establish Work Camps"
 ENG_establish_work_camps_desc:0 "The work camps have been mentioned in the past by Braiser but only just lightly yet the media at the start of the election captured this to use against yet..only for it to work in her favour..Now Patel is in charge she has full power over who will work and who will not.."
 ENG_rebuild_the_state:0 "Rebuild The State"
 ENG_rebuild_the_state_desc:0 "Priti Patel has ordered the nation to work and work they shall. Monuments of the 4 leaders will be established around the country while new Phoenix offices and state buildings will be created and the nation to be reshaped to fit the Phoenix Front."
 ENG_police_state:0 "Police State"
 ENG_police_state_desc:0 "The people will do what they can to get away with their “Freedoms” as they call it. The people need to be watched to ensure their complete loyalty to the party. No longer will they feel they can talk freely against the party who give them the Britain they always wished for."
 ENG_project_fear:0 "Project Fear"
 ENG_project_fear_desc:0 "Priti Patel only knows one thing. Fear. Her use of fear tactics is what enables her to take control of the nation and order work do be done. Many fear her more than braiser herself, using this will allow Patel to order harsher work which braiser may have not herself authorised just to ensure total loyalty to her party."
 ENG_the_fronts_own_image:0 "The Fronts Own Image"
 ENG_the_fronts_own_image_desc:0 "Braiser and Patel work hand in hand to get the job done and getting it done properly. The reason Patel was chosen for this new style of control was her harsh outlook on the world and knowing the front was perfect for her work. The front will reshape Britain and so will patel.."
 ENG_eyes_everywhere:0 "Eyes Everywhere"
 ENG_eyes_everywhere_desc:0 "The police maybe in complete control but someone needs to make sure EVERYONE, EVERYWHERE obeys the system. Portraits of braiser and the other leaders are to be hung in houses and workplaces everywhere with cameras fitted in public places for complete watch."
 ENG_the_slave_trade:0 "The Slave Trade"
 ENG_the_slave_trade_desc:0 "England needs workers and its struggling due to the many traitors who left the country and leaving empty jobs. The Scottish and Welsh will fix this and will work for the English like the old days under English rule!"
 ENG_Use_The_Kids:0 "Use The Kids"
 ENG_Use_The_Kids_desc:0 "The children of Britain are the future and back bone of this nation. They need to understand the ideology of the front. Setting up “Front Youth Camps” to allow them to be a fit healthy member of a future nation is important!"
 ENG_Imprison_the_Non_pure:0 "Imprison The Non Pure"
 ENG_Imprison_the_Non_pure_desc:0 "Many people live in Britain who provide nothing to the state. They sit around for example the disabled and others do not provide to the people of the nation and therefore they will be removed from society and the nation will be strong and ready for the future!"
 ENG_A_Clean_Britain:0 "A Clean Britain"
 ENG_A_Clean_Britain_desc:0 "Britain has changed and under Braiser and Priti Patel its new generation is learning what the party stands for and what it must do to those who stand against the phoenix. Patel’s camps provide materials and resources ready to power the nation and rid those who are not able to provide to it."
 ENG_farage:0 "Farage"
 ENG_farage_desc:0 "Nigel Farage was the first conservative MP to leave the party and work with Brasier to create the phoenix front. His total loyalty to the party and her makes him ready to take control of much of the economy and education systems."
 ENG_british_tradition:0 "British Tradition"
 ENG_british_tradition_desc:0 "Britain used to be a beacon of greatness. Now it is the last nation in Europe to stand against communism. Bringing back the old british tradition will ensure no more leftist corruption can take this nation and destroy what the front is building."
 ENG_new_education_material:0 "New Education Material"
 ENG_new_education_material_desc:0 "Education is important to all but even more to the young. The front can influence the children and turn them against their parents and adopt a true british heart and stand ready and armed with the front. Learning about the British empire and how glorious it would be for it to return!"
 ENG_unlock_the_market:0 "Unlock The Market"
 ENG_unlock_the_market_desc:0 "The one thing the SDP did which always destroyed this nation was public, welfare services. Privatising these allows the market it grow and a strong economy in Britain. More to go back to the tax payers and make them live a happier richer life!"
 ENG_phoenix_universities:0 "Phoenix Universities"
 ENG_phoenix_universities_desc:0 "Now the young are being impacted its time for the young adults to see the changes the front can make, removing silly subjects like music and arts to bring real education like science, sports and more will turn the young adults of this nation into people ready to serve at the Phoenix front."
 ENG_english_job_for_english_people:0 "English Jobs For English People"
 ENG_english_job_for_english_people_desc:0 "Its finally time for the English to claim the jobs they want and need! Removing the immigrations from the isle has allowed the people to claim their jobs and no longer have rivals!"
 ENG_Rebuild_The_Economy:0 "Rebuild The Economy"
 ENG_Rebuild_The_Economy_desc:0 "Many services have now been privatised and the debt is slowly starting to get lower. The people are now richer and the people are happier when front services ask for their opinion of the party..even held at gun point or threatened. The pound is once again stable and many businesses from overseas are starting to see a good advantage to invest in the nation."
 ENG_hopkins:0 "Hopkins"
 ENG_hopkins_desc:0 "Katie Hopkins was never a Politian but she always spoke out against the SDP and other leftists parties. Braiser saw something in her and chose her to take control of foreign affairs. Now Katie is in control of the outside world of Britain its time to see what her plans are."
 ENG_Fear_the_outside_world:0 "Fear The Outside World"
 ENG_Fear_the_outside_world_desc:0 "The outside world is a scary place, Europe is a dirty leftist communist backward nation and needs to be left alone or action taken against it..Britain has already have threats of sanctions put against it yet not one nation has prepared to do this as the nation still has a top seat in the UN and can vote against all nations who vote for sanctions."
 ENG_anti_immigration_policiess:0 "Anti-Immigration Policies"
 ENG_anti_immigration_policiess_desc:0 "Those damn pests from outside our borders are threatening our traditional, pure British way of life. Get them out as soon as possible, and don't let any more in."
 ENG_cut_off_the_channell:0 "Cut Off the Channel"
 ENG_cut_off_the_channell_desc:0 "The English Channel allows both immigrants and invading enemies to cross into our precious homeland. Grand fortifications must be erected to deter any and all who would dare violate Britain."
 ENG_A_Nuclear_Ready_Nation:0 "A Nuclear Ready Nation"
 ENG_A_Nuclear_Ready_Nation_desc:0 "No one wants to press the big red button, not even Braiser but she must be prepared to do so if the Soviet Union or European union wishes to do this to Britain. Rebuilding nuclear warheads and creating a stockpile along with more trident submarines ensures defence and protection."
 ENG_an_oath_to_braiser:0 "An Oath To Braiser"
 ENG_an_oath_to_braiser_desc:0 "Every soldier, every pilot, every sailor will make their pledge not just to her majesty but to Theresa Braiser and the Phoenix Front. A soldier’s loyalty to defend the black and orange flag. Braiser is always watching her servicemen working to protect her strong proud nation."
 ENG_patrol_the_channel:0 "Patrol The Channel"
 ENG_patrol_the_channel_desc:0 "The channel is what separates Britain from the scum of Europe, the dirty communist pigs pride themselves in how great their left ideology is changing lives…yet why do tensions rise in France? Its time no more refugees try to escape into England. Anyone who crosses the channel will be shot."
 ENG_army_parades:0 "Army Parades"
 ENG_army_parades_desc:0 "After cutting services across the county, more investment was made possible into the army and now its time to parade this new technology and beacon of defence to the world as well as our glorious nation. The people will watch in their streets, in towns and cities as the army marches down roads showing our missiles and tanks."
 ENG_national_Service:0 "National Service"
 ENG_national_Service_desc:0 "The army is trained to fight in foreign lands, but we must ensure our people are also trained to defend our isle against our enemies. All men over the age of 16 will now be forced to serve and protect the nation and Braiser."
 ENG_Warships_In_France:0 "Warships In france"
 ENG_Warships_In_France_desc:0 "Its time to ready for war. France has treated Britain like a fool for too long and now words fall on deaf ears. Deploying warships in the channel and near France will strike fear into the French and Europe and show this nation is no longer going to play by the rules and will go to war if they must."
 ENG_Prepare_For_war:0 "Prepare For War"
 ENG_Prepare_For_war_desc:0 "As tensions get higher so must the nation of Britain be prepared for war. The people are now being trained as soldiers. The Phoenix army is standing by on ready to go to war. Now its time to shape the nation for war and protect it whatever the cost."
 ENG_Replace_the_RAF:0 "Replace The RAF"
 ENG_Replace_the_RAF_desc:0 "The Royal Airforce protected the nation during the battle of Britain and through World War 2 but now its time for a change in a modern world. The new Phoenix Air Force will take over the skies and the red and orange flag will fly high in the sky."
 ENG_Arm_Dover:0 "Arm Dover"
 ENG_Arm_Dover_desc:0 "Dover looks over the channel and faces the communist nation of France. Its time to place turrets and fortify the cliffs and ports ready for the enemy to strike at Britain. Dover will become a hub of defence and show the communists Britain stands ready."
 ENG_Border_Patrol:0 "Border Patrol"
 ENG_Border_Patrol_desc:0 "Not only the cliffs and skies need to be defended. The seas must be as well, this is why border patrols will now take place across the channel and North Sea scanning for any communist or European sea vessel entering British waters."
 ENG_Braisers_Leadership:0 "Braisers Leadership"
 ENG_Braisers_Leadership_desc:0 "Thersea Braiser has been leader of Britain and transformed the Isle into a golden age. The British people are once again proud of their heritage and no more leftists or corrupt MPs are able to get away with taking advantage of the people. Every household has a portrait of Braiser in their living room and watch her speeches on the television. This surely is a proud nation who is thankful for their dear leader."
 ENG_The_Question_Of_Ulster:0 "The Question Of Ulster"
 ENG_The_Question_Of_Ulster_desc:0 "Ulster has caused nothing but problems since its independence and yet is still ruled by Ireland and Britain. Its economy is in ruins while crime is highest in the british isle. Its time to choose what we do with it, either give the people a “vote” to become part of Britain or to finally use the phoenix army at last to take it."
 ENG_Claim_The_North:0 "Claim The North"
 ENG_Claim_The_North_desc:0 "The council has voted, it is a no. The front council will invade Ulster in the early hours in the morning and take the land by force.."
 ENG_Ulster_Referendum:0 "Ulter Referendum"
 ENG_Ulster_Referendum_desc:0 "Its now up to the people of Ulster to decide, Do they wish to be left as a lonely independent state with a failing economy, awful health system and high crime rates. Or join Britain and become the envy of the world?"
 ENG_A_Loyal_Friend:0 "A Loyal Friend"
 ENG_A_Loyal_Friend_desc:0 "After a long debate its the fate of Ulster has been chosen and the people of the land has chosen to become part of Britain, No blood shall be spilt and the army will remain in Britain. The people of ulster will become loyal subjects to Braiser."
 ENG_The_Fresh_Lands:0 "The Fresh Lands"
 ENG_The_Fresh_Lands_desc:0 "After bloodshed and loss of life its time to make the people of ulster pay for not laying their weapons down. Food will be taken and sent to the people of Britain. The ulster people will work and become slaves to build the british state."
 ENG_Taking_the_Rest:0 "Taking The Rest"
 ENG_Taking_the_Rest_desc:0 "Ireland has condemned us for taking Ulster and has stated they will declare war on Britain if they do not return Ulster to its independence. We laugh at such a statement from a small nation. Its time to take the rest and create the living space the british people need to expand out."
 ENG_The_First_Puppet:0 "The First Puppet"
 ENG_The_First_Puppet_desc:0 "Ireland has been taken and now the old days have returned. Britain finally has complete control over the isle and the people. The world has watched Britain already expand and show how war would play out at other nations. Our first puppet will not be our last either."
 ENG_Test_The_Irish:0 "Test The Irish"
 ENG_Test_The_Irish_desc:0 "The Irish are still attacking the Front Army and they will still not learn no matter how hard we push back. Its time to take the people of Ireland and give them to Patel we are sure she knows what must be done to them to create the perfect “Englishman”"
 ENG_The_Irish_Subject:0 "The Irish Subject"
 ENG_The_Irish_Subject_desc:0 "Ireland is a joke of a state. It was not really needed and still is not. Its time to add those people to the slave trade and provide to the British state. Ireland will become an island for work, production and hate."
 ENG_The_Country:0 "The Country"
 ENG_The_Country_desc:0 "Now Braiser has started her laws and reforms its time to begin the next process in her reign. The country still needs to be rebalanced as there are some problems still ongoing which is like an annoying fly to her."
 ENG_The_New_Laws:0 "The New Laws"
 ENG_The_New_Laws_desc:0 "Starting from today all british people will be subjected to 2 hours of work for the front such as army exercises, working in farm lands or production. Britain needs to be self sufficient and ready for war."
 ENG_Remove_The_Homeless:0 "Remove The Homeless"
 ENG_Remove_The_Homeless_desc:0 "Unfortunately, the others were still not enough to prevent problems and now the homeless are taking over the streets. They are not willing to work under the fronts employment growth plan and now its time to remove the homeless off every street in Britain by force."
 ENG_Act_of_The_land:0 "Act Of The Land"
 ENG_Act_of_The_land_desc:0 "Private property has become an issue in the nation. People feel they are free to do what they wish in their own businesses and set their own rules. Its time private ownership is removed and owned by the Front. The nation needs full control."
 ENG_The_Cornwall_Act:0 "The Cornwall Act"
 ENG_The_Cornwall_Act_desc:0 "Cornwall has become a bit of a problem recently, the people there have felt isolated and mistreated for example many workcamps have been set up there but not many front members exist. Its time to station more servicemen there and ensure the population of Cornwall behave."
 ENG_The_Braiser_Youth:0 "The Braiser Youth"
 ENG_The_Braiser_Youth_desc:0 "The youth are the future of this nation and Braiser knows this. She has promised all education centres will provide new education materials for the young and ready them for the next stages of their lives. As well as this new exercise camps will be set up to ready the british youth for war."
 ENG_The_Promised_Land:0 "The Promised Land"
 ENG_The_Promised_Land_desc:0 "Europe is not letting the front off the hook and are condemning and forcing sanctions on the strong rebuilt nation. Its now high time to set our eyes on the whole continent and prepare for war. The orange phoenix will fly high in the European parliament."
 ENG_The_Outside_World:0 "The Outside World"
 ENG_The_Outside_World_desc:0 "The Commonwealth withdrew from Britain and no longer supports the island. Its time to set the phoenix’s eyes on the other nations on the globe and prepare for the second british empire. Braiser wants control, she will get control."
 ENG_Building_The_Next_Empire:0 "Building The Next Empire"
 ENG_Building_The_Next_Empire_desc:0 "Drafts and blueprints have been drafted, Braiser is preparing the next set of flags for conquered nations. The british empire fell due to war, money, and independence movements, its vital the same must not happen again when the empire has been rebuilt. Unlike last time the second british Empire will be ruled with a hard iron fist."
 ENG_The_reds_must_go:0 "The Reds Must Go"
 ENG_The_reds_must_go_desc:0 "Communists are the first to go. Europe must fall before any other nation and so must the red ideology. Communism, Socialism all of it, the dirt on the bottom of your shoe must be removed before the British Empire can grow and become a force to reckon with."
 ENG_Create_The_War_Council:0 "Create The War Council"
 ENG_Create_The_War_Council_desc:0 "Although Braiser has plans for what she will do with Europe she is not a soldier which is why she has created the war council. The war council will plan out battles and draft up ways to win wars in Europe while Braiser choose what she will do with the undesirables."
 ENG_Threats_To_France:0 "Threats To France"
 ENG_Threats_To_France_desc:0 "France isn’t getting the message..after all the air defences in Dover, patrols in the channel and Braiser threating the country they are still trying to scare Britain. Its time to send the warships into French waters and really give them a threating message."
 ENG_Ready_The_Phoenix_Airforce:0 "Ready The Phoenix Airforce"
 ENG_Ready_The_Phoenix_Airforce_desc:0 "The Phoenix Airforce has been moved down the country and are ready to take flight. Jets and drones have already been entering French airspace to send a message that Britain is ready for war. Now its time for all of the pilots to stand ready."
 ENG_Ready_In_Kent:0 "Ready In Kent"
 ENG_Ready_In_Kent_desc:0 "Kent is the biggest town in the south of England and closest to the channel. Barracks have been built and soldiers are training there. Now its time for the whole of Kent to stand by and stand ready for war."
 ENG_Ready_The_Drums:0 "Ready The Drums"
 ENG_Ready_The_Drums_desc:0 "Army captains are preparing their soldiers for war, the Phoenix flag is flying high on the beaches and the nation is on standby. The whole nation is ready to begin to move the phoenix to its next destination."
 ENG_Prepare_For_War:0 "Prepare For War"
 ENG_Prepare_For_War_desc:0 "Not only the soldiers must be ready but so must all of the country. Shops must prepare for rations and houses must be built to withstand bombs and more. The police have been tasked to search for any traitors who could be working for the communist EU while Braiser speaks to the nation readying them for the biggest moment in British history."
 ENG_Ready_The_Nukes:0 "Ready The Nukes"
 ENG_Ready_The_Nukes_desc:0 "If the worst comes to the worst and French decide they want to play hard then so do we. Braiser has said on more than one occasion that she is happy to press the big red button even if it means all out nuclear war. Her point stands clear, The phoenix will make be remembered."
 ENG_Emergency_Broadcast_Test:0 "Emergency Broadcast Test"
 ENG_Emergency_Broadcast_Test_desc:0 "Once the bombs fall the people will need to know that war has begun. Emergency testing systems have been built across the country with tv stations ready to tune into Theresa Braiser updating the nation on the war footing."
 ENG_Phoenix_National_Service:0 "Phoenix National Service"
 ENG_Phoenix_National_Service_desc:0 "Originally national service was for males at the age of 16. Now this has changed due to the plans the war council has drafted. All males and females over the ages of 13 will now be moved into national service and train as battle hardened soldiers and rip the communist pigs apart. "
 ENG_Modern_Air_Shelters:0 "Modern Air Shelters"
 ENG_Modern_Air_Shelters_desc:0 "In the 1940s air shelters protected the people against bombs dropping and so this will too but with more modern technology and better protection air shelters will be set up in peoples gardens again with pictures of braiser kept inside safe."
 ENG_The_Normandy_Speech:0 "The Normandy Speech"
 ENG_The_Normandy_Speech_desc:0 "Braiser stands in dover making a speech to the men and woman who will soon fight on the beaches in Normandy. All eyes on the world are upon her, the EU have already said they will not let Normandy fall and will protect every bit of land in France. The American Warlords have even condemned Braiser for her tolerant nuclear option."
 ENG_A_Day_Of_Mourning:0 "A Day Of Mourning"
 ENG_A_Day_Of_Mourning_desc:0 "Our dear leader Theresa Braiser was shot and killed by a lone French communist sniper hiding in the cliffs on Dover. The dirty communist unfortunately killed themselves before security forces made it to the terrorist. Now its time for the nation to mourn the death of our leader and remember the Iron Lady."
 ENG_Remember_The_Iron_Lady:0 "Remember The Iron Lady"
 ENG_Remember_The_Iron_Lady_desc:0 "Theresa Braiser will forever be remembered as the Iron Lady for her fiery speeches and vision for Britain. She changed the course of the country and made it strong and stand on its own against any other nation. Now the people will remember her and weep at what could have been."
 ENG_Inauguration_Day:0 "Inauguration Day"
 ENG_Inauguration_Day_desc:0 "Nigel Farage was deputy leader and now will be inaugurated as the new chancellor of Britain. The moment will be televised up and down the country with celebrations everywhere. Farage can finally get his moment and create the future Brasier would of wanted."
 ENG_Nigels_Vision:0 "Nigels Vision"
 ENG_Nigels_Vision_desc:0 "Theresa Braiser knew something could happen to her and made plans with Farage what would happen if she did die. Farage will continue with her plans and ensure the Phoenix Front lives on through the years and take the nations she wanted."
 ENG_Put_Down_The_Protesters:0 "Put Down Protesters"
 ENG_Put_Down_The_Protesters_desc:0 "Although Nigel has now been inaugurated it was filled with protests across the cities and caused problems for the front loyalists. Due to the traitors not allowing the event to go peacefully Farage has ordered a complete extermination of all protesters by using the army to put them down in the streets while they protest."
 ENG_Send_In_The_Army:0 "Send In The Army"
 ENG_Send_In_The_Army_desc:0 "The army will keep the peace in the streets and cities and if any trouble breaks out they have been given the orders to kill on sight no matter the cause. The country must be kept cleansed and obey its new leader."
 ENG_Shoot_At_The_People:0 "Shoot At The People"
 ENG_Shoot_At_The_People_desc:0 "The people still keep walking and protesting. Now its time to make a point. The army will fire at them all and put down all non-Phoenix supporters."
 ENG_Terror_Attacks:0 "Terror Attacks"
 ENG_Terror_Attacks_desc:0 "The front will stage terror attacks and frame those protesting and cause problems to rally the people against them and show they are not for freedom or democracy but really to cause widespread anarchy and bring down law and order!"
 ENG_Cut_Off_The_Scots:0 "Cut Off The Scotts"
 ENG_Cut_Off_The_Scots_desc:0 "Scotland has been the most disobedient the whole time the Phoenix has been in power. They kept staging riots and attacking government buildings. Now is the time to cut off food and materials to the Northern wilderness and watch them starve."
 ENG_Address_The_North:0 "Address The North"
 ENG_Address_The_North_desc:0 "The north is becoming more influenced by Scotland, and this must be prevented. Directly addressing them and showing them that they too will be punished will scare them into submission and prevent anymore break outs in the north."
 ENG_Welsh_Tensions:0 "Welsh Tensions"
 ENG_Welsh_Tensions_desc:0 "The Welsh are on Strike, they say that working conditions are getting worse and more dangerous. They are calling for independence and safety laws to return back to mining and labouring jobs. This of course is hilarious. Never shall Farage be forced into such submission."
 ENG_The_People_Want_Revenge:0 "The People Want Revenge"
 ENG_The_People_Want_Revenge_desc:0 "People all over the country are now seeing what is going on in the nation and are tired of it. The people are starting to rise up against the system and are marching even more causing the army to no longer be able to contain the riots."
 ENG_The_Camp_Of_Jersey:0 "The Camp Of Jersey"
 ENG_The_Camp_Of_Jersey_desc:0 "Farage has visited the island of Jersey and has authorised the biggest extermination camp in the nation. This camp will now hold anyone guilty of treason and fitting the non-phoenix type. The people of Jersey will be the first to enter the camp for trials of the new system."
 ENG_Independence_Movements:0 "Independence Movements"
 ENG_Independence_Movements_desc:0 "Throughout Scotland, Wales, Cornwall and more. The people are shouting for change and get away from London rule. Riots have been taken place, Old leaders from the past are helping and calling the people to rise up and make a stand."
 ENG_Send_The_Protesters_To_Work:0 "Send The Protesters To Work"
 ENG_Send_The_Protesters_To_Work_desc:0 "The army has arrested and captured many protesters. They will now be forced into work as slaves rebuilding towns they have torn down. Forced to build monuments and grand buildings of the Phoenix and will work until death."
 ENG_The_Cornwall_Visit:0 "The Cornwall Visit"
 ENG_The_Cornwall_Visit_desc:0 "Cornwall holds the most work camps in the country and now Farage will tour it and meet the staff who work there, congratulating them on their work for the Front and watch prisoners be taken to work or face trials for death."
 ENG_A_Quick_Escape:0 "A Quick Escape"
 ENG_A_Quick_Escape_desc:0 "As soon as Nigel stepped off the plane into Cornwall, he was greeted with protesters who had overran the police and Army, they marched to him and brought down his security team. Luckily, Nigel managed to escape through a helicopter on standby."
 ENG_Send_The_Phoenix_Army_In:0 "Send The Phoenix Army In"
 ENG_Send_The_Phoenix_Army_In_desc:0 "Nigel has ordered the army to take the whole of Cornwall and destroy the whole population of the county. This will serve as a message to the nation that no one will defeat the Phoenix."
 ENG_Bomb_Cornwall:0 "Bomb Cornwall"
 ENG_Bomb_Cornwall_desc:0 "Cornwall will be turned into a flat destroyed land with its inhabitant’s dead. Jets will continuously fly over carpet bombing the state until it is no more."
 ENG_The_Failed_Campaign:0 "The Failed Campaign"
 ENG_The_Failed_Campaign_desc:0 "Messages were breached and the population of Cornwall were informed through hackers that they were to be wiped away. The people went into hiding and into underground systems. Many towns were destroyed but lives were saved. The army got mixed with the fire from jets causing most of the casualties to come from the army."
 ENG_Cornwall_Independence:0 "Cornwall Independence"
 ENG_Cornwall_Independence_desc:0 "The mayor of Cornwall, Robin Tilbrook has declared Cornwall independent and will form a state isolated away from Britain. The people have already started to create a border from England and a state military group will stand guard on the English border."
 ENG_The_First_Of_Many:0 "The First Of Many"
 ENG_The_First_Of_Many_desc:0 "Farage knows himself this will not be the first state to seed away from Britain and he will do everything he can to keep the union together, even through force. The Scottish and Welsh now have the power to push and now they will."
 ENG_The_Cornwall_Border:0 "The Cornwall Border"
 ENG_The_Cornwall_Border_desc:0 "The border has been completed and is now heavily armed on both sides. Already both sides have fired against each other but still no invasion. Britain is slowly becoming divided, and Scotland and Wales are carefully watching Cornwall and taking notes."
 ENG_The_Red_Dragon_Roars:0 "The Red Dragon Roars"
 ENG_The_Red_Dragon_Roars_desc:0 "Wales is ready to act. Its had enough of being pushed under the iron fist and is ready to stand against Farage and his disgusting acts against humanity."
 ENG_Bagpipes_And_Guns:0 "Bagpipes And Guns"
 ENG_Bagpipes_And_Guns_desc:0 "Scotland will stand against the front and make sure the bagpipes play high through the cities of Scotland. The Scottish nationalists will encourage the people of Scotland to rise up and stop the Phoenix Front throwing English nationalism down their throats."
 ENG_Put_Down_Resistance:0 "Put Down Resistance"
 ENG_Put_Down_Resistance_desc:0 "Cities across Scotland and Wales are now rising up. Farage has once again called the army to put them down by whatever means necessary."
 ENG_Martial_Law:0 "Martial Law"
 ENG_Martial_Law_desc:0 "In a televised speech to the nation, Nigel Farage has ordered martial law will now take effect across the nation. The people will only be allowed out their houses at a certain time and all people will be watched in and outside of their homes."
 ENG_Northumberland_Stands_Against_England:0 "Northumberland Against England"
 ENG_Northumberland_Stands_Against_England_desc:0 "The north is the next to stand up. They have always felt disconnected from London and now even more. The newly created Northern Independence Party has created huge amounts of support and now the people of Northumbria stand against England."
 ENG_The_Northern_Independence_Party:0 "The Northern Independence Party"
 ENG_The_Northern_Independence_Party_desc:0 "NIP will govern the state of Northumbria and ensure the peoples freedoms are delivered back to them. They have appeared in pirate stations across the north encouraging the people to rise against the Front like Scotland, Wales and most importantly Cornwall."
 ENG_Declare_Independence:0 "Declare Independence"
 ENG_Declare_Independence_desc:0 "The north had always missed out on the army patrolling due to such farmlands and spaced towns and cities. Due to such a low count of soldiers the north has officially declared independence and will no longer be forced into submission by Farage."
 ENG_Isolated_Socialist_Nation:0 "Isolated Socialist Nation"
 ENG_Isolated_Socialist_Nation_desc:0 "The leader of NIP has spoken directly to Nigel Farage telling him they mean no harm. They will stay isolated from the rest of the nation to focus on rebuilding the state of Northumberland and allow socialism to guide them through the first hard months."
 ENG_Salmond_Survives_And_Wants_Revenge:0 "Salmond Survives And Wants Revenge"
 ENG_Salmond_Survives_And_Wants_Revenge_desc:0 "Alex Salmond was broken out of a work camp in Perth in Scotland. He has addressed the Scottish nation of what went on in the work camp and promises Scotland he will unify the nation and bring Scotland the freedom it cries out for!"
 ENG_The_Scottish_Plan:0 "The Scottish Plan"
 ENG_The_Scottish_Plan_desc:0 "Scotland has a plan for its win for Freedom. Salmond will speak with old leaders from other Scottish parties. They will discuss ways they can prevent war but also ensure Scotland is given the freedom it needs away from London."
 ENG_Wales_Will_Not_Fall:0 "Wales Will Not Fall"
 ENG_Wales_Will_Not_Fall_desc:0 "In secret meetings ex party leaders of Wales met and choose Dafydd Elis-Thomas will take control of Wales and choose the fate of where the country will go. He promises to restore Wales back to freedom and no longer will its people be subjected to the far-right ultranationalists."
 ENG_Split_The_Union:0 "Split The Union"
 ENG_Split_The_Union_desc:0 "Its time the union falls. Its outdated vision and treatment of the people in all corners of the nation has been abusive and everyone has felt the hate from the Phoenix."
 ENG_Support_Our_Old_Friends:0 "Support Our Old Friends"
 ENG_Support_Our_Old_Friends_desc:0 "Wales and Scotland share similar visions and both states history followed each other but always fought against the English. The same will happen again and both nations will join together to remove themselves from the clutches of the Front."
 ENG_Welsh_Segregation:0 "Welsh Segregation"
 ENG_Welsh_Segregation_desc:0 "The Welsh leader met with Farage in talks about the future of both nations and both agreed it would be best for the Welsh to leave the English lands and return back to Wales. Farage has spoken of peace and a true England for the English."
 ENG_Scottish_Nationalism:0 "Scottish Nationalism"
 ENG_Scottish_Nationalism_desc:0 "Scottish nationalism is at its peak and the Scottish people protests more! Farage must do something about this. Therefore, he has banned all Scottish flags in the nation to lower the Scottish people moral.  Unfortunately, this has caused the Scottish people to shout even louder for their freedom."
 ENG_Cant_Barrage_The_Farage:0 "Cant Barrage The Farage"
 ENG_Cant_Barrage_The_Farage_desc:0 "In the last couple of bills Farage has signed off into law his ego has become even higher and his power trip to worsen. He has spoken of a golden age of the nation and is positive he will be able to reunite the broken nation of Britain."
 ENG_The_Welsh_Bill:0 "The Welsh Bill"
 ENG_The_Welsh_Bill_desc:0 "The Welsh leader has decided that it is time to unite with England and restore order. In a new bill both Farage and Dafydd have agreed to put aside differences and calm the people down and renew trade between the nations to feed the people and supply the English."
 ENG_The_Welsh_Phoenix:0 "The Welsh Phoenix"
 ENG_The_Welsh_Phoenix_desc:0 "In order for the future of Wales to go ahead Nigel Farage has ordered the Welsh leader they must adopt a puppet style government in Wales which will be part of the Phoenix. They will govern for the Welsh, but they will follow the Phoenix Front."
 ENG_Phoenix_And_Welsh_Nationalism:0 "Phoenix And Welsh Nationalism"
 ENG_Phoenix_And_Welsh_Nationalism_desc:0 "The Phoenix and Welsh nationalism will become mixed together and a new Welsh front will be formed to join together broken relations and follow the laws set by Braiser and Nigel. Wales will govern its own, but it will be governed by a puppet phoenix leader."
 ENG_Shared_Ideas:0 "Shared Ideas"
 ENG_Shared_Ideas_desc:0 "The new regime will bring both Welsh and English ideas together such as more resource collecting in Wales while supplying the English army, in return England will provide the Welsh with protection against other nations and food for its people."
 ENG_Banish_The_English:0 "Banish The English"
 ENG_Banish_The_English_desc:0 "After a few months of collecting Phoenix technology and army materials, the leader of Wales has taken back control of Wales after a small removal of power and now has the power and resources needed to banish all Phoenix and English nationalists out of Wales and finally take control of the broken state."
 ENG_Rise_Of_Plaid_Cymru:0 "Rise Of Plaid Cymru"
 ENG_Rise_Of_Plaid_Cymru_desc:0 "With no puppet leader in charge and no one to stand against Wales its now time for Plaid Cymru to take control of Wales and govern it how it always should have been. FOR THE PEOPLE OF WALES!"
 ENG_Welsh_Independence:0 "Welsh Independence"
 ENG_Welsh_Independence_desc:0 "The votes have been counted and over 95% of the people of Wales have voted in favour of separation from England. A border will be created and heavily armed against the English to prevent Farage being able to take the state back."
 ENG_The_Scottish_Agreement:0 "The Scottish Agreement"
 ENG_The_Scottish_Agreement_desc:0 "Scotland has decided the future of the state is vital for the people and therefore will agree to work with the English government for the sake of the people, they will adopt a new puppet government and work for the front to prevent anymore pointless deaths."
 ENG_A_New_Scottish_Front:0 "A New Scottish Front"
 ENG_A_New_Scottish_Front_desc:0 "The new government has been created in Scotland and the new flag of the Scottish Front flies over Edinburgh."
 ENG_The_Secret_Meetings:0 "The Secret Meetings"
 ENG_The_Secret_Meetings_desc:0 "While Farage and the Phoenix Front believe they have victory over Scotland, the ex-leaders meet to plan their next steps and wait to build up their armed forces to take back Scotland and surprise the Phoenix when they least expect it."
 ENG_A_Simple_Performance:0 "A Simple Performance"
 ENG_A_Simple_Performance_desc:0 "As weeks go by, the old leaders of Scotland work with the puppet government to provide for England while they draft up plans to take Scotland. The front has removed their soldiers out of Scotland as planned and Salmond prepares for his moment."
 ENG_The_Union_Splits:0 "The Union Splits"
 ENG_The_Union_Splits_desc:0 "In the early hours of the morning Scottish troops broke into the puppet leaders houses and execute them. Salmond has taken control of Scotland and addressed the population that the time of waiting is no more!"
 ENG_The_Gears_Move:0 "The Gears Move"
 ENG_The_Gears_Move_desc:0 "The Scottish army have taken up arms on the English border and are ready to fire if they see Phoenix Soldiers arrive at Berwick. Many civilians have taken up arms ready to defend their homes for the sake of a free Scotland."
 ENG_Scotland_Independence:0 "Scotland Independence"
 ENG_Scotland_Independence_desc:0 "No one arrived. Farage knows it is now pointless and union is completely divided. Salmon spoke to Scotland and has now officially declared the state is now free and fully independent from English rule."
 ENG_The_Split:0 "The Split"
 ENG_The_Split_desc:0 "The nation is broke, states have split. Northumbria, Scotland, Wales and Cornwall now stand free and are no longer pushed under an Iron fist."
 ENG_Nigels_Revenge:0 "The Fronts Revenge"
 ENG_Nigels_Revenge_desc:0 "Nigel has not been in the public eye now for some weeks and rumours are he has fell into a great depression. Many high ups in the Phoenix are plotting to overthrow him and take control of the nation."
 ENG_Braisers_Mistake:0 "Braiser Mistake"
 ENG_Braisers_Mistake_desc:0 "Theresa Braiser made a big mistake choosing Farage as the next leader of the Phoenix and now the deputy leaders have made the choice to remove him from power. Nigel has refused to concede power but many in the Phoenix want change and will do whatever they can to get it."
 ENG_The_Independence_Protests:0 "The Independence Protests"
 ENG_The_Independence_Protests_desc:0 "The people walk the streets shouting and screaming for freedom. Independence protests have been witnessed in every city in Britain calling for their people to stand up and fight against the far right."
 ENG_Patel_Wants_Power:0 "Patel Wants Power"
 ENG_Patel_Wants_Power_desc:0 "The hardliner brute Priti Patel wants power and has always been power hungry. Her work with the camps and slave trade has made her a front runner for leadership and a favourite within the Phoenix Front and many believe she will bring Britain together and reshape it."
 ENG_Old_English_Symbols:0 "Old English Symbols"
 ENG_Old_English_Symbols_desc:0 "The old Britain’s used symbols as their writings and war cries. Its time to bring this back and show the people that Britain’s history must be remembered and used in the modern age. The olds days shall be returned."
 ENG_There_Is_Only_England:0 "There Is Only England"
 ENG_There_Is_Only_England_desc:0 "England has been through much in the past years but it has always survived, through world wars, many kings and queens as well as different governments but England has always lived and so it shall under Patel."
 ENG_No_More_Help:0 "No More Help"
 ENG_No_More_Help_desc:0 "Even with Braiser and Farage in charge it still received food and materials from its allies. No more, Britain shall be self-sufficient and rule the world on its own."
 ENG_Ruthless_And_Confidence:0 "Ruthless And Confidence"
 ENG_Ruthless_And_Confidence_desc:0 "Patel has promised confidence and power and she will ensure her slogan will be written everywhere in England. Her ruthless laws by scaring the people into submission and confidence in government has allowed her rule to be monumental."
 ENG_Rule_Of_Fear:0 "Rule Of Fear"
 ENG_Rule_Of_Fear_desc:0 "Priti believes the way to rule is through fear and this is what she will do. By subjecting the weak and non-pure she will scare the rest into being her subjects and promise Britain will rise through the ashes."
 ENG_Boris_And_His_Gang:0 "Boris And His Gang"
 ENG_Boris_And_His_Gang_desc:0 "Boris Johnson was never looked at to be a serious contender to be leader of the country but many still believe due to his less aggressive outlook and more humour and calmness would be a good way to calm the nation down and become more diplomatic."
 ENG_Unite_England:0 "Unite England"
 ENG_Unite_England_desc:0 "Johnson promised one thing, “United Britain” and this is what he will do if he gets into power. The people are tired of the old ways and want a united nation who eat fish n chips and celebrate bangers and mash being the nations favourite food."
 ENG_A_Jollymans_England:0 "A Jollymans England"
 ENG_A_Jollymans_England_desc:0 "Boris has always come across as a jolly guy who is the least serious of the leaders in the Front. Many view him as someone who will be able to win over the hearts of the nation and keep the party together in a less aggressive way."
 ENG_Northumbria_Lessons:0 "Northumbria Lessons"
 ENG_Northumbria_Lessons_desc:0 "Johnson knows the problems that occurred in Northumbria and what lessons can be learnt to prevent other states in England from following similar paths and having a far left state on the isle."
 ENG_Secret_Arrests:0 "Secret Arrests"
 ENG_Secret_Arrests_desc:0 "Although many views Boris Johnson as a happy jolly bloke he still has a dark side which allowed his path into the Phoenix. He has ordered many in the front to be arrested and executed by his own followers to prevent more contenders in the leadership race."
 ENG_Rule_Of_Nationalism:0 "Rule Of Nationalism"
 ENG_Rule_Of_Nationalism_desc:0 "Boris has used the phrase “English And Proud” to win the people over, his views of English nationalism has been something that has allowed the people of the country to accept him as one of their own and believe he is similar to the people."
 ENG_Cameron_The_Reformer:0 "Cameron The Reformer"
 ENG_Cameron_The_Reformer_desc:0 "David Cameron was never far right or believed in the front and deep down disliked Braiser but also wished to live and stay in the political light. He has promised that no more camps or attacks on neighbours will continue with him in charge. He will reform the front into a new party."
 ENG_Talks_With_Scotland:0 "Talks With Scotland"
 ENG_Talks_With_Scotland_desc:0 "Cameron has meet with leaders in Scotland and promised them if he wins the leadership, he will work with the Scottish people to provide stability and repair the broken relationships Braiser and Farage created."
 ENG_Away_From_The_Front:0 "Away From The Front"
 ENG_Away_From_The_Front_desc:0 "Cameron has declared he is no longer a true member of the Phoenix Front and will stand as a member for the people not a far-right candidate. He will stand by the people and bring the old ways back to the nation."
 ENG_Talks_With_Wales:0 "Talks With Wales"
 ENG_Talks_With_Wales_desc:0 "Cameron arrived in Cardiff to meet with leaders in Plaid Cymru, he apologised on behalf of himself for the way the party treated the people of Wales and promised if he becomes leader he will rebuild the Welsh and English relationship and will do what he can for this to happen."
 ENG_We_Want_The_Same:0 "We Want The Same"
 ENG_We_Want_The_Same_desc:0 "David Cameron has appeared on TV across Britain, Scotland, Wales, and Cornwall promising the people they all want the same as him. Stability and freedom. He will make sure no more far right corruption will ever enter the doors of parliament."
 ENG_Rule_Of_Change:0 "Rule Of Change"
 ENG_Rule_Of_Change_desc:0 "If Cameron becomes leader, he will remove the position as chancellor and return democracy with free and fair elections. Change is coming, it just depends what leader is chosen and what path the nation will follow.."
 ENG_Nigel_And_His_Phoenix:0 "Nigel And His Phoenix"
 ENG_Nigel_And_His_Phoenix_desc:0 "Nigel Farage still wishes to remain leader and has promised the status quo will remain. It has been tough and hard at times but Braisers plans must be made a reality and Farage will ensure Britain reaches the peak of the world stage."
 ENG_The_Braiser_Promise:0 "The Braiser Promise"
 ENG_The_Braiser_Promise_desc:0 "Before she was assassinated, Theresa Braiser wanted to bring back the British Empire and Farage will do that. He has promised to retake the states who seeded way from the nation and once reconjured he will look overseas to bring the Empire back."
 ENG_Open_More_Camps:0 "Open More Camps"
 ENG_Open_More_Camps_desc:0 "Farage knows that there is still much of the population who are resisting the Phoenix Front. Farage has ordered more camps to be built to house much of the troublemakers. Those who still refuse to accept the front will be sent to extermination camps."
 ENG_The_Border_Attacks:0 "The Border Attacks"
 ENG_The_Border_Attacks_desc:0 "Farage has promised he will unite Britain by attacking the states that left the nation. He will send every woman, child and man to war with the states to take them back and make sure the population know they will live under the Phoenix Front."
 ENG_The_English_Promise:0 "The English Promise"
 ENG_The_English_Promise_desc:0 "Nigel has made a promise. He will make sure every single pure English person will be proud of who they are and be given the best benefits any person can be given. Those who follow the rules and laws of the Phoenix will be rewarded greatly."
 ENG_Rule_Of_Power:0 "Rule Of Power"
 ENG_Rule_Of_Power_desc:0 "If chosen to stay as chancellor, Farage will use every bit of power he has to control the nation and the direction it goes. He will use his power to have complete control and remove any rival in the front which will give him full control over the choices he can make for the british nation."
 ENG_The_Rise_Of_A_New_Phoenix:0 "The Rise Of A New Phoenix"
 ENG_The_Rise_Of_A_New_Phoenix_desc:0 "It was supposed to be leadership contest day but Patel and Farage both agreed the way it was going was remarkably similar to democracy which led to the downfall of the nation. They have decided to find different method to take control."
 ENG_The_Front_Is_Still_Unhappy:0 "The Front Is Still Unhappy"
 ENG_The_Front_Is_Still_Unhappy_desc:0 "None of the leaders have found a way to choose who should take control. After many heated arguments and discussions, all the leaders left back to their manors waiting on the first leader to make the first move."
 ENG_Begin_To_Claim_States:0 "Begin To Claim States"
 ENG_Begin_To_Claim_States_desc:0 "Patel was first, followed by Johnson. Each leader took a state as their own and declared independence until they have control of the Phoenix. Each leader has started throwing insults at one another saying they will do whatever it takes to win the leadership."
 ENG_Arm_The_Counties:0 "Arm The Counties"
 ENG_Arm_The_Counties_desc:0 "Each leader will arm their counties they have taken. The people will be trained by those remaining in the army in those states and be prepared to fight amongst the other states for their dead leader."
 ENG_Claim_A_New_Faction:0 "Claim A New Faction"
 ENG_Claim_A_New_Faction_desc:0 "The leaders have now created factions and the people who live in those independent states are now part of those factions and enemies of the rest of the isle."
 ENG_Heptarchy_Returns:0 "Heptarchy Returns"
 ENG_Heptarchy_Returns_desc:0 "Britain is no more. Now all is left is a broken nation which is in a similar situation to North America."
 ENG_Camerons_Merica:0 "Camerons Mercia"
 ENG_Camerons_Merica_desc:0 "Cameron was able to claim Merica which just so happened to hold most of what was remaining of the Army. He has been trained by the best and is ready to return the old ways back to the nation."
 ENG_Johnsons_East_Anglia:0 "Johnson East Anglia"
 ENG_Johnsons_East_Anglia_desc:0 "Boris Johnson took his old childhood county and East Anglia where he grew up in not long after arriving from America. The people are not trained by have pledged their loyalty to him."
 ENG_Nigels_Wessex:0 "Nigels Wessex"
 ENG_Nigels_Wessex_desc:0 "Nigel Farage has claimed Wessex and will be watching closely and waiting for the first leader to break out and go to war. He will fight until he cannot anymore."
 ENG_Patels_Kent:0 "Patels Kent"
 ENG_Patels_Kent_desc:0 "Priti claimed Kent by killing all the population of a village and then blowing up that entire village to make a point she is strong. The people of Kent fear her and she is forcing them into the army. Anyone who stands against her will die."
 ENG_All_Out_War:0 "All Our War"
 ENG_All_Out_War_desc:0 "Patel was the first to make a move. She moved her people to the borders of Wessex during the night killing the border guards. Not long after Nigel sent soldiers into Kent and Mercia. Farage followed not long after. The nation is officially in a civil war."
 ENG_Year_Zero:0 "Year Zero"
 ENG_Year_Zero_desc:0 "Theresa Braiser has changed the face of Britain, the nation’s national flag, the orange phoenix flies over downing street and Buckingham palace.  New laws and reforms have changed the populations lives and now the nation is preparing for war. Britain will never be the same again."
 ENG_Blockade_France:0 "Blockade France"
 ENG_Blockade_France_desc:0 "Its time to starve France and block it from the outside world. The EU suffers enough economically and with a terrible output most countries including France rely on the outside world. Blocking the outside nations will run the nation down."
 ENG_Mines_In_The_Channel:0 "Mines In The Channel"
 ENG_Mines_In_The_Channel_desc:0 "The Defence of the channel is of utmost importance. For this, we’ll mine the channel. This will prevent French attacks, but also increase devastation. What’s a few dead Frenchmen ending up on the beach going to do?"
 ENG_Hack_Infrastructure:0 "Hack Infrastructure"
 ENG_Hack_Infrastructure_desc:0 "Soldiers are no longer the face of warfare. It is people behind computers hundreds of miles away. With the help of England’s finest hackers, we’ll shut down power across the French nation, prevent water from flowing, explode refineries, shut down healthcare and more. These fine gentlemen will lead us to ultimate victory!!!!"
 ENG_No_More_Talking:0 "No More Talking"
 ENG_No_More_Talking_desc:0 "France and the EU have asked Braiser to sit down and talk diplomatically. This is only a chance for them to get a bargain and push Britain down. Enough is enough and no more talking. Its time for Britain to stand ready to attack."
 ENG_Declare_War:0 "Declare War"
 ENG_Declare_War_desc:0 "The ships have sailed to Normandy and soldiers are being sent over the channel as we speak. Families watch as sons and daughters, mothers and fathers leave the island and head to war and expand the empire."
 ENG_The_Normandy_Failure:0 "The Normandy Failure"
 ENG_The_Normandy_Failure_desc:0 "Unfortunately the army wasn’t ready for such a large scale battle, soldiers were unprepared, not enough training and too many lives were lost. The communist French state were able to overrun the British quickly and pushed them back. Now the British watch over the channel to see if the French ships will arrive..and what Braiser will do in to the soldiers.."
 ENG_Execute_The_Officers:0 "Execute The Officers"
 ENG_Execute_The_Officers_desc:0 "Whoever thought we would have a quick victory over the French communist bastards will be executed publicly. They knew we’d lose, and for this they committed high treason against the country. Line them up and execute them."
 ENG_Train_For_The_Second_Blitz:0 "Train For The Second Blitz"
 ENG_Train_For_The_Second_Blitz_desc:0 "Rumours are that the French are soon to be sending fighters over the Britain in revenge attacks for what they did on the Normandy beaches. Many of the people in Britain are hiding in underground bunkers while the Phoenix Air Force is on standby ready to attack."
 ENG_Remove_Public_Services:0 "Remove Public Services"
 ENG_Remove_Public_Services_desc:0 "The people did not do enough to fight the French and therefore have let Braiser down. She has officially removed all public services no longer funding transport, healthcare education and more. Its time for the people to really suffer for their cowardice."
 ENG_Defence_Of_Britain:0 "Defence Of Britain"
 ENG_Defence_Of_Britain_desc:0 "Britain needs to be protected from foreign invasion, installing anti-aircraft guns and readying the Phoenix Airforce for defence purposes will ensure the Isle is protected."
 ENG_The_Great_Panic:0 "The Great Panic"
 ENG_The_Great_Panic_desc:0 "Many in the country are now scared, they are waiting for the bombs to start falling from the sky and the communists to invade. Braiser has ordered soldiers to go out in the streets and shoot at anyone who is causing trouble."
 ENG_The_Ultimate_Betrayal:0 "The Ultimate Betrayal"
 ENG_The_Ultimate_Betrayal_desc:0 "Rumours are that Braiser has been removed from power due to her failure at taking back control of a broken nation. She has allowed 1000s of soldiers to be injured or killed but yet still refused to admit she is at fault. Its said many of the top leaders in the front arrived to downing street ordering she no longer has power and that they will take control."
 ENG_Hopkins_Is_A_Traitor:0 "Hopkins Is A Traitor"
 ENG_Hopkins_Is_A_Traitor_desc:0 "Katie Hopkins decided its time to remove Braiser a long time ago but could not gather support. She was never keen on the party but wished to be a leader and this was her chance. Now its time for her to get into power and do the right thing in her eyes."
 ENG_Nigels_Loyalty:0 "Nigels Loyalty"
 ENG_Nigels_Loyalty_desc:0 "Nigel Farage left the government building to meet with Braiser he has still promised his full support to her and will do whatever it takes to return her back into power which seems rather unlikely. "
 ENG_A_Simple_Reform:0 "A Simple Reform"
 ENG_A_Simple_Reform_desc:0 "The Cameron and Hopkins alliance has come to an agreement and this will return a type of basic democratic government back into the country. They have agreed that they will work together and rebuild relations with other nations and bring a normality back into the nation."
 ENG_Another_Bloody_Speech:0 "Another Bloody Speech"
 ENG_Another_Bloody_Speech_desc:0 "Farage loves to make speeches, and this is his final one. He has failed to return Braiser back into power and therefore will no longer stand in the Front. He will retire from politics and try to heal the nation in his own vision."
 ENG_Joint_Leadership:0 "Joint Leadership"
 ENG_Joint_Leadership_desc:0 "A dual leadership will take control of the country for now until things can get back to normal and the people can work again and live in a nation which is once again safe. Although Hopkins and Cameron are working together, they will have very different ideas of how the country should work in the future."
 ENG_EVERYONE_CALM_DOWN:0 "EVERYONE CALM DOWN"
 ENG_EVERYONE_CALM_DOWN_desc:0 "Riots have broken out across the country as leaderships fall and new ones begin panic has set in as those who support braiser are fearing life could return back to a broken way whereas many others panic to prevent another type of front system to take control of the country."
 ENG_Rebuild_The_party_System:0 "Rebuild The Party System"
 ENG_Rebuild_The_party_System_desc:0 "The first thing to do is rebuild parliament and make sure a system like Braisers never enters the world again. Rebuilding parliament shows the world that Britain is once again changing but for the better and is now ready to accept other peoples views on what should happen in the country."
 ENG_The_Phoenix_Parliament:0 "The Phoenix Parliament"
 ENG_The_Phoenix_Parliament_desc:0 "David Cameron has established the “New Tory Party” who will govern the nation with Katie Hopkins. This party will gently remove the laws and reforms Braiser set and try to bring Britain back to what it used to be. A fair strong democratic system."
 ENG_Priti_Isnt_Playing_Anymore:0 "Priti Isnt Playing Anymore"
 ENG_Priti_Isnt_Playing_Anymore_desc:0 "Priti Patel was disgusted the way the war ended and the failure. She has put herself forward as leader and show the rest of the Phoenix Front how a real leader would take a nation into war and what it would do with those who fight back."
 ENG_Patel_Wants_Blood:0 "Patel Wants Blood"
 ENG_Patel_Wants_Blood_desc:0 "After the end of the Normandy war Priti made it clear she was incredibly angry with the whole nation and its armed forces. She arrived at barracks ordering random men and woman onto the street to be shot at and make it clear that those who fail will suffer."
 ENG_Take_Iceland:0 "Take Iceland"
 ENG_Take_Iceland_desc:0 "Iceland would be a great place to take with such a low population, no army and somewhere to test subjects on away from the homeland it would be ideal. It would be an extremely easy war to win and still show to the rest of the world that Britain means business and Patel wants power."
 ENG_We_Have_Power:0 "WE HAVE POWER"
 ENG_We_Have_Power_desc:0 "Priti Patel has forced her way through the ranks and has now labelled herself as leader of the nation. Her power-hungry fear tactics have played well into her hands and now she will really show the nation who to be feared of."
 ENG_PURITY_TESTS:0 "PURITY TESTS"
 ENG_PURITY_TESTS_desc:0 "Patel has always been a woman of science and dreamed of not being held back on what she could do. Now she has the chance and can use science to find out how she will be able to create the perfect British human and be able to tell who is not."
 ENG_EXPAND_THE_CAMPS:0 "EXPAND THE CAMPS"
 ENG_EXPAND_THE_CAMPS_desc:0 "Priti was always a fan of the work and extermination camps and now with prisoners from Iceland she can now take advantage of this and move more camps to Iceland and order more work to be done to change more of the nation."
 ENG_TESTING_THE_SLAVES:0 "TESTING THE SLAVES"
 ENG_TESTING_THE_SLAVES_desc:0 "Patel needs test subjects and who is better than non-pure british. They will be subjected to tests of science and be given diseases as well as ways to cure them to ensure the british purity will always exist and no disease or chemical warfare could end this."
 ENG_TAKE_BRITTANY_BY_SCIENCE:0 "TAKE BRITTANY BY SCIENCE"
 ENG_TAKE_BRITTANY_BY_SCIENCE_desc:0 "Normandy was a failure but Brittiany would also be a grand place to take. Now is the time to do this. But not with soldiers, but with chemical warfare. Its time to poison the population there and when they are weak take the state and begin to create the empire."
 ENG_The_Success_Of_War:0 "The Success Of War"
 ENG_The_Success_Of_War_desc:0 "The war has been won and now Normandy is officially part of Britain. The nation celebrates its first victory in Europe. Braiser has addressed the people thanking them for their hard work and will shortly visit Normandy for a victory parade."
 ENG_Normandy_The_Puppet:0 "Normandy The Puppet"
 ENG_Normandy_The_Puppet_desc:0 "Normandy has been taken and the French refuse to fight back while they are suffering from the European Spring. The flag of Normandy has been changed and the Phoenix now waves in Europe. Normandy is to become a farming state to provide food and goods to the nation of Britain."
 ENG_Phoenix_Propaganda:0 "Phoenix Propaganda"
 ENG_Phoenix_Propaganda_desc:0 "Jets fly over the French state dropping leaflets about what life is like under the Phoenix and how the people are free under a party who cares for the heritage of the people. Phoenix hackers break into major news outlets in France showing what France could be become if it adopts the Phoenix identity."
 ENG_Eyes_On_Brittany:0 "Eyes On Brittany"
 ENG_Eyes_On_Brittany_desc:0 "Brittany is to become the next state to submit themselves to the Phoenix. It would be an ideal place to take as it allows east access into the large oceans and perfect port for warships as well as taking back some of Britain’s old history."
 ENG_Rid_The_Communists:0 "Rid The Communists"
 ENG_Rid_The_Communists_desc:0 "The communists are what is causing the downfall of the French state, and this must be broadcast everywhere. Ensuring the French can hear this is vital to the front cause to ensure total loyalty. Making a point that Britain no longer holds the leftist pigs in the country has allowed the nation to grow and become a self-sufficient nation."
 ENG_The_Phoenix_Indoctrination:0 "The Phoenix Indoctrination"
 ENG_The_Phoenix_Indoctrination_desc:0 "Its all about pushing the ideology everywhere and influencing some so they can push it to everyone. Even if a few people in France accept the Phoenix that’s enough to cause some type of push to make the French Phoenix Front exist."
 ENG_Expanding_The_Country:0 "Expanding The Country"
 ENG_Expanding_The_Country_desc:0 "Not only will expanding lands into Normandy and Brittany allow the people of Britain extra room to live and increase production in the state with prisoners working in factories it also creates dominance in the world and will help towards returning the empire back."
 ENG_Normandy_Plans:0 "Normandy Plans"
 ENG_Normandy_Plans_desc:0 "Normandy has been chosen to become the state of work and production. Those who live there will be given plots of land with farms and factories and will make sure the existing population of Normandy will work on these farms and factories and send the material over the channel to Britain."
 ENG_The_British_Transformation:0 "The British Transformation"
 ENG_The_British_Transformation_desc:0 "Normandy architecture is a French communist style of old. It needs to be changed and updated to a full british style with new roads, signs and more. The nation will look similar to states like Gibraltar or the Falkland Islands. No more French influence on the new owned states."
 ENG_The_Increase_Labour_Camps:0 "Increase The Labour Camps"
 ENG_The_Increase_Labour_Camps_desc:0 "Now Normandy and Ireland are in the hands of the Phoenix its population are still resisting the occupation and simple arrests and shootings are not doing anything. Its time to create labour camps to force those who challenge the Phoenix to work until death."
 ENG_Made_In_Britain:0 "Made In Britain"
 ENG_Made_In_Britain_desc:0 "Every item now created overseas will have the stamp “Made In Britain” unlike currently where most items are imported from the likes of China. The “Made In Britain” stamp will become a fast popular slogan while will please the people."
 ENG_Prepare_For_Brittany:0 "Prepare For Brittany"
 ENG_Prepare_For_Brittany_desc:0 "Just like the plans for Normandy, Brittany will see similar tactics used to take the state. This time the army already has a foothold in Europe to take Brittany easier, Many of the population of Brittany has already left making it easier to take the state."
 ENG_Raids_In_France:0 "Raid In France"
 ENG_Raids_In_France_desc:0 "Its time to cut the state even deeper. Due to the French army no longer prepared for a full-scale war let alone able to rebuild itself to fight amongst themselves dropping bombs into production factories and farms in the French state will prevent a chance for the army to regroup and attach British soldiers in Brittany."
 ENG_The_Beach_Walk:0 "The Beach Walks"
 ENG_The_Beach_Walk_desc:0 "The soldiers are now leaving Normandy and walking the beaches to Brittany. Braiser wants to scare the EU and doing this will cause stress and panic to the population of France, the unstoppable Phoenix Soldiers ready to strike at anyone who stands in their way."
 ENG_Attack_Brittany:0 "Attack Brittany"
 ENG_Attack_Brittany_desc:0 "Braiser has given the command and now guns roar into Brittany. The Phoenix Navy fire at government buildings in Brittany tearing them down. Those civilians who have remained there are either dead or are willing to surrender. This surely will be a very quick victory."
 ENG_The_Front_In_France:0 "The Front In France"
 ENG_The_Front_In_France_desc:0 "Two states are now officially part of Britain. The Phoenix Front flag now flies in Europe and soon to be in France. Brittany has become a state of fishing and ship building which will rebuild and create a strong British navy capable to taking on other countries. Its only sometime until the rest of France submits themselves."
 ENG_Prepare_For_The_French_Invasion:0 "Prepare For The French Invasion"
 ENG_Prepare_For_The_French_Invasion_desc:0 "The army has now been rebuilt and with moral high due to such swift victories in Normandy and Brittany, its only sometime until France falls either under the Phoenix or the Spring. Braiser is preparing for the full invasion of France and ready to attack the EU if needs be.."
 ENG_The_Spark:0 "The Spark"
 ENG_The_Spark_desc:0 "Braiser was about to give the command to go ahead with the war in France until news reached her those old political leaders have went to the north of England and encouraged the people to rise up especially with half the army in the different country it is the best chance, they have to make trouble for Braiser."
 ENG_The_Manchester_Riots:0 "The Manchester Riots"
 ENG_The_Manchester_Riots_desc:0 "Manchester was always a problem for Braiser as a labour stronghold in previous elections and not securing any seats for the Front in the last election here of course this would be the first place to cause problems. With Front buildings attacked and set alight many of the police are struggling to take control of the situation."
 ENG_Burnham_Survived_And_is_talking:0 "Burnham Survived And Is Talking"
 ENG_Burnham_Survived_And_is_talking_desc:0 "Andy Burnham, ex-mayor of Manchester until arrested once the Front got into power has managed to escape thanks to small groups of pro-democracy supporters. He has made speeches about his time in work camps and how the Front is killing innocent people sparking more fury into the hearts of the people in Manchester."
 ENG_Newcastle_Protests:0 "Newcastle Protests"
 ENG_Newcastle_Protests_desc:0 "The people Newcastle have also heard the news of Burnham’s time in the camps and now its time for the people of the Northeast to stand up and turn against the Phoenix. The industrial area will no longer send materials to the front starving the rest of the country, Much of Northumbria will stand with Manchester and are preparing for small armed groups to defend the Northeast."
 ENG_Birmingham_Strikes_back:0 "Birmingham Strikes Back"
 ENG_Birmingham_Strikes_back_desc:0 "Birmingham is the heart of the military production. With news entering all corners of Britain of what prisoners are forced to do its now time to starve the Phoenix Army. With new army production being sent up north to arm the rebels, Braiser is starting to worry about her new nation and what will become of it especially with the army still unable to fully take control of the nation."
 ENG_The_North_Meets:0 "The North Meets"
 ENG_The_North_Meets_desc:0 "Newcastle, Northumbria and Manchester have all joined together to rebuild democracy and force the front out. Burnham has met with the likes of Tony Blair, Kier Starmer on what actions should be taken next. Diplomacy is no longer an option so now its time for a new way of doing things.."
 ENG_Andy:0 "Andy"
 ENG_Andy_desc:0 "Andy Burnham wants revenge against the phoenix. With his escape and vast support with him, this could pose a real threat to the northern division of the Phoenix Front."
 ENG_Blair:0 "Blair"
 ENG_Blair_desc:0 "Tony Blair managed to escape London and stay hiding in his home in Sedgefield. While many of his SDP colleagues were rounded up, he was able to build an underground network with other MPs from other parties and prepare to fight back."
 ENG_Starmer:0 "Starmer"
 ENG_Starmer_desc:0 "Keir Starmer was able to prevent being arrested due to his role working in law. He was offered a role in the Front but turned it down and moved from being an MP to a regular lawyer. He has been able to work with ex police and law officials to prepare to fight back."
 ENG_Anti_Phoenix_Marches:0 "Anti Phoenix Marches"
 ENG_Anti_Phoenix_Marches_desc:0 "Andy Burnham is going to march through Manchester with his supporters and overrun the northern division of the Phoenix. Many expect large numbers of people to join the march to rid the Front out of the Northwest"
 ENG_The_First_Clash:0 "The First Clash"
 ENG_The_First_Clash_desc:0 "While protesting through the midlands, the Phoenix supporters came out to meet the rebels. Its time to fight back."
 ENG_The_Phoenix_Retreats:0 "The Phoenix Retreats"
 ENG_The_Phoenix_Retreats_desc:0 "After a long fight and many injured or unfortunately not making it. The Phoenix supporters were driven back, and the rebels marched forwarded. The Phoenix Front will not win, and this moment has proven it."
 ENG_Release_The_Data:0 "Release The Data"
 ENG_Release_The_Data_desc:0 "Many rebels were able to escape work and were able to take video footage of what goes on in the labour camps as well as other prisons across the nation. Many across the nation are unaware of this footage. Its time the public finally find out what the prisoners of the Phoenix have to endure."
 ENG_A_TV_Announcement:0 "A TV Announcement"
 ENG_A_TV_Announcement_desc:0 "Keir Starmer has appeared on Television and spoken of the disgusting acts of humanity Braiser has committed in this country. He has begged the people to stand together and fight in solidarity. Bring down the Front, restore this nation back to a golden beacon of democracy."
 ENG_Uniting_For_Freedom:0 "Uniting For Freedom"
 ENG_Uniting_For_Freedom_desc:0 "The people of Britain shall come together and face against the phoenix front for the sake of freedom, liberty, and democracy. No longer will they be pushed under an iron fist and forced to listen to the far-right propaganda."
 ENG_Burn_The_Phoenix_Icons:0 "Burn The Phoenix Icons"
 ENG_Burn_The_Phoenix_Icons_desc:0 "Across the nation, statues, paintings, and idols of Theresa Braiser were built and created for to represent her being strong and always watching. Its time to bring these eye sores down and bring down her influence."
 ENG_Were_Coming_Braiser:0 "Were Coming Braiser"
 ENG_Were_Coming_Braiser_desc:0 "The people are marching, they are coming for Braiser and her gang. They are ready to fight until the last man is standing and will not stop until Braiser is in chains awaiting her fate in the tower of London and the torch of democracy burns again."
 ENG_The_Armed_Forces:0 "The Armed Forces"
 ENG_The_Armed_Forces_desc:0 "Just like in France, the army is split. Some groups have chosen to stay and stand by Braiser while the others stand by their families for the freedom and restoring democracy. Blair has met with many Generals in the army and created groups of soldiers to defend the North."
 ENG_For_Her_Majesty:0 "For Her Majesty"
 ENG_For_Her_Majesty_desc:0 "We have requested to meet with the queen and wish to fight on behalf of her. We want her to understand this is not the old days of taking lands for an empire. This is for a future for freedom, the young growing up in a fair free country while people are able to make choices and will not be killed on the streets for that choice. We need the queen to stand with us!"
 ENG_For_Our_Global_Friends:0 "For Our Global Friends"
 ENG_For_Our_Global_Friends_desc:0 "This is not just a fight for the country. This is a fight for the people around the world. Stopping the phoenix taking more countries like they have done with Ireland and Normandy. Its time to protect other countries and preventing them from falling and becoming another fascist land like Britain has become."
 ENG_We_Fought_Against_This_Last_Time:0 "We Fought Against This Last Time"
 ENG_We_Fought_Against_This_Last_Time_desc:0 "Grandfathers fought against this type of ideology. They would turn in their graves knowing what has become of their fair free nation. Its time history is also remembered and prevent this type of thing ever happening again."
 ENG_The_People:0 "The People"
 ENG_The_People_desc:0 "Its now time for everyone to stand. Young, old, no matter the gender or religion. Its time for the people to take a stand and fight every possible way they can. Already the Phoenix have been pushed out of the North and now its time to take them out of the capital."
 ENG_Help_The_Weak:0 "Help The Weak"
 ENG_Help_The_Weak_desc:0 "Due to this protest. Many have been left weak and injured. With no more free healthcare and the NHS being privatised people cannot afford the healthcare charge. Its time to help the weak our own way, the doctors and nurses who joined us will help us!"
 ENG_The_Camps:0 "The Camps"
 ENG_The_Camps_desc:0 "Now its time to remove the camps and never lets this sort of act ever happen again! Protesters will take control of the camps and fight against the guards who patrol there. They will be heavily outnumbered, and this shall be an extremely easy fight to win and free those people who have had their innocents taken away."
 ENG_The_Million_Mask_March:0 "The Million Mask March"
 ENG_The_Million_Mask_March_desc:0 "The people are walking down motorways and through towns. The phoenix has been able to identify those who riot which is why the mask of guy Fawkes will be used to fight back against the facial scans the front has set up around the country. The millions will march to the doors of 10 downing street."
 ENG_Take_The_Torch:0 "Take The Torch"
 ENG_Take_The_Torch_desc:0 "As the rebels enter the south getting closer to London, they can feel the fight coming but are ready to take the torch of democracy and light it up over parliament."
 ENG_The_Second_Clash:0 "The Second Clash"
 ENG_The_Second_Clash_desc:0 "Soldiers of the Phoenix, Police and other supporters wait for the rebels to enter London. With each group heavily armed and ready to fight, its time to finally see how much of a fight each side is wiling to give and who will be the first to surrender."
 ENG_Welcome_To_London:0 "Welcome To London"
 ENG_Welcome_To_London_desc:0 "Fire burns in the districts of London. Many have lost their lives but yet are still willing to move forward to take Braiser. As the rebels enter the city of London they go steadily waiting for the Phoenix to make their next move."
 ENG_The_Gates_Of_Downing_Street:0 "The Gates Of Downing Street"
 ENG_The_Gates_Of_Downing_Street_desc:0 "London has been taken by the Rebels and already members of the Front are surrendering in huge numbers. Starmer, Blair and Burnham have entered downing street ready to claim number 10 and finally rid the country of the stinking smell of fascism."
 ENG_We_March_Forward:0 "We March Forward"
 ENG_We_March_Forward_desc:0 "As districts in London fall to the rebels and the city of London lays in ruins the people move forward searching for Braiser. Although many believe she is in London, she has been missing for days. No longer her broadcasts are heard. Yet the people move together searching for the witch that is Braiser.."
 ENG_Knock_Knock:0 "Knock Knock"
 ENG_Knock_Knock_desc:0 "Its time to enter number 10, Its time to find the bitch and make her pay for what she has done to the people of this country. Everyone wants revenge and now is the chance to take the opportunity and make sure Braiser pays dearly."
 ENG_The_Hopkins_And_Cameron_Alliance:0 "The Hopkins And Cameron Alliance"
 ENG_The_Hopkins_And_Cameron_Alliance_desc:0 "Hopkins And Cameron were never great fans of the Phoenix Front, in all honestly, they just wanted to live. Now it has gone too far and people are dying because they want basic freedoms. Both leaders have agreed to work together to remove this dictatorship."
 ENG_Braiser_Escapes:0 "Braiser Escapes"
 ENG_Braiser_Escapes_desc:0 "Leaders broke into 10 downing street and searched high and low for Braiser. It seems she managed to get away leaving the people disappointed. Luckily she left all documents and plans relating to the phoenix in possession of the rebels.."
 ENG_The_Hunt_For_Braiser:0 "The Hunt For Braiser"
 ENG_The_Hunt_For_Braiser_desc:0 "The hunt is on! Every person across the country is searching for Braiser and will ensure she gets caught. Groups of citizens are going around streets and towns in London searching for her hoping they will be the first to catch the wicked woman."
 ENG_Capture_The_Phoenix_Leaders:0 "Capture The Phoenix Leaders"
 ENG_Capture_The_Phoenix_Leaders_desc:0 "While searching for Braiser many leaders of the Phoenix were caught hiding in their government buildings. It seems some even tried to take their own lives but were found before it was too late. Most of them have already been rounded up and are on display in the streets for the protesters to take advantage of."
 ENG_March_To_Parliament:0 "March To Parliament"
 ENG_March_To_Parliament_desc:0 "The three leaders, Andy, Tony, and Keir are walking to parliament to take control of the government and declare that the phoenix front has officially been removed from power and a new temporary government will take control of the country."
 ENG_We_Have_Her_Trail:0 "We Have Her Trail"
 ENG_We_Have_Her_Trail_desc:0 "While moving through the streets it seems some people caught sight of Braiser been rushed to Parliament to be hidden away and hoping to escape. Rumours are the New Zealand leader “Winston Peters” will arrive to help her escape. Its vital she can be found before its too late!"
 ENG_Smash_The_Doors_Down:0 "Smash The Doors Down"
 ENG_Smash_The_Doors_Down_desc:0 "The rebels arrived at Parliaments doors, breaking down the ancient wooden doors while other smash the windows breaking in. As smoke slowly starts to rise from the historic beacon of democracy many believe this is Braisers final stand."
 ENG_Parliament_Burns:0 "Parliament Burns"
 ENG_Parliament_Burns_desc:0 "As parliament begins to burn and the day turns to night, shouts can be heard, it seems the rebels have found Braiser and are deciding on her fate before the leaders manage to get their hands on her."
 ENG_The_Surrender:0 "The Surrender"
 ENG_The_Surrender_desc:0 "Braiser has been caught, she surrenders pleading for her life. The moment was recorded live on mobile devices being streamed across the nation showing that the phoenix has finally been removed and a new dawn has finally arrived for the people of Great Britain."
 ENG_Arrest_Her:0 "Arrest Her"
 ENG_Arrest_Her_desc:0 "Before the rebels were able to make a move, Tony Blair ordered for her arrest and be taken away in and be judged properly, not through a fake jury or pay her way out of it. This time t he people get a choice on what happens to her."
 ENG_The_Trial_Of_Theresa:0 "The Trial Of The Phoenix"
 ENG_The_Trial_Of_Theresa_desc:0 "All the leaders of the Phoenix have been put into custody. Each leader will face the peoples court and law, they will come face to face with victims of the Phoenix Front and will be forced to answer for what they have done."
 ENG_The_Trial_Of_The_Leaders:0 "The Trial Of The Leaders"
 ENG_The_Trial_Of_The_Leaders_desc:0 "The four deputy leaders are to be given their own hearing. A choice will be made if they shall go free or face penalty."
 ENG_Camerons_Fate:0 "Camerons Fate"
 ENG_Camerons_Fate_desc:0 "David Cameron stayed away from the public eye and did not interfere with the Phoenix Front. He only joined to protect his family and his own life. He pleaded he hated the Front and Braiser and wished he had acted to prevent such a terrible thing happening across the nation. How will the people decide his fate?"
 ENG_Nigels_Fate:0 "Nigels Fate"
 ENG_Nigels_Fate_desc:0 "Nigel Farage was deputy chancellor and is nearly as guilty as Braiser, he laughed when caught and admitted he done wrong but made sure history will remember his name and is a true English patriot putting the English people first. How will the people decide his fate?"
 ENG_Johnsons_Fate:0 "Jonsons Fate"
 ENG_Johnsons_Fate_desc:0 "Boris Johnson..The man was not innocent as he played a part in the slave trade and worked with Farage to privatise the country, the problem the people have is now Boris is acting as if he was forced to take part in these acts? How will the people decide his fate?"
 ENG_Patels_Fate:0 "Patels Fate"
 ENG_Patels_Fate_desc:0 "Priti Patel stands firm on the way she acted and believed it was the right thing to do and still is. She admitted what she did was right in her eyes and the English people got their country back as well as admitting at one point she overwhelmed Braiser by forcing her to take more harsher actions. How will the people decide his fate?"
 ENG_Braisers_Public_Trial:0 "Braiser Public Trial"
 ENG_Braisers_Public_Trial_desc:0 "Braiser has entered the courtroom, her face pale and lips tight shut together refusing to speak. Many people scream at her from the audience and try to throw objects at her. Yet she has sat there grinning knowing what she has done will leave a lasting scar on the country and knows fine well the country will always be remembered for this."
 ENG_The_Firing_Squad_two:0 "The Firing Squad"
 ENG_The_Firing_Squad_two_desc:0 "The verdict was heard and was unexpected..Even Braiser didn’t expect to hear the outcome, she only thought life in prison. The people have chosen her fate and she will answer her crimes with death."
 ENG_Kill_The_Dictator:0 "Kill The Dictator"
 ENG_Kill_The_Dictator_desc:0 "Before the leaders got to her, the rebels pinned her down and shot her in the head. Her body dragged into the streets for the people to kick and spit at. The witch is finally dead."
 ENG_A_New_Dawn:0 "A New Dawn"
 ENG_A_New_Dawn_Desc:0 "Now Braiser is gone, its time to rebuild. Its time for the country to unite together and make sure this cursed movement is never able to come together again and repeat history. Britain will be rebuilt and the people as well as the world are ready for a new start."
 ENG_Rebuild_The_Nation:0 "Rebuild The Nation"
 ENG_Rebuild_The_Nation_desc:0 "The first step is to rebuild the towns, cities, and villages. Many were destroyed during the civil war and many have now been left homeless."
 ENG_Demolish_The_Camps:0 "Demolish The Camps"
 ENG_Demolish_The_Camps_desc:0 "The camps have already been removed in the north. Now its time for the likes of the Jersey camp to be destroyed. Nothing shall be left to influence another group of radicals."
 ENG_Return_The_Prisoners:0 "Return The Prisoners"
 ENG_Return_The_Prisoners_desc:0 "All the prisoners of the Phoenix who are guilty of the pathetic crimes Braiser created have been released. Returned back to their families and loved ones."
 ENG_Remove_The_Phoenix_Way_Of_Life:0 "Remove The Phoenix Way Of Life"
 ENG_Remove_The_Phoenix_Way_Of_Life_desc:0 "The Phoenix Front forced people to go back to an old 1950s type of way of life. Woman to stay home and cook while the men go out to work while the children are given military types of education. This will be stopped, and the modern-day life shall return for all."
 ENG_Return_Public_Services:0 "Return Public Services"
 ENG_Return_Public_Services_desc:0 "Trains, buses, and more were turned into carriages to carry slaves and weapons. They have now been returned back to the public. Water, gas, and energy companies are also now in the public’s hands."
 ENG_The_NHS_Is_Back:0 "The NHS Is Back"
 ENG_The_NHS_Is_Back_desc:0 "The beating heart of the nation was ripped out. Now it has returned, and the people can finally get their care and wellbeing given back to them. The NHS has returned!"
 ENG_The_BBC:0 "The BBC"
 ENG_The_BBC_desc:0 "The Front removed and renamed the BBC to the Phoenix Broadcasting Cooperation. This has been removed and the BBC has returned no longer blasting far right propaganda but finally real normal programs fit for all!"
 ENG_Restore_Education:0 "Restore Education"
 ENG_Restore_Education_desc:0 "The young were forced to be taught military education while being forced to take part in military exercises. Now they are free to enjoy their youth and no longer have to be pushed under an iron fist."
 ENG_Prepare_Parliament:0 "Prepare Parliament"
 ENG_Prepare_Parliament_desc:0 "The three leaders have all agreed its now time to being politics back to the country and no longer have the one state party controlling all. They have met with other party leaders and are ready to enter west minister. "
 ENG_Democracy_Returns:0 "Democracy Returns"
 ENG_Democracy_Returns_desc:0 "The british flag has been raised over parliament. Old MPs from banned parties have returned and are ready to debate. Already reforms are underway to return the country back to what it used to be. Celebrations are taking place. Democracy has returned. Freedom is back."
 ENG_The_New_Way:0 "The New Way"
 ENG_The_New_Way_desc:0 "The Front was too radical to exist. But its ideas are there, and they’ve saved England from Communism. Together Cameron and Hopkins are working to reform this tyrannical system into something more democratic."
 ENG_Limits_For_Braiser:0 "Limit For Braiser"
 ENG_Limits_For_Braiser_desc:0 "Braiser is an extreme to our ideology, its just sad that she’s the one who got us in power. Both Prime Ministers agree that while she remains the face of the movement, it’s time to place limits on her power and what she can say."
 ENG_A_Better_Bill:0 "A Better Bill"
 ENG_A_Better_Bill_desc:0 "The new bill introduced into law will create more freedoms for people such as no longer having to have pictures of braiser in their homes, removing the need of national service and many more acts from Braisers time."
 ENG_The_Two_Party_System:0 "The Two Party System"
 ENG_The_Two_Party_System_desc:0 "David Cameron has created a new party, The “New Tory Party” which will be  a centre right party which will help restore the old ways while also working with the Phoenix front to bring stability back to the country."
 ENG_The_New_Tory_Party:0 "The New Tory Party"
 ENG_The_New_Tory_Party_desc:0 "David Cameron is now the new de facto leader of whats left of Brittania. Pledging himself and his party to restoring the country, many wonder if he can actually succeed in restoring the old ways."
 ENG_Feed_The_Weak:0 "Feed The Weak"
 ENG_Feed_The_Weak_desc:0 "There are many who have had to put their money towards basic needs but still unable to afford food and water. Cameron has pledged a new budget for the people to ensure they get given food and basic human needs."
 ENG_Talks_With_Ex_Leaders:0 "Talks With Ex Leaders"
 ENG_Talks_With_Ex_Leaders_desc:0 "Cameron has visited old leaders from Labour, SDP and liberal democrats to talk about how they can all work together to restore democracy and remove the far right nationalists away from total power."
 ENG_Restore_Basic_Welfare:0 "Restore Basic Welfare"
 ENG_Restore_Basic_Welfare_desc:0 "The New Tory Party will restore the social welfare system and limit what it can be used for such as a small amount of benefits for the unemployed and a smaller national health system."
 ENG_Restore_The_BBC:0 "Restore The BBC"
 ENG_Restore_The_BBC_desc:0 "The BBC has been restored and the Phoenix Broadcasting Channel has been removed. Fireworks were set off as the station came back on TV across the nation providing news and updates of the outside world brits have been without."
 ENG_Open_The_Market_Again:0 "Open The Market Again"
 ENG_Open_The_Market_Again_desc:0 "London’s stock market was closed as soon as braiser came into power to take control of companies. Now Cameron has reopened the markets and already the nations currency has returned its strength."
 ENG_Cameron_Meets_Braiser:0 "Cameron Meets Braiser"
 ENG_Cameron_Meets_Braiser_desc:0 "David Cameron has visited braiser in her home and has asked her to make an apology to the people and even hand herself in to the law for crimes against humanity. Many have not seen her in days after this.."
 ENG_The_Man_Stands_At_10_Downing_Street:0 "The Man Stands At 10 Downing Street"
 ENG_The_Man_Stands_At_10_Downing_Street_desc:0 "Cameron has finally entered downing street with crowds celebrating in the street waving the old union jack flags in their hands. He made a speech saying the work has already begun and Britain will return to the old days of freedom."
 ENG_A_New_Britain:0 "A New Britain"
 ENG_A_New_Britain_desc:0 "Already flags of the phoenix have been burnt and the flag of the UK has been put on display around the country even in the broken away states. Phoenix education materials have been destroyed and many hiding from the secret police have returned to their homes."
 ENG_The_Rumours:0 "The Rumours"
 ENG_The_Rumours_desc:0 "People want Braiser to pay for what she’s done, not only has she broken the isle, but she has caused wars and death. The problem is where is she? Many believe Cameron killed her on his visit to her, but no proof has come out yet about this."
 ENG_Shut_Down_The_Camps:0 "Shut Down The Camps"
 ENG_Shut_Down_The_Camps_desc:0 "One of the first changes Cameron has made is removing all of the camps the phoenix front built. He has ordered the army and police to tear down all camps and help the prisoners inside to rehome them and work with them to bring them back into the new nation of Britain."
 ENG_Assign_The_Cabinet:0 "Assign The Cabinet"
 ENG_Assign_The_Cabinet_desc:0 "Cameron has met with old tory MPs and has already assigned them roles on the government cabinet. Many responsible for removing the fronts reforms and ensuring the young and old never have to work or live under the far-right pigs again."
 ENG_The_Phoenix_Mark:0 "The Phoenix Mark"
 ENG_The_Phoenix_Mark_desc:0 "The phoenix required all state workers to be branded with a number and the mark of the phoenix on their body to stand out as official members of the party. This has been marked as a crime and all those must have the mark removed and any who carry the mark will be imprisoned."
 ENG_the_New_Speech:0 "The New Speech"
 ENG_the_New_Speech_desc:0 "Cameron has spoken to the party today and announced that Britain has finally removed the fascists from the streets and the people are ready to be proud once again of their country. No more far left or far right leaders will ever take control again of the born-again nation."
 ENG_Rebuild_Britain:0 "Rebuild Britain"
 ENG_Rebuild_Britain_desc:0 "Britain is broken and needs help. States have went independent and now the south of England stands on its own. Its time for the leaders to work together with the other states and help rebuild Britain back to its former country."
 ENG_Destory_Phoenix_Centers:0 "Destory Phoenix Centers"
 ENG_Destory_Phoenix_Centers_desc:0 "The Phoenix Front created hubs in towns to project propaganda to the people and use these buildings as officials’ offices. The centres will be removed off the streets and be replaced by crosses of those who have fallen against the front."
 ENG_Arrest_Phoenix_Supporters:0 "Arrest Phoenix Supporters"
 ENG_Arrest_Phoenix_Supporters_desc:0 "Although democracy is slowly returning to the fragile nation, there are still groups who protest against the new government and shout for the return of the Front. They must be stopped and removed from the streets to prevent further support."
 ENG_Ban_The_Phoenix_Flag:0 "Ban The Phoenix Flag"
 ENG_Ban_The_Phoenix_Flag_desc:0 "As the Germans did after the Second World War, it is time for us to change the flag. The Pheonix Eagle is a representation of hate and malice, for this we should ban the flag and make its possession a capitol offense."
 ENG_Restore_Her_Majesties_Army:0 "Restore Her Majesties Army"
 ENG_Restore_Her_Majesties_Army_desc:0 "The one thing Braiser did which went against the Queen was changing her Army. The phoenix army will be reformed back into the army who will serve under the Queen and the people of this Country. No more hard-line brutes attacking innocents."
 ENG_Fix_Ireland:0 "Fix Ireland"
 ENG_Fix_Ireland_desc:0 "Ireland was the first to fall under the Phoenix, its time to fix the country and prepare to restore their independence. The people must be given food, water and most importantly return the ones who were forced away from their home."
 ENG_Ireland_And_Ulster:0 "Ireland And Ulster"
 ENG_Ireland_And_Ulster_desc:0 "Ireland and Ulster will be united under one flag. Its time to remove the problems and focus on the Irish blood being united together and help rebuild their nation. Hopefully no more tension will rise from this."
 ENG_United_For_Now..:0 "United For Now"
 ENG_United_For_Now.._desc:0 "Both countries are now untied together. For now the people of the two nations seem to be getting along and the new agreement signed by leaders of Ulster and Ireland will work together and rebuild the broken island along with Britain lending a hand along the way."
 ENG_Allow_New_And_Old_Parties:0 "Allow New And Old Parties"
 ENG_Allow_New_And_Old_Parties_desc:0 "David Cameron has finally met with ex leaders of old political parties and has agreed its now time for them to enter parliament and restore democracy to the nation and be able to hold the current government accountable in the future."
 ENG_Labour_And_The_SDP:0 "Labour And The SDP"
 ENG_Labour_And_The_SDP_desc:0 "Labour And The SDP will work together in an alliance to help rebuild the social welfare system and ensure social democracy can work again without the far leftists being able to gain power like they could have in the past."
 ENG_The_Rest:0 "The Rest"
 ENG_The_Rest_desc:0 "The liberal democrats and others will be a minority party and will return back to parliament to challenge the current government. They will not be given power but act for the people to stand up for them as they once did."
 ENG_Keep_The_Limit_For_Now:0 "Keep The Limit For Now"
 ENG_Keep_The_Limit_For_Now_desc:0 "No new parties will be allowed to be created until the country has been returned back to their old ways. The country needs to heal and it will require everyone to work together. Now is not the time for more change."
 ENG_The_Tories_First_Year:0 "The Tories First Year"
 ENG_The_Tories_First_Year_desc:0 "The Tories will stay in power for another year to ensure smooth transition from the front to democracy. A lot of work will be required and the people must work together. After this year Cameron has promised a free and fair election will be called for the people."
 ENG_Old_Friends:0 "Old Friends"
 ENG_Old_Friends_desc:0 "Ireland And Britain have both went through a lot the past few months and are now recovering from the damage Braiser and Farage created. Now its time once again to unite against other fascist and communist nations and promise again that they will defend each other as well as work together on other topics."
 ENG_France_And_Spain:0 "France And Spain"
 ENG_France_And_Spain_desc:0 "France has been through hell to put it lightly and now its time for Britain to face the music and work with France to give back Normandy and Brittany. Meanwhile we will work with Spain to help prevent tensions and have the two royal families finally seek peace together from old odds."
 ENG_Pay_Reparations:0 "Pay Reparations"
 ENG_Pay_Reparations_desc:0 "Britain has caused unknown amounts of damage to France and now its time to give back to the nation. Britain will return billions of pounds to the state of France and help the nation recover after the war."
 ENG_Sign_The_Agreement:0 "Sign The agreement"
 ENG_Sign_The_Agreement_desc:0 "Britain and France have sat down with Spain and all three have agreed never to seek war again and work close together for a new future of the nations and help the European countries look to the three nations as an example of what a real modern agreement and diplomatic talk can really do."
 ENG_Remember:0 "Remember"
 ENG_Remember_desc:0 "Its vital the nation does not forget the past and will always remember history can repeat itself. Braiser and her acts will always be remembered and stop history from coming back to haunt us."
 ENG_The_United_Kingdom:0 "The United Kingdom"
 ENG_The_United_Kingdom_desc:0 "After visiting states across the nation, meeting with foreign leaders and rebuilding Britain back. Its time to bring back the old flag. A new dawn has finally come to the United Kingdom and now its time to celebrate."
 ENG_The_Phoenix_And_Hopkins:0 "The Phoenix And Hopkins"
 ENG_The_Phoenix_And_Hopkins_desc:0 "Katie Hopkins has been chosen to lead the country and will govern under a more mild phoenix front. She will cut down on some extreme laws and bring more stability to peoples lives."
 ENG_New_Education_Material:0 "New Education Material"
 ENG_New_Education_Material_desc:0 "Schools are currently being taught about the history and great power of the British Empire. Now its also time to add the victories in Europe and how Braiser understood it was time for her to allow another leader to work with her for the future of the country and what the phoenix does for its people."
 ENG_Friends_Of_The_Phoenix:0 "Friends Of The Phoenix"
 ENG_Friends_Of_The_Phoenix_desc:0 "Some Nations across the world have the same ideals as the Front and its time to accept them and move on from an isolated nation to working with similar leaders and maybe even create an alliance."
 ENG_Help_The_Veterans:0 "Help The Veterans"
 ENG_Help_The_Veterans_desc:0 "Soldiers fight to keep the safety of Britain and its people. Now its time for those to be rewarded with free healthcare, housing and many more benefits for serving on the frontline for the country."
 ENG_Mass_Privatisation:0 "Mass Privatisation"
 ENG_Mass_Privatisation_desc:0 "There are still some state-run sectors that operate and cost taxpayers. Why should the people pay when they get no use out of it? Its time to privatise the whole public sector and make sure the markets are fully open."
 ENG_The_Economy_And_Its_Strength:0 "The Economy And Its Strength"
 ENG_The_Economy_And_Its_Strength_desc:0 "The markets are now unlocked and its time for the pound to build its strength. Already private companies are looking to move back into Britain due to its change of leadership and its low tax rates."
 ENG_Hopkins_Meets_Braiser:0 "Hopkins Meets Braiser"
 ENG_Hopkins_Meets_Braiser_desc:0 "Katie Hopkins has met with Theresa Braiser and has called upon her to agree on new terms of leadership for the country. Many in the front have ideas what Braiser could do but Katie wishes to work with her and ensure complete stability to prevent any protests or riots."
 ENG_The_Woman_At_10_Downing_Street:0 "The Woman At 10 Downing Street"
 ENG_The_Woman_At_10_Downing_Street_desc:0 "Katie Hopkins arrived at 10 downing street opening with a speech saying she wants change and change will come. The nation is divided and will fix the hole that is in the country."
 ENG_A_Duel_Woman_Leader:0 "A Duel Woman Leader"
 ENG_A_Duel_Woman_Leader_desc:0 "Katie will govern the nation along with Theresa Braiser. They will work together to heal the nation and create a moderate group in the government. The radical change has happened and now its time to look forward to the future as Hopkins calls it."
 ENG_Corporative_Leadership:0 "Corporative Leadership"
 ENG_Corporative_Leadership_desc:0 "Katie Hopkins has always been interested in the markets and money and has promised businesses that she will stand up for them and make sure they are given the right treatments companies have always needed. She will not only govern as a leader but also as a CEO for the country."
 ENG_The_Queen:0 "The Queen"
 ENG_The_Queen_desc:0 "As is tradition, Hopkins has met with the Queen and requested permission to form a new Government and to seek the Queens help in governing the isles. As was predicted, the Queen was happy to see new blood come into leadership on the isles."
 ENG_Remove_The_Death_Camps:0 "Remove The Death Camps"
 ENG_Remove_The_Death_Camps_desc:0 "Priti Patels death camps are an affront to the movement. The Bible says “man shall not kill man” and Hopkins seeks to resolve this issue by ordering the shutting down and dismantling of all camps. However, the labour camps are still in operation."
 ENG_Young_Blood:0 "Young Blood"
 ENG_Young_Blood_desc:0 "Katie Hopkins appeals to the youth in ways that Braiser can’t even imagine. Using this to her advantage, she will take the cult of personality away from Braiser and bring it around herself. “Bugger off Braiser, Hopkins is where it’s at!”"
 ENG_Silence_Braiser:0 "Silence Braiser"
 ENG_Silence_Braiser_desc:0 "Braiser has started to go behind Hopkins back and call her out on the moderate laws she has introduced even calling her non british. Hopkins with her popularity has been able to limit Braiser and prevent her from opening her mouth again."
 ENG_Hopkins_Arrests_Braiser:0 "Hopkins Arrests Braiser"
 ENG_Hopkins_Arrests_Braiser_desc:0 "Early in the morning, Prime Minister Hopkins ordered the arrest of Theresa Braiser for violating the terms of the power sharing agreement and surprisingly, crimes against humanity. While this has only exasperated the protests, Hopkins believes this will consolidate her power."
 ENG_The_Staged_Trial:0 "The Staged Trial"
 ENG_The_Staged_Trial_desc:0 "Hopkins has created a fake trial and televised it across the country to show the people Braiser will pay for her crimes against the nation. Many pray she will pay with her life while some protest her innocence and demand her immediate release from custody."
 ENG_The_Firing_Squad:0 "The Firing Squad"
 ENG_The_Firing_Squad_desc:0 "Theresa Braiser has been sentenced to death for crimes against humanity. In a few days’ time she will be executed by members of the Pheonix Military and her estate will be granted to the state."
 ENG_The_Tower_Of_London:0 "The Tower Of London"
 ENG_The_Tower_Of_London_desc:0 "Braiser has been found guilty and will spend the rest of her life locked up in the Tower Of London. She will be visited by families who have lost loved ones because of Braiser."
 ENG_The_New_Leader:0 "The New Leader"
 ENG_The_New_Leader_desc:0 "Hopkins is Officially leader of Britain and will take Britain from a far right fascist dictatorship to a nationalist democratic style state which freedoms are given to the people and jobs flourish."
 ENG_PATELS_EUROPE:0 "PATELS EUROPE"
 ENG_PATELS_EUROPE_desc:0 "Priti Patel has claimed the throne of Britain. Her craziness and insane paranoia has driven her way beyond the limits of any other normal person. She has now chosen the next target is Europe and she will have it!"
 ENG_GIVE_ME_FRANCE:0 "GIVE ME FRANCE"
 ENG_GIVE_ME_FRANCE_desc:0 "Patel has demanded that France must fall to Britain. The nation will be wiped away and Britain will bring the French people under her rule, no more will the French language dominate the land of Europe and they will be forced to accept British culture and language."
 ENG_DENMARK_NEEDS_PURITY:0 "DENMARK NEEDS PURITY"
 ENG_DENMARK_NEEDS_PURITY_desc:0 "Denmark is perfect to test the new bioweapons that have been created by Patel. The nation will have new bombs dropped on it and Patel will watch with eager eyes how the people of Denmark will suffer and react to the new type of weapon."
 ENG_THE_NETHERLANDS_MUST_GO:0 "THE NETHERLANDS MUST GO"
 ENG_THE_NETHERLANDS_MUST_GO_desc:0 "The Netherlands is a waste of land. It is a pointless piece of Europe and will be perfect to expand the nation of Britain and move some of its people there for more living space."
 ENG_A_SLICE_OF_IBERIA:0 "A SLICE OF IBERIA"
 ENG_A_SLICE_OF_IBERIA_desc:0 "Iberia has always been a target for Britain, but Spain has had close relations with Britain in the past and therefore Spain will be forgiven for its threats. Portugal on the other hand has worked with Europe to attack Britain and a Portugal will be next to feel the heat of Patel and her fury."
 ENG_ADOPT_PORTUGAL:0 "ADOPT PORTUGAL"
 ENG_ADOPT_PORTUGAL_desc:0 "Portugal has been taken over by Britain and now its people cry for purity. They will be subjected to tests and experiments to see if they are able to become part of the pure british race or have to be removed from existence."
 ENG_THE_GERMAN_BRITISH_EMPIRE:0 "THE GERMAN BRITISH EMPIRE"
 ENG_THE_GERMAN_BRITISH_EMPIRE_desc:0 "Although Germany is the powerhouse of the European Union their history is remarkably close with Britain’s and the Anglo sphere could benefit Germany. We will give them a chance to join us or be forced to become part of us."
 ENG_CRUSH_WARSAW:0 "CRUSH WARSAW"
 ENG_CRUSH_WARSAW_desc:0 "Poland is weak and their past has shown this. They have never recovered after joining the communist revolution and are going through huge economic problems. Now is the perfect time to take the nation and force them into submission."
 ENG_KICK_THE_BOOT:0 "KICK THE BOOT"
 ENG_KICK_THE_BOOT_desc:0 "Italy is one of the leaders of Europe and command much of it. They are going through major economic and political instability and anymore issues could topple the nation. Italy will fall under Patel and Europe will be claimed."
 ENG_THE_EUROPEAN_BRITISH_EMPIRE:0 "THE EUROPEAN BRITISH EMPIRE"
 ENG_THE_EUROPEAN_BRITISH_EMPIRE_desc:0 "Europe has finally been conjured and its people have either submitted themselves to the Phoenix Front or removed from existence. Now its time to create the European British Empire and make our claim to the world."
 ENG_ANNEX_THE_REST:0 "ANNEX THE REST"
 ENG_ANNEX_THE_REST_desc:0 "The rest of the content is not part of the Front, there is no point in wasting this perfect opportunity to take the rest of the none pure countries and bring them under the phoenix umbrella."
 ENG_NUKE_THE_BALKANS:0 "NUKE THE BALKANS"
 ENG_NUKE_THE_BALKANS_desc:0 "The Balkans would never submit themselves and the people could never be part of the british Empire. We have no need for the lands and therefore due to the countries and people being pointless and taking up room we will remove every bit of the land and show the world we will remove race and countries if needs be."
 ENG_THE_BALKAN_SLAVE_TRADE:0 "THE BALKAN SLAVE TRADE"
 ENG_THE_BALKAN_SLAVE_TRADE_desc:0 "The people of the Balkans would be perfect fit to work in the factories and farms of the Empire. This way we are giving them the chance to live but also provide for the goodness of the Empire."
 ENG_NEXT_STOP_THE_WORLD:0 "NEXT STOP THE WORLD"
 ENG_NEXT_STOP_THE_WORLD_desc:0 "The whole of the European content has been taken. Now the world can be the next target. Russia, America, Canada, South America and EVERY COUNTRY will follow like Europe did and the world will become the Phoenix."
 ENG_PATEL_EMPRESS_OF_THE_WORLD:0 "PATEL EMPRESS OF THE WORLD"
 ENG_PATEL_EMPRESS_OF_THE_WORLD_desc:0 "Countries have now submitted themselves or fallen under Priti Patel. She now controls huge amounts of land and every single person on those newly annex lands will submit to her. Governments have been transformed into Phoenix Puppets and Britain has claimed its empire back!"
 ENG_George_Galloway:0 "George Galloway"
 ENG_George_Galloway_desc:0 "George Galloway the leader of the Workers Party will rebuild the state of Britain brick by brick and put the working class forward as well as making sure they are representing. George does not believe in the communist movement and wishes for that influence to be removed due to his strict anti-EU views similar with the Soviet outlook."
 ENG_Dealing_With_The_Party:0 "Dealing With The Party"
 ENG_Dealing_With_The_Party_desc:0 "Now Galloway is in charge of the nation he can now investigate the far left and find the real communist sympathizers who may cause problems in the party in the future. Recently Ken Livingston has contacted Galloway and revealed large amounts of information which could cause internal problems within the party.."
 ENG_Cleaning_Up_The_Congress:0 "Cleaning Up The Congress"
 ENG_Cleaning_Up_The_Congress_desc:0 "George has accepted the files received from Livingstone and reinstated Livingstone to be added back into the party. Now Galloway has ordered all non-faithful members of the WRP to be removed and ensure the party remains stable and loyal."
 ENG_The_Workers_Party_Of_Britain:0 "The Workers Party Of Britain"
 ENG_The_Workers_Party_Of_Britain_desc:0 "With the purges now complete Galloway has ordered all left parties to be united under one, parties such as the independent labour party and the SWP will now be incorporated into the WRP. With such a large amount of support, Galloway can now finally enact his policies without conflict from the inner chambers."
 ENG_The_working_class_rewarded:0 "The Working Class Rewarded"
 ENG_The_working_class_rewarded_desc:0 "Its time the working class is rewarded for their hard work and dedication to the nation. Factories, farms and more industry has been producing resources and products are record speeds and the economy has bounced back strong. Now its time for the people to be given better wages, a new reformed welfare state and more."
 ENG_All_Adults_To_Work_On_Ability:0 "All Adults To Work On Ability"
 ENG_All_Adults_To_Work_On_Ability_desc:0 "As the industry grows so does the work needed to supply the industry. Galloway has announced once adults reach the age of 18 they will be tested on the type of work they are strong in and then be placed in that industry of work to provide the best results of work and provide the nation with the best"
 ENG_Rebuild_British_Industry:0 "Rebuild British Industry"
 ENG_Rebuild_British_Industry_desc:0 "Factories have been moved over seas and many jobs were lost due to failed past administrations. Now Galloway is here, he has provided a large sum of money to the nation to rebuild the car industry and resource gathering such as new renewable industry. He wishes every adult to be working and able to provide their best to the state."
 ENG_Distance_From_The_EU:0 "Distance From The EU"
 ENG_Distance_From_The_EU_desc:0 "The EU is a dictatorship and must never be allowed to command the republic of Britain. Some EU members have already tried to reach out to the WRP to cooperate with us but has only fallen on deaf ears. Never shall this nation speak or acknowledge the EU, the communists will never be allowed to enter our shores."
 ENG_Remove_The_Soviets:0 "Remove The Soviets"
 ENG_Remove_The_Soviets_desc:0 "Galloway is not a communist and puts the communists in the same category as fascists, his refusal to work with the CPGB has shown this. Now he has ordered the immigration office to remove all communist supporting members from the nation and distance all industries from working with the Soviet Union to prevent any type of communist influence to enter the republic."
 ENG_Stop_The_Immigration:0 "Stop The Immigration"
 ENG_Stop_The_Immigration_desc:0 "Another real problem this nation is facing is the immigration crisis sweeping across Europe, the SDP allowed a more open-door policy allowing secret communists and fascists to enter our nation. We must stop this at once and put our own people first. We have only just rebuilt this nation, it would be a disaster to see it fall again."
 ENG_Encourage_Self_Reliance:0 "Encourge Self Reliance"
 ENG_Encourage_Self_Reliance_desc:0 "Now all adults are chosen based on their abilities its now time for the people to work and to work for the republic, to provide for the republic and be a proud citizen of the republic. The Republic Comes First."
 ENG_Close_Of_Society:0 "Close Off Society"
 ENG_Close_Of_Society_desc:0 "As the paranoia sinks deeper inside Galloway’s head, he has ordered all Brits to remain in this country and close the borders completely. Total control must be adopted and all non british citizens to be removed from the republic."
 ENG_The_Republic_First:0 "The Republic First"
 ENG_The_Republic_First_desc:0 "People say family and friends first, Galloway has commanded this is wrong, it will always be the republic first, if the republic falls then everything falls. All work must be completed to the highest standard and anyone who refuses will be committing one of the worst crimes this administration has created."
 ENG_The_Labour_Government:0 "The Labour Government"
 ENG_The_Labour_Government_desc:0 "Labour has been elected as the government to run the country. After over a decade of the SDP being in control of the country the people have chosen Labour to be the government who changes the course of the nation and the direction of what will take the United Kingdom through the 2010s."
 ENG_Limit_Right_Wing_Movement:0 "Limit Right Wing Movement"
 ENG_Limit_Right_Wing_Movement_desc:0 "We have to prevent the rise of the Right wing in the country. Our plan is to deplatform people like Theresa Braiser and Nick Griffin."
 ENG_Fix_The_Oversea_Problem:0 "Fix The Oversea Problem"
 ENG_Fix_The_Oversea_Problem_desc:0 "Italy is facing a refugee problem and soon those fleeing war will arrive here, We must prepare for the refugees, but also remember that many of these people just want to escape war and live peacefully with their families."
 ENG_Speak_With_The_EU:0 "Speak With The EU"
 ENG_Speak_With_The_EU_desc:0 "It’s time to sit down with the European Union and fix the problems the UK and EU are facing. Talks such as trade and policy can be resolved and working together for the likes of the refugee crisis and the French economy will be beneficial for everyone."
 ENG_The_New_Trade_Policy:0 "The New Trade Policy"
 ENG_The_New_Trade_Policy_desc:0 "The EU and UK has finally come to an agreement and can now trade together, new products from the UK and Europe will soon arrive on supermarket shelves and the people will be able to try new products from overseas."
 ENG_Cut_The_Trade_Barriers:0 "Cut The Trade Barriers"
 ENG_Cut_The_Trade_Barriers_desc:0 "The EU and UK have been able to negotiate a new agreement which removes the trade barriers in the countries allowing free trade without heavy taxes or tariffs included allowing cheaper products to be bought in shops and imported freely."
 ENG_A_Better_Position:0 "A Better Position"
 ENG_A_Better_Position_desc:0 "The country is already now in a better place than what it was, the right wing have been removed and now those cultures being attacked can finally relax while the EU threat has been removed and a new friendship has been created."
 ENG_The_SDP_Were_Wrong:0 "The SDP Were Wrong"
 ENG_The_SDP_Were_Wrong_desc:0 "It seems the SDP followed a strict plan of how they wanted to govern the country, already Labour has proven this plan to be a failure and now the people are freer and have a voice to speak with our new neighbours."
 ENG_The_Gang_Of_Four_No_More:0 "The Gang Of Four No More"
 ENG_The_Gang_Of_Four_No_More_desc:0 "The SDP has already lost two of its main leaders and now the party is slowly losing many of its members as old and new members of the SDP are now returning back to Labour recognizing its influence in the world again."
 ENG_Labour_Is_The_Real_Social_Democracy:0 "Labour Is The Real Social Democracy"
 ENG_Labour_Is_The_Real_Social_Democracy_desc:0 "The Labour Party was set up in the 1900s as a social democratic party and has always stood for those real solid values. The SPD claimed they were true social democrats yet had to work with the Tories proven they could never be true social democrats and give the people the voice they cried for."
 ENG_The_SDP_Failed_At_Immigration:0 "The SDP Failed At Immigration"
 ENG_The_SDP_Failed_At_Immigration_desc:0 "The Social Democratic Party tried to reform immigration and spectacularly failed pushing the right wing to gain more influence in politics and pushing the country backwards. Now its Labours turn to fix this policy properly."
 ENG_Take_Real_Control_Of_Our_Borders:0 "Take Real Control Of Our Borders"
 ENG_Take_Real_Control_Of_Our_Borders_desc:0 "Tony Benn has met with his party and a new plan has come together which will introduce a skilled level type of entrance to the uk of those who wish to live and work here, depending on your skill level and educate will depend on if you are able to remain and work here."
 ENG_Counter_The_Communist_Threat:0 "Counter the Communist Threat"
 ENG_Counter_The_Communist_Threat_desc:0 "The Communists feel now labour is in power they now have a platform, we must ensure the communists do not use Labour as an excuse to influence the population. Rather than attacking them we can sit down and speak with them and try to ease their influence in the nation and come to a resolution."
 ENG_Outlaw_Fascist_Parties:0 "Outlaw Fascist Parties"
 ENG_Outlaw_Fascist_Parties_desc:0 "Tony Benn has committed his promise to ban all far-right wing parties which resemble past regimes which controlled countries and doomed their population. Parties like the newly setup Phoenix Front and BNP, Britain First have now been banned and all its members to dissolve their membership."
 ENG_Educate_The_Right:0 "Educate The Right"
 ENG_Educate_The_Right_desc:0 "The right wing unfortunately is not the brightest if we look at those in the BNP and Britain First many don’t seem to understand how the world works, new education centers have been set up by the government to help educate them about the outside world and what benefits we have with other cultures."
 ENG_Arrest_Far_Right_Leaders:0 "Arrest Far Right Leaders"
 ENG_Arrest_Far_Right_Leaders_desc:0 "Warrants for the arrest of Theresa Braiser and Paul Golding have been sent out to take the fascist leaders into custody and arrest them due to their illegal acts on the streets and attacking the innocent."
 ENG_Work_With_The_Left:0 "Work With The Left"
 ENG_Work_With_The_Left_desc:0 "The independent labour party was created due to the labour party moving to the center and away from its original values discarding Clause IV, now the party is back with a large majority its time to welcome the ILP members back and work with them to unify the left."
 ENG_Invite_Corbyn_Back:0 "Invite Corbyn Back"
 ENG_Invite_Corbyn_Back_desc:0 "Jeremy Corbyn created the ILP and its party skyrocketed with popularity, if we can bring him back into the party and merge his party with ours we would become an unstoppable force against the other parties."
 ENG_Accept_ILP_Policies:0 "Accept ILP Policies"
 ENG_Accept_ILP_Policies_desc:0 "Now the ILP have merged its time to accept some of their own views and policies to make sure this partnership can work such as rebuilding the NHS, nationalizing some key areas of the country, and preventing the party from breaking away again."
 ENG_Nationalise_Key_Areas:0 "Nationalise Key Areas"
 ENG_Nationalise_Key_Areas_desc:0 "A key policy of Corbyn’s party was taking over some important industries in the nation such as water, electricity and energy giving the people a much cheaper bill to pay their energy and water with high efficiency."
 ENG_Take_Control_Of_Transport:0 "Take Control Of Transport"
 ENG_Take_Control_Of_Transport_desc:0 "Transportation has been neglected by the Private sector. By nationalizing this sector, we can give it the funding that it needs."
 ENG_The_New_Health_Service:0 "The New Health Service"
 ENG_The_New_Health_Service_desc:0 "Jeremy Corbyn has chaired meetings with Benn and discussed rather than reforming the NHS, rebuilding it from the ground up by removing every section of private health from the NHS and putting it into the public as well as investigating every area of the health service to improve its efficiency as well as removing the long waiting times."
 ENG_Embrace_New_Labour:0 "Embrace New Labour"
 ENG_Embrace_New_Labour_desc:0 "The Labour Party has always kept to its old roots and refused to become the next SDP, the problem is the world has moved forward but labour hasn’t. Keir Starmer wishes the party to move forward and embrace the modern world and its politics. He has asked the party to join him removing Benn and pushing Starmer as labour leader to create “The New Labour Party”"
 ENG_The_Starmer_Effect:0 "The Starmer Effect"
 ENG_The_Starmer_Effect_desc:0 "Keir Starmer has been voted in by labour members as the next labour leader. He has already made dramatic changes within the party by removing far left members from the party expelling them to prevent them causing damage to the reformatted party. Already many from the SDP and LibDems have left their parties to return back to labour and embrace the real Social Democrat party."
 ENG_Allow_Private_Limited_Industry:0 "Allow Private Limited Industry"
 ENG_Allow_Private_Limited_Industry_desc:0 "Many capitalists view labour as a leftist group against private property and scare away many private landowners, now under Starmer he has ensured he will work with those businesses to ensure they build industry here and create jobs for the people rebuilding the confidence into the party."
 ENG_Labours_Capitalist_Plan:0 "Labours Capitalist Plan"
 ENG_Labours_Capitalist_Plan_desc:0 "Its time labour meets with business owners and private property developers, under a new plan business will be able to pay less tax if they wish set up business here and in return they provide safe well paid jobs to the people as well as those who rent houses can afford to live in a safe modern house built for the population."
 ENG_Update_The_Welfare_Bill:0 "Update The Welfare Bill"
 ENG_Update_The_Welfare_Bill_desc:0 "The SDP didn’t heavily focus too much on welfare and because of this the national living wage never really changed and more people become poor. Now under labour they have updated the bill pushing the national living wage up, a fairer benefits scheme for those out of work and working to help those in need of serious help."
 ENG_Modernise_The_NHS_And_Public_Service:0 "Modernise The NHS And Public Services"
 ENG_Modernise_The_NHS_And_Public_Service_desc:0 "The NHS is to be updated for a modern age, new hospitals will be built around the country and new budgets to be created to allow more investment giving to the healthcare services as well as more money into greener transport with cheaper fares on rail and buses."
 ENG_New_House_Of_Lords:0 "New House Of Lords"
 ENG_New_House_Of_Lords_desc:0 "Labour has announced their plans to reform the house of lords to now have elected officials enter the house rather than a party choosing to send their members to the chambers allowing a more fairer equal democratic voice in the chambers of the lords."
 ENG_A_Deal_For_Scotland_And_Wales:0 "A Deal For Scotland And Wales"
 ENG_A_Deal_For_Scotland_And_Wales_desc:0 "The labour leader has sat down with Scottish leaders and Welsh leaders to talk about how labour can provide more support for the states and ensure they no longer feel left out of London rule. It seems both states wish to have their own parliaments and have a chance for those nations to be governed on their own as well as follow british law."
 ENG_The_Devolved_Scottish_parliament:0 "The Devolved Scottish Parliament"
 ENG_The_Devolved_Scottish_parliament_desc:0 "Scotland has been given their own parliament building, now the state of Scotland can finally set their own policies and laws and no longer feel as if they have been left out of London rule."
 ENG_The_Devolved_Welsh_parliament:0 "The Devolved Welsh Parliament"
 ENG_The_Devolved_Welsh_parliament_desc:0 "Wales now has a parliament of their own, they have been able to elect a party which the people feel will represent the Welsh identity and no longer feel alone against the English parliament."
 ENG_The_Economy_Problem:0 "The Economy Problem"
 ENG_The_Economy_Problem_desc:0 "The economy isn’t in great shape, the United Kingdom is the last remaining European nation which holds a democratic voice but with no investment from European nations, only really from Canada, Ireland, and a few others the pound isn’t that strong. Its time to deal with this issue and fix the economy."
 ENG_New_Industry_For_The_21st_Century:0 "New Industry For The 21st Century"
 ENG_New_Industry_For_The_21st_Century_desc:0 "Labour has announced plans to build new technology centers across the nation providing new technology industry and I.T industry to become a cyber ready nation as well as new nuclear power planets to be built and solar energy farms."
 ENG_Introduce_Minimum_Wage:0 "Introduce Minimum Wage"
 ENG_Introduce_Minimum_Wage_desc:0 "The SDP may have created the minimum wage but it hasn’t changed since its creation in 2000, people are living on unfair unrealistic wages. Labour will remove this old wage and reintroduce this as the ‘National Living Wage’ built for a modern age and give the workers the wage they deserve!"
 ENG_Build_Back_Better:0 "Build Back Better"
 ENG_Build_Back_Better_desc:0 "Labour has committed itself to rebuild the nation, new housing to be built for a modern age, schools, and job centers to be given to the people. Its time the people are finally given a chance to be proud of the country they live in."
 ENG_National_Investment_Bank:0 "National Investment Bank"
 ENG_National_Investment_Bank_desc:0 "The National Investment Bank will be created to prevent the borrowing from other nations and reduce the national debt of the country, the bank will be able to produce funding for small and medium size enterprises by addressing the gap problems in small businesses. Through fair taxes money will be put into the investment bank and be used to pay for the right things in our country."
 ENG_Cut_Military_Spending:0 "Cut Military Spending"
 ENG_Cut_Military_Spending_desc:0 "War is not an option in this country, most countries hold some type of nuclear weapon, and this is a huge problem. We cannot have our soldiers fighting against others when problems can be solved diplomatically. Therefore, to prevent this money will be cut from our military and that money will be used in services which actually need the money."
 ENG_The_Labour_Pound_Promise:0 "The Labour Pound Promise"
 ENG_The_Labour_Pound_Promise_desc:0 "Labour is guaranteeing the pound will grow significantly under their government by strong investment, fair and better jobs and a strong economy. Rebuilding the trust in investors to grow their businesses here and make the pound a strong currency again."
 ENG_The_Euro_Can_Work_Too:0 "The Euro Can Work"
 ENG_The_Euro_Can_Work_Too_desc:0 "The Euro is a very weak currency and against the pound it fails. Investing in both the pound and the euro will allow European investors to come here and spend their currency on projects here providing both a better life for here and overseas."
 ENG_The_Rich_Must_Pay_Too:0 "The Rich Must Pay Too"
 ENG_The_Rich_Must_Pay_Too_desc:0 "The elite and billionaires pay little to no tax and that is extremely unfair. Now the top 5% of earners in the country will now pay a new form of tax to make it fair for everyone."
 ENG_The_Three_Nations_Industry_United:0 "The Three Nations Industry"
 ENG_The_Three_Nations_Industry_United_desc:0 "Scotland, Wales and England have now got an industry which works for them. The people of all three states can now work in a fair working industry with a standard living wage without being exploited."
 ENG_The_Labour_Economy:0 "The Labour Economy"
 ENG_The_Labour_Economy_desc:0 "Labour have done it! Already the economy is showing signs of recovery, strong investment already has started here from all corners of the globe. Fair taxes, new modern education and happier workplaces has changed the country already and the people couldn’t be more prouder of the government they have elected."
 ENG_Increase_The_TUC_Power:0 "Increase The TUC Power"
 ENG_Increase_The_TUC_Power_desc:0 "Although jobs have been safe guarded and the people have now got a new national living wage there are still going to be moments in certain jobs where the people are exploited and pushed down. The TUC will ensure this is prevented and stand up for the working people knowing they have a strong union behind them."
 ENG_London_To_Scotland_Rail_Service:0 "London To Scotland Rail Service"
 ENG_London_To_Scotland_Rail_Service_desc:0 "Labour have announced plans to expand the aging rail service in the country by replacing the current trains with new modern trains which are faster and more energy efficient these are to be built in Middlesbrough at the Hitachi Rail factory already encouraging the “Built In Britain” slogan used in the election."
 ENG_A_Country_For_The_21st_Century:0 "A Country For The 21st Century"
 ENG_A_Country_For_The_21st_Century_desc:0 "Labour have been able to take control of the country and rebuild it, already the job market is flourishing, education is at an all time high. The health system has improved significantly and the people are genuinely  more happier and feel safer than they ever have done."
 ENG_The_SDP_Government:0 "The SDP Government"
 ENG_The_SDP_Government_desc:0 "The people have chosen to give the Social Democrats another chance under a new leader. The SDP prevented the collapse of the last democratic country in Europe to fall under communism and it seems the population have remembered this and still wish for the party to remain in solid control of the country!"
 ENG_The_Leadership_Election:0 "The Leadership Election"
 ENG_The_Leadership_Election_desc:0 "As Shirley Williams has stood down as leader the members of the SDP have now been given a choice on who they should vote for, with four main leaders to choose its time to pick who will govern the country?"
 ENG_Tony_Blair:0 "Tony Blair"
 ENG_Tony_Blair_desc:0 ""
 ENG_Amy_Callaghan:0 "Amy Callaghan"
 ENG_Amy_Callaghan_desc:0 ""
 ENG_Rishi_Sunak:0 "Rishi Sunak"
 ENG_Rishi_Sunak_desc:0 ""
 ENG_Neil_Carmichael:0 "Neil Carmichael"
 ENG_Neil_Carmichael_desc:0 ""
 ENG_The_Williams_Aftermath:0 "The Williams Aftermath"
 ENG_The_Williams_Aftermath_desc:0 "Shirley Williams had a very difficult time as leader of the party, as soon as she came into power, she had to deal with a terror attack, the rise of the Phoenix Front and the Queen trying to take over. Now its time for the new leader to take the party out of the dark shadows and rebuild the confidence back into the party."
 ENG_Prepare_The_Economy:0 "Prepare The Economy"
 ENG_Prepare_The_Economy_desc:0 "The economy has stagnated and it seems to be slowly going off a cliff edge. Before the country hits a recession its time to push the value of the pound back up and rebuild the confidence in the currency."
 ENG_The_Canadian_Investment:0 "The Canadian Investment"
 ENG_The_Canadian_Investment_desc:0 "Canada is the powerhouse of industry, many Americans left to go to Canada and since has become a strong country and stands tall on the world stage, its time to ask investors to set up shop here and help our economy before it tumbles."
 ENG_Lower_Business_Taxes:0 "Lower Business Taxes"
 ENG_Lower_Business_Taxes_desc:0 "With the request of investors to come to the rescue its time we attract more from other countries, by encouraging them with low taxes and easier ability to set up businesses here it would be perfect to get the economy growing again."
 ENG_Working_Together_For_The_Future:0 "Working Together For The Future"
 ENG_Working_Together_For_The_Future_desc:0 "Canada and the UK have both agreed to work together for the sake of their economies, with new companies now buying businesses and setting up investments for other companies while the UK in return offers low business taxes and more relaxed laws for those countries it seems the two have come together for the sake of democracy and money."
 ENG_Working_With_The_Irish:0 "Working With The Irish"
 ENG_Working_With_The_Irish_desc:0 "The British Isle Protection Union was not only set up for protect the nations but to allow work together, with both nations struggling economically its worth now working together to fix this problem and rebuild their economies."
 ENG_The_Anglo-Irish_Market:0 "The Anglo-Irish Market"
 ENG_The_Anglo-Irish_Market_desc:0 "The UK and Irish markets will now merge together to become a strong confident business sector which will now encourage  both uk and Irish business owners to set up business in both countries and due to lower taxes in both countries and grants giving to those wishing to create business this seems like a perfect idea to fix the money problem."
 ENG_The_Irish_Credit_Problem:0 "The Irish Credit Problem"
 ENG_The_Irish_Credit_Problem_desc:0 "The Irish economy is in a worse situation than the UK, as Ireland slowly enters a recession it needs help due to its big borrowing from the UK and Canada its struggling to pay it off. The UK has agreed to forget its debt if they are able to work closer together to fix the economies and restore confidence into businesses."
 ENG_A_Richer_Nation:0 "A Richer Nation"
 ENG_A_Richer_Nation_desc:0 "Now an agreement has been made with other countries, the UK economy has slowly started to see a positive bounce back, as the pound shows signs of strength and more jobs starting to open up the nation is starting to become rich again."
 ENG_The_Modern_Job_Promise:0 "The Modern Job Promise"
 ENG_The_Modern_Job_Promise_desc:0 "The SDP has made a promise they will start creating industries for the 21st century such as new technology hubs for I.T and engineering which will put Britain on the world stage showing other nations that this country is ready to provide their strong british manufacturing for their needs."
 ENG_Build_New_Business_Centers:0 "Build New Business Centers"
 ENG_Build_New_Business_Centers_desc:0 "Across the country new business parks are being created ready for the office workers of tomorrow, business from overseas are already buying plots of land ready to set up business hubs."
 ENG_A_Message_To_Wales_And_Scotland:0 "A Message To Wales And Scotland"
 ENG_A_Message_To_Wales_And_Scotland_desc:0 "its time to put differences aside and work together for the sake of the future of the union. The SDP will put its attention the to other states on the british isle and finally put some well-deserved money into those states."
 ENG_Funding_For_The_Two_Nations:0 "Funding For The Two Nations"
 ENG_Funding_For_The_Two_Nations_desc:0 "new budgets have been allocated for Wales and Scotland allowing industries to be set up and created as well as rebuilding the job industry."
 ENG_Invest_In_Welsh_Industry:0 "Invest In Welsh Industry"
 ENG_Invest_In_Welsh_Industry_desc:0 "Wales has been allocated a set amount budget to help rebuild its broken and run-down industry. For many years the Welsh have complained about being at a disadvantage against England until now."
 ENG_Scottish_Army_Factories:0 "Scottish Army Factories"
 ENG_Scottish_Army_Factories_desc:0 "Its time to rebuild our armed forces and make sure Scotland is not forgotten, the empty factories waiting to be kick started into action will be used to build tanks, jets and more for our armed forces."
 ENG_Update_The_Mines_And_Factories:0 "Update The Mines And Factories"
 ENG_Update_The_Mines_And_Factories_desc:0 "The factories and mines in our nation are outdated and lack the modern technology other key sectors use around the world. Now this backwards work stops and our workers will finally be given the modern edge tech needed to perform their jobs properly."
 ENG_SDP_Local_Governments:0 "SDP Local Governments"
 ENG_SDP_Local_Governments_desc:0 "The SDP will now establish local governments in Scotland and Wales as well as some northern parts of England. These governments will be used to allow the local regions to gain more control of their counties and states without feeling left out of the so called “London rule”"
 ENG_Rebuild_The_High_Streets:0 "Rebuild The High Streets"
 ENG_Rebuild_The_High_Streets_desc:0 "The high streets of Britain have been left deserted with many local businesses having to close due to lack of funding and not enough people wanting to shop, now our new leader has promised this will stop the high streets will return ready to support the locals."
 ENG_Create_The_NES:0 "Create The NES"
 ENG_Create_The_NES_desc:0 "The National Education System has been established under the education secretary. This will allow more schools to operate independently with higher budgets for students as well as cutting down on the number of private schools existing. As well as this, the system will introduce apprenticeship and better universities places for young adults."
 ENG_Modernise_Transport:0 "Modernise Transport"
 ENG_Modernise_Transport_desc:0 "The whole of network rail will be reformed and modernized; new trains will now operate on the lines going from London to Scotland with new features such as wi-fi and air condition as well as new buses which will be operated in all new electric systems."
 ENG_Build_The_Northern_Powerhouse:0 "Build The Northern Powerhouse"
 ENG_Build_The_Northern_Powerhouse_desc:0 "The north has always stood by that they are forgotten about and hardly any funding is given to them, now the government has created the northern powerhouse which will transform factories and industries up north ready for a technology revolution and increasing the jobs in those key sectors."
 ENG_Split_The_London_Bankers:0 "Split The London Bankers"
 ENG_Split_The_London_Bankers_desc:0 ""
 ENG_On_The_World_Stage:0 "On The World Stage"
 ENG_On_The_World_Stage_desc:0 "Britain is changing and is ready to move from an isolated nation to a nation ready to talk and act!"
 ENG_A_Show_Of_Force:0 "A Show Of Force"
 ENG_A_Show_Of_Force_desc:0 "The army is being rebuilt, new technology is being deployed ready to work alongside the soldiers. The royal navy is expanding and is showing their presence against other nations ready to show the nation is ready to defend or attack if the challenge is presented!"
 ENG_The_United_Nations_Meeting:0 "The United Nations Meeting"
 ENG_The_United_Nations_Meeting_desc:0 "Britain, in all her wise majesty will push to drastically reform the UN into something more competent. The idea that only the big nations carry power is antiquated and doesn’t give smaller nations a sense of equality. Britain’s reform will make sure nations like France and Germany have more of say than they have had. This is in an effort to make sure those nations do not collapse like the United States did, and if they’re near that then they will receive the help they need."
 ENG_Host_The_Olympics:0 "Host The Olympics"
 ENG_Host_The_Olympics_desc:0 "Britain has won the bid to host the next set of the Olympics, Wembley stadium will host the games and the world will watch as Britain gives the best performance of a lifetime!"
 ENG_Attract_More_Investors:0 "Attract More Investors"
 ENG_Attract_More_Investors_desc:0 "The nation is going well but it also needs more money therefore more investment. Its time to show investors from around the world what the real benefit of having british workers in their place does and how the country will be a price for them."
 ENG_Build_The_GigaPlant:0 "Build The Giagaplant"
 ENG_Build_The_GigaPlant_desc:0 "The world’s first giga plant will be established in the United Kingdom. Richard Branson has ordered the new super solar plant to be built in Liverpool and will be producing new battery cells for companies around the world as well as powering major key areas of the country."
 ENG_The_Green_SDP_Plan:0 "The Green SDP Plan"
 ENG_The_Green_SDP_Plan_desc:0 "The SDP are aware of the ever-changing climate that is causing huge problems in the planet. The party has met with other leaders from around the world to begin talks on how to prevent such a catastrophic event."
 ENG_Liberal_Democrat_Government:0 "Liberal Democrat Government"
 ENG_Liberal_Democrat_Government_desc:0 "The Liberal Democrats have been elected as the government to run the country. After over a decade of the SDP being in control of the country the people have chosen the liberal democrats to be the government who changes the course of the nation and the direction of what will take the United Kingdom through the 2010s."
 ENG_Speaking_To_The_West:0 "Speaking To The West"
 ENG_Speaking_To_The_West_desc:0 "Its time the country turns to the likes of Canada and the American Republic and discuss the future of the security of the world. The Soviets and the EU are a threat and they must be aware that the Uk is ready to protect their allies and friends."
 ENG_The_Protection_League_Question:0 "The Protection League Question"
 ENG_The_Protection_League_Question_desc:0 "Its time to decide whether the country and Ireland will accept that the world is changing and it is now time to expand and join the Democratic League or remain in an isolated state."
 ENG_Cleggs_Tariff_Agreement:0 "Cleggs Tariff Agreement"
 ENG_Cleggs_Tariff_Agreement_desc:0 "Nick Clegg has set out the plan for trade and economic policies with the nation and other countries, he wishes to reduce expensive tariffs between the democratic nations across the world allowing a more free trade policy allowing the nations to share their values together."
 ENG_American_Outlook:0 "American Outlook"
 ENG_American_Outlook_desc:0 "The American Republic is the remnants of what used to be the united states of American, its is the bastion of freedom and democracy and its time we reunite with our old friends there and begin talks to bring our countries together."
 ENG_A_British_Stock_Market:0 "A British Stock Market"
 ENG_A_British_Stock_Market_desc:0 "Its time to reopen the London stock market and move away from the isolated nation we are, our economy is failing and this is the chance we have to rebuild it. Investors from around the world can return back to our companies and restore the economic confidence needed."
 ENG_Global_Cyber_Security:0 "Global Cyber Security"
 ENG_Global_Cyber_Security_desc:0 "Last month the nation faced a serious cyberattack from Korea wiping out major I.T services for two whole days and causing major amounts of damage and costing companies millions. Now is the time to work with our oversea partners and develop new cyber security to prevent destructive nations from trying to destroy our democratic free nations."
 ENG_Protect_Democracy:0 "Protect Democracy"
 ENG_Protect_Democracy_desc:0 "Democracy is the most important right in this big scary world where dictators rise and democracies fall. Working together with other democratic nations will ensure that the democratic voice of all those people in our free nations are heard and free those nations which are under an iron fist."
 ENG_Open_The_Doors_To_Freedom:0 "Open The Doors To Freedom"
 ENG_Open_The_Doors_To_Freedom_desc:0 "Its time to finally let our people have the freedom they deserve, starting from tomorrow all members form the democratic league countries will have free travel agreements with the United Kingdom allowing them to freely travel from one league nation to another embracing freedom and taking sweet advantage of it."
 ENG_The_Canadian_Agreement:0 "The Canadian Agreement"
 ENG_The_Canadian_Agreement_desc:0 "Canada and the UK have finally finished the agreement process for a new trade agreement, freedom to travel and a defence pact working together to fight off the evil in the world."
 ENG_A_Full_American_British_Dream:0 "A Full American British Dream"
 ENG_A_Full_American_British_Dream_desc:0 "The United Kingdom and United State Of America were once great friends fighting alongside each other and working together, after the collapse many believed this relationship could never return. Until now, it seems both nations have agreed that they will rebuild the old days and unite together."
 ENG_The_Democratic_Rights_Of_Nations:0 "The Democratic Rights Of Nations"
 ENG_The_Democratic_Rights_Of_Nations_desc:0 "Every nation deserves to have the right to say what they feel and speak how they want as this is the people’s democratic freedom! We must ensure that every nation on this planet is given the freedom they deserve to speak out against their leaders and demand change!"
 ENG_Conservative_Economics:0 "Conservative Economics"
 ENG_Conservative_Economics_desc:0 "The Liberal Democrats believe that working with businesses and private owners allows the people the right to own their own business and give freedom to individuals. Using conservative economic strategy towards businesses and private ventures gives the people the trust they can own what they want."
 ENG_Left_Social_Reforms:0 "Left Social Reforms"
 ENG_Left_Social_Reforms_desc:0 "The left has the right idea to solve social issues, for example the NHS was created by the labour party as well as the living wage, this is proof the social ideals from the left can be used while we use conservative ideas for our economy."
 ENG_Lower_University_Tuition:0 "Lower University Tuition"
 ENG_Lower_University_Tuition_desc:0 "The students of today are paying ridiculous prices to education, many have suffered from this and are in great debt, its our job to lower this and make the students understand that they can pay a little for education and in return they will be benefited for the future."
 ENG_Equal_Rights_For_All_Bill:0 "Equal Rights For All Bill"
 ENG_Equal_Rights_For_All_Bill_desc:0 "The promise is every single member of our society will be treated the same as each other, racisms will not be tolerated and neither will attacks on the LGBT community, the new bill of rights will remove this judgement and ensure every human has their own rights."
 ENG_Remove_The_Job_Test:0 "Remove The Job Test"
 ENG_Remove_The_Job_Test_desc:0 "The Social Democrats created the job test as a way to test people on how well they will perform in future jobs and if they will be able to provide to that job correctly. This is a disgrace to what we call our democracy and will be removed allowing the people to have a chance to prove they can work in their own jobs."
 ENG_Social_Housing_Program:0 "Social Housing Program"
 ENG_Social_Housing_Program_desc:0 "The people of our nation need a house and living space, the SDP failed at the job market and building more houses for the people and only created housing for private ownership when people could not afford this. Now the LibDems are here we will build a house suitable for everyone as well as cheap enough for all!"
 ENG_Tighten_The_Unions:0 "Tighten The Unions"
 ENG_Tighten_The_Unions_desc:0 "Unions can be great for the average worker standing up for them and preventing them against exploitation, unfortunately they can also cause strikes which may disrupt our country. Therefore it is in our best interest to limit the work of unions and watch them closely."
 ENG_Agricultural_Reforms:0 "Agricultural Reforms"
 ENG_Agricultural_Reforms_desc:0 "Farms and agricultural sectors are to be brought into the 21st century finally. New grants given by the government will allow farmers to purchase new equipment to help the harvests and take care of farm animals as well as new standards giving out by the government for the farmers to ensure all food and livestock are cared for in the best standard way."
 ENG_AA_New_Benefits_System:0 "A New Benefits System"
 ENG_AA_New_Benefits_System_desc:0 "The benefits system is broken and needs to be fixed ASAP. The SDP have done absolutely nothing about this and seems to have forgot about those who are really in dire need of help while those who do not wish to work exploit the system created to help the those who really do need it."
 ENG_Rebuild_The_North:0 "Rebuild The North"
 ENG_Rebuild_The_North_desc:0 "The north has been mistreated by past governments and forgotten about, the liberal democrats will be the government who finally recognises this and will invest in the north of England. It will become a hub of technology and culture with vast art galleries and museums while investing on the power of technology and science. "
 ENG_Create_A_National_Railway_System:0 "Create A National Railway System"
 ENG_Create_A_National_Railway_System_desc:0 "A new rail service will be created for the whole of the united kingdom, this railway will stretch far and wide adapted for new modern trains which need new track to use the full service of speed that comes with them ensuring that waiting times are cut and comfort is a number one priority to our people."
 ENG_Less_Taxes_For_Businesses:0 "Less Taxes For Businesses"
 ENG_Less_Taxes_For_Businesses_desc:0 "One thing our businesses need is low taxes to grow and create jobs for our people. This will attract new business owners from overseas to come over and set up business here and invest in our economy while creating jobs and taking advantage of the low tax rates."
 ENG_A_Better_Deal_For_Businesses:0 "A Better Deal For Businesses"
 ENG_A_Better_Deal_For_Businesses_desc:0 "Local business owners will now receive grants from the government to rebuild their company or business and hire staff bringing the people back into work. Businesses will also be given grants to hire apprentices and university graduates to help the young get into work."
 ENG_Restart_The_Trade_Program:0 "Restart The Trade Program"
 ENG_Restart_The_Trade_Program_desc:0 "Countries like Brazil, Spain, Asia and more can offer much to the UK rather than just American and Canada. Opening up trade routes with those countries and experiencing new products as well as expanding our economy is a great way to rebuild our shrinking economy."
 ENG_Invest_In_Construction:0 "Invest In Construction"
 ENG_Invest_In_Construction_desc:0 "Its time to give grants to building contractors who can start to build more infrastructure for our country and build for businesses. No more will companies worry about running out of money to finish the job, with the new grants this covers the worry as well as getting people into work and more."
 ENG_Better_Northern_Oil_Refineries:0 "Better Northern Oil Refineries"
 ENG_Better_Northern_Oil_Refineries_desc:0 "The North including Scotland holds rich oil which can be used for trade and our own usage. Taking advantage of this will increase the value of our currency and attract more investors to come here and spend their money, its time to open the oil fields!"
 ENG_A_Green_Deal:0 "A Green Deal"
 ENG_A_Green_Deal_desc:0 "Nick Clegg promised to tackle the climate crisis going on in our country and he will now ensure this promise is kept, work has been started to create new renewable power stations and cutting CO2 levels in the country as well as opening up more to the green party and allowing some cross party work."
 ENG_Power_The_New_Turbines:0 "Power The New Turbines"
 ENG_Power_The_New_Turbines_desc:0 "Wind turbines have been built off the coast of beaches up and down the country ready to power towns and cities in this new green revolution. Although many conservatives have complained about the eye sore and pointlessness of it, it seems many are happy with the direction of the country being able to breathe again."
 ENG_A_Solar_Farm_In_Every_County:0 "A Solar Farm In Every Country"
 ENG_A_Solar_Farm_In_Every_County_desc:0 "Solar farms have been created across the nation ready to absorb the sun and create the energy needed. Already some towns have been moved onto solar energy while the government plans to cut CO2 emissions as soon as possible."
 ENG_Mine_The_Resources:0 "Mine The Resources"
 ENG_Mine_The_Resources_desc:0 "Coal is the best option to power our country, we are still isolated and trade deals have not yet been complete therefore we are still self-reliant on ourselves for power and other resources. Until then it would be best to stick with the old until we have a solid plan for the future."
 ENG_Welsh_Mining_Effciency:0 "Welsh Mining Effciency"
 ENG_Welsh_Mining_Effciency_desc:0 "The welsh know best when it comes to mining, we have given grants to mines to modernise the existing mines as well as create more but ensuring that the workers are given the best safety equipment’s  and produce the best coal with strong outputs for the country."
 ENG_The_North_And_Scottish_Oil_And_Gas:0 "The North And South Oil And Gas"
 ENG_The_North_And_Scottish_Oil_And_Gas_desc:0 "The North Sea and Scottish waters hold oil which is the treasure of the world. With this oil the country becomes a powerhouse and is a golden trading partner with other nations. Clegg has pledged that more oil refineries will be built in the seas while improving existing gas lines to our energy sources."
 ENG_The_Conservative_Government:0 "The Conservative Government"
 ENG_The_Conservative_Government_desc:0 "The Conservative Party has been elected as the government to run the country. After over a decade of the SDP being in control of the country the people have chosen the Tories to be the government who changes the course of the nation and the direction of what will take the United Kingdom through the 2010s."
 ENG_The_Public_Rights_Bill:0 "The Public Rights Bill"
 ENG_The_Public_Rights_Bill_desc:0 "The public rights bill ensures that every single british citizen will be given full access to the rights of this country such as the NHS, freedom of speech and expression of though, able to purchase land and buildings. Not to be exploited for who they are or where they work. This bill will make sure every person of this country is given the basic human rights they deserve."
 ENG_Tory_Britain_Forward:0 "Tory Britain Forward"
 ENG_Tory_Britain_Forward_desc:0 "The Conservative government have finally been voted into power and can now change the vision of Britain they have wanted by  rebuilding the conservative values back into the country and finally rebuilding the nation to a strong superpower they have always dreamed of."
 ENG_The_Budget:0 "The Budget"
 ENG_The_Budget_desc:0 "The economy is in bad shape to say the least and the SDP have let the pound freefall to unsafe levels, jobs are at risk and we are close to a recession. Its time the Tories finally use their conservative methods and fix the country the best way it can be and fix the broken economy."
 ENG_Invest_In_The_Military:0 "Invest In The Military"
 ENG_Invest_In_The_Military_desc:0 "The military is in dire need of investment and new technology can be used along side our military to defend out nation. The new investment will be used to built new tanks and jets alongside new guns and equipment for the soldiers ready to fight on the frontline."
 ENG_Clean_Up_The_Streets:0 "Clean Up The Streets"
 ENG_Clean_Up_The_Street_desc:0 "Its time to take those criminals that cause havoc on our streets away and make the streets safe again for people to walk on at night. For many years the streets have been getting more dangerous and now this must stop. A new reform by the Home Secretary will bring in harsher sentences and laws to those who cause trouble in public."
 ENG_New_Military_Training:0 "New Military Training"
 ENG_New_Military_Training_desc:0 "Our commonwealth friends and us have agreed that our troops will be sent overseas for new training combat such as in Jamaica and Australia, these types of training will be for jungle exercises or urban combat ready for any future conflict that could occur, then our loyal soldiers will be ready."
 ENG_Rebuild_Trident:0 "Rebuild Trident"
 ENG_Rebuild_Trident_desc:0 "Although nuclear war is never something any nation would want, we have to make sure that our enemies know we are armed and will use our weapons if it means we have to defend our island. Trident was disarmed back the early 90s, now its time to rebuild our nuclear submarines and bring back our defensive tactics."
 ENG_European_Protection:0 "European Protection"
 ENG_European_Protection_desc:0 "Our nation is on the shore of European and truth be told we are surprised we have not yet been attacked by them yet, but this does not mean we never will be therefore it is vital we are ready for any outbreak of war against the communists and can defend our nation due to the close proximity Europe is to us."
 ENG_Sell_Weapons_To_Ireland:0 "Sell Weapons To Ireland"
 ENG_Sell_Weapons_To_Ireland_desc:0 "Ireland is in a an alliance with us and works close together with us, its time to share our weapons not just our intelligence with them. We can sell our older weapons and technologies to the Irish giving them to chance to protect their nation rather than us protecting two nations at once."
 ENG_Self_Protected_Isle:0 "Self Protected Isle"
 ENG_Self_Protected_Isle_desc:0 "Although we maybe part of the British Isle Protection faction we also must be ready to protect ourselves in case Ireland decides they wish to become an isolated nation leaving us alone to face heavily armed nations. We once conquered the world and had a huge empire. We may not be able to rebuild the empire but by heck we can protect our nation."
 ENG_Zero_Tolerance:0 "Zero Tolerance"
 ENG_Zero_Tolerance_desc:0 "Our justice system is a joke if truth be told, many criminals are getting off with soft sentences and are reoffending. The home secretary has pledged to be tougher on crimes and make sure victims get the justice they deserve."
 ENG_The_Union_Cuts:0 "The Union Cuts"
 ENG_The_Union_Cuts_desc:0 "Unions are causing trouble with our new government, they have heard about our future plans for jobs and theyre not happy. They are proposing for many thousands across the country to strike and stand up against the conservatives. This is outrageous and needs to be stopped therefore cuts in the unions will be made to prevent the influence they have over the people."
 ENG_More_Power_To_The_Police:0 "More Power To The Police"
 ENG_More_Power_To_The_Police_desc:0 "As crime rises across the country so does the number of the police forces out there fighting the crime levels, it seems many offenders do not respect our officers and laugh at them. With new powers given to the authorities allowing them to be harsher on young offenders and criminals and investigate properly without the worry of breaking human rights this will surely break down the high crime levels."
 ENG_The_Conservative_Green_Plan:0 "The Conservative Green Plan"
 ENG_The_Conservative_Green_Plan_desc:0 "Even the conservative party knows climate change is a problem and something must be done to fight off the rising CO2 levels in the country. A new plan to limit fossil fuel usage and move towards a greener alternative is being looked at and ways to move towards a more electric greener method of transport is also being tested."
 ENG_More_Civil_Servants:0 "More Civil Servants"
 ENG_More_Civil_Servants_desc:0 "The likes of HMRC and DWP needs more civil servants to work within our government and serve the crown, those who work here will be making sure the country runs smoothly by working within the taxes and banks while others will build secure I.T services and technology which will ensure we are in line with he modern age."
 ENG_Old_Ways_Are_The_Best_Ways:0 "Old Ways Are The Best Way"
 ENG_Old_Ways_Are_The_Best_Ways_desc:0 "The conservative outlook is keeping to the status quo the best we can as well as ensuring we put our people and country first. The past governments have moved away from our traditional heritage, and we are no longer the old british people as we used to be, its time to put our old ways back and make our people proud of the country they live in."
 ENG_The_Conservative_Reform_Act:0 "The Conservative Reform Act"
 ENG_The_Conservative_Reform_Act_desc:0 "The country is broken, crime is high and the streets are unsafe. The military is outdated and needs to be prepared for a modern age against threats that could threaten our democracy while also having the military power to show we can defend our island whatever the cost maybe."
 ENG_Austerity_Plan:0 "Austerity Plan"
 ENG_Austerity_Plan_desc:0 "Due to much irresponsible excessive government spending the economy has crashed and its made life very difficult for thousands across the country, due to this a plan has been made. The cancellation of school building programs, reductions in local government funding, and an increase in VAT will help rebuild our economy while other projects and many services given to the public will have to be cut to rebuild our failing economy."
 ENG_Economic_Recovery:0 "Economic Recovery"
 ENG_Economic_Recovery_desc:0 "Now the vital programs have been cancelled we can now begin to plan the recovery of our country, yes it will be a difficult and hard time but we must pull together to get out of this great pain!"
 ENG_Cuts_In_The_NHS:0 "Cuts In The NHS"
 ENG_Cuts_In_The_NHS_desc:0 "The NHS is one of the most important programs in our country but it also takes billions out of our banks. Due to such a hardship in this country we will have to make cuts into some of the lower areas of the NHS and make cuts in staff wages until our economy grows again."
 ENG_Cut_Social_Security_Funding:0 "Cut Social Security Funding"
 ENG_Cut_Social_Security_Funding_desc:0 "Large amounts of money is giving away in social security, money which is needed to pay our debts back and rebuild our country. Cuts will be made into welfare and reducing the benefit payments will have to be made which should encourage those who are not working to find a job and help fix our credit problem."
 ENG_Improve_Building_Inspections:0 "Improve Building Inspections"
 ENG_Improve_Building_Inspections_desc:0 "As the years move on so do the older buildings in our country, they get weaker but yet are still housing many thousands of inhabitants. Those buildings could soon collapse, and we would face a catastrophic issue around our nation. We have ordered new plans to be created for all old buildings to be investigated and checked they are suitable for inhabitants around the nation."
 ENG_A_New_Job_Scheme:0 "A New Job Scheme"
 ENG_A_New_Job_Scheme_desc:0 "As the austerity measure kick in so do the job losses, it seems that companies are now unable to pay for staff and their own businesses. The conservative government will come up with a new ”Zero Hour Contract” system which will allow businesses to choose when and where their staff will work and if they are needed without being paid but remaining part of the business."
 ENG_Universal_credit_Program:0 "Universal Credit Program"
 ENG_Universal_credit_Program_desc:0 "Social security has been cut and its cause widespread problems the new tory government has introduced a new program which will fix this problem, the new universal credit system will improve the old benefit scheme and will ensure only those who really need the help will get it and those who are out of work will only be given what is needed."
 ENG_Remove_The_SDP_Programs:0 "Remove The SDP Programs"
 ENG_Remove_The_SDP_Programs_desc:0 "The SDP had many pointless programs which was costing the taxpayer highly. We can remove these pointless works such as culture centres and youth programs and use the money to put back into the economy to repair it."
 ENG_Conservative_Welfare:0 "Conservative Welfare"
 ENG_Conservative_Welfare_desc:0 "We are the conservative party but we do understand people do need help now and again, therefore the whole benefit system will be overhauled and ensure that those who are given benefits worked for the benefits previously."
 ENG_Invest_In_London:0 "Invest In London"
 ENG_Invest_In_London_desc:0 "London has been left to go on its own, as the previous governments tried to look at the rest of the nation they forgot about the business hub of the nation. Its time to return back to the capital and bring the investors back!"
 ENG_Attract_Big_Investors:0 "Attract Big Investors"
 ENG_Attract_Big_Investors_desc:0 "Now we are investing in the capital we can bring our investors back to invest in businesses and the capital and give bring the jobs back to the office workers!"
 ENG_Expand_The_Market:0 "Expand The Market"
 ENG_Expand_The_Market_desc:0 "The SDP pushed our nation to become isolated and alone which helped cause the economy to crash due to lack of investment from oversea. Now tis time to reopen those closed markets and bring back our oversea friends."
 ENG_Midlands_Weapon_Factories:0 "Midlands Weapon Factories"
 ENG_Midlands_Weapon_Factories_desc:0 "The midlands have always been famous for its industry and factory work, with the rebuilding of our armed forces its now time to reopen those shut down forgotten factories and rebuild our armed forces."
 ENG_The_Northern_Technology_Program:0 "The Northern Technology Program"
 ENG_The_Northern_Technology_Program_desc:0 "The north has been given a new budget to become a technology hub producing electric cars, new electronic products and help take the country out of the 20th century and into the 21st to compete with the likes of Canada and Australia in the technology race."
 ENG_National_Infrastructure_Programs:0 "National Infrastructure Programs"
 ENG_National_Infrastructure_Programs_desc:0 "The conservatives have pledged to rebuild infrastructure across the nation such as new radio masts and faster internet for the people to push an edge of technology as well as expanding roads and motorways, increasing rail services and more."
 ENG_Subside_Small_Businesses:0 "Subside Small Businesses"
 ENG_Subside_Small_Businesses_desc:0 "Local businesses have struggled for years as large supermarket chains have taken over and replaced what the local shops produced to customers. Now the Tories have given business grants to those businesses to help make a comeback and help rebuild the shrunken economy."
 ENG_Tax_Breaks_For_Oversea_Investors:0 "Tax Breaks For Oversea Investors"
 ENG_Tax_Breaks_For_Oversea_Investors_desc:0 "The one thing this country really needs at this moment in time is money and investment, the investors are the ones who can make their businesses grow here and create jobs and help rebuild our economy, therefore low taxes for those oversea will be attractive and beneficial for both parties."
 ENG_Oversea_Trade_Programs:0 "Oversea Trade Programs"
 ENG_Oversea_Trade_Programs_desc:0 "The Conservative leader has met with other leaders from, overseas, the likes of Canada, Australia the American republic and many more nations which will rebuild our trading programs and make them grow while we export we can also import new goods from overseas."
 ENG_Reduce_The_Tariffs:0 "Reduce The Tariffs"
 ENG_Reduce_The_Tariffs_desc:0 "Now we have a trading program we need to ensure the prices do not rise as our people struggle to pay for already existing services here. Reducing the tariffs from oversea exports and imports will ensure product prises do not rise here and we have a fair free trading program from our nation to others."
 ENG_Oversea_Building_Projects:0 "Oversea Building Projects"
 ENG_Oversea_Building_Projects_desc:0 "While we get investors to come here we can also ask our own british investors to look overseas and expand overseas."
 ENG_Increase_The_Value_Of_The_Pound:0 "Increase The Value Of The Pound"
 ENG_Increase_The_Value_Of_The_Pound_desc:0 "As our economy starts to make a strong comeback we can already see the value of the pound is increasing with shop prices finally starting to fall, the housing market slowly recovering and relations overseas increasing. It seems the conservative party has been able to once again come in and save the day."
 ENG_A_New_Party_A_New_Britain:0 "A New Party For Britain"
 ENG_A_New_Party_A_New_Britain_desc:0 "Now Jeremy Corbyn has been removed from power, the congress will meet and choose who should take control of the country."
 ENG_Workers_Party_Elected:0 "Workers Party Elected"
 ENG_Workers_Party_Elected_desc:0 "George Galloways party “The Workers Party of Britain” has been elected as the party to take control of the nation and lead it to a new age of leftist vision. Galloway has promised “Change and hope” for the future."
 ENG_Secure_The_Nation:0 "Secure The Nation"
 ENG_Secure_The_Nation_desc:0 "Now Galloway has control of the republic he can now start his reforms and implement new laws to match his vision for himself and the party, as well as removing anyone who will stand in his way."
 ENG_Form_The_Congress:0 "Form The Congress"
 ENG_Form_The_Congress_desc:0 "The current “congress” was labelled under Corbyn and still sits within the houses of commons. This must be changed, now the congress will meet in a speciality-built building and discuss future plans for the nation. The leaders of the country will incorporate the TUC within government and work with the whole congress together."
 ENG_The_First_TUC_Congress:0 "The First TUC Congress"
 ENG_The_First_TUC_Congress_desc:0 "Galloway has ordered the first meeting of the TUC congress to discuss the future of the republic."
 ENG_The_Three_Nation_Plan:0 "The Three Nation Plan"
 ENG_The_Three_Nation_Plan_desc:0 "Each corner of the republic will no longer be separated under London rule. Scotland, England, and Wales will now be finally recognised, and their struggles looked at separately. Wales economy will be transformed, industry will be rebuilt in England and Scotland will finally have their nation restored."
 ENG_English_Industry:0 "English Industry"
 ENG_English_Industry_desc:0 "English industry will now be rebuilt, old closed down factories will be reopened ready for a modern age with new modern equipment ready to produce resources for the people of the republic!"
 ENG_The_Peoples_Protection_Act:0 "The Peoples Protection Act"
 ENG_The_Peoples_Protection_Act_desc:0 "The people of this republic must be protected in work and not exploited which is why the congress has now passed a law which ensures all people of the republic will be treated at the highest level at work and the unions will take their highest levels protect the people."
 ENG_The_A_New_Socialist_Business_Hub:0 "A New Socialists Business Hub"
 ENG_The_A_New_Socialist_Business_Hub_desc:0 "Its time for the industry and economy in Britain to be rebuilt which is why congress has now passed a new law to create new business hubs which match the socialist ideals ready for a modern age of work."
 ENG_The_National_Corporate_Support_Bill:0 "The National Corporate Support Bill"
 ENG_The_National_Corporate_Support_Bill_desc:0 "Capitalism is dirt and must be removed from our nation but we also know that some areas of capitalism can help such as businesses hiring people and building our economy which is why a new bill will be discussed to support businesses under a socialist ideology."
 ENG_Modern_Factories_And_Farms:0 "Modern Factories And Farms"
 ENG_Modern_Factories_And_Farms_desc:0 "Farms are going to be remodelled and rebuilt in a new modern standard which can mass produce for the people of the republic with new technology and machines."
 ENG_Dismantle_Private_Ownership:0 "Dismantle Private Ownership"
 ENG_Dismantle_Private_Ownership_desc:0 "All private ownership of business and land will now be removed and given to the people. No more will the people be prevented from their freedoms they shall be given it all as they deserve."
 ENG_A_New_England:0 "A New England"
 ENG_A_New_England_desc:0 "England is now ready for a modern socialist age which can adapt to any changes that may go on in the world."
 ENG_Welsh_Economy:0 "Welsh Economy"
 ENG_Welsh_Economy_desc:0 "The economy in Wales has suffered for many years and with lack of funding from previous administrations the state has been left to suffer. Now under a new republican congress the state will finally be given the attention they need."
 ENG_New_Technology_Centers:0 "New Technology Centers"
 ENG_New_Technology_Centers_desc:0 "Wales will become the technology hub of the republic building new technology and innovation ready to change the lives of our people readying them for the modern age as well as rebuilding the economy and jobs."
 ENG_A_Welsh_Job_Market:0 "A Welsh Job Market"
 ENG_A_Welsh_Job_Market_desc:0 "Unemployment is high in Wales, and this must be fixed. New jobs will be created through technology jobs and industry jobs. Chairman Galloway has promised the people of Wales will no longer struggling finding a job."
 ENG_A_Modern_Industry:0 "A Modern Industry"
 ENG_A_Modern_Industry_desc:0 "Industry in Wales is in crisis and awful condition. All factories, ports and mines will be reopened and ready for a modern age with strong safety standards. Manufacturing and producing will take Wales into a new age of readiness."
 ENG_Embrace_Welsh_Workers:0 "Embrace Welsh Workers"
 ENG_Embrace_Welsh_Workers_desc:0 "Welsh workers have been forgotten about and laid off work. Now they will return to work by the hundreds ready to pump the economy back up into Wales and be given the best benefits and treatment they can be given."
 ENG_A_Welsh_Revolution:0 "A Welsh Revolution"
 ENG_A_Welsh_Revolution_desc:0 "Wales has been revolutionised under the Chairman and is now ready to help produce for the republic and build the nation back up onto the world stage."
 ENG_A_Miners_Act:0 "A Miners Act"
 ENG_A_Miners_Act_desc:0 "Mining is the main source of the economy of Wales, resources being produced helps the whole republic. Now its time the miners of Wales are given one the highest-ranking job titles in the Welsh state and work within the TUC as well as creating the congress of Wales."
 ENG_Scottish_Plans:0 "Scottish Plans"
 ENG_Scottish_Plans_desc:0 "Scotland is in an awful state and needs major work fast to save the failing state. Chairman Galloway has promised he will do everything he can to rebuild the state of Scotland."
 ENG_Fix_The_Drug_Problem:0 "Fix The Drug Problem"
 ENG_Fix_The_Drug_Problem_desc:0 "Scotland has a big drug problem due to its high unemployment. Creating new treatment centres and helping those getting back into lines of work will reduce the drug usage as well as removing a bad stigma of Scotland from the republic."
 ENG_More_Social_Housing:0 "More Social Housing"
 ENG_More_Social_Housing_desc:0 "New housing will be built in Scotland. New modern state housing will be built ready to house the homeless and those who are in desperate need of housing."
 ENG_Remove_The_Scottish_NHS:0 "Remove The Scottish NHS"
 ENG_Remove_The_Scottish_NHS_desc:0 "For some reason Scotland uses the NHS but the “Scottish NHS” which is strange? We have removed this and they will use the national health service like the rest of the republic will."
 ENG_Remodel_The_Scottish_Education:0 "Remodel The Scottish Education"
 ENG_Remodel_The_Scottish_Education_desc:0 "Education in Scotland will be heavily invested in and they will now be taught not only Scottish history but how socialism and the republic will help the people and their own future."
 ENG_Purge_The_ALBA_Party:0 "Purge The ALBA Party"
 ENG_Purge_The_ALBA_Party_desc:0 "ALBA is a national conservative party and promotes independence from England. They must all be removed from power by whatever means possible. Alex Salmond is causing trouble for the congress and his platform of power will be taken away."
 ENG_Scotland_Under_The_Red_Flag:0 "Scotland Under The Red Flag"
 ENG_Scotland_Under_The_Red_Flag_desc:0 "Scotland will now fly the republican flag and will no longer fly the Scottish flag. Scottish nationalism is a curse and could cause problems in future. Now the state will fly the red flag over Edinburgh castle."
 ENG_Splendid_Isolation:0 "Splendid Isolation"
 ENG_Splendid_Isolation_desc:0 "Isolation is the best policy to fully focus on the republic and ensure the people are given the best future as well as focusing on the levelling up of the republic."
 ENG_Feeding_The_Nation:0 "Feeding The Nation"
 ENG_Feeding_The_Nation_desc:0 "Our people grow hungry wanting food to be back on the shelves in supermarkets. With the lack of trade in the past few years and Corbyn failing to act upon increasing relations with other countries its time we focus on our own produce and feed the people."
 ENG_Provide_For_The_People:0 "Provide For The People"
 ENG_Provide_For_The_People_desc:0 "The new manufacturing industry will be able to become a self-sufficient industry which will give food and resources back to the people, no more shall our people grow hungry and weak wanting more. Now the republic will finally be able to provide for them."
 ENG_A_New_Republic_Tradition:0 "A New Republic Tradition"
 ENG_A_New_Republic_Tradition_desc:0 "With the new congress now in power and the establishment of the left. We will now celebrate our nation becoming a republic and removing the dirty capitalists out from our country, a true republican national holiday!"
 ENG_War_On_Poverty:0 "War On Poverty"
 ENG_War_On_Poverty_desc:0 "Unfortunately, even after the success of the left win in the previous election we are still facing problems with poverty. Its time we finally help the poor and weak and attack those who are still pushing families into poverty."
 ENG_Remove_Private_Housing:0 "Remove Private Housing"
 ENG_Remove_Private_Housing_desc:0 "One of the first things we must do is remove all private ownership of housing and keep house prices down so everyone can afford a place to live. Landlords will be banned, and all housing will fall under state housing."
 ENG_Nationalise_All_Flats:0 "Nationalise All Flats"
 ENG_Nationalise_All_Flats_desc:0 "Landlords are to be banned and all flats will fall under state ownership. Low prices or free to those who really need a place to live will be given to the poor and desperate. No more will our people worry about not being able to afford a place to live."
 ENG_Increase_Welfare_Payments:0 "Increase Welfare Payments"
 ENG_Increase_Welfare_Payments_desc:0 "Its time to completely reform the welfare state, better and fairer pay-outs will be given to those who need benefits, this will allow the people of the welfare state to no longer have to worry if they are able to afford food and bills. Now they can live worry free thanks to Chairman Galloway"
 ENG_Local_Unions:0 "Local Unions"
 ENG_Local_Unions_desc:0 "The TUC may have been absorbed into the congress, but we must also make sure those workplaces in the rural areas have union representatives there to stand up for them."
 ENG_Redistribute_The_Rich:0 "Redistribute The Rich"
 ENG_Redistribute_The_Rich_desc:0 "We still have the powerful and elite in this country hording their wealth and trying to stand out amongst the rest of the people. This will now be stopped and all of their wealth will be redistributed among the population to make this a fair and equal republic for all!"
 ENG_A_Workers_Paradise:0 "A Workers Paradise"
 ENG_A_Workers_Paradise_desc:0 "We have now established our place in the world. We have removed the homeless and given them homes and food in their stomachs. We have given the weak and poor what they need to get back onto their feet and we have made this nation a free and fair, equal land for all."
 ENG_Meet_With_The_EU:0 "Meet With The EU"
 ENG_Meet_With_The_EU_desc:0 "Although Chairman Galloway despises the cursed EU it would make sense to work with them for the future of the nation to prevent the collapse of the republic in its early days as well as having a strong trading partner who we can work with for the sake of our people."
 ENG_The_Trade_Deal:0 "The Trade Deal"
 ENG_The_Trade_Deal_desc:0 "One of the first actions we must do with the EU is negotiate a trade deal. Something which will be fair and give our people a taste of European goods as well as sending british goods to the communist nations of Europe."
 ENG_Open_Doors:0 "Open Doors"
 ENG_Open_Doors_desc:0 "One of the laws of becoming a member of the EU is an open-door policy. Many of our citizens may be against this but it also gives our people the opportunity to work over seas and promotes Galloways promise of freedom and fairness to all."
 ENG_A_British_Marshall_Plan:0 "A British Marshall Plan"
 ENG_A_British_Marshall_Plan_desc:0 "Its time the republic finally gets the treatment it deserves along with other countries. As the republic starts to become the powerhouse of Europe with its new strong industry its time to help countries like France and Poland out with their economy and work by giving them grants and loans to rebuild their industry and offer to buy areas of work to prevent their state owned businesses from failing."
 ENG_Work_With_Germany:0 "Work With Germany"
 ENG_Work_With_Germany_desc:0 "Germany is the powerhouse of Europe and along with Britain the two juggernauts could work together increasing production in the EU, duel cooperation on many things such as building military works, manufacturing of cars and other industrial products."
 ENG_Fight_The_Nationalists:0 "Fight The Nationalists"
 ENG_Fight_The_Nationalists_desc:0 "It seems there are still those in the Germany who promote the old nationalist Kaiser and his rule as well as those in this country who wish for the return of our royal family. With Germany and Britain working together, its time to unite and remove the nationalists once and for all."
 ENG_Support_The_Left_Government:0 "Support The Left Goverment"
 ENG_Support_The_Left_Government_desc:0 "Although the Germany government is communist and ours is revolutionary socialist, we have some similar ideals, if we are able to meet together and discuss the future of our countries working together and promote our leaders then our nations will remain in a stable place while others may fall around us."
 ENG_The_Leaders_Meeting:0 "The Leaders Meeting"
 ENG_The_Leaders_Meeting_desc:0 "George Galloway has meet with the chairman with the German leader to discus items such as trade, working together and even some talks of military unity. They both believe that the two powerhouses of Europe could become a match against the democratic league and the factions of the US if they can work together."
 ENG_Germany_And_Britian_United:0 "Germany And Britain United"
 ENG_Germany_And_Britian_United_desc:0 "Germany and Britain have signed an agreement which will enable them both to help each other out in the future such as increasing trade to a point where it will become a free trade agreement with the EU as well as promoting both parties in each other countries to show the strength of the workers party and the German communist party."
 ENG_The_French_Economic_Plan:0 "The French Economic Plan"
 ENG_The_French_Economic_Plan_desc:0 "France is in a terrible state, its prone to protests and riots as well as many trying to take over the country, now Galloway has ordered emergency talks with the likes of Melenchon and Fabien to discuss ways the republic can help France and what it can do to prevent the collapse of the doorway to the republic."
 ENG_Loan_The_French:0 "Loan The French"
 ENG_Loan_The_French_desc:0 "Galloway has pledged to loan the French over three billion pounds towards the French industry to help rebuild the factories and open them so the French can return back to work. He has also hoped the money will go towards housing and support for the French people. "
 ENG_Shared_Businesses:0 "Shared Businesses"
 ENG_Shared_Businesses_desc:0 "Britain and the French administrations will now take part ownership of some manufacturing complexes in the state to prevent the complete collapse of the industry sector of France. This will allow many French to feel better in a safe job as well as money coming in overseas to the republic."
 ENG_Supply_And_Confidence:0 "Supply And Confidence"
 ENG_Supply_And_Confidence_desc:0 "Chairman Galloway and the French leader have agreed they will now use supply and confidence in the future for laws and legislations. Both will support each other’s governments providing they will work together in supporting new operations in the two countries such as building modern industry areas such as technology hubs and science centres."
 ENG_A_New_Friendship:0 "A New Friendship"
 ENG_A_New_Friendship_desc:0 "With the new legal documents now set into law, the two countries can finally begin a new decade of friendship supporting each other and ensuring the population of their nations can finally live happily without sorry and stress as well as more allies in the future for the nations."
 ENG_Italian_Cooperative:0 "Italian Cooperative"
 ENG_Italian_Cooperative_desc:0 "Italy has reached out to Britain asking for support in regards to the refugee crisis and support for their nations as the Italian administration slowly starts to fail and the people increasingly becoming unhappy."
 ENG_The_Communist_Support:0 "The Communist Support"
 ENG_The_Communist_Support_desc:0 "Chairman Galloway has visited Italy and met with large crowds as he asks for the people to support their government against the capitalists who are trying to infiltrate their people’s party."
 ENG_British_Aid:0 "British Aid"
 ENG_British_Aid_desc:0 "Britain will send aid to Italy in response to the problems the nation is facing due to lack of food and poverty increasing due to the current administration failing to acknowledge the problems early on forcing the people to get poorer."
 ENG_The_British_Recovery_Program:0 "The British Recovery Program"
 ENG_The_British_Recovery_Program_desc:0 "Just like France, Britain will offer Italy ways to combat the poverty and poor that is increasing in the nation, more social housing projects are to be created along with many other plans to rebuild the economy and overall happiness in the nation."
 ENG_A_New_Trading_Program:0 "A New Trading Program"
 ENG_A_New_Trading_Program_desc:0 "Italy and Britain will now come to a new trading agreement allowing a free trade agreement to be put into law which allows no more tariffs placed on the nations and products from Italy and the Republic of Britain to be put into supermarket shelves allowing the people to buy cheap goods from the two nations."
 ENG_Loan_Italy:0 "Loan Italy"
 ENG_Loan_Italy_desc:0 "Italy still has not overcome the aid we have sent them therefore will have now offered loans to be given to the country which should now allow them to build the housing they need as well as support for the refugee problem on-going in the nation."
 ENG_Refugee_Crisis:0 "Refugee Crisis"
 ENG_Refugee_Crisis_desc:0 "Refugees have flooded into the Italian nation and the whole EU is struggling to deal with this. Its time Britain steps in and saves the day again."
 ENG_Open_The_Doors:0 "Open The Doors"
 ENG_Open_The_Doors_desc:0 "The EU policy of open doors allowing any EU citizen to walk through borders freely works in some ways but is cursed in others which is why Galloway refuses to implement this. Now due to the refugee crisis it seems that the door policy must also come into effect here and allow the people to make a new life under the republican flag."
 ENG_Britain_And_The_EU_Plan:0 "Britain And The EU Plan"
 ENG_Britain_And_The_EU_Plan_desc:0 "Chairman Galloway has sat down with the leaders from the EU to discuss future plans between the nations. He has finally accepted its time to move with the times and join the European Union and help overcome problems between the European nations."
 ENG_The_EU_And_The_British_Law:0 "The EU And The British Law"
 ENG_The_EU_And_The_British_Law_desc:0 "Although british law will still be our main law, we must now accept the laws and legal systems from Europe as we slowly progress into a new member of the European Union."
 ENG_New_Housing_Support:0 "New Housing Support"
 ENG_New_Housing_Support_desc:0 "As refugees arrive into our republic they look for places to stay which is why we have now drafted a new housing support system for those in desperate need of a place to live and shows the rest of the EU what real leadership is."
 ENG_Create_A_Job_Market:0 "Create A Job Market"
 ENG_Create_A_Job_Market_desc:0 "As refugees and European citizens arrive into the republic they look for work and where they can go for this. Our new job market for oversea workers will now be given a new market which will allow them to choose from jobs around the republic."
 ENG_Look_To_Ireland:0 "Look To Ireland"
 ENG_Look_To_Ireland_desc:0 "During the rise of the left and the power struggle it seems the Irish chose to leave us and go into a type of isolated state. We must not forget our Celtic brothers and reach our to them again for future relation building and showing them what our congress can offer them compared to previous governments."
 ENG_Form_A_Coalition:0 "Form A Coalition"
 ENG_Form_A_Coalition_desc:0 "The BNP and Britain First have very similar goals, to put the british people first and put pride back into Britain. Therefore due to such close results in the election, both parties have agreed to work together and form a coalition and create a government which will strength the british identity and finally put the british people first."
 ENG_Dismantling_The_Repressive_State:0 "Dismantle The Repressive State"
 ENG_Dismantling_The_Repressive_State_desc:0 "The past governments of the SDP, conservatives and Labour have caused nothing but problems, it pushed our british people to the side and focused on the foreign bunch coming in and taking everything. Its time to dismantle the whole system and rebuild it properly by a government who actually cares about its own people!"
 ENG_Prevent_The_Extinction_Of_British_People:0 "Prevent The Extinction Of British People"
 ENG_Prevent_The_Extinction_Of_British_People_desc:0 "The non british will soon out populate the rest of the pure british race and that cannot be allowed to happen. We must ensure out blood remains pure and programs are created to limit the others and help extend the british blood line."
 ENG_Deport_All_Illegal_Immigrants:0 "Deport All Illegal Immigrants"
 ENG_Deport_All_Illegal_Immigrants_desc:0 "Illegal Immigrants who arrive here are allowed to stay under certain conditions which makes us look weak and promotes others to come here. Now is the time to say no and finally put our foot down. Any undocumented person who arrives here or currently resides here will be removed from our shores and pushed back to their country of origin."
 ENG_Ban_The_Burqa:0 "Ban The Burqa"
 ENG_Ban_The_Burqa_desc:0 "Motorbike riders have to remove their helmets when entering certain places so why can’t those who wear the burqa?? How can we identify those people who we speak to especially in very important situations by face if we cannot see them? Its time to finally ban the burqa and allow woman to be free from being trapped."
 ENG_Our_Old_Empire_Days:0 "Our Old Empire Days"
 ENG_Our_Old_Empire_Days_desc:0 "Ah the british empire, our golden days! Its time to remember our history and ensure that we always remember what made the british great and do our best to restore our heritage as well as become a strong nation who will attack anyone who poses a threat to us."
 ENG_Meeting_The_Queen:0 "Meeting The Queen"
 ENG_Meeting_The_Queen_desc:0 "Its time we meet the queen and explain to her what we wish to do with the future of our nation. Both the BNP and British First highly respect our monarch and will always follow her."
 ENG_Arm_The_Falklands:0 "Arm The Falklands"
 ENG_Arm_The_Falklands_desc:0 "The Falkland Island are always under threat, and we must make sure Argentina do not take advantage of our turbulent past. Now its time to set up military bases on the small islands and protect our british people there!"
 ENG_Lessons_Of_The_Past:0 "Lessons Of The Past"
 ENG_Lessons_Of_The_Past_desc:0 "World War One and World War Two showed the world why the british are the strongest and most mightiest race in the world but also we must also learn from past mistakes that could of cost us the war. The broken SDP, fake capitalists of Conservatives and disgusting leftist labour party have made our nation weak. We must learn to never return back to these old ways."
 ENG_Cult_Of_Royalty:0 "Cult Of Royalty"
 ENG_Cult_Of_Royalty_desc:0 "Royalty is what makes our nation great and our royal family must always be respected and valued no matter what. We will work together with royalty to rebuild our great nation and create a new system which the monarchy has a greater role in this country."
 ENG_Fascist_And_Royal_Power:0 "Fascists And Royal Power"
 ENG_Fascist_And_Royal_Power_desc:0 "The royals have agreed to work with our government, let us begin our united goal of making the united kingdom of great Britain a nation for all our pure blooded brits and stand on the world stage tall and proud."
 ENG_Remove_The_Liberals:0 "Remove The Liberals"
 ENG_Remove_The_Liberals_desc:0 "The liberals are standing in our way, its time to ban the liberal democrats, SDP and any other centrist party which wishes to get in the way of our goals and betray the british people!"
 ENG_Destory_The_Left:0 "Destory The Left"
 ENG_Destory_The_Left_desc:0 "The left are disgusting traitors who stand against the british people and wish to rewrite our history. The likes of Jeremy Corbyn and Tony Benn are to be arrested and their platforms of power dismantled. Anyone who calls themselves a socialist or social democrat will be arrested instantly."
 ENG_Plan_To_Rebuild_The_Empire:0 "Plan To Rebuild The Empire"
 ENG_Plan_To_Rebuild_The_Empire_desc:0 "Our nation was great having nations under us, we showed the world we meant business and our power was unlimited. Taking back some of our former nations will show the world Britain no longer stands in an isolated path."
 ENG_Claim_Normandy_And_Brittany:0 "Claim Normandy And Brittany"
 ENG_Claim_Normandy_And_Brittany_desc:0 "Normandy and Brittany were part of our nation many hundreds of years ago and belong to us. Its time to retake our former lands and expand our living space."
 ENG_Expand_The_Empire:0 "Expand The Empire"
 ENG_Expand_The_Empire_desc:0 "The empire must be rebuilt and we must spread our british influence to other nations. Its time for british empire two."
 ENG_Change_The_Flag:0 "Change The Flag"
 ENG_Change_The_Flag_desc:0 "The flag is great but our nation is under a new system and government, something which will be historic and remembered, lets change the flag and our nation."
 ENG_Meet_With_New_Zealand2:0 "Meet With New Zealand"
 ENG_Meet_With_New_Zealand2_desc:0 "New Zealand nationalist government fits perfectly with ours, if we can work together and form a new relationship our militaries and power could be something which forms a powerful alliance and withstand any nation that poses a threat to us!"
 ENG_Meet_With_Spain:0 "Meet With Spain"
 ENG_Meet_With_Spain_desc:0 "Spain holds royal blood like our nation does, working with another European partner we can strike a knife into Europe pushing pressure on the communist states and prevent any other nations in our European zone from falling to the reds."
 ENG_A_Royal_National_Fascist_Alliance:0 "A Royal National Fascist Alliance"
 ENG_A_Royal_National_Fascist_Alliance_desc:0 "Now we have built a relationship with Spain and New Zealand its time we create a new alliance and work together for the sake of all our people and nations."
 ENG_Influence_Other_Nations:0 "Influence Other Nations"
 ENG_Influence_Other_Nations_desc:0 "With our power and friends its time to spread our ideology around the world and finally push Europe over the edge and create protests and movements spreading their nations nationalist views and finally bring down their disgusting leftist ideology."
 ENG_Rebuild_The_British_Isle:0 "Rebuild The British Isle"
 ENG_Rebuild_The_British_Isle_desc:0 "The SDP corrupted our system and laws, the criminals were able to take advantage of the turbulent system and our old british ways were pushed to the side to allow the foreign influence sink into our isle and poison it."
 ENG_Reform_The_Police:0 "Reform The Police"
 ENG_Reform_The_Police_desc:0 "The police force do not have much power these days, many young offenders are no longer scared of our justice system while criminal gangs stay at large. Its time to rebuild our police force and make them a power people fear."
 ENG_Mosleys_Black_Shirts:0 "Mosleys Black Shirts"
 ENG_Mosleys_Black_Shirts_desc:0 "Oswald Mosley’s  black shirts enforced the law and discipline into the people. The police force will now be remodelled into the black shirts and be presented with a more stronger influence with new uniforms to present themselves and be an outstanding model."
 ENG_Rigged_Elections:0 "Rigged Elections"
 ENG_Rigged_Elections_desc:0 "Our new system must survive, if the SDP or any other party wins future elections they will remove our influence and change and this cannot be allowed. We must influence any future election and ensure our governments always remain in power for the sake of our people."
 ENG_British_Educuation:0 "British Education"
 ENG_British_Educuation_desc:0 "Our young learn about disgusting liberal material which infects the young children’s mind. Now is the time for the young to be proud of our nation singing our national anthems at the start of school days and to learn about our empire days and how it helped other nations in the likes of Africa to become a developed nation and accept how the white man was the one who made this world a fairer place."
 ENG_Introduce_Competitive_Sports:0 "Introduce Competitive Sports"
 ENG_Introduce_Competitive_Sports_desc:0 "The young are our future and we must make sure they are fit and ready for the future of our nation. Pure blooded british children we be put into sporting camps and trained to become a model which will be an envy to other nations. Fit and ready to compete and win."
 ENG_The_New_Housing_Market:0 "The New Housing Market"
 ENG_The_New_Housing_Market_desc:0 "The housing market was left in are terrible state. Now with our british government we can now remove all the foreigners from their homes and house the homelessness and soldiers who have fought for our country."
 ENG_Save_The_Pubs:0 "Save The Pubs"
 ENG_Save_The_Pubs_desc:0 "The BNP will take legislative steps to protect Britain’s pubs, which will include tax relief, creating smoking rooms and a lowering of tax on alcohol served in public houses."
 ENG_Introduce_Pub_Heritage:0 "Introduce Pub Heritage"
 ENG_Introduce_Pub_Heritage_desc:0 "Britain’s pubs are an important part to all the british people, it’s the beating heart of our nation, people wish to have a drink after work, now we will nationalise all public houses and protect them as well as giving grants to businesses who wish to create a public house."
 ENG_Welfare_For_Only_The_True_British:0 "Welfare For Only The True British"
 ENG_Welfare_For_Only_The_True_British_desc:0 "Welfare has been reformed but its still not perfect. Its time only the white british people are given the welfare they deserve for working and providing for their country!"
 ENG_The_British_Test:0 "The British Test"
 ENG_The_British_Test_desc:0 "The British test will replace the citizenship test except will be extremely harder with  blood samples will be taken to prove that they have british blood inside of them."
 ENG_Remove_Welsh_And_Scottish_Parties:0 "Remove Welsh And Scottish Parties"
 ENG_Remove_Welsh_And_Scottish_Parties_desc:0 "The Welsh and Scottish parties promote independence and the breakup of our union, those parties are also left wing and hold communist influence. The abolishment of those parties will provide safety for our union and replace the states of Wales and Scotland with patriotic british parties."
 ENG_Introduce_The_Caste_System:0 "Introduce The Caste System"
 ENG_Introduce_The_Caste_System_desc:0 "Finally we have something which will ensure our british people are top priority over the rest of society against other races and religion. Our new system will be fair and establish a system which encourages to adapt to the british way of life to reap the benefits."
 ENG_A_True_Right_Wing_Economy:0 "A True Right Wing Economy"
 ENG_A_True_Right_Wing_Economy_desc:0 "Leftist and centrist parties have tried to rebuild the economy but ultimately they have failed to do so. Now its up to our government to finally be radical and change the economy for good and push the power of the pound."
 ENG_Money_For_The_English_Isle:0 "Money For The English Isle"
 ENG_Money_For_The_English_Isle_desc:0 "Lets invest in our isle and rebuild the lives of our people."
 ENG_Tax_The_Non_British:0 "Tax The Non British"
 ENG_Tax_The_Non_British_desc:0 "Although we will permit those of non british origin to remain here, they will have to pay their way to stay here."
 ENG_Tax_Relief_For_Christians:0 "Tax Relief For Christians"
 ENG_Tax_Relief_For_Christians_desc:0 "Our nation was built through Christianity and truth. Those who worship our lord will be given an easier life."
 ENG_Mass_Privatisation2:0 "Mass Privatisation"
 ENG_Mass_Privatisation2_desc:0 "Subsidised businesses and transport are bleeding our country dry. Its time to create a competitive market which will heavily invest in our economy and rebuild our businesses from the ground up!"
 ENG_Subsidise_True_British_Businesses:0 "Subsidise True British Businesses"
 ENG_Subsidise_True_British_Businesses_desc:0 "We need to invest in businesses to get our british people jobs and rebuild our high streets! Therefore we will cut taxes and costs to build businesses and help the people who wish to work to get the work they need."
 ENG_Increase_Defence_Spending:0 "Increase Defence Spending"
 ENG_Increase_Defence_Spending_desc:0 "Now we have the government of nationalist ideas we can finally give the army what they want and have a huge spending budget on our army for defence against the leftist rats in Europe and any other nation that wishes to stand against us!"
 ENG_National_Service2:0 "National Service"
 ENG_National_Service2_desc:0 "Our young must be prepared for war in the future but also must be modelled into the prime citizen that walks on our streets, national service will set our young in the right path for discipline but also a solider ready to fight on the beaches."
 ENG_A_Country_For_The_Pure_And_Strong:0 "A Country For The Pure And Strong"
 ENG_A_Country_For_The_Pure_And_Strong_desc:0 "Our country has now been rebuilt and is now ready for the future. Our economy has been restored, our army is strong and ready for anything. Our people, a proud bunch who are proud of what changes we have made as well as a new partnership with other nations around the world!"
 SCO_FREEDOM:0 "Scotland Is Free"
 SCO_FREEDOM_desc:0 "For the first time in over a century, the Scottish people are free. Free from the yolk of British tyranny and able to decide our own fate. No longer shall we put up with the rulers in London, it is finally time we rule ourselves."
 SCO_Form_A_New_Government:0 "Form A Provisional Government"
 SCO_Form_A_New_Government_desc:0 "While we decide on a government form, it is wise for us to form a “Provisional Government” of sorts. This council will consist of people from both sides of the political aisle, and essentially handle Government responsibilities until a constitution can be made and the people can decide on a form of government.”"
 SCO_Stand_Down_The_Military:0 "Stand Down The Military"
 SCO_Stand_Down_The_Military_desc:0 "“Since our Independence, the military has been on a high alert. Its time we tell them to stand down and return to civilian life.”"
 SCO_The_1st_Scottish_Constitutional_Convention:0 "The 1st Scottish Constitutional Convention"
 SCO_The_1st_Scottish_Constitutional_Convention_desc:0 "“A meeting Shall be held in Edinburgh in about a months’ time where delegates from all over the country can come, voice concerns, and shape the future of Scotland.”"
 SCO_Meet_In_Edinburgh:0 "Meet In Edinburgh"
 SCO_Meet_In_Edinburgh_desc:0 "Todays the day, already hundreds of people, representing local and provincial governments have flooded into Edinburgh. Ideas of free speech and freedom of religion are already included, but what else is going to happen."
 SCO_Discuss_The_Government_Structure:0 "Discuss The Government Structure"
 SCO_Discuss_The_Government_Structure_desc:0 "Now that a constitution has been made, it’s time to discuss our government structure. Many if not most want to see Republicanism triumph. But there are those who clamor for a socialist republic so we can join the rest of the world. Some want to see a Monarch placed back on the throne, and even some want to see Scotland returned to Clan rule."
 SCO_A_Council_Of_Clans:0 "A Council Of Clans?"
 SCO_A_Council_Of_Clans_desc:0 "Surprisingly the Druidists have won their place in Government. Over the next couple of months, Scotland will reform itself into a council ruling over Clans. Local governments will come down to the rule of local clans while a High Clan council will sit in Edinburgh."
 SCO_Raise_A_Status_Of_William_Wallace:0 "Raise A Statue Of William Wallace"
 SCO_Raise_A_Status_Of_William_Wallace_desc:0 "Wallace to us is our version of George Washington. The man while unsuccessful attempted to free the Scots from the tyranny of the English. All over the country we shall raise statues of Wallace to inspire true nationalism in the country and give the clans something to aspire too."
 SCO_Theyll_Answer_To_The_Council:0 "They'll Answer To The Council"
 SCO_Theyll_Answer_To_The_Council_desc:0 "The Time has come for the Clans to become independent. Over the past couple days local clans have formed their own councils and sets of laws. While in Edinburgh, 5 of the most powerful clans have consolidated their power in the Capital. These clans will form a High Council in which only the most major clan issues will be concerns."
 SCO_Elect_A_High_Council_Leader:0 "Elect A High Council Leader"
 SCO_Elect_A_High_Council_Leader_desc:0 "For our Clans to be effectively led, we must elect a High Leader for the Clan council. While many have come forward and offered to lead the nation, we can only choose one."
 SCO_Return_To_The_Old_Faith:0 "Return To The Old Faith"
 SCO_Return_To_The_Old_Faith_desc:0 "While we have a ways to go before returning our government structure to the old ways, many of suggested that we officially adopt the old druidic faith. Leading this effort is Juniper Mackenzie who will undoubtedly increase her power."
 SCO_The_Return_Of_A_Monarch:0 "The Return Of A Monarch"
 SCO_The_Return_Of_A_Monarch_desc:0 "Since the end of the Scottish nation, our monarchs have lived abroad and blessed others with their reign. Now that the Convention has ruled in favor of a Monarchy, it is time we invite them back to the country."
 SCO_Raise_The_Old_Flag:0 "Raise The Old Flag"
 SCO_Raise_The_Old_Flag_desc:0 "The Scottish Lion has been a symbol of hope and nationalism for many Scottish since we were unfairly absorbed into the United Kingdom. Its time that we hoist it side by side with the Saltire and proudly display our new nation to the world."
 SCO_Coronation_At_St_Giles:0 "Coronation At St Giles"
 SCO_Coronation_At_St_Giles_desc:0 "Our Monarchs time has come and they shall be coronated at St.Giles. Like Westminster in the old country, we shall coronate all future Monarchs here, regardless of gender. They shall be brought to the people here, and loved by the people."
 SCO_Republicanism_Triumphs:0 "Republicanism Triumphs"
 SCO_Republicanism_Triumphs_desc:0 "Democracy has triumphed in Scotland! In a world where governments are going more and more nationalist or communist, Scotland shall stand out as the chief protector of personal freedom in the world."
 SCO_How_Do_We_Govern_The_People:0 "How Do We Govern The People"
 SCO_How_Do_We_Govern_The_People_desc:0 "While we’ve established that Democracy will be our prime tool of governance in the country, we have yet to wonder how we’ll govern. Theres many forms of democracy, but what will we choose."
 SCO_Confederation_Of_Scotland:0 "Confederation Of Scotland"
 SCO_Confederation_Of_Scotland_desc:0 "A confederation is one of the better ideas for governing our people. Essentially a libertarians wet dream, this governing system will give most of the governing power to local government, because who knows better than your local mayor or governor."
 SCO_Promise_Autonomy_To_Governors:0 "Promise Autonomy To Governors"
 SCO_Promise_Autonomy_To_Governors_desc:0 "Since declaring a confederation type government, we’re going to promise almost complete autonomy to local governments. Ultimately, the higher government will be able to pass laws but local governments will be able to decide if they are to implement it."
 SCO_Base_The_New_Government_In_Edinburgh:0 "Base The New Government In Edinburgh"
 SCO_Base_The_New_Government_In_Edinburgh_desc:0 "Edinburgh is already the capitol of the provisional Scottish government. Lets keep it there."
 SCO_Decentralise_Our_Authority:0 "Decentralise Our Authority"
 SCO_Decentralise_Our_Authority_desc:0 "For our final preparations, we shall remove as much power from the central government as possible. Local governments are now equals with us."
 SCO_Republic_Of_Scotland:0 "Republic Of Scotland"
 SCO_Republic_Of_Scotland_desc:0 "Like the American Government before it collapsed, we shall be a government for the people by the people. Already the Scottish people are worried for our future, but we shall continue the American experiment and prove ourselves better than them."
 SCO_Form_The_Scottish_Parliament:0 "Form The Scottish Parliament"
 SCO_Form_The_Scottish_Parliament_desc:0 "So we do not resort ourselves to tyranny, a parliament shall be based in Edinburgh, inside the newly constructed Houses of Parliament and Senate, the parliament shall declare laws and ultimately work to represent their districts."
 SCO_The_Scottish_Senate:0 "The Scottish Senate"
 SCO_The_Scottish_Senate_desc:0 "With the parliament fully formed, it is time to establish the house of the Senate. This group will have a broader range of power but mostly decide on budgetary spending and who to appoint to key government positions. Weather or not they can serve the will of the people is a question that many wonder."
 SCO_A_Unitary_Scotland:0 "A Unitary Scotland"
 SCO_A_Unitary_Scotland_desc:0 "Many see a unitary government as a logical choice of rule. While a house of lords will be formed, and essentially act as a parliament. Most of the governing powers will be set into the Prime Minister."
 SCO_A_Scottish_House_Of_Lords:0 "A Scottish House Of Lords"
 SCO_A_Scottish_House_Of_Lords_desc:0 "The House of lords will keep the PM in check, by vetoing and amending many of the pieces of legislation that the PM will undoubtedly propose."
 SCO_Invest_Power_In_The_PM:0 "Invest Power In The PM"
 SCO_Invest_Power_In_The_PM_desc:0 "Most of the governing power shall be invested within the PM. Essentially they’ll be an almost absolute tyrannical ruler, with just a tiny bit of overcheck."
 SCO_A_PM_Nontheless:0 "A PM Nontheless"
 SCO_A_PM_Nontheless_desc:0 "Debating on titles gets Scotland nowhere, lets just use the name "Prime Minister"
 SCO_Call_For_Elections:0 "Call For Elections"
 SCO_Call_For_Elections_desc:0 "With our governing system chosen, its time we call elections for a PM or President. In 8 months’, time, the leader of the free Scottish nation shall be chosen and ultimately the people will feel true equality."
 SCO_Party_Primaries:0 "Party Primaries"
 SCO_Party_Primaries_desc:0 "Conventions and debates shall be held across the country as each party chooses who they will choose for the role of leadership. While some minor parties protest, most are just happy to finally represent the Scottish people."
 SCO_The_Results_Are_In:0 "The Results Are In"
 SCO_The_Results_Are_In_desc:0 "THE RESULTS ARE IN!!!! NO MORE SHALL WE STAND BY AND LET SCOTLAND BE A LAUGHING STOCK!!!!! Saorsa gu bràth"
 SCO_Socialism_Embraced:0 "Socialism Embraced"
 SCO_Socialism_Embraced_desc:0 "Why the Scottish people chose socialism is anyones guess. But nonetheless, the people are ready to join the Warsaw pact and emulate the tyrannical soviets."
 SCO_Drafting_A_Socalist_Constitution:0 "Draft A Socalist Constitution"
 SCO_Drafting_A_Socalist_Constitution_desc:0 "While our constitution is still in the process of being made, perhaps its time that we begin to amend some of the amendments. We need to fully enshrine socialist equality within the country. Lets look to the Soviets for inspiration."
 SCO_Disbanding_The_Provisional_Council:0 "Disbanding The Provisional Council"
 SCO_Disbanding_The_Provisional_Council_desc:0 "The Provisional council has served their purpose. We have a Chairman to lead the nation through this change and quite frankly, who likes Salmond? Richard Leonards time is going to be more valuable to the nation."
 SCO_Scottish_Entertainment:0 "Scottish Entertainment"
 SCO_Scottish_Entertainment_desc:0 "Now that we’re free, we no longer have to rely on English entertainment. It is time for us to start producing the entertainment the world really wants to see."
 SCO_Edinburgh_Films:0 "Edinburgh Films"
 SCO_Edinburgh_Films_desc:0 "Being based in the capital, Edinburgh films will be a major job producer for the city and allow the average Scottish citizen to take part in the entertainment process if they see fit."
 SCO_Wallace_Films:0 "Wallace Films"
 SCO_Wallace_Films_desc:0 " Wallace films, based in Glasgow has quickly become the major producer of the action themed entertainment within the country. Already, their first film “Wolfsbane” has boasted over $32 million worldwide."
 SCO_Restart_Lionsgate:0 "Restart Lionsgate"
 SCO_Restart_Lionsgate_desc:0 "Lionsgate was one of the most successful American film companies pre collapse, and we believe its time for them to make a return within Scotland."
 SCO_A_Scottish_Bond:0 "A Scottish Bond?"
 SCO_A_Scottish_Bond_desc:0 "Theres nothing more English than the name James Bond. First starting with Sean Connery in the 60’s and most recently becoming English superstar Daniel Craig. But now with England in chaos, and our freedom secured, maybe its time for Scotland to be represented by a bond."
 SCO_Rebuilding_Scotland:0 "Rebuilding Scotland"
 SCO_Rebuilding_Scotland_desc:0 "Scotlands been devastated for years with those tyrannical brits choosing to direct money towards them. It’s time we increase taxes and begin to repair our nation so she can shine."
 SCO_Provisional_Infrastructure_Bill:0 "Provisional Infrastructure Bill"
 SCO_Provisional_Infrastructure_Bill_desc:0 "Lets draft a bill to completely overhaul the infrastructure system within our country. All over, roads are cracked and go unpaved, bridges are near collapse and buildings lay abandoned. With a small increase in taxes we can begin to fix many of these problems."
 SCO_Invest_In_Lanark:0 "Invest In Lanark"
 SCO_Invest_In_Lanark_desc:0 "Lanark is a region which has gone undeveloped since we joined the UK. For centuries its primary industry became that of tourism but with the current circumstances in place, tourism wont be a factor for a while. Lets invest in small business and improve the economy of this area."
 SCO_Rebuild_Lothian:0 "Rebuild Lothian"
 SCO_Rebuild_Lothian_desc:0 "Lothian was the hardest hit by economic downturns. Many of its one “elite” areas are now abandoned, with many more having become drug dens for the homeless. Once we invest in this area, we can get drugs off the street, reform their police system and hopefully revitalize business."
 SCO_A_Joint_Investment_In_The_North:0 "A Joint Investment In The North"
 SCO_A_Joint_Investment_In_The_North_desc:0 "The north is a vast region, with many poor living out their lives in the cold. By investing in this region we can restart a large amount of their industry and hopefully form a large economic powerhouse."
 SCO_Scottish_Civillian_Industries:0 "Scottish Civillian Industries"
 SCO_Scottish_Civillian_Industries_desc:0 "While arming our military and rebuilding infrastructure is important, so are civilian industries. It’s time we invest in small civilian owned business and allow people to spend their wealth in whatever way they want. Maybe after this we can invite foreign companies. Many of the youth want see something called “Anime” make its way to Scotland."
 SCO_Invest_In_The_Glasgow_Fishing_Yards:0 "Invest In The Glasgow Fishing Yards"
 SCO_Invest_In_The_Glasgow_Fishing_Yards_desc:0 "Glasgows fish used to be a staple of the Scottish diet, but these days the docks lay empty and the children go hungry. By investing in restarting the industry, we can hopefully keep the industry alive and begin to ship our fish out to the world."
 SCO_Highland_Whiskey:0 "Highland Whiskey"
 SCO_Highland_Whiskey_desc:0 "Have you ever had a bottle of Glenlivet, the smoothest whiskey on this earth. No? Well now you can as Glenlivet has made a return to the world. Enjoy its smooth taste, and great body. Drink responsibly"
 SCO_Booming_Medical_Industries:0 "Booming Medical Industries"
 SCO_Booming_Medical_Industries_desc:0 "Medicine is another industry that’s gone neglected. Lets invest in companies producing life saving drugs for our citizens"
 SCO_Invest_In_The_Private_Military_Sector:0 "Invest In Pivate Military Sector"
 SCO_Invest_In_The_Private_Military_Sector_desc:0 "Now, we don’t condone mercenary work but the industry is too good to pass up. Lets invite merc companies, but also private weapon companies into Scotland.""
 SCO_Raytheon_Rifles:0 "Raytheon Rifles"
 SCO_Raytheon_Rifles_desc:0 "Raytheon, a new start up company has decided to base most of its factories within Scotland. Not only will our forces be equipped by this company, but we can expect an economic boom from selling weapons abroad."
 SCO_BAEs_New_Factories:0 "BAE's New Factories"
 SCO_BAEs_New_Factories_desc:0 "BAE, has finally moved its operations to Scotland. Formally changing their name to SAE, they’re going out of their way to employ our homeless and create a job economy where only 3% of the nation will be unemployed."
 SCO_Leonardos_Manufacturing_Boom:0 "Leonardos Manufacturing Boom"
 SCO_Leonardos_Manufacturing_Boom_desc:0 "Leonardo, yet another private military company, has experienced a boom in manufacturing. Many of our citizens are now employed with amazing benefits."
 SCO_The_Booming_Scottish_Economy:0 "The Booming Scottish Economy"
 SCO_The_Booming_Scottish_Economy_desc:0 "Every single industry in our country is absolutely booming. Our stock market is better than ever before, we’ve achieved unemployment levels like no ones ever seen and the average wealth of our citizens is only creasing."
 SCO_The_Jacobites_Heir:0 "The Jacobites Heir"
 SCO_The_Jacobites_Heir_desc:0 "The Jacobite mission is finally complete after centuries of exile from the homeland. While German, this man is Scottish at heart."
 SCO_Forming_a_royal_council:0 "Forming A Royal Council"
 SCO_Forming_a_royal_council_desc:0 "As in the days of old, the new King will surround himself with advisors from every corner of the government."
 SCO_The_King_Has_The_Final_Say:0 "The King Has The Final Say"
 SCO_The_King_Has_The_Final_Say_desc:0 "Who needs parliament, when the people have a say in Government, it is anarchy. The King and his council shall have the final say in the lawmaking process."
 SCO_Invite_The_Exiles:0 "Invite The Exiles"
 SCO_Invite_The_Exiles_desc:0 "Our monarch was not the only one exiled from his homeland, in fact many of Europes royal families now reside either in Africa, Asia, or Central America. It’s time to bring them back to Europe and welcome them to Scotland."
 SCO_Adopting_Scottish_Traditions:0 "Adopting Scottish Traditions"
 SCO_Adopting_Scottish_Traditions_desc:0 "The Von Bayern king is no longer a German. After spending considerable time in Scotland, he believes its time change his name to James Stuart III, after his last ancestor."
 SCO_Forming_The_Council_Of_Exiled_Royals:0 "Forming The Council Of Exiled Royals"
 SCO_Forming_The_Council_Of_Exiled_Royals_desc:0 "With our lands full of exiled royals, it’s time we bring them together and form the Council of Exiled Royals. In the spirit of fostering European Co-operation we’ll plan out policy for when these royals are reinstated to their lands."
 SCO_Designate_An_Heir:0 "Designate An Heir"
 SCO_Designate_An_Heir_desc:0 "King James is elderly. His days are getting shorter and shorter, and basic tasks like walking are taking more and more energy. It’s time for him to designate an heir in his son, Max-Emanuel"
 SCO_An_Economic_Reformation:0 "An Economic Reformation"
 SCO_An_Economic_Reformation_desc:0 "For Scotland to survive in the new horrible world, its time we reform our economic system completely."
 SCO_Lower_Taxes_On_Wealthy:0 "Lower Taxes On Wealthy"
 SCO_Lower_Taxes_On_Wealthy_desc:0 "The Wealthy are the exact people who fund our economy. By lowering taxes on them, they’ll spend more and increase the health of the economy."
 SCO_Tickle_Down_Economics:0 "Tickle Down Economics"
 SCO_Tickle_Down_Economics_desc:0 "An idea proposed by the final US president, our nation will adapt trickle down economics. It’s a concept of treating the rich nice so then they would invest in poor communities. Everyone benefits."
 SCO_Invite_International_Investment:0 "Invite International Investment"
 SCO_Invite_International_Investment_desc:0 "International companies can find a new home in Scotland. We’re open, we’re cheap to work with, and we’re ready for your business."
 SCO_Invest_In_Green_Power:0 "Invest In Green Power"
 SCO_Invest_In_Green_Power_desc:0 "The Earth is dying, but James Stuart III has a plan to solve it. Scotland will begin a transition to green-renewable power."
 SCO_Writing_A_Will:0 "Writing A Will"
 SCO_Writing_A_Will_desc:0 "To my son, I leave you Scotland. Take care of her, and ensure she never falls to anybody ever again. To the people of Scotland, I leave you my determination, use it to continue making this beautiful land better. And to the children of Scotland, I leave you my sense of wonder, never stop exploring."
 SCO_The_Ascension_Of_James_IV:0 "The Ascension Of James IV"
 SCO_The_Ascension_Of_James_IV_desc:0 "Max-Emanuel Ludwig Maria Herzog will take the reins of the nation as his father is now among the dead. Like his father he will take a Scottish name and adapt the culture becoming James Stuart IV."
 SCO_The_James_III_Memorial:0 "The James III Memorial"
 SCO_The_James_III_Memorial_desc:0 "A statue of the old man shall be built in front of Edinburgh castle. It will honor him and his life."
 SCO_The_Royal_Coronation:0 "The Royal Coronation"
 SCO_The_Royal_Coronation_desc:0 "James IV will be coronated at St. Giles church, where the Bishop of Edinburgh will crown him king of the nation."
 SCO_The_ALBA_Project:0 "The ALBA Project"
 SCO_The_ALBA_Project_desc:0 "Codename Alba is the name of a nuclear weapon. If we can successfully detonate one, we’ll be a power in the worlds eyes once again."
 SCO_Using_Shetlands_As_A_Testing_Ground:0 "Using Shetlands As A Testing Ground"
 SCO_Using_Shetlands_As_A_Testing_Ground_desc:0 "The Shetlands are mostly abandoned, so lets use them as a testing ground for our weapons. The US did the same thing with their nukes."
 SCO_The_1st_Nuclear_Detonation:0 "The 1st Nuclear Detonation"
 SCO_The_1st_Nuclear_Detonation_desc:0 "Success! We’ve detonated a Nuke in the Shetlands. The process went off without a hitch and we’re finally a power."
 SCO_Anti-Socialist_Crusade:0 "Anti Socialist Crusade"
 SCO_Anti-Socialist_Crusade_desc:0 "Socialism sucks! Lets teach our children to hate it and ban the party itself."
 SCO_An_Advanced_Military:0 "An Advanced Military"
 SCO_An_Advanced_Military_desc:0 "An advanced military can keep a nation safe. By directly funding the military, we’ll come up with some of the most ingenious weapons of destruction so we destroy our enemy from afar."
 SCO_Naval_Exercises_Off_Of_Mann:0 "Naval Exercises Off Of Mann"
 SCO_Naval_Exercises_Off_Of_Mann_desc:0 "Lets show those English whose boss now. We’ll deploy the full force of our navy off the coast of Mann and demonstrate our power in a series of exercises."
 SCO_The_Peoples_Queen:0 "The Peoples Queen"
 SCO_The_Peoples_Queen_desc:0 "Princess Marie Caroline has been chosen by the convention to lead the Scottish people into a new era and protect their sovereignty. While facing an uphill battle as a woman in a historical mans job, the Princess has the support of both the youth and the elderly"
 SCO_Work_With_Parliament:0 "Word With Parliament"
 SCO_Work_With_Parliament_desc:0 "To prevent the specter of tyranny from overtaking Scotland, the Princess has agreed to work with Parliament in drafting new laws and running the country. While she will maintain a royal council, it will function more as a PR advisory rather than a law making group."
 SCO_Electing_A_Prime_Minister:0 "Electing A Prime Minister"
 SCO_Electing_A_Prime_Minister_desc:0 "With Scotland dedicating itself to being a constitutional Monarchy it is time for the people to choose their representative. For now the candidates are Nicola Sturgeons and Alex Salmond. Although the Greens may pull a surprise win."
 SCO_Looking_To_The_Outside_World:0 "Looking To The Outside World"
 SCO_Looking_To_The_Outside_World_desc:0 "With the fall of the English commonwealth, it’s time for us to step up and take Brittanias place in the world. To do this, the Queen is touring the previous aligned commonwealth countries trying to form a new commonwealth with them."
 SCO_Visiting_Scotland:0 "Visiting Scotland"
 SCO_Visiting_Scotland_desc:0 "The first area for the Queen to visit, and arguably the most important will be country of Scotland itself. During this tour she’ll pitch the idea of CANZS to the people and hope to win their approval."
 SCO_Visiting_Canada:0 "Visiting Canada"
 SCO_Visiting_Canada_desc:0 "Canada is the next stop of the CANZS tour, initially a huge supporter of CANZUK, it is impossible that they’d deny themselves the benefits of CANZS"
 SCO_Visiting_New_Zealand:0 "Visiting New Zealand"
 SCO_Visiting_New_Zealand_desc:0 "New Zealand is next on our Queens stop. While not an important country, the Queen feels as if New Zealand will only serve to strengthen the CANZS union."
 SCO_A_Visit_To_Australia:0 "A Visit To Australia"
 SCO_A_Visit_To_Australia_desc:0 "Australia, the old penal colony of the empire will be our last stop on the CANZS tour."
 SCO_Taking_Her_Place:0 "Taking Her Place"
 SCO_Taking_Her_Place_desc:0 "With all countries accepting the CANZS stipulations, Queen Marie Caroline has replaced that old hag, Elizabeth!"
 SCO_CANZS:0 "CANZS"
 SCO_CANZS_desc:0 "It’s time for CANZS to go into effect."
 SCO_Guarantee_Secularism:0 "Guarantee Secularism"
 SCO_Guarantee_Secularism_desc:0 "Weather one worships a god or multiple Gods, it is our duty to preserve the peoples rights to worship as they please in a manor they choose. It is not our right to force our religion on the people and vise versa."
 SCO_A_Modern_Queen:0 "A Modern Queen"
 SCO_A_Modern_Queen_desc:0 "The queen fit for a modern asge to rule over the scottish people with fair and freedoms for all scottish people!"
 SCO_More_Celebrity_Than_Ruler:0 "More Celebrity Than Ruler"
 SCO_More_Celebrity_Than_Ruler_desc:0 "The Queen actually has very little power regarding the law making process. To make up for this, she’s adapted and campaigned for charitable causes such as removing mines in France or donating personal funds to refugee organizations. Among this, she’s also taken a stance against communism and declared Scotland to be a Shining beacon of freedom."
 SCO_Forming_The_Jacobite_Youth:0 "Forming The Jacobite Youth"
 SCO_Forming_The_Jacobite_Youth_desc:0 "The young will be part of the royals by joining in sporting and activities to make scotland a powerhouse in the future"
 SCO_A_Philanthropist_Queen:0 "A Philanthropist Queen"
 SCO_A_Philanthropist_Queen_desc:0 "The Queen has taken it upon herself to donate to charity in the absence of her making foreign policy. She’s donated so much so, that charity organizations have nicknamed her “The Philanthropist Queen”"
 SCO_The_Entertainment_Weekly_Interview:0 "The Entertainment Weekly Interview"
 SCO_The_Entertainment_Weekly_Interview_desc:0 "As part of her Celebrity status, the Queen has made sure to make regular public appearances with her Husband. The biggest interview of her life, from a Canadian company is finally coming up."
 SCO_Visiting_Perth_Air_Yards:0 "Visiting Perth Air Yards"
 SCO_Visiting_Perth_Air_Yards_desc:0 "To show support for the Military, Our Queen has decided to visit the Perth Air Yards, AKA the biggest air yards in the country. "
 SCO_A_New_Diana:0 "A New Diana"
 SCO_A_New_Diana_desc:0 "My god, the Queen has surged in popularity. She’s gotten the Scots involved in charity and allowed the country to prosper without her interference."
 SCO_Guarantee_An_Heir:0 "Guarantee An Heir"
 SCO_Guarantee_An_Heir_desc:0 ""
 SCO_The_German_Marriage:0 "The German Marriage"
 SCO_The_German_Marriage_desc:0 "The Queen and the German families will now be united together through marriage and love"
 SCO_Scotland_On_The_World_Stage_i:0 "Scotland On The World Stage"
 SCO_Scotland_On_The_World_Stage__i_desc:0 "The first area for the Queen to visit, and arguably the most important will be country of Scotland itself. During this tour she’ll pitch the idea of CANZS to the people and hope to win their approval."
 SCO_New_Imperalism:0 "New Imperalism"
 SCO_New_Imperalism_desc:0 "Imperialism was a horrible thing, but this new imperialism will be benevolent."
 SCO_The_Darien_Scheme:0 "The Darien Scheme"
 SCO_The_Darien_Scheme_desc:0 "The Darien scheme was an unsuccessful attempt, backed largely by investors of the Kingdom of Scotland, to gain wealth and influence by establishing New Caledonia, a colony on the Isthmus of Panama, in the late 1690s. It’s time for us to restart this idea and take Panama, either by buying it or taking it by force."
 SCO_Offer_To_Buy_Panama:0 "Offer To Buy Panama"
 SCO_Offer_To_Buy_Panama_desc:0 "Let us make an offer the Panamanians can’t refuse."
 SCO_Invade_Panama:0 "Invade Panama"
 SCO_Invade_Panama_desc:0 "Panama will never let us just waltz in and buy their nation. Lets land some marines in their capital and forcibly change their minds."
 SCO_Encourage_Immigration_To_The_Colony:0 "Encourage Immigration To The Colony"
 SCO_Encourage_Immigration_To_The_Colony_desc:0 "South Africa is in danger of falling to Afro-communism. For its sake, and the sake of its many citizens, it is time we intervene in the region and set up our own administration."
 SCO_Colonizing_Africa:0 "Colonizing Africa"
 SCO_Colonizing_Africa_desc:0 "In the 17-1800s Africa was the goal of many to colonize, it offered up untold riches and abundant materials. Maybe it is time for us to return to the continent before any other nation has the same idea."
 SCO_Invade_Southern_Africa:0 "Invade Southern Africa"
 SCO_Invade_Southern_Africa_desc:0 "South Africa is in danger of falling to Afro-communism. For its sake, and the sake of its many citizens, it is time we intervene in the region and set up our own administration."
 SCO_Scottish_Madagascar:0 "Scottish Madagascar"
 SCO_Scottish_Madagascar_desc:0 "Madagascar can function as a port for our ships to dock in, and a good trade node for us. Maybe it is time for a false flag attack or two."
 SCO_Europa:0 "Europa"
 SCO_Europa_desc:0 "Europe, was a lost continent but maybe we can help it see the light once again."
 SCO_Form_Our_Own_Faction:0 "Form Our Own Faction"
 SCO_Form_Our_Own_Faction_desc:0 "Forming our own faction will serve our needs better than anything else, we can strengthen military ties with like minded nations and work to prevent the spread of communism even further."
 SCO_Contact_The_French:0 "Contact The French"
 SCO_Contact_The_French_desc:0 "The French recently overthrew their communist government and brought back a Monarchy. It’s time we contact our oldest ally and invite them to our faction."
 SCO_Ally_The_Old_Enemy:0 "Ally The Old Enemy"
 SCO_Ally_The_Old_Enemy_desc:0 "WHY? WHY WOULD WE DO THIS? IS IT BECAUSE THEY HAVE SHIPS? Lets just make sure they don’t try to conquer us again."
 SCO_Reach_Out_To_Spain:0 "Reach Out To Spain"
 SCO_Reach_Out_To_Spain_desc:0 "Spain, as it stands is currently one of the few Monarchist nations still in existence. Lets reach out and ask them to join our faction."
 SCO_Avenge_Europe:0 "Avenge Europe"
 SCO_Avenge_Europe_desc:0 "The time has come for to cleanse Europe of Communism and restore the Monarchies to their proper place."
 SCO_SNP_Victorious:0 "SNP Victorious"
 SCO_SNP_Victorious_desc:0 "The SNP has come out victorious in our democratic elections. Promoting a progressive agenda, it seems Scotland is on its way to becoming a fair and equal nation."
 SCO_Sturgeons_Speech_To_The_Voters:0 "Sturgeons Speech To The Voters"
 SCO_Sturgeons_Speech_To_The_Voters_desc:0 "PM Sturgeons was elected to the highest office in the nation and now she’s prepared to give a speech to the voters."
 SCO_A_Gender_Equal_Cabinet:0 "A Gender Equal Cabinet"
 SCO_A_Gender_Equal_Cabinet_desc:0 "For Scotland to prosper, we need to prove that we are progressive. To do this, PM Sturgeons wants a gender equal cabinet"
 SCO_Focus_On_Feminism:0 "Focus On Feminism"
 SCO_Focus_On_Feminism_desc:0 "Women are the backbone of society. They cook, clean, give birth, and more, however they could be doing so much more like fighting crime, getting involved in politics, or even fighting wars."
 SCO_Institute_Benefits_For_Pregnant_Woman:0 "Institute Benefits For Pregnant Woman"
 SCO_Institute_Benefits_For_Pregnant_Woman_desc:0 "Pregnant women bear the brunt of child rearing. It’s time we institute benefits like medical pay, free healthcare, and free childcare."
 SCO_Bridge_The_Scottish_Pay_Gap:0 "Bridge The Scottish Pay Gap"
 SCO_Bridge_The_Scottish_Pay_Gap_desc:0 "Women historically have made less than the average male. With a woman leading out country, its time we fix this and bridge the pay gap between men and women. Equal pay for Equal work"
 SCO_Incetivise_Woman_In_The_Workplace:0 "Incetivise Woman In The Workpalce"
 SCO_Incetivise_Woman_In_The_Workplace_desc:0 "Women belong in the workplace. They are smarter and more capable than men, and often they can come up with better solutions than men."
 SCO_A_Feminist_Nation:0 "A Feminist Nation"
 SCO_A_Feminist_Nation_desc:0 "Feminism is the way to liberate our women from the patriarchal structure that has dictated their life for centuries. Now we can get women into the workplace and upfront in the public."
 SCO_Lower_Tax_Rates:0 "Lower Tax Rates"
 SCO_Lower_Tax_Rates_desc:0 "Taxes are theft. They bleed the middle and lower class of their wealth, while the Rich only proceed to get richer."
 SCO_Welcome_Refugees_To_Scotland:0 "Welcome Refugees To Scotland"
 SCO_Welcome_Refugees_To_Scotland_desc:0 "People flee their governments en masse these days with most of them being resettled in better nations suited to their needs. However, since there are not many free democratic nations left besides Canada and those in the democratic alliance. It’s time for us to open Scotland to people seeking freedom and peace for their families."
 SCO_Gay_Rights_Equals_Human_Rights:0 "Gay Rights Equals Human Rights"
 SCO_Gay_Rights_Equals_Human_Rights_desc:0 ""
 SCO_Discourage_Racism:0 "Discourage Racism"
 SCO_Discourage_Racism_desc:0 "Racism has such a low place in our society. While we may never fully remove it from our society, its our job to discourage it."
 SCO_Open_Ourselves_To_Trade:0 "Open Ourselves To Trade"
 SCO_Open_Ourselves_To_Trade_desc:0 "Why limit our trade to only countries who align to our values when we could make a solid profit by trading with the rest of Europe?"
 SCO_A_Free_Democratic_Nation:0 "A Free Democratic Nation"
 SCO_A_Free_Democratic_Nation_desc:0 "We’ve weathered a crisis and come out on top. Our elections are now secure and free from the influence of tyranny and our lands are a beacon of light on top of a dark hill."
 SCO_ALBA_Victorious:0 "ALBA Victorious"
 SCO_ALBA_Victorious_desc:0 "Alba, the nationalistic conservative group has won the elections. Promoting an ideology of Scotland first, the populist Alex Salmond will either lead Scotland into a period of decline like the leftists say or he might just make Scotland great again"
 SCO_Salmonds_Victory_Speech:0 "Salmonds Victory Speech"
 SCO_Salmonds_Victory_Speech_desc:0 "Salmond is preparing to give his speech near Edinburgh castle, in which he’ll outline his goals for Scotland."
 SCO_Sever_English_Ties:0 "Sever English Ties"
 SCO_Sever_English_Ties_desc:0 "England as a nation descended into tyranny and oppressed the Scottish people. For our nation to survive we must cut ties with our old nation. Down with Queen Elizabeth, up with Alex Salmond."
 SCO_Establish_A_New_Scottish_Currency:0 "Establish A New Scottish Currency"
 SCO_Establish_A_New_Scottish_Currency_desc:0 "The British sterling pound is now a defunct currency in our nation. It’s time that we create our own currency. While it will be hard to get this equal to other currencies, at least our nation will be fully independent."
 SCO_Invest_In_Small_Businesses:0 "Invest In Small Businesses"
 SCO_Invest_In_Small_Businesses_desc:0 "Small businesses are the current lifeline of the Scottish economy. Salmond’s government proposes the idea of investing in these businesses so they can prosper and continue to contribute to our economic health."
 SCO_Stimulate_The_Economy:0 "Stimulate The Economy"
 SCO_Stimulate_The_Economy_desc:0 "Giving our citizens an economic stimulus package will drag our economy out of the dirt."
 SCO_We_Ask_For_Skilled_Immigrants:0 "We Ask For Skilled Immigrants"
 SCO_We_Ask_For_Skilled_Immigrants_desc:0 "Unskilled immigrants are a drag on our economy. Leftist region councils give them welfare and free money while other Scots are out in the city streets without a home. By tightening our border security, we can make sure only immigrants with actual skills and smarts are welcomed into this nation."
 SCO_Solve_The_Homeless_Problem:0 "Solve The Homeless Problem"
 SCO_Solve_The_Homeless_Problem_desc:0 "By ensuring work, we can remove the homeless from the streets and put them in homes. They may not be the greatest homes, but at least their will be a roof over their heads, 3 square meals, and jobs for them to earn their own money."
 SCO_The_Problem_Of_The_English_Residents:0 "The Problem Of The English Residents"
 SCO_The_Problem_Of_The_English_Residents_desc:0 "With the United Kingdom no longer united. It’s time for us to decide what we should do with the English residents in our country. While it should be done, we can not get away with simply exiling them."
 SCO_Let_Them_Stay:0 "Let Them Stay"
 SCO_Let_Them_Stay_desc:0 "It’s been unanimously decided that we’ll let the English stay in the country. They’ll be declared citizens of the new republic and gradually assimilated into Scotland."
 SCO_Honorary_Scottish:0 "Honorary Scottish"
 SCO_Honorary_Scottish_desc:0 "The English refugees present in our country are to be declared honorary Scottish. This idea will appease both the English and Scottish nationalists."
 SCO_A_Green_Deal:0 "A Green Deal"
 SCO_A_Green_Deal_desc:0 "Part of Salmonds ideology is the idea of creating a Green Scotland. By working with the Green party, Salmond has come up with legislation which will reduce Scotland’s carbon footprint by a considerable amount."
 SCO_Introduce_Environmental_Regulations:0 "Introduce Enviromental Regulations"
 SCO_Introduce_Environmental_Regulations_desc:0 "Introducing the Green Scotland act to parliament, we can show the world and our citizens that we’re ready to leave the old industrial world behind and begin the process of saving our planet."
 SCO_Green_Housing:0 "Green Housing"
 SCO_Green_Housing_desc:0 "Each house in Scotland will have a energy monitor installed. The higher the energy use, the higher taxes will be on that property. This will, in theory, reduce energy usage by the Scottish people."
 SCO_Change_To_Renewable_Energy:0 "Change To Renewable Energy"
 SCO_Change_To_Renewable_Energy_desc:0 "While not being done immediately, our transition to Renewable energy will significantly lower our carbon footprint and allow us to use the Earths natural resources to power our lives."
 SCO_Scottish_Christianity_Victorious:0 "Scottish Christianity Victorious"
 SCO_Scottish_Christianity_Victorious_desc:0 "Scottish Christianity won over the nations heart by promising a wholesome Christian nation free from the influence of the decadent outside world. Scotland is One nation under Christ."
 SCO_Hargreaves_Victory_Speech:0 "Hargreaves Victory Speech"
 SCO_Hargreaves_Victory_Speech_desc:0 "Hargreaves is breaking tradition by giving a victory speech in front of a church congregation instead of the media."
 SCO_One_Nation_Under_Christ:0 "One Nation Under Christ"
 SCO_One_Nation_Under_Christ_desc:0 "Blessed be the fruit who worships the lord. Blessed be those who do not worship the false prophets. "
 Abortion_Legislation:0 "Abortion Legislation"
 Abortion_Legislation_desc:0 "Thou Shall not Kill (Exodus 20:13)"
 SCO_A_Day_Off_On_Sunday:0 "A Day Off On Sunday"
 SCO_A_Day_Off_On_Sunday_desc:0 "Six days work shall be done, but on the seventh day you shall have a Sabbath of solemn rest, holy to the LORD. Whoever does any work on it shall be put to death. (Exodus 35:2)"
 SCO_The_Clergy_Shall_Teach:0 "The Clergy Shall Teach"
 SCO_The_Clergy_Shall_Teach_desc:0 "By removing the “science” from classrooms, we can put our clergy in power and destroy the liberal influence which wrecks our kids’ minds."
 SCO_The_LGBTQ_Menance:0 "The LGBTQ Menance"
 SCO_The_LGBTQ_Menance_desc:0 "“You shall not lie with a man as you would a woman”"
 SCO_Anti-Abortion_Legislation:0 "Anti-Abortion Legislation"
 SCO_Anti-Abortion_Legislation_desc:0 "Thou Shall not Kill (Exodus 20:13)"
 SCO_Criminalize_Gay_Marriage:0 "Criminalise Gay Marriage"
 SCO_Criminalize_Gay_Marriage_desc:0 "The LGBTQ menace have had it good for too long. We’ll show them their place by criminalizing gay marriage. If you’re gay and married, off to jail."
 SCO_Arrest_Prominent_Gay_Leaders:0 "Arrest Prominent Gay Leaders"
 SCO_Arrest_Prominent_Gay_Leaders_desc:0 "Leaders of the LGBTQ community have become a problem by protesting our holy government. Time to arrest them and silence their opinions."
 SCO_Exile_For_Those_Who_Resist:0 "Exile For Those Who Resist"
 SCO_Exile_For_Those_Who_Resist_desc:0 "Those who aren’t part of the LGBTQ protest our actions now. Guess they no longer have to live in Scotland."
 SCO_The_Problem_Of_Migrants:0 "The Problem Of Migrants"
 SCO_The_Problem_Of_Migrants_desc:0 "Migrants continue to flood our borders. It’s time we harshen our restrictions and only allow a specific type of person to come into the nation."
 SCO_Private_Healthcare_Is_A_Requirement:0 "Private Healthcare Is A Requirement"
 SCO_Private_Healthcare_Is_A_Requirement_desc:0 "Free healthcare is a steppingstone to socialism. For migrants coming into the country, we need to require them to be a part of a healthcare company in the nation"
 SCO_Now_You_Need_A_Private_Home:0 "Now You Need A Private Home"
 SCO_Now_You_Need_A_Private_Home_desc:0 "We also should not provide them with housing. If they’re moving in, they should own a home or apartment."
 SCO_Did_We_Mention_You_Need_To_Be_Christian_Too:0 "Did We Mention You Need To Be Christian Too"
 SCO_Did_We_Mention_You_Need_To_Be_Christian_Too_desc:0 "Last thing we want is a Muslim terrorist from Libya. Any immigrant to our nation should be Catholic, or Protestant."
 SCO_A_Libertarian_Landslide:0 "A Libertarian Landslide"
 SCO_A_Libertarian_Landslide_desc:0 "The people of Scotland have chosen to free themselves from tyrannical government overstretching. Lairs time in the limelight begins"
 SCO_Lairds_Surprise_Win:0 "Lairds Surprise Win"
 SCO_Lairds_Surprise_Win_desc:0 "Lairds win surprised everyone who thought Salmond’s populist Alba party would win. Can he unite the country?"
 SCO_Free_The_Nation_From_Government:0 "Free The Nation From Government"
 SCO_Free_The_Nation_From_Government_desc:0 "Governments the most oppressive thing invented. It should exist to only make the important laws. After that, it’s called Natural Selection"
 SCO_Send_Financial_Support_To_Liberland:0 "Send Financial Support To Liberland"
 SCO_Send_Financial_Support_To_Liberland_desc:0 "Liberland is the only other libertarian country in existence. Although its only a microstate, Laird believes that sending aid to Liberland will be beneficial in the long run."
 SCO_All_Speech_Is_Free_Speech:0 "All Speech Is Free Speech"
 SCO_All_Speech_Is_Free_Speech_desc:0 "Oh, you’re offended? Who cares! It called free speech, I can say what I want!"
 SCO_Trade_With_Everyone:0 "Trade With Everyone"
 SCO_Trade_With_Everyone_desc:0 "Democratic or Communist, it really doesn’t matter. Trade equal cash, who cares about ideology."
 SCO_End_all_Tarrifs:0 "End All Tarrifs"
 SCO_End_all_Tarrifs_desc:0 "Tariffs only serve to stifle free trade and incentivize specific trading. Ending any and all tariffs serve to enrich the people."
 SCO_Remove_Government_From_Schools:0 "Remove Government From School"
 SCO_Remove_Government_From_Schools_desc:0 "For the longest time Schools have acted as a piece of government propaganda. The Libertarian party proposes removing the propaganda from schools and actually teach valuable skills."
 SCO_Legalise_Every_Drug:0 "Legalise Every Drug"
 SCO_Legalise_Every_Drug_desc:0 "The theory of natural selection states that nature is a battle for survival. If you overdose on a drug, hows that our fault. It’s just natural selection."
 SCO_Live_How_You_Want_You_Dont_Harm_Me:0 "Live How You want You Dont Harm Me"
 SCO_Live_How_You_Want_You_Dont_Harm_Me_desc:0 "Listen, do what you want, fuck who you want, drink what you want, just don’t harm me."
 SCO_Reform_The_Police_System:0 "Reform The Police System"
 SCO_Reform_The_Police_System_desc:0 ""
 SCO_A_Literal_Paradise_On_Earth:0 "A Literal Paradise On Earth"
 SCO_A_Literal_Paradise_On_Earth_desc:0 "Scotland is a libertarian paradise free from the tyrannical influence of the world and their governments."
 SCO_A_Green_Party:0 "A Green Party"
 SCO_A_Green_Party_desc:0 "The Green party won? Well, there’s a first for everything."
 SCO_The_First_Dual_Prime_Ministership:0 "The First Dual Prime Ministership"
 SCO_The_First_Dual_Prime_Ministership_desc:0 "Along with being the first Green Party win in history, the party is also making history by electing two people to the position of Prime Minister, or in this case Prime Ministers."
 SCO_Scotland_Will_save_The_Planet:0 "Scotland Will Save The Planet"
 SCO_Scotland_Will_save_The_Planet_desc:0 "While the rest of the world blathers over Capitalism V Communism. It’s our duty to create an environmentally safe country and slow global warming."
 SCO_woman_In_Stem:0 "Woman In Stem"
 SCO_woman_In_Stem_desc:0 "Women are strong and tend to care more for their work than their male counterparts. Lets introduce legislation which can get more women into environmental stem fields."
 SCO_Defund_The_Police:0 "Defund The Police"
 SCO_Defund_The_Police_desc:0 "The police serve the capitalist upper class while demonizing and arresting the lower classes at a disproportionate rate. Defunding them will obviously help the lower classes."
 SCO_Use_Penal_Labour_To_Plant_Trees:0 "Use Penal Labour To Planet Trees"
 SCO_Use_Penal_Labour_To_Plant_Trees_desc:0 "Prison reformation is a system which does not work. The prisoners sit inside all day with gangs and corrupt guards. Getting them out into the community will help them see the danger of their crimes and hopefully reform."
 SCO_Decentralise_The_Government:0 "Decentralise The Government"
 SCO_Decentralise_The_Government_desc:0 "Government is a tool of tyranny. By teaming up with Lairds Libertarians we can decentralize our lands and help the Scottish people free themselves."
 SCO_The_Green_New_Deal:0 "The Green New Deal"
 SCO_The_Green_New_Deal_desc:0 "The Green New Deal will be a drastic overhaul of not only our industrial sector but also civilian. Houses will be fitted with energy monitors and have their power forcibly shut off around 8 pm. Along with this, it will require all houses to be fitted with solar panels. Businesses will be forced to adapt Green tech, or pay a high tax."
 SCO_Introduce_Carbon_Taxes:0 "Introduce Carbon Taxes"
 SCO_Introduce_Carbon_Taxes_desc:0 "Carbon contributes to Global warming, so while drastic, we’ll tax those houses which still contribute a high amount of carbon into the world."
 SCO_Begin_A_Transition_To_Solar_Power:0 "Begin A Transition To Solar Power"
 SCO_Begin_A_Transition_To_Solar_Power_desc:0 "Since the introduction of the Green New Deal, we’re going to slowly begin shutting down the oil and coal power plants. From there we’ll transition to solar plants located out in the ocean."
 SCO_Incentivise_Eletric_Cars:0 "Incentivise Electric Cars"
 SCO_Incentivise_Eletric_Cars_desc:0 "While we’re at it, people will be getting a tax break if they buy an electric car."
 SCO_Tax_Credits_For_Green_Home:0 "Tax Credits For Green Homes"
 SCO_Tax_Credits_For_Green_Home_desc:0 "We still have houses that have done very little for the environment. It’s time we create a tax credit system, we can incentivize turning your home green."
 SCO_Scottish_Labour_Victorious:0 "Scottish Labour Victorious"
 SCO_Scottish_Labour_Victorious_desc:0 "The people of Scotland have chosen, but not socialism. Seeing the tyranny and benefits of socialism, the voters have chosen Anas Sawars Labour party to lead."
 SCO_Sawars_Administration:0 "Sawars Administration"
 SCO_Sawars_Administration_desc:0 "Sawar has forgone the typical speech given by winners and instead has opted to “dive right in” to the work at hand. Many see this as a step in the right direction and hope for the best regarding the new leader."
 SCO_Merge_The_Old_And_The_New:0 "Merge The Old And The New"
 SCO_Merge_The_Old_And_The_New_desc:0 "Socialism and Democracy can survive together. By merging the equality of the socialism and the freedom of democracy, one can believe that Democratic Socialism is what Marx really wanted."
 SCO_Encourge_Diversity:0 "Encourge Diversity"
 SCO_Encourge_Diversity_desc:0 "Diversity is strength. Not only diversity of thought, but diversity of skin color and ethnicity. Our borders are open to those seeking safety."
 SCO_change_Begins_With_The_Kids:0 "Change Begins With The Kids"
 SCO_change_Begins_With_The_Kids_desc:0 "Schools have always been a propaganda unit for the government. So why stop that, lets use the classroom to promote our agendas."
 SCO_Invite_The_Soviets_For_A_Visit:0 "Invite The Soviets For A Visit"
 SCO_Invite_The_Soviets_For_A_Visit_desc:0 "The Soviets are the biggest communist power in the world right now, but they have yet to see the real power of socialism. By inviting a prominent general to the nation, we can display our willingness to work with the Soviets, but on our terms."
 SCO_Modernize_Infrastructure:0 "Modernise Infrastructure"
 SCO_Modernize_Infrastructure_desc:0 "Infrastructure in Scotland was neglected by the English for the longest time. Sawars administration proposes a 2.1 billion pound bill to modernize and build infrastructure across the nation including highways and hospitals."
 SCO_Equalise_Wealth:0 "Equalise Wealth"
 SCO_Equalise_Wealth_desc:0 "For too long the rich have escaped heavy taxation. Under Sawar, the rich will be forced to pay their fair dues to society."
 SCO_Worker_Owned_Business:0 "Worker Owned Business"
 SCO_Worker_Owned_Business_desc:0 "While not every business will be worker owned, we can incentivize people to start their own small business. After all who will treat a worker better than another worker."
 SCO_Lower_Tarrif_Business:0 "Lower Tarrif Business"
 SCO_Lower_Tarrif_Business_desc:0 "Tariffs are a necessary part of our economic trade but lowering them surely has to incentivize other countries to trade with us."
 SCO_Support_LGBTQ_Rights:0 "Support LGBTQ Rights"
 SCO_Support_LGBTQ_Rights_desc:0 "Gay rights are human rights."
 SCO_Only_The_Beginning:0 "Only The Beginning"
 SCO_Only_The_Beginning_desc:0 "Although this administration is nearing its end, Sawar has a feeling that this is only the beginning of a democratic socialist revolution."
 SCO_Scotland_On_The_World_Stage:0 "Scotland On the World Stage"
 SCO_Scotland_On_The_World_Stage_desc:0 "With Scotland secure, it’s time for us to look to the outside world and decide our path."
 SCO_Join_The_Democratic_League:0 "Join The Democratic League?"
 SCO_Join_The_Democratic_League_desc:0 "The Democratic League presents the best alliance for us, they’re some of the only remaining free nations who share our ideas. Reaching out to them can secure us for years to come."
 SCO_Buy_Canadian_Naval_Ships:0 "Buy Canadian Naval Ships"
 SCO_Buy_Canadian_Naval_Ships_desc:0 "Our navy is severely lacking. Posing an inquiry to the Canadian government, we can hope to buy some of their older ships."
 SCO_Allow_Canda_To_Build_Military_Bases:0 "Allow Canada To Build Military Bases"
 SCO_Allow_Canda_To_Build_Military_Bases_desc:0 "As a stipulation for buying those ships, we had to allow Canada and DL forces to construct military bases on our lands. While this angers nationalists, many welcome this extra security."
 SCO_Free_Movement_Between_Faction_Members:0 "Free Movement Between Faction Members"
 SCO_Free_Movement_Between_Faction_Members_desc:0 "As part of being in the DL, our citizens can now enjoy free movement to other countries like Canada and Alaska. Soon, if more countries join, they’ll be able to travel there too."
 SCO_A_Joint_Invasion_Of_England:0 "A Joint Invasion Of England"
 SCO_A_Joint_Invasion_Of_England_desc:0 "England has fallen to tyranny. It’s time we and the Democratic League join forces to liberate the citizens of the authoritarian country."
 SCO_Restore_The_UK:0 "Restore The UK"
 SCO_Restore_The_UK_desc:0 "With the English now liberated, many want to reform the United Kingdom, but with better conditions for minority cultures. This time we’ll be a union of equals."
 SCO_Form_The_United_Kingdom_Of_Scotland:0 "Form The United Kingdom Of Scotland"
 SCO_Form_The_United_Kingdom_Of_Scotland_desc:0 "With England now liberated, many want to reform the United Kingdom but based in Edinburgh and run by the Scottish. No more Thatcher’s, and no more English superiority."
 SCO_Fortress_Scotland:0 "Fortress Scotland"
 SCO_Fortress_Scotland_desc:0 "The world is doomed, between Capitalism and Communism, the world is bound to enter another world war. By shutting ourselves off, we’ll make sure the world does not end with a bang."
 SCO_Build_The_Wall:0 "Build The Wall"
 SCO_Build_The_Wall_desc:0 "The Southern Wall is not only a border defense against the English, but it’ll help to mitigate migration into our lands."
 SCO_Close_The_Sourthern_Border:0 "Close The Southern Border"
 SCO_Close_The_Sourthern_Border_desc:0 "Finally, throwing off the last shackles of English hegemony, we’ll close our borders to them."
 SCO_Scotland_First:0 "Scotland First"
 SCO_Scotland_First_desc:0 "Scotland is for Scottish, and our policies are meant to benefit the Scottish, no one else."
 SCO_We_Walk_Our_Own_Path:0 "We Walk Our Own Path"
 SCO_We_Walk_Our_Own_Path_desc:0 "The Democratic league is nice, but it won’t bring about prosperity for the nation. It’s time we walk our own path and guarantee our own sovereignty."
 SCO_Reach_Out_To_The_Other_Celts:0 "Reach Out To The Other Celts"
 SCO_Reach_Out_To_The_Other_Celts_desc:0 "The people who will have our interests in mind are other celts. Lets reach out to them and possibly set up a conference on Maan."
 SCO_The_Celtic_Union:0 "The Celtic Union"
 SCO_The_Celtic_Union_desc:0 "The Maan conference has brought about our safety, and the Celtic Union. Similar to the European Union, the Celtic Union will bring economic prosperity to our nations, military safety, and tourism. This historic brotherhood will go down in history."
 SCO_Joint_Military_Exercises:0 "Joint Military Exercises"
 SCO_Joint_Military_Exercises_desc:0 "To gauge our military capacity, it’s time for our nations to participate in the joint military exercises. These will bring our nations militaries closer together."
 SCO_A_Celtic_Rebirth:0 "A Celtic Rebirth"
 SCO_A_Celtic_Rebirth_desc:0 "Since the Clan structure has been formalized, the Celtic culture has seen a rebirth in the nation. As we speak the Beltane is being celebrated."
 SCO_The_Royal_Question:0 "The Royal Question"
 SCO_The_Royal_Question_desc:0 "With the Union restored, but based in Edinburgh, many want to see a royal family given residence in Edinburgh Castle. The country is split down the middle with some seeking to restore the Windsors in name only, but others seek to put a Scottish family on the throne."
 SCO_Reinstate_The_Windsor:0 "Reinstate The Windsor"
 SCO_Reinstate_The_Windsor_desc:0 "Parliament has brought the Windsor family back to the UK throne, but under different circumstances. The Queen will have no impact on parliament and is now more of a celebrity than a monarch."
 SCO_Our_Turn_On_The_Throne:0 "Our Turn On The Throne"
 SCO_Our_Turn_On_The_Throne_desc:0 "Parliament has given the throne to the oldest Scottish family in the world, The Stuarts. Although German in nature, the Princess will ascend the throne as a new Queen of Scotland."
 SCO_Cement_The_Capital_In_Edinburgh:0 "Cement The Capital In Edinburgh"
 SCO_Cement_The_Capital_In_Edinburgh_desc:0 "The Union may be back but its time we cement our power in Edinburgh, not London."
 SCO_Rename_The_BBC:0 "Rename The BBC"
 SCO_Rename_The_BBC_desc:0 "The BBC is a nice piece of English culture, and a perfect government industry, but its no longer a British controlled isle. The British Broadcast Channel shall now become the Scottish Broadcast Network."
 SCO_Clan_Militarism:0 "Clan Militarism"
 SCO_Clan_Militarism_desc:0 "The Clans are soon to be at conflict with each other unless we put a levy policy into action."
 SCO_Levies_From_Each_Clan:0 "Levies From Each Clan"
 SCO_Levies_From_Each_Clan_desc:0 "Each clan shall contribute 100 of their men and women to the army of Scotland."
 SCO_All_Clans_Contrtibute_Weaponry:0 "All Clans Contribute Weaponary"
 SCO_All_Clans_Contrtibute_Weaponry_desc:0 "The idea that the clans get to keep their weaponry is a preposterous one that will only lead to more conflict. To solve this, the clans will contribute their weapons to the national army"
 SCO_Members_Are_Exempt_From_Disputes:0 "Members Are Exempt From Disputes"
 SCO_Members_Are_Exempt_From_Disputes_desc:0 "While Clan disputes are bound to happen, they’re not going to overflow into the military. Each and every levy will swear an oath of loyalty to the Council, not their clan."
 SCO_A_Set_Amount_Of_Levies:0 "A Set Amount Of Levies"
 SCO_A_Set_Amount_Of_Levies_desc:0 "To avoid angering some of the smaller clans, each and every clan will contribute a set and equal amount of levies."
 SCO_Both_Genders_Are_Too_Serve:0 "Both Genders Are To Serve"
 SCO_Both_Genders_Are_Too_Serve_desc:0 "While some believe Women to be inferior, the idea of only one gender serving is antiquated. Both genders will serve in the clan military and defend Scotland."
 SCO_User_Islands_To_Train_Soldiers:0 "Use Islands To Train Soliders"
 SCO_User_Islands_To_Train_Soldiers_desc:0 "We have abandoned Islands which no longer serve the country. We can use these to train our levies."
 SCO_Bayerns_1st_Council_Meeting:0 "Bayerns 1st Council Meeting"
 SCO_Bayerns_1st_Council_Meeting_desc:0 "Franz Von Bayern is an interesting man to say the least. His first council meeting has ended with him adopting a Scottish name and working to federalize the Clan structure."
 SCO_Adopting_A_Scottish_Name:0 "Adopting A Scottish Name"
 SCO_Adopting_A_Scottish_Name_desc:0 "As part of adopting the Scottish Culture, Von Bayern has changed his name to James Stuart III."
 SCO_The_Old_Man_Addresses_Scotland:0 "The Old Man Addresses Scotland"
 SCO_The_Old_Man_Addresses_Scotland_desc:0 "The Old Man and the council will address the Scottish people on television."
 SCO_Raise_Staties_Of_James_I:0 "Raise Statues Of James I"
 SCO_Raise_Staties_Of_James_I_desc:0 "James I is considered among the greatest Scottish. Raising statues and painting portraits of the man will only raise our sense of nationalism."
 SCO_Demonize_Queen_Anne:0 "Demonise Queen Anne"
 SCO_Demonize_Queen_Anne_desc:0 "THAT BITCH SOLD US OUT. FUCK QUEENE ANNE, ALL MY BOIS HATE QUEEN ANNE!"
 SCO_Mandatory_Gaelic_Classes:0 "Mandatory Gaelic Classes"
 SCO_Mandatory_Gaelic_Classes_desc:0 "To teach Children our culture, we will bring about the end of the English language and start teaching Gaelic in the classroom. These will be mandatory pass for all students to graduate."
 SCO_Remove_English_Influence:0 "Remove English Influence"
 SCO_Remove_English_Influence_desc:0 "The English have ruled our land for too long, now it is time for the true owners of Caledonia to rise and prosper."
 SCO_Introduce_Clan_Taxation:0 "Introduce Clan Taxation"
 SCO_Introduce_Clan_Taxation_desc:0 "To stimulate our economy, our economic stability will come from the Clans which we will tax equally."
 SCO_An_Army_Of_Clans:0 "An Army Of Clans"
 SCO_An_Army_Of_Clans_desc:0 "The Clan army is formalized and already levies come to the defense of Scotland."
 SCO_From_The_High_Clan_Police:0 "Form The High Clan Police"
 SCO_From_The_High_Clan_Police_desc:0 "Rape, murder, and other crimes are still crimes. The High Clan police will be made to handle these crimes and take over where small police units are overwhelmed."
 SCO_The_Status_Of_Political_Parties:0 "The Status Of Political Parties"
 SCO_The_Status_Of_Political_Parties_desc:0 "Political parties are a question we have to answer. Do we get rid of them, or do we keep them?"
 SCO_The_Passing_Of_The_James:0 "The Passing Of James"
 SCO_The_Passing_Of_The_James_desc:0 "James III has died of old age in his sleep. The Man whose remembered for federalizing the Clan structure which governs our daily lives. In his place an ancient right “The Trial By Combat” is happening in Edinburgh with many coming to claim the right of high council leader."
 SCO_Meechans_Rise_To_Power:0 "Meechans Rise To Power"
 SCO_Meechans_Rise_To_Power_desc:0 "Mark Meechan won the trial by combat and now assumes the title of High Council leader. Many expect his rule to be one of pure nationalism and chauvinism."
 SCO_Promote_Scottish_Culture:0 "Promote Scottish Culture"
 SCO_Promote_Scottish_Culture_desc:0 "Continuing James III policies, the Scottish Culture will be promoted extensively in an effort to end centuries of assimilation by the English tyrants."
 SCO_Promote_Scottish_Owned_Business:0 "Promote Scottish Owned Business"
 SCO_Promote_Scottish_Owned_Business_desc:0 "Scottish Business is the only business for Scottish to shop at."
 SCO_Change_Political_Requirements:0 "Change Political Requirements"
 SCO_Change_Political_Requirements_desc:0 "So while we still have English and many immigrants in the nation, we can not allow them to ascend to the Clan council. It’s our job to secure our nation by making being Scottish in blood a full requirement for any political position."
 SCO_Forming_The_Wallace_Youth:0 "Forming The Wallace Youth"
 SCO_Forming_The_Wallace_Youth_desc:0 "To train the future soldiers, we’ll build the “Wallace youth” similar to a certain youth in Germany this program will allow us to train Children in military tactics, gun cleaning, shooting, and close combat."
 SCO_End_Feminist_Clan_Policies:0 "End Feminist Clan Policies"
 SCO_End_Feminist_Clan_Policies_desc:0 "Feminism is a cancer upon the Earth. Meechan will end feminist policies on the federal level."
 SCO_Increase_Power_To_The_Clans:0 "Increase Power To The Clans"
 SCO_Increase_Power_To_The_Clans_desc:0 "The Government is an instrument of tyranny. It’s time for us to increase power to the local clans instead of with us."
 SCO_Forify_Edinburgh:0 "Fortify Edinburgh"
 SCO_Forify_Edinburgh_desc:0 "Edinburgh shall become a impenetrable fortress in which even the mighty Russian military will not get through. If Scotland goes down, she’ll take as many of the enemy as she can too hell."
 SCO_Sturgeons_Progressive_Council:0 "Sturgeons Progressive Council"
 SCO_Sturgeons_Progressive_Council_desc:0 "Ms. Sturgeons of the SNP has come out on top of Scotlands clan council. Her policies will be one of drastic change for the people of Scotland."
 SCO_Promote_Woman_To_Clan_Leaders:0 "Promote Woman To Clan Leaders"
 SCO_Promote_Woman_To_Clan_Leaders_desc:0 "Women are among the most competent people of humankind. It’s time our clans reflect that."
 SCO_Adopt_Green_Legislation:0 "Adopt Green Legislation"
 SCO_Adopt_Green_Legislation_desc:0 "While our political ways reflect the past, our industry does not. We must once again venerate the world and keep its safety our priority. We’ll adopt green legislation and force the clans to comply."
 SCO_Allow_Refugees_Into_Clans:0 "Allow Refugees Into Clans"
 SCO_Allow_Refugees_Into_Clans_desc:0 "Refugees fleeing conflict are still arriving to Scotlands borders. While we may not have a citizenship program anymore, we believe they should be allowed into Clans. By going through trials, they’ll have a chance to be accepted into any clan."
 SCO_Ask_For_Tribute:0 "Ask for Tribute"
 SCO_Ask_For_Tribute_desc:0 "Instead of taxation, we’ll ask the clans for tribute. This will guarantee an equal outcome, as clans will be able to give what they canto the government."
 SCO_Power_To_The_Council:0 "Power To The Council"
 SCO_Power_To_The_Council_desc:0 "The Council truly knows best, and sturgeons will lead Scotland into the new era."
 SCO_Womens_Council_Of_Clans:0 "Womans Council Of Clans"
 SCO_Womens_Council_Of_Clans_desc:0 "Women’s rights are at the forefront of the clans. By creating an exclusive women’s council made up of prominent clan women we can guarantee women are never crushed beneath the male boot again."
 SCO_Prevent_A_Clash_Of_Clans:0 "Prevent A Clash Of Clans"
 SCO_Prevent_A_Clash_Of_Clans_desc:0 "The Clans seems to clash every now and then. We need to make sure this never happens again so we can focus on the bigger problems."
 SCO_Form_A_High_Clan_Court:0 "Form A High Clan Court"
 SCO_Form_A_High_Clan_Court_desc:0 "To prevent Clan clashes, we’ll create a High Clan court so they can settle their disputes legally and without violence."
 SCO_Force_The_North_To_Adopt_Windmills:0 "Force The North To Adopt Windmills"
 SCO_Force_The_North_To_Adopt_Windmills_desc:0 "Windmills are some of the best producers of Green energy. Before the US collapsed, Windmills had produced power for cities like New York and Washington, so why not adopt them for Scotland."
 SCO_Subsidize_Medical_Practices:0 "Subsidise Medical Practices"
 SCO_Subsidize_Medical_Practices_desc:0 "To improve healthcare we’ll subsidize the medical area of our country to create a better healthcare system for the clans to come too."
 SCO_A_Progressive_Confederation:0 "A Progressive Confederation"
 SCO_A_Progressive_Confederation_desc:0 "Under sturgeons, many clan councils have been pissed off, but the downtrodden of the clans have felt uplifted. Our lives are better under this progressive confederation that Ms. Sturgeons has created."
 SCO_Sargons_Council:0 "Sargons Council"
 SCO_Sargons_Council_desc:0 ""
 SCO_End_Feminism_In_The_Clans:0 "End Feminism In The Clans"
 SCO_End_Feminism_In_The_Clans_desc:0 "Feminism is a cancer upon the Earth. Meechan will end feminist policies on the federal level."
 SCO_Modernize_Infrastructure2:0 "Modernise Infrastructure"
 SCO_Modernize_Infrastructure2_desc:0 ""
 SCO_A_Green_Scotland:0 "A Green Scotland"
 SCO_A_Green_Scotland_desc:0 ""
 SCO_Tidel_Power_In_The_North:0 "Tidel Power In The North"
 SCO_Tidel_Power_In_The_North_desc:0 ""
 SCO_Incentivize_inter-clan_business:0 "Incentivise Inter-Clan Business"
 SCO_Incentivize_inter-clan_business_desc:0 ""
 SCO_Fortify_The_Capital:0 "Forify The Capital"
 SCO_Fortify_The_Capital_desc:0 ""
 SCO_Returning_To_The_Old_Ways:0 "Returning To The Old Ways"
 SCO_Returning_To_The_Old_Ways_desc:0 ""
 SCO_Scotland_Is_For_The_Scottish:0 "Scotland Is For The Scottish"
 SCO_Scotland_Is_For_The_Scottish_desc:0 ""
 SCO_Close_Off_All_The_Borders:0 "Close Off All The Borders"
 SCO_Close_Off_All_The_Borders_desc:0 ""
 SCO_A_New_Age_Of_Isolation:0 "A New Age Of Isolation"
 SCO_A_New_Age_Of_Isolation_desc:0 ""
 SCO_Remove_The_english_Forcefully:0 "Remove The English Forcefully"
 SCO_Remove_The_english_Forcefully_desc:0 ""
 SCO_Leave_The_World_To_Itself:0 "Leave The World To Itself"
 SCO_Leave_The_World_To_Itself_desc:0 ""
 SCO_Scotland_Forgotten:0 "Scotland Forgotten"
 SCO_Scotland_Forgotten_desc:0 ""
 SCO_Ramsays_Council:0 "Ramsays Council"
 SCO_Ramsays_Council_desc:0 "Gordon Ramsay, chef extraordinaire has been elected to the position of high council leader. Will his reign be benevolent, or will he bring Hells kitchen to Scotland?"
 SCO_Focus_on_Inter-Clan_Crime:0 "Focus On Inter-Clan Crime"
 SCO_Focus_on_Inter-Clan_Crime_desc:0 "Inter-clan crime has become a major problem. Drugs and human trafficking are running rampant, and local police forces are overwhelmed. It’s time for the High Council to dedicate itself to stopping crime."
 SCO_Inter-Clan_Laws:0 "Inter-Clan Laws"
 SCO_Inter-Clan_Laws_desc:0 "While technically independent, the clans need laws that apply to all of them."
 SCO_Enshrine_LGBTQ_Rights:0 "Enshrine LGBTQ Rights"
 SCO_Enshrine_LGBTQ_Rights_desc:0 "Homophobia has no place in Scotland."
 SCO_Keeping_A_Close_Eye_On_Clan_Cheifs:0 "Keeping A Close Eye On Clan Cheifs"
 SCO_Keeping_A_Close_Eye_On_Clan_Cheifs_desc:0 "The Chiefs are constantly scheming to get themselves into power. We need to direct our police force towards watching the chiefs closely"
 SCO_Introducing_Harsh_Penalties:0 "Introducing Harsh Penalties"
 SCO_Introducing_Harsh_Penalties_desc:0 "For those who don’t obey us, you will face a harsh punishment."
 SCO_Bridge_The_Pay_Gap:0 "Bridge The Pay Gap"
 SCO_Bridge_The_Pay_Gap_desc:0 "The Pay gap is yet another example of the old Scotland. It’s time we mandate a minimum wage for both genders regardless of work"
 SCO_Power_To_The_Councill:0 "Power To The Council"
 SCO_Power_To_The_Councill_desc:0 "The Council knows best. The Local chiefs are brought to heel and those who obey us are being rewarded well."
 SCO_Forming_Local_Councils:0 "Forming Local Councils"
 SCO_Forming_Local_Councils_desc:0 "While we have a large amount of power, it’s time for us to leave some power to local clans. After all who knows better than locals themselves."
 SCO_Autonomous_Police_Forces:0 "Autonomous Police Forces"
 SCO_Autonomous_Police_Forces_desc:0 "Police forces will function autonomously of the clan, they’ll be responsible for upholding the law by whatever means possible."
 SCO_The_1ST_Clan_Games:0 "The 1st Clan Games"
 SCO_The_1ST_Clan_Games_desc:0 "The 1st Clan games are going to be held in Glasgow. These games will be attended by all clans and their representatives. The games are going to include many games like the log roll, track and field, Bow and arrow, fencing, and much more. Will you be attending?"
 SCO_Funding_Clan_Youth_Programs:0 "Funding Clan Youth Programs"
 SCO_Funding_Clan_Youth_Programs_desc:0 "We can not allow the youth to get mixed up in the world of crime. So by getting them involved in free programs they can give back to their clan and ultimately becoming productive members."
 SCO_Medical_Access_For_All:0 "Medical Access For All"
 SCO_Medical_Access_For_All_desc:0 "Medical access is a human right."
 WAL_Assemble_The_Welsh_Guard:0 "Assemble The Welsh Guard"
 WAL_Assemble_The_Welsh_Guard_desc:0 "Wales has finally become an independent state ready to plan its future but first we have to make sure that the Phoenix Front do not try to take back the state, the Welsh Guard will stand on the borders of Wales and England ready to protect are newly reborn state."
 WAL_Guard_The_Border:0 "Guard The Border"
 WAL_Guard_The_Border_desc:0 "With the Welsh Guard now in control of the borders we must ensure that they remain there until we have built our national army to attack or defend if needs be."
 WAL_Watch_The_Air:0 "Watch The Air"
 WAL_Watch_The_Air_desc:0 "Although Britain may not be sending in foot soldiers we have spotted many drones flying over our air space watching our movement, its time to take these drones out of the sky and prevent anymore air movement from the Phoenix Front."
 WAL_Isolate_Wales:0 "Isolate Wales"
 WAL_Isolate_Wales_desc:0 "For now, its best for Wales to isolate itself to prevent it posing as a bigger threat to the Phoenix Front. Once our nation has been armed and can defend then we can look out for friends and allies."
 WAL_Build_The_Armed_Forces:0 "Build The Armed Forces"
 WAL_Build_The_Armed_Forces_desc:0 "We have many men and woman who are willing to be conscripted into soldiers and fight for Wales against the Phoenix Front."
 WAL_Phoenix_Technology:0 "Phoenix Technology"
 WAL_Phoenix_Technology_desc:0 "Before our independence we tricked the Phoenix Front we would work with them and in return they sent us armed goods, now we have full control of our nation and its resources we can use everything the front sent us to our advantage."
 WAL_Create_The_Airforce:0 "Create The Airforce"
 WAL_Create_The_Airforce_desc:0 "We have jets and planes which were left over from the Phoenix front, we can copy the design and large-scale manufacture similar vehicles like this to create our own strong air force to combat against Britain."
 WAL_Drones_Over_The_Border:0 "Drones Over The Border"
 WAL_Drones_Over_The_Border_desc:0 "Britain wants to send drones over our border, then we shall do the same!"
 WAL_Defence_Strategy:0 "Defence Strategy"
 WAL_Defence_Strategy_desc:0 "Wales must rebuild itself and become self-sufficient. Therefore, we will only use our armed forces for defence for now until we are ready to strike back if needs be."
 WAL_Build_The_Wall:0 "Build The Wall"
 WAL_Build_The_Wall_desc:0 "Our border is a weak fence with some watch towers, we must build a big strong wall to protect our nation against the fascists."
 WAL_Propaganda_Wars:0 "Propaganda Wars"
 WAL_Propaganda_Wars_desc:0 "Recently the Phoenix Front have built speakers blasting their propaganda over our border, its time we do the same and show the English what real Welsh patriotism is!"
 WAL_The_Welsh_Parliament:0 "The Welsh Parliament"
 WAL_The_Welsh_Parliament_desc:0 "Our new parliament is finally ready to begin writing new laws and legislation. Plaid Cymru have ensured the people of Wales their freedoms will be restored, and the state will become a place the people will adore in their hearts."
 WAL_Plaid_Cymru:0 "Plaid Cymru"
 WAL_Plaid_Cymru_desc:0 "Plaid Cymru are a democratic Socialist party and now finally have the power to control the direction of Wales. With their new government they will rebuild cities and towns, create new welfare plans, and give the people the freedom they have cried for."
 WAL_New_Social_Democracy:0 "New Social Democracy"
 WAL_New_Social_Democracy_desc:0 "Plaid Cymru maybe democratic socialist but they are also strong believers in democracy, with a new branch in government being created to uphold the rights of democracy and ensure the people are given the best lives they can."
 WAL_Reopen_The_Mines:0 "Reopen The Mines"
 WAL_Reopen_The_Mines_desc:0 "The mines of Wales are rich with resources, reopening them not only provides resources for industry here in Wales but also opens doors to trade and expand on our economy."
 WAL_The_Welsh_Power_Grid:0 "The Welsh Power Grid"
 WAL_The_Welsh_Power_Grid_desc:0 "Our PowerGrid is outdated and is now facing many problems due to the Phoenix Front cutting much of our power off from England, it’s time to look to our nation and find our own ways to create power."
 WAL_Solar_Power:0 "Solar Power"
 WAL_Solar_Power_desc:0 "Solar power will help create a green efficient way to create power and restore our powerlines back to normal."
 WAL_Wind_Sea_And_Solar:0 "Wind Sea And Solar"
 WAL_Wind_Sea_And_Solar_desc:0 "Not only solar but wind and sea power will also be used on our coastal lines and in the fields and hills of Wales. The three providers will put Wales into a green energy paradise which other countries will follow."
 WAL_Mine_The_Resources:0 "Mine The Resources"
 WAL_Mine_The_Resources_desc:0 "Green energy is important but we do have to start somewhere and it takes time for the green energies to start working, for now we will mine coal and gas to provide power until we are ready to switch to all green."
 WAL_Modern_Safer_Mining:0 "Modern Safer Mining"
 WAL_Modern_Safer_Mining_desc:0 "Wales has a reputation for some mining disasters. Now Plaid Cymru has installed new modern mining tools to provide safer and more efficient ways to get resources our the ground."
 WAL_Power_The_State:0 "Power The State"
 WAL_Power_The_State_desc:0 "We finally have a working power grid which provides energy to the whole of Wales."
 WAL_Nationalise_Key_Areas:0 "Nationalise Key Areas"
 WAL_Nationalise_Key_Areas_desc:0 "Huge privatisation was implemented from the Phoenix front, many unable to afford health care and more. Now under the Welsh government rebuilding a free health care and more substituted areas will be affordable and free."
 WAL_Welsh_Education:0 "Welsh Education"
 WAL_Welsh_Education_desc:0 "No more will Phoenix influence attack our young people. The Welsh language will be taught back in schools and the young will be shown what fascism does to countries as well what its done in history."
 WAL_Bill_Of_Rights:0 "Bill Of Rights"
 WAL_Bill_Of_Rights_desc:0 "The bill of rights will give the people of Wales the human rights which were taken away by the Phoenix Front, every person of Wales will be viewed equal and be treat the same no matter who they are."
 WAL_Help_The_Refuges:0 "Help The Refugees"
 WAL_Help_The_Refuges_desc:0 "Many people from England are sneaking into our borders looking for a new life, Rather than turning them away we must accept them and help them fit into our society as well as helping those from war zones over seas."
 WAL_Welsh_Nationalism:0 "Welsh Nationalism"
 WAL_Welsh_Nationalism_desc:0 "No matter who you are, you live in Wales and must understand we pride ourselves in who we are and our heritage."
 WAL_The_Dragon_Roars_Loud:0 "The Dragon Roars Loud"
 WAL_The_Dragon_Roars_Loud_desc:0 "Wales has removed the Phoenix Front influence that was dragging the state down. Now the people live free and happy lives knowing there now protected by their national army and a government who cares for the people. "
 WAL_A_New_Alliance:0 "A New Alliance"
 WAL_A_New_Alliance_desc:0 "Its time to find our allies and friends who will work with us and help protect democracy and freedom."
 WAL_Around_The_Irish_Sea:0 "Around The Irish Sea"
 WAL_Around_The_Irish_Sea_desc:0 "The Irish Sea will help trade and relationships grow between Wales, Scotland, and Ireland. Away from English rule the sea provides a sweet spot to take advantage of for our trade."
 WAL_Meet_The_Irish:0 "Meet The Irish"
 WAL_Meet_The_Irish_desc:0 "The Irish and Welsh have always been good friends going back hundreds of years so it would make sense for both the Welsh and Irish to meet and start talking about future relationships together."
 WAL_Scotland_And_Wales:0 "Scotland And Wales"
 WAL_Scotland_And_Wales_desc:0 "Scotland and Wales share many similar values so it would make sense of both the nations to work together after being pushed under the iron fist from the Phoenix front."
 WAL_Shared_Resources:0 "Shared Resources"
 WAL_Shared_Resources_desc:0 "Using the Irish Sea, Scotland and Wales will trade resources together supporting their nations as well as sharing military technology and more."
 WAL_The_Celtic_Brothers:0 "The Celtic Brothers"
 WAL_The_Celtic_Brothers_desc:0 "The three nations of Ireland, Scotland and Wales will work together to protect democracy and freedom as well as uniting together against the Phoenix Front. Its time to create, The Celtic Protection Alliance."
 WAL_Standing_Against_The_English:0 "Standing Against The English"
 WAL_Standing_Against_The_English_desc:0 "Now an alliance has been created its time to stand against the English and show them we no longer fear their rule and we are ready to fight against them if it would ever come to that fate."
 WAL_The_Old_Clans_Of_Celtic_Brothers:0 "The Old Clans Of Celtic Brothers"
 WAL_The_Old_Clans_Of_Celtic_Brothers_desc:0 "The three nations shared old Gaelic histories and remember the old Clans. Its time to bring the clan history back and ensure the brothers stand together united."
 WAL_The_Welsh_Election:0 "The Welsh Election"
 WAL_The_Welsh_Election_desc:0 "After the removal of the fascists in England its time democracy is restored completely. Plaid Cymru have announced they will now allow elections to take place so the people of Wales can choose who they want to take control of the new state."
 WAL_The_Old_Ways:0 "The Old Ways"
 WAL_The_Old_Ways_desc:0 "Clans united, no more worrying about dictators rising and democracies falling if you can’t even establish one in the first place. Its time to go back to the old days of Wales and create clans to look after the people."
 WAL_The_Clans_Of_Wales:0 "The Clans Of Wales"
 WAL_The_Clans_Of_Wales_desc:0 "There will be different factions in Wales with different Clans, those clans will work together looking after their own county, they will meet in government in Cardiff to discuss clan laws and the future of Wales."
 WAL_Protect_The_Cities:0 "Protect The Cities"
 WAL_Protect_The_Cities_desc:0 "Were not going back to old tribal huts and real Clan days. We are just changing the system but we must also ensure that our cities are protected and the rule of law still exists."
 WAL_Tribal_Signs:0 "Tribal Signs"
 WAL_Tribal_Signs_desc:0 "We are now offering people to be tattooed with old Gaelic symbols to show they support our new system and be part of the brotherhood of clans!"
 WAL_Watch_The_Waters:0 "Watch The Waters"
 WAL_Watch_The_Waters_desc:0 "Although we now use the Irish waters, it would be foolish of us to think the English haven’t noticed this either. Its time we show them we are using these waters and we wont be pushed away from using them."
 WAL_Protecting_The_Irish_Waters:0 "Protecting The Irish Waters"
 WAL_Protecting_The_Irish_Waters_desc:0 "Scotland, Wales and Ireland have deployed warships into he Irish waters to protect our trade ships and show the English we mean business."
 WAL_Democracy_Forward:0 "Democracy Forward"
 WAL_Democracy_Forward_desc:0 "The people are ready to vote in their first independent Welsh elections."
 WAL_Choosing_The_Party:0 "Choosing The Party"
 WAL_Choosing_The_Party_desc:0 "There are three parties which have been pushed forward who could be elected to power. The Welsh Conservative Party, The current democratic socialist Plaid Cymru and The Welsh Communist Party."
 WAL_The_People_Want_Power:0 "The People Want Power"
 WAL_The_People_Want_Power_desc:0 "The people have been screaming for power for many years and now they finally have the democratic torch ready to light it and choose the direction they want their country to go."
 WAL_The_First_Welsh_Election:0 "The First Welsh Election"
 WAL_The_First_Welsh_Election_desc:0 "Here we go..Lets see who has been put into power."
 WAL_Welsh_Tories:0 "Welsh Tories"
 WAL_Welsh_Tories_desc:0 "The Welsh Tories believe in investing in the market with limited privatisation as well as the status quo, they wish to strengthen English and Welsh ties and looking to rebuild the union."
 WAL_Welsh_Nationalists:0 "Welsh Nationalists"
 WAL_Welsh_Nationalists_desc:0 "Plaid Cymru wishes to keep democratic socialism strong in Wales by pushing forward more of their ideals and ideology and ensuring the people of Wales are given a free fair chance in life."
 WAL_Welsh_Communists:0 "Welsh Communists"
 WAL_Welsh_Communists_desc:0 "Although they are communists, The Welsh communist party do not believe in dictatorship or removal of democracy, they will only implement certain communist ideals into Wales but respect the right to vote and freedoms to the people."
 WAL_What_is_our_destiny:0 "What Is Our Destiny?"
 WAL_What_is_our_destiny_desc:0 "Our armed forces have been rebuilt and we are ready to defend or attack and strike the lion back. Its time we decide our fate, do we stay isolated and focus on our Welsh state or do we attack England and force the fascists to submit themselves to the red dragon."
 WAL_Prepare_To_strike:0 "Prepare To Strike"
 WAL_Prepare_To_strike_desc:0 "It has been decided, we will prepare to strike at England and show the Phoenix Front the Celtic brothers will not stand by and be used."
 WAL_Isolate:0 "Isolate"
 WAL_Isolate_desc:0 "It is vital Wales stays independent and strong, we have plans for our future which must go ahead, already Scotland and Ireland are planning to work with us, we cannot mess this agreement up. We must be close to England but remaining isolated and alone may benefit us."
 WAL_England_Whats_Happened:0 "England Whats Happened?"
 WAL_England_Whats_Happened_desc:0 "England used to scream freedom and democracy, showing the rest of the world what freedom means, removing dictatorships. Now its fallen and a dark shadow has entered English history..We must solve this problem."
 WAL_Cut_Off_The_Resources:0 "Cut Off The Resources"
 WAL_Cut_Off_The_Resources_desc:0 "England relies on our resources and trade, removing those resources means they are cut off from large supplies cutting their industry down and making them weaker."
 WAL_Ask_The_Irish_For_Support:0 "Ask The Irish For Support"
 WAL_Ask_The_Irish_For_Support_desc:0 "Ireland worked with us when our nation was united and shared technology with us. Since the rise of the phoenix front, they have stayed away from the isle and become isolated. Its time we reach out to them and ask for their support in military and raw materials for our people."
 WAL_Change_English_History:0 "Change English History"
 WAL_Change_English_History_desc:0 "English history is being rewritten and removed, education centres in England are changing the way people think and how they viewed the world in the past. We must ensure the English people remember history and the direction their country could be heading."
 WAL_FOR_WALES_AND_FOR_FREEDOM:0 "FOR WALES AND FOR FREEDOM"
 WAL_FOR_WALES_AND_FOR_FREEDOM_desc:0 "ITS TIME WE TAKE ENGLAND AND RESTORE DEMOCRACY!"
 WAL_The_Welsh_Kingdom:0 "The Welsh Kingdom"
 WAL_The_Welsh_Kingdom_desc:0 "England has fallen and we take its land, now we will no longer be a small, isolated nation but instead a nation which is tall, strong and accepts our Welsh heritage. The Welsh Kingdom will stand tall on the world stage."
 WAL_Restore_the_uk:0 "Restore The UK"
 WAL_Restore_the_uk_desc:0 "We now hold the lands of England and now we are ready to restore the old back into the hearts of all our people and rebuild our union!"
 WAL_Puppet_England:0 "Puppet England"
 WAL_Puppet_England_desc:0 "Even before the Phoenix Front Wales was left behind in the political landscape, now we can do the same with England and puppet it, they will take their orders from Cardiff rather than London."
 ENG_The_New_Relationship:0 "The New Relationship"
 ENG_The_New_Relationship_desc:0 "Canada, Australia, New Zealand, and the United Kingdom share very similar values and also share the same monarchy. The four countries maybe on different sides of the world but if those countries worked together and formed a partnership the faction could be one of the strongest in the world as well as a strong GDP."
 ENG_Anglo_Canada_Relations:0 "Anglo Canada Relations"
 ENG_Anglo_Canada_Relations_desc:0 "Canada and the UK share the same types of values and are both known to be very politic countries which has been mocked in the past. Building up those relationships could be very beneficial for the future."
 ENG_New_Trade_Deal:0 "New Trade Deal"
 ENG_New_Trade_Deal_desc:0 "Its time to secure a great trade deal with Canada which allows us to import and export out produce and their produce with pretty much zero tariffs."
 ENG_A_New_Offer:0 "A New Offer"
 ENG_A_New_Offer_desc:0 "The Prime minister has spoken before about a CANZUK relationship and this is exactly what the PM will now offer to the Canada prime minister. A strong economic boost, military cooperation as well as duel research boosting technology and science between the nations."
 ENG_Canadian_Visits:0 "Canadian Visits"
 ENG_Canadian_Visits_desc:0 "The Prime Minister has made his way to Canada for a state visit to see the country and discuss future relations with the UK and Canada."
 ENG_Anglo_Australia_Relations:0 "Anglo Australia Relations"
 ENG_Anglo_Australia_Relations_desc:0 "Australia and Britain share the same values and cultures, they pretty much are the british but always get the hot weather the lucky bunch! Now its time to build the relationship stronger and become the old buddies they once were."
 ENG_Australia_Arms_Deals:0 "Australia Arms Deals"
 ENG_Australia_Arms_Deals_desc:0 "Australia has a strong military presence in the area next to New Zealand and China, not long after they joined the democratic league, they underwent a huge transformation of their armed forces and became a strong force. With a new relationship being built why not take advantage of both of our military industries."
 ENG_An_Old_Family_Member:0 "An Old Family Member"
 ENG_An_Old_Family_Member_desc:0 "Its time to properly welcome our old friend back and ask for their PM to come over for a state visit and we can properly discuss the future of our nations and how we can rebuild the free world together."
 ENG_A_Offer_To_Think_About:0 "An Offer To Think About"
 ENG_A_Offer_To_Think_About_desc:0 "We have thrown in the idea of CANZUK to Australia, they seem open to it and believe it could be a great way to secure our nations together for security and economic purposes as well as more freedom for our people."
 ENG_Increase_Unrest:0 "Increase Unreset"
 ENG_Increase_Unrest_desc:0 "Firstly we must bring the government of New Zealand instability so we can take advantage of their weakness. Once the people of their nation realise we are wanting to bring change and freedom, we are sure the people will want this too..Lets create a movement there."
 ENG_New_Zealand_Democracy_Talks:0 "New Zealand Democracy Talks"
 ENG_New_Zealand_Democracy_Talks_desc:0 "Democracy really is a wonderful thing and it allows countries to listen and learn as well as letting their people have the freedom to do as they wish. Unfortunately New Zealand does not see things that way. Its time to show them the likes of how Australia does things and how democracy could make their nation stronger and stable than it could be now."
 ENG_Force_The_Nationals_To_Listen:0 "Force The Nationals To Listen"
 ENG_Force_The_Nationals_To_Listen_desc:0 "The Nationals are refusing to listen so now its time to make a point, if they refuse to listen the pact will force the current administration out and we will deal with it our way."
 ENG_The_People_March:0 "New Zealand Rises Up"
 ENG_The_People_March_desc:0 "It seems the unrest plan worked, millions across the nation rose up against their leader, Winston Peters. He has now agreed to talks with us and is starting to see the change we can already bring to his nation, whether it be good or bad."
 ENG_The_Solution_For_NZ:0 "The Solution For NZ"
 ENG_The_Solution_For_NZ_desc:0 "We have a plan, although Winston would never give up his role as leader he has agreed to a duel coalition with the New Zealand centre left party, ‘The Labor Party’. This way the people of the nation will finally be represented and have the freedom they desire but also Winston still can remain in control of his country."
 ENG_CAN_UK_AST:0 "CAN UK AST"
 ENG_CAN_UK_AST_desc:0 "Australia and Canada have agreed that CANZUK would be a positive movement for change and they are willing to create a faction for protection, freedom and linked research for technology and science."
 ENG_Join_The_Club:0 "Join The Club"
 ENG_Join_The_Club_desc:0 "After the sudden changes that has come upon New Zealand the nation with its two leaders have now agreed they are now ready to join the alliance and will accept the proposal of, CANZUK."
 ENG_Scientific_Researchh:0 "Scientific Research"
 ENG_Scientific_Researchh_desc:0 "One of the agreements of CANZUK was the shared intelligence of science and technology. The four nations will work together to become a powerhouse of the world with new technology creations and leading in medicine and science."
 ENG_Shared_Space_Agency:0 "Shared Space Agency"
 ENG_Shared_Space_Agency_desc:0 "The future looks bright and so does the stars, its time the nations put their heads together and become to plan a new space agency. The space race can truly begin again."
 ENG_The_Envy_Of_Nations:0 "The Envy Of Nations"
 ENG_The_Envy_Of_Nations_desc:0 "Many nations are starting to turn green, Russia, The American republic and even China have started to disapprove of our united front. It seems those countries are unable to understand the true benefits of this pact and how it will change the world for good."
 ENG_Lower_Company_Taxes:0 "Lower Company Taxes"
 ENG_Lower_Company_Taxes_desc:0 "You know what would be great? If businesses from overseas set up shop here and could afford too with low taxes as well as increasing employments and helping by putting money into our economy..Wouldnt that just be great?"
 ENG_United_Jobs_Market:0 "United Jobs Market"
 ENG_United_Jobs_Market_desc:0 "Rather than just local jobs being advertised, now we have established CANZUK and free movement we can offer jobs overseas to our people no longer restricting them!"
 ENG_Invest_In_CANZUK_Industry:0 "Invest In CANZUK Industry"
 ENG_Invest_In_CANZUK_Industry_desc:0 "Now its time for all four nations to invest in each other’s nations industries to ensure none of those companies will go bankrupt as well as future investment for future industry to be created!"
 ENG_The_CANZUK_Job_Movement:0 "The CANZUK Job Movement"
 ENG_The_CANZUK_Job_Movement_desc:0 "It seems the job market truly is being picked up quick and more and more jobs are opening up! Its time to introduce easier ways for our people to work abroad or other people from different nations to come here to work."
 ENG_A_Strong_Shared_Economy:0 "A Strong Shared Economy"
 ENG_A_Strong_Shared_Economy_desc:0 "With the huge increase of investment and jobs being created in the faction its time to share the economy together by creating a type of ‘pot’ which will allow budgets to be created for each nation and what can be spent on certain projects."
 ENG_Defence_Pact:0 "Defence Pact"
 ENG_Defence_Pact_desc:0 "Although CANZUK was primarily created for trade and close cooperation many agree its also best to create a military alliance, the day of NATO are over, and the defence league is starting to become outdated. Now the four nations can combine their strong military together and become a power to be feared."
 ENG_Joint_Military_Exercises:0 "Joint Military Exercises"
 ENG_Joint_Military_Exercises_desc:0 "The four nations have agreed that its now time to put our armies together and work together in future exercises to train each other up ready for any type of future war that could involve us."
 ENG_Not_Another_NATO:0 "Not Another NATO"
 ENG_Not_Another_NATO_desc:0 "Although we seem similar to what NATO was we definitely are not that. We are only four nations with similar values, we speak the same language, celebrate the same holidays and now we work and live together. "
 ENG_A_New_Communist_Rival:0 "A New Communist Rival"
 ENG_A_New_Communist_Rival_desc:0 "CANZUK may pose a threat to many nations around the world but only the communists are the true threat, their influence in the past is beyond terrifying and have toppled governments. As some nations turn red its our job to ensure our four nations hold the torch of democracy."
 ENG_Deal_With_The_Europe_Problem:0 "Deal With The Europe Problem"
 ENG_Deal_With_The_Europe_Problem_desc:0 "Europe is under going some major chances, with the European spring now in full force, a major refugee crisis and the Soviet Union under threat, its time we spread our influence to the European mainland and show them what the power of democracy can really do."
 ENG_Brothers_In_Arms:0 "Brothers In Arms"
 ENG_Brothers_In_Arms_desc:0 "Canada, Australia, New Zealand, and the United Kingdom have come together to defend their nations, united and ready to face any threat. The four brothers are on standby ready to defend each other."
 ENG_CANZUK_And_The_Alliance:0 "CANZUK And The Alliance"
 ENG_CANZUK_And_The_Alliance_desc:0 "CANZUK isn’t just for trade, its officially for the future of the democratic world and its freedom. With our new military power, wide influence over the world and combined GDP we surely are a force to be reckoned with."
 ENG_New_Military_Funding:0 "New Military Funding"
 ENG_New_Military_Funding_desc:0 "Now our faction is a true military force its time to invest heavily in our armed forces and ensure our boys and girls who may fight on the front lines have the best technology and protection needed to win future wars."
 ENG_Shared_Arms:0 "Shared Arms"
 ENG_Shared_Arms_desc:0 "No longer will we be self-fish and keep military to ourselves, we are a shared community and with that so is our military. Sharing our weapons and technology will only allow us to advance further."
 ENG_Form_CANZUK:0 "Form CANZUK"
 ENG_Form_CANZUK_desc:0 "Its official, the four nations have created the CANZUK community and with that its time to decide our future. Its time to create CANZUK."
 ENG_Choosing_A_Faction_Title:0 "Choosing A Faction Title"
 ENG_Choosing_A_Faction_Title_desc:0 "Now we have established our title and flag, its time to choose what our faction’s name will be, we have picked a few suggestions we believe could work."
 ENG_Watch_America:0 "Watch America"
 ENG_Watch_America_desc:0 "The American Republic is not a threat to us, in fact they are a close friend of ours which we regularly work with. Unlike the union of American peoples republic and the American commonwealth. Those nations spread their leftist ideologies like a virus and could pose a real threat to us in the future if we allow them to."
 ENG_Europe_Needs_A_Push:0 "Europe Needs A Push"
 ENG_Europe_Needs_A_Push_desc:0 "Europe is on a knife edge and we must take advantage of this. With the downfall of some countries we can target those countries which are about to collapse and be ready to install a true democratic leader."
 ENG_Prepare_For_Soviet_Attacks:0 "Prepare For Soviet Attacks"
 ENG_Prepare_For_Soviet_Attacks_desc:0 "The Soviet Union has blasted our alliance since the start of its creation and with the intel we are receiving we believe they could be ready to attack us in the near future if we are not prepared and ready to strike first."
 SCO_Leonard_Ascendant:0 "Leonard Ascendant"
 SCO_Leonard_Ascendant_desc:0 "Leonard has finally ascended to the rank of Chairman and is finally ready to bring Scotland into the red world."
 SCO_1st_Peoples_Congress:0 "1st Peoples Congress"
 SCO_1st_Peoples_Congress_desc:0 "Now that the proletariat owns Scotland, its time we establish a congress which actually represents the workers of the world."
 SCO_Education_Reform:0 "Education Reform"
 SCO_Education_Reform_desc:0 "While some adults may not fully accept a communist state, kids are moldable to our ideology. It’s time we reform education."
 SCO_All_Are_Born_Equal:0 "All Are Born Equal"
 SCO_All_Are_Born_Equal_desc:0 "Anyone who is born in scotland are to be equal"
 SCO_Demoize_Industrialists:0 "Demoize Industrualists"
 SCO_Demoize_Industrialists_desc:0 "Industrialists are the bane of the working man and woman. It’s time we teach people to hate the idea of owning a successful business. The only success they should worry about is the success of the government."
 SCO_Subsidze_Communist_Youth_Programs:0 "Subsidze Communist Youth Programs"
 SCO_Subsidze_Communist_Youth_Programs_desc:0 "Adding on to our youth initiative, we can get kids involved in Communism, whether its in the universities or the playgrounds."
 SCO_The_Scottish_Politburo:0 "The Scottish Politburo"
 SCO_The_Scottish_Politburo_desc:0 "While the peoples congress deals with the Red world outside of Scotland, the Politburo will help the common man."
 SCO_Industrialization:0 "Industrialization"
 SCO_Industrialization_desc:0 "Since we lost all forms of industrialization, its time we establish state owned businesses and industry."
 SCO_1st_Five_Year_Plan:0 "1st Five Year Plan"
 SCO_1st_Five_Year_Plan_desc:0 "While a success by our standards, its allowed us to get back on our feet."
 SCO_State_Owned_Industry:0 "State Owned Industry"
 SCO_State_Owned_Industry_desc:0 "The state will own, operate, and influence the industrial sector of the country. The worker will work for the state, whats better than that?"
 SCO_Eastern_Labour_Camps:0 "Eastern Labour Camps"
 SCO_Eastern_Labour_Camps_desc:0 "Dissidents and naysayers should not be allowed to remain in society when they could be working for it. For the small price of forever, you too can be shipped out to soviet style gulags in the east and work for the rest of your life. The work will set you free!"
 SCO_Develop_Southern_Farm_Land:0 "Develop Southern Farm Land"
 SCO_Develop_Southern_Farm_Land_desc:0 "The farms of the south need to be collectivized to ensure their continued productivity. Collective farming is the way of the future."
 SCO_Expand_Northern_Oil_Fields:0 "Expand Northern Oil Fields"
 SCO_Expand_Northern_Oil_Fields_desc:0 "Forget environmental legislation, that was all made under the old English rule. It’s time we tap the oil wells dry."
 SCO_Raise_Taxation_On_The_Middle_Class:0 "Raise Taxation On The Middle Class"
 SCO_Raise_Taxation_On_The_Middle_Class_desc:0 "While technically classless, it is true that there’s a middle class within the country. How’re we going to fix that? By taxing the absolute hell out of them. Once everyones poor, then we’re equal."
 SCO_Develop_The_Fishing_Industry:0 "Develop The Fishing Industry"
 SCO_Develop_The_Fishing_Industry_desc:0 "As said before, it’s time for us to put the environment to the side and make nature work for us. Lets put the workers on boats and give them “fish quotas”"
 SCO_End_The_1st_5_Year_Program:0 "End The 1st 5 Year Program"
 SCO_End_The_1st_5_Year_Program_desc:0 "While a success by our standards, its allowed us to get back on our feet."
 SCO_Address_Political_Freedom:0 "Address Political Freedoms"
 SCO_Address_Political_Freedom_desc:0 "Why have different political parties when we communists are the best thing for you. If you’re not registered with the party, what are ya? A filthy fucking capitalistic pig?"
 SCO_Form_The_SVD:0 "Form The SVD"
 SCO_Form_The_SVD_desc:0 "To keep the more rebellious aspects of society quiet, the secret police or the Scottish Veneration Divisions will be in charge of blending in with civilian populations and making sure the Revolution is allowed to continue, without capitalist or fascist problem making."
 SCO_Ending_Capitalism:0 "Ending Capitalism"
 SCO_Ending_Capitalism_desc:0 "FULL EQUALITY. For years universities have said Capitalism sucks, while its time we end it!"
 SCO_Utilize_Antifa_Mobs:0 "Utilize Antifa Mobs"
 SCO_Utilize_Antifa_Mobs_desc:0 "We can work to spread communism by funding antifa mobs in other countries."
 SCO_The_Edinburgh_Trials:0 "The Edinburgh Trials"
 SCO_The_Edinburgh_Trials_desc:0 "With our government stable, its time for us to rid ourselves of the enemies of the state. We’ll put them on trial in the capitol, and leave a jury of the workers to sentence them."
 SCO_Execution:0 "Execution"
 SCO_Execution_desc:0 "The jury has decided and the filthy capitalists, industrialists, and dissidents will be summarily executed."
 SCO_Send_To_The_Labour_Camps:0 "Send To The Labour Camps"
 SCO_Send_To_The_Labour_Camps_desc:0 "The jury has decided, and the people shall be sent back to the work camps."
 SCO_Begin_A_Propaganda_Campaign:0 "Begin A Propaganda Campaign"
 SCO_Begin_A_Propaganda_Campaign_desc:0 "Statues of Leonard next to Lenin will be raised all over the country. This will be in an effort to make people realize how liberating communism is."
 SCO_Leonard_A_Friend_To_The_People:0 "Leonard A Friend To The People"
 SCO_Leonard_A_Friend_To_The_People_desc:0 "Leonard, is a true friend to the people. They’ve only got to realize it."
 SCO_A_Picture_In_Every_Room:0 "A Picture In Every Room"
 SCO_A_Picture_In_Every_Room_desc:0 "Some people have Jesus in their room, we Scots have Leonard in just about every room."
 SCO_Socializing_Medicine:0 "Socialising Medicine"
 SCO_Socializing_Medicine_desc:0 "homeless die of preventable diseases, and other ailments. By giving everyone access to medical care we can save lives."
 SCO_Free_University:0 "Free University"
 SCO_Free_University_desc:0 "Under the English, we Scots were deprived of education in good schools. With the communists in charge we can give each and every child a quality education, while also teaching them socialist ideology"
 SCO_State_Housing_For_The_Poor:0 "State Housing For The Poor"
 SCO_State_Housing_For_The_Poor_desc:0 "Homelessness is a problem in every city across the nation. By building apartments, we can reduce the homeless problem, give them a roof over their head, a hot meal, and show them the true socialist way"
 SCO_Keep_The_Catholic_Church:0 "Keep The Catholic Church"
 SCO_Keep_The_Catholic_Church_desc:0 "Scotland will remain part of the catholic cutlure as our nation shall remain christian."
 SCO_A_Red_Scotland:0 "A Red Scotland"
 SCO_A_Red_Scotland_desc:0 "Now that we’re a fully established communist nation, it’s time for us to look out to the world and decide our future."
 SCO_Reach_Out_To_The_Russians:0 "Reach Out To The Russians"
 SCO_Reach_Out_To_The_Russians_desc:0 "The Russians are obviously a superpower, so why not reach out to them."
 SCO_The_4th_Internationale:0 "The 4th Internationale"
 SCO_The_4th_Internationale_desc:0 "The Russians are fake fucking commies! It’s time we form our own comintern and show the world what true equality is."
 SCO_Inviting_The_Italians:0 "Inviting The Italians"
 SCO_Inviting_The_Italians_desc:0 "The Italians have always been a drastic change of pace from the Soviets."
 SCO_Recognize_The_East_Coast_Amercians:0 "Recognise The East Coast"
 SCO_Recognize_The_East_Coast_Amercians_desc:0 "If we recognize the Peoples commonwealth on North Americas coast, then maybe, just maybe we can get them to join the 4th."
 SCO_Condemn_The_Fakes:0 "Condemn The Fakes"
 SCO_Condemn_The_Fakes_desc:0 "Our address to the world will expose how tyrannical Stalinist communism is. We’ll liberate the Russian Workers whether they like it or not."
 SCO_Liberate_Europe:0 "Liberate Europe"
 SCO_Liberate_Europe_desc:0 "The time has come, we’ll land on the beaches and liberate the Comintern from the Stalinist ways of Russia, or liberate their minds from their bodies."
 SCO_Joining_The_Rest_Of_Europe:0 "Joining The Rest Of Europe"
 SCO_Joining_The_Rest_Of_Europe_desc:0 "The Russians will guarantee us practical invulnerability. Lets make an offer to join the Warsaw Pact."
 SCO_Condemn_Remaining_Capitalists:0 "Condemn Remaining Capitalists"
 SCO_Condemn_Remaining_Capitalists_desc:0 "Why be capitalist when the world obviously wants us to be communist?"
 SCO_Joining_The_Economic_Bloc:0 "Joining The Economic Bloc"
 SCO_Joining_The_Economic_Bloc_desc:0 "Lets join the economic bloc of Europe and only prosper as we move forward."
 SCO_Allowing_A_Military_Presence:0 "Allowing A Military Presence"
 SCO_Allowing_A_Military_Presence_desc:0 "A Red World, needs a Red Military to protect it. Lets give the soviets some bases."
 SCO_Joining_The_EU:0 "Joining The EU"
 SCO_Joining_The_EU_desc:0 "The EU will connect us to our forgotten brothers and sisters across the world."
 MER_Attack_Wessex:0 "Attack Wessex"
 MER_Attack_Wessex_desc:0 "Time to remove Farage from power and give the people of Wessex Freedom"
 MER_Attack_Kent:0 "Attack Kent"
 MER_Attack_Kent_desc:0 "Time to remove Patel from power and give the people of Kent Freedom"
 MER_Attack_East_Anglia:0 "Attack East Anglia"
 MER_Attack_East_Anglia_desc:0 "Time to remove Boris from power and give the people of East Anglia Freedom"
 MER_Take_Cornwall:0 "Take Cornwall"
 MER_Take_Cornwall_desc:0 "Time to remove the leader of Cornwall from power and give the people of Corwall Freedom"
 MER_Take_Northumbria:0 "Take Northumbria"
 MER_Take_Northumbria_desc:0 "Time to remove Jamie from power and give the people of Northumbria Freedom"
 MER_Rebuild_Britian:0 "Rebuild Britain"
 MER_Rebuild_Britian_desc:0 "Its time to rebuild Britain back to its old times"
