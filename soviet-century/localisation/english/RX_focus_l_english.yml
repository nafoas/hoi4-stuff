 WES_Take_Northumbria_desc:0 "Time to remove Jamie from power and give the people of Northumbria Freedom"
 WES_Rebuild_Britian:0 "Rebuild Britain"
 WES_Rebuild_Britian_desc:0 "We now own the island of Britain. Its time we create our paradise!"
 FRA_The_2010_Address:0 "The 2010 Address"
 FRA_The_2010_Address_desc:0 "After failed reforms in the past years causing the economy to collapse, social tensions rising and overall life satisfactory falling, France is in very bad shape. Now Melenchon is leader and is known as a recognizable reformer, it is time he takes the reins and makes critical reforms that will HOPEFULLY make France a strong country in the union and fix the social issues causing the country to collapse. "
 FRA_Fixing_The_Real_Problems:0 "The France Fix"
 FRA_Fixing_The_Real_Problems_desc:0 "The party must be made to understand that reform is the only way forward for our country. Without reform in the highest levels of the country, France may collapse into anarchy."
 FRA_Replace_The_Politburo:0 "Replace members of the Politburo"
 FRA_Replace_The_Politburo_desc:0 "Many Old Guard members of the Politburo need to be replaced, lest France stagnates. A Canadian reality tv star said it best, “You’re fired”. "
 FRA_Choose_New_Advisors:0 "Choose New Advisors"
 FRA_Choose_New_Advisors_desc:0 "Many have tried to fix the problems of France, and most of the time they end up making the situation worse. If we are to fix this country and reform socialism, we need to do this correctly otherwise France may not survive."
 FRA_Advisor_For_Public_spending:0 "Advisor for public spending"
 FRA_Advisor_For_Public_spending_desc:0 "Due to out-of-control spending on the public sector of the country its time to really get someone to advisor us on how we can spend out money correctly, choosing what infrastructure to be spent on, if we should improve public transport and more."
 FRA_Advisor_For_Education:0 "Advisor For Education"
 FRA_Advisor_For_Education_desc:0 "Education is one of the lowest funded areas of the country. Children are being turned into propaganda machines. They learn about the rise of the soviets and how the west accepted socialism, but they don’t understand why socialism is the most logical answer for suffering. One reform proposed is allocating more funding to education and changing the national curriculum.  "
 FRA_Advisor_For_Work_and_Production:0 "Advisor For Work And Production"
 FRA_Advisor_For_Work_and_Production_desc:0 "Our unions are the backbone of our socialistic country, without them, we are no better than those capitalist pigs. Our reforms will include sections which detail the better treatment of unions, the ending of state ran unions and introduce a bit of independence into the proletariat’s life. "
 FRA_Advisor_For_State_Activity:0 "Advisor for State Activity"
 FRA_Advisor_For_State_Activity_desc:0 "We need someone to look at France and see the big picture, what really needs to change the big questions, someone who can see the issues and know exactly how to overcome them. Once we have this France can be turned into a glory state. The hammer and sickle are representative of our communist rule. As we engage the Politburo in debate on reforms, the hammer and sickle are flying high and inspiring all of us to do our best. "
 FRA_Votes_On_Reforms:0 "Vote on Reforms"
 FRA_Votes_On_Reforms_desc:0 "Now we have our advisors at the ready to change France, its time we push the vote to our party and ready the state. This is going to be one of the biggest moments in our lives and now it lies in the party’s hands."
 FRA_The_Vote_Passes:0 "The Vote Passes"
 FRA_The_Vote_Passes_desc:0 "The party has overwhelmingly voted for the reforms, its time France changes and becomes a strong communist state in which stands tall in the Warsaw pact. Melenchon can begin his changes and the people of France can cheers for a better standard of life! France has reason to celebrate, reform will come to the general population and our economic downturn will finally end. "
 FRA_Melenchon_Begins_His_Reforms:0 "Melenchon begins his Reforms"
 FRA_Melenchon_Begins_His_Reforms_desc:0 "At last, we are finally here, the big reform movement can begin. Melenchon has begun to sign bills which will legalise new methods of work and movement around the country, today we begin the 2010 reform act and make France a strong and competitive country. "
 FRA_The_Vote_Fails:0 "The Vote Fails"
 FRA_The_Vote_Fails_desc:0 "The party has chosen to refuse to accept the reforms, we must try and find a way to solve this crisis. There is only limited time, and the people grow restless with new leadership becoming ever so normal we must bring stability to France and show the party this is no time to mess around."
 FRA_Deadlock:0 "Deadlock"
 FRA_Deadlock_desc:0 "This has not gone the way that was predicted, the Politburo is blockading every attempt at reform. The old guard are not willing to look at reform in a positive light and instead are reinforcing Stalinist views. As we stand in the politburo looking at the state of our party, the country and most of all the people we are letting down we must speak directly to the party and plead with them."
 FRA_Persuade_the_party:0 "Persuade The Party"
 FRA_Persuade_the_party_desc:0 "We must speak to the party and tell them that this is the only way to fix the mess France is in, although these changes may not be the complete communist way, it could fix the country and we can use this as a temporary measure to fix the country until we can return to the real socialist system...The situation is dire to say the least. The proletariat suffer while the Politburo refuses to help. "
 FRA_Talk_With_The_Hardliners:0 "Talk with the hardliners"
 FRA_Talk_With_The_Hardliners_desc:0 "Unfortunately, we still have some hard-line communists who will refuse to back down and let change happen. We will speak with them directly and make sure they understand this is only a temporary fix and that many other reforms have been tried and failed. We will make a deal that if we can implement certain reforms, we will still be a one true party communist state. "
 FRA_convince_The_Rev_Socialists:0 "Convince The Revolutionary Socialists"
 FRA_convince_The_Rev_Socialists_desc:0 "The revolutionary socialists are not pure communists, they do believe some elements of capitalism can exist in a soviet world. Therefore, we can speak direct to those members and ask for their support for changes and in return we can implement some of their own policies they would want."
 FRA_2010_Modified_Reform_Act:0 "2010 Modified Reform Act"
 FRA_2010_Modified_Reform_Act_desc:0 "We have struck a deal and we can implement the reforms…just not everything we wanted. We can still focus on the big issues for now and get those fixed. Maybe after we can get the rest of the other issues fixed if we show the politburo that these new reforms have worked, we can implement the rest..we hope.."
 FRA_Limited_reforms:0 "Limited Reforms"
 FRA_Limited_reforms_desc:0 "The reforms have been agreed upon, we can only establish a few of these reforms but at least its something we can do to change France even if its just a small change its better than what we have already isn’t it?"
 FRA_French_red_education:0 "Red Education"
 FRA_French_red_education_desc:0 "Changing the way education is taught in the state is vital as the children are our future and they must carry on our lessons and how Melenchon was able to change how the state was lead. Other lessons must be taught on France as not just communism is the important key to education."
 FRA_Better_Infrastructure:0 "Better Infrastructure"
 FRA_Better_Infrastructure_desc:0 "Modernisation has finally come to France, its time the state finally accepted that it has reached the 2000s and should begin the full transformation of its old-style communist design and move into the modern 2010 communist infrastructure."
 FRA_Better_Housing:0 "Better Housing"
 FRA_Better_Housing_desc:0 "After many years of old run-down state housing, its time the housing council came together and draft up plans to modernise the houses for the French people. No longer will they have to suffer with grey old boring flats rather new modern housing and high-rise living quarters."
 FRA_Increase_Production_In_The_State:0 "Increase Production In The State"
 FRA_Increase_Production_In_The_State_desc:0 "Production has come to a standstill, a lot of the products in France is imported and the state heavily relies on trade from other communist nations. Now is the time to change that and bring in our own fine production to sell to our neighbouring states."
 FRA_Reforms_For_state_Media:0 "Reforms For state Media"
 FRA_Reforms_For_state_Media_desc:0 "The people of our great state only get news from what we choose to give out by our own broadcaster. Its time this changes and give the people more freedom to see what is being broadcast around the world and not just see what our communist brothers are doing but also how the capitalists do suffer."
 FRA_Copy_Western_Tech:0 "Copy Western Tech"
 FRA_Copy_Western_Tech_desc:0 "Our technology is weak and poor. Our computers and laptops are 10-15 years behind the likes of other nations. We need to bring our state up to date with technology and devices. We can achieve this in certain ways to fast track this bypass!"
 FRA_Limits_On_Social_Media:0 "Limits On Social Media"
 FRA_Limits_On_Social_Media_desc:0 "After much debate its time we allow our people to be able to reach the outside world and let them see what the people of capitalist nations get up to in their free time, if it’s not them sharing stories of them finding lost dogs or sharing movie quotes. Either way its something to give our people a bit more of a enjoyment and more freedom."
 FRA_Final_Push:0 "Final Push"
 FRA_Final_Push_desc:0 "Now that the reforms have been pasted, although not all the reforms Melenchon wanted, the reforms he thought could be the biggest impact have been passed and written into law. Now is the time to celebrate a new beginning for France and watch as the people embrace such new change and push for the better standards of living. "
 FRA_Melenchon_reforms:0 "Melenchon Reforms"
 FRA_Melenchon_reforms_desc:0 "After a vote in the politburo, the party has agreed the reforms are needed and have accepted this new change. The vote has been passed and now the party can begin their sweeping changes to France"
 FRA_discuss_Inflation:0 "Discuss Inflation"
 FRA_discuss_Inflation_desc:0 "After many long hard years of inflation, the French franc being worth close to nothing, the people only able to afford the basics. Times have now changed. Melenchon has presented one of his first reforms to combat this and even thinking about an adoption of the new Euro?"
 FRA_Speak_To_The_Politburo:0 "Speak To The Politburo"
 FRA_Speak_To_The_Politburo_desc:0 "Now that Melenchon has asserted his dominance in the party he can now freely speak to the politburo and his party, talking about how his reforms are what is needed to fix France and give the workers their proud nation back on the footsteps of the world stage. "
 FRA_Unite_The_PCF:0 "Unite The PCF"
 FRA_Unite_The_PCF_desc:0 "After the vote, we were able to unite the PCF and no longer must deal with divisions in the party. Now we can enter a new decade together united ready to transform the French state together. The people can look at our party and finally see that we are now stable and ready to work with one another to build a better tomorrow."
 FRA_2010_reforms:0 "2010 Reforms"
 FRA_2010_reforms_desc:0 "After years are long stagnations and depression the people of the French state can finally awaken to fine their average life is slowly improving making their lives more enjoyable and finally starting to see a life at the end of the tunnel. Today marks the day France changes for the better and no longer the worse."
 FRA_limited_western_influence:0 "Limited Western Influence"
 FRA_limited_western_influence_desc:0 "We have followed communist and socialists nations for a long time, we have been bound by rules and regulations and therefore we have only limited our people, now we can slowly trade limited products with other nations outside the pact and help build a stronger economy.  "
 FRA_high-quality_living_standards:0 "High Quality Living Standards"
 FRA_high-quality_living_standards_desc:0 "Now our reforms are being signed into power and changing France, we can begin to introduce better of standards of living for the people like a stronger more better welfare system and fix the housing crisis the country is facing."
 FRA_fix_taxation:0 "Fix Taxation"
 FRA_fix_taxation_desc:0 "Under the previous leadership taxes were raised to try and fix the economy, this caused huge issues like mass homelessness and people unable to afford to buy necessities. Reforms on taxes must be taken to ensure people can afford what they need again."
 FRA_safeguard_the_Status_Quo:0 "Safeguard The Status Quo"
 FRA_safeguard_the_Status_Quo_desc:0 "There are changes which are to come to France but what’s most important is making sure we keep the communist ideals in all our peoples heads, knowing that they are still part of a strong communist pact and will work hard and work proud to make our party and our pact proud!"
 FRA_Unlock_Frances_Potential:0 "Unlock Frances Potential"
 FRA_Unlock_Frances_Potential_desc:0 "Back in the old days before the communist uprising and even before the second world war, France was a strong mighty country which had a great strong empire, and the people were loyal and ready to serve the country. We must return to those days and make our glorious state strong again!"
 FRA_PCF_liberal-wing:0 "PCF liberal-wing"
 FRA_PCF_liberal-wing_desc:0 "Although communism is the heart of our nation, we are also in the 21st century, our people beg for some sort of freedom and have a chance to express themselves. We can do this with limited liberal reforms and making some changes to our welfare if we do not take this too far."
 FRA_Market_socialism:0 "Market Socialism"
 FRA_Market_socialism_desc:0 "To change the French way of life, we must change the face of our economic system. By liberalizing our economic market, we can let the French people have some degree of freedom, this includes letting them have partial ownership of their business and deciding how much their employees make. This will inevitably anger some of the more hardliner socialists."
 FRA_basic_civil_liberties:0 "Basic Civil Liberties"
 FRA_basic_civil_liberties_desc:0 "France has struggled in making sure their people are treated fairly and have their basic civil rights. Today this changes and under a new reform act we can change this and make sure our citizens can now have basic civil rights and will be written into law."
 FRA_appoint_economic_adviser:0 "Appoint Economic Adviser"
 FRA_appoint_economic_adviser_desc:0 "Although our party is great, and we know what must be done to change the state we also need someone who knows France inside and out and what exactly goes on every day. Now is the time to hire an economic advisor and tell the party what is best to invest in the state."
 FRA_Fabiens_Methods:0 "Fabiens Methods"
 FRA_Fabiens_Methods_desc:0 "The liberal leaning Fabien Roussel has been chosen to be the advisor to guide the party and choose what needs to be invested in and how his liberal leaning vision can make France a modern communist state."
 FRA_Fabiens_liberal_fixes:0 "Fabiens Liberal Fixes"
 FRA_Fabiens_liberal_fixes_desc:0 "The issues have been identified and now Fabien has drafted up some reforms that can be implemented to the state to make life a bit easier for the people and the workers. Budgets and fixes are about to be given to the party. Its time we fix the French worker’s state."
 FRA_law_on_cooperatives:0 "Law On Cooperatives"
 FRA_law_on_cooperatives_desc:0 "One of Fabien’s reforms would be to allow the people of France to own their own business and choose who they can keep their profits, how much they can choose to charge and help improve the income for the people and the state."
 FRA_productivity_poor_work_ethic_and_inferior_quality_goods:0 "Productivity Poor Work Ethic And Inferior Quality Goods"
 FRA_productivity_poor_work_ethic_and_inferior_quality_goods_desc:0 "The past years France has been low on the manufacturing scale compared to the likes of Germany and the Soviet Union. It’s time we change this and take lessons from Germany and watch how they can manufacture their products. Once we have found out we can begin to create our own cars, materials and other goods to transport over the pact and over course our new reformed state."
 FRA_Establish_Modern_Better_jobs:0 "Establish Modern Better Jobs"
 FRA_Establish_Modern_Better_jobs_desc:0 "The time has come to enter the modern age with modern jobs, Melenchon and Fabien have sat down together and drawn up a plan to get the workers of the state into new modern jobs to help project the state to the front of the modern era. Together offices can be transformed and jobs all over the state can be taken into the modern world combined with great new technology."
 FRA_Andre_Gandillo_methods:0 "André Gandillo Methods"
 FRA_Andre_Gandillo_methods_desc:0 "Reforms are good but we also need to make sure we can reassure the rest of our communist neighbours and partners that we are not going to let the red star fall. The hard-line communist André Gandillo will look at the state problems and choose what is best to change the state issues using the communist methods."
 FRA_Andre_Gandillo_Communist_Fix:0 "André Gandillo Communist Fix"
 FRA_Andre_Gandillo_Communist_Fix_desc:0 "André has identified the issues that are troubling the state. He has been able to create a plan of how he can fix these problems by using the communist’s ideals and make sure the state stays in line. We must prevent angering our neighbours."
 FRA_Follow_Chinas_Fix:0 "Follow China's Fix"
 FRA_Follow_Chinas_Fix_desc:0 "André has contacted the communist party in China and asked how they solved the similar issues France is currently in now. After hours of calls and drafts being formed, he has concluded that he must follow the same path China did to restore the faith back into the state."
 FRA_Revive_The_Old_movement:0 "Revive The Old Movement"
 FRA_Revive_The_Old_movement_desc:0 "The faith of the state has dropped to a level we have to change and push our people back into line. The red star flies above Paris and our great monuments. The communist movement made France stronger and we have been able to form a strong relationship with the likes of Germany and Italy. We must remind our people of this."
 FRA_cut_labour_laws:0 "Cut Labour Laws"
 FRA_cut_labour_laws_desc:0 "Although our previous administration allowed better labour laws, this has caused many problems such as a delay in manufacturing and pushing our people to creating the best products in the state. If we cut this then we can push the fast rate of production and build up our economy faster."
 FRA_The_Great_Leap_Forward:0 "The Great Leap Forward"
 FRA_The_Great_Leap_Forward_desc:0 "Now that laws have been written and the reforms are taking place in the state, France is already changing, for the good or the bad? Who knows but at least this way things will change and now the people of France can look at Melenchon as the great reformer of the state."
 FRA_New_France:0 "New France"
 FRA_New_France_desc:0 "Its time to extend our reforms, after the success of the reforms taking place we can now push for more. After talking with the politburo they have agreed that they have all witnessed the change and will accept changes for the sake of saving our state and making the lives of our people better."
 FRA_enterprises_profits:0 "Enterprise's Profits"
 FRA_enterprises_profits_desc:0 "With the people now being able to own their own businesses and giving their fair share back to the state its now time that they took some of the rewards and got to keep some of that money back and reduce the taxes they pay to enable them to set up more businesses around the state."
 introduction_of_profitability:0 "Introduction Of Profitability"
 introduction_of_profitability_desc:0 "We need the people to help the crippled economy as much as they can, if we can offer loans to the people to set up their own businesses and take over the run down abandoned buildings and attract more investment into the country and build our state up."
 FRA_reward_the_workers:0 "Reward The Workers"
 FRA_reward_the_workers_desc:0 "Shops and businesses have been set up for the state, they have hired works up and down the nation and we are already seeing an improved in our currency from this. Due to so many of our loyal people taking the jobs its time we reward the workers and give them a higher wage and cut the taxes for our great business owners."
 FRA_Expand_operations:0 "Expand Operations"
 FRA_Expand_operations_desc:0 "Expanding businesses all over the state is vital as we can build a strong economy through this, hire many more of our people and most of all bring great business confidence into the country."
 FRA_Central_Budget:0 "Central Budget"
 FRA_Central_Budget_desc:0 "We can choose how we are able to budget our money and what we can invest in the country, there are lots of areas in our state which need heavy investment, but we cannot afford it yet. Once we can centralize our money into the state then we can put more into sectors over the years."
 FRA_Economic_Mechanism:0 "Economic Mechanism"
 FRA_Economic_Mechanism_desc:0 "There has been a lot of work done to make France what it is today, a lot of our people are asking if we are moving to a more liberal leaning political landscape now. We cannot allow this to happen and reinforce we are communist and our economy was built on a communist way of ruling and building."
 FRA_Market_limited_Freedoms:0 "Market Limited Freedoms"
 FRA_Market_limited_Freedoms_desc:0 " Now we have been able to open our market to local businesses and investment we can now slowly but gradually open our investments to overseas and help build our currency up and make it one of the strongest in the union as well as providing more jobs and stable economy for our state."
 FRA_We_Have_A_Problem:0 "We Have A Problem"
 FRA_We_Have_A_Problem_desc:0 "Uh..oh..it seems our great reforms have somehow backfired, we have given the people too much freedom and entitlement, they want more, and they want it now. They have seen what the outside world is like and they want more freedoms, able to travel and access more. We need to solve this now."
 FRA_Too_much_freedom:0 "To Much Freedom"
 FRA_Too_much_freedom_desc:0 "Freedom, its on the peoples minds and they want a lot of it. We created the reforms for the people to give them a bit more of an easier life. Unfortunately they took advantage of it and now they’re wanting more."
 FRA_Reforms_are_too_fast:0 "Reforms Are To Damn Fast"
 FRA_Reforms_are_too_fast_desc:0 "It seems as though we were maybe a little too quick with these reforms, the people were not ready to adjust so quickly to this and because the reforms were pushed through quick and not taken time the state officials were not fully able to understand and make sense of the new laws leading to many issues."
 FRA_Quick_actions:0 "Quick Actions"
 FRA_Quick_actions_desc:0 "We need to move quickly to prevent things getting out of hand, the people are taking advantages of the new reforms and the police are not able to keep on top of this change happening so quick. Its time we shut things down quickly and get on top of them asap!"
 FRA_halt_all_reforms_and_laws:0 "Halt All Reforms And Laws"
 FRA_halt_all_reforms_and_laws_desc:0 "Those who disrespected our laws and reforms have now been arrested and groups who encouraged this have been warned. Now things have come to a stop we can organise what to do so we can fix this problem."
 FRA_reverse_the_reforms:0 "Reverse The Reforms"
 FRA_reverse_the_reforms_desc:0 "Things are not going great and maybe its time just to take a step back..literally it might be time to reverse what we have done just so we can bring peace back to France before anything may get out of control."
 FRA_Stop_social_media:0 "Stop Social Media"
 FRA_Stop_social_media_desc:0 "Freedom is getting out of control, its time we limit the social media access our people are using and force them back to the local area they are in and prevent outside access leaking into our state. Its backwards but its important."
 FRA_Stop_all_live_broadcasting:0 "Stop All Live Broadcasting"
 FRA_Stop_all_live_broadcasting_desc:0 "Media was free to the people allowing them to see the outside world for what it really is. Although this was a good idea at first for the sake of their freedom, the people have noticed how much more free the people outside our pact are and this is causing some serious problems.."
 FRA_limit_basic_liberties:0 "Limit Basic Liberties"
 FRA_limit_basic_liberties_desc:0 "Freedom of speech is important..just not yet..its making the peoples voices louder and unfortunately, the people are listening. Now we need to fix this and make their voices loud but loud supporting the party and loud to work for our state."
 FRA_slow_down_the_country:0 "Slow Down The Country"
 FRA_slow_down_the_country_desc:0 "Calming down the state is our priority, its time we spoke to our nation and make sure they know we are aware of their requests and what they want. We need to explain to them our focus for the state and what our reforms were for and why we implemented them."
 FRA_slow_down_job_freedom:0 "Slow Down Job Freedom"
 FRA_slow_down_job_freedom_desc:0 "We only enabled certain types of cover for job freedom and the people quickly noticed this. As there is no other alternative to this then we must cut this and make everyone equal just to prevent an unfair society which enabled those to be better than others as this goes against out communist goals."
 FRA_stop_all_grants:0 "Stop All Grants"
 FRA_stop_all_grants_desc:0 "The grants were a good idea, but the problem is, we are starting to see a monopoly starting to grow and this is very American style capitalism and something we are totally against. We are stopping all business grants and raising taxes to all those businesses who have expanded and hiring many people. We must prevent any type of capitalist influence entering our socialist society."
 FRA_distance_from_canada_UK:0 "Distance From Canada & UK"
 FRA_distance_from_canada_UK_desc:0 "Jealousy is a fine thing. Our neighbours are not happy with our new trade deals with Canada and the UK. Although it really is just to improve our economy and build our reputation on the world stage we cannot anger our communist friends therefore due to the risks of what could happen all trade with these countries will now be stopped and cut."
 FRA_Hault_France:0 "Halt France"
 FRA_Hault_France_desc:0 "We may have made cuts and stopped reforms but its still not fixed the situation. Its time we put the state in a complete shut down and close evrything. Today we are declaring martial law and putting everything to a stop. The people need to be protected."
 FRA_Emergency_government_powers:0 "Emergency Government Powers"
 FRA_Emergency_government_powers_desc:0 "The communist party has met to declare marital law on the state, its time the final act was pushed and push the people back down under their boot. Shutting down the state is a must to regain control."
 FRA_Frances_Crisis:0 "The French Crisis"
 FRA_Frances_Crisis_desc:0 "Melenchons reforms, although initially beneficial for both the proletariat and the state, have begun to form problems which have continued to escalate. The workers feel “too free”, unions feel as if they do not need companies anymore. Media has begun to criticize our government, and that’s led to protests on a wide scale. We must fix this problem before our country is completely engulfed in flames"
 FRA_Address_The_Nation:0 "Address The Nation"
 FRA_Address_The_Nation_desc:0 "France is starting to fall apart and its time Melenchon addresses the nation to calm everything down. He needs to ensure the people know his reforms were meant for the good of the country and not to cause harm. \nThe people are causing problems for the party and the halt in France is not working either. Its time things were addressed and made clear."
 FRA_Student_Protests:0 "Student Protests"
 FRA_Student_Protests_desc:0 "The students are not happy with the direction the state is going and they want to make sure everyone knows about it. The students are now ready to pick their fists up and show the party that they want change."
 FRA_Student_sit_ins:0 "Student Sit Ins"
 FRA_Student_sit_ins_desc:0 "The students are not getting the attention they deserve so now they have moved into public builds and refused to move until they get the party to respond to them. They want the people to stand with them so they can have a future for them which is free and open."
 FRA_Our_Own_Rights:0 "Our Own Rights"
 FRA_Our_Own_Rights_desc:0 "The party has responded. It was not the response they were looking for. The party were watching what they were doing and all they responded back was calling them children who wanted they’re on way and were not getting it."
 FRA_Union_Protests:0 "Union Protests"
 FRA_Union_Protests_desc:0 "Groups have been protesting but now the unions have chosen to join this movement and named themselves the ‘Yellow Hat’. They still stand for the workers and the people, they will no longer allow the party to take advantage of the workers."
 protest_workers_Treatment:0 "Protest Workers Treatment"
 protest_workers_Treatment_desc:0 "Workers are not being given the fair treatment they deserve and now its time they make the bosses and party to hear this. Protesting and refusing to work will do some sort of damage to the industry."
 FRA_More_budget_for_unions:0 "More Budget For Unions"
 FRA_More_budget_for_unions_desc:0 "With the reforms Melenchon wanted to introduce, unions needed more money to support the people. Unfortunately the party refuses and now the unions will strike harder just to be given fair pay for themselves."
 FRA_Unions_In_The_Politburo:0 "Unions In The Politburo"
 FRA_Unions_In_The_Politburo_desc:0 "Unions represent the workers and yet the party has not for many years. Now its time they push to be represented in the politburo and stand for the workers given them a real voice and not just what the party thinks."
 FRA_Union_Strikes_in_cities:0 "Union Strikes In Cities"
 FRA_Union_Strikes_in_cities_desc:0 "After failure from the party to meet the union demands and most part officials refusing to even meet unions leaders. The unions have had enough and want to make the party to pay for going against the workers."
 FRA_Industry_Protests:0 "Industry Protests"
 FRA_Industry_Protests_desc:0 "Its not just the unions but the workers as well. They have had enough and want to let the whole of France know that once they stop working the whole of France will. Once the work cuts by half that is when the party will want to speak to us. Until then we will refuse to stand down."
 FRA_Human_Rights_Abuse:0 "Human Rights Abuse"
 FRA_Human_Rights_Abuse_desc:0 "The people are sick of the abuse they get and now the workers are too. At work lack of health and safety rules make the people fear and lets bosses run free on ordering the workers around. Enough is enough and now it’s the bosses who will fear us."
 FRA_Oppression_and_Refuse_To_Work:0 "Oppression And Refuse To Work"
 FRA_Oppression_and_Refuse_To_Work_desc:0 "The workers will not stand to be pushed away and made out to be slaves. They are tired of this treatment and now they will now allow themselves to be taken advantage of. Refusing to work is just the start to fear the elite."
 FRA_Better_Wages_In_Our_state:0 "Better Wages In Our State"
 FRA_Better_Wages_In_Our_state_desc:0 "The one thing the people want and that’s fair pay, yet they are not being given that basic right. Protesting and demanding the right to be paid for what the people are working for is a basic right and the people will not allow this to slide."
 FRA_Riots_In_France:0 "Riots In France"
 FRA_Riots_In_France_desc:0 "The party has failed to respond to all these demands in the way the groups wanted them to and now France burns. Protesting, riots and more are getting out of control. The police are struggling to keep control of the situation and are relying on the army to help keep the state stable."
 FRA_France_Begins_to_Break:0 "France Begins To Break"
 FRA_France_Begins_to_Break_desc:0 "Much of France has now broken down. Many cities have become areas of protesting and crime. Villages are being protected by their own people arming themselves with whatever they can yet the party sits back believing that the police and army will be able to deal with this in their own way..."
 FRA_The_Army_abondons:0 "The Army Abondons"
 FRA_The_Army_abondons_desc:0 "The army has sadly followed the way of the police forces and abandoned the government. They’ve begun to sympathize with insurrectionist groups who claim they can help their families. Many units have simply dissipated into the fold, and our capital is barely protected. Even though things look dire, the party claims we will come out the other side."
 FRA_Refuse_To_Give_In:0 "Refuse To Give In"
 FRA_Refuse_To_Give_In_desc:0 "We’ve tried to work with the protestors, yet they did not listen. So we sent the police in, yet they did nothing to alleviate the problem. Our party will never give into these so called peaceful protestors, they all just want to see the Red Star fall."
 FRA_The_people_turn:0 "The People Turn"
 FRA_The_people_turn_desc:0 "The people, our lifeblood have turned against us. We thought they would applaud our devotion to communist ways, yet they now disrespect the party and the country. While the Red Star remains flying proudly above the capital, it has been desecrated in the countryside. People have taken to joining insurrectionist groups en masse and show no sign of letting up."
 FRA_ENOUGH:0 "ENOUGH!"
 FRA_ENOUGH_desc:0 "The people have had enough of not being listened too and are ready to do whatever it takes to have a voice and given the freedom they deserve. No matter who the people are, where they are from or what their jobs are, they are ready to stand hand in hand with each other and fight for their own future."
 FRA_The_clock_Beings_To_Tick:0 "The Clock Begins To Tick"
 FRA_The_clock_Beings_To_Tick_desc:0 "As france falls more and more into disarray the state officials have chosen to flee the state and prevent being caught by rioters. Meanwhile the protesters are starting to get more violent towards the party and are now waiting for the power to finally fall from the party’s hands."
 FRA_Tik:0 "Tik"
 FRA_Tik_desc:0 "As the riots and protests get more darker and begin to target certain members of the party. Many of the party leaders have fled their homes and tried to escape as fast as they can rather than sitting down with riot leaders and calm the situation."
 FRA_Tok:0 "Tok"
 FRA_Tok_desc:0 "Its finally happened..the moment no one wanted to arrive..only after so many weeks it took one small trip and then BOOM the state has erupted into full blown violence. France has finally fallen.."
 FRA_The_European_Spring:0 "The European Spring"
 FRA_The_European_Spring_desc:0 "The power is no longer in the party’s hands. France has collapsed, groups have taken over streets and the people are no longer willing to listen to the politburo. The European Spring has finally begun..."
 FRA_day_of_rage:0 "Day Of Rage!"
 FRA_day_of_rage_desc:0 "The people want revenge. After a long day and a long night of protests and still no sign of the party willing to negotiate, the people no longer can put up with their fake propaganda they are spreading. Today the people will raise their fists and show their anger. Anyone who stands in their way is an enemy of the people."
 FRA_protecting_the_people:0 "Protecting The People"
 FRA_protecting_the_people_desc:0 "As the police turn against the power, its up to the people to protect each other. Its time to stand hand in hand together and no longer allow the state to make the people fear the party but in fact make the party fear the people for once, the wind is blowing in a different direction."
 FRA_riots_in_the_Streets:0 "Riots In The Streets"
 FRA_riots_in_the_Streets_desc:0 "Riots are now everywhere in France, in every city, every town even villages are seeing more increase in crime and unrest. With both sides refusing to speak to each other its only due to get worse between the two and more blood will be shed."
 FRA_The_million_people_protest:0 "The Million People Protest"
 FRA_The_million_people_protest_desc:0 "After a night of crack downs by the state police, it was time for the people to get their revenge. Over one million protesters came together and overran the police targeting the head of state. The people want blood and they do whatever they can to get it."
 FRA_Break_Down_The_Ghettos:0 "Break Down The Ghettos"
 FRA_Break_Down_The_Ghettos_desc:0 "The ghettos were built to contain the poor, push them closer to their work while the elite and rich live in new modern apartments eating and drinking every night while the poor struggle to live on the basics. Its time the ghettos fall and the lower class fight back."
 FRA_local_milita_movement:0 "Local Milita Movement"
 FRA_local_milita_movement_desc:0 "After the police refusing to stand with the people and some of the army still refusing to stand together small groups of ex-soldiers and police officers have chosen to come together and create militant groups to help protect the people and fight back against the oppressive regime"
 FRA_were_not_going_to_take_it:0 "Were Not Going To Take It"
 FRA_were_not_going_to_take_it_desc:0 "The state has chosen to capture key leaders in the resistance movements and show their prizes live on state TV to frighten the people and calm down the situation. Its just a shame the people are no longer effective by this and just make them more angry"
 FRA_ignite_the_flame:0 "Ignite The Flame"
 FRA_ignite_the_flame_desc:0 "Groups from all ideologies in the state have now chosen to stand together and fight against the party. No longer will their own thoughts divide the country but in fact the thought of being able to shout their thoughts in the streets and not being jailed for it becomes ever more attractive to the people."
 FRA_Pirate_media_broadcasting:0 "Pirate Media Broadcasting"
 FRA_Pirate_media_broadcasting_desc:0 "The party has cancelled all third-party media and only transmits news and broadcasts through 1 station and 1 news channel. Its time the people are given more freedom and now ex servicemen are making their own stations broadcasting what the situation really is like in the state and how the revolution is changing things."
 FRA_Digital_Raise_Awareness:0 "Digital Raise Awareness"
 FRA_Digital_Raise_Awareness_desc:0 "As times move on so does technology and the means people communicate. Therefore it is only fitting that the rebellion also adopts to this method and accepts technology to help broadcast their message against the communist party."
 FRA_Digital_revolution:0 "Digital Revolution"
 FRA_Digital_revolution_desc:0 "Now we have managed to take over the tv stations we can be to not only broadcast our messages but also create independent channels for those of our people who may not have the same ideas as us but also accept the need for change. Its time we begin giving the people their freedom and independence."
 FRA_repel_the_elite:0 "Repel The Elite"
 FRA_repel_the_elite_desc:0 "We will no longer accept the rich who look down upon us, allowing those who escaped France to return and fight back the force who wants to push us down. We will not allow the officials to take advantage of the weak. We will force those back who stand against us. Unfortunately radical leader Alain Soral has other ideas on how we should deal with the traitors…"
 FRA_Social_media_broadcasting:0 "Social Media Broadcasting"
 FRA_Social_media_broadcasting_desc:0 "As France begins to spiral out of control its becoming harder for the party to keep the situation in the state quiet. Once the news of the situation in France began to spill out of the country, more countries in Europe started to spread the news until it manged to make its way out of Europe into the democratic countries causing huge embarrassment to the soviet and communist pact."
 FRA_We_refuse_to_listen:0 "We Refuse To Listen"
 FRA_We_refuse_to_listen_desc:0 "As we move deeper into the state taking over government offices and hanging the traitors, we have still found that some undercover party leaders are still trying to spread their message. Its time we burn any state propaganda we find and send a deep message to the communist scum that the people of France will not listen to their lies."
 FRA_screw_the_loyalists:0 "Screw The Loyalists"
 FRA_screw_the_loyalists_desc:0 "Loyalists who wish to keep the party operating and control of the state are going undercover to take figures of the resistance and put them on display being captured. We are sick and tired of this so its time to wipe them out once and for all."
 FRA_counter_revolutions:0 "Counter Revolutions"
 FRA_counter_revolutions_desc:0 "The communist party is refusing to lay down and surrender and neither are the rebels. Its time to fight back and fight back hard. We will not return to a one state party forcing us to do as they say. Its time to claim back our country!"
 FRA_Fight_against_the_authorities:0 "Fight Against The Authorities"
 FRA_Fight_against_the_authorities_desc:0 "Fighting within the rebellion has started to get more bitter as radicals are targeting ex police members and other ex-members of the state who joined the fight against the party. It seems there is paranoia causing the group to split."
 FRA_raid_government_buildings:0 "Raid Government Buildings"
 FRA_raid_government_buildings_desc:0 "There are only a few state offices left and those that do remain are heavily defended. Its time for one last push against the state and take over the cities. Once we have done this we can start to see a real victory coming for us."
 FRA_The_second_french_revolution:0 "The second French Revolution"
 FRA_The_second_french_revolution_desc:0 "The state officials have either died in battle or fled. Only some loyalist to the communist regime have chosen to stay and make one last bid for the fight. The country is split and now it is the people vs the elite. The second French revolution has begun."
 FRA_burn_the_red_flag:0 "Burn The Red Flag"
 FRA_burn_the_red_flag_desc:0 "The red flag hangs high on monuments of France. Its time we tear this down and burn it not only in the face of the communist regime but in the face of Europe and other communist country that wishes to force their iron fist down the people’s throats. Today we make the dominos fall."
 FRA_attack_state_officials:0 "Attack State Officials"
 FRA_attack_state_officials_desc:0 "We must find the last remaining party members and capture them before they are able to regroup with loyalists and try to force us back. None of the traitors will survive."
 FRA_force_the_army_to_join:0 "Force The Army To Join"
 FRA_force_the_army_to_join_desc:0 "Its time the army choose who to stand with, they have either left their ranks and stood with the people or chosen to stay with the disgusting communist movement. We can persuade them to join us before force is used…"
 FRA_Collective_groups:0 "Collective Groups"
 FRA_Collective_groups_desc:0 "There are many different groups who joined together and fight off the state party. A mix of socialists, centrists, conservatives and even right wing nationalists have chosen to stand together and defeat the left movement. Now its time to ensure the groups stay banded together for these last few months to defeat this dictatorship."
 FRA_Trying_to_fix_the_state:0 "Trying To Fix The State"
 FRA_Trying_to_fix_the_state_desc:0 "Its time the PCF unite the state and show the people that fighting is not worth al the bloodshed, reforms can fix the country and the people can live together under a true socialist state with their European neighbours."
 FRA_Meeting_with_the_party:0 "Meeting With The Party"
 FRA_Meeting_with_the_party_desc:0 "Things are not going the party’s way. Its time they met with other leaders of the resistance and find a diplomatic solution to fix things. We are sure there will be something that can be discussed to prevent more death and anger."
 FRA_the_failed_meetings:0 "The Failed Meetings"
 FRA_the_failed_meetings_desc:0 "After meeting with the leaders who would be willing to speak with us, they refused to even let us try to find a solution to this other than stand down and allow us to be put on trial. Of course, we would refuse this! How dare they even speak to us like this?!"
 FRA_the_European_winter:0 "The European Winter"
 FRA_the_European_winter_desc:0 "The war has gone on for a long time now. People have died families and friends have lost loved ones and the communist party is pretty much dead. France is in ruins and there is no clear leader who can help the people rebuild. It must come down to the resistance leaders to help unite the people and rebuild."
 FRA_Rise_of_political_groups:0 "Rise Of Political Groups"
 FRA_Rise_of_political_groups_desc:0 "Votes have been cast between which leader would be best to take control and unfortunately it seemed to be an exceedingly difficult choice. The people have chosen Macron and Le Pen to help unite the people. Its just going to be a difficult choice on how they will do this."
 FRA_Groups_Take_control_Of_the_Streets:0 "Groups Take Control Of The Streets"
 FRA_Groups_Take_control_Of_the_Streets_desc:0 "Fighting has came to a gradual stop. Loyalists have chosen to give themselves up or leave the state. Now its time for leaders to help bring order back into France and their movements to help the homeless and those who need medical care. "
 FRA_Le_Pens_orders:0 "Le Pens Orders"
 FRA_Le_Pens_orders_desc:0 "Marine Le Pen has today met with army leaders and begun to draw up plans how the people and the army can work together to build a new France, how the people can move away from violence and focus more on the real problems around them. Her orders are final and now she can focus on the rebuilding of France."
 FRA_right_wing_propaganda:0 "Right Wing Propaganda"
 FRA_right_wing_propaganda_desc:0 "Under the previous parties all right-wing messages were banned and were against the law. Now she is a highly looked up leader for France and oversees a lot of what is happening in the rebuilding of France she can begin to spread her own views and messages to the people. What her party stands for and how she believes she can fix France once they are in complete power."
 FRA_Attack_the_left:0 "Attack The Left"
 FRA_Attack_the_left_desc:0 "Although the communist party is pretty much no longer in power there are still left wing parties which can help spread their messages and we cannot allow this to keep the left spirits up. Attacking the whole left wing will prevent their rise to power again and will bring the voice of reason back, no silly nationalising and full ownership. Award our soldiers for what they have done these past months!"
 FRA_Feed_the_homeless:0 "Feeding The Homeless"
 FRA_Feed_the_homeless_desc:0 "After the riots and revolution in France there is mass homelessness and starvation. Its time Le Pen’s party goes out to feed those who need it….and gain more voters…..But making sure the population is carefully looked after!"
 FRA_Treat_the_protesters:0 "Treat The Protesters"
 FRA_Treat_the_protesters_desc:0 "Hospitals are in critical shape and overrun, its time we go out and help those who are injured and need help. Le Pen is the face of the people and putting them first. She is going to make sure the people of France know the party is there for them and only them."
 FRA_gain_popularity:0 "Gain Poularity"
 FRA_gain_popularity_desc:0 "We are helping the people recover by doing our bit, while helping lets help gain more popularity and show them that if we were in power we would put the French people first and make sure they get priority over others. A small dose of propaganda never hurt anyone..even if they are already injured?"
 FRA_Macrons_Centre_path:0 "Macrons Centre Path"
 FRA_Macrons_Centre_path_desc:0 "Macron is the face of everyone, he is the man who is going to change the power shift and allow peace to return. A lot of people feel he is the right man for the job and can have the proper diplomatic talks to the communist party that is needed now."
 FRA_Centrists_Ideals:0 "Centrist Ideals"
 FRA_Centrists_Ideals_desc:0 "Centrism is the future of France, Macrons Path to stay in the status quo not going right or left means everyone is happy and can keep the peace. He can make the gears turn again and bring a new direction to France which will be happily accepted by foreign leaders."
 FRA_Left_and_right_politics:0 "Left And Right Politics"
 FRA_Left_and_right_politics_desc:0 "The point of centrism is staying in the middle of the left and right political spectrum. After years of far-left communist rule, the one thing we do not need is far right to win. If we can keep to the status quo and take policies from both left and right, we can keep everyone happy."
 FRA_Encourage_Protests_for_elections:0 "Encourage Protests For Elections"
 FRA_Encourage_Protests_for_elections_desc:0 "Macron has had meetings with Melenchon and his party, they have accepted that they can no longer take control of France and the people look up to Macron and Le Pen. The party has agreed they will work with Macron in restoring order to the country and begin to dismantle the communist propaganda."
 FRA_stepping_up:0 "Stepping Up"
 FRA_stepping_up_desc:0 "With the fighting and protesting pretty much finished and groups recover and meet with families to grieve, leaders are now meeting with what used to be members of politburo to agree on terms and conditions of their surrender and what they will be agreeing to."
 FRA_dissolve_the_politburo:0 "Dissolve The Politburo"
 FRA_dissolve_the_politburo_desc:0 "With the communist party officially no longer in power and a transitional government taking control of the country until real leadership is found. The new leaders must come together and make sure there is no fighting back against this new change in the country."
 FRA_Meeting_with_opposition_leaders:0 "Meeting With Opposition Leaders"
 FRA_Meeting_with_opposition_leaders_desc:0 "Now the far-left parties were banished from the state talks could begin with other parties which used to operate in secret, many old parties too could return onto the main stage and discuss what would be best to give France the best and most stable return to power. Of course, elections but first we need someone to clear the mess up and keep everyone in the status quo until then."
 FRA_Discuss_who_can_lead:0 "Discuss Who Can Lead"
 FRA_Discuss_who_can_lead_desc:0 "As each leader from their party sat around a table, they all debated who should lead the country, of course we have macron and le pen in charge, but they have very different views and some point will clash. We need someone who can keep things calm and stable until the time is right for the real democratic voice to be returned."
 FRA_allow_other_parties:0 "Allow Other Parties"
 FRA_allow_other_parties_desc:0 "No matter who is put in charge of the country one thing must be made clear, political parties must remain legal to oppose those who lead. This keeps things free and open and allows the people of the country to have someone who represents them and what they think should be the way the country is lead."
 Fra_secret_meetings_with_the_king:0 "Secret Meetings With The King"
 Fra_secret_meetings_with_the_king_desc:0 "From our records we can see that Jean Christophe Napoleon and his family fled to England to prevent arrest by the communists. He has always stated he would like to return to France and work with the people. Maybe its time we sit down with him and discuss his possible return. \nA king would be the perfect leader of the country until things have calmed down and from his views It matches ours perfectly on how we would want the country to be ruled. He even agrees that a political party should be returned back to rule the country."
 FRA_Melenchon_stands_down:0 "Melenchon Stands Down"
 FRA_Melenchon_stands_down_desc:0 "There is no longer any need for Melenchon to remain a key political figure. He tried to change France in his vision and sadly failed. He will be remembered as the man who tried to make the country a modern communist reformed state but unfortunately, he pushed it too far and it cost him everything."
 FRA_Prepare_for_new_leadership:0 "Prepare For New Leadership"
 FRA_Prepare_for_new_leadership_desc:0 "As the surprise announcement of Melenchons resignation reached leaders, it was time to begin the transition to a new leader. The leaders of each political party agreed it was in their best interests to bring Napoleon to become head of state and calm the nation down. He understood what needed to be done and with him being in the UK they even had help and recognition from the UK if needed. \nThis was the chance to bring a whole new change."
 France_Welcome_The_King:0 "Welcome The King"
 France_Welcome_The_King_desc:0 "Talks have been successful, and the people are ready for change. They need someone who can lead the country and not worry about two people falling out over their political views. The king is here and is ready to pick up the ruins of France and fix them. Once the country is ready, elections can begin."
 FRA_jean_christophe_napolean:0 "Jean Christophe Napoleon"
 FRA_jean_christophe_napolean_desc:0 "Jean Christophe Napoleon was born in the United Kingdom when his family escaped during the communist crackdown. From an early age was taught about the history of France and how things used to be before the reds took control. By the age of 16 he joined the British army and took part in the Falkland war. He was always ready to come back to France and restore his home nation back to glory and now he finally can. "
 FRA_root_out_communism:0 "Root Out Communism"
 FRA_root_out_communism_desc:0 "Its time to finally rid France of the communist menace and prevent them from taking power again. We have had enough of far left extremists running our country and now we finally have a chance to rid them once and for all!"
 FRA_the_trials_of_the_party:0 "The Trials Of The Party"
 FRA_the_trials_of_the_party_desc:0 "The communist party has been removed from power and no longer have the stability and popularity they need to return to power, now we must make a decision whether it should be banned in our country or stand as a non-official political party"
 FRA_Old_relationships:0 "Old Relationships"
 FRA_Old_relationships_desc:0 "Our king has returned from the UK. The UK has said it will work with us and help rebuild the country and therefore we can begin to build up our relationship with the country. We can also work with Canada and Brazil and many others from around the world, increase our trade and build stronger alliances"
 FRA_Restore_stable_ruling:0 "Restore Stable Ruling"
 FRA_Restore_stable_ruling_desc:0 "Now the king is in control of the country we need to make sure the people are aware this is only temporary and not a long term solution. The king is here to fix the country and prepare our country for the return of our democratic life. The king has kept to his word and made legislation that France will be a strong democratic European country and recover from this horrendous atrocity"
 FRA_confidence_in_the_king:0 "Confidence In The King"
 FRA_confidence_in_the_king_desc:0 " The King needs the support of the people and the parties, if we have confidence with his rule then it will be a quicker process to fix France and rebuild our cities, towns and villages. Our people are ready to accept the change but now we must bring everyone together and work together and overcome this."
 FRA_restore_faith_in_the_people:0 "Restore Faith In The People"
 FRA_restore_faith_in_the_people_desc:0 "The king is here for France, but he is also here to unite the people. The people must come back together, work together and believe in France. Yes, its going to be a long journey but if we can restore our faith together then we can build back better."
 FRA_begin_meetings_with_party_leaders:0 "Begin Meetings With Party Leaders"
 FRA_begin_meetings_with_party_leaders_desc:0 "Work has started in building France from the ground up and now we must work with political party leaders on what direction they want to take the country when they are in power. If we can set up the country ready for the political takeover then the transition from royalty to democracy will be smoother and the people will be ready to accept this."
 FRA_discuss_restoring_france:0 "Discuss Restoring France"
 FRA_discuss_restoring_france_desc:0 "Restoring France back to stable calm nation was a priority. Now its time for the king to speak with political leaders from different parties and see what their plans are for the country after the nation had been rebuilt and ready for a new hand of power."
 FRA_French_Reconstruction_Council:0 "French Reconstruction Council"
 FRA_French_Reconstruction_Council_desc:0 "Drafts and meeting with leaders are great but we still do not have a clue on how to rebuild France. Therefore, we are going to establish a reconstruction authority who will organise all the rebuilding of France and how to restore the country to a proud nation who shines in the heart of all of Europe."
 The_Kings_New_France:0 "The Kings New France"
 The_Kings_New_France_desc:0 "Napoleons drafts and plans are now complete, he is now ready to publish his guide on what the people must to do rebuild and fix the nation. Meanwhile different organisations will be created and contracted to take part in rebuilding homes, repair state buildings such as hospitals and other services as well as many other operations which will be given the green light to build."
 FRA_Reconstruction_of_france:0 "Reconstruction Of France"
 FRA_Reconstruction_of_france_desc:0 "Paris has not stopped moving since the early mornings, bulldozers and cranes entered the city ready to rebuild and remove the communist structures that were built in the past years. Modern housing and stronger modern offices and buildings are ready to be built. \nThe same is happening all over France. People ready to start working doing whatever they can to rebuild France and show the world they can recover from the red threat."
 FRA_hire_british_architecture:0 "Hire British Architecture"
 FRA_hire_british_architecture_desc:0 "The British have always been known to be geniuses when it comes to their architecture and artwork. Even nowadays they build huge skyscrapers in amazing designs. Its time we hired the same architectures and let them help us rebuild France. Its time to take France into the 21st Century."
 FRA_low_taxes_for_oversea_investment:0 "Low Taxes For Oversea Investments"
 FRA_low_taxes_for_oversea_investment_desc:0 "We need to rebuild but we also need to create jobs and investments. If we can attract investors to France to set up new offices and work here, we can really take France into the 2010’s properly. We can speak to Canada officials as well as other around the world and strike deals to bring them over here and set up strong great jobs as well as making a stronger Economy."
 FRA_attract_Canadian_Investment:0 "Attract Canadian Investment"
 FRA_attract_Canadian_Investment_desc:0 "During the collapse of the United States many rich businessmen fled to Canada and not long after Canada changed and became one of the strongest economies in the world. Most business is operated there. We can make deals with many famous businesses and attract them to France to set up work here."
 FRA_question_of_unions:0 "Question Of Unions"
 FRA_question_of_unions_desc:0 "Unions worked closely with the state government especially after the Melenchon reforms which safeguarded the peoples jobs, the only problem was that they were very corrupt and would sell the workers out for money. Now we have a choice to reform the unions and allow them to operate or ban their organisation."
 FRA_fair_welfare:0 "Fair Welfare"
 FRA_fair_welfare_desc:0 "Under the communist regime welfare was not equal in fact it was unfair and created more poverty due to the unequal distribution of help given to the people as well as a crippling economy welfare was heavily cut. Now we have the chance to bring welfare back and make sure its equal and helps those who really need it as well as funding our health services and public services that really do help the people."
 FRA_allow_progressive_politics:0 "Allow Progressive Politics"
 FRA_allow_progressive_politics_desc:0 "Although Le Pen pushed her right-wing agenda down the necks of our people and Macron tried to keep the country in the middle, we also need to make sure our centre left parties also are not left out. They are not the communist party but prefer to become more progressive and help those, fix and stabilize the country in their own views. \nAllowing this really brings the country to a stable political landscape which can have a view for everyone in the country."
 FRA_guiding_the_French_Parliament:0 "Guiding The French Parliament"
 FRA_guiding_the_French_Parliament_desc:0 "We have worked with parties and they have helped us fix France, now its time we restore the French parliament and create a hybrid regime which allows our political friends and royalty to work together and prepare the country for a democratic takeover, but also making sure we do this one small step at a time to prevent things going too quick like the last changes that took place."
 FRA_hybrid_parliament:0 "Hybrid Parliament"
 FRA_hybrid_parliament_desc:0 "Its time to allow democracy to enter the nation of France again. The king has asked political party members to enter parliament so he can address what will happen in the coming months and the plans to restore the first French election after the revolution. Until then the country will be ruled by the king and parliament together."
 FRA_ban_French_communism:0 "Fate Of Communism"
 FRA_ban_French_communism_desc:0 "Communism has caused huge problems in the world not just France which has led up to deaths, poverty and authorism governments to be set up to control the population. The people have no say and must comply with whatever leader is in power. We must ensure this never happens again in France therefore the communist party must be banned and anyone willing to consider themselves communist to be labelled as a threat to democracy and the safety of France."
 FRA_overcome_communism:0 "Overcoming Communism"
 FRA_overcome_communism_desc:0 "Banning communism is not the root to solving our problems in fact it just creates more as people still believe in communism just not the way it was implemented in France, it also goes against the freedom of rights. People deserve to have their own free thoughts so long as it doe not affect other people directly. We can limit the use of power the communist party may have but we can still allow it to be a political identity."
 FRA_discuss_the_return_to_democracy:0 "Discuss The Return To Democracy"
 FRA_discuss_the_return_to_democracy_desc:0 "The parties have been told how the restoration of elections will be governed and how the voting rules will work. Each party has now started their election campaigns and are now meeting with members of the public to get them to vote for their party.  This election will be watched by countries all over the world as the people finally get a free and fair election."
 FRA_Keep_The_Monarchy:0 "Keep The Monarchy"
 FRA_Keep_The_Monarchy_desc:0 "France is still too fragile to return to a party controlling the country it still brings bad memories to the people who lost loved ones and were hurt in the battles. The king has made the country a lot safer and more stable than it has ever been. It would be stupid to risk losing all of that again."
 FRA_French_elections_return:0 "French Elections Return"
 FRA_French_elections_return_desc:0 "After weeks of campaigning, television appearances of each political leader battling with each other over who said what and who will spend money on something. Its now up to the people of France to decide. We have finally reached the first election after the communist regime collapse and the country is now waiting for the winner."
 FRA_En_Marche:0 "En Marche"
 FRA_En_Marche_desc:0 "En Marche has won the election and now the people of France can celebrate over the first democratically elected leader. "
 FRA_modernize_public_service:0 "Modernize Public Services"
 FRA_modernize_public_service_desc:0 "The transport system is out of date and needs fixing as soon as possible. Its time investment is pushed into this service and makes getting around the country a lot easier and faster. Macron has promised to modernise the transport system and create plenty of new jobs to go with it."
 develop_cooperative_enterprises:0 "Develop Cooperative Enterprises"
 develop_cooperative_enterprises_desc:0 "Now France can start to fully establish businesses owned completely by the people and not by the state its time they are also protected from exploitation. Cooperate enterprises strengthen the democratic outlook as they can elect people to run the business and work off policies."
 efficient_public_spending:0 "Efficient Public Spending"
 efficient_public_spending_desc:0 "In the past years public spending was inefficiently and on the wrong services leading to extreme poverty and corrupt party officials. Now is the time to invest in the right services in France like social infrastructure and build a better life for those in France."
 FRA_Work_with_the_king:0 "Work With The King"
 FRA_Work_with_the_king_desc:0 "Macron has always believed that parliament should work closely with royalty and they should always have the final say in laws and policies. Allowing more say from the king prevents parties from taking over government and turning into a one start party as well as ensuring the people get treated the best they can from the current government in power."
 FRA_Les_Republicains:0 "Les Republicains"
 FRA_Les_Republicains_desc:0 "Les Republicains has won the election and now the people of France can celebrate over the first democratically elected leader. "
 FRA_immigration_question:0 "Immigration Question"
 FRA_immigration_question_desc:0 "With the fall of the communist regime in France many Europeans are flocking their countries with communist governments and trying to get into France for a free and democratic life. The problem is the French people are not ready for this and want to focus on fixing the rest of their country first."
 FRA_Reform_public_spending:0 "Reform Public Spending"
 FRA_Reform_public_spending_desc:0 "Public spending has been out of control and is what caused the economy to crumble in the past. Its time public spending was cut and only limited amount of money are to be put into public services to prevent over spending and boost our economy first."
 FRA_technical_education:0 "Technical Education"
 FRA_technical_education_desc:0 "Being in the 2010’s there is a lot the country needs to catch up on including technology. Focusing more on technology and innovation will help create more jobs and boost our influence in the world. Its time we open technology colleges around the country and push more of our young to enter this new land of learning and help France grow."
 FRA_Expel_all_communist_supporters:0 "Expel All Communist Supporters"
 FRA_Expel_all_communist_supporters_desc:0 "It is too dangerous to keep extreme left-wing supporters in the country as they could trigger any sort of protest and cause France to become unstable again. Removing any sort of communist sympathisers from the country ensures the nation remains safe and stable for any future trouble that could occur."
 FRA_Parti_socialiste:0 "Parti Socialiste"
 FRA_Parti_socialiste_desc:0 "Parti Socialiste has won the election and now the people of France can celebrate over the first democratically elected leader. "
 FRA_Tolerate_Unions:0 "Tolerate Unions"
 FRA_Tolerate_Unions_desc:0 "The workers need to feel as if there are still organisations out there who will help them and prevent their work from exploiting them. Unions may have been at the wrong side of history in the past for France but under new laws and conditions they can be rebuilt from the ground up and only used to protect the workers and that is it."
 FRA_Welfare_reforms:0 "Welfare Reforms"
 FRA_Welfare_reforms_desc:0 "The previous communist party pushes welfare to extreme lengths in which no one would think could be capable making it corrupt and only for the privileged. Now we can reform it all and push it to house those who need it and feed those who are struggling. Its time to invest heavily in the health and public services of our great country."
 FRA_Grants_To_Businesses:0 "Grants To Businesses"
 FRA_Grants_To_Businesses_desc:0 "Businesses need an extra push to set up in the country and help hire the people and push our economy up onto the world stage. Giving out grants to businesses will help them establish new shops and offices around the country and employ the French people pushing down on the unemployed and making lives that bit easier."
 FRA_Invest_In_Modern_France:0 "Invest In Modern France"
 FRA_Invest_In_Modern_France_desc:0 "France is catching up to the year 2010’s and it’s going to take some time, but with a push we can become the art central of Europe as we used to be all those many years ago. The government can increase spending on more modern French style architecture and attract the eyes of the world to our fancy new buildings which makes our people proud of where they live."
 FRA_National_Front:0 "National Front"
 FRA_National_Front_desc:0 "The National Front has come out victorious over the first election. After their win it seems that the people of France want to rid any sort of left wing stench out of the country and focus on putting the people first and making France strong."
 FRA_Independent_France:0 "Independent France"
 FRA_Independent_France_desc:0 "France started the European spring on its own and managed to pull out victorious on its own. We do not need any help from anyone and can find our way on top of the world on our own. Becoming a fully independent nation is what our people want no longer relying on other countries to help us out instead they should be the ones reaching out to us for help so we can turn away and leave them just as they did during our troubled times."
 FRA_The_French_Army:0 "The French Army"
 FRA_The_French_Army_desc:0 "France needs to be protected and we must do this ourselves. The army split into militias during the revolution and needs to be put back together and be a strong self sufficient armed group. The democratic league is still ordered around by Canada whereas we can do as we wish when we want not sending our troops off to war that will not benefit us."
 FRA_Greater_Powers_To_Police:0 "Greater Powers To The Police"
 FRA_Greater_Powers_To_Police_desc:0 "The people do not take the police seriously and even more for the young of this country. Giving the police more power to arrest and search people will start to force the people to fear the police more keeping crime rates down and making sure that people know that they are protected if they are victims themselves."
 FRA_Build_The_German_and_Italian_Wall:0 "Build The German/Italian Wall"
 FRA_Build_The_German_and_Italian_Wall_desc:0 "Around us our neighbours fall to corruption and the dirty communist stench. Italy is in ruins and Germany suffers with drugs and violence. We must protect our own nation to prevent anyone other than our French people try to enter our country. Strong border walls will be built along our borders and check points into Germany, Italy, Belgium and even Spain.  No longer will our weak borders let the red scum enter our reborn nation."
 FRA_The_monarchy:0 "The Monarchy"
 FRA_The_monarchy_desc:0 "The people have chosen to stay with the monarchy rather than elect a political party to run the country. They do not want to risk a party be able to take control and corrupt it like the last time. Napoleon will stay as king and lead the country in the next few years."
 FRA_The_houses_Of_Royalty:0 "The Houses Of Royalty"
 FRA_The_houses_Of_Royalty_desc:0 "With the king in control of the country and the people of France enjoying having a king look after them they also have taken notice there is another branch in the royal line who could also give Napoleon a run for his rule.."
 FRA_which_house_to_rule:0 "Which House To Rule"
 FRA_which_house_to_rule_desc:0 "The Napoleon house is currently the royal bloodline that oversees the country but some of the people of France would rather have a leader with more of a backbone and take problems more seriously. Therefore, they have asked for the return of the Orleanist house in a referendum to the country with Bonaparte."
 FRA_The_Orleanist:0 "The Orleanist"
 FRA_The_Orleanist_desc:0 "Jean d’Orléan has won the publics referendum and is now head of state in the country. His rule will definitely force the leaders of the rest of the world watch as his opinion of the current world affairs are somewhat ‘Controversial’. Meanwhile the fans of his in France celebrate his victory!"
 FRA_New_Rule:0 "New Rule"
 FRA_New_Rule_desc:0 "With new head of state means a new leader for the French parliament, someone loyal to the French throne as well as willing to listen and work closely with the king no matter what type of crazy thoughts the old man is willing to put France through."
 FRA_New_Leader:0 "New Leader"
 FRA_New_Leader_desc:0 "The party “Action First” maybe an ultra-rightwing party who literally wants to wipe the communist threat off the planet by any means necessary. They are also very loyal to the king and would be willing to work with him and do whatever he requests to get into power and show the French people that France can be transformed if it is given the chance."
 FRA_Royal_Propaganda:0 "Royal Propaganda"
 FRA_Royal_Propaganda_desc:0 "There are some people who did not vote or if did vote, voted for Napoleon. Its time we show them what the new king of France will do for them and how he will put them first above everything. The propaganda machines can start starting up."
 FRA_Memories_Of_Past_Empire:0 "Memories Of A Past Empire"
 FRA_Memories_Of_Past_Empire_desc:0 "The British empire lasted until 1997 where it handed Hong Kong back to the Chinese. Our empire lasted no where near as long. As the world changes and our threats its time we look back on what we used to have and pursue a similar memory we used to have."
 FRA_A_True_Empire:0 "A True Empire"
 FRA_A_True_Empire_desc:0 "To be considered a true Imperialist Empire, we must reconquer the lost French Colonies. The past century has not been kind to the Empire, as all of our colonies were “liberated.” To reconquer the colonies is to reconquer the French Spirit and give our empire legitimacy."
 FRA_Retake_Algeria:0 "Retake Algeria"
 FRA_Retake_Algeria_desc:0 "For 132 years, we ruled Algeria. It became one of the most integral parts of the Empire, and we were able to use it to house some of our ethnic and political minorities. Perhaps it is time that the French Flag flies over Algiers once again."
 FRA_Haiti_will_be_french_once_again:0 "Haiti Will Be French Once Again"
 FRA_Haiti_will_be_french_once_again_desc:0 "Haiti liberated itself from our control in 1804 and for some unknown reason our past governments never retook the island. It is up to us to restore the Island to French control, and to do this we’ll squash both the Haitian and Dominican Republics."
 FRA_Liberate_French_Canadians:0 "Liberate French Canadians"
 FRA_Liberate_French_Canadians_desc:0 "Now that we are in a position to invade the Americas, we must focus on the French Canadians first and foremost."
 FRA_French_Louisiana:0 "French Louisiana"
 FRA_French_Louisiana_desc:0 "Napoleon Bonaparte sold the Louisiana Territory to the Americans out of pure desperation, it is time that we use our military to rectify that grave mistake and restore French Control to another one of our former colonies."
 FRA_Expand_American_Colony:0 "Expand American Colony"
 FRA_Expand_American_Colony_desc:0 "Now that the previous Louisiana territories have been reconquered, His royal majesty has expressed ideas towards expanding the American colonies. We can do this by expanding into the American Peoples Commonwealth. After 5/1, they’re fractured and on the brink of a Civil War, we can take advantage of that and annex the territory into Louisiana"
 FRA_Restore_The_Mexican_Monarchy:0 "Restore The Mexican Monarchy"
 FRA_Restore_The_Mexican_Monarchy_desc:0 "During our second intervention in Mexico, we were able to set up a puppet Monarchy by installing a weak but loyal Habsburg to the Mexican throne. To instill a lasting stability in the Americas, we must retake Mexico and install a new monarch to the throne."
 FRA_Recolonize_west_Africa:0 "Recolonize West Africa"
 FRA_Recolonize_west_Africa_desc:0 "The Ivory coast is not a strategically important region in Africa, but if we are to conquer it, then we can hand it over to our West African colony and give them another seaport for our fleets to function out of."
 FRA_Retake_the_ivory_coast:0 "Retake The Ivory Coast"
 FRA_Retake_the_ivory_coast_desc:0 "The Ivory coast is not a strategically important region in Africa, but if we are to conquer it, then we can hand it over to our West African colony and give them another seaport for our fleets to function out of."
 FRA_Take_Advantage_of_UAR_Civil_War:0 "Take Advantage Of The UAR Civil War"
 FRA_Take_Advantage_of_UAR_Civil_War_desc:0 "The UAR is on the brink of collapse, Syria has declared its independence and put its fledging military on alert for a UAR reprisal. What they will not expect is a French Invasion and restoration to the Colonial Powers. By conquering the fledgling country, we can enforce our interests in the Middle East by using Syria as a permanent military base."
 FRA_Recolonize_Madagascar:0 "Recolonize Madagascar"
 FRA_Recolonize_Madagascar_desc:0 "Madagascar, like the Ivory coast does not provide any strategic importance other than yet another port for our Navy. Let us recolonize this tiny island nation and raise the French Flag over her capital once again."
 FRA_Avenge_waterloo:0 "Avenge Waterloo"
 FRA_Avenge_waterloo_desc:0 "Waterloo was not only an embarrassment for the Bonaparte Regime, but an embarrassment for the French themselves. With previous colonies under our control, we have the manpower and production power to avenge the disaster at Waterloo and conquer the British Isles once and for all. Once conquered, we will place a complacent family member on the throne and liberate the minority Welsh and Scottish who continue to suffer under the English."
 FRA_The_Bonaparte:0 "The Bonaparte"
 FRA_The_Bonaparte_desc:0 "The people have overwhelmingly voted to keep Christophe as the king of France. His fair liberal views suit everyone perfectly and of course he was the man who rebuilt France and brought peace back after such a radical and worn-down state."
 FRA_The_Empire_strikes_Back:0 "The Empire Strikes Back"
 FRA_The_Empire_strikes_Back_desc:0 "With the king officially accepted by the people, its now safe to say that the French may want to restore their old empire and regain the respect from other nations around the world, especially the democratic league. Repairing relationships with others are a key."
 FRA_Where_Is_Our_Palace:0 "Where Is Our Palace?"
 FRA_Where_Is_Our_Palace_desc:0 "Now the king is back, where will he stay? Of course the palaces were kept during the communist rule as they were museums showing how bad the state used to be under a monarchy and what happens when the people rise up..funny that."
 FRA_Rectify_the_mistakes_of_the_past:0 "Rectify The Mistakes Of The Past"
 FRA_Rectify_the_mistakes_of_the_past_desc:0 "Its time to recover from the past and try our best to help the people who have been deeply hurt from the blood shed and the iron fist rule. The people need help and therapy and now is the time to give it to them."
 FRA_Return_of_the_Nobles:0 "Return Of The Nobles"
 FRA_Return_of_the_Nobles_desc:0 "The nobles are returning back to the country and we are ready to accept them back open arms back to where they belong. Its been a long ride but the time is finally here to bring our old families back who supported us from the start."
 FRA_Fate_of_the_Communists:0 "Fate Of The Communists"
 FRA_Fate_of_the_Communists_desc:0 "Its time to decide the fate of the communist supporters who still walk our streets wanting some sort of communist influence in our country."
 FRA_Choosing_a_Prime_Minister:0 "Choosing A Prime Minister"
 FRA_Choosing_a_Prime_Minister_desc:0 "Although we have the king it would probably be best to create a position in our country who can relate to the people and solve issues going on within the country while the king decides what to do with the bigger issues outside of the country. If we look at how the United Kingdom works with the royal family we can do something similar."
 FRA_A_Constitutional_or_Absolute_Monarchy:0 "A Constitutional Or Absolute Monarchy"
 FRA_A_Constitutional_or_Absolute_Monarchy_desc:0 "The king is ruler of the country, but a lot of people still believe it may be best to run the nation similar to other counties as a constitutional monarchy. On the other hand we can wield total power and decide what goes on in France and when it happens."
 FRA_Our_own_Alliance:0 "Our Own Alliance"
 FRA_Our_own_Alliance_desc:0 "There are many factions who work together to keep peace. At this moment in time, we are not part of any faction and leave ourselves vulnerable. We can reach out to other countries with similar rulers as us and form a relationship with those."
 FRA_A_secular_state:0 "A Secular State"
 FRA_A_secular_state_desc:0 "Religion is an especially important to some people and that includes the people of France. We promised them freedom and one of those freedoms is having a chance to worship who they wish."
 FRA_Our_Rule_is_Consolidated:0 "Our Rule Is Consolidated"
 FRA_Our_Rule_is_Consolidated_desc:0 "Linking up branches of the government with the monarch is an extremely attractive idea in the eyes of the king and most of the politicians in France. It keeps the rule in France stable as powers are divided between the governing party and the king and prevents one of the groups to take over and create one state rule like the past."
 FRA_Institute_Social_Reforms:0 "Institute Social Reforms"
 FRA_Institute_Social_Reforms_desc:0 "Keeping the people safe and giving them a handout to help it important especially while we are still in the early days of such dramatic change in the country. Social welfare can be reformed and given to those who need to compared to the way it was delivered by the communist party."
 FRA_Institute_Economic_Reforms:0 "Institute Economic Reforms"
 FRA_Institute_Economic_Reforms_desc:0 "Capitalism did not take long to enter back into our society and already many people are seeing its benefits! There are some changes that need to be made to prevent it taking complete control of the state and taking advantage of the people."
 FRA_Reconstruct_Old_French_landmarks:0 "Reconstruct Old French Landmarks"
 FRA_Reconstruct_Old_French_landmarks_desc:0 "The communist party changed historic landmarks turning them into propaganda machines and causing an eye sore. Now is the time to restore them back to beautiful landmarks and bring a new light to the people as well as once tourists eventually come back to France, they will be able to enjoy these magnificent works of art."
 FRA_French_Exceptionalism:0 "French Exceptionalism"
 FRA_French_Exceptionalism_desc:0 "The country has changed so much in the past few years. It went from being ruled with an iron fist trying to change while the fist gets hard up to a democratic nation ruled by a king giving the people as much freedom as they could dream of. France is proof to the world that communism has failed, and the people will always fight for their freedom no matter who or what is in charge of their nation."
 FRA_Keep_The_King:0 "Keeping The King"
 FRA_Keep_The_King_desc:0 "The people have chosen to keep Jean-Christophe Napoleon as their king, he has given the people the France he promised them, the freedoms they need and most of all. They believe he is the right man to rule France. Although the king will still allow a hybrid parliament to keep some type of democratic system. He will always have the final say in law."
 FRA_authorize_lethal_force:0 "Authorize Lethal Force"
 FRA_authorize_lethal_force_desc:0 "Today General Secretary Melenchon gave the orders for police and other defense forces to use lethal force if needed. Already many people have been shot by police and this isn't expected to end."
 FRA_the_2nd_french_revolution:0 "The 2nd French Revolution"
 FRA_the_2nd_french_revolution_desc:0 "People who took to the streets to protest now go to fight. Already reports of gunfire across France have come in and the government in all tense and purpose is crumbled. But Melenchon isn't going without a fight and so will begin another revolution."
 FRA_declare_martial_law:0 "Declare Martial Law"
 FRA_declare_martial_law_desc:0 "Despite his efforts our General Secretary Melenchon has issued Martial Law across France. This came after weeks of protests across the nation and a rise of skepticism in his leadership."
 FRA_the_riots_spread:0 "The Riots Spread"
 FRA_the_riots_spread_desc:0 "Okay well this isn't optimal. The riots from Marseilles have spread to other cities including Bordeaux, Nice, Lyon. and even Paris. Most are rallying against the police ramp up, others are siding more with the hardliners in their loss of faith in Melenchon."
 FRA_cemented_rule:0 "Cemented Rule"
 FRA_cemented_rule_desc:0 "The Hardliners have misjudged the populace's response to their injunction, and in turn have tasted their own medicine. Today protestors rescued Melenchon and returned him to power ending the short reign of the hardliners."
 FRA_2nd_revolution:0 "2nd Revolution"
 FRA_2nd_revolution_desc:0 "What started as a coup against Melenchon led to protests across France for his reinstatement, has now led to revolution. Now the people of France take up arms against their government,"
 FRA_melenchon_the_false_prophet:0 "Melenchon, The False Prophet"
 FRA_melenchon_the_false_prophet_desc:0 "The votes were just not there. And now Melenchon's reforms are likely to never pass. And his actions have led the hardliners to look upon him with more skepticism on if he should remain in power."
 FRA_blame_the_hardliners:0 "Blame the Hardliners"
 FRA_blame_the_hardliners_desc:0 "The vote failed, so of course we must blame someone other than the General Secretary. The hardliners are prime to take blame as they were the main force against reforms."
 FRA_raise_police_presence:0 "Raise Police Presence"
 FRA_raise_police_presence_desc:0 "There is growing discomfort from the populace when it comes to the recent issues in the government. Almost every defense or intelligence asset have suggested the General Secretary to raise police presence in the streets."
 FRA_oust_melenchon:0 "Oust Melenchon"
 FRA_oust_melenchon_desc:0 "The Hardliners have secured their rule over France and the reforms are assured to be repealed in the coming days to weeks. France on the tip of a possible "Golden Age" slipped into darkness in one move."
 FRA_the_hardliner_coup:0 "The Hardliner Coup"
 FRA_the_hardliner_coup_desc:0 "merde!"
 FRA_worker_owned_collectives:0 "Worker Owned Collectives"
 FRA_worker_owned_collectives_desc:0 "Although landlords aren't allowed in communist societies. France has decided to approach the concept with a better structure. Collective ownership of neighborhoods ran by the workers is the answer."
 FRA_appoint_fabien_roussel:0 "Appoint Fabien Roussel"
 FRA_appoint_fabien_roussel_desc:0 "Fabien Roussel is a long time advocate for economic reforms and personally collaborated with Melenchon on his reforms. Roussel gained the admiration of Melenchon, so his appointment isn't surprising but received well by most."
 FRA_the_great_leap_forward:0 "The Great Leap Forward"
 FRA_the_great_leap_forward_desc:0 "The reforms are in effect, and Melenchon is a true reformer. France has indeed in just a short period of time elevated far beyond many people's hopes. Across the world, France has become the envy of the communist world."
 FRA_increase_work_ethic:0 "Increase Work Ethic"
 FRA_increase_work_ethic_desc:0 "France is inheritably a worker's state, as it is one of the many Warsaw Pact countries built on the past capitalism. Now the government is looking to increase work ethic to enshrine the workers with pride and duty."
 FRA_promote_pcf_liberals:0 "Promote PCF Liberals"
 FRA_promote_pcf_liberals_desc:0 "In the most recent months the PCF Liberals have received a good amount of exposure for being the main thrust behind reform. Now Melenchon has begun to promote PCF Liberals to inspiring party members."
 FRA_establishing_local_governments:0 "Establishing Local Governments"
 FRA_establishing_local_governments_desc:0 "One way to expand the appeal of the government and the reach of it is to establish local governments. Hardliners would say this action would lead to regionalism issues, but Melenchon assures that local governments will uphold the reforms and laws on the smaller scale."
 FRA_the_2010_reform_policy:0 "The 2010 Reform Policy"
 FRA_the_2010_reform_policy_desc:0 "The 2010 Reform Policy is a new policy which will effect all levels of society. The reforms will expand rights, freedoms, and institutions. Melenchon hopes that these reforms will expand support for his government in the years to come."
 FRA_unite_the_party:0 "Unite the Party"
 FRA_unite_the_party_desc:0 "Reforms have passed, and more are to come. Now as a collective the members of the Communist Party must unite behind our leader's vision."
 FRA_address_the_people:0 "Address the People"
 FRA_address_the_people_desc:0 "Melenchon will address the people of France, his reason is to declare the reforms he's implemented. Public opinion shows a majority of people accept the reforms."
 FRA_the_vote_passes:0 "The Vote Passes"
 FRA_the_vote_passes_desc:0 "Melenchon was all smiles when the results came in. His reforms are now in place, and going forward he'll continue to further the nations down his own path."
 FRA_the_vote_fails:0 "The Vote Fails"
 FRA_the_vote_fails_desc:0 "Melenchon's dream has been crushed. And even worse he's been publicly and privately denounced by members of the politburo and government. Some are asking has Melenchon gone too far?"
 FRA_voting_begins_on_reforms:0 "Voting Begins on Reforms"
 FRA_voting_begins_on_reforms_desc:0 "Today voting begins on Melenchon's reforms. In all regards the outcome will decide France's future."
 FRA_education_reform:0 "Education Reform"
 FRA_education_reform_desc:0 "There is no doubt to the fact that one way to achieve reform and prolong it is through education. Our education reform will help hundreds of thousands gain a well rounded education. Of course the curriculum will not waste an opportunity to teach the students of France, the reforms of our government."
 FRA_introduce_politburo_term_limits:0 "Introduce Politburo Term Limits"
 FRA_introduce_politburo_term_limits_desc:0 "The new politburo will be a eventful one indeed. Melenchon has taken the steps to now apply term limits to members of the politburo. This step will allow the regulation of the members and prevent "mini dictators" from within the bureau."
 FRA_enlarge_the_collective_farms:0 "Enlarge the Collective Farms"
 FRA_enlarge_the_collective_farms_desc:0 "Although farming is not as important as it was in previous years or decades, it's still an a important part of the working class. In order to achieve Melenchon's reforms the collective farms must be expanded to further centralize farming."
 FRA_releasing_the_gulag_visitors:0 "Releasing the Gulag "visitors""
 FRA_releasing_the_gulag_visitors_desc:0 "One of Melenchon's steps is to release the "visitors" of our many gulags. This is mainly a choice out of gaining both public support and stopping any future scandal if some facts were to be found out if these gulags still held "visitors"."
 FRA_building_a_new_france:0 "Building a New France"
 FRA_building_a_new_france_desc:0 "The time for rebuild has arrived. Melenchon's reforms will be the groundwork for a new France to rise upon. With the removal of obstacles the only thing left is action."
 FRA_a_new_cabinet:0 "A New Cabinet"
 FRA_a_new_cabinet_desc:0 "In order to have no opposition from the inside the cabinet. Melenchon has decided to replace his cabinet with people more in tune with his vision."
 FRA_the_2010_address:0 "The 2010 Address"
 FRA_the_2010_address_desc:0 "2010 is a year of big decisions for France, Melenchon's address to the nation and government will begin the year with a agenda."
 FRA_melenchons_reforms:0 "Melenchon's Reforms"
 FRA_melenchons_reforms_desc:0 "Melenchon has not been blind to the affairs and apparatus of the state. In general he hopes to reform France to keep it's head above water in the coming years, no where to start but with reforms."
 FRA_relax_censorship_rules:0 "Relax Censorship Rules"
 FRA_relax_censorship_rules_desc:0 "Today the government is taking steps to relax censorship. All things like news, film, marketing, and books will receive varying amounts of relaxation from censorship."
 FRA_establish_western_embassies:0 "Establish Western Embassies"
 FRA_establish_western_embassies_desc:0 "France has now begun opening embassies for various nations, the first to open is the United Kingdom's. This is seen as a big step for the nation as it stand within the Warsaw Pact and the shadow of the Soviets."
 FRA_raising_taxes:0 "Raising Taxes"
 FRA_raising_taxes_desc:0 "In order to make reforms there will be sacrifices, taxes are one. Taxes will be raised in order to accumulate enough money for the more broad levels of reform."
 FRA_replacing_politburo_members:0 "Replacing Politburo Members"
 FRA_replacing_politburo_members_desc:0 "In the same way the cabinet will be replaced, so will the Politburo as they would be too much of a roadblock for reformation. The politburo will be sufficiently filled with likeminded reformers."
 FRA_wealth_reform:0 "Wealth Reform"
 FRA_wealth_reform_desc:0 "There is no doubt that there is an obvious wealth gap between our people's with that a gap between income. We have two steps to achieve reformation, either to enforce wealth equality or allow limited wealth gains."
 FRA_melenchon_the_reformer:0 "Melenchon, The Reformer"
 FRA_melenchon_the_reformer_desc:0 "Melenchon's reforms passed with good reception. Many within and outside of the government are happy with the new reforms especially in wealth. Many supporters of Melenchon are dubbing him "The Reformer"."
 FRA_raise_living_standards:0 "Raise Living Standards"
 FRA_raise_living_standards_desc:0 "One of Melenchon's dreams is to establish a era of good living. The government seeks to raise standards of living by spending 1% of GDP on arts and culture, doubling investment in research, build affordable housing, etc."
 FRA_limited_political_diversity:0 "Limited Political Diversity"
 FRA_limited_political_diversity_desc:0 "For years there has been a limit on how much a member of the Politburo could stray away from PCF lines. However now many members have been given a short leash to express diversity in ideology. One specific group is the liberal En Marche."
 FRA_marseilles_riot:0 "Marseilles Riot"
 FRA_marseilles_riot_desc:0 "A riot begun today in the city of Marseilles. The reasons for why are still under heavy investigation but one reason is the increasing of police on the streets."
 FRA_The_Morning_After:0 "The Morning After"
 FRA_The_Morning_After_desc:0 "It had been a crazy few days with France falling into anarchy and the army breaking into two groups but now law and order has been restored and Melenchon has taken back control of the French state. Now its time to rebuild France properly without resistance."
 FRA_Declare_Martial_Law:0 "Declare Martial Law"
 FRA_Declare_Martial_Law_desc:0 "Melenchon has ordered for the martial law to be enacted into the state until the reforms and new laws have been approved in the politburo, this will prevent those hardliners rising up again and our army can keep control of the situation until we are ready to bring freedom to our people."
 FRA_The_Sun_Shines_Anew:0 "The Sun Shines Anew"
 FRA_The_Sun_Shines_Anew_desc:0 "The sun has risen over France on a brand new day. No longer do hardliners control a majority in the politburo and our people will finally be given the freedoms and liberal reforms they have cried out for many years."
 FRA_Faten_The_Reforms:0 "Faten The Reforms"
 FRA_Faten_The_Reforms_desc:0 "This was just the start of the changes in France, now its time to truly change the state for good. New reforms which will transform the state and give the people a new life have been announced by Melenchon as well as a complete reconstruction of the political system."
 FRA_Allow_Political_Parties:0 "Allow Political Parties"
 FRA_Allow_Political_Parties_desc:0 "One of the first reforms to be taken will be legalising political parties to function in the state rather than just left wing parties under the communist branch. Already influential members of the congress have left the communist party to either create their own or restore the old parties which were once banned."
 FRA_Allow_Secular_Worship:0 "Allow Secular Worship"
 FRA_Allow_Secular_Worship_desc:0 "Although Christianity was permitted in France, many did not follow religion due to being a target by the secret police. Now Melenchon has announced all types of religion will now be legal in the state without the need to feel persecution."
 FRA_New_Socialism:0 "New Socialism"
 FRA_New_Socialism_desc:0 "“New Socialism” will remove the communist mark off our state and will allow the world to view us leaving the Stalinist era and moving forward away from the soviet influence the giant used to have on us."
 FRA_Condemn_The_Soviets:0 "Condemn The Soviets"
 FRA_Condemn_The_Soviets_desc:0 "The Soviets forced their views and ideologies upon us pushing out people into poverty and our government ran by a dictatorship. Now the nation will remove all soviet influences off the state and we condemn the actions they take on other nations."
 FRA_Welcome_Refugees:0 "Welcome Refugees"
 FRA_Welcome_Refugees_desc:0 "Refugees have arrived on the shores of Italy looking for a better life away from war. Its time we open our borders and welcome those in need here and help them start a new life in the French state."
 FRA_Reach_Out_To_Old_Allies:0 "Reach Out To Old Allies"
 FRA_Reach_Out_To_Old_Allies_desc:0 "The nation is moving away from the Warsaw Pact and its now time to meet with old friends and renew those relationships we once had. Although the past may have caused issues, its now time to move forward and start focusing on the future."
 FRA_Allow_Capitalist_Companies:0 "Allow Capitalist Companies"
 FRA_Allow_Capitalist_Companies_desc:0 "Our economy is in ruins. We need help and fast, unemployment is high and poverty is increasing each year. We have to allow companies into our state and rebuild our economy and employment."
 FRA_End_The_Dictatorship:0 "End The Dictatorship"
 FRA_End_The_Dictatorship_desc:0 "No more one man making the rules voted by the elite. It’s the elected party who will be chosen by the people who makes the decisions for the nation."
 FRA_Declare_Elections:0 "Declare Elections"
 FRA_Declare_Elections_desc:0 "Melenchon has finally accepted that change has come, and the nation must move away from its old days. Elections will take place which will allow the first democratic leader to be elected for the first time in decades."
 FRA_A_New_Day:0 "A New Day"
 FRA_A_New_Day_desc:0 "It’s the first day of a new France. Melenchon maybe on his last few days as leader before the first democratic election and a new leader takes control of the state, or he could be the man to win the first election. Whoever wins has the role of rebuilding France from the ground up."
 FRA_The_French_Federation:0 "The French Federation"
 FRA_The_French_Federation_desc:0 "With major new reforms taking place its time to finally remove the last bit of communist dirt off the nation. The old french flag will be brought back and the state will be renamed to officially move away from the far left ideology."
 FRA_The_Ballots_Are_Counted:0 "The Ballots Are Counted"
 FRA_The_Ballots_Are_Counted_desc:0 "The people have been voting, the ballots have been counted. Now its time to see who will be elected as the first democratic leader of the French Federation."
 FRA_The_Melenchons_Win:0 "The Melenchon Win"
 FRA_The_Melenchons_Win_desc:0 "The people have chosen that Melenchon will be the first democratically elected leader of the French Federation. He will have the title of “French President” and control the state for four years until the next election."
 FRA_Macrons_Surprise_Win:0 "Macrons Surprise Win"
 FRA_Macrons_Surprise_Win_desc:0 "The people have chosen that the centrist, Emmanuel Macron will be the first democratically elected leader of the French Federation. He will have the title of “French President” and control the state for four years until the next election."
 FRA_Disband_The_Secret_Police:0 "Disband The Secret Police"
 FRA_Disband_The_Secret_Police_desc:0 "The first step moving forward will be to gain back the peoples trust. The way to do this will be disbanding the secret police and show we are truly giving the people their freedom back. No longer will our people worry about random raids in their homes."
 FRA_Tax_Large_Companies:0 "Tax Large Companies"
 FRA_Tax_Large_Companies_desc:0 "Although we need companies to come and invest, we also need to make sure those companies are paying their fair share to help our economy recover."
 FRA_Nationalise_Key_Industries:0 "Nationalise Key Industries"
 FRA_Nationalise_Key_Industries_desc:0 "Certain areas of the French state will be nationalised into the public hands to ensure they get affordable goods and transport as a benefit for those taxes that they have been paying!"
 FRA_Free_Housing:0 "Free Housing"
 FRA_Free_Housing_desc:0 "The people of the nation have went through crisis after crisis with much of the population living in poverty. Now under the new democratic leader and government, the people will be given a home to finally call theirs."
 FRA_Ensure_The_Proletariats_Independence:0 "Ensure The Proletariats Independence"
 FRA_Ensure_The_Proletariats_Independence_desc:0 "The working people will be given their freedom as agreed when the leader took control of the reborn nation. No longer will they have to be told what to do under high restrictions."
 FRA_Raise_Minimim_Wage:0 "Raise The Minimum Wage"
 FRA_Raise_Minimim_Wage_desc:0 "Now our economy has slowly been rebuilding its self and the job market begins to open itself up, its time to create the minimum wage and ensure that our people no longer live under the breadline and can afford a decent happy life."
 FRA_Decriminalise_LGBTQ:0 "Decriminalise LGBTQ"
 FRA_Decriminalise_LGBTQ_desc:0 "Under the communist regime the LGBT community was illegal and punishable to many years in prison. Now under a liberal reforms and a modern outlook on the world, this law has been removed and the country will now legalise gay marriage."
 FRA_Formally_Apologise_For_Communist_Crimes:0 "Formally Apologise For Communist Crimes"
 FRA_Formally_Apologise_For_Communist_Crimes_desc:0 "France along with other communist nations were guilty of crimes against humanity socially the gulag which killed many thousands during the time it operated. Now the French president has publicly spoke to the nation and the world that they formally apologise for all the disgusting acts caused in the past."
 FRA_Subsidise_Small_Businesses:0 "Subsidise Small Businesses"
 FRA_Subsidise_Small_Businesses_desc:0 "Newly opened businesses may find it hard to get the ground running properly when they first set up shop therefore the government will not offer the business grants which will help the struggling businesses through the difficult first months."
 FRA_Woman_In_The_Workforce:0 "Woman In The Workforce"
 FRA_Woman_In_The_Workforce_desc:0 "France needs to be rebuilt and needs everyone to pull together, we must encourage everyone to get into the workforce and that includes woman who in the past were pushed into staying at home once they had a family."
 FRA_Solicit_Bipartisan_Solutions:0 "Solicit Bipartisan Solutions"
 FRA_Solicit_Bipartisan_Solutions_desc:0 "Its time to make politics fair and make sure everyone has a voice, no longer will the people be forced to listen to one party. This time everyone will have a choice who to vote for."
 FRA_Join_The_Democratic_Alliance:0 "Join The Democratic League"
 FRA_Join_The_Democratic_Alliance_desc:0 "Europe is dominated by the Warsaw Pact and now France stands alone, its time we reach out to Canada and ask them to come to an agreement and allow us to join and have a pact member in Europe showing true dominance."
 FRA_Henins_France_First:0 "Henins France First"
 FRA_Henins_France_First_desc:0 "The people have chosen that the far right leader will be the first democratically elected leader of the French Federation. He will have the title of “French President” and control the state for four years until the next election."
 FRA_Rebrand_The_Secret_Police:0 "Rebrand The Secret Police"
 FRA_Rebrand_The_Secret_Police_desc:0 "The FSPA (French Secret Police Agency)  was known for cracking down on the public for breaking the law and having their homes raided. The secret police are a useful tool to have but we must break away from the communist past and rebrand the force."
 FRA_13_Percent_Income_Tax:0 "13% Income Tax"
 FRA_13_Percent_Income_Tax_desc:0 "Each household will pay their fair share in taxes and ensure that the people pay back to the government."
 FRA_Increase_Tarrifs_On_Goods:0 "Increase Tarrifs On Goods"
 FRA_Increase_Tarrifs_On_Goods_desc:0 "Its time other countries pay their fair share for our goods!"
 FRA_Partner_With_Military_Complex:0 "Partner With Military Complex"
 FRA_Partner_With_Military_Complex_desc:0 "Linking together with miliary complex’s will allow the army to grow and install modern stronger weapons ready to use on any nation that threatens us."
 FRA_End_The_Popular_Vote:0 "End The Popular Vote"
 FRA_End_The_Popular_Vote_desc:0 "The popular vote may allow the people to show who they support but doesn’t give a chance for upcoming leader to have a chance if the media turns against them. Its time to end the popular vote and allow a different method of voting."
 FRA_Encourage_France_First_Votes:0 "Encourge France First Votes"
 FRA_Encourage_France_First_Votes_desc:0 "Vote for France, Vote for the people, Vote for true freedom!"
 FRA_Oligarchs_In_Politics:0 "Oligarchs In Politics"
 FRA_Oligarchs_In_Politics_desc:0 "Its time we allow the corporate leaders into government and some sort of influence into the state. This will ensure business confidence is met and the economy stays in a positive state as well as showing that the country is moving away from the communist outlook."
 FRA_La_Revolution:0 "La Revolution"
 FRA_La_Revolution_desc:0 "It’s time to gather our forces and prepare to march on Paris! Viva La Revolution!!!!!"
 FRA_Overwhelmed_Police_Force:0 "Overwhelmed Police Force"
 FRA_Overwhelmed_Police_Force_desc:0 "Our forces while small are still enough to lay siege to police stations and incite riots. We’ll commit enough petty crime that they don’t notice the real crime going on behind their noses."
 FRA_Call_Up_The_Reserves:0 "Call Up The Reserves"
 FRA_Call_Up_The_Reserves_desc:0 "Old, young, disabled, its time for them to all take part in the REVOLUTION!"
 FRA_Student_Protest:0 "Student Protest"
 FRA_Student_Protest_desc:0 "Students have left the classrooms for the streets. They demand better living conditions, a more representative government, and freedom of Speech. Let’s bring them into our group."
 FRA_The_Yellow_Vest_Riots:0 "The Yellow Vest Riots"
 FRA_The_Yellow_Vest_Riots_desc:0 "The Yellow vest workers all over the nation have risen up and rioted. They demand better pay, better conditions, and an end to the communist regime. We’ll send our representatives to bring them under our wing."
 FRA_Race_Riots_In_The_South:0 "Race Riots In The South"
 FRA_Race_Riots_In_The_South_desc:0 "Le Pen and Soral have incited race riots in the south. While this is deplorable, we can use the chaos to our advantage. Lets temporarily work with these two."
 FRA_Military_Defections:0 "Military Defections"
 FRA_Military_Defections_desc:0 "The Communard military is shrinking by the day. Their generals and soldiers are defecting to hometown militas and it seems within a few weeks, the high command will have no one left."
 FRA_There_Goes_The_Neighbourhood:0 "There Goes The Neighbourhood"
 FRA_There_Goes_The_Neighbourhood_desc:0 "BURN BURN BURN! BURN IT ALL DOWN!"
 FRA_Guillotines_on_The_street:0 "Guillotines On The Street"
 FRA_Guillotines_on_The_street_desc:0 "Some more radical elements of the Revolutionary Forces have taken to an old tactic. Take those who support the government or benefit from it and chop their head off."
 FRA_No_Police_Left:0 "No Police Left?"
 FRA_No_Police_Left_desc:0 "It seems as if the police forces around the nation have completely given up. Stations are empty and looted, power has been turned off and many wonder, where have they gone?"
 FRA_Things_Turn_Violent:0 "Thing Turn Violent"
 FRA_Things_Turn_Violent_desc:0 "Things have finally turned violent. Seems a yellow vest worker got a little too excited with a brand-new handgun"
 FRA_Militas_Form_All_Over:0 "Militas Form All Over"
 FRA_Militas_Form_All_Over_desc:0 "Militas have formed with the express intent of fighting the communist government. Yet we do not have a solid leader. Some favor Soral to take over, while Le Pen seems to be willing to die for democracy. Theres even a group called for the return of Monarch."
 FRA_Return_Of_The_King:0 "Return Of The King"
 FRA_Return_Of_The_King_desc:0 "His Imperial Majesty, Jean Christophe Bonaparte has returned to France in secret after spending all of his life in Monaco. Promising a constitutional monarchy, representative of all, and promising to bring back glory to France, our militias have united under a strong, beautiful, charismatic leader."
 FRA_An_Alliance_With_Sorel:0 "An Alliance With Sorel"
 FRA_An_Alliance_With_Sorel_desc:0 "Alain Soral is a deplorable man who commands deplorable people. But we need his numbers, maybe we can seek to continue this temporary alliance."
 FRA_Reaching_Out_To_International_Allies:0 "Reaching Out To International Allies"
 FRA_Reaching_Out_To_International_Allies_desc:0 "While in Exile, his Royal majesty made friends with some powerful heads of state. It’s time for him to call upon them and get his future subjects to safety."
 FRA_The_Battle_Of_Poitiers:0 "The Battle Of Poitiers"
 FRA_The_Battle_Of_Poitiers_desc:0 "Our forces surrounded the city and demanded a surrender. Yet we have not gotten an answer. We have no other choice than to enter the city and root out the communist evil."
 FRA_A_Bloodless_Siege_Of_Toulouse:0 "A Bloodless Siege Of Toulouse"
 FRA_A_Bloodless_Siege_Of_Toulouse_desc:0 "Our forces surprisingly got a surrender out of the mayor. He has asked the local militas to lay down arms and surrender to our forces. We’ve won our milestone. Now for the rest."
 FRA_The_Toulon_Sabotage:0 "The Toulon Sabotage"
 FRA_The_Toulon_Sabotage_desc:0 "The naval yards in Toloun provide a wealth of resources to the French navy in the south. Our supporters nearby have drafted a plan in which we can sabotage the naval yards while minimizing the risk of casualty. All we need to do is give them the go ahead."
 FRA_Grenoble_Hosts_The_Bonaparte:0 "Grenoble Hosts The Bonaparte"
 FRA_Grenoble_Hosts_The_Bonaparte_desc:0 "Another city has surrendered peacefully to our forces. Lead by his royal majesty himself, the city of Grenoble has requested that no one be killed in exchange for their surrender. The Mayor has even requested a meeting with the Bonaparte heir himself."
 FRA_Setting_Up_Refugee_Camps:0 "Setting Up Refugee Camps"
 FRA_Setting_Up_Refugee_Camps_desc:0 "Many of our citizens have not been able to evacuate. It’s time we set up temporary camps for those fleeing the north and west."
 FRA_March_To_Lyon:0 "March To Lyon"
 FRA_March_To_Lyon_desc:0 "Over the past couple weeks we’ve towards the capitol. Our time is now, we surround the city and we’ve struck fear into the generals who stayed. DOWN WITH THE COMMUNARD!"
 FRA_Surrender_At_Dawn:0 "Surrender At Dawn"
 FRA_Surrender_At_Dawn_desc:0 "After 6 hours of shelling and blockading the city, the upper leadership has surrendered. It’s over, and we can finally rebuild the might of the French people."
 FRA_Prepare_The_Monarchy:0 "Prepare The Monarchy"
 FRA_Prepare_The_Monarchy_desc:0 "Democracy failed, Communism and socialism have failed, fascism has even failed. In 10 days time, with some quick renovations we will coronate Jean-Christophe Bonaparte as Emperor Jean-Christophe I."
 FRA_Form_The_Provisional_Government:0 "Form The Provisional Government"
 FRA_Form_The_Provisional_Government_desc:0 "He’s keeping his promise. Jean-Christophe Bonaparte will not create a royal dictatorship. Instead he will be creating a provisional government where the people in a few months’ time can vote in the first election in decades."
 FRA_Le_Pens_Demons:0 "Le Penns Demons"
 FRA_Le_Pens_Demons_desc:0 "Marine Le Pen has founded an elite unit to hunt down the communards who imprisoned her. All those who support the Reds will die horrid deaths at the hands of Le Pens Demons"
 FRA_Execute_The_Traitors:0 "Execute The Traitors"
 FRA_Execute_The_Traitors_desc:0 "We’ve taken Marseilles by force! Our first order, to execute the traitor communard who calls himself a leader"
 FRA_Counter_The_Islamic_Militias:0 "Counter The Islamic Militias"
 FRA_Counter_The_Islamic_Militias_desc:0 "While small in number, and few in strength, the Islamic militas made up of those fleeing Libya need to be defeated before they turn France into a French caliphate."
 FRA_The_Siege_Of_Brest:0 "Siege Of Brest"
 FRA_The_Siege_Of_Brest_desc:0 "Brest is one of the biggest strategic bases. It supplies the Communard military in the south, and operates a large air base. We need to take the city but it’s doubtful that they’ll surrender peacefully."
 FRA_Fighting_The_Good_Fight:0 "Fighting The Good Fight"
 FRA_Fighting_The_Good_Fight_desc:0 "We’re here, and while we may be losing more soldiers than we’re gaining, we’re fighting the good fight. France will be free of tyranny."
 FRA_Promise_Democratic_Elections:0 "Promise Democratic Elections"
 FRA_Promise_Democratic_Elections_desc:0 "International observers believe that Marine Le Pen will establish a nationalistic dictatorship, but to the contrary she has promised that when all is said and done, France will have democratic elections once again."
 FRA_Setting_Up_Prison_Camps:0 "Setting Up Prison Camps"
 FRA_Setting_Up_Prison_Camps_desc:0 "We need to house communard supporters away from the general populace. Luckily, they built prison camps that we can repurpose into POW camps."
 FRA_Looking_For_International_Help:0 "Looking For International Help"
 FRA_Looking_For_International_Help_desc:0 "A member of our coalition, Jean Christophe Bonaparte has asked his contacts in the Canadian government to accept more French refugees fleeing the increasingly bloody revolution."
 FRA_The_Siege_Of_Paris:0 "The Siege Of Paris"
 FRA_The_Siege_Of_Paris_desc:0 "Paris is in sight of our forces. We’ve struggled and lost but we’ll come to parlay. If they do not surrender, our artillery will fire on the Palace of the Proletariat, and we’ll enter the city by force."
 FRA_Peace_At_Midnight:0 "Peace At Midnight"
 FRA_Peace_At_Midnight_desc:0 "As our APC’s rolled up to the last remaining military stronghold, the remnants of French Leadership would surrender. They we’re taken into custody and at midnight, The Eiffel Accords would be signed."
 FRA_Keeping_The_Promise:0 "Keeping The Promise"
 FRA_Keeping_The_Promise_desc:0 "Marine Le Pen has announced an election to take place in three months’ time. While waiting, a provisional council of her, Jean Christophe Bonaparte and other political leaders will lead a council of representatives."
 FRA_Sorels_Revolution:0 "Sorels Revolution"
 FRA_Sorels_Revolution_desc:0 "Alain Soral has taken absolute power of the rebellion. Using his charisma, many have taken to calling him the French Hitler."
 FRA_The_Knights_Templar:0 "The Knights Templar"
 FRA_The_Knights_Templar_desc:0 "The elite units of the AF forces have taken to calling themselves “The Knights Templar”. They claim to be pious men who fight for God’s glory against the communard heathens."
 FRA_Executing_Le_Pen:0 "Executing Le Penn"
 FRA_Executing_Le_Pen_desc:0 "Le Pen has been a thorn in the side of Soral since the beginning of our revolution. She needs to be dealt with."
 FRA_The_Massacre_Of_Toulouse:0 "The Massacre Of Toulouse"
 FRA_The_Massacre_Of_Toulouse_desc:0 "KILL BURN KILL! THE COMMUNISTS FORFEIT THEIR LIFE"
 FRA_Learn_From_The_Nazis:0 "Learn From The Nazis"
 FRA_Learn_From_The_Nazis_desc:0 "Say what you will, the Nazi’s knew how to control of population. Maybe we need to start controlling the narrative. A French Mein Kampf if you will."
 FRA_Blitzkrieg_Across_The_South:0 "Blitzkrieg Across The South"
 FRA_Blitzkrieg_Across_The_South_desc:0 "BLITZKRIEG! Is what we’ll do to the south. The communards will never see it coming."
 FRA_Using_Prison_Labour:0 "Using Prison Labour"
 FRA_Using_Prison_Labour_desc:0 "We liberated prisons from communard control, but not the prisoners. They have graciously volunteered to help build some new infrastructure."
 FRA_Recruit_From_The_Youth:0 "Recruit From The Youth"
 FRA_Recruit_From_The_Youth_desc:0 "Adolf Hitler had the Hitler Youth, Joseph Stalin had the Young Communists, and now it’s time for Alain Soral to utilize the Templar Squires."
 FRA_Purging_Captured_Minorities:0 "Purging Captured Minorities"
 FRA_Purging_Captured_Minorities_desc:0 "Who needs a Libyan in the new France. France is meant for white, Catholics. Not the sand dwelling muslims who will blow themselves up at the next opportunity."
 FRA_March_On_Paris:0 "March On Paris"
 FRA_March_On_Paris_desc:0 "BURN IT DOWN AND BUILD IT AGAIN!"
 FRA_Raze_Traitor_Cities:0 "Raze Traitor Cities"
 FRA_Raze_Traitor_Cities_desc:0 "BURN IT DOWN AND BUILD SOMETHING BETTER! HAIL SORAL!"
 FRA_The_Revolution_Triumphant:0 "The Revolution Triumphant"
 FRA_The_Revolution_Triumphant_desc:0 "HAIL OUR PEOPLE! HAIL THE FRENCH NATION! HAIL SORAL!"
 FRA_Send_A_Message_To_Paris:0 "Send A Message To Paris"
 FRA_Send_A_Message_To_Paris_desc:0 "We’re closing in on the snakes head. But some of our coalition want to give an offering of peace to the snakes head. Maybe we can salvage part of him, or even tame the snake."
 FRA_We_Survived:0 "We Survivied"
 FRA_We_Survived_desc:0 "In our darkest hour, the PCF has survived. The Riots may still continue but with the assistance of our German neighbors, the French government has been able to quell any serious threat."
 FRA_Disband_The_Politburo:0 "Disband The Politburo"
 FRA_Disband_The_Politburo_desc:0 "The Politburo and the reformist faction is what nearly destroyed us. It’s time that we do away with this last bastion of democracy and fully bring France into the communist world."
 FRA_Declare_A_State_Of_Emergency:0 "Declare A State Of Emergency"
 FRA_Declare_A_State_Of_Emergency_desc:0 "By declaring a state of emergency, the chairman can pass whatever legislation is needed to save the nation from chaos and quell the remaining dissent."
 FRA_Keep_The_Military_On_Alert:0 "Keep The Military On Alert"
 FRA_Keep_The_Military_On_Alert_desc:0 "We won’t demilitarize. Instead, we’ll keep the garrisons on a high alert, this will allow us to ensure a safe and peaceful France for the rest of time."
 FRA_EmpoweR_The_Secret_Police:0 "Empower The Secret Police"
 FRA_EmpoweR_The_Secret_Police_desc:0 "The Secret Police will suddenly find themselves full of new power. Well, this is only the beginning"
 FRA_Start_To_Roll_Back_The_Melenchon_Reforms:0 "Start To Roll Back The Melenchon Reforms"
 FRA_Start_To_Roll_Back_The_Melenchon_Reforms_desc:0 "Jean-Luc Melenchons reforms have damaged the French government. Because of him and his cult of reformists, our nation nearly descended into yet another revolution. It’s time we roll these back and work on healing our government and our party."
 FRA_Arrest_Le_Pen_Soral_And_Macron:0 "Arrest Le Pen And Macron"
 FRA_Arrest_Le_Pen_Soral_And_Macron_desc:0 "Marine Le Pen, Alain Soral, and Emmanuel Macron. What do they have in common? The answer is simple. Political dissidence. It’s time that we deploy the secret police to their hideouts, their homes, and places of worship. They will not survive the coming purges."
 FRA_Roll_Back_The_Wealth_Reforms:0 "Roll Back The Wealth Reforms"
 FRA_Roll_Back_The_Wealth_Reforms_desc:0 "The wealth of our generals is no concern for the common proletariat. They may be rich, but they use their wealth to bring France into a glorious age."
 FRA_Not_All_His_Reforms_Were_Bad:0 "Not All His Reforms Were Bad"
 FRA_Not_All_His_Reforms_Were_Bad_desc:0 "Not all of Melenchons reforms were bad. Particularly the term limits for leaders is nice. We the PCF will keep term limits on our leaders to encourage innovation in the party."
 FRA_Put_Melenchon_On_Trial:0 "Put Melenchon On Trial"
 FRA_Put_Melenchon_On_Trial_desc:0 "Jean-Luc Melenchon..one of the biggest traitors to the French nation. His trial will be public and those who supported him will see the error of their ways when he is sentenced on the stand."
 FRA_The_Melenchon_Sentencing:0 "The Melenchon Sentencing"
 FRA_The_Melenchon_Sentencing_desc:0 "It’s come time for the sentencing. Many believe he will be executed, but others believe that he will be exiled from the nation."
 FRA_End_The_Cult_Of_Reformism:0 "End The Cult Of Reformism"
 FRA_End_The_Cult_Of_Reformism_desc:0 "With Melenchon out of the way, it’s time for us to finish off the Cult of Reformism forever. Statues, books, music, radio stations, etc. all gone."
 FRA_Introduce_Robert_Hue_As_Chairman:0 "Introduce Robert Hue As Chairman"
 FRA_Introduce_Robert_Hue_As_Chairman_desc:0 "Robert Hue has been selected to take over the spot of Chairman. While our temporary replacement for Melenchon did his job, Hue’s ambitions are massive and those in the upper party believe that he will be the man to lead France into a new age of dominance. Finally, the world won’t laugh at France."
 FRA_Draw_Closer_To_The_Soviets:0 "Draw Closer To The Soviets"
 FRA_Draw_Closer_To_The_Soviets_desc:0 "By drawing closer to the Soviets, we can strengthen not only our positions in the pact but also learn some of their secrets."
 FRA_Appoint_Buffet_As_Head_Of_The_Secret_Police:0 "Appoint Buffet As Head Of The Secret Police"
 FRA_Appoint_Buffet_As_Head_Of_The_Secret_Police_desc:0 "Marie George Buffet. A name which strikes fear into all citizens of the Republic. It’s time she gets a new promotion in which she can take over the French secret police."
 FRA_Communism_With_French_Characteristics:0 "Communism With French Characteristics"
 FRA_Communism_With_French_Characteristics_desc:0 "Communism..it’s great and all but it could be better. All great things come out of France. Instead of following the doctrines of Stalinism like the rest of France, we are going to come up with our own form of Communism..aka Jacobinism. "
 FRA_Shut_Down_The_Universities:0 "Shut Down The Universities"
 FRA_Shut_Down_The_Universities_desc:0 "An educated proletariat is a dangerous proletariat."
 FRA_Place_Ideology_Guards_In_The_Classroom:0 "Place Ideology Guards In The Classroom"
 FRA_Place_Ideology_Guards_In_The_Classroom_desc:0 "The schools are what bred the reformist ideology. To solve this problem, we’re implementing a special position within the military. The ideology Corps. These men and women will sit in the schools all day every day making sure that the teachers are keeping up with the party line and not preaching reformism or other dangerous ideologies."
 FRA_Ban_Reformist_Literature:0 "Ban Reformist Literature"
 FRA_Ban_Reformist_Literature_desc:0 "Books..more like terrorist training manuals."
 FRA_National_Exercise_Programs:0 "National Exercise Programs"
 FRA_National_Exercise_Programs_desc:0 "A fat proletariat is a drain on the system. Come on fatty, get up. 1.2.3.4 there we go..feel the burn."
 FRA_Work_Or_Exile:0 "Work Or Exile"
 FRA_Work_Or_Exile_desc:0 "Either you work for the betterment of the nation, or you leave the nation! There is no in between."
 FRA_Place_Cameras_In_Homes:0 "Place Cameras In Homes"
 FRA_Place_Cameras_In_Homes_desc:0 "By placing cameras in homes, we can make sure that no one, regardless of rank in society are a threat to the nation."
 FRA_Begin_A_New_Three_Year_Plan:0 "Begin A New Three Year Plan"
 FRA_Begin_A_New_Three_Year_Plan_desc:0 "Time to begin a new..better three year plan than anyones ever had before."
 FRA_Put_Prisoners_To_Work:0 "Put Prisoners To Work"
 FRA_Put_Prisoners_To_Work_desc:0 "Prisoners, what do they do? Sit there all day? Instead of exile, lets put them to work."
 FRA_Implement_Prison_Struggle_Session:0 "Implement Prison Struggle Session"
 FRA_Implement_Prison_Struggle_Session_desc:0 "Struggle sessions were first pioneered by the visionary Mao Zedong. If we implement them in the prison system, we can ideologically convert even the most resistant prisoners and make them into model Jacobins."
 FRA_Through_Resisters_Into_Mental_Hospitals:0 "Throw Resisters Into Mental Hospitals"
 FRA_Through_Resisters_Into_Mental_Hospitals_desc:0 "There are those who somehow resist the struggle sessions, and they need to be brought into the mental health sector rather than prison. After all, who doesn’t want to be a communist?"
 FRA_Reopen_The_Gulag:0 "Reopen The Gulag"
 FRA_Reopen_The_Gulag_desc:0 "By reopening the Gulags we can bring the French resistance to its knees. The newly renovated “Work vacation centers” will be away from major population centers."
 FRA_Time_To_Sovietise_France:0 "Time To Sovietise France"
 FRA_Time_To_Sovietise_France_desc:0 "It’s time we take a great leap forward to bring France and Jacobinism closer to Moscow."
 FRA_Hues_First_Three_Year_Plan:0 "Hues First Three Year Plan"
 FRA_Hues_First_Three_Year_Plan_desc:0 "Robert Hue, in all his glorious majesty has drafted up one of the first three year plans which will allow France to overtake the economic powerhouse that is Russia."
 FRA_Rebuilding_Northern_Factories:0 "Rebuilding Northern Factories"
 FRA_Rebuilding_Northern_Factories_desc:0 "Once the depression hit France, our northern industries were hit the hardest. It’s time we reopen and rebuild the factories."
 FRA_Expand_Textile_Factories:0 "Expand Textile Factories"
 FRA_Expand_Textile_Factories_desc:0 "While the Italians rebuilt their textile industry, our own version of it has failed. With government subsidies we can rebuild the industry from the ground up. By doing this, we can ensure that one industry after the other slowly overtakes Europe. We’ll take economic power away from Moscow, and direct it towards us."
 FRA_Expanding_Eastern_Power_Plants:0 "Expanding Eastern Power Plants"
 FRA_Expanding_Eastern_Power_Plants_desc:0 "The power plants in Eastern France supply power to not only most of France but also Luxembourg, Monaco, and Belgium. By expanding their capabilities we can not only employ more of our people but supply power to more and more of the Pact, maybe even some of the non-communist nations."
 FRA_Reopen_Old_Car_Factories:0 "Reopen Old Car Factories"
 FRA_Reopen_Old_Car_Factories_desc:0 "By working together with the Italian government, we can focus on rebuilding the auto-industry. Together our two nations can take the auto-industry away from the Soviets and create a new home for the industry in France."
 FRA_Rebuilding_Southern_Infrastructure:0 "Rebuilding Southern Infrastructure"
 FRA_Rebuilding_Southern_Infrastructure_desc:0 "Infrastructure in the south has gone to hell. It’s time we finally rebuild these roads, bridges, rail tracks, etc."
 FRA_Paris_To_Nice_Highway:0 "Paris To Nice Highway"
 FRA_Paris_To_Nice_Highway_desc:0 "Nice is a major shipping port in the Mediterranean, if we connect Paris to it, we can improve our capitols economic standing."
 FRA_Paris_To_Brest_Highway:0 "Paris To Brest Highway"
 FRA_Paris_To_Brest_Highway_desc:0 "Brest is a trouble spot, but this highway will bring new industries to Brittany and allow us to expand our operations east."
 FRA_Nice_To_Montpellier_Highway:0 "Nice To Montpellier"
 FRA_Nice_To_Montpellier_Highway_desc:0 "Montpellier is a major industrial center, but by connecting it to Nice, we can lower the cost of shipping our industrial goods across the continent."
 FRA_Rebuild_The_Champagne_Industry:0 "Rebuild The Champagne Industry"
 FRA_Rebuild_The_Champagne_Industry_desc:0 "Champagne is more French than Napoleon and Cheese. By rebuilding the industry we can show the world that in France, the proletariat lives the high life."
 FRA_Expand_Wine_Production:0 "Expand Wine Production"
 FRA_Expand_Wine_Production_decs:0 "In rebuilding the Champagne industry, we are also working to expand the wine industry. The first of many plantations “Chateau Picard”, has reopened and now we can hopefully increase our production."
 FRA_Prison_Labor_On_The_Vineyards:0 "Prison Labour On The Vineyards"
 FRA_Prison_Labor_On_The_Vineyards_desc:0 "By expanding our prison labor programs to the vineyards, we can not only cut costs on employment, but also give the prisoners an appreciation for the wine industry."
 FRA_Exporting_The_Best_To_The_Pact:0 "Exporting The Best To The Pact"
 FRA_Exporting_The_Best_To_The_Pact_desc:0 "Our industries are rebuilt, our lands fertile, and our people employed. We produce more than enough for our people, and now we can export the best products we produce to the other countries of the Warsaw Pact. We’ve succeeded in taking the economic power away from the Soviets."
 FRA_Buffets_Reign_Of_Terror:0 "Buffets Reign Of Terror"
 FRA_Buffets_Reign_Of_Terror_desc:0 "Buffet has begun her reign of terror, free from the restriction of the state."
 FRA_Deploying_Undercovers_In_Classrooms:0 "Deploying Undercovers In Classrooms"
 FRA_Deploying_Undercovers_In_Classrooms_desc:0 "By deploying undercover agents in classrooms, we can strike at the source of rebellion before they even think of rebelling."
 FRA_Arresting_Treasonous_Students:0 "Arresting Treasonous Students"
 FRA_Arresting_Treasonous_Students_desc:0 "There will always be those who believe they know better than the party. Once they spout the tiniest bit of treasonous speech, we can arrest them and send a message to the rest of their comrades."
 FRA_Replace_Professors_With_Officers:0 "Replace Professors With Officers"
 FRA_Replace_Professors_With_Officers_desc:0 "Professors are overpaid liberals who believe they have the right to decide what students do and do not learn. We can solve this problem by replacing professors with military officers who know the true glory of the party."
 FRA_Form_The_School_To_Officer_Pipeline:0 "Form The School To Officer Pipeline"
 FRA_Form_The_School_To_Officer_Pipeline_desc:0 "Once graduated from upper education, the students of today can become the best officers of tomorrow. By Buffets soul, they will make France great."
 FRA_Setting_Up_Private_Prisons:0 "Setting Up Private Prisons"
 FRA_Setting_Up_Private_Prisons_desc:0 "By setting up private prisons and allowing the upper members of the party to control a prison, we can both satisfy some of their more psychopathic urges while relieving the stress on the gulag system."
 FRA_Setting_Up_A_Thought_Police:0 "Setting Up A Thought Police"
 FRA_Setting_Up_A_Thought_Police_desc:0 "The thought police will monitor any and all channels to dispute non-party thought."
 FRA_Set_Up_Public_Executions:0 "Set Up Public Executions"
 FRA_Set_Up_Public_Executions_desc:0 "The Bastille will be reopened for the first time in centuries. There we will house the dissidents of our nation and publicly execute them, so those who want to rebel, never get the chance."
 FRA_Take_Control_Of_The_Surveillance_State:0 "Take Control Of The Surveillance State"
 FRA_Take_Control_Of_The_Surveillance_State_desc:0 "Buffets police forces will now take over the nations surveillance and make sure that no matter what, the Jacobins will remain in power forever."
 FRA_Begin_The_Transformation:0 "Begin The Transformation"
 FRA_Begin_The_Transformation_desc:0 "It’s time for us to begin our transformation into a better state than the soviets. Using the methods they’ve perfected, we’ll “sovietize” France and bring her into a new era."
 FRA_Change_Our_Flag_And_Name:0 "Change Our Flag And Name"
 FRA_Change_Our_Flag_And_Name_desc:0 "The first step in this “sovietization” is changing our name and flag to something which better represents our identity."
 FRA_Copy_Stalins_Cult_Of_Personality:0 "Copy Stalins Cult Of Personality"
 FRA_Copy_Stalins_Cult_Of_Personality_desc:0 "Stalin was a tyrant, but he knew what he was doing. All around France, workers are hanging pictures of Chairman Hue in factories and homes. The face of Hue has been plastered on every building."
 FRA_Raise_Statues_Of_Hue:0 "Raise Statues Of Hue"
 FRA_Raise_Statues_Of_Hue_desc:0 "One of the biggest statues, only slightly smaller than the Eiffel tower itself is being raised in Paris. No one will question his authority."
 FRA_Sideline_The_Church:0 "Sideline The Church"
 FRA_Sideline_The_Church_desc:0 "The church, while nice is only there to oppress the worker under the watchful eye of the all-knowing God. Ms. Buffet believes that we can sideline the catholic church and bring more workers into blissful atheism."
 FRA_Criminalise_All_Religion:0 "Criminalise All Religion"
 FRA_Criminalise_All_Religion_desc:0 "Religion, whether it be Islam, Judaism, Orthodoxy or Catholicism is a plague upon the Earth. It’s time we shut down any and all places of worship. After all, you only need to worship the party."
 FRA_Shut_Down_The_Public_Libaries:0 "Shut Down The Public Libaries"
 FRA_Shut_Down_The_Public_Libaries_desc:0 "Public libraries are one of the biggest reformist meeting spots. We’ll shut them down and replace them with State-run libraries."
 FRA_Form_Our_Own_Pravda:0 "Form Our Owen Pravda"
 FRA_Form_Our_Own_Pravda_desc:0 "The Pravda of the USSR works amazingly for propaganda. By creating our own we can create a new source of information for those in our sphere."
 FRA_Create_A_Communist_Youth_Org:0 "Create A Communist Youth Org"
 FRA_Create_A_Communist_Youth_Org_desc:0 "Kids need something to do. Some code for video games, some take part in sports. But if we create mandatory organizations for the kids to join, we can help mold the next generation of communists."
 FRA_Form_Our_Own_Social_Media:0 "Form Our Own Social Media"
 FRA_Form_Our_Own_Social_Media_desc:0 "Twitter, while allowed, is a cesspool of insanity. We will create our social media organizations so those in the communist world do not have to exposed to the tone deaf ideologues of the west."
 FRA_The_Future_Of_France:0 "The Future Of France"
 FRA_The_Future_Of_France_desc:0 "The time has come, we realize that while nearly impossible we can take leadership of the Pact and bring the center of the world to France. Or we can stay subservient to Moscow."
 FRA_Take_Leadership_Of_The_Pact:0 "Take Leadership Of The Pact"
 FRA_Take_Leadership_Of_The_Pact_desc:0 "Moscow has become bloated with power. They no longer understand the revolution, nor will they advance the cause of the worker. It’s time we move on Moscow, but first we need to take control of the Pact."
 FRA_Subservience_To_The_Soviets:0 "Subservience To The Soivets"
 FRA_Subservience_To_The_Soviets_desc:0 "The last war was devastating enough for France. We’re in a good area economically. We can’t afford to wage war with Moscow."
 FRA_Reach_Out_To_Our_German_Neighbours:0 "Reach Out To Our German Neighbours"
 FRA_Reach_Out_To_Our_German_Neighbours_desc:0 "Ahhh, the Germans. Nazis and now communists. Given our countries close histories, it’s only natural that we extend the olive branch. If we win this gamble, we’ll control Central Europe and in turn the rest will have to fall in line."
 FRA_The_German_Failure:0 "The German Failure"
 FRA_The_German_Failure_desc:0 "Our meeting with the German representatives in Munich went horribly. We’ll never succeed without the Germans, so for now we must bide our time."
 FRA_Use_The_Germans_Pressure_The_Benelux:0 "Use The Germans Pressure The Benelux"
 FRA_Use_The_Germans_Pressure_The_Benelux_desc:0 "With the German success, we’ll use them to pressure the Benelux governments into supporting us during the upcoming battle."
 FRA_Reaech_Out_To_The_Italians:0 "Reach Out To The Italians"
 FRA_Reaech_Out_To_The_Italians_desc:0 "Our industries are already tied together, so why not bridge the gap between our governments. The Italians seeing that we have the Germans and Benelux on our side will have no choice but to support us."
 FRA_Invite_The_Greeks_And_Turks:0 "Invite The Greeks And Turks"
 FRA_Invite_The_Greeks_And_Turks_desc:0 "The Greeks and Turks have been suffering under the USSR for the last couple decades. They will support us in the upcoming battle if we promise to heal their economies."
 FRA_Invite_The_Rest_Of_The_Balkans:0 "Invite The Rest Of The Balkans"
 FRA_Invite_The_Rest_Of_The_Balkans_desc:0 "With the Greeks, Turks, Italians, Germans, Benelux, and even the Poles under our sway, it’s time we take complete and full control of the Balkans."
 FRA_An_Ultimatum_To_Moscow:0 "An Ultimatum To Moscow"
 FRA_An_Ultimatum_To_Moscow_desc:0 "Europe is united, united against the tyranny of the Russians. We will deliver our ultimatum to Moscow. First, they will pull out of the Warsaw Pact and turn control of it over to us. Secondly, they will give us the body of Comrade Stalin so we can give him the burial a true revolutionary deserves. Third and finally all intelligence operations being conducted by the NKVD will cease in Europe and abroad."
 FRA_The_Soviets_Concede:0 "The Soviets Concede"
 FRA_The_Soviets_Concede_desc:0 "The Soviets have surprisingly conceded. The time for France is now."
 FRA_Uniting_Europe:0 "Uniting Europe"
 FRA_Uniting_Europe_desc:0 "Under the banner of Communism, we can unite the workers of Europe."
 FRA_Time_To_Spread_The_Revolution:0 "Time To Spread The Revolution"
 FRA_Time_To_Spread_The_Revolution_desc:0 "True to Trotsky's ideals. The French Communard government will spread the revolution from the Atlantic to the Pacific."
 FRA_Turn_The_Green_Isle_Red:0 "Turn The Green Isle Red"
 FRA_Turn_The_Green_Isle_Red_desc:0 "The Irish nation has been isolated for time now. With their rich history of oppression, we will liberate the workers of ireland and show them the glory of communism."
 FRA_Revolutionising_Iberia:0 "Revolutionising Iberia"
 FRA_Revolutionising_Iberia_desc:0 "The histories of Iberia and France are intertwined. When the revolution is brought to the people of Iberia, then and only then can the revolution truly progress."
 FRA_Uniting_The_European_Communities:0 "Uniting The European Communities"
 FRA_Uniting_The_European_Communities_desc:0 "Under our guidance, the revolution of Europe will be one of unity. The European Union of Socialist Republics will be what Lenin and Trotsky could only dream of."
 FRA_Bring_True_Communism_To_Russia:0 "Bring True Communism To Russia"
 FRA_Bring_True_Communism_To_Russia_desc:0 "talinism was a fork in the road of the revolution. Instead of liberating the worker, it only oppresses them. Our forces will march from Moscow to Vladivostok, liberating the soviet citizens along the way."
 FRA_World_War_III:0 "World War III"
 FRA_World_War_III_desc:0 "The Soviets have as expected refused our demands. They’ve crossed the border in Poland and declared war. It’s us or them."
 FRA_Aftermath_Of_The_War:0 "Aftermath Of The War"
 FRA_Aftermath_Of_The_War_desc:0 "The War is over. Europe lies in devastation and many wonder what for."
 FRA_Victory_But_At_What_Cost:0 "Victory But At What Cost"
 FRA_Victory_But_At_What_Cost_desc:0 "We won, but our population has been practically halved."
 FRA_The_Lost_Generation:0 "The Lost Generation"
 FRA_The_Lost_Generation_desc:0 ""
 FRA_The_West_Starved_The_East_Burned:0 "The West Starved The East Burned"
 FRA_The_West_Starved_The_East_Burned_desc:0 ""
 FRA_The_Way_To_Survive_Unite_Europe:0 "The Way To Survive Unite Europe"
 FRA_The_Way_To_Survive_Unite_Europe_desc:0 "There is only one way to survive the coming troubles. Together, our economies can recover but first we need to put away old rivalries. We need to unite Europe."
 FRA_Declare_The_Peoples_European_Union:0 "Declare The Peoples Union"
 FRA_Declare_The_Peoples_European_Union_desc:0 "Together we are united. Together we are liberated. Together we are the Peoples European Union!"
 FRA_Why_Fight_A_War_If_No_One_Won:0 "Why Fight A War If No One Won"
 FRA_Why_Fight_A_War_If_No_One_Won_desc:0 "The war was devastating for all. No one came out on top."
 FRA_Facing_Discontent_At_Home:0 "Facing Discontent At Home"
 FRA_Facing_Discontent_At_Home_desc:0 "On the homefront, we preached a pyric victory. However, the treaty of Vistula shows that we barely did a thing. Food riots are happening everywhere."
 FRA_Declare_Another_Martial_Law:0 "Declare Another Martial Law"
 FRA_Declare_Another_Martial_Law_desc:0 "To stop another revolution, we will declare martial law again."
 FRA_The_Downfall_Of_Robert_Hue:0 "The Downfall Of Robert Hue"
 FRA_The_Downfall_Of_Robert_Hue_desc:0 "Robert Hue has been killed. Assassinated by a member of the upper party, the man is remembered for bringing France to glory and then destroying it all at once."
 FRA_The_French_Malenkov:0 "The French Malenkov"
 FRA_The_French_Malenkov_desc:0 "Robert Hue’s second in command, Charles Fitterman has been elected Chairman by a majority of the party. Many believe he will become the French version of Grigory Malenkov and heal the division within France."
 FRA_Loosen_Restrictions_on_The_Church:0 "Loosen Restrictions On The Church"
 FRA_Loosen_Restrictions_on_The_Church_desc:0 "The first act of Chairman Fitterman is to bring the Church back into the spotlight."
 FRA_Jumpstart_The_Peoples_Tourist_Industry:0 "Jumpstart The Peoples Tourist Indsutry"
 FRA_Jumpstart_The_Peoples_Tourist_Industry_desc:0 "The peoples tourist industry will not only create a nationalistic sense of pride in ones nation, but will allow the state governments to profit from their decrepit landmarks."
 FRA_Creating_A_United_Pact_Currency:0 "Creating A United Pact Currency"
 FRA_Creating_A_United_Pact_Currency_desc:0 "In the final bit of helping the pact. Chairman Fitterman has proposed a united currency for those in the Pact. The Marx will replace all forms of currency and hopefully help our economies."
 FRA_A_Warsaw_Collapse:0 "A Warsaw Collapse"
 FRA_A_Warsaw_Collapse_desc:0 "The Warsaw Pact is beyond close to failing."
 FRA_Tighten_The_Pact:0 "Tighten The Pact"
 FRA_Tighten_The_Pact_desc:0 ""
 FRA_Create_The_PEC:0 "Create The PEC"
 FRA_Create_The_PEC_desc:0 "To stop the pact from collapsing, we’re proposing the Peoples Economic Community. This will ensure that European nations look out for Europe first, not Russia."
 FRA_Encourage_Foreign_Investment:0 "Encourage Foreign Investment"
 FRA_Encourage_Foreign_Investment_desc:0 "Sadly, to recover we will need to invite foreign capitalist companies in our lands to prevent our economies from going into a freefall."
 FRA_Put_Our_Militaries_To_Work:0 "Put Our Militaries To Work"
 FRA_Put_Our_Militaries_To_Work_desc:0 "Our militaries are devastated and the last thing they want to do is fight. We will instead but them to work in the fields. All across the devastated lands of Europe, they will produce new farms, more food, and heal the lands."
 FRA_Detente_With_The_Russians:0 "Detenté With The Russians"
 FRA_Detente_With_The_Russians_desc:0 "Our war with the Russians didn’t go as we planned. We’ll work to keep our control of the Pact firm, but also keep a close eye on them."
 FRA_New_Day_New_Empire:0 "New Day New Empire"
 FRA_New_Day_New_Empire_desc:0 "It’s a new day upon us. Our communard rulers have been deposed and exiled while the true government has returned to France."
 FRA_The_Provisional_Authority:0 "The Provisional Authority"
 FRA_The_Provisional_Authority_desc:0 "In an effort to stabilize our nation before the coronation of his royal majesty, we’re establishing “The Imperial Provisional Authority” to rule. Made up of loyalist generals and politicians this council will be charged with stabilizing the nation before we truly invite Bonaparte to rule."
 FRA_First_Step_Recovery:0 "First Step Recovery"
 FRA_First_Step_Recovery_desc:0 "The Imperial Authority will focus on the recovery of our nation and repair our streets."
 FRA_Rebuilding_Infrastructure:0 "Rebuilding Infrastructure"
 FRA_Rebuilding_Infrastructure_desc:0 "During some of the heaviest fighting, our infrastructure was completely destroyed. We’ll bring water and electricity back to homes before we restore roads to working order."
 FRA_Subsidizing_Farms:0 "Subsidizing Farms"
 FRA_Subsidizing_Farms_desc:0 "Well infrastructure may be nice, it won’t be enough until we restore food production to pre-revolution levels."
 FRA_Imprisoning_Collaborators:0 "Imprisoning Collaborators"
 FRA_Imprisoning_Collaborators_desc:0 "Those who collaborated with the communard scum during the revolution do not deserve freedom. Le Pen has drafted up a plan to repurpose the old gulags into rehabilitation and re-education centers. Only when they realize the folly of their ways can they prosper in our new nation."
 FRA_Inviting_Companies_Back:0 "Inviting Companies Back"
 FRA_Inviting_Companies_Back_desc:0 "All capitalistic companies fled abroad when the communards took power. While not helping in the revolution, if we are to have any economic power in the near future we need to invite them back."
 FRA_Restocking_Store_Shelves:0 "Restocking Store Shelves"
 FRA_Restocking_Store_Shelves_desc:0 "With infrastructure rebuilt and food production up and running it’s time to bring food back to shelves. We’ll feed the starving once more."
 FRA_Reopen_Schools:0 "Reopen Schools"
 FRA_Reopen_Schools_desc:0 "How can children bring the new Empire to glory if they do not learn? The answer is simple, they won’t. Our Emperor himself has proclaimed that schools shall reopen and no longer will they be leftist indoctrination centers."
 FRA_Reopen_Small_Business:0 "Reopen Small Businesses"
 FRA_Reopen_Small_Business_desc:0 "It’s been a rough time for small businesses. But with the help of Chancellor Emmanuel Macron, small businesses will be able to reopen and sell products of their choice."
 FRA_Second_Step_Politics:0 "Second Step, Politics"
 FRA_Second_Step_Politics_desc:0 "Now that the economy is recovering, it’s time we return to the problem of politics. Both Chancellor Macron and Chancellor Le Pen agree on limited party freedom for now. If in a generation or two the people prove ready for democracy, then it will be up to the Emperor or Empress to restore it."
 FRA_Ensuring_Limited_Party_Freedom:0 "Ensuring Limited Party Freedom"
 FRA_Ensuring_Limited_Party_Freedom_desc:0 "Democracy is nice and everything but we can not allow extremist parties to run in elections."
 FRA_Ensure_Local_Democracy:0 "Ensure Local Democracy"
 FRA_Ensure_Local_Democracy_desc:0 "Chancellor Macron will ensure that on the local level democracy is maintained. After all the Emperor can not be everywhere at once."
 FRA_Ban_The_Communist_Party:0 "Ban The Communist Party"
 FRA_Ban_The_Communist_Party_desc:0 "Damn communards ruined this nation. Why would we allow them to run for office again? We’re not Germany."
 FRA_Forming_An_Imperial_Parliament:0 "Forming An Imperial Parliament"
 FRA_Forming_An_Imperial_Parliament_desc:0 "To keep with our promise of democracy and representation, the Imperial parliament Is to be formed. For now they are to meet in Versailles but in years time, the Imperial House of Parliament and Imperial Courts will be built over the rubble of the old Palace of the Proletariat."
 FRA_Coronation_At_Notre_Dame:0 "Coronation At Notre Dame"
 FRA_Coronation_At_Notre_Dame_desc:0 "The time has come and under gods will, Jean Christophe Bonaparte will be crowned as Emperor Jean Christophe I, Emperor of France and Aquitaine, heir to the legacy of Napoleon the Great, the butcher of Communards, the Pious restorer, and the Peoples Emperor."
 FRA_The_Imperial_Restoration:0 "The Imperial Restoration"
 FRA_The_Imperial_Restoration_desc:0 "The Communard Regime has been overthrown and it’s time that we restore the true ruler of France to power. Hail Bonaparte."
 FRA_Ruling_With_The_Peoples_Consent:0 "Ruling With The Peoples Consent"
 FRA_Ruling_With_The_Peoples_Consent_desc:0 "We will not be an absolute monarchy as in the past. Instead the new Empire will rule the motherland with the consent of the peoples. We’ll select a Prime minister out of the allies from the revolution."
 FRA_Withdraw_From_Eastern_Europe:0 "Withdraw From Eastern Europe"
 FRA_Withdraw_From_Eastern_Europe_desc:0 "Formally France is still part of the Warsaw Pact. No more. As of today, we withdraw our membership, expel embassies of the Warsaw Powers, and officially condemn the Soviet regime."
 FRA_The_Emperor_Survives:0 "The Emperor Survives"
 FRA_The_Emperor_Survives_desc:0 "The Emperor has survived an attack by a communist gunman. While no longer in the capital, he is said to be healing in a top-secret mountainside hospital."
 FRA_The_Hospital_Address:0 "The Hosptial Address"
 FRA_The_Hospital_Address_desc:0 "From his hospital room, the Emperor will address the nation. France is strong and will get through this moment."
 FRA_Getting_Back_To_Ruling:0 "Getting Back To Ruling"
 FRA_Getting_Back_To_Ruling_desc:0 "With the Emperor out of the hospital, it’s time that he moves to consolidate power and rule France."
 FRA_End_Martial_Law:0 "End Martial Law"
 FRA_End_Martial_Law_desc:0 "With the Emperor out of the hospital, it’s time that we end the martial law. He is no longer in danger."
 FRA_The_Sister_Is_Coronated:0 "The Sister Is Coronated"
 FRA_The_Sister_Is_Coronated_desc:0 "With the Emperor in a coma, it’s time that we select a replacement. In times like these, the siblings of a royal tended to take power. The Emperors sister will be coronated as Crown Regent until her brother is brought out of his coma."
 FRA_Maintaining_The_Peace:0 "Maintaining The Peace"
 FRA_Maintaining_The_Peace_desc:0 "The peace must be maintained for the emperors sake."
 FRA_Moving_The_Real_Emperor:0 "Moving The Real Emperor"
 FRA_Moving_The_Real_Emperor_desc:0 "In an effort to keep the Emperor safe from any harm, we are moving him and his medical team to Vatican City."
 FRA_Declare_Communism_To_Be_Illegal:0 "Declare Communism To Be Illegal"
 FRA_Declare_Communism_To_Be_Illegal_desc:0 "Due to the violent nature of the ideology, the Regent declares communism to be illegal."
 FRA_Making_France_Great_Agaub:0 "Making France Great Again"
 FRA_Making_France_Great_Agaub_desc:0 "While our Empire is ready to expand, we need to focus on more pressing issues such as bringing the exiled nobles back home."
 FRA_Inviting_The_Nobles_Back:0 "Inviting The Nobles Back"
 FRA_Inviting_The_Nobles_Back_desc:0 "With the Communard regime overthrown, it’s time that we invite the old nobility back into the country."
 FRA_Draw_Closer_To_The_West:0 "Draw Closer To The West"
 FRA_Draw_Closer_To_The_West_desc:0 "The West has lost their way and many of their nations are close to collapse. But they are better than the alternative in the East."
 FRA_The_House_Of_Nobles:0 "The House Of Nobles"
 FRA_The_House_Of_Nobles_desc:0 "As part of giving the nobles some form of power again, we are going to copy the English and create a House of Nobles where they too can put forth their ideas on laws."
 FRA_Granting_Small_Titles:0 "Granting Small Titles"
 FRA_Granting_Small_Titles_desc:0 "We’ll grant the Nobility small titles to please them, although these will be purely symbolic."
 FRA_The_Ministry_Of_Colonies:0 "The Ministry Of Colonies"
 FRA_The_Ministry_Of_Colonies_desc:0 "As part of the Restoration of the French Empire, the ministry of colonies shall be created and headed up by minor rebel leader Eric Zemmour."
 FRA_Preparing_The_Military:0 "Preparing The Military"
 FRA_Preparing_The_Military_desc:0 "With the ministry of colonies ready to reclaim our lost colonies, we need to prepare our military. Our royal majesty has called for the military to expanded and ready at a moments notice."
 FRA_Back_Into_The_World:0 "Back Into The World"
 FRA_Back_Into_The_World_desc:0 "From the shores of Calais to the tip of Africa, the light of France shall shine!"
 FRA_The_Emperor_Has_Died:0 "The Emperor Has Died"
 FRA_The_Emperor_Has_Died_desc:0 "The bullet has killed his royal majesty. Our nation is in need of a new leader, and while we’ve reached out to Jean-Christophes sister, she has declined the opportunity to rule."
 FRA_Convene_The_Imperial_Parliament:0 "Convene The Imperial Parliament"
 FRA_Convene_The_Imperial_Parliament_desc:0 "In selecting a new leader, the Imperial Parliament has been convened. In a few days’ time, they will select a new Monarch to rule the Empire and bring us to glory."
 FRA_Electing_A_New_Monarch:0 "Electing A New Monarch"
 FRA_Electing_A_New_Monarch_desc:0 "It’s time to decide the Empires future. Will we crusade once again under the rule of the Bourbons, Will we succeed Hitler with the Orleans, can we convince another Bonaparte to rule, or will we look to an unorthodox option to save our nation."
 FRA_The_Orleans_Triumphant:0 "The Oreleans Triumphant"
 FRA_The_Orleans_Triumphant_desc:0 "The Nationalist Orleans heir has won the favor of the Imperial Parliament."
 FRA_Forming_A_Mass_Surveillance_State:0 "Forming A Mass Surveillance State"
 FRA_Forming_A_Mass_Surveillance_State_desc:0 "Our Emperor has deemed that the specter of communism still leans over the French people. To solve this, a mass surveillance state is being set up."
 FRA_Cameras_On_Every_Street:0 "Cameras On Every Street"
 FRA_Cameras_On_Every_Street_desc:0 "Starting out, the French people will have every move of theirs watched."
 FRA_Set_Up_Secret_Courts:0 "Set Up Secret Courts"
 FRA_Set_Up_Secret_Courts_desc:0 "The courts can be bribed, but secret courts give us all the jurisdiction we need."
 FRA_Inviting_Nationalists_Into_Government:0 "Inviting Nationalists Into Government"
 FRA_Inviting_Nationalists_Into_Government_desc:0 "Marine Le Pen served the previous emperor and rebellion well. Our Royal Majesty wants her in his government as a close advisor."
 FRA_Rebuild_The_Prison_Camps:0 "Rebuild The Prison Camps"
 FRA_Rebuild_The_Prison_Camps_desc:0 "The Communards had one good idea in copying the Soviet gulag system. His Royal Majesty has decreed that that we rebuild the camps and convert them into “Work centers”"
 FRA_Round_Up_The_Minorities:0 "Round Up The Minorities"
 FRA_Round_Up_The_Minorities_desc:0 "After building the “Work Centers” , the guards noted we needed people to “work” at these “work” centers. So to solve this, many minority groups have been “voluntarily” employed in these camps."
 FRA_Empty_The_Prisons:0 "Empty The Prisons"
 FRA_Empty_The_Prisons_desc:0 "Along with the “voluntary” minority groups. The French government is emptying the prisons and sending the prisoners to the “work centers”."
 FRA_Propaganda_Education:0 "Propaganda Education"
 FRA_Propaganda_Education_desc:0 "THE EMPEROR IS A GOD!"
 FRA_Even_Family_Can_Be_Traitors_To_The_Emperor:0 "Even Family Can Be Traitors To The Emperor"
 FRA_Even_Family_Can_Be_Traitors_To_The_Emperor_desc:0 "Even family members can betray the Emperor. Remember Kids, if you see something say something."
 FRA_Establish_A_Cult_Of_Personality:0 "Establish A Cult Of Personality"
 FRA_Establish_A_Cult_Of_Personality_desc:0 "THE EMPEROR IS BETTER THAN GOD! WORSHIP HIM!"
 FRA_We_Can_Never_Be_Safe:0 "We Can Never Be Safe"
 FRA_We_Can_Never_Be_Safe_desc:0 "Communism remains a threat of which we will never be safe. Remain vigilant, remain stalwart!"
 FRA_The_Triumphant_Bourbon:0 "The Triumphant Bourbon"
 FRA_The_Triumphant_Bourbon_desc:0 "Louis Alphonse de Bourbon has ascended to the French Throne. In a time where Catholicism is fading from the Earth, Emperor Louis has proclaimed his intention to form a pious Europe."
 FRA_A_Union_With_Spain:0 "A Union With Spain"
 FRA_A_Union_With_Spain_desc:0 "Given the dynastic connections the Bourbons have to Spain, His Royal Majesty has negotiated with Spain for annexation into France."
 FRA_Rebuild_The_Churches:0 "Rebuild The Churches"
 FRA_Rebuild_The_Churches_desc:0 "Many churches like Notre Dame have been left in disrepair by the Communard Government. His Holy Majesty has donated millions out of the royal treasury to repair such icons of French Culture."
 FRA_Deporting_Muslims_Jews_And_Others:0 "Deporting Muslims, Jews And Others"
 FRA_Deporting_Muslims_Jews_And_Others_desc:0 "Our catholic empire has no need for the heathens of the other Abrahamic faiths. His royal Majesty has declared that police and military forces are to deport any muslim, jew, hindu, or whatever faith. If they are not Catholic, they have 2 weeks to leave France..FOREVER."
 FRA_Slowly_Push_Women_Back_Home:0 "Slowly Push Woman Back Home"
 FRA_Slowly_Push_Women_Back_Home_desc:0 "Women belong in the kitchen – Psalms 38:7"
 FRA_Establish_The_Emperors_Clerical_Council:0 "Establish The Emperors Clerical Council"
 FRA_Establish_The_Emperors_Clerical_Council_desc:0 "To maintain the piety of himself, the Emperor is establishing a new Clerical council made up of the most powerful priests, deacons, and cardinals in the nation."
 FRA_Declare_A_Cultural_Inquisition:0 "Declare A Cultural Inquisition"
 FRA_Declare_A_Cultural_Inquisition_desc:0 "Communism has ruined the French culture. If it isn’t that, Western degeneracy continues to infiltrate our nation. It is time for a reckoning to occur."
 FRA_Sending_Priests_Into_The_Classroom:0 "Sending Priests Into The Classroom"
 FRA_Sending_Priests_Into_The_Classroom_desc:0 "The priests of our faith will enter the classrooms to make sure that the teachers are educating according to the glory of Christ."
 FRA_Mandatory_Alter_Service_For_Boys:0 "Mandatory alter Service For Boys"
 FRA_Mandatory_Alter_Service_For_Boys_desc:0 "As the boys of our nation joined Communard Youth Groups in the past, now they will attend Church every weekend."
 FRA_Mandatory_Sunday_Service:0 "Mandatory Sunday Service"
 FRA_Mandatory_Sunday_Service_desc:0 "At 7:00 am every Sunday, Guards will wake you for mandatory church. You will stay until 10 am, and you will rejoice in Christs name."
 FRA_We_Are_The_Heirs_To_The_Kingdom_Of_Heaven:0 "We are The Heirs To The Kingdom Of Heaven"
 FRA_We_Are_The_Heirs_To_The_Kingdom_Of_Heaven_desc:0 "The Palestinian Confederation occupies the Holy Land. They are both communist and Islamic. Not even the old popes of the middle ages could picture such a horror. With our Holy Empire ready to expand, we’ll strike the holy land first and make it a paradise for true Catholics."
 FRA_And_Rome:0 "And Rome"
 FRA_And_Rome_desc:0 "How can the Pope be safe unless surrounded by a strong nation. Historically the Italians have never been strong, but France is!"
 FRA_Yet_Another_Bonaparte:0 "Yet Another Bonaparte"
 FRA_Yet_Another_Bonaparte_desc:0 "In the most brilliant move of the 21st century, the Imperial Parliament has selected the father of the late Emperor Jean-Christophe I to rule."
 FRA_Liberalising_The_Empire:0 "Liberalising The Empire"
 FRA_Liberalising_The_Empire_desc:0 "As part of the new Emperors ruling decree, he will ultimately seek to liberalize parts of the empire in a way his son tried."
 FRA_Forming_A_Coalition_Parliament:0 "Forming A Coalition Parliament"
 FRA_Forming_A_Coalition_Parliament_desc:0 "We need to unite all parties in our government. No matter the family their support, they should be brought under the banner of the Bonaparte."
 FRA_Seeking_International_Investment:0 "Seeking International Investment"
 FRA_Seeking_International_Investment_desc:0 "Frances economy was devastated by the communard regime. If the Royals hope to be different."
 FRA_Ultimately_Maintain_The_Status_Quo:0 "Ultimately Maintain The Status Quo"
 FRA_Ultimately_Maintain_The_Status_Quo_desc:0 "Ultimately, our new emperor will maintain the status quo."
 FRA_The_Unknown_American:0 "The Unknown American"
 FRA_The_Unknown_American_desc:0 "Surprisingly the Imperial Parliament has not picked a Frenchman for the role of Emperor. Instead, they look to a man from the broken Americas to lead our nation. Rene Auberjonois, a far descendant of Napoleon the Great will not only liberalize the Empire but bring us into whats dubbed as “The American Era”"
 FRA_Bringing_American_Freedom_To_France:0 "Bringing American Freedom To France"
 FRA_Bringing_American_Freedom_To_France_desc:0 "Even though the old states collapsed, His Royal Majesty Rene I has brought much of his American freedom to the French people. From loosening press restrictions, travel restrictions, and more."
 FRA_Drawing_Up_State_Lines:0 "Drawing Up State Lines"
 FRA_Drawing_Up_State_Lines_desc:0 "As part of the Americanizing program, the Emperor has decreed that provinces will be redrawn into states with their own governors and legislatures."
 FRA_Bringing_Democracy_To_The_State_Level:0 "Bringing Drmocracy To The State Level"
 FRA_Bringing_Democracy_To_The_State_Level_desc:0 "While still a monarchy, the emperor has decreed that the State levels will be privy to the pros of democracy."
 FRA_Ensure_Access_To_All_Services:0 "Ensure Acces To All Services"
 FRA_Ensure_Access_To_All_Services_desc:0 "While the communards broke France, some of their ideas were not horrible. Emperor Rene I has declared that all legal citizens of France will have access to services such as healthcare, education, transportation and housing. Illegal citizens will not be receiving these benefits nor will prisoners."
 FRA_A_Home_For_Those_Escaping_Tyranny:0 "A Home For Those Escaping Tyranny"
 FRA_A_Home_For_Those_Escaping_Tyranny_desc:0 "We aim to become what America should have been. A home for those escaping tyranny, persecution, civil war, inept governance and ultimately a home for those who wish to experience freedom."
 FRA_Creating_A_Federal_Monarchy:0 "Creating A Federal Monarchy"
 FRA_Creating_A_Federal_Monarchy_desc:0 "In part with the Americanization of France, the Emperor has announced the creation of a Federal Monarchy. The French people will elect a President to represent them on the domestic level while the Emperor will handle all international matters."
 FRA_Forming_A_French_Congress:0 "Forming A French Congress"
 FRA_Forming_A_French_Congress_desc:0 "Along with a president, the French people will be represented in their newly formed congress."
 FRA_Reforming_The_Constitution:0 "Reforming The Constitution"
 FRA_Reforming_The_Constitution_desc:0 "Yet again, the French people will receive a new constitution."
 FRA_Limiting_The_Powers_Of_The_Emperor:0 "Limiting The Powers Of The Emperor"
 FRA_Limiting_The_Powers_Of_The_Emperor_desc:0 "Unlimited power leads to paths which many consider dark. To rectify this, the Emperor is limiting his own powers to matters of the rich and Foreign policy."
 FRA_A_New_Continental_System:0 "A New Continental System"
 FRA_A_New_Continental_System_desc:0 "Like Napoleon in the past, a continental system is needed to starve the Soviet giant of all resources."
 FRA_Pursuing_Trade_With_Spain:0 "Pursuing Trade With Spain"
 FRA_Pursuing_Trade_With_Spain_desc:0 "We are going to first pursue lucrative trade agreements with the Spanish kingdom."
 FRA_Detente_With_England:0 "Detente With England"
 FRA_Detente_With_England_desc:0 "England, shall no longer be our enemy. While the communards damaged our reputation with them, we shall seek to end the decades of tension and pursue a pacifistic policy with those across the Channel."
 FRA_Expanding_Our_Influence_Over_Italy:0 "Expanding Our Influence Over Italy"
 FRA_Expanding_Our_Influence_Over_Italy_desc:0 "Historically the fates of France and Italy have been intertwined. We’ll expand our influence over the Italian government and draw them closer to us rather than the Soviets."
 FRA_Let_Us_Be_A_Pacifistic_Country:0 "Let Us Be A Pacifistic Country"
 FRA_Let_Us_Be_A_Pacifistic_Country_desc:0 "Combat has brought nothing but destruction to the French people. It’s time that we follow Japan and pursue a pacifistic policy. Our military will downsize itself into a self defense force, and our nation will not seek conflict but rather mediation."
 FRA_Manging_The_Home_Front:0 "Managing The Home Front"
 FRA_Manging_The_Home_Front_desc:0 "With the French government secured, its time to fix our economy."
 FRA_Reaffirming_Our_Currency:0 "Reaffirming Our Currency"
 FRA_Reaffirming_Our_Currency_desc:0 "Our currency sucks. Right now, the British board game Monopoly has more value than our money. We need to take steps to ensure that the Franc rises in value."
 FRA_Reforming_The_Stock_Market:0 "Reforming The Stock Market"
 FRA_Reforming_The_Stock_Market_desc:0 "The stock market is going to crash unless the government intervenes."
 FRA_Ensuring_Equal_Rights_Among_The_Classes:0 "Ensuring Equal Rights Among Classes"
 FRA_Ensuring_Equal_Rights_Among_The_Classes_desc:0 "Equal rights among the classes is a priority so we do not fall into the horrors of communism ever again."
 FRA_Rebuilding_The_Industrial_Sector:0 "Rebuilding The Industrial Sector"
 FRA_Rebuilding_The_Industrial_Sector_desc:0 "The civil war and reconstruction period left the industrial sector depleted."
 FRA_Encouraging_Competition:0 "Encouraging Competition"
 FRA_Encouraging_Competition_desc:0 "To rebuild our industrial and business sectors we need to create laws which encourage competition among our peoples."
 FRA_Restart_The_Wine_Industry:0 "Restart The Wine Industry"
 FRA_Restart_The_Wine_Industry_desc:0 "France and Wine go together like France and Cheese."
 FRA_Complete_The_Economic_Reconstruction:0 "Complete The Economic Reconstruction"
 FRA_Complete_The_Economic_Reconstruction_desc:0 "Our economic reconstruction is done."
 FRA_Colonial_Ambitions:0 "Colonial Ambitions"
 FRA_Colonial_Ambitions_desc:0 "With the Emperor bringing prosperity to France, it’s only natural we seek to bring our prosperity to other areas."
 FRA_Retaking_Algiers:0 "Retaking Algiers"
 FRA_Retaking_Algiers_desc:0 "Algeria was a staple French colony for the longest time. Being settled in 1830 and resting under French liberation for over 100 years, it’s time we bring our wayward brothers back into hands."
 FRA_The_Pied-Noir_Republic:0 "The Peid-Noir Republic"
 FRA_The_Pied-Noir_Republic_desc:0 "In its place, the Islamic Republic of Algeria will be replaced with the Pied-Noir Republic. Our Royal Majesty has appointed revolutionary General Thierry Bukhard to lead the young colony into a brighter future with France."
 FRA_Into_West_Africa:0 "Into West Africa"
 FRA_Into_West_Africa_desc:0 "Along with the Republic of Algeria, the West African federation will come under the guiding hand of the French Empire."
 FRA_More_Lands_For_The_Pied_Noir:0 "More Lands for The Pied-Noir"
 FRA_More_Lands_For_The_Pied_Noir_desc:0 "With the West African federation firmly under our control, it’s time we hand it to the Pied-Noir Republic and show the world how colonialism was meant to be done."
 FRA_Restoring_Order_To_Indochina:0 "Restoring Order To Indochina"
 FRA_Restoring_Order_To_Indochina_desc:0 "Indochina, or as the communists call it “Vietnam” is a place of poverty, tyranny, and pure anarchy. The French Empire shall re-establish itself over Saigon, not Ho Chi Minh city."
 Establish_French_Indochina:0 "Establish French Indochina"
 Establish_French_Indochina_desc:0 "Our Empire has re-established yet another colony. The French Eagle flies defiantly over Saigon and our soldiers are engaged in defeating the remnants of the Viet Minh."
 FRA_Bring_Order_To_India:0 "Bring Order To India"
 FRA_Bring_Order_To_India_desc:0 "Pondicherry was a treaty port under the French government. Yet our royal majesty has grander ideas. The Military will not only take Pondicherry back, but will take the entirety of southern India. Luckily enough, a far descendant of a Bourbon lives in India."
 FRA_Establish_The_Imperial_Protectorate_Of_South_India:0 "Establish The Imperial Protectorate Of South India"
 FRA_Establish_The_Imperial_Protectorate_Of_South_India_desc:0 "Pondicherry was a treaty port under the French government. Yet our royal majesty has grander ideas. The Military will not only take Pondicherry back, but will take the entirety of southern India. Luckily enough, a far descendant of a Bourbon lives in India."
 FRA_Into_The_New_World:0 "Into The New World"
 FRA_Into_The_New_World_desc:0 "The New World is full of riches and disorganization. We can bring peace to these peoples by invading and establishing old regimes."
 RA_Re-Establish_French_Hispaniola:0 "Re-Establish French Hispaniola"
 RA_Re-Establish_French_Hispaniola_desc:0 "Hispaniola, while originally being a slave colony will be different this time. The Haitians and Dominicans have suffered under tyrannical leaders for nearly 2 centuries. When we retake the islands, we will elevate these peoples into equal citizens of the Empire. Provided they do not leave Hispaniola."
 FRA_Re-Take_The_Gulf_Of_Mexico:0 "Re-Take The Gulf Of Mexico"
 FRA_Re-Take_The_Gulf_Of_Mexico_desc:0 "Mexico, oh Mexico. From the Spanish, to us, to the Americans and then to some of the most tyrannical regimes history has known. They shall be saved, and Paris shall have a wonderful supply of authentic Mexican food coming."
 FRA_Install_A_French_Monarchy:0 "Install A French Monarchy"
 FRA_Install_A_French_Monarchy_desc:0 "Unlike last time we wont install a Habsburg on the Mexican throne. This time, we’ll install a proper Frenchman who we can monitor closely."
 FRA_Down_With_The_Canadian_Oppressors:0 "Down With The Canadian Oppressors"
 FRA_Down_With_The_Canadian_Oppressors_desc:0 "The Canadians have a history of oppressing their French counterparts. When we invade, we will liberate the loyalists."
 FRA_Establish_The_Republic_Du_Quebec:0 "Establish The Republic Du Quebec"
 FRA_Establish_The_Republic_Du_Quebec_desc:0 "The Republic Du Quebec shall take the place of Canada."
 FRA_Its_Time_To_Look_Toward_Europa:0 "Its Time To Look Toward Europa"
 FRA_Its_Time_To_Look_Toward_Europa_desc:0 "With our New World, African, and Asiatic colonies re-established, it’s time we take on the European brutes who routinely criticize our government and our prosperity."
 FRA_European_Ambitions:0 "European Ambitions"
 FRA_European_Ambitions_desc:0 "Europe represents our greatest failures. From Waterloo to the entirety of the Middle Ages, France screwed up. No more! Our first target shall be our greatest enemy, the English!"
 FRA_Taking_On_The_English_Lion:0 "Taking On The English Lion"
 FRA_Taking_On_The_English_Lion_desc:0 "Where Hitler failed, we will succeed. Our soldiers shall land on English beaches, take over English towns and infrastructure, then march on London."
 FRA_Forming_A_French_Government:0 "Forming A French Government"
 FRA_Forming_A_French_Government_desc:0 "Out of our conquest of England, the Royals have fled to Australia. In their place, we will place an administration of both French and English to rule over the Isle."
 FRA_Taking_Advantage_Of_Italian_Instability:0 "Taking Advantage Of Italian Instability"
 FRA_Taking_Advantage_Of_Italian_Instability_desc:0 "The word Italian is synonymous with instability. Our government will liberate the Italians from themselves."
 FRA_Roma_Delenda_Est:0 "Roma Delenda Est"
 FRA_Roma_Delenda_Est_desc:0 "ROMA DELENDA EST! ROMA DELENDA EST! ROMA DELENDA EST!"
 FRA_Our_Iberian_Brothers:0 "Our Iberian Brothers"
 FRA_Our_Iberian_Brothers_desc:0 "Our brothers in Spain and Portugal will come under our rule, with special privileges of Course."
 FRA_Into_The_Low_Lands:0 "Into The Low Lands"
 FRA_Into_The_Low_Lands_desc:0 "The Belgians, Dutch, Luxembourgish, all shall know the liberating light of the French. We will free them from communism as we freed ourselves."
 FRA_Forming_A_French_Protectorate:0 "Forming A French Protectorate"
 FRA_Forming_A_French_Protectorate_desc:0 "Instead of working with several administrations, we are going to create a multi-cultural administration. This will be made up of a council of the most prominent leaders from each nation (not communist)."
 FRA_Towards_The_German_Beast:0 "Towards The German Beast"
 FRA_Towards_The_German_Beast_desc:0 "With our invasion of the Warsaw pact comes the inevitable German beast. Twice they invaded French land. It’s time for a bit of French revenge."
 FRA_Undoing_The_Franco_Prussian_War:0 "Undoing The Franco Prussian War"
 FRA_Undoing_The_Franco_Prussian_War_desc:0 "With our soldiers marching through Berlin, we are going to destroy the German dream. Several administrations will be set up and ruled over by royals who we control."
 FRA_Towards_The_Russian_Beast:0 "Towards The Russian Beast"
 FRA_Towards_The_Russian_Beast_desc:0 "Germany, Poland, Denmark, Austria, Czechoslovakia, and Hungary have all fallen to our mighty armies. The mistakes of Napoleon will be undone as the French army will capture Moscow before Winter."
 FRA_Pax_Francia:0 "Pax Francia"
 FRA_Pax_Francia_desc:0 "Our flag flies from every corner of Europe. While communism exists elsewhere in the world, we can only hope that their regimes fall in time. Until them, it is time for the French to colonize the continent."
 FRA_The_Revolution_was_successful:0 "The Revolution Was Successful"
 FRA_The_Revolution_was_successful_desc:0 "We can’t believe that the revolution was successful. The communard regime has been overthrown and by keeping his promise, Jean-Christophe has acceded power to a coalition of democratic leaders."
 FRA_Declare_A_Provisional_Government:0 "Declare A Provisional Government"
 FRA_Declare_A_Provisional_Government_desc:0 "While election proceedings are set up, and the country is being repaired, the running of our nation will be done by a provisional government."
 FRA_Fate_Of_Melenchon:0 "Fate Of Melenchon"
 FRA_Fate_Of_Melenchon_desc:0 "Jean-Luc Melenchon is a dividing figure within the realm of French politics. Some see him as a heroic reformer who tried to fix the problems caused by the communard regime while others only see him as a tool of the Moscow regime. While his trial is ongoing, it’s time we decide his fate."
 FRA_Lay_The_Groundwork_For_The_Government:0 "Lay The Groundwork For The Government"
 FRA_Lay_The_Groundwork_For_The_Government_desc:0 "With Melenchons fate decided, it’s time for the French people to look towards the future."
 FRA_Go_With_The_Old_Unitary:0 "Go With The Old Unitary"
 FRA_Go_With_The_Old_Unitary_desc:0 "Before the terror of the Communard Regime stretched from the Channel to the Mediterranean, the French people were ruled by a Unitary government."
 FRA_Try_Something_New_Federal:0 "Try Something New Federal"
 FRA_Try_Something_New_Federal_desc:0 "While they collapsed decades ago, it seemed as if the Americans were the utmost beacon of freedom. It’s time for us to adapt a federal system for French use."
 FRA_Write_A_New_Constitution:0 "Write A New Constitution"
 FRA_Write_A_New_Constitution_desc:0 "With our government undergoing a reformation, it’s time for the French government to develop yet another constitution."
 FRA_Protests_Outside_The_Parliament:0 "Protests Outside The Parliament"
 FRA_Protests_Outside_The_Parliament_desc:0 "While communism sucks, many of the younger generation see socialism and democracy coexisting."
 FRA_Agree_To_Include_Smaller_Parties:0 "Agree To Include Smaller Parties"
 FRA_Agree_To_Include_Smaller_Parties_desc:0 "We’ll agree to include smaller parties in the larger elections against the more established parties."
 FRA_The_Mayday_Riots:0 "The Mayday Riots"
 FRA_The_Mayday_Riots_desc:0 "Socialists have come to our streets demanding that the Sorelian party be allowed to participate in elections."
 FRA_Suspend_The_Elections:0 "Suspend The Elections"
 FRA_Suspend_The_Elections_desc:0 "We can not allow the socialists to gain a foothold in this new France. General Thierry Bukhard has taken control of the provisional government and declared the elections to be suspended."
 FRA_Concede_To_Demands:0 "Concede To Demands"
 FRA_Concede_To_Demands_desc:0 "Having just won a rebellion, the French people can not undergo another civil war. By allowing moderate socialists to run in the election, we can avoid another conflict."
 FRA_Nouvelle_Action_Bonaparte_Victorious:0 "Nouvelle Action Bonaparte Victorious"
 FRA_Nouvelle_Action_Bonaparte_Victorious_desc:0 "Not surprisingly, the favorite to win, Jean Christophe Bonaparte has won the first French democratic election in decades."
 FRA_Bonapartes_Victory:0 "Bonapartes Victory"
 FRA_Bonapartes_Victory_desc:0 "A wholesome candidate, a candidate for all."
 FRA_No_Longer_A_Royal:0 "No Longer A Royal"
 FRA_No_Longer_A_Royal_desc:0 "While becoming Prime Minister of the French Republic, Jean Christophe has renounced his royal claims."
 FRA_Include_Woman_In_The_Cabinet:0 "Include Woman In The Cabinet"
 FRA_Include_Woman_In_The_Cabinet_desc:0 "The reason the communards came to power is due to an adherence to tradition. Prime Minister Jean Christophe has announced that he will be including the likes of Marine Le Pen, Rachida Dati, Valerie Pécresse, and Véronique Massonneau in an effort to represent all sides of the burgeoning French political spectrum."
 FRA_Modernise_French_Infrastructure:0 "Modernise French Infrastructure"
 FRA_Modernise_French_Infrastructure_desc:0 "Under the communard regime, French infrastructure failed. Roads and bridges went unprepared while apartment blocks faced problems due to faulty construction. With the help of both French and foreign companies, the government has announced that many of these areas will be repaired."
 FRA_The_1972_Project:0 "The 1972 Project"
 FRA_The_1972_Project_desc:0 "The communard regime destroyed the French culture. They brought it closer to the Russians while ignoring the rich cultural roots of the French people. The 1792 project will teach French children about their rich past while restoring famous landmarks to their old prestige."
 FRA_Rebuild_Paris:0 "Rebuild Paris"
 FRA_Rebuild_Paris_desc:0 "Paris was destroyed by heavy fighting. While the country is in repair both physically and mentally, the city of Paris will become a beacon of light for the new democratic power."
 FRA_Push_Forward_Anti-Riot_Laws:0 "Push Forward Anti-Riot Laws"
 FRA_Push_Forward_Anti-Riot_Laws_desc:0 "To stop a new revolution from brewing, anti-riot laws will be pushed to the French parliament. They’ll not only help the police push down major areas of dissent, but also create a peaceful France."
 FRA_Harshen_Border_Security:0 "While not Islamophobic, the Prime Minister believes that terrorist forces from Libya could still be entering the country. As of now, the borders will be closed to anyone who has a Libyan background, or any background from a Muslim nation."
 FRA_Bonapartes_Know_Best:0 "Bonapartes Know Best"
 FRA_Bonapartes_Know_Best_desc:0 "Bonapartes have always brought France to glory. Whether through military service, or ruling, under a Bonaparte the French nation has always prospered. Who says Jean Christophe won’t be any different?"
 FRA_Natioal_Rally_Victorious:0 "National Rally Victorious"
 FRA_Natioal_Rally_Victorious_desc:0 "Under the charismatic rule of Marine Le Pen, the national rally has gained the leadership of France. Will she bring France into a new golden age for Christians as she’s promised or will she be yet another tyrant?"
 FRA_Le_Pens_Speech_To_The_people:0 "Le Pens Speech To The People"
 FRA_Le_Pens_Speech_To_The_people_desc:0 "Le Pen, confident in her support will address the French peoples alongside members of the Democratic rebellion. Most notably will be a speech by Jean Christophe Bonaparte discussing his support for the National Rally."
 FRA_Zero_Tolerance_In_France:0 "Zero Tolerance In France"
 FRA_Zero_Tolerance_In_France_desc:0 "Two things plague France, Islamism and Socialism. Both ideologies have brought our nation to ruin more than once. No more can this be allowed to happen."
 FRA_Remove_International_Influence:0 "Remove International Influence"
 FRA_Remove_International_Influence_desc:0 "International powers have brought the government to its knees. For France to prosper it truly needs to stand on its own."
 FRA_Invest_In_Youth_Organisations:0 "Invest In Youth Organisations"
 FRA_Invest_In_Youth_Organisations_desc:0 "Youth organizations in France will keep the youth off the streets and ground them in a good catholic education."
 FRA_Strict_Immigration_Requirements:0 "Strict Immigration Requirements"
 FRA_Strict_Immigration_Requirements_desc:0 "While Prime Minister Le Pen believes that all true Europeans need somewhere they can be free, she does not believe in opening the borders to the socialist menaces. For a refugee to gain entry to France, they will need to prove they are not socialist, Muslim, or a sinner in the eyes of the Church."
 FRA_Ban_The_Socialist_Party:0 "Ban The Socialist Party"
 FRA_Ban_The_Socialist_Party_desc:0 "Socialism destroyed the French people once before. That can not be allowed to happen again."
 FRA_Arrest_Socialist_Leaders:0 "Arrest Socialist Leaders"
 FRA_Arrest_Socialist_Leaders_desc:0 "Any socialist still within the nation, preaching their dangerous ideology will be brought down to their knees."
 FRA_Minority_Tax:0 "Minority Tax"
 FRA_Minority_Tax_desc:0 "France has many minorities who make up the workforce and while Le Pen would love too, the French authorities can not deport them all. So as a compromise, non-white Christian minorities will be made to pay an extra 15% of their income to the French government."
 FRA_Prepare_The_People:0 "Prepare The PEople"
 FRA_Prepare_The_People_desc:0 "The military is nearly ready, soon the French flag will fly over Algeria once again and prepare North Africa for colonization by civilized Christian Europeans."
 FRA_For_The_Final_Confrontation:0 "For The Final Confrontation"
 FRA_For_The_Final_Confrontation_desc:0 "INVADE!"
 FRA_Jacobs_Address:0 "Jacobs Address"
 FRA_Jacobs_Address_desc:0 "Christian Jacobs has brought the Republican party back to prominence. He alongside Jean Christophe Bonaparte will address the nation."
 FRA_Welcome_Sarkozy_To_The_Cabinet:0 "Welcome Sarkozy To The Cabinet"
 FRA_Welcome_Sarkozy_To_The_Cabinet_desc:0 "Nicholas Sarkozy, a prominent Republican rebel will be brought into Jacobs cabinet."
 FRA_End_The_Welfare_State:0 "End The Welfare State"
 FRA_End_The_Welfare_State_desc:0 "Welfare programs are a drag on the French people and their economy. By ending these programs, the government can reallocate the funds into better programs."
 FRA_France_First_Policies:0 "France First Policies"
 FRA_France_First_Policies_desc:0 "The France First plan will allow French owned business to prosper over international companies. Our economy will come before the economy of our allies."
 FRA_Move_The_Military_To_A_Defensive_Stance:0 "Move The Military To A Defensive Stance"
 FRA_Move_The_Military_To_A_Defensive_Stance_desc:0 "Why bother provoking the communists next door into a conflict. For now our military will be on a purely defensive stance."
 FRA_A_Racially_Equal_Society:0 "A Racially Equal Society"
 FRA_A_Racially_Equal_Society_desc:0 "Racism has no place in France. It’s a problem which has plagued the country since its inception. While liberal in approach, the government will fund education programs to end racism."
 FRA_An_End_To_The_Socialist_Era:0 "An End To The Socialist Era"
 FRA_An_End_To_The_Socialist_Era_desc:0 "Jacobs administration will be forever known as the one which proceeded the end of the socialist era. It is up to him to prove that he and the French people are worthy of democracy."
 FRA_Invest_In_Small_Business:0 "Invest In Small Business"
 FRA_Invest_In_Small_Business_desc:0 "By investing in small business, the government can incentivize the middle and lower classes to invest in their local economies."
 FRA_An_Economic_Powerhouse:0 "An Economic Powerhouse"
 FRA_An_Economic_Powerhouse_desc:0 "Nothing like proving the Soviets wrong and overtaking their economy."
 FRA_En_Marche_Victorious:0 "En Marche Victorious"
 FRA_En_Marche_Victorious_desc:0 "En Marche has won the hearts and minds of the people. They preach a new France and it seems the people are ready for it."
 FRA_Macrons_Victory_Speech:0 "Macrons Victory Speech"
 FRA_Macrons_Victory_Speech_desc:0 "Emmanuel Macron, alongside rebellion figures like Jean-Christophe Bonaparte and Marine Le pen will give a speech to the French people in front of the ruined Politburo."
 FRA_A_PM_For_Everyone:0 "A PM For Everyone"
 FRA_A_PM_For_Everyone_desc:0 "His charisma and his youth have coined the nickname “Everyones PM” as it seems he is willing to compromise with every side of the peoples ideologies."
 FRA_Open_The_Borders_To_All:0 "Open The Borders To All"
 FRA_Open_The_Borders_To_All_desc:0 "Well some call it dangerous, PM Macron has signed a bill opening the borders to all who wish to seek refuge in the nation."
 FRA_The_Paris_Climate_Accords:0 "The Paris Climate Accords"
 FRA_The_Paris_Climate_Accords_desc:0 "If the Soviets won’t do anything to alleviate the problem, then the French will. Signed with other countries like Canada, Mexico, Hawaii and more, the Paris Climate Accords will help to curb the effects of global warming."
 FRA_France_Has_Democratic_Roots:0 "France Has Democratic Roots"
 FRA_France_Has_Democratic_Roots_desc:0 "France has its roots in democracy. Our original revolution was to overthrow the monarchs and establish a republic. By returning to our basic roots, we can learn from our mistakes and push forward into a brighter future"
 FRA_Lower_Tariffs:0 "Lower Tariffs"
 FRA_Lower_Tariffs_desc:0 "Lowering tariffs on foreign goods will allow the French market to expand. Don’t believe me, don’t look it up."
 FRA_Tighten_The_Grips_On_Marxism:0 "Tighten The Grips On Marxism"
 FRA_Tighten_The_Grips_On_Marxism_desc:0 "Well politically free, the French people need to be wary of Marxism. Having only achieved independence from it, they can not be allowed to fall back into its cold embrace."
 FRA_Racism_Has_No_Place:0 "Racism Has No Place"
 FRA_Racism_Has_No_Place_desc:0 "Racism and Marxism go hand in hand. It’s time that the French people adapt a more educated approach to their cultural neighbors."
 FRA_Condemn_The_Soviet_Union:0 "Condemn The Soviet Union"
 FRA_Condemn_The_Soviet_Union_desc:0 "The Soviet Union has been one of the worst regimes to touch the face of the Earth. Outpacing the Nazis in killing, and outpacing tyrannical monarchs, the Soviets have managed to enslave much of the world to their abhorrent ideology."
 FRA_Reach_Out_To_The_UK:0 "Reach Out To The UK"
 FRA_Reach_Out_To_The_UK_desc:0 "While rivals in the past, we can not stand on our own unless we mend our problems with the UK."
 FRA_The_2012_Nice_Attacks:0 "The 2012 Nice Attacks"
 FRA_The_2012_Nice_Attacks_desc:0 "A Libyan man with ties to Islamic groups has rammed a heavy truck into a busy rebuilt shopping center."
 FRA_Le_Sorellian_Victorious:0 "Le Sorellian Victorious"
 FRA_Le_Sorellian_Victorious_desc:0 "While more nationalist than socialist, the Sorelian party has won the hearts of the French people."
 FRA_Faures_Surprise_Victory:0 "Faures Surprise Victory"
 FRA_Faures_Surprise_Victory_desc:0 "Surprisingly, the firebrand Olivier Faure has won the Prime Ministerial election."
 FRA_Push_Through_A_Wealth_Tax:0 "Push Through A Wealth Tax"
 FRA_Push_Through_A_Wealth_Tax_desc:0 "Quite frankly, one of the few socialist policies, the government has implemented a wealth tax."
 FRA_Blame_The_Jews:0 "Blame The Jews"
 FRA_Blame_The_Jews_desc:0 "Hitler had one thing right. The Judeo-Bolshevists are working to ruin our world for their own devious purposes. The communard regime is not to blame for the many atrocities committed under them, instead it is time to show the French people who are to blame. The Jews."
 FRA_Anti-Jewish_Laws:0 "Anti-Jewish Laws"
 FRA_Anti-Jewish_Laws_desc:0 "Anti-Jewish laws will make sure that the government will watch those sneaky bastards and make sure they do not try to ruin the French nation once again."
 FRA_Defend_France_From_Invaders:0 "Defend France From Invaders"
 FRA_Defend_France_From_Invaders_desc:0 "Invaders from Libya are coming to destroy the very fabric of our nation. They claim to be oppressed workers but the people know the truth. They are Islamists working with the Jews to create a French caliphate where the rich oil barons of Arabia can come to prosper."
 FRA_Increase_Police_Funding:0 "Increase Police Funding"
 FRA_Increase_Police_Funding_desc:0 "While some call it tyrannical, raising police funding can help to curb the increasing crime rates."
 FRA_Separate_The_Groups:0 "Separate The Groups"
 FRA_Separate_The_Groups_desc:0 "While all workers are equal, some are more equal than others."
 FRA_Encourage_Worker_Investment:0 "Encourage Worker Investment"
 FRA_Encourage_Worker_Investment_desc:0 "Workers will be given an option. They can either receive a full paycheck or have a portion of it invested back into their workplace to not only make it better but also receive a large sum at the end of the year if the business prospers."
 FRA_Denounce_The_Warsaw_Pact:0 "Denounce The Warsaw Pact"
 FRA_Denounce_The_Warsaw_Pact_desc:0 "The Warsaw Pact is full of socialists who went the wrong way. National Bolshevism in terms of socialism, is what really needs to happen."
 FRA_Raise_A_Statue_Of_Sorel:0 "Raise A Statue Of Sorel"
 FRA_Raise_A_Statue_Of_Sorel_desc:0 "Georges Sorel should be hailed as a French Hero."
 FRA_Real_Socialism_Achieved:0 "Real Socialism Achieved"
 FRA_Real_Socialism_Achieved_desc:0 "Our nation and our natural born citizens prosper. All those who are naturally French understand what really socialism is."
 FRA_A_Suprise_Pirate_Party_Win:0 "A Suprise Pirate Party Win"
 FRA_A_Suprise_Pirate_Party_Win_desc:0 "The Pirate Party? Who has even heard of them?"
 FRA_Roquets_Speech:0 "Roquets Speech"
 FRA_Roquets_Speech_desc:0 "Ms. Roquet spoke to the people and outlined a one point policy. Change censorship laws while the parliament can handle the rest of the policy decisions."
 FRA_Immediate_Change_Of_Censorship_Laws:0 "Immediate Change Of Censorship Laws"
 FRA_Immediate_Change_Of_Censorship_Laws_desc:0 "Censorship, otherwise known as language copyright is horrible for the entertainment industry. Let free speech prosper."
 FRA_Aftermath_Of_The_Attack:0 "Aftermath Of The Attack"
 FRA_Aftermath_Of_The_Attack_desc:0 "The French people have been struck in the heart by one man hailing from a Libyan terrorist group. Many want drastic action while others don’t believe that we can fight violence with violence."
 FRA_Firebomb_Tobruk:0 "Firebomb Tobruk"
 FRA_Firebomb_Tobruk_desc:0 "The Prime Minister has announced that the Libyan group known as ISIL (Islamic State in Libya) will feel the fire of French fury. One of their main bases is located in the city of Tobruk, and its eastern quarter. The 14th airwing will rain down hell upon those who dared to inflict violence on the French people."
 FRA_Fund_Democratic_Rebels:0 "Fund Democratic Rebels"
 FRA_Fund_Democratic_Rebels_desc:0 "The French Prime Minister has announced that the French government will fund democratic rebels inside Libya as long as they push further on the terrorist front."
 FRA_Operation_Charlegagne:0 "Operation Charlegagne"
 FRA_Operation_Charlegagne_desc:0 "Operation Charlemagne will create a new democratic Libyan state. With the French military allying themselves alongside the democratic front, the military will ensure that the new regime remains stable. While there for years, we can train the Libyan military and their peoples."
 FRA_Aftermath_Of_The_Attacks:0 "Aftermath Of The Attacks"
 FRA_Aftermath_Of_The_Attacks_desc:0 "With the Libya situation under control, its time for the French people to wonder whats next."
 FRA_Joining_The_Democratic_League:0 "Joining The Democratic League"
 FRA_Joining_The_Democratic_League_desc:0 "The Democratic League aligns with our ideologies. If we can prove our worth, we can join a faction of like-minded countries."
 FRA_Joint_Exercises_With_Canada:0 "Joint Exercises With Canada"
 FRA_Joint_Exercises_With_Canada_desc:0 "In an effort to improve our military, the Canadian prime minister has announced that the French and Canadian militaries will do joint military exercises."
 FRA_Naval_Exercises_In_The_Red_Sea:0 "Naval Exercises In The Red Sea"
 FRA_Naval_Exercises_In_The_Red_Sea_desc:0 "Our Navy will do exercises in the Red Sea, hopefully improving their abilities."
 FRA_Form_The_Council_Of_Exiled_Peoples:0 "Form The Council Of Exiled Peoples"
 FRA_Form_The_Council_Of_Exiled_Peoples_desc:0 "The Council of Exiled Peoples will be housed in the city of Cherbourg. It will comprise a council of European Nationals and political exiles who will advise the government and democratic alliance on what do when negotiating with the communist regimes."
 FRA_Radio_Free_Europe:0 "Radio Free Europe"
 FRA_Radio_Free_Europe_desc:0 "Originally started by the United States after the end of the Second World War, Radio Free Europe will broadcast TV and Radio messages into the homes of the oppressed, letting them know that the Democratic alliance is open and ready to receive them."
 FRA_Intervene_In_The_Middle_East:0 "Intervene In The Middle East"
 FRA_Intervene_In_The_Middle_East_desc:0 "Terrorism was not confined to one area. With the United Arab Republics in collapse, the French government and her allies will need to intervene in yet another region."
 FRA_Reform_The_League_Of_Nations:0 "Reform The League Of Nations"
 FRA_Reform_The_League_Of_Nations_desc:0 "It is time for the Democratic Alliance to reform. The League of Nations was an old organization which was dedicated to world peace. If we can successfully reform it, then we can work towards promoting a peaceful world."
 FRA_Invite_India:0 "Invite India"
 FRA_Invite_India_desc:0 "India is a gateway to the east. By inviting them to the new League of Nations, Democracy can begin to break its way into the east."
 FRA_Recognise_Democratic_Americans:0 "Recognise Democatic Americas"
 FRA_Recognise_Democratic_Americans_desc:0 "There are few democratic regimes in the collapsed American continent. By recognizing them and inviting them to the League we can help to promote peace in a new corner of the world."
 FRA_Forming_Our_Own_Faction:0 "Forming Our Own Faction"
 FRA_Forming_Our_Own_Faction_desc:0 "The Democratic Alliance while nice is on the brink of collapse. From now on, the center of the world’s democracies will be in Paris. Welcome to the North Atlantic Democratic Pact"
 FRA_Invite_Iberia:0 "Invite Iberia"
 FRA_Invite_Iberia_desc:0 "Iberian nations will join us and together we can promote our democratic ideals to the world."
 FRA_Promote_Democratic_Ideals_Aboard:0 "Promote Democratic Ideals Aboard"
 FRA_Promote_Democratic_Ideals_Aboard_desc:0 "Time to promote democracy abroad."
 FRA_Sorels_Regime:0 "Sorels Regime"
 FRA_Sorels_Regime_desc:0 "Soral has won the rebellion against the French communard pretenders."
 FRA_Burn_Down_The_Politburo:0 "Burn Down The Politburo"
 FRA_Burn_Down_The_Politburo_desc:0 "The Politburo is a remnant of the failures of the past. Burn it to the ground, BURN IT ALL AND BUILD SOMETHING BIGGER AND BETTER! HAIL SORAL"
 FRA_Der_Frankreich:0 "Der Frankreich"
 FRA_Der_Frankreich_desc:0 "Soral and the Fraternitie are going to model this new France after the great Nazi regime. Hail Soral, Hail Soral"
 FRA_Gulags_Are_For_Kids:0 "Gulags Are For Kids"
 FRA_Gulags_Are_For_Kids_desc:0 "We can use the Gulags to forcibly educate kids."
 FRA_Prison_Camps_Are_For_Grown_Ups:0 "Prison Camps Are For Grown Ups"
 FRA_Prison_Camps_Are_For_Grown_Ups_desc:0 "Those who were against us in the revolution do not deserve to take part in the upcoming new France."
 FRA_Deport_Prisoners:0 "Deport Prisoners"
 FRA_Deport_Prisoners_desc:0 "Prisoners will serve other regimes well. But for us, they are bleeding our economy dry."
 FRA_Use_The_Jews:0 "Use The Jews"
 FRA_Use_The_Jews_desc:0 "Hitler had believed the Jews were to be exterminated. While He had many amazing ideas, this was not one of them. The Jews can be useful to the new Reich in France, if we use them responsibly."
 FRA_End_Republican_Resistance:0 "End Republican Resistance"
 FRA_End_Republican_Resistance_desc:0 "Republicans believe that they can still restore democracy to the French nation. We will not allow the pure degeneracy of the West to influence our nation anymore. End their leaders and end their movement."
 FRA_Oaths_Of_Devotion:0 "Oaths Of Devotion"
 FRA_Oaths_Of_Devotion_desc:0 "Pledge your loyalty to Soral and Pledge your loyalty to France! Or die."
 FRA_Enforce_Party_Singularity:0 "Enforce Party Singularity"
 FRA_Enforce_Party_Singularity_desc:0 "The Party is the only way forward. While others may believe they know what is right, it is only the upper leadership of the party which knows."
 FRA_French_SS_Divisions:0 "French SS Divisions"
 FRA_French_SS_Divisions_desc:0 "Bruno Megret, otherwise known as the French Himmler is being allowed to form his own version of the Nazi SS. With this comes the creation of French SS divisions."
 FRA_Invite_The_Emperor_Back:0 "Invite The Emperor Back"
 FRA_Invite_The_Emperor_Back_desc:0 "“Inviting” the emperor back will give us the legitimacy we need."
 FRA_Make_Him_A_Puppet:0 "Make Him A Puppet"
 FRA_Make_Him_A_Puppet_desc:0 "The Emperor has gotten a little too uppity for our liking. It’s time for him to remember that he is merely a puppet for our regime."
 FRA_The_Sorel_Youth:0 "The Sorel Youth"
 FRA_The_Sorel_Youth_desc:0 "like the Aryan race of Germany, it is important for us to create the racial ideal. Something to give our children a goal to strive for."
 FRA_Ractify_Our_Past:0 "Ractify Our Past"
 FRA_Ractify_Our_Past_desc:0 "We need to establish ourselves within French history. The Communards used the Paris commune, and for us we will use the Emperor and the Bonaparte legacy to legitimize our regime."
 FRA_Anti-Communist_Rhetoric:0 "Anti-Communist Rhetoric"
 FRA_Anti-Communist_Rhetoric_desc:0 "Communism is the pure opposite of Fascism. It is time for us to start bringing ourselves to a war footing and prepare for the eventual invasion and recolonization of Europe."
 FRA_Forify_The_German_Border:0 "Fortify The German Border"
 FRA_Forify_The_German_Border_desc:0 "Germany does not have a good history with France. Lets fortify the border to the utmost extreme."
 FRA_Embolden_German_Nationalists:0 "Embolden German Nationalists"
 FRA_Embolden_German_Nationalists_desc:0 "Sieg Heil! Is being screamed from the streets."
 FRA_Find_Allies_Aboard:0 "Find Allies Aboard"
 FRA_Find_Allies_Aboard_desc:0 "The fascists in America can provide a useful source of manpower."
 FRA_Prepare_The_Expansion:0 "Prepare The Expansion"
 FRA_Prepare_The_Expansion_desc:0 "From the coast of Iberia to the shores of Siberia, the French flag will fly. Un Pas Comrade, Un Pas Comrade."
 FRA_Controlling_The_People:0 "Controlling The People"
 FRA_Controlling_The_People_desc:0 "The French people have a history of revolution. Not with us! We will control them to the utmost extent."
 FRA_Mandatory_Patriotism:0 "Mandatory Patriotism"
 FRA_Mandatory_Patriotism_desc:0 "Either you sieg heil or your sieg die."
 FRA_Flags_On_Every_Street:0 "Flags On Every Street"
 FRA_Flags_On_Every_Street_desc:0 "There will be a pole on every street hanging the flag of the new French State. God Bless France"
 FRA_Prisoner_Parades:0 "Prisoner Parades"
 FRA_Prisoner_Parades_desc:0 "By marching the prisoners through the streets, we can remind the people that they are one phone call away from hell on earth."
 FRA_10_Minutes_Of_Hate:0 "10 Minutes Of Hate"
 FRA_10_Minutes_Of_Hate_desc:0 "Every day, you will see images of the enemy and you will scream. Curse their names, their children, and praise the government for ending their lives."
 FRA_Begin_The_Great_Project:0 "Begin The Great Project"
 FRA_Begin_The_Great_Project_desc:0 "The Great Project will prepare our soldiers and our people for decades of war if need be. It will conclude with soldiers victoriously marching through the capitals of the enemy"
 FRA_Experiment_On_The_Slaves:0 "Experiment On The Slaves"
 FRA_Experiment_On_The_Slaves_desc:0 "The Slaves we have working in the gulags and prisons will take part in the Great Project. While they may not be willing and many will not survive, it is an honor to serve the French state like this."
 FRA_The_Super_Soldier_Program:0 "The Super Soldier Program"
 FRA_The_Super_Soldier_Program_desc:0 "Goring had one amazing idea. Meth! Through mixing it into the food of soldiers, we can make sure that their only thoughts are on moving forward and killing the enemy. God bless meth."
 FRA_Expand_Our_Borders:0 "Expand Our Borders"
 FRA_Expand_Our_Borders_desc:0 "It’s time to begin."
 FRA_Annex_The_Micro_States:0 "Annex The Micro States"
 FRA_Annex_The_Micro_States_desc:0 "The two microstates on our borders, Andorra and Monaco will come under the rule of the French State."
 FRA_Annex_The_Basque_Region:0 "Annex the Basque Region"
 FRA_Annex_The_Basque_Region_desc:0 "The Basque region has its history tied into France. While some may disagree, there is a deep cultural history in the region discussing the “Basque French”. They have been oppressed by the Spanish people long enough and with a referendum, we will annex the region into the Greater French State."
 FRA_Finish_The_Spanish_Off:0 "Finish The Spanish Off"
 FRA_Finish_The_Spanish_Off_desc:0  "We will take every single bit of land off the spanish and their blood will run through the land!"
 FRA_The_Greater_French_State:0 "The Greater French State"
