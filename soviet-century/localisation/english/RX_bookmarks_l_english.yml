l_english:
  FRA_RED_WORLD_DESC:0 "The nation of France turned to communism in 1984, although it had remained under that system since that day, and had portrayed a sense of continuous stability, internally there are talks of crisis within the French Socialist State. Due to several failed reforms in the past the economy is efficiently near collapse and had caused social tensions to rise although hope is not lost. Jean-Luc Melenchon the current leader of France hopes to enact reforms to hopefully save the nation. Unfortunately he faces stiff resistance from hardliners. Could the reforms save France? Or will Hardliner interference only cause a bigger crisis?"
  
  TEX_RED_WORLD_DESC:0 "Things haven't been easy for Texas following the collapse of America, with the loss of many of its territories to Mexico, the economy just barely slugging through and the near diplomatic isolation it's been rough in the lone star state. Compounded with the current ruling party cracking at the seems, things in Texas are bound to get, for the better or worse is yet to be seen."