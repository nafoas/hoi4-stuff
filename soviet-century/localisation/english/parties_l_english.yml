 NOR_fascist_party:0 "Nordic Resistance"
 NOR_fascist_party_long:0 "Nordic Resistance Movement - Norwegian Branch"
 NOR_nationalist_party:0 "Progress Party"
 NOR_nationalist_party_long:0 "Progress Party\n§LThe §HProgress Party (FrP)§! is a right-wing populist and right-libertarian party. Founded in 1973 as an anti-tax protest party, it has since developed a libertarian, socially conservative and anti-communist outlook. The party focuses on law and order, supports downsizing the government bureaucracy and public sector, as well as increased oil extraction."
 NOR_monarchist_party:0 "House of Glücksburg"
 NOR_monarchist_party_long:0 "House of Glücksburg\n§LThe §HHouse of Glücksburg§! is the senior surviving branch of the §HHouse of Oldenburg§!, one of Europe's oldest royal houses. The Norwegian branch of the family descend from §HPrince Carl of Denmark§! who was offered the throne in 1905 after Norwegian independence. Taking the regnal name §HHaakon VII§!, he became the first independent Norwegian monarch since 1387."
 NOR_national_bolshevik_party:0 "Vigrid"
 NOR_national_conservative_party:0 "Conservative Party"
 NOR_national_conservative_party_long:0 "Conservative Party\n§LThe §HConservative Party§! or §HThe Right (H)§! is a moderate conservative party. Founded in 1884, it is the second-oldest party in Norway. The party caters to the traditional elite in the universities, bureaucracy and business, and have positioned themselves as defenders of individual rights against an increasingly authoritarian government. The party is pro-western, anti-communist, economically liberal, and supports the monarchy and the Church of Norway."
 NOR_centrist_party:0 "Centre Party"
 NOR_centrist_party_long:0 "Centre Party\n§LThe §HCentre Party (C)§! is an agrarian party. Originally founded in 1920 as the §HFarmers' Party (BP)§!, an interest party for Norwegian farmers. Positioned in the political center, the party has historically participated in centrist and centre-right governments, but has recently started accomodating the political left. The party supports decentralization, protectionism and economic nationalism."
 NOR_liberal_party:0 "Liberal Party"
 NOR_liberal_party_long:0 "Liberal Party\n§LThe §HLiberal Party§! or §HThe Left (V)§! is a social liberal party. Founded in 1884, it is the oldest party in Norway. They dominated the political scene in the late 19th and early 20th centuries, but has since declined and become a smaller participant in several centre-right governments. The party is primarily defined by their environmentalism and staunch defence of civil liberties, as well as being the only republican party on the Norwegian right."
 NOR_new_democrat_party:0 "Labour Party"
 NOR_new_democrat_party_long:0 "Norwegian Labour Party\n§LThe §HNorwegian Labour Party (A)§! is a social democratic party. Founded in 1887, it was the dominant party of Norwegian politics between the 1920s and 1980s. Following a long period of moderation the party was surpassed by the §HRed Electoral Alliance§!. The party supports the Nordic model, a strong welfare state and incorporates principles of a social market economy."
 NOR_moderate_socialist_party:0 "Socialist Left Party"
 NOR_moderate_socialist_party_long:0 "Socialist Left Party\n§LThe §HSocialist Left Party (SV)§! is a socialist party. Founded in 1973 as the §HSocialist Electoral League (SV)§!, a coalition of the §HCommunist Party of Norway (NKP)§!, §HSocialist People's Party (SF)§! and the §HDemocratic Socialists (DS)§!. It became a unified party in 1975. Founded in opposition to NATO and the European Communities, the party has since declined and been surpassed by the §HRed Electoral Alliance§!."
 NOR_revolutionary_socialist_party:0 "Red Electoral Alliance"
 NOR_revolutionary_socialist_party_long:0 "Red Electoral Alliance\n§LThe §HRed Electoral Alliance (RV)§! is a Marxist and revolutionary socialist party. It was formed in 1973 as an electoral front for the Maoist §HWorkers' Communist Party (AKP)§!, but soon became a broad-tent of various socialist groups. The party's supporters participated in the political upheaval which led to the overthrowal of the monarchy in 1985. §HRV§! has been the dominant party in Norwegian politics since the introduction of the 'Johannessen Electoral Law' in 1988."
 NOR_communist_party:0 "Communist Party"
 NOR_communist_party_long:0 "Communist Party of Norway\n§LThe §HCommunist Party of Norway (NKP)§! is a Marxist-Leninist party. Founded in 1923, following a split from the §HLabour Party§! by members who wanted to remain in the Comintern. Having been a marginal force in Norwegian politics since the 1940s, it has recently experienced a surge in support after defections from the §HRed Electoral Alliance§!. The party is pro-Soviet, but this stance is increasingly challenged by a Maoist faction in the party."
 DEN_fascist_party:0 "National Socialists"
 DEN_fascist_party_long:0 "National Socialist Movement of Denmark\n§LThe §HNational Socialist Movement of Denmark (DNSB)§! is a neo-nazi party, founded out of the disorganized post-war nazi movement over the course of the 1970s and 80s. A doctrinaire neo-nazi party, the party has mostly been notable for its repeat legal troubles over the so-called 'Racism Clause' of the penal code, as well as its circular firing squads whenever new leadership takes over'."
 DEN_nationalist_party:0 "People's Party"
 DEN_nationalist_party_long:0 "Danish People's Party\n§LThe §HDanish People's Party (DF)§! is a nationalist and right-wing populist party. Formed by moderate members of the §HProgress Party (FP)§! in 1995, §HDF§! has moved the radical right away from libertarianism toward a more concilliatory paternal nationalism that is nevertheless anti-socialist and staunchly anti-immigration. Largely steered by former party leader and grey eminence §HPia Kjærsgaard§!, the party has carved out a clear niche on the Danish right it will not be easily dislodged from."
 DEN_monarchist_party:0 "House of Glücksburg"
 DEN_monarchist_party_long:0 "House of Glücksburg\n§LThe §HHouse of Glücksburg§! has been the royal family of Denmark since 1863. One of Europe's oldest royal houses, the family descends from the town of Glücksburg just south of the Danish-German border. Still represented by its last queen, §HMargrethe Lyksborg§! from her residence in Great Britain, the house continues to enjoy broad approval from the Danish public, and it remains an involved participant in Danish cultural life."
 DEN_national_bolshevik_party:0 "Workers' Front"
 DEN_national_conservative_party:0 "Civic Unity List"
 DEN_national_conservative_party_long:0 "Civic Unity List - Liberal-Conservative Alliance\n§LThe §HCivic Unity List - Liberal-Conservative Alliance (BEL)§! is a liberal conservative and agrarian electoral list. Consisting of the two old right wing parties §HVenstre (V)§! and the §HConservative People's Party (DKF)§!, §HBEL§! is largely an interest party of the cooperative farmers, though it remains influential with religious voters and right wingers uncomfortable with the §HDanish People's Party§!."
 DEN_centrist_party:0 "Liberal Alliance"
 DEN_centrist_party_long:0 "Liberal Alliance\n§LThe §HLiberal Alliance (LA)§! is a classical liberal and right-libertarian party. Formed by a mixture of former §HProgress Party (FP)§! hardliners and liberal idealists from the §HRadical Left (RV)§! in 2004, §HLA§! is the most pro-business party in Denmark, largely appealing to those most discontented with socialist rule."
 DEN_liberal_party:0 "Radical Left"
 DEN_liberal_party_long:0 "Radical Left\n§LThe §HRadical Left (RV)§! is a social liberal party. Founded as a radical breakaway from §HVenstre (V)§! in 1905, §HRV§! was once a fixture of centrist and center-left governments, but has been consigned to the opposition since 1983. Supporting liberal economic and political reforms, the party has managed to absorb the urban wing of §HV§! since the formation of the §HCivic Unity List (BEL)§!, but their anti-imperialist foreign policy also lets them draw voters from the left."
 DEN_new_democrat_party:0 "Social Democrats"
 DEN_new_democrat_party_long:0 "Social Democrats\n§LThe §HSocial Democrats (S)§! is a social democratic party. Founded in 1871, they were the driving force behind the building of the Danish welfare state, the party was torn apart by infighting in the seventies over questions of the European Union and the proposal of 'Economic Democracy' (ØD), now functioning as a supporting party and democratic watchdog of the §HRed Bloc§! coalition government. The party remains deeply influential within the trade union movement, and still attempts to push the government into adopting ØD."
 DEN_moderate_socialist_party:0 "Socialist Workers' Party"
 DEN_moderate_socialist_party_long:0 "Socialist Workers' Party\n§LThe §HSocialist Workers' Party (SAP)§! is an ecosocialist party. Originally founded as a Trotskyist party, the rise of the §HLeft Socialist§! has made the party moderate and modernize it's positions. Adopting a clear environmentalist position, §HSAP§! has managed to win the support of various minor environmentalist groups for whom the government do not go far enough, but it remains a marginal political party."
 DEN_revolutionary_socialist_party:0 "Left Socialists"
 DEN_revolutionary_socialist_party_long:0 "Left Socialists\n§LThe §HLeft Socialists (VS)§! is a Marxist and revolutionary socialist party. Breaking away from the §HCommunist Party of Denmark (DKP)§! in 1968 over questions of collaboration with the §HSocial Democrats (S)§!, §HVS§! have since become the governing party of Denmark and the leaders of the §HRed Bloc§!. Despite having managed to move past their tendency for infamously severe infighting, the party nevertheless continues to have a multitude of competing factions, spanning from Maoism to libertarian socialism, and everything in between."
 DEN_communist_party:0 "Communist Party"
 DEN_communist_party_long:0 "Communist Party of Denmark\n§LThe §HCommunist Party of Denmark (DKP)§! is a Marxist-Leninist party. Established out of various communist breakaways from the §HSocial Democrats (S)§! in 1919, the party has since been a fixture of Danish politics in both peacetime and during the German occupation. Despite generally being loyal to Moscow, the party is moderate compared to its European siblings, owing to the influence of the 'popular socialist' tendency within the party."
