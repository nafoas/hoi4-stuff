 SWE_fascist_party:0 "Swedish Resistance"
 SWE_fascist_party_long:0 "Swedish Resistance Movement"
 SWE_nationalist_party:0 "New Democracy"
 SWE_nationalist_party_long:0 "New Democracy\n§L§HNew Democracy (NyD)§! is a right-wing populist and economic liberal party. Founded in 1991 by §HBert Karlsson§! and §HIan Wachtmeister§!, two public figures known for their previous careers in business. The party entered the Riksdag in 1992 and established themselves as a crucial swing vote, providing technical support to several §HBourgeois Bloc§! governments. Though the party advocates for lower taxes, deregulation and privatization, sections of the party have embraced the welfare state, instead advocating for stricter qualifications for benefits."
 SWE_monarchist_party:0 "House of Bernadotte"
 SWE_monarchist_party_long:0 "House of Bernadotte\n§LThe §HHouse of Bernadotte§! has been the royal family of Sweden since 1818, and was formerly the royal family of Norway between 1818 and 1905. The house was founded by §HKing Charles XIV John§!, a general in service of the French Army during the French Revolutionary Wars. Having been made Prince of Pontecorvo by §HNapoleon Bonaparte§!, he was adopted by §HKing Charles XIII§! and made Crown Prince of Sweden in 1810. The house has been led by §HKing Carl XVI Gustaf§! since 1973, who acceded to the throne at the age of 27 upon his grandfather's death. During his reign the monarchy was officially stripped of its executive powers, leaving the king to ceremonial and representative duties."
 SWE_national_bolshevik_party:0 "KPML(r)"
 SWE_national_bolshevik_party_long:0 "Communist League Marxist–Leninists (Revolutionaries)"
 SWE_national_conservative_party:0 "Moderate Party"
 SWE_national_conservative_party_long:0 "Moderate Coalition Party\n§LThe §HModerate Coalition Party (M)§!, also known as the §HModerates§!, is a conservative and liberal-conservative party. Founded in 1904 as the §HGeneral Electoral League§!, the party was later known as §HThe Right§! and the §HRightist Party§!. Originally a traditionalist conservative and nationalist party, §HM§! was on the fringe of Swedish politics until the late 1960s. They regained prominence after reinventing themselves as a liberal conservative party, eventually becoming the leading party of the §HBourgeois Bloc§! by the 1980s. However, the recent rise of §HNew Democracy (NyD)§! has eroded §HM§!'s more conservative electorate."
 SWE_centrist_party:0 "Centre Party"
 SWE_centrist_party_long:0 "Centre Party\n§LThe §HCentre Party (C)§! is a liberal and agrarian party. Originally founded in 1913 as the §HFarmer's League (BF)§!, an interest party for Swedish farmers. As the rural population declined the party changed its name to the §HCentre Party§! in 1957 and gradually shifted its ideology towards liberalism, environmentalism and decentralization. Simultaneously the party ended their cooperation with the §HSocial Democrats (S)§!, instead becoming leading a member of the §HBourgeois Bloc§! alongside the §HModerates (M)§!."
 SWE_liberal_party:0 "Liberal People's Party"
 SWE_liberal_party_long:0 "Liberal People's Party\n§LThe §HLiberal People's Party (FP)§! is a social liberal party. Founded in 1902 as the §HFree-minded National Association§!, the party played a pivotal role in the struggle for universal sufferage alongside the §HSocial Democrats (S)§!. Since then the party has positioned itself in the center of the political spectrum, being a key member of the §HBourgeois Bloc§!, but has sometimes crossed the aisle to work with §HS§! or to form centrist governments."
 SWE_new_democrat_party:0 "Green Party"
 SWE_new_democrat_party_long:0 "Green Party\n§LThe §HGreen Party (MP)§! is an environmentalist party. Sparked by the anti-nuclear power movement following the 1980 nuclear power referendum, the party was founded in 1981 out of a discontent with the existing parties' environmental policies. Opposing rigid bloc politics and advocating for participatory democracy, the party entered the Riksdag in 1988 and joined the opposition to the §HSocial Democrats (S)§!, though they have since provided support for both §HSocialist Bloc§! and centrist governments."
 SWE_moderate_socialist_party:0 "Social Democratic Party"
 SWE_moderate_socialist_party_long:0 "Social Democratic Workers' Party of Sweden\n§LThe §HSocial Democratic Workers' Party of Sweden (S)§! is a democratic socialist party. Founded in 1889, it is the oldest political party in Sweden and historically dominated the political scene from the adoption of universal sufferage in 1920 until 2000. It is one of the first revisionist Marxist parties in the world and played a pivotal role in the building of the Swedish welfare state. After the decline and stagnation of the Swedish economy in the 1990s the party has increasingly moved away from statist social democracy in favour of decentralized socialism and workers self-management."
 SWE_revolutionary_socialist_party:0 "Association Offensive"
 SWE_revolutionary_socialist_party_long:0 "Workers' Association Offensive"
 SWE_communist_party:0 "Left Party"
 SWE_communist_party_long:0 "Left Party - the Communists\n§LThe §HLeft Party - the Communists (VPK)§! is a Marxist-Leninist party. It originates from the split of the §HSocial Democrats (S)§! in 1917 and was previously known as the §HSwedish Social Democratic Left Party (SSV)§! and the §HCommunist Party of Sweden (SKP)§!. Once a small party which primarily served as technical support for the §HSocial Democrats (S)§!, since the end of the Cold War §HVPK§! has grown into one of the largest parties in Sweden. Despite this they have been shut out of governmental power, and the party remains internally divided between neocommunists and neo-Leninists."
