 ENG_liberal_party:0 "Social Democratic Party"
 ENG_liberal_party_long:0 "Social Democratic Party\n§LThe §HSocial Democratic Party (SDP)§! is a social democratic and social liberal party. Formed in 1981 as a moderate splinter from the §HLabour Party§!, the party formed the §HSDP-Liberal Alliance§! with the §HLiberal Party§! between 1981 and 1986, and under its long-time leader §HDavid Owen§! it has been the dominant political party in the United Kingdom since 1991. Though ideologically social democratic, the §HSDP§! has few ties to organized labor and primarily draws support from Britain's professional class. Moreover, the party's tough policies on crime and national security lead some to question the party's social liberal outlook."
 ENG_new_democrat_party:0 "Labour Party"
 ENG_new_democrat_party_long:0 "Labour Party\n§LThe §HLabour Party§! is a democratic socialist party. Founded in 1900, the party overtook the §HLiberal Party§! to become the leading opposition to the §HConservative Party§! in the 1920s. After leading several governments from the 1920s to the 1980s, the party fell into a period of intense internal division before being supplanted as the largest centre-left party by the §HSDP§!. The party supports the nationalization of industry, wealth redistribution, nuclear disarmament and rapprochement with the European Union."
