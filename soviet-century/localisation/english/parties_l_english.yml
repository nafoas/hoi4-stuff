 GER_communist_party:0 "Socialist Unity Party"
 GER_communist_party_long:0 "Socialist Unity Party of Germany\n§LThe §HSocialist Unity Party of Germany (SED)§! is a Marxist-Leninist party. Formed in 1946 through a forced merger of the East German branches of the §HCommunist Party of Germany (KPD)§! and the §HSocial Democratic Party of Germany (SPD)§!, it was the ruling party of East Germany from its founding in 1949 until the unification of Germany in 1985, when it merged with the West German §HSPD§! and the §HGerman Communist Party (DKP)§!. The §HSED§! has since integrated all political parties in Germany, most notably §HThe Greens§!, becoming the country's sole legal party."
 ENG_fascist_party:0 "Britain First"
 ENG_nationalist_party:0 "British National Party"
 ENG_nationalist_party_long:0 "British National Party\n§LThe §HBritish National Party (BNP)§! is a far-right, neo-fascist party. It was founded in 1982 by members of the neo-fascist §HNational Front§!. During its early years the party placed little emphasis on contesting elections, instead it focused on street marches and rallies. A growing 'modernizer' faction led by §HNick Griffin§! took control of the party in the late 90s, and, presenting a more moderate image, turned it into the most electorally successful far-right party in British history."
 ENG_monarchist_party:0 "House of Windsor"
 ENG_national_bolshevik_party:0 "Revolutionary Front"
