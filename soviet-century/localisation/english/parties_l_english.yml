 NEA_fascist_party:0 "National Socialists"
 NEA_fascist_party_long:0 "National Socialist Movement\n§LThe §HNational Socialist Movement (NSM)§! is a neo-nazi organization founded in 1971 as a splinter from the §HNational Socialist White People’s Party§! after the assassination of §HGeorge Lincoln Rockwell§!. Historically one of the biggest neo-nazi organizations in the United States, the §HNSM§! has seen its membership greatly reduced following the white nationalist migration to Montana."
 NEA_nationalist_party:0 "America First"
 NEA_nationalist_party_long:0 "America First Party\n§LThe §HAmerica First Party (AFP)§! is a conservative political party founded in 1989 that advocates for the restoration of Christian and conservative values in what they perceive as an increasingly secular and progressive Northeast. Placing itself in opposition to the American Republic and American reunification, the §HAFP§! instead centers itself around issues such as abortion, property rights, and government overreach."
 NEA_monarchist_party:0 "Royalist Americans"
 NEA_monarchist_party_long:0 "Royalist Americans\n§LAlthough Republicanism is firmly entrenched in America's political system, the country is no stranger to dynasties. Similar to the royal dynasties of Europe, families like the §HRoosevelts§! and the §HKennedys§! have maintained their proximity to power through wealth, influence, and strategic political alliances, building political machines that ensure the family's continued relevance in local politics. While not a concrete ideological movement or party, some Americans find comfort in the perseverance of these American dynasties and the long history they have with their local community."
 NEA_national_bolshevik_party:0 "Social Alliance"
 NEA_national_bolshevik_party_long:0 "Social Alliance\n§LThe §HSocial Alliance (SA)§! is a white supremacist organization founded in 2007 that takes its ideological inspiration from the unrecognized State of Lincoln, advocating for collectivistic economic policies and neo-nazism."
 NEA_national_conservative_party:0 "Republican Renewal"
 NEA_national_conservative_party_long:0 "Republican Renewal\n§L§HRepublican Renewal (RR)§! is a conservative interest group founded in 1989 that is considered a spiritual successor to the §HRepublican Party (GOP)§!. Rejecting the authoritarianism and nationalism seen in its southern counterpart, §HRR§! instead adheres to traditional Republican positions that support a minimal government, social conservatism, and economic liberalism."
 NEA_centrist_party:0 "United Commonwealth"
 NEA_centrist_party_long:0 "United Commonwealth Party\n§LThe §HUnited Commonwealth Party (UCP)§! is a centrist political party founded in 1989. Composed of members from both the former Republican and Democratic parties, the §HUCP§! advocates for both fiscal conservatism and social programs like universal healthcare."
 NEA_liberal_party:0 "Democratic Party"
 NEA_liberal_party_long:0 "Democratic Party\n§LThe §HCommonwealth Democratic Party (D)§!, also known as the §HDemocrats§!, is a liberal party founded in 1828 and later reorganised in 1988 by what remained of the §HDemocratic Party (D)§! in the American Northeast after its progressive members joined the §HDemocratic Labor Party (DLP)§!. Sharing many similarities with its sister parties in the American Republic and the Heartlands, the §HDemocrats§! supports free market policies, protection of civil rights, and moderate social welfare."
 NEA_new_democrat_party:0 "Social Democrats, USA"
 NEA_new_democrat_party_long:0 "Social Democrats, USA\n§LFounded in 1972 under the name §HSocialist Party of America§!, §HSocial Democrats, USA (SDUSA)§! is a social democratic political party that sought to move the §HDemocratic Party (D)§! towards embracing social democracy. Although the §HSDUSA§! had a strong relationship with labor unions such as the §HAFL-CIO§!, their staunch anti-communist stance has separated them from the wider American left."
 NEA_moderate_socialist_party:0 "DLP - Moderates"
 NEA_moderate_socialist_party_long:0 "Democratic Labor Party - Moderates\n§LThe §HModerates§! are a faction within the §HDemocratic Labor Party (DLP)§! known for their advocacy for returning to a federal liberal democracy rather than the councilist system present in the American People’s Commonwealth. While originating from liberal and progressive democrats, the faction is today primarily associated with Vermont Governor §HBernie Sanders§!. Despite being the smallest faction in the Central Committee, the §HModerates§! play an important role in balancing the bitter factionalist struggles present in §HDLP§!."
 NEA_revolutionary_socialist_party:0 "DLP - Revolutionaries"
 NEA_revolutionary_socialist_party_long:0 "Democratic Labor Party - Revolutionaries\n§LThe §HDemocratic Labor Party (DLP)§! is a socialist political party founded in 1989 with the merger of the §HParty of Labor (L)§! and members of the §HDemocratic Party (D)§! during the formation of the American People’s Commonwealth. The §HDLP§! is currently divided between the §HOld Guard§! and §HNew Guard§!, with the former favoring a decentralized government led by the trade unions and the latter advocating for a leaner and more efficient government bureaucracy."
 NEA_communist_party:0 "Communist Party"
 NEA_communist_party_long:0 "Communist Party of the American People's Commonwealth\n§LThe §HCommunist Party of the American People’s Commonwealth (CPAPC)§! is a communist party founded in 1999. Originally the East Coast branch of the §HCommunist Party USA (CPUSA)§!, the party was eventually banned for their affiliation with the Union of American People's Republics. After growing more distant from the mother party during the nineties, the §HCPAPC§! would eventually adopt more reformist tendencies and cut ties with Los Angeles, leading to the party being unbanned in 1999."
