 IRE_national_conservative_party:0 "Fianna Fáil"
 IRE_national_conservative_party_long:0 "Fianna Fáil - The Republican Party\n§L§HFianna Fáil - The Republican Party (FF)§! is a conservative, Christian democratic and Irish republican party. Descended from the §HAnti-Treaty IRA§! of the Irish Civil War, §HFF§! was founded in 1926 by the non-abstentionist wing of §HSinn Féin (SF)§!. The party has been in power for most of the period from 1932 until the modern day, and has played a pivotal role in building the Irish state. Despite this §HFF§!'s ideology is ambiguous and has often shifted over the decades, with the overarching thread being republicanism, Irish unification and the protection of Irish culture. "
 IRE_centrist_party:0 "Daonlathaithe"
 IRE_centrist_party_long:0 "Daonlathaithe - the National Party\n§L§HDaonlathaithe - the National Party (D)§! also known as the §HDemocrats§!, is a conservative liberal party. Founded in 1996 by independents who had left §HFianna Fáil (FF)§!, because of the introduction of the first-past-the-post electoral system, and former §HFine Gael (FG)§! activists. The party has taken an unequivocally liberal stance on economic and social issues, favoring lower taxes, privatization, welfare reform, and the liberalisation of divorce, contraception and abortion. It is the driving force behind the §HRainbow Coalition§! seeking to end §HFF§!'s dominance' in Irish politics."
 IRE_liberal_party:0 "Fine Gael"
 IRE_liberal_party_long:0 "Fine Gael\n§L§HFine Gael (FG)§! is a liberal and Christian democratic party. Descended from the pro-Treaty side of the Irish Civil War, §HFG§! was founded in 1933 through the merger of §HCumann na nGaedheal§!, the §HNational Centre Party§! and the §HNational Guard§!, the party and its predecessors held power from Irish independence in 1922 until 1932, and for short periods since then. They are considered more economically liberal and pro-British than their traditional rivals §HFianna Fáil (FF)§!, and played a pivotal role in negotiating the security treaty between Ireland and the United Kingdom."
 IRE_new_democrat_party:0 "Labour Party"
 IRE_new_democrat_party_long:0 "Labour Party\n§LThe §HLabour Party§! is a social democratic party. Founded in 1912 as the political wing of the §HIrish Trades Union Congress§!, it continues to be the political arm of the labor movement and is one of the few Irish parties that did not arise as a faction of the original §HSinn Féin (SF)§! party. Historically the party had a Christian socialist outlook, but it became increasingly secular and socially liberal from the 1980s onwards. However, their concurrent coalition with §HFine Gael (FG)§! led to the party declining in support and being surpassed by §HThe Workers' Party§! as the largest party on the left."
 IRE_moderate_socialist_party:0 "Sinn Féin"
 IRE_moderate_socialist_party_long:0 "Sinn Féin\n§L§HSinn Féin (SF)§! is an Irish republican and democratic socialist party. Founded in 1905, its members played a pivotal role in the Easter Rising and the Irish War of Independence, after which the party declined into obscurity. In the late 1940s it was taken over by members of the §HIrish Republican Army (IRA)§! and became their political arm. §HSF§!'s practice of abstentionism was challenged in the 1970s, leading to a split in the §HIRA§! and the formation of §HThe Workers' Party§!, while §HSF§! sided with the §HProvisional Irish Republican Army (PIRA)§!. Under the leadership of §HGerry Adams§! the party became increasingly reformist, ending abstentionism in the Irish Dáil and participating in the Northern Ireland peace process, eventually culminating in the Belfast Agreement."
 IRE_revolutionary_socialist_party:0 "Socialist Party"
 IRE_communist_party:0 "Workers' Party"
 IRE_communist_party_long:0 "The Workers' Party\n§L§HThe Workers' Party§! is an Irish republican and Marxist-Leninist party. It was formed in 1970 after a split within §HSinn Féin (SF)§! when the majority of the party wanted to end abstentionism and sectarianism in favor of Marxist class struggle. The split also carried over to the §HIrish Republican Army (IRA)§!, with the Marxists forming the §HOffical Irish Republican Army (OIRA)§! which quickly declared a ceasefire with the British government. Since entering the Dáil Éireann in 1982 §HThe Workers' Party§! has steadily grown to become one of the largest parties on the left, but has struggled to build ties to the more moderate labor movement."
 ULS_fascist_party:0 "Defence Association"
 ULS_fascist_party_long:0 "Ulster Defence Association\n§LThe §HUlster Defence Association (UDA)§! is an Ulster loyalist paramilitary group. It was formed in 1971 as an umbrella group for various loyalist groups and undertook an armed campaign of almost 24 years as one of the participants of the Troubles. Its declared goal was to defend Ulster Protestant loyalist areas and to combat Irish republicanism, particularly the §HProvisional Irish Republican Army (PIRA)§!. Within the §HUDA§! was a group tasked with launching paramilitary attacks that used the cover name §HUlster Freedom Fighters (UFF)§! so that the §HUDA§! would not be outlawed. The British government proscribed the §HUFF§! as a terrorist group in 1973, but the §HUDA§! itself was not proscribed until 1992."
 ULS_nationalist_party:0 "Democratic Unionists"
 ULS_nationalist_party_long:0 "Democratic Unionist Party\n§LThe §HDemocratic Unionist Party (DUP)§! is a unionist, loyalist, British nationalist and national conservative party. It was founded in 1971 during the Troubles by §HIan Paisley§!, minister and founder of the §HFree Presbyterian Church of Ulster§!. During the Troubles, the §HDUP§! opposed sharing power with Irish nationalists or republicans as a means of resolving the conflict, and likewise rejected attempts to involve the Republic of Ireland in Northern Irish affairs. Members of the party played a pivotal role in the Second Ulster Crisis, after which many members were imprisoned. After general amnesty was issued in 1989 these members were able to re-enter politics, but the party's association with the crisis has made them unable to achieve an electoral breakthrough."
 ULS_monarchist_party:0 "House of Windsor"
 ULS_national_bolshevik_party:0 "Progressive Unionists"
 ULS_national_bolshevik_party_long:0 "Progressive Unionist Party"
 ULS_national_conservative_party:0 "Ulster Unionists"
 ULS_national_conservative_party_long:0 "Ulster Unionist Party\n§LThe §HUlster Unionist Party (UUP)§! is a unionist political party. Founded in 1905 as the §HUlster Unionist Council (UUC)§!, it is the oldest political party on the island of Ireland. Following the partition of Ireland, it was the governing party of Northern Ireland between 1921 and 1972. Between 1905 and 1972, its MPs took the §HConservative Party§! whip at Westminster, in effect functioning as the Northern Irish branch of the party. This arrangement came to an end in 1972 due to disagreements in relation to the Sunningdale Agreement."
 ULS_centrist_party:0 "Belfast Coalition"
 ULS_liberal_party:0 "Alliance Party"
 ULS_liberal_party_long:0 "Alliance Party of Northern Ireland\n§LThe §HAlliance Party of Northern Ireland (APNI)§!, also known as the §HAlliance§!, is a liberal and non-sectarian party. Founded in 1970 from the §HNew Ulster Movement (NUM)§!, §HAPNI§! originally represented moderate and non-sectarian unionism. However, over time, particularly in the 1990s, it moved towards neutrality on the Union, and came to represent wider liberal and non-sectarian concerns. It supports the Belfast Agreement but maintains a desire for the reform of the political system towards a non-sectarian future."
 ULS_new_democrat_party:0 "Social Democratic Labour"
 ULS_new_democrat_party_long:0 "Social Democratic and Labour Party\n§LThe §HSocial Democratic and Labour Party (SDLP)§! is a social democratic and Irish nationalist political party. Founded in 1972 during the Troubles by independents and members of the §HRepublican Labour Party (RLP)§!, the §HNationalist Party§! and the §HNorthern Ireland Labour Party (NILP)§!, a significant difference between the §HSDLP§! and §HSinn Féin (SF)§! was the former's rejection of violence, in contrast to §HSF§!'s' then-support for the §HProvisional Irish Republican Army (PIRA)§! and physical force republicanism."
 ULS_moderate_socialist_party:0 "Sinn Féin"
 ULS_moderate_socialist_party_long:0 "Sinn Féin\n§L§HSinn Féin (SF)§! is an Irish republican and democratic socialist party. Founded in 1905, its members played a pivotal role in the Easter Rising and the Irish War of Independence, after which the party declined into obscurity. In the late 1940s it was taken over by members of the §HIrish Republican Army (IRA)§! and became their political arm. §HSF§!'s practice of abstentionism was challenged in the 1970s, leading to a split in the §HIRA§! and the formation of §HThe Workers' Party§!, while §HSF§! sided with the §HProvisional Irish Republican Army (PIRA)§!. Under the leadership of §HGerry Adams§! the party became increasingly reformist, ending abstentionism in the Irish Dáil and participating in the Northern Ireland peace process, eventually culminating in the Belfast Agreement."
