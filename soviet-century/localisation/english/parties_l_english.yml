 POL_communist_party:0 "United Workers' Party"
 POL_communist_party_long:0 "Polish United Workers' Party\n§LThe §HPolish United Workers' Party (PZPR)§! is a Marxist-Leninist and left-wing nationalist party. Formed in 1948 through the merger of the §HPolish Workers' Party (PPR)§! and the §HPolish Socialist Party (PPS)§!. It has been the leading party in the §HPatriotic Movement for National Rebirth§!, a popular front which organizes communist and pro-government organizations, since its creation in 1994."
