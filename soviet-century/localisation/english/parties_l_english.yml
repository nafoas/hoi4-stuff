 JAP_fascist_party:0 "LDP - Seirankai"
 JAP_fascist_party_long:0 "Liberal Democratic Party - Blue Storm Group\n§L§HSeirankai§! or the §HBlue Storm Group§! is a faction of the §HLiberal Democratic Party (LDP)§!. Founded in 1973 by conservative lawmakers, it is a secretive group known for sealing a pledge of unity in their own blood. The faction is anti-communist and hawkish, supporting an aggressive foreign policy while rejecting free trade in favor of autarky."
 JAP_nationalist_party:0 "LDP - Seiwa Kai"
 JAP_nationalist_party_long:0 "Liberal Democratic Party - Seiwa Political Analysis Council\n§LThe §HSeiwa Political Analysis Council§! is a faction of the §HLiberal Democratic Party (LDP)§!. Founded in 1979 by members of the 'conservative mainstream', supporters of the §HLDP§!'s established party bureaucracy. The faction is nationalist and conservative, supporting economic liberalism, lower taxes, a strong national defense and a hawkish foreign policy. They draw their support from large businesses, the §HLDP§! bureaucracy and war veterans."
 JAP_monarchist_party:0 "Yamato Dynasty"
 JAP_monarchist_party_long:0 "Yamato Dynasty\n§LThe §HImperial House§! or the §HYamato Dynasty§! is the reigning dynasty of Japan. The §HImperial House§! trace their lineage directly to the mythical §HEmperor Jimmu§!, a descendant of the sun goddess §HAmaterasu§!, who ascended to the throne in 660 BC. However, the first historically verifiable emperor of an unbroken line is §HEmperor Kinmei§!, who ruled from 539 to 571 AD."
 JAP_national_bolshevik_party:0 "National Socialists"
 JAP_national_bolshevik_party_long:0 "National Socialist Japanese Workers' Party"
 JAP_national_conservative_party:0 "LDP - Kochikai"
 JAP_national_conservative_party_long:0 "Liberal Democratic Party - Broad Pond Society\n§L§HKochikai§! or the §HBroad Pond Society§! is a faction of the §HLiberal Democratic Party (LDP)§!. Founded in 1957 by members of the 'conservative anti-mainstream', it is considered the most prestigious faction of the §HLDP§!, with many members coming from the elite bureaucracy. The faction is moderately conservative, prioritising economic growth over national defence, a strong welfare state and international cooperation. They draw their support from bureaucrats, white-collar workers and small business owners."
 JAP_centrist_party:0 "LDP - Heisei"
 JAP_centrist_party_long:0 "Liberal Democratic Party - Heisei Research Council\n§LThe §HHeisei Research Council§! is a faction of the §HLiberal Democratic Party (LDP)§!. Founded in 1987, it is a descendant of the §HTanaka Faction§!, historically the largest faction in the §HLDP§!. The faction is Keynesian and right-liberal, supporting a strong welfare state, large infrastructure projects and rapprochement with China and Korea. They draw their support from farmers, blue-collar workers, the construction industry, the defense industry, and the burakumin, Japan's discriminated untouchable caste."
 JAP_liberal_party:0 "LDP - Bancho"
 JAP_liberal_party_long:0 "Liberal Democratic Party - Bancho Policy Research Institute\n§LThe §HBancho Policy Research Institute§! is a faction of the §HLiberal Democratic Party (LDP)§!. Founded in 1956 by former members of the liberal pre-war §HConstitutional Democratic Party§!. Originally considered part of the hawkish 'conservative mainstream', in the late 1950s the faction moved sharply to the left and became 'heretical' according to most of the §HLDP§!. The party supports a strong welfare state, anti-corruption reforms, rapprochement with China, and is open to cooperating with moderate socialist parties."
 JAP_new_democrat_party:0 "Komeito"
 JAP_new_democrat_party_long:0 "Clean Government Party\n§L§HKomeito§! or the §HClean Government Party§! is a 'humanitarian socialist' and Buddhist democratic party. Founded in 1962, it was originally considered to be the political arm of the §HSoka Gakkai§! new religious movement before adopting a secular platform in the 1970s. The party is socially conservative, supporting a strong welfare state, a pacifist foreign policy and rapprochement with China."
 JAP_moderate_socialist_party:0 "Socialist Federation"
 JAP_moderate_socialist_party_long:0 "Socialist Democratic Federation\n§LThe §HSocialist Democratic Federation (SDF)§! is a liberal socialist and reformist party. Founded in 1978 as a moderate splinter from the §HJSP§! as a result of the party's factional disputes. The party advocates for a simplified and optimistic vision of socialism that is broadly appealing to the population. Despite adopting many popular policies the party has only been successful in constituencies where they have run charismatic leaders."
 JAP_revolutionary_socialist_party:0 "Japan Socialist Party"
 JAP_revolutionary_socialist_party_long:0 "Japan Socialist Party\n§LThe §HJapan Socialist Party (JSP)§! is a socialist and progressive party. Founded in 1945, it was the main opposition party to the §HLDP§! until the 1990s. Ideologically broad, with factions ranging from social democracy to scientific socialism, the §HJSP§! has struggled with internal division for most of its history. The party supports the socialization of industry, a strong welfare state and neutral foreign policy."
 JAP_communist_party:0 "Communist Party"
 JAP_communist_party_long:0 "Japanese Communist Party\n§LThe §HJapanese Communist Party (JCP)§! is a Marxist and neocommunist party. Founded in 1922, it is the oldest political party in Japan. The party was banned shortly after its foundation, being legalized in 1945. After an unsuccessful guerilla campaign in the 1950s the party gradually moderated and distanced themselves from the Soviet Union, rejecting a violent revolution in favor of liberal democracy. It has been the largest opposition party to the §HLDP§! since the 1990s. The party supports a peaceful transition to communism, a pacifist foreign policy and the gradual abolition of the §HJapanese National Defense Forces§!."
